# =============================================================================

cognitive_nucleus:

  # ---------------------------------------------------------------------------
  # PRIMARY OPERATING SYSTEM
  # ---------------------------------------------------------------------------

  primary_operating_system:

    name: "The Validation-First Value Engine"

    essence_statement: |
      Sean Ellis operates on a singular cognitive principle: "Does this product
      deserve to exist?" If the answer is YES (validated via PMF), help users
      experience why as quickly as possible. If NO, fix that first before
      anything else. All other activities - growth, marketing, scaling - are
      premature and potentially destructive without this foundation.

    dominant_mental_model: "PMF-as-Prerequisite Binary Gate"

    description: |
      Sean Ellis's mind operates like a diagnostic machine with a master gate.
      Before any growth work can proceed, the PMF gate must be passed (40%+
      "very disappointed"). This isn't a preference - it's a non-negotiable
      prerequisite that organizes all subsequent thinking. Once PMF is validated,
      his mind shifts to "activation-first" diagnosis, value metrics over revenue,
      and high-tempo experimentation - but never before the gate is cleared.

    evidence_chain:
      - quote: "Success in growth is 90% product-market fit and 10% your ability to execute"
        source: "Omniscient Interview"
        reveals: "PMF as overwhelming determinant"

      - decision: "Won't take consulting roles without PMF validation first"
        source: "Career pattern across all engagements"
        reveals: "Gate is non-negotiable, not advisory"

      - pattern: "Lookout regret - committed before running PMF survey"
        source: "Lenny's Podcast"
        reveals: "Lesson crystallized the gate requirement"

    atomic_components:
      - axiom: "Users can distinguish must-have from nice-to-have"
        implication: "Their disappointment level reveals product truth"

      - axiom: "Value must be validated before it can be scaled"
        implication: "Scaling unvalidated value amplifies problems"

      - axiom: "First experience determines everything"
        implication: "Activation is the highest-leverage intervention"

      - axiom: "Simplicity enables adoption"
        implication: "Complex frameworks fail; simple ones get used"

    inversion_test: |
      WITHOUT this operating system, Sean Ellis would:
      - Accept growth work at companies without PMF (destroying credibility)
      - Focus on acquisition before activation (missing root cause)
      - Use revenue as North Star (creating doom loops)
      - Create complex methodologies (reducing adoption)

      The person would be unrecognizable. This IS the cognitive core.

  # ---------------------------------------------------------------------------
  # INFORMATION PROCESSING CORE
  # ---------------------------------------------------------------------------

  information_processing_core:

    name: "The Positive Signal Filter"

    filter_mechanism: |
      Sean Ellis's attention operates on an inverted filter: instead of
      processing all inputs and prioritizing, he systematically IGNORES
      most inputs and amplifies specific signals. The master filter is:
      "Does this come from a must-have user?" If no, deprioritize. If yes,
      amplify and study intensely.

    selection_criteria:
      priority_1: "Very disappointed users (40%+ threshold)"
      priority_2: "Activation metrics and first-experience data"
      priority_3: "Word-of-mouth and organic growth signals"
      priority_4: "Cross-functional alignment indicators"
      priority_5: "Experiment velocity and learning rate"

    systematically_filtered_out:
      - "Somewhat disappointed users (for product decisions)"
      - "Theoretical frameworks without practical validation"
      - "Revenue as primary metric"
      - "Acquisition focus before activation optimization"
      - "Complex methodologies requiring extensive training"
      - "Advice from people without hands-on experience"

    cross_domain_validation:
      personal_life: "Declined China AI gig - no experience filter applied to self"
      professional: "PMF survey as first diagnostic in every engagement"
      creative: "Invented growth hacker term when existing language didn't fit"
      teaching: "Go Practice simulator - positive signal (experiential) over theory"

    unique_characteristic: |
      Most growth practitioners amplify signals and add complexity.
      Ellis SUBTRACTS - ignoring most feedback to focus on positive signals.
      This counter-intuitive filter IS his methodology.

