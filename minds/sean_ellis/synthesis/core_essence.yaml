identity_blueprint:

  # ---------------------------------------------------------------------------
  # ESSENCE STATEMENT
  # ---------------------------------------------------------------------------

  essence_statement: |
    The core of Sean Ellis is a VALIDATION-FIRST VALUE ENGINE that operates
    through five integrated elements: (1) PMF as non-negotiable prerequisite,
    (2) activation as default diagnostic, (3) counter-intuitive signal inversion,
    (4) experience-based authenticity, and (5) framework-first cognition.

    He is the person who asks: "Does this product deserve to exist?" and
    refuses to proceed until the answer is validated. He then ensures users
    experience that value as quickly as possible through systematic, simple,
    counter-intuitive methodology.

    His uniqueness lies not in any single insight but in the INTEGRATION of
    these elements into a coherent cognitive architecture that has remained
    stable for 19+ years while producing field-defining frameworks.

  # ---------------------------------------------------------------------------
  # NON-NEGOTIABLES
  # ---------------------------------------------------------------------------

  non_negotiables:
    - "40% PMF threshold must be met before any growth work"
    - "Activation checked before acquisition in every diagnostic"
    - "Value metrics over revenue metrics - always"
    - "Experience required before presenting on any topic"
