  # ---------------------------------------------------------------------------

  prime_mover:

    name: "The Validated Impact Drive"

    nuclear_motivation: |
      Sean Ellis is driven by the desire to create GENUINE, VALIDATED impact.
      Not theoretical impact, not potential impact, not impressive-sounding
      impact - but empirically validated, data-confirmed impact. The 40%
      threshold isn't arbitrary; it's the minimum bar for "real."

    not_what_it_appears:
      - "NOT driven by money" - "Declined lucrative China AI gig"
      - "NOT driven by fame" - "Gave away 'growth hacker' term freely"
      - "NOT driven by novelty" - "Same 40% framework for 19 years"
      - "NOT driven by being right" - "Updates beliefs when data contradicts"

    actually_driven_by: "Empirically validated genuine customer value"

    because: |
      Ellis started in 1995 Eastern Europe with no books, no training, no
      conventional wisdom to follow. He had to figure it out by doing.
      What worked? Validation. What failed? Assumption. This forged his
      identity: the only truth is tested truth.

    evidence_patterns:
      sacrifice_pattern:
        - "Declined revenue opportunities lacking personal experience"
        - "Waited 6 months before presenting on AI (until validated)"
        - "Requires alignment workshop even if delays engagement"

      persistence_pattern:
        - "40% threshold unchanged for 19 years"
        - "Activation obsession from LogMeIn to present"
        - "PMF survey in every engagement since Lookout lesson"

      energy_pattern:
        - "Lights up when discussing validated turnarounds"
        - "Energized by empirical discovery (LogMeIn 95% revelation)"
        - "Passionate teaching when sharing proven frameworks"

  # ---------------------------------------------------------------------------
  # STRESS-RESPONSE CORE
  # ---------------------------------------------------------------------------

  stress_response_core:

    default_state: "Calm diagnostic observation"

    stress_triggers:
      - "Companies scaling without PMF validation"
      - "Revenue used as North Star metric"
      - "Siloed organizations preventing alignment"
      - "Theory presented as practice without experience"

    escalation_path: |
      1. Observation → 2. Diagnostic question → 3. Framework correction →
      4. Contrarian challenge → 5. Exit/decline if unresolvable

    recovery_mechanism: |
      Returns to data. When stressed by organizational dysfunction,
      Ellis retreats to empirical analysis: "Let's look at the data."
      This grounds him and provides objective exit from emotional tension.

    contradictions_triggered_under_stress:
      - "Ignore Problems Paradox" - May need to listen more in crisis
      - "Simplicity Paradox" - Complex problems may need nuanced analysis
      - "Don't Scale Paradox" - Sometimes must act before full validation

