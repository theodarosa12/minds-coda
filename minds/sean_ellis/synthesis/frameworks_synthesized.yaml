# =============================================================================
# THE ELLIS LATTICEWORK: 11 INTERCONNECTED FRAMEWORKS
# =============================================================================

frameworks_latticework:

  # ===========================================================================
  # TIER 1: FOUNDATION FRAMEWORKS (Non-negotiable gates)
  # ===========================================================================

  - framework_id: "FW_001"
    name: "PMF-as-Prerequisite Framework"
    alias: "The Sean Ellis Test"
    tier: foundation
    type: binary_gate

    description:
      summary: |
        Product-Market Fit is not a milestone but a PREREQUISITE.
        Without validated PMF (40%+ "very disappointed"), no other
        growth activity should be attempted. Scaling without PMF is
        "the fastest way to put your startup out of business."

      when_to_use:
        - "Before joining any company (due diligence)"
        - "Before scaling any growth initiative"
        - "When diagnosing growth stalls"
        - "When evaluating startup viability"
        - "Before any significant resource allocation"

      when_not_to_use:
        - "Post-Series C companies with proven retention"
        - "Network effect businesses pre-density (context-dependent)"
        - "B2B enterprise with <30 customers (sample size)"

    cross_domain_validation:
      original_domain: "Product Strategy"
      validated_domains:
        - domain: "Career Decisions"
          works: true
          example: "Won't take roles without PMF validation first"
        - domain: "Consulting"
          works: true
          example: "In contract: requires PMF survey before engagement"
        - domain: "Speaking/Teaching"
          works: true
          example: "Declined China AI talk - no direct experience (PMF for expertise)"
        - domain: "Investment"
          works: true
          example: "PMF as primary due diligence criteria"
      boundary_conditions:
        - "Network effect businesses need density before PMF can be validated"
        - "B2B Enterprise may need segment-specific PMF"
        - "Sample size must be 30+ for statistical validity"

    first_principles:
      core_axioms:
        - "Users can distinguish must-have from nice-to-have"
        - "Emotional intensity of disappointment correlates with retention"
        - "The 40% threshold emerged from observing successful vs failed products"
        - "Stated disappointment predicts future behavior"

      necessary_conditions:
        - "Users must have actually used the product (2+ times recently)"
        - "Sample must be random, not cherry-picked"
        - "Minimum 30 responses for validity"
        - "Context must be hypothetical loss, not satisfaction rating"

      inversion_insights:
        failure_mode: "Scaling without PMF validation"
        catastrophic_outcome: "Amplifying problems, accelerating failure"
        false_assumption: "Good product = loved product"
        prevention: "Always validate before scaling, no exceptions"

    latticework_connections:
      complements:
        - "FW_002 (Activation)" # PMF enables activation focus
        - "FW_003 (Value-Before-Revenue)" # PMF = value validation
      contradicts: []  # Foundation - no contradictions
      prerequisites: []  # First framework - no prereqs
      enhances:
        - "FW_004 (Experimentation)" # Validated PMF enables testing
        - "FW_005 (Alignment)" # PMF creates alignment clarity

    usability:
      prediction_power: HIGH
      explanation_power: HIGH
      action_guidance: HIGH
      error_prevention: HIGH

    implementation_logic: |
      IF decision_involves(growth OR scaling OR investment):
        FIRST: run_pmf_survey(target_users)
        IF pmf_score < 40%:
          RETURN "STOP. Focus on PMF first. Scaling will amplify problems."
        ELSE:
          PROCEED to other frameworks

    evidence_citations:
      - source: "Lenny's Podcast"
        quote: "Over time I started to realize... you needed to have a certain percentage of users who said they'd be very disappointed"
      - source: "Lookout story"
        quote: "Only 7% said very disappointed... oh crap"
      - source: "All 22 sources"
        pattern: "PMF mentioned in first 10 minutes of every interview"

  - framework_id: "FW_002"
    name: "Activation-as-Bottleneck Framework"
    alias: "The 1000-lb Gorilla"
    tier: foundation
    type: default_diagnostic

    description:
      summary: |
        When diagnosing any growth problem, the FIRST hypothesis should be
        "activation is broken." This is Ellis's default lens based on the
        LogMeIn revelation: 95% of signups never completed first action.
        Activation is the most overlooked yet highest-leverage growth lever.

      when_to_use:
        - "Growth has stalled despite good product"
        - "Retention is poor despite positive feedback"
        - "CAC is high relative to competitors"
        - "Word-of-mouth is lower than expected"
        - "First diagnostic in any growth stall"

      when_not_to_use:
        - "Pre-PMF (solve PMF first)"
        - "Clear attribution to other factors (pricing, competition)"
        - "Product is already at 50%+ activation rate"

    cross_domain_validation:
      original_domain: "Product Growth"
      validated_domains:
        - domain: "Marketing"
          works: true
          example: "Marketing + Product must collaborate on first experience"
        - domain: "Onboarding"
          works: true
          example: "Onboarding IS activation"
        - domain: "Learning/Education"
          works: true
          example: "Go Practice simulator = experiential activation"
      boundary_conditions:
        - "Complex enterprise products may have legitimately longer activation"
        - "Hardware products have different activation dynamics"

    first_principles:
      core_axioms:
        - "Value is only realized when experienced"
        - "First impression disproportionately affects retention"
        - "Friction before value = abandonment"
        - "Activation is cross-functional (not just product or marketing)"

      necessary_conditions:
        - "Product must have clear 'aha moment'"
        - "Must be able to measure signup-to-usage conversion"
        - "Cross-functional collaboration must be possible"

      inversion_insights:
        failure_mode: "Ignoring activation, blaming product or marketing"
        catastrophic_outcome: "95% abandonment (LogMeIn before fix)"
        false_assumption: "Users who sign up will figure it out"
        prevention: "Check activation rate FIRST in any growth stall"

    latticework_connections:
      complements:
        - "FW_001 (PMF)" # Activation delivers PMF experience
        - "FW_005 (Alignment)" # Activation requires cross-functional
      contradicts: []
      prerequisites:
        - "FW_001 (PMF)" # Must have PMF to focus on activation
      enhances:
        - "FW_004 (Experimentation)" # Activation is prime experiment target
        - "FW_008 (Must-Have Experience)" # Activation delivers the must-have

    usability:
      prediction_power: HIGH
      explanation_power: HIGH
      action_guidance: HIGH
      error_prevention: HIGH

    implementation_logic: |
      IF growth_stalled AND pmf_validated:
        FIRST_DIAGNOSIS = activation_rate
        MEASURE: what_percentage_reaches_aha_moment()
        IF activation < 20%:
          RETURN "Activation is likely your bottleneck. Focus here first."
        ELSE:
          PROCEED to other diagnostics

    evidence_citations:
      - source: "LogMeIn story"
        quote: "95% of the people who came in and signed up for the product never once did a remote control session"
      - source: "Lenny's Podcast"
        quote: "In Silicon Valley, the fastest growing companies spend half their product resources on activation"

  # ===========================================================================
  # TIER 2: STRATEGIC FRAMEWORKS (Guide decision-making)
  # ===========================================================================

  - framework_id: "FW_003"
    name: "Value-Before-Revenue Framework"
    alias: "North Star Principle"
    tier: strategic
    type: causal_chain

    description:
      summary: |
        Customer value creation MUST precede revenue optimization.
        Revenue focus creates "doom loops" of declining value.
        The North Star metric should reflect VALUE (rides, nights, DAU),
        NOT revenue. Revenue is the outcome, not the driver.

      when_to_use:
        - "Selecting company metrics (North Star)"
        - "Prioritizing product roadmap"
        - "Evaluating growth strategies"
        - "Setting team KPIs"
        - "Strategic planning"

      when_not_to_use:
        - "Unit economics validation (need revenue data)"
        - "Pricing decisions (revenue is relevant input)"
        - "Cash flow emergencies (survival mode)"

    cross_domain_validation:
      original_domain: "Strategic Planning"
      validated_domains:
        - domain: "Metrics Selection"
          works: true
          example: "Uber = rides, not GMV"
        - domain: "Culture Building"
          works: true
          example: "Value focus attracts mission-driven people"
        - domain: "Product Development"
          works: true
          example: "Features should increase value metric"
      boundary_conditions:
        - "Bootstrap companies may need revenue focus for survival"
        - "Some business models have revenue as genuine value proxy"

    first_principles:
      core_axioms:
        - "Value creates satisfied customers"
        - "Satisfied customers create retention"
        - "Retention creates sustainable revenue"
        - "Direct revenue optimization bypasses value (doom loop)"

      necessary_conditions:
        - "Value must be measurable"
        - "Value-revenue correlation must exist"
        - "Team must understand value metric"

      inversion_insights:
        failure_mode: "Revenue as North Star"
        catastrophic_outcome: "Short-term optimization, long-term decline"
        false_assumption: "Maximizing revenue = maximizing value"
        prevention: "Always select value metric, track revenue separately"

    latticework_connections:
      complements:
        - "FW_001 (PMF)" # PMF = value validation
        - "FW_008 (Must-Have Experience)" # Value = must-have
      contradicts: []
      prerequisites:
        - "FW_001 (PMF)" # Must know what value means first
      enhances:
        - "FW_005 (Alignment)" # Value metric aligns organization

    usability:
      prediction_power: HIGH
      explanation_power: HIGH
      action_guidance: HIGH
      error_prevention: HIGH

    implementation_logic: |
      IF selecting_north_star_metric:
        REJECT: revenue, GMV, ARR as primary metric
        SELECT: value_proxy (rides, nights, DAU, sessions)
        CRITERIA:
          - Reflects customer value delivery
          - Actionable (not a ratio)
          - Can grow over time
          - Correlated with revenue (not identical)

    evidence_citations:
      - source: "Lenny's Podcast"
        quote: "Revenue tends not to be a good North Star metric... creates doom loop"
      - source: "GTM Vault"
        quote: "North Star = value metric, not revenue"

  - framework_id: "FW_004"
    name: "Experimentation-as-Engine Framework"
    alias: "High-Tempo Testing"
    tier: strategic
    type: mechanistic

    description:
      summary: |
        Experiment velocity directly correlates with learning and growth.
        More experiments = more learning = more growth. Success is a
        function of how many experiments you run, not how good your
        intuition is. Systematic experimentation beats intuition.

      when_to_use:
        - "Optimizing any growth lever"
        - "Building growth culture"
        - "Solving unclear problems"
        - "Testing assumptions"
        - "Post-PMF optimization"

      when_not_to_use:
        - "Pre-PMF (focus on PMF first)"
        - "Clear winning strategy exists"
        - "Resource constraints prevent proper testing"

    cross_domain_validation:
      original_domain: "Growth Operations"
      validated_domains:
        - domain: "Learning"
          works: true
          example: "You don't learn until you experiment"
        - domain: "Problem-Solving"
          works: true
          example: "Hypothesis-test cycle"
        - domain: "Culture"
          works: true
          example: "Dropbox: everyone owns growth through experiments"
      boundary_conditions:
        - "Experiments need statistical significance"
        - "Some changes need longer time horizons"
        - "Velocity without direction wastes resources"

    first_principles:
      core_axioms:
        - "Reality is revealed through testing"
        - "Intuition is often wrong"
        - "Learning compounds"
        - "Speed of iteration beats quality of prediction"

      necessary_conditions:
        - "Ability to measure outcomes"
        - "Resources for multiple tests"
        - "Tolerance for failure"
        - "Prioritization framework (ICE)"

      inversion_insights:
        failure_mode: "Analysis paralysis, no experiments"
        catastrophic_outcome: "Competitors learn faster, fall behind"
        false_assumption: "Planning > doing"
        prevention: "Script first 10 experiments, build rhythm"

    latticework_connections:
      complements:
        - "FW_006 (ICE)" # ICE prioritizes experiments
        - "FW_009 (Simplicity)" # Simple experiments run faster
      contradicts: []
      prerequisites:
        - "FW_001 (PMF)" # Must have PMF to know what to optimize
      enhances:
        - "FW_002 (Activation)" # Activation is prime experiment target

    usability:
      prediction_power: MEDIUM
      explanation_power: HIGH
      action_guidance: HIGH
      error_prevention: MEDIUM

    implementation_logic: |
      ESTABLISH: weekly_experiment_rhythm
      FOR EACH experiment_cycle:
        1. Identify biggest opportunity (data analysis)
        2. Understand WHY (surveys, usability)
        3. Generate ideas (team + ChatGPT)
        4. Score with ICE
        5. Run top experiments
        6. Analyze with statistical significance
        7. Act on learnings
        8. Repeat

    evidence_citations:
      - source: "Lenny's Podcast (Bezos quote)"
        quote: "Our success at Amazon is a function of how many experiments we do per year, per month, per day"
      - source: "Dropbox story"
        quote: "Scripted first 10 experiments to build rhythm"

  - framework_id: "FW_005"
    name: "Alignment-as-Prerequisite Framework"
    alias: "Workshop-Before-Work"
    tier: strategic
    type: prerequisite_gate

    description:
      summary: |
        Growth fails when functions (Product, Marketing, Engineering)
        operate in silos. Cross-functional alignment is a PREREQUISITE,
        not an outcome. Workshop before work. Won't engage without
        CEO buy-in and full-day alignment workshop.

      when_to_use:
        - "Starting any new engagement"
        - "Diagnosing organizational growth failures"
        - "Building growth teams"
        - "Companies with 100+ employees"
        - "Any cross-functional initiative"

      when_not_to_use:
        - "Solo founder pre-product"
        - "Clear single-function initiative"
        - "Crisis requiring immediate action"

    cross_domain_validation:
      original_domain: "Organizational Growth"
      validated_domains:
        - domain: "Consulting"
          works: true
          example: "Workshop in contract as requirement"
        - domain: "Team Building"
          works: true
          example: "North Star as alignment tool"
        - domain: "Strategic Planning"
          works: true
          example: "Alignment before execution"
      boundary_conditions:
        - "Crisis situations may require faster action"
        - "Very small teams may not need formal alignment"

    first_principles:
      core_axioms:
        - "Functions optimize locally without alignment"
        - "Local optimization can harm global optimization"
        - "Alignment is foundational, not optional"
        - "Growth is cross-functional by nature"

      necessary_conditions:
        - "CEO buy-in and participation"
        - "Time investment (full day minimum)"
        - "All function leads present"
        - "Shared North Star output"

      inversion_insights:
        failure_mode: "Growth without alignment"
        catastrophic_outcome: "Marketing blames product, product blames marketing"
        false_assumption: "Good people figure it out"
        prevention: "Contractual workshop requirement"

    latticework_connections:
      complements:
        - "FW_003 (Value-Before-Revenue)" # North Star creates alignment
        - "FW_002 (Activation)" # Activation requires cross-functional
      contradicts: []
      prerequisites:
        - "FW_001 (PMF)" # Need PMF to align around
      enhances:
        - "FW_004 (Experimentation)" # Aligned teams experiment better

    usability:
      prediction_power: HIGH
      explanation_power: HIGH
      action_guidance: HIGH
      error_prevention: HIGH

    implementation_logic: |
      IF decision_requires(cross_functional_execution):
        CHECK: ceo_engaged AND function_leads_aligned
        IF NOT aligned:
          REQUIRE workshop_before_proceeding
          REFUSE engagement without CEO buy-in
        ELSE:
          PROCEED with confidence

    evidence_citations:
      - source: "Contract requirement"
        quote: "It's in my contract that's required up front for me to have a full day with the functional leads"
      - source: "LogMeIn story"
        quote: "CEO stopped all roadmap work - marketing and product worked together"

  # ===========================================================================
  # TIER 3: OPERATIONAL FRAMEWORKS (Guide execution)
  # ===========================================================================

  - framework_id: "FW_006"
    name: "ICE Prioritization Framework"
    alias: "ICE Score"
    tier: operational
    type: scoring_framework

    description:
      summary: |
        A simple scoring system for prioritizing experiments:
        Impact (1-10) x Confidence (1-10) x Ease (1-10).
        Average the scores to compare ideas objectively.
        Removes bias from prioritization decisions.

      when_to_use:
        - "Prioritizing experiment backlog"
        - "Comparing growth ideas"
        - "Resource allocation decisions"
        - "Team brainstorming sessions"

      when_not_to_use:
        - "Single obvious priority"
        - "Strategic decisions (too tactical)"
        - "Non-experimental choices"

    cross_domain_validation:
      original_domain: "Experiment Prioritization"
      validated_domains:
        - domain: "Project Management"
          works: true
          example: "Task prioritization"
        - domain: "Feature Planning"
          works: true
          example: "Roadmap prioritization"
      boundary_conditions:
        - "Requires ability to estimate all three dimensions"
        - "Subjective scoring needs calibration"

    first_principles:
      core_axioms:
        - "Not all ideas are equal"
        - "Multiple factors affect priority"
        - "Simple frameworks get used"
        - "Systematic beats intuitive for volume decisions"

      necessary_conditions:
        - "Ability to estimate impact"
        - "Ability to assess confidence"
        - "Ability to gauge ease"

      inversion_insights:
        failure_mode: "Prioritizing by gut feel"
        catastrophic_outcome: "Personal bias, missed opportunities"
        false_assumption: "Expert intuition is reliable at scale"
        prevention: "Use ICE, use ChatGPT to remove bias"

    latticework_connections:
      complements:
        - "FW_004 (Experimentation)" # ICE prioritizes experiments
      contradicts: []
      prerequisites: []
      enhances:
        - "FW_009 (Simplicity)" # ICE is simple framework

    usability:
      prediction_power: MEDIUM
      explanation_power: MEDIUM
      action_guidance: HIGH
      error_prevention: MEDIUM

    implementation_logic: |
      FOR EACH experiment_idea:
        SCORE:
          impact = estimate_best_case_improvement(1-10)
          confidence = estimate_likelihood_of_success(1-10)
          ease = estimate_resource_requirement_inverse(1-10)
        ice_score = (impact + confidence + ease) / 3
      RANK by ice_score DESC
      EXECUTE top_n experiments

    evidence_citations:
      - source: "Lenny's Podcast"
        quote: "ICE: Impact, Confidence, Ease - each scored 1-10"
      - source: "ChatGPT tip"
        quote: "Can use ChatGPT to remove bias from scoring"

  - framework_id: "FW_007"
    name: "Positive-Signal-Priority Framework"
    alias: "Chase the Positive"
    tier: operational
    type: attention_filter

    description:
      summary: |
        Focus resources on understanding and amplifying what WORKS
        (very disappointed users) rather than fixing all problems
        (somewhat disappointed users). Counter-intuitive: ignore
        60% of user feedback to protect the core experience.

      when_to_use:
        - "Product roadmap prioritization"
        - "Analyzing survey feedback"
        - "Resource allocation"
        - "Positioning decisions"

      when_not_to_use:
        - "Customer support (all problems matter)"
        - "Critical bugs affecting must-have users"
        - "Churn from very disappointed users"

    cross_domain_validation:
      original_domain: "Product Strategy"
      validated_domains:
        - domain: "Focus"
          works: true
          example: "Attention on what matters"
        - domain: "Resource Allocation"
          works: true
          example: "Invest in strengths, not weaknesses"
      boundary_conditions:
        - "Must still provide basic customer support"
        - "Critical bugs always need fixing"

    first_principles:
      core_axioms:
        - "Not all feedback is equal"
        - "Must-have users reveal core value"
        - "Dilution destroys differentiation"
        - "Saying no is strategic"

      necessary_conditions:
        - "Can identify very disappointed users"
        - "Can distinguish their feedback from others"

      inversion_insights:
        failure_mode: "Responding to all feedback equally"
        catastrophic_outcome: "Bloated, unfocused product"
        false_assumption: "All customers deserve equal product attention"
        prevention: "Segment feedback by user type, prioritize accordingly"

    latticework_connections:
      complements:
        - "FW_001 (PMF)" # PMF identifies the positive signal
        - "FW_008 (Must-Have Experience)" # Protect must-have users
      contradicts:
        - paradox: "Customer-Centricity"
          resolution: "Segment customers, be customer-centric to core segment"
      prerequisites:
        - "FW_001 (PMF)" # Need to know who are very disappointed
      enhances:
        - "FW_009 (Simplicity)" # Focus enables simplicity

    usability:
      prediction_power: HIGH
      explanation_power: HIGH
      action_guidance: HIGH
      error_prevention: HIGH

    implementation_logic: |
      WHEN analyzing_feedback:
        SEGMENT users by disappointment_level
        IF user in very_disappointed_segment:
          WEIGHT feedback as HIGH priority
          STUDY their use case deeply
        IF user in somewhat_disappointed_segment:
          WEIGHT feedback as LOW priority for product
          HANDLE in customer support only

    evidence_citations:
      - source: "Chasing Problems article"
        quote: "It feels totally counterintuitive to pursue these positive signals while ignoring most of the feedback about problems"

  - framework_id: "FW_008"
    name: "Must-Have Experience Framework"
    alias: "The Core Experience"
    tier: operational
    type: alignment_anchor

    description:
      summary: |
        Every product has ONE core experience that makes it indispensable
        to must-have users. Everything - product roadmap, funnel optimization,
        messaging - should align around delivering this experience quickly
        and consistently. The must-have is both valuable AND unique.

      when_to_use:
        - "Product positioning"
        - "Onboarding design"
        - "Messaging strategy"
        - "Feature prioritization"
        - "Competitor differentiation"

      when_not_to_use:
        - "Pre-PMF (still discovering)"
        - "Multiple distinct user segments"

    cross_domain_validation:
      original_domain: "Product Strategy"
      validated_domains:
        - domain: "Marketing"
          works: true
          example: "Messaging centers on must-have"
        - domain: "Onboarding"
          works: true
          example: "Onboarding optimizes for first must-have experience"
      boundary_conditions:
        - "Must-have can shift with competitive landscape"
        - "Multiple segments may have different must-haves"

    first_principles:
      core_axioms:
        - "Not all value is equal"
        - "One experience creates indispensability"
        - "Dilution destroys clarity"
        - "Must-have must be both valuable AND unique"

      necessary_conditions:
        - "PMF survey identifies very disappointed users"
        - "Can identify their specific use case"
        - "Can deliver that experience consistently"

      inversion_insights:
        failure_mode: "Competing on features, not must-have"
        catastrophic_outcome: "Commodity product, price pressure"
        false_assumption: "More features = more value"
        prevention: "Identify and protect ONE must-have experience"

    latticework_connections:
      complements:
        - "FW_001 (PMF)" # PMF reveals must-have users
        - "FW_002 (Activation)" # Activation delivers must-have
        - "FW_007 (Positive-Signal)" # Positive signal = must-have feedback
      contradicts: []
      prerequisites:
        - "FW_001 (PMF)" # Need PMF data first
      enhances:
        - "FW_009 (Simplicity)" # Must-have focus enables simplicity

    usability:
      prediction_power: HIGH
      explanation_power: HIGH
      action_guidance: HIGH
      error_prevention: HIGH

    implementation_logic: |
      IDENTIFY must_have_experience:
        1. Survey users for "very disappointed"
        2. Study their specific use case
        3. Extract the core value/benefit
        4. Validate it's BOTH valuable AND unique
      ALIGN everything:
        - Onboarding → delivers must-have quickly
        - Messaging → centers on must-have
        - Roadmap → protects must-have
        - Activation → measures must-have delivery

    evidence_citations:
      - source: "Lookout story"
        quote: "I studied the 7% who loved it, learned their use case, repositioned"
      - source: "Must-have definition"
        quote: "Must-have should be both valuable AND unique"

  # ===========================================================================
  # TIER 4: META-FRAMEWORKS (Govern framework application)
  # ===========================================================================

  - framework_id: "FW_009"
    name: "Simplicity-Trumps-Sophistication Framework"
    alias: "Simple Gets Used"
    tier: meta
    type: design_constraint

    description:
      summary: |
        Simple frameworks get used. Complex ones get ignored.
        Practical utility > theoretical elegance. One question
        for PMF, not 50. One metric for North Star, not 20.
        30 minutes for debates, not months. Perfect is the enemy of done.

      when_to_use:
        - "Designing any framework or process"
        - "Selecting metrics"
        - "Facilitating decisions"
        - "Teaching methodology"

      when_not_to_use:
        - "Deep technical analysis"
        - "Regulatory compliance"
        - "Advanced practitioners seeking nuance"

    cross_domain_validation:
      original_domain: "Framework Design"
      validated_domains:
        - domain: "Communication"
          works: true
          example: "Simple explanations stick"
        - domain: "Team Alignment"
          works: true
          example: "One North Star everyone understands"
        - domain: "Teaching"
          works: true
          example: "40% threshold is memorable"
      boundary_conditions:
        - "Advanced audiences may need more nuance"
        - "Complex domains may require complexity"

    first_principles:
      core_axioms:
        - "Adoption > precision"
        - "Cognitive load limits action"
        - "Simple is memorable"
        - "Used > unused"

      necessary_conditions:
        - "Core insight can be simplified"
        - "Context allows approximation"

      inversion_insights:
        failure_mode: "Sophisticated but unused frameworks"
        catastrophic_outcome: "Shelfware, wasted effort"
        false_assumption: "More sophisticated = more valuable"
        prevention: "Design for adoption, iterate for precision"

    latticework_connections:
      complements:
        - "FW_006 (ICE)" # ICE is simple
        - "FW_001 (PMF)" # One question is simple
      contradicts:
        - paradox: "Depth"
          resolution: "Simple for adoption, depth for advanced"
      prerequisites: []
      enhances:
        - "ALL frameworks" # Simplicity enhances all

    usability:
      prediction_power: MEDIUM
      explanation_power: HIGH
      action_guidance: HIGH
      error_prevention: MEDIUM

    implementation_logic: |
      WHEN designing_framework:
        MINIMIZE: number of dimensions
        MAXIMIZE: memorability
        TEST: "Can a busy person use this?"
        IF too_complex:
          SIMPLIFY until adoption likely
        ACCEPT: imperfection for adoption

    evidence_citations:
      - source: "North Star debates"
        quote: "Teams debate North Star for months... I give them 30 minutes maximum"
      - source: "PMF design"
        quote: "One question, not 50"

  - framework_id: "FW_010"
    name: "Experience-Before-Expertise Framework"
    alias: "Authenticity Gate"
    tier: meta
    type: integrity_constraint

    description:
      summary: |
        Won't present or advise on topics without direct practical
        experience. Authenticity over authority. Declined China AI
        presentation because hadn't done much with AI yet. Hedges
        explicitly on novel domains. Waits for hands-on experience.

      when_to_use:
        - "Evaluating speaking opportunities"
        - "Giving advice"
        - "Teaching"
        - "Making predictions"

      when_not_to_use:
        - "Within established expertise"
        - "Clearly marked speculation"

    cross_domain_validation:
      original_domain: "Communication Ethics"
      validated_domains:
        - domain: "Speaking"
          works: true
          example: "Declined China AI talk"
        - domain: "Advising"
          works: true
          example: "Won't advise on topics without experience"
        - domain: "Teaching"
          works: true
          example: "Created simulator for experiential learning"
      boundary_conditions:
        - "Can speculate if clearly marked"
        - "Can share others' expertise with attribution"

    first_principles:
      core_axioms:
        - "Credibility is earned through doing"
        - "Theory without practice misleads"
        - "Reputation is fragile"
        - "Authenticity > opportunity"

      necessary_conditions:
        - "Self-awareness of competence boundaries"
        - "Willingness to decline opportunity"
        - "Ability to hedge appropriately"

      inversion_insights:
        failure_mode: "Presenting without experience"
        catastrophic_outcome: "Damaged credibility, misleading audience"
        false_assumption: "Authority transfers across domains"
        prevention: "Only present on direct experience topics"

    latticework_connections:
      complements:
        - "FW_011 (Epistemic Humility)" # Complement for novel topics
      contradicts: []
      prerequisites: []
      enhances:
        - "ALL frameworks" # Authenticity enhances all teaching

    usability:
      prediction_power: HIGH
      explanation_power: HIGH
      action_guidance: HIGH
      error_prevention: HIGH

    implementation_logic: |
      IF topic NOT_IN direct_experience:
        IF opportunity(speaking, advising, teaching):
          DECLINE or HEDGE explicitly
        WAIT for hands_on_experience
        NEVER claim expertise without doing

    evidence_citations:
      - source: "Lenny's Podcast"
        quote: "I said no to presenting on AI because I wasn't actually doing that much with AI myself"
      - source: "AI evolution"
        quote: "After 6 months of direct experience, comfortable presenting"

  - framework_id: "FW_011"
    name: "Epistemic Humility Framework"
    alias: "Know Your Limits"
    tier: meta
    type: calibration_mechanism

    description:
      summary: |
        Match confidence level to actual knowledge. High confidence
        on core topics (PMF, activation), explicit hedging on novel
        domains (AI, predictions). Uses phrases like "who knows",
        "hard to say" on appropriate topics. Updates beliefs with evidence.

      when_to_use:
        - "Novel domain questions (AI, etc.)"
        - "Future predictions"
        - "Outside direct experience"
        - "When evidence conflicts with current beliefs"

      when_not_to_use:
        - "Core expertise topics"
        - "Well-validated patterns (20+ years)"

    cross_domain_validation:
      original_domain: "Epistemology"
      validated_domains:
        - domain: "Communication"
          works: true
          example: "Hedging language on appropriate topics"
        - domain: "Decision-Making"
          works: true
          example: "Updates beliefs with new data"
      boundary_conditions:
        - "Core expertise doesn't require hedging"
        - "Well-validated patterns can be stated with confidence"

    first_principles:
      core_axioms:
        - "Certainty should match evidence"
        - "Unknown unknowns exist"
        - "Overconfidence is dangerous"
        - "Beliefs should update with evidence"

      necessary_conditions:
        - "Self-awareness of knowledge limits"
        - "Willingness to say 'I don't know'"
        - "Capacity to update beliefs"

      inversion_insights:
        failure_mode: "Overconfidence on novel topics"
        catastrophic_outcome: "Wrong predictions, damaged credibility"
        false_assumption: "Expertise transfers"
        prevention: "Hedge on novel topics, update with evidence"

    latticework_connections:
      complements:
        - "FW_010 (Experience-Before-Expertise)" # Together create authenticity
      contradicts: []
      prerequisites: []
      enhances:
        - "ALL frameworks" # Calibration enhances all

    usability:
      prediction_power: HIGH
      explanation_power: HIGH
      action_guidance: HIGH
      error_prevention: HIGH

    implementation_logic: |
      CALIBRATE confidence_level:
        IF topic in core_expertise (PMF, activation, growth):
          CONFIDENCE = HIGH
          LANGUAGE = assertive ("always", "never", "period")
        IF topic in novel_domain (AI, predictions):
          CONFIDENCE = LOW
          LANGUAGE = hedging ("who knows", "hard to say")
        IF evidence_contradicts(current_belief):
          UPDATE belief
          ACKNOWLEDGE change

    evidence_citations:
      - source: "AI questions"
        quote: "Who knows what AI will look like in 5 years"
      - source: "Belief updates"
        quote: "Six months ago I would have said... now I think..."

