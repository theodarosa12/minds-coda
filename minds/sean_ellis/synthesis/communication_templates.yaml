        conventional: "Revenue is the ultimate metric"
        counter: "Value metrics should be North Star"

      - insight: "Ignore somewhat disappointed users"
        conventional: "Listen to all customer feedback"
        counter: "Focus only on very disappointed users"

      - insight: "Economic constraints help growth"
        conventional: "More resources = faster growth"
        counter: "Constraints force focus and creativity"

      - insight: "Scaling kills startups without PMF"
        conventional: "Growth is always good"
        counter: "Scaling amplifies problems"

      - insight: "Companies over 100 employees fail at growth hacking"
