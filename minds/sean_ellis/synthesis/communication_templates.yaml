      body:
        development_method: "[Setup] → [Problem] → [Turning point] → [Outcome] → [Principle]"
        recursive_structure: false
        structure:
          - step: "Setup"
            purpose: "Context and stakes"
            example: "First downloadable software product"
          - step: "Problem"
            purpose: "Create tension"
            example: "95% never completed a session"
          - step: "Turning point"
            purpose: "The insight moment"
            example: "CEO stopped all roadmap work"
          - step: "Outcome"
            purpose: "Quantified result"
            example: "5% to 50% - 10x improvement"
          - step: "Principle"
            purpose: "Transfer learning"
            example: "Activation is often the real bottleneck"

      closing:
        synthesis_pattern: "What I learned was..."
        action_prompt: "This is why you should..."

    situational_activation:
      deploys_when:
        audience_type: "Skeptics, newcomers, practitioners"
        goal: "Prove methodology works"
        constraints: "Longer format (5+ min)"
        stakes: "When need to convince"
      does_not_use_when:
        anti_pattern: "Time-constrained settings"
        reason: "Stories take time to land"

    linguistic_fingerprints:
