  - template_id: "CT_003"
    name: "Counter-Intuitive Insight"
    alias: "The Contrarian Hook"
    frequency: 50+
    distinctiveness: HIGH

    structural_formula:
      opening:
        hook_pattern: "[Conventional wisdom] is wrong..."
        context_pattern: "Acknowledge what most people believe"
        positioning: "Position as insider with non-obvious knowledge"
        example: "Most people think revenue should be your North Star..."

      body:
        development_method: "[Conventional belief] → [Why it fails] → [Better approach] → [Evidence]"
        recursive_structure: false
        structure:
          - step: "State conventional wisdom"
            purpose: "Meet audience where they are"
            example: "Most think revenue is the North Star"
          - step: "Explain why it fails"
            purpose: "Create cognitive dissonance"
            example: "Creates doom loop of declining value"
          - step: "Present counter-approach"
            purpose: "New mental model"
            example: "Value metrics should be North Star"
          - step: "Provide evidence"
            purpose: "Resolve dissonance with proof"
            example: "Uber uses rides, not GMV"

      closing:
        synthesis_pattern: "That's why the best companies..."
        action_prompt: "Instead of [old way], try [new way]"

    situational_activation:
      deploys_when:
        audience_type: "Experienced practitioners"
        goal: "Challenge assumptions, add value"
        constraints: "Medium that allows explanation"
        stakes: "When differentiating from generic advice"
      does_not_use_when:
        anti_pattern: "Beginners needing basics"
        reason: "May confuse without foundation"

    linguistic_fingerprints:
      opening_phrases:
        - "Most people think..."
        - "Conventional wisdom says..."
        - "It feels counterintuitive, but..."
      transition_phrases:
        - "The problem with that is..."
        - "What actually works is..."
        - "Here's the thing..."
      emphasis_phrases:
        - "This is the opposite of..."
        - "Which is exactly wrong..."
        - "Counter to what you'd expect..."
      closing_phrases:
        - "That's why the best companies..."
        - "This is what separates..."
        - "Once you understand this..."

    psychological_mechanism:
      works_because:
        - principle: "Curiosity Gap"
          explanation: "Contradiction creates need to resolve"
        - principle: "Novelty Attention"
          explanation: "Unexpected claims grab attention"
        - principle: "Expert Positioning"
          explanation: "Non-obvious insights signal depth"
        - principle: "Status Quo Bias Break"
          explanation: "Forces re-evaluation of assumptions"

    evidence_instances:
      - context: "Revenue vs Value metric"
        usage: "Revenue as North Star creates doom loop"
        outcome: "Reframes metric selection"
      - context: "Ignore 60% of feedback"
        usage: "It feels counterintuitive to ignore problems"
        outcome: "Justifies focus on positive signals"
      - context: "Constraints help growth"
        usage: "Economic constraints actually help"
        outcome: "Reframes resource limitations"
      - context: "Don't scale before PMF"
        usage: "Scaling is fastest way to kill startup"
