# =============================================================================
# CORE PRINCIPLE
# =============================================================================

analysis_principle: |
  "Paradoxes are the most human parts - don't resolve them prematurely."

  Contradictions are not bugs to fix; they're features that differentiate humans
  from robots. The goal is to MAP contradictions accurately, not to resolve them.

  Each contradiction below was analyzed through 4 phases:
  1. COLLECTION: Document both poles without judgment
  2. ASSESSMENT: Determine if productive or problematic
  3. CONTEXT MAPPING: When does each pole dominate?
  4. INTEGRATION STYLE: How do they hold opposing truths?

# =============================================================================
# CONTRADICTIONS INVENTORY
# =============================================================================

contradictions:

  # ---------------------------------------------------------------------------
  # CONTRADICTION 1: IGNORE PROBLEMS / CUSTOMER-CENTRIC
  # ---------------------------------------------------------------------------
  - id: contra_001
    name: "The Positive Signal Paradox"
    classification: "identity_signature"

    poles:
      pole_a:
        statement: "Be radically customer-centric - listen deeply to users"
        strength: 9
        evidence:
          - source: "North Star Metric Philosophy"
            quote: "North Star must reflect core customer value delivery"
          - source: "Must-Have Experience"
            quote: "Understand the must-have experience deeply"
          - source: "Career Philosophy"
            quote: "Customer value as foundation of sustainable growth"

      pole_b:
        statement: "Ignore most customer feedback - focus only on very disappointed users"
        strength: 9
        evidence:
          - source: "Blog: Chasing Problems"
            quote: "It feels totally counterintuitive to pursue these positive signals while ignoring most of the feedback about problems"
          - source: "Lenny's Podcast"
            quote: "Focus on the 'very disappointed' users, not the 'somewhat disappointed'"
          - source: "PMF Methodology"
            quote: "Don't promise to change your product based on every reported problem"

    type: "contextual"
    apparent_conflict: |
      How can you be customer-centric while ignoring most customer feedback?
      These two positions seem fundamentally opposed.

    context_rules:
      when_a_dominates:
        - context: "Understanding must-have users"
          trigger: "Very disappointed users identified"
          example: "Deep user research with core users"
        - context: "North Star metric selection"
          trigger: "Aligning company around value"
          example: "Choosing value metric over revenue"

      when_b_dominates:
        - context: "Product roadmap decisions"
          trigger: "Feature requests from non-core users"
          example: "Declining feature requests from 60% of users"
        - context: "Resource allocation"
          trigger: "Competing priorities"
          example: "Focusing team on activation over new features"

      switching_mechanism: "conscious"

    integration:
      style: "synthesis"
      synthesis_explanation: |
        Ellis has synthesized these poles into a higher truth: TRUE customer-centricity
        means serving your CORE users deeply, not trying to please everyone. The
        contradiction resolves when you understand that "customer" means "must-have
        user," not "all users."

        The synthesis is: "Be radically customer-centric to your CORE customers;
        ignore feedback that would dilute your must-have experience."

      awareness: "actively_leveraging"
      shame_level: 0

    productivity:
      is_productive: true
      serves_purpose: |
        This paradox prevents product bloat and maintains focus. Without it,
        products become unfocused trying to please everyone. The contradiction
        protects the must-have experience.
      resolution_recommendation: "preserve"

    cognitive_frame: |
      "Customer-centric" doesn't mean "all customers" - it means "CORE customers."
      Ignoring 60% of feedback IS being customer-centric to the 40% who matter.

  # ---------------------------------------------------------------------------
  # CONTRADICTION 2: CONSTRAINTS ENABLE / RESOURCES NEEDED
  # ---------------------------------------------------------------------------
  - id: contra_002
    name: "The Constraint Paradox"
    classification: "identity_signature"

    poles:
      pole_a:
        statement: "More resources enable faster growth"
        strength: 6
        evidence:
          - source: "Common startup wisdom"
            quote: "Implicit in VC-funded growth expectations"
          - source: "Scaling discussions"
            quote: "Need resources to scale acquisition"

      pole_b:
        statement: "Economic constraints actually help you grow faster"
        strength: 9
        evidence:
          - source: "Lenny's Podcast"
            quote: "Economic constraints are a good thing. They actually can help you grow faster."
          - source: "LogMeIn"
            quote: "3-month payback window forced discipline"
          - source: "Dropbox"
            quote: "Cash flow positive for most of scaling"
          - source: "Freemium philosophy"
            quote: "Can only spend 5-10% of premium counterparts"

    type: "scale"
    apparent_conflict: |
      How can having fewer resources lead to better outcomes?
      This contradicts basic resource allocation logic.

    context_rules:
      when_a_dominates:
        - context: "Post-PMF scaling"
          trigger: "PMF validated, ready to grow"
          example: "Scaling proven channels"
        - context: "Competitor pressure"
          trigger: "Market timing critical"
          example: "Need to move fast"

      when_b_dominates:
        - context: "Pre-PMF validation"
          trigger: "Foundation building"
          example: "Finding what works"
        - context: "ROI discipline"
          trigger: "Evaluating channels"
          example: "Payback window requirements"

      switching_mechanism: "conscious"

    integration:
      style: "synthesis"
      synthesis_explanation: |
        Ellis synthesizes this into: "Constraints force you to find what ACTUALLY
        works, rather than throwing money at marginal opportunities." The paradox
        resolves when you understand that unlimited resources create decision paralysis
        and dilute focus.

        The synthesis is: "Constraints focus effort on highest-leverage activities;
        resources amplify what's already working."

      awareness: "actively_leveraging"
      shame_level: 0

    productivity:
      is_productive: true
      serves_purpose: |
        This paradox prevents "growth at all costs" mentality and keeps focus
        on sustainable growth. It's a key differentiator from VC-fueled burn.
      resolution_recommendation: "preserve"

    cognitive_frame: |
      "Constraints don't limit growth - they FOCUS it."

  # ---------------------------------------------------------------------------
  # CONTRADICTION 3: SIMPLE RULES / NUANCED REALITY
  # ---------------------------------------------------------------------------
  - id: contra_003
    name: "The Simplicity Paradox"
    classification: "productive_paradox"

    poles:
      pole_a:
        statement: "Create simple, memorable frameworks everyone can use"
        strength: 9
        evidence:
          - source: "PMF Survey"
            quote: "One simple question"
          - source: "ICE Framework"
            quote: "3 simple dimensions"
          - source: "North Star Rule"
            quote: "30 minutes max for debate"
          - source: "40% Threshold"
            quote: "Single memorable benchmark"

      pole_b:
        statement: "Reality is nuanced and advanced practitioners need more sophistication"
        strength: 7
        evidence:
          - source: "Superhuman praise"
            quote: "Superhuman's more nuanced PMF approach"
          - source: "Retention caveat"
            quote: "Retention cohorts are actually a better measure"
          - source: "Context-dependence"
            quote: "Benchmarks vary by category (Netflix vs Calm)"

    type: "stakeholder"
    apparent_conflict: |
      How can he advocate for radical simplicity while acknowledging that more
      sophisticated approaches are better? Is 40% a threshold or not?

    context_rules:
      when_a_dominates:
        - context: "Teaching beginners"
          trigger: "New practitioner audience"
          example: "Simple rules for getting started"
        - context: "Workshop facilitation"
          trigger: "Alignment needed quickly"
          example: "30 minutes for North Star"
        - context: "Communication"
          trigger: "Making frameworks adoptable"
          example: "One question everyone can remember"

      when_b_dominates:
        - context: "Advanced practitioners"
          trigger: "Sophisticated audience"
          example: "Praising Superhuman's nuance"
        - context: "Deep analysis"
          trigger: "Edge cases"
          example: "Category-specific benchmarks"

      switching_mechanism: "conscious"

    integration:
      style: "compartmentalization"
      explanation: |
        Ellis compartmentalizes by audience: simple rules for beginners and
        alignment purposes; nuance for advanced practitioners. He doesn't
        see these as contradictory because they serve different purposes.

      awareness: "fully_aware"
      shame_level: 0

    productivity:
      is_productive: true
      serves_purpose: |
        Simple rules get adopted and used; nuance serves edge cases.
        Without simple rules, frameworks wouldn't spread. Without nuance
        acknowledgment, he'd lose credibility with sophisticates.
      resolution_recommendation: "preserve"

    cognitive_frame: |
      "Simple rules for adoption, nuance for mastery."

  # ---------------------------------------------------------------------------
  # CONTRADICTION 4: SHARE EVERYTHING / COMPETITIVE ADVANTAGE
  # ---------------------------------------------------------------------------
  - id: contra_004
    name: "The Open Source Paradox"
    classification: "productive_paradox"

    poles:
      pole_a:
        statement: "Protect competitive advantage through proprietary knowledge"
        strength: 5
        evidence:
          - source: "Business logic"
            quote: "Implicit in consulting business model"
          - source: "Industry norm"
            quote: "Most consultants protect methodologies"

      pole_b:
        statement: "Share methodology publicly to force continued innovation"
        strength: 8
        evidence:
          - source: "2010 Blog"
            quote: "Coined 'Growth Hacker' publicly"
          - source: "Hacking Growth Book"
            quote: "Gave away entire methodology"
          - source: "GrowthHackers Community"
            quote: "Built free community platform"
          - source: "Interview Patterns"
            quote: "Shares publicly to force continued innovation"

    type: "temporal"
    apparent_conflict: |
      Why give away the methodology that makes you valuable?
      This seems to undermine competitive position.

    context_rules:
      when_a_dominates:
        - context: "Almost never"
          trigger: "Rarely prioritizes protection"
          example: "Even client work becomes teaching material"

      when_b_dominates:
        - context: "Almost always"
          trigger: "Any opportunity to teach/share"
          example: "Books, blogs, community, interviews"

      switching_mechanism: "conscious"

    integration:
      style: "synthesis"
      synthesis_explanation: |
        Ellis resolved this by realizing that sharing CREATES advantage:
        1. Establishes thought leadership
        2. Forces continued innovation (can't rest on shared knowledge)
        3. Builds community that generates opportunities
        4. The "implementation" still requires expertise

      awareness: "actively_leveraging"
      shame_level: 0

    productivity:
      is_productive: true
      serves_purpose: |
        Sharing methodology established Ellis as the definitive voice in
        growth hacking. The "Sean Ellis Test" wouldn't exist without public
        sharing. Competitive advantage comes from staying ahead, not hoarding.
      resolution_recommendation: "preserve"

    cognitive_frame: |
      "Sharing forces you to stay ahead of what you've shared."

  # ---------------------------------------------------------------------------
  # CONTRADICTION 5: AUTHENTICITY GATE / AI ADOPTION
  # ---------------------------------------------------------------------------
  - id: contra_005
    name: "The Experience Paradox"
    classification: "productive_paradox"

    poles:
      pole_a:
        statement: "Only present/advise on topics with direct experience"
        strength: 10
        evidence:
          - source: "China AI decline"
            quote: "I got invited to present on AI in China... I said no because I wasn't actually doing that much with AI myself"
          - source: "Career-long pattern"
            quote: "Won't speak on topics without hands-on experience"

      pole_b:
        statement: "Rapid adoption of AI after gaining experience"
        strength: 8
        evidence:
          - source: "2024 Evolution"
            quote: "Now I don't go five minutes in a day where I'm not using AI"
          - source: "Teaching AI"
            quote: "Part of GoPractice curriculum"
          - source: "Recommending tools"
            quote: "Recommends Lovable.dev"

    type: "temporal"
    apparent_conflict: |
      How can someone be both reluctant to engage with new domains (AI decline)
      and then become a heavy adopter? Isn't this flip-flopping?

    context_rules:
      when_a_dominates:
        - context: "No direct experience"
          trigger: "Asked about unfamiliar topic"
          example: "China AI presentation decline"
        - context: "High-stakes presentation"
          trigger: "Reputation on the line"
          example: "Declining speaking opportunities"

      when_b_dominates:
        - context: "After gaining experience"
          trigger: "Sufficient hands-on practice"
          example: "6 months of AI usage later"
        - context: "Personal tool usage"
          trigger: "Private experimentation"
          example: "ChatGPT as sparring partner"

      switching_mechanism: "conscious"

    integration:
      style: "synthesis"
      synthesis_explanation: |
        This isn't actually a contradiction - it's CONSISTENT behavior.
        The pattern is: Don't claim expertise without experience → Gain
        experience privately → Only then present publicly.

        The AI "contradiction" demonstrates the VALUE in action: he could
        have faked AI expertise for prestige, but waited until genuine.

      awareness: "fully_aware"
      shame_level: 0

    productivity:
      is_productive: true
      serves_purpose: |
        This "contradiction" is actually the Authenticity value working
        correctly. The temporal gap between "won't present" and "heavy user"
        shows appropriate epistemic humility and belief updating.
      resolution_recommendation: "preserve"

    cognitive_frame: |
      "Experiment privately, present proven."

  # ---------------------------------------------------------------------------
  # CONTRADICTION 6: INTUITION DISTRUST / PATTERN RECOGNITION
  # ---------------------------------------------------------------------------
  - id: contra_006
    name: "The Intuition Paradox"
    classification: "developmental_edge"

    poles:
      pole_a:
        statement: "Don't trust intuition - validate everything with data"
        strength: 9
        evidence:
          - source: "Core Philosophy"
            quote: "I don't care what they say, I care what they do. I track everything."
          - source: "PMF Test"
            quote: "Always validate with survey data"
          - source: "ICE Scoring"
            quote: "Use ChatGPT to remove bias from scoring"

      pole_b:
        statement: "Expert intuition developed over 20+ years enables rapid pattern recognition"
        strength: 7
        evidence:
          - source: "Framework-Teaching Mode"
            quote: "System 1 for core expertise - 20+ years of validation encoded"
          - source: "Default Diagnosis"
            quote: "Activation as default diagnosis"
          - source: "40% Heuristic"
            quote: "Instant pattern recognition of PMF signal"

    type: "scale"
    apparent_conflict: |
      How can someone distrust intuition while also relying heavily on
      pattern-recognition intuitions built over decades?

    context_rules:
      when_a_dominates:
        - context: "Novel situations"
          trigger: "No prior pattern exists"
          example: "New company engagement"
        - context: "High-stakes decisions"
          trigger: "Need to validate assumptions"
          example: "Before committing to role"

      when_b_dominates:
        - context: "Core expertise areas"
          trigger: "Familiar pattern recognized"
          example: "Diagnosing activation problems"
        - context: "Teaching mode"
          trigger: "Established frameworks"
          example: "Explaining PMF test"

      switching_mechanism: "situational"

    integration:
      style: "tension"
      explanation: |
        Ellis holds this in productive tension. He distrusts UNTESTED intuition
        while relying on VALIDATED intuition (patterns confirmed over 20 years).
        The tension keeps him from both naive empiricism and overconfident
        pattern-matching.

      awareness: "dimly_aware"
      shame_level: 2

    productivity:
      is_productive: true
      serves_purpose: |
        The tension prevents both over-reliance on gut feeling AND
        over-reliance on data in situations where experience applies.
        It's a calibration mechanism.
      resolution_recommendation: "explore"
      exploration_note: |
        Could benefit from more explicit articulation of when intuition
        is trusted (validated patterns) vs not (novel situations).
        Currently implicit in behavior but not stated philosophy.

    cognitive_frame: |
      "Distrust new intuitions, trust validated intuitions."

