# =============================================================================

synthesis:
  signature_patterns:
    communication:
      - "Framework-first answering (names the framework before explaining)"
      - "Story-to-principle pattern (specific example → general rule)"
      - "Quantified claims (40%, 95%, 10x)"
      - "Self-deprecating origin story (no training, learned by doing)"
      - "Counter-example discovery (disproves limiting beliefs)"

    reasoning:
      - "Empirical grounding (won't claim without experience)"
      - "Simplicity preference (one question, one metric, 30 minutes)"
      - "Cross-validation (multiple companies, same pattern)"
      - "Temporal consistency check (what worked then vs now)"

    values_expressed:
      - "Authenticity (declines AI presentation)"
      - "Practicality (theory must be tested)"
      - "Generosity (shares everything, names later)"
      - "Humility (acknowledges luck, limitations)"

  evolution_over_time:
    - topic: "AI usage"
      earlier_position: "Wouldn't present on AI (early 2024)"
      later_position: "Heavy AI integration in presentations (late 2024)"
      what_changed: "Personal experience and comfort level"

    - topic: "Product market fit importance"
      earlier_position: "Important prerequisite"
      later_position: "90% of success is PMF"
      what_changed: "Appreciation increased with more experience"

    - topic: "PMF test methodology"
      earlier_position: "Ignore somewhat disappointed users"
      later_position: "Acknowledge Superhuman's more nuanced approach"
      what_changed: "Learned from others who built on his work"

  cross_interview_consistency: "HIGHLY CONSISTENT"

  consistency_notes: |
    Sean Ellis demonstrates remarkable consistency across all interviews:
    - Core frameworks (PMF test, ICE, activation) told identically
    - Teaching stories (LogMeIn, Dropbox, Lookout) stable across years
    - Values and priorities consistent
    - Only evolution is in AI-related topics (appropriate given rapid change)

    The consistency suggests deeply internalized principles rather than
    rehearsed talking points. When topics evolve (AI), he openly acknowledges
    the change in his position.

  meta_learning_revealed:
    how_they_learn: |
      Ellis learns primarily through:
      1. Direct experience at companies (doing, not reading)
      2. Data analysis and customer feedback
      3. Cross-company pattern recognition
      4. Counter-example discovery (what disproves assumptions)
      5. Network learning (sharing with other founders, getting feedback)

    who_influenced_them:
      - "Drew Houston (Dropbox) - collaboration model"
      - "Mark Andreessen - PMF concept articulation"
      - "Jeff Bezos - experimentation philosophy"
      - "Paul Graham - 'do things that don't scale'"
      - "Steve Blank - Four Steps to the Epiphany"
      - "Morgan Brown (co-author) - systematizing ideas"
      - "Ethan (GoPractice partner) - data science perspective"

    what_they_practice: |
      Daily/Weekly:
      - ChatGPT for ideation and analysis (claims not 5 minutes without it)
      - Survey design and analysis
      - Framework refinement through workshops

      Per Engagement:
      - Data immersion (first 2 weeks)
      - Alignment workshop facilitation
      - Experiment scripting and analysis

    learning_style: |
      Strongly experiential learner who:
      - Distrusts formal education (NYU course made him worse)
      - Values practical application over theoretical knowledge
      - Builds frameworks from accumulated experience
      - Updates beliefs when data contradicts them
      - Shares learnings publicly to force continued innovation
