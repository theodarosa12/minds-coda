# =============================================================================
# QUESTION FRAMING PATTERNS
# =============================================================================

patterns:
  question_framing:
    reasoning_style: "Framework-First with Empirical Grounding"

    dominant_reasoning_mode:
      type: "Inductive-to-Framework"
      description: |
        Ellis typically reasons from specific experiences to general principles,
        then crystallizes those into reusable frameworks. He rarely reasons
        from pure first principles without empirical grounding.

      evidence:
        - pattern: "Story → Pattern → Framework → Application"
          example: "LogMeIn 95% abandonment → Activation insight → Framework for all startups"
        - pattern: "Multiple experiences → Common thread → Named concept"
          example: "Multiple companies' survey results → 40% threshold → Sean Ellis Test"

    framework_application:
      observed: true
      favorite_frameworks:
        - framework: "Sean Ellis Test / PMF Survey"
          usage_frequency: "Every interview"
          how_applied: "Diagnostic first, then prescriptive"
        - framework: "ICE Prioritization"
          usage_frequency: "Most interviews"
          how_applied: "When discussing experiment selection"
        - framework: "North Star Metric"
          usage_frequency: "Most interviews"
          how_applied: "When discussing alignment"
        - framework: "Activation as 1000lb Gorilla"
          usage_frequency: "Every interview"
          how_applied: "When diagnosing growth problems"

    analogy_based_reasoning:
      observed: true
      favorite_analogies:
        - analogy: "Football high tempo offense"
          context: "Experimentation velocity"
          frequency: "Occasional"
        - analogy: "Scripting first 10 plays"
          context: "De-risking first experiments"
          frequency: "Occasional"
        - analogy: "Flight simulator"
          context: "GoPractice learning approach"
          frequency: "When promoting course"
        - analogy: "Puzzle pieces fitting together"
          context: "Growth as integrated system"
          frequency: "Common"

    certainty_calibration:
      high_confidence_markers:
        - "I have found in company after company that..."
        - "I've seen over time that..."
        - "The data consistently shows..."
        - "What I learned was..."

      uncertainty_markers:
        - "It depends on..."
        - "I'm not sure that..."
        - "Who knows..."
        - "In a year we would look at it and go that was stupid"

      examples:
        - statement: "40% of people saying they'd be very disappointed"
          confidence_level: "Very High"
          linguistic_markers: "Over time I started to realize... I honed in..."
        - statement: "AI predictions"
          confidence_level: "Low"
          linguistic_markers: "Who the hell knows... that's changing so fast"

    counterfactual_thinking:
      observed: true
      examples:
        - question: "What if we weren't approaching it the right way?"
          counterfactual_considered: "Counter-examples like IM products with millions of downloads"
        - question: "What would have happened without activation fix?"
          counterfactual_considered: "Would have been a very small company"

    system_1_vs_system_2:
      system_1_fast:
        triggers:
          - "Questions about PMF test methodology"
          - "Questions about activation importance"
          - "Questions about frameworks he invented"
        examples:
          - "Immediate, confident responses about 40% threshold"
          - "Quick stories about LogMeIn activation"

      system_2_slow:
        triggers:
          - "Questions about AI future"
          - "Questions about specific company situations"
          - "Questions about organizational structure"
        examples:
          - "Pauses and qualifies when asked about AI predictions"
          - "Deliberate when discussing CMO evolution"

