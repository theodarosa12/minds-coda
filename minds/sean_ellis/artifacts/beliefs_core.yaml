analysis_principle: |
  "Beliefs are not facts - they're interpretive frameworks that shape how
  someone processes reality. Beliefs act as filters through which all
  experience is interpreted."

  Each belief was extracted through:
  - Statements presented as facts
  - Assumptions in arguments
  - Premises in decision-making
  - What they don't feel needs explanation

