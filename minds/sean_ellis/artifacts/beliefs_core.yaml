# =============================================================================
# SUMMARY
# =============================================================================

summary:

  total_beliefs_mapped: 24
  core_beliefs: 12
  limiting_beliefs: 4
  empowering_beliefs: 8

  worldview_signature: |
    Sean Ellis operates from a **fundamentals-first, data-driven, experiential**
    worldview. His belief architecture centers on a few key axioms:

    1. **PMF is destiny** - Product-Market Fit determines success more than
       anything else. This belief organizes all other priorities.

    2. **Data over intuition** - Reality is revealed by measurement, not
       assumption. This belief drives his diagnostic approach.

    3. **Learning through doing** - Real knowledge comes from experience,
       not study. This belief explains his self-taught identity.

    4. **Simplicity enables action** - Complex frameworks don't get adopted;
       simple ones do. This belief shapes his methodology design.

    5. **Constraints create focus** - Limitations force creativity and
       efficiency. This belief positions him against "growth at all costs."

    His belief ecosystem is highly coherent - beliefs reinforce each other
    and create a consistent worldview. The few apparent conflicts resolve
    through context-dependence rather than genuine contradiction.

    What makes this belief system powerful is its ACTIONABILITY. Each core
    belief translates directly into methodology: measure PMF, optimize
    activation, experiment systematically, align cross-functionally.

  belief_blind_spots:
    - area: "Personal/non-professional beliefs"
      note: "Limited data on beliefs outside startup/growth domain"

    - area: "Beliefs about failure"
      note: "Talks about failures but underlying beliefs about failure less clear"

    - area: "Beliefs about scale limits"
      note: "May underweight enterprise success patterns"

