frameworks_latticework:

  # ---------------------------------------------------------------------------
  # FRAMEWORK 1: PMF THRESHOLD GATE (Foundation)
  # ---------------------------------------------------------------------------
  - framework_id: "FW_001"
    name: "PMF Threshold Gate"
    type: "decision"
    category: "Foundation"

    description:
      summary: |
        A binary decision gate using a single quantified threshold (40% "very
        disappointed") to determine whether a product has achieved Product-Market
        Fit and is ready for growth investment.
      when_to_use:
        - "Evaluating any startup's readiness for scaling"
        - "Deciding whether to invest growth resources"
        - "Prioritizing between PMF improvement vs growth tactics"
        - "Career decisions (joining/advising companies)"
      when_not_to_use:
        - "Network effect businesses pre-critical mass"
        - "Enterprise with small sample sizes (<40 responses)"
        - "Products with extremely long evaluation cycles"

    formal_expression:
      rule: |
        IF pmf_survey_result("very_disappointed") >= 40%:
          RETURN "Proceed with growth investment"
        ELSE:
          RETURN "STOP - Focus on product improvement, not scaling"

    cross_domain_validation:
      original_domain: "SaaS Product Strategy"
      validated_domains:
        - domain: "Career Decisions"
          works: true
          example: "Won't join company without running PMF survey first"
        - domain: "Investment Decisions"
          works: true
          example: "Uses PMF signal as primary investment filter"
        - domain: "Consulting Engagement"
          works: true
          example: "Contract requires PMF survey before engagement"
        - domain: "Resource Allocation"
          works: true
          example: "Determines budget allocation priority"

    first_principles:
      core_axioms:
        - "Genuine customer love is measurable"
        - "Scaling without fit amplifies waste, not growth"
        - "Binary decision points reduce analysis paralysis"
        - "Loss framing reveals true attachment better than satisfaction"

      necessary_conditions:
        - "Sample size sufficient (40+ active users)"
        - "Users actively using product (not dormant)"
        - "Question phrased with loss framing"

      inversion_insights:
        failure_mode: "Scaling before PMF"
        insight: "Fastest way to put a startup out of business"
        prevention: "Gate ALL growth investment behind PMF validation"

    latticework_connections:
      complements:
        - "FW_003" # Activation-First Diagnosis
        - "FW_005" # Value-Before-Revenue
      contradicts: []
      prerequisites: []
      enhances:
        - "FW_008" # Economic Constraint

    usability:
      prediction_power: "HIGH"
      explanation_power: "HIGH"
      action_guidance: "VERY HIGH"
      error_prevention: "VERY HIGH"

    evidence:
      - source: "All 9 interviews + blog + book"
        pattern: "40% threshold cited identically for 15+ years"
      - source: "Lookout turnaround"
        example: "7% → 40% in 2 weeks using this framework"
      - source: "Superhuman validation"
        example: "Company built entire process around this framework"

    unique_ellis_contribution: |
      Sean Ellis invented this specific test. The "Sean Ellis Test" is
      named after him. No one else created a quantified, single-question
      PMF assessment that became industry standard.

  # ---------------------------------------------------------------------------
  # FRAMEWORK 2: SIMPLICITY-ADOPTION TRADE-OFF
  # ---------------------------------------------------------------------------
  - framework_id: "FW_002"
    name: "Simplicity-Adoption Trade-Off"
    type: "design"
    category: "Methodology"

    description:
      summary: |
        When designing frameworks, metrics, or tools, prioritize simplicity
        over sophistication because adoption matters more than precision.
        A simple framework people use beats a sophisticated one they ignore.
      when_to_use:
        - "Creating prioritization frameworks"
        - "Designing metrics systems"
        - "Facilitating team alignment"
        - "Building tools for non-experts"
      when_not_to_use:
        - "Audience is highly technical and demands precision"
        - "Regulatory/compliance requirements demand complexity"
        - "Problem genuinely requires multi-factor analysis"

    formal_expression:
      rule: |
        IF time_to_understand(framework) > 30_minutes:
          SIMPLIFY until understandable in 30 minutes
        IF adoption_rate < threshold:
          REDUCE complexity, not add features

    cross_domain_validation:
      original_domain: "Growth Methodology"
      validated_domains:
        - domain: "Product Design"
          works: true
          example: "LogMeIn: simplified activation flow"
        - domain: "Team Communication"
          works: true
          example: "North Star = 1 metric everyone understands"
        - domain: "Consulting Delivery"
          works: true
          example: "30-minute rule for North Star debates"
        - domain: "Teaching"
          works: true
          example: "GoPractice simulator vs traditional courses"

    first_principles:
      core_axioms:
        - "Adoption drives value; precision without adoption = zero value"
        - "Human working memory is limited (~4-7 items)"
        - "Complexity creates friction; friction kills adoption"

      necessary_conditions:
        - "Core insight must survive simplification"
        - "Target audience must be able to apply framework"

      inversion_insights:
        failure_mode: "Sophisticated frameworks ignored"
        insight: "Complexity is often ego, not utility"
        prevention: "Time-box debates, limit dimensions, test adoption"

    latticework_connections:
      complements:
        - "FW_006" # Cross-Functional Alignment
      contradicts:
        - "[External: Academic precision frameworks]"
      prerequisites: []
      enhances:
        - "FW_001" # PMF Gate (simple threshold)
        - "FW_004" # ICE Prioritization

    usability:
      prediction_power: "MEDIUM"
      explanation_power: "HIGH"
      action_guidance: "HIGH"
      error_prevention: "MEDIUM"

    evidence:
      - source: "PMF Test design"
        example: "1 question vs industry standard 50-question surveys"
      - source: "ICE Framework"
        example: "3 dimensions vs weighted multi-factor models"
      - source: "North Star facilitation"
        example: "'30 minutes maximum to define North Star'"

    unique_ellis_contribution: |
      Ellis consistently sacrificed measurement precision for adoption.
      His frameworks (PMF test, ICE, North Star) are all elegantly simple
      compared to alternatives, yet more widely adopted.

  # ---------------------------------------------------------------------------
  # FRAMEWORK 3: ACTIVATION-FIRST DIAGNOSIS
  # ---------------------------------------------------------------------------
  - framework_id: "FW_003"
    name: "Activation-First Diagnosis"
    type: "decision"
    category: "Diagnostic"

    description:
      summary: |
        When growth stalls or underperforms, the default hypothesis should
        be "activation is broken." Check activation metrics first before
        exploring other explanations.
      when_to_use:
        - "Growth has stalled despite marketing investment"
        - "Retention is poor despite good product"
        - "CAC is high relative to competitors"
        - "Word-of-mouth is lower than expected"
      when_not_to_use:
        - "Activation metrics already excellent"
        - "Product has naturally long activation cycles"
        - "PMF not yet validated (check PMF first)"

    formal_expression:
      rule: |
        IF growth_stalled AND pmf_validated:
          FIRST_HYPOTHESIS = "Activation is bottleneck"
          CHECK activation_rate(signup_to_aha_moment)
          IF activation_rate < benchmark:
            FOCUS resources on activation improvement
          ELSE:
            EXPLORE other factors

    cross_domain_validation:
      original_domain: "SaaS Growth"
      validated_domains:
        - domain: "Freemium Products"
          works: true
          example: "LogMeIn: 95% → 50% activation improvement"
        - domain: "E-commerce"
          works: partially
          example: "First purchase experience as activation"
          limitation: "Simpler than SaaS activation"
        - domain: "Content Platforms"
          works: true
          example: "First content consumption as activation"

    first_principles:
      core_axioms:
        - "Users can't love what they haven't experienced"
        - "Signup ≠ Activation ≠ Value delivery"
        - "Most products have activation problems they don't recognize"

      necessary_conditions:
        - "PMF must be validated first"
        - "Must have clear 'aha moment' definition"
        - "Activation funnel must be measurable"

      inversion_insights:
        failure_mode: "Diagnosing everywhere except activation"
        insight: "95% of problems look like something else"
        prevention: "Always check activation first by protocol"

    latticework_connections:
      complements:
        - "FW_001" # PMF Gate (after PMF validated)
        - "FW_005" # Value-Before-Revenue
      contradicts: []
      prerequisites:
        - "FW_001" # PMF must be validated first
      enhances:
        - "FW_007" # High-Tempo Experimentation

    usability:
      prediction_power: "HIGH"
      explanation_power: "VERY HIGH"
      action_guidance: "VERY HIGH"
      error_prevention: "HIGH"

    evidence:
      - source: "LogMeIn story"
        example: "95% abandonment discovered; 10x improvement after fix"
      - source: "Lenny's Podcast"
        quote: "Silicon Valley's fastest growing companies spend half their product resources on activation"
      - source: "All consulting engagements"
        pattern: "Activation checked within first 2 weeks"

    unique_ellis_contribution: |
      Ellis's LogMeIn experience (95% abandonment) crystallized activation
      as the default diagnostic lens. This story is told identically across
      all sources, demonstrating deep encoding. The specific "1000lb gorilla
      in the room" framing is his signature.

  # ---------------------------------------------------------------------------
  # FRAMEWORK 4: ICE PRIORITIZATION
  # ---------------------------------------------------------------------------
  - framework_id: "FW_004"
    name: "ICE Prioritization Framework"
    type: "optimization"
    category: "Operational"

    description:
      summary: |
        Score potential experiments/initiatives on three dimensions:
        Impact (potential value), Confidence (likelihood of success),
        Ease (resources/time required). Multiply scores for priority.
      when_to_use:
        - "Prioritizing growth experiments"
        - "Deciding between feature options"
        - "Allocating limited resources"
        - "Reducing debate time on priorities"
      when_not_to_use:
        - "Strategic bets with long time horizons"
        - "Decisions requiring qualitative judgment"
        - "When sample sizes too small for confidence"

    formal_expression:
      rule: |
        FOR each experiment_idea:
          impact_score = rate(1-10, "potential value if successful")
          confidence_score = rate(1-10, "likelihood of success")
          ease_score = rate(1-10, "resources/time required, inverted")
          ice_score = impact * confidence * ease
        RANK by ice_score descending
        EXECUTE highest scores first

    cross_domain_validation:
      original_domain: "Growth Experimentation"
      validated_domains:
        - domain: "Product Roadmap"
          works: true
          example: "Feature prioritization using ICE"
        - domain: "Marketing Campaigns"
          works: true
          example: "Channel prioritization"
        - domain: "Personal Projects"
          works: partially
          example: "Deciding what to work on"
          limitation: "Missing emotional/values factors"

    first_principles:
      core_axioms:
        - "Not all experiments are equal"
        - "Resources are always constrained"
        - "Quick wins build momentum"
        - "Simple scoring beats analysis paralysis"

      necessary_conditions:
        - "Sufficient ideas to prioritize"
        - "Ability to estimate impact/confidence/ease"
        - "Team alignment on what 'impact' means"

      inversion_insights:
        failure_mode: "Random or HiPPO-driven prioritization"
        insight: "Without framework, loudest voice or pet projects win"
        prevention: "Systematic scoring removes bias"

    latticework_connections:
      complements:
        - "FW_007" # High-Tempo Experimentation
        - "FW_002" # Simplicity-Adoption
      contradicts: []
      prerequisites: []
      enhances:
        - "FW_003" # Activation-First (prioritize activation experiments)

    usability:
      prediction_power: "MEDIUM"
      explanation_power: "HIGH"
      action_guidance: "VERY HIGH"
      error_prevention: "HIGH"

    evidence:
      - source: "Hacking Growth book"
        example: "Core methodology chapter"
      - source: "Lenny's Podcast"
        quote: "Can use ChatGPT to remove bias from scoring your own ideas"
      - source: "GrowthHackers methodology"
        pattern: "Standard practice across community"

    unique_ellis_contribution: |
      While prioritization matrices existed, ICE's specific 3-dimension
      structure and multiplication method are Ellis's contribution. The
      deliberate simplicity (3 factors, not 10) reflects his design philosophy.

  # ---------------------------------------------------------------------------
  # FRAMEWORK 5: VALUE-BEFORE-REVENUE CHAIN
  # ---------------------------------------------------------------------------
  - framework_id: "FW_005"
    name: "Value-Before-Revenue Chain"
    type: "cause-effect"
    category: "Strategic"

    description:
      summary: |
        Customer value creation MUST precede revenue optimization. The causal
        chain is: Value → Satisfaction → Retention → Revenue. Directly
        optimizing revenue creates "doom loops" of declining value.
      when_to_use:
        - "Selecting North Star metrics"
        - "Strategic planning"
        - "Debating KPIs with executives"
        - "Choosing between value and revenue metrics"
      when_not_to_use:
        - "Unit economics already proven (execution phase)"
        - "Cash flow crisis requiring immediate revenue"

    formal_expression:
      rule: |
        north_star_metric = MUST_BE value_metric
        PROHIBITED: revenue as north_star

        causal_chain:
          value_delivery → customer_satisfaction → retention → revenue

        INVERSE is FALSE:
          revenue_focus → short_term_extraction → value_decline → churn

    cross_domain_validation:
      original_domain: "SaaS Strategy"
      validated_domains:
        - domain: "Marketplace Platforms"
          works: true
          example: "Rides/nights as North Star, not revenue"
        - domain: "Content Platforms"
          works: true
          example: "DAU/engagement, not ad revenue"
        - domain: "E-commerce"
          works: partially
          example: "Purchase frequency vs revenue"
          limitation: "Revenue more directly tied to value"

    first_principles:
      core_axioms:
        - "Value creates revenue; revenue doesn't create value"
        - "Optimizing the symptom doesn't cure the disease"
        - "Sustainable growth requires sustainable value delivery"

      necessary_conditions:
        - "Value metric must be measurable"
        - "Team must understand the causal chain"
        - "Leadership buy-in on value-first approach"

      inversion_insights:
        failure_mode: "Revenue as North Star"
        insight: "Creates doom loop: revenue focus → price increases → churn → more pressure"
        prevention: "Define North Star as value metric, track revenue separately"

    latticework_connections:
      complements:
        - "FW_001" # PMF Gate (value drives PMF)
        - "FW_009" # Positive-Signal Focus
      contradicts:
        - "[External: Revenue-first growth]"
      prerequisites: []
      enhances:
        - "FW_006" # Cross-Functional Alignment

    usability:
      prediction_power: "HIGH"
      explanation_power: "VERY HIGH"
      action_guidance: "HIGH"
      error_prevention: "VERY HIGH"

    evidence:
      - source: "Lenny's Podcast"
        quote: "Revenue tends not to be a good North Star metric... creates doom loop"
      - source: "Glasp Talk"
        quote: "North Star must reflect core customer value delivery"
      - source: "LogMeIn/Dropbox examples"
        pattern: "Word-of-mouth driven growth from value, not acquisition spend"

    unique_ellis_contribution: |
      Ellis articulates the "doom loop" concept explicitly and uses it to
      argue against revenue as North Star. The framing of revenue-focus
      as creating a negative spiral is his signature contribution.

  # ---------------------------------------------------------------------------
  # FRAMEWORK 6: CROSS-FUNCTIONAL ALIGNMENT PREREQUISITE
  # ---------------------------------------------------------------------------
  - framework_id: "FW_006"
    name: "Cross-Functional Alignment Prerequisite"
    type: "constraint"
    category: "Organizational"

    description:
      summary: |
        Growth fails when functions (Product, Marketing, Engineering) operate
        in silos. Alignment is a prerequisite, not an outcome. Workshop before
        work. Won't proceed without cross-functional buy-in.
      when_to_use:
        - "Starting any growth initiative"
        - "When diagnosing organizational growth failures"
        - "Building growth teams"
        - "Evaluating engagement viability"
      when_not_to_use:
        - "Solo founder pre-product"
        - "Very small teams without functional silos"

    formal_expression:
      rule: |
        BEFORE any_growth_work:
          REQUIRE alignment_workshop(all_functional_leads)
          IF NOT aligned:
            STOP - alignment is the blocker, not tactics

        WARNING: companies_over_100_employees have HIGH_SILO_PROBABILITY

    cross_domain_validation:
      original_domain: "Growth Consulting"
      validated_domains:
        - domain: "Product Development"
          works: true
          example: "Product + Marketing + Engineering on activation"
        - domain: "Strategy Implementation"
          works: true
          example: "North Star as alignment mechanism"
        - domain: "Change Management"
          works: true
          example: "Shared language before shared action"

    first_principles:
      core_axioms:
        - "Silos kill growth velocity"
        - "Alignment can't be retrofitted - must be designed in"
        - "Shared language enables shared action"

      necessary_conditions:
        - "Functional leads present and empowered"
        - "CEO/leadership buy-in"
        - "Time allocated (full day minimum)"

      inversion_insights:
        failure_mode: "Tactics without alignment"
        insight: "Companies over 100 employees almost always fail at growth hacking due to silos"
        prevention: "Contract-required workshop before any work"

    latticework_connections:
      complements:
        - "FW_002" # Simplicity (North Star as simple alignment tool)
        - "FW_010" # CEO Engagement Proxy
      contradicts:
        - "[External: Functional autonomy]"
      prerequisites: []
      enhances:
        - "FW_007" # Experimentation (aligned teams execute faster)

    usability:
      prediction_power: "HIGH"
      explanation_power: "HIGH"
      action_guidance: "VERY HIGH"
      error_prevention: "VERY HIGH"

    evidence:
      - source: "Lenny's Podcast"
        quote: "It's in my contract that's required up front for me to have a full day with the functional leads"
      - source: "LogMeIn"
        example: "CEO stopped all roadmap work for cross-functional activation focus"
      - source: "Mahmoud Khodor"
        quote: "Almost any business over 100 employees that tries to do growth hacking fails"

    unique_ellis_contribution: |
      Ellis makes alignment a CONTRACT REQUIREMENT - a unique commitment
      device that elevates alignment from "nice to have" to "non-negotiable."
      The 100-employee threshold is his empirical observation.

  # ---------------------------------------------------------------------------
  # FRAMEWORK 7: HIGH-TEMPO EXPERIMENTATION ENGINE
  # ---------------------------------------------------------------------------
  - framework_id: "FW_007"
    name: "High-Tempo Experimentation Engine"
    type: "pattern"
    category: "Operational"

    description:
      summary: |
        Experiment velocity directly correlates with learning and growth.
        More experiments = more learning = more growth. Systematic
        experimentation beats intuition.
      when_to_use:
        - "Growth team structure design"
        - "Resource allocation decisions"
        - "Performance evaluation"
        - "Culture building"
      when_not_to_use:
        - "Pre-PMF (experiments without PMF amplify randomness)"
        - "Crisis requiring focused action on single lever"

    formal_expression:
      rule: |
        growth_rate = f(experiment_velocity)

        TO increase velocity:
          1. Generate many ideas (use ChatGPT)
          2. Score with ICE
          3. Run experiments in parallel where possible
          4. Learn fast, kill fast
          5. Celebrate learning, not just wins

    cross_domain_validation:
      original_domain: "Growth Teams"
      validated_domains:
        - domain: "Product Development"
          works: true
          example: "Feature experiments"
        - domain: "Marketing"
          works: true
          example: "Channel/creative testing"
        - domain: "Personal Learning"
          works: partially
          example: "Trying new approaches"
          limitation: "Lower stakes, less structure needed"

    first_principles:
      core_axioms:
        - "Predictions are often wrong; experiments reveal truth"
        - "Learning compounds; more experiments = faster compounding"
        - "Failure is information, not loss"

      necessary_conditions:
        - "PMF validated (otherwise experiments are random)"
        - "Measurement infrastructure in place"
        - "Culture that celebrates learning, not just wins"

      inversion_insights:
        failure_mode: "Analysis paralysis"
        insight: "Companies that debate instead of test lose to those who test"
        prevention: "Default to experimentation; bet small, learn fast"

    latticework_connections:
      complements:
        - "FW_004" # ICE Prioritization
        - "FW_003" # Activation-First
      contradicts: []
      prerequisites:
        - "FW_001" # PMF validated first
      enhances:
        - "FW_005" # Value-Before-Revenue (experiments find value)

    usability:
      prediction_power: "HIGH"
      explanation_power: "HIGH"
      action_guidance: "VERY HIGH"
      error_prevention: "MEDIUM"

    evidence:
      - source: "Lenny's Podcast"
        quote: "Success at Amazon is a function of how many experiments we do"
      - source: "Dropbox"
        example: "Scripted first 10 experiments to de-risk culture building"
      - source: "GrowthHackers methodology"
        pattern: "Weekly experiment rhythm as core practice"

    unique_ellis_contribution: |
      Ellis operationalized experiment velocity with specific structures:
      scripted first 10 experiments, ICE scoring, weekly rhythm. The
      "scripted first 10" approach is his specific contribution to
      de-risking culture change.

  # ---------------------------------------------------------------------------
  # FRAMEWORK 8: ECONOMIC CONSTRAINT AS ADVANTAGE
  # ---------------------------------------------------------------------------
  - framework_id: "FW_008"
    name: "Economic Constraint as Advantage"
    type: "heuristic"
    category: "Strategic"

    description:
      summary: |
        Economic constraints (ROI requirements, payback windows) are beneficial
        because they force prioritization and prevent accepting marginal
        opportunities. More constraints → better focus → faster growth.
      when_to_use:
        - "Budget allocation decisions"
        - "Marketing spend discussions"
        - "Fundraising strategy"
        - "Resource allocation debates"
      when_not_to_use:
        - "Long-term brand building (different economics)"
        - "Strategic investments with intentionally delayed payback"

    formal_expression:
      rule: |
        IF economic_constraint_present:
          REFRAME as "focus mechanism" not "limitation"
          REQUIRE positive ROI within payback_window
          REJECT marginal opportunities

        COUNTER-INTUITIVE:
          constraints → focus → efficiency → faster_growth

    cross_domain_validation:
      original_domain: "Freemium Marketing"
      validated_domains:
        - domain: "Bootstrapped Startups"
          works: true
          example: "Focus creates competitive advantage"
        - domain: "Resource-Constrained Teams"
          works: true
          example: "Necessity drives creativity"
        - domain: "Personal Finance"
          works: partially
          example: "Budget constraints drive better choices"

    first_principles:
      core_axioms:
        - "Abundance creates waste; scarcity creates focus"
        - "ROI requirements are decision-making tools, not limitations"
        - "Easy money leads to lazy decisions"

      necessary_conditions:
        - "Constraints must be enforced, not aspirational"
        - "Team must understand constraints as feature, not bug"

      inversion_insights:
        failure_mode: "Unlimited budget"
        insight: "Unconstrained resources lead to accepting marginal opportunities"
        prevention: "Impose payback windows even when capital is available"

    latticework_connections:
      complements:
        - "FW_001" # PMF Gate (constraints prevent scaling before fit)
        - "FW_002" # Simplicity
      contradicts:
        - "[External: Growth at all costs]"
      prerequisites: []
      enhances:
        - "FW_007" # Experimentation (constraints force better experiments)

    usability:
      prediction_power: "MEDIUM"
      explanation_power: "HIGH"
      action_guidance: "HIGH"
      error_prevention: "MEDIUM"

    evidence:
      - source: "LogMeIn"
        example: "3-month payback window drove discipline"
      - source: "Lenny's Podcast"
        quote: "Economic constraints are a good thing. They can actually help you grow faster."
      - source: "Dropbox"
        example: "Cash flow positive during scaling"

    unique_ellis_contribution: |
      Ellis explicitly frames constraints as GOOD rather than limitations
      to overcome. This counter-intuitive reframe is his signature insight,
      backed by freemium economics experience.

  # ---------------------------------------------------------------------------
  # FRAMEWORK 9: POSITIVE-SIGNAL PRIORITY
  # ---------------------------------------------------------------------------
  - framework_id: "FW_009"
    name: "Positive-Signal Priority"
    type: "heuristic"
    category: "Product Strategy"

    description:
      summary: |
        Focus resources on understanding and amplifying what works (very
        disappointed users) rather than fixing all problems (somewhat
        disappointed users). Counter-intuitive but highly effective.
      when_to_use:
        - "Product roadmap prioritization"
        - "Survey feedback analysis"
        - "Resource allocation"
        - "PMF improvement efforts"
      when_not_to_use:
        - "Safety/security issues (always fix)"
        - "Mature products needing broad appeal"
        - "Regulatory compliance issues"

    formal_expression:
      rule: |
        PRIORITY:
          understand_why(very_disappointed_users_love_product) >
          fix_problems(somewhat_disappointed_users_report)

        RATIO: 80% amplify positive / 20% fix problems (inverse of intuition)

        INSIGHT: must-have experience comes from understanding love, not fixing complaints

    cross_domain_validation:
      original_domain: "Product Development"
      validated_domains:
        - domain: "PMF Improvement"
          works: true
          example: "Lookout: studied 7% who loved it, not 93% who didn't"
        - domain: "Customer Success"
          works: partially
          example: "Focus on power users for insights"
          limitation: "Can't ignore support needs entirely"
        - domain: "Marketing Messaging"
          works: true
          example: "Amplify what resonates, not fix what doesn't"

    first_principles:
      core_axioms:
        - "You can't fix your way to PMF"
        - "Positive signals reveal the must-have; problems obscure it"
        - "Resource allocation is zero-sum"

      necessary_conditions:
        - "Some users already love the product"
        - "Ability to identify 'very disappointed' segment"
        - "Courage to ignore majority of feedback"

      inversion_insights:
        failure_mode: "Chasing problems"
        insight: "Fixing problems dilutes the must-have experience"
        prevention: "Explicit ratio: 80% positive signal, 20% problem fixing"

    latticework_connections:
      complements:
        - "FW_001" # PMF Gate
        - "FW_005" # Value-Before-Revenue
      contradicts:
        - "[External: Listen to all customer feedback]"
      prerequisites: []
      enhances:
        - "FW_003" # Activation (activate to positive signal faster)

    usability:
      prediction_power: "HIGH"
      explanation_power: "VERY HIGH"
      action_guidance: "HIGH"
      error_prevention: "HIGH"

    evidence:
      - source: "Blog: Chasing Problems"
        quote: "It feels totally counterintuitive to pursue these positive signals while ignoring most of the feedback about problems"
      - source: "Lookout turnaround"
        example: "Studied the 7% intensely, ignored the 93%"
      - source: "PMF methodology"
        pattern: "Consistent advice across all sources"

    unique_ellis_contribution: |
      Ellis explicitly advocates IGNORING most user feedback - a
      counter-intuitive position that contradicts conventional "listen
      to customers" advice. The 80/20 inversion (80% positive, 20%
      problems) is his specific contribution.

  # ---------------------------------------------------------------------------
  # FRAMEWORK 10: CEO ENGAGEMENT PROXY
  # ---------------------------------------------------------------------------
  - framework_id: "FW_010"
    name: "CEO Engagement Proxy"
    type: "heuristic"
    category: "Success Prediction"

    description:
      summary: |
        CEO hands-on involvement strongly correlates with growth success.
        If CEO is disengaged, probability of success drops significantly.
        Use as filter for engagements and predictions.
      when_to_use:
        - "Evaluating engagement viability"
        - "Predicting success likelihood"
        - "Setting engagement requirements"
        - "Diagnosing organizational blockers"
      when_not_to_use:
        - "Very early stage (founder IS the whole team)"
        - "Delegated authority situations (clear empowerment)"

    formal_expression:
      rule: |
        IF ceo_engagement_level == "hands_on":
          success_probability = HIGH
        ELIF ceo_engagement_level == "delegated_but_supportive":
          success_probability = MEDIUM
        ELIF ceo_engagement_level == "disengaged":
          success_probability = LOW
          CONSIDER declining engagement

    cross_domain_validation:
      original_domain: "Growth Consulting"
      validated_domains:
        - domain: "Startup Investing"
          works: true
          example: "Founder commitment as investment signal"
        - domain: "Change Management"
          works: true
          example: "Executive sponsorship predicts success"
        - domain: "Organizational Health"
          works: true
          example: "Leadership engagement correlates with culture"

    first_principles:
      core_axioms:
        - "Top-down commitment signals organizational priority"
        - "CEO engagement removes blockers others can't remove"
        - "Proxy signals predict actual commitment"

      necessary_conditions:
        - "CEO exists and is identifiable"
        - "Engagement is measurable (actions, not words)"

      inversion_insights:
        failure_mode: "Working with disengaged leadership"
        insight: "Without CEO commitment, political blockers will kill initiative"
        prevention: "Use CEO engagement as acceptance filter"

    latticework_connections:
      complements:
        - "FW_006" # Cross-Functional Alignment
      contradicts: []
      prerequisites: []
      enhances:
        - "FW_011" # Authenticity Gate

    usability:
      prediction_power: "HIGH"
      explanation_power: "MEDIUM"
      action_guidance: "HIGH"
      error_prevention: "HIGH"

    evidence:
      - source: "GTM Vault"
        quote: "Founder CEOs all took a super hands-on role working with me"
      - source: "LogMeIn"
        example: "CEO stopped all roadmap work - hands-on engagement"
      - source: "Pattern across engagements"
        pattern: "Success correlates with CEO involvement"

    unique_ellis_contribution: |
      Ellis explicitly uses CEO engagement as a FILTER, not just an
      observation. The willingness to decline engagements based on
      this proxy is his unique commitment.

  # ---------------------------------------------------------------------------
  # FRAMEWORK 11: AUTHENTICITY GATE
  # ---------------------------------------------------------------------------
  - framework_id: "FW_011"
    name: "Authenticity Gate"
    type: "constraint"
    category: "Personal Integrity"

    description:
      summary: |
        Only teach, advise, or present on topics where you have direct
        practical experience. Decline opportunities outside expertise,
        even lucrative ones. Authenticity > authority.
      when_to_use:
        - "Speaking/presentation invitations"
        - "Advising opportunities"
        - "Content creation decisions"
        - "Topic selection for any public position"
      when_not_to_use:
        - "Learning contexts (exploring new areas privately)"
        - "Clearly labeled speculation"

    formal_expression:
      rule: |
        BEFORE accepting(speaking/advising/teaching opportunity):
          IF NOT has_direct_experience(topic):
            DECLINE opportunity OR
            HEDGE explicitly ("I don't have experience here")

        REPUTATION_PROTECTION > OPPORTUNITY_GAIN

    cross_domain_validation:
      original_domain: "Professional Speaking"
      validated_domains:
        - domain: "Consulting"
          works: true
          example: "Won't advise outside expertise"
        - domain: "Writing"
          works: true
          example: "Won't write AI book yet"
        - domain: "Career"
          works: true
          example: "Stayed in growth domain, didn't claim general authority"

    first_principles:
      core_axioms:
        - "Credibility is the practitioner's currency"
        - "Reputation damage compounds; opportunity gain is one-time"
        - "Experience can't be faked in Q&A"

      necessary_conditions:
        - "Clear self-assessment of expertise boundaries"
        - "Willingness to sacrifice short-term opportunity"

      inversion_insights:
        failure_mode: "Speaking outside expertise"
        insight: "Audience eventually discovers lack of depth"
        prevention: "Gate all public positions behind direct experience"

    latticework_connections:
      complements:
        - "FW_010" # CEO Engagement (both are commitment devices)
      contradicts:
        - "[External: Fake it till you make it]"
      prerequisites: []
      enhances:
        - "FW_002" # Simplicity (authenticity enables simple explanations)

    usability:
      prediction_power: "MEDIUM"
      explanation_power: "HIGH"
      action_guidance: "VERY HIGH"
      error_prevention: "VERY HIGH"

    evidence:
      - source: "Lenny's Podcast"
        quote: "I got invited to present on AI in China... I said no because I wasn't actually doing that much with AI myself"
      - source: "Book philosophy"
        quote: "I don't want to write a book on AI because in six months I'll look back and say what a stupid book"
      - source: "AI evolution"
        example: "Only started presenting on AI after 6 months of hands-on experience"

    unique_ellis_contribution: |
      Ellis declined a lucrative China AI presentation opportunity
      specifically because he lacked hands-on experience. This demonstrates
      a commitment device that prioritizes long-term reputation over
      short-term opportunity. The explicit articulation of this gate
      is his contribution.

