      framework: "FW_001"
      question: "Do we have PMF (40%+ very disappointed)?"
      gate: "If no → STOP, focus on product, not growth"

    - step: 2
      action: "ACTIVATE"
      framework: "FW_003"
      question: "Are users getting to the aha moment?"
      gate: "If activation broken → STOP, fix activation first"

    - step: 3
      action: "ALIGN"
      framework: "FW_006"
      question: "Are all functions rowing same direction?"
      gate: "If siloed → STOP, workshop before work"

    - step: 4
      action: "EXPERIMENT"
      frameworks: ["FW_004", "FW_007"]
      question: "Are we learning at high velocity?"
      gate: "If slow → increase experiment tempo with ICE"

    - step: 5
      action: "SCALE"
      frameworks: ["FW_005", "FW_008"]
      question: "Can we scale sustainably (value + economics)?"
      gate: "If unsustainable → constraints are your friend"

  constraints_throughout:
