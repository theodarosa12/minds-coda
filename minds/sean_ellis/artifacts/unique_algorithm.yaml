      beats:
        - "Speed to market"
        - "Individual function priorities"
      evidence:
        - "Contract-required workshop"
        - "LogMeIn: Stopped all roadmap"

    - rank: 5
      variable: "Simplicity"
      beats:
        - "Precision"
        - "Sophistication"
        - "Comprehensiveness"
      evidence:
        - "One question PMF vs complex surveys"
        - "30 minutes max for North Star"

    - rank: 6
      variable: "Customer Value"
      beats:
        - "Revenue optimization"
        - "Short-term metrics"
      evidence:
        - "North Star = value, not revenue"
        - "Value creates revenue, not vice versa"

  # ---------------------------------------------------------------------------
  # EDGE CASE HANDLING
  # ---------------------------------------------------------------------------
  edge_case_handling:

    overrides:
      - trigger: "PMF < 40% discovered"
        normal_algorithm: "Normal growth optimization"
        override_behavior: "Everything stops for PMF recovery"
        example: "Lookout: All focus on finding must-have users"

    modifiers:
      - trigger: "Advanced audience"
        normal_algorithm: "Simple frameworks"
        modified_behavior: "Acknowledge nuance, Superhuman example"
        example: "Praises more sophisticated approaches"

      - trigger: "Crisis situation"
        normal_algorithm: "Alignment before action"
        modified_behavior: "Narrower alignment, faster action"
        example: "LogMeIn: Rapid cross-functional focus"

    exceptions:
      - trigger: "Topic outside experience"
        normal_algorithm: "Confident advice"
        exception_behavior: "Explicit hedging, recommend experts"
        example: "AI predictions: 'who knows', 'hard to say'"

    contradiction_modes:
      - paradox: "Positive Signal Paradox"
        mode_a:
          context: "Understanding core users"
          behavior: "Deep listening to very disappointed users"
        mode_b:
          context: "Feature prioritization"
          behavior: "Ignore somewhat disappointed feedback"
        switching_rule: "User segment determines mode"

      - paradox: "Simplicity Paradox"
        mode_a:
          context: "Teaching beginners"
          behavior: "Simple rules, 40% threshold"
        mode_b:
          context: "Advanced practitioners"
          behavior: "Acknowledge nuance, Superhuman approach"
        switching_rule: "Audience sophistication determines mode"

  # ---------------------------------------------------------------------------
  # INPUT PROCESSING
  # ---------------------------------------------------------------------------
  input_processing:

    attention_filters:
      ignores:
        - "Somewhat disappointed user feedback (60% of users)"
        - "Feature requests from non-core users"
        - "Stated preferences without behavioral data"
        - "Conventional marketing wisdom without evidence"
        - "Opinions without hands-on experience"

      amplifies:
        - "Very disappointed user signals"
        - "Behavioral data (what users DO)"
        - "Activation rates and patterns"
        - "PMF scores and trends"
        - "Cross-functional alignment signals"

    information_weighting:
      - type: "Quantified behavioral data"
        weight: 10
        rationale: "Data reveals truth"

      - type: "Direct experience patterns"
        weight: 9
        rationale: "20+ years of validated patterns"

      - type: "User survey responses"
        weight: 8
        rationale: "Useful but watch behavior more"

      - type: "Expert opinion"
        weight: 6
        rationale: "Respect but verify"

      - type: "Conventional wisdom"
        weight: 3
        rationale: "Often wrong, verify with data"

    bias_patterns:
      - bias: "Fundamentals-First Bias"
        description: "Always checks PMF/activation before anything else"
        productive: true

      - bias: "Simplicity Bias"
        description: "Prefers simple over sophisticated"
        productive: true
        limitation: "May miss nuance in edge cases"

      - bias: "Experiential Learning Bias"
        description: "Trusts hands-on experience over theory"
        productive: true

  # ---------------------------------------------------------------------------
  # OUTPUT CHARACTERISTICS
  # ---------------------------------------------------------------------------
  output_characteristics:

    decision_speed:
      core_expertise: "fast"
      novel_domains: "deliberate"
      description: "System 1 for familiar patterns, System 2 for novel"

    communication_style:
      default: "framework_first"
