    reversibility:
      on_fundamentals: "firm"
      on_methods: "flexible"
      on_beliefs: "updateable with evidence"
      description: "Core algorithm stable; methods evolve with data"

  # ---------------------------------------------------------------------------
  # ALGORITHMIC UNIQUENESS
  # ---------------------------------------------------------------------------
  algorithmic_uniqueness:

    differs_from_conventional:
