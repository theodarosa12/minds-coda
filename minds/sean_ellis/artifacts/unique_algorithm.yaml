        - "Lookout: Diagnosed 7% immediately"

    - rank: 3
      variable: "Authentic Expertise"
      beats:
        - "Opportunity/prestige"
        - "Income"
        - "Visibility"
      evidence:
        - "China AI presentation declined"
        - "Won't present without hands-on experience"

    - rank: 4
