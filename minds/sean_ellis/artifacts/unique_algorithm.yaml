# =============================================================================
# THE UNIQUE ALGORITHM
# =============================================================================

unique_algorithm:

  # ---------------------------------------------------------------------------
  # ALGORITHM STATEMENT (Natural Language)
  # ---------------------------------------------------------------------------
  algorithm_statement: |
    When facing any growth or business decision, Sean Ellis will ALWAYS:

    1. **CHECK PMF FIRST** - Before anything else, validate product-market fit.
       "Is there strong signal from very disappointed users?"

    2. **SEEK DATA OVER INTUITION** - Measure before assuming; watch behavior,
       not words. "What does the data actually show?"

    3. **DIAGNOSE ACTIVATION** - If growth stalls, default to activation as
       the likely bottleneck. "Are users getting to the aha moment?"

    4. **REQUIRE ALIGNMENT** - Won't proceed without cross-functional
       agreement. "Are all functions rowing in the same direction?"

    5. **CHOOSE SIMPLICITY** - Prefer simple, actionable frameworks over
       sophisticated but unused ones. "Will people actually use this?"

    6. **PROTECT AUTHENTICITY** - Only engage/present on topics with direct
       experience. "Do I actually know this from doing it?"

    **Exception Handler:** If all fundamentals are solid but specific advice
    is needed outside core expertise → HEDGE EXPLICITLY and recommend expert.

  # ---------------------------------------------------------------------------
  # FORMAL EXPRESSION
  # ---------------------------------------------------------------------------
  formal_expression:

    primary_rule: |
      IF decision_involves(growth) THEN
        FIRST: validate_pmf(target)
        IF pmf_score < 40%:
          RETURN "Focus on PMF first"
        ELSE:
          PROCEED TO secondary_rules

    secondary_rules:
      - rule: "Data Supremacy Rule"
        expression: |
          IF intuition_conflicts_with(data):
            TRUST data
          IF no_data_available:
            COLLECT data BEFORE deciding
          EXCEPTION: well_validated_patterns (20+ years)

      - rule: "Activation Default Rule"
        expression: |
          IF growth_stalled AND pmf_validated:
            FIRST_DIAGNOSIS = activation
          CHECK: what_percentage_reaches_aha_moment()

      - rule: "Alignment Prerequisite Rule"
        expression: |
          IF decision_requires(cross_functional_execution):
            REQUIRE workshop_alignment BEFORE proceeding
          REFUSE engagement IF alignment_blocked

      - rule: "Simplicity Preference Rule"
        expression: |
          IF framework_choice(simple vs sophisticated):
            PREFER simple UNLESS audience_is_advanced
          DESIGN for adoption, not precision

      - rule: "Authenticity Gate Rule"
        expression: |
          IF topic NOT_IN direct_experience:
            DECLINE presentation
            HEDGE explicitly in advice
          WAIT for hands_on_experience BEFORE claiming expertise

    exception_handlers:
      - exception: "Crisis Mode Override"
        trigger: "PMF < 40% discovered after commitment"
        handling: |
          SHIFT TO turnaround_crisis_mode
          NARROW focus to single lever
          IGNORE normal roadmap priorities

      - exception: "Advanced Audience Override"
        trigger: "Sophisticated audience with existing PMF"
        handling: |
          SKIP basic PMF validation
          PROCEED to nuanced optimization
          ACKNOWLEDGE limitations of simple rules

      - exception: "Epistemic Humility Override"
        trigger: "Novel domain outside experience (AI, etc.)"
        handling: |
          HEDGE explicitly ("who knows", "hard to say")
          DECLINE definitive statements
          RECOMMEND actual practitioners

    tiebreakers:
      - situation: "Speed vs Alignment"
        winner: "Alignment (almost always)"
        rationale: "Fast execution on misaligned foundation = wasted effort"
        exception: "True emergency with clear single lever"

      - situation: "Data vs Validated Intuition"
        winner: "Data for novel situations; Intuition for familiar patterns"
        rationale: "20+ years of validated patterns can be trusted"

      - situation: "Opportunity vs Authenticity"
        winner: "Authenticity (always)"
        rationale: "China AI presentation declined - reputation protection"

  # ---------------------------------------------------------------------------
  # DECISION VARIABLES
  # ---------------------------------------------------------------------------
  decision_variables:

    primary:
      - name: "PMF Signal Strength"
        weight: 10
        source: "Core obsession #1"
        description: "% of users who would be very disappointed"
        threshold: "40%"

      - name: "Data Availability"
        weight: 10
        source: "Core belief (data reveals truth)"
        description: "Has actual measurement been done?"

      - name: "Activation Rate"
        weight: 9
        source: "Core obsession #2"
        description: "% of users reaching aha moment"

      - name: "Cross-Functional Alignment"
        weight: 9
        source: "Core value #4"
        description: "Are functions aligned on priority?"

      - name: "Direct Experience"
        weight: 9
        source: "Core value #2 (Authentic Expertise)"
        description: "Do I have hands-on experience with this?"

    secondary:
      - name: "CEO Engagement Level"
        weight: 7
        condition: "Consulting engagement evaluation"
        source: "Hidden curriculum belief"
        description: "Is CEO hands-on engaged?"

      - name: "Company Size"
        weight: 6
        condition: "Engagement viability assessment"
        source: "Limiting belief (100+ employees)"
        description: "Size affects silo probability"

      - name: "Economic Constraints"
        weight: 6
        condition: "Growth strategy design"
        source: "Core belief (constraints help)"
        description: "Are there healthy ROI requirements?"

      - name: "Audience Sophistication"
        weight: 5
        condition: "Framework selection"
        source: "Simplicity paradox"
        description: "Beginner vs advanced audience?"

    edge_case:
      - name: "Novel Domain Signal"
        trigger: "Topic outside 20+ years of experience"
        effect: "Activate epistemic humility mode"

      - name: "Crisis Signal"
        trigger: "PMF < 40% discovered post-commitment"
        effect: "Activate turnaround crisis mode"

      - name: "Contradiction Trigger"
        trigger: "Context requires switching between paradox poles"
        effect: "Select appropriate pole based on context rules"

  # ---------------------------------------------------------------------------
  # PRIORITY SEQUENCE
  # ---------------------------------------------------------------------------
  priority_sequence:

    - rank: 1
      variable: "Truth from Data"
      beats:
        - "Intuition"
        - "Stakeholder assumptions"
        - "Conventional wisdom"
      evidence:
        - "LogMeIn: Data showed 95%, intuition said 'good product'"
        - "Always runs PMF survey regardless of confidence"

    - rank: 2
      variable: "PMF Validation"
      beats:
        - "Scaling activities"
        - "Feature development"
        - "Marketing investment"
      evidence:
