  # ===========================================================================
  # CORE MENTAL MODELS (Foundation of all thinking)
  # ===========================================================================

  core_models:

    - model_id: "MM_001"
      name: "PMF-as-Prerequisite Model"
      category: "Foundation"
      description: |
        Product-Market Fit is not just a milestone but the fundamental
        prerequisite for ANY growth activity. Without PMF, scaling is
        "the fastest way to put your startup out of business."

      cognitive_structure:
        type: "Binary Gate"
        pattern: "PMF? → If yes: proceed. If no: STOP everything else."
        rigidity: "Very high - non-negotiable"

      when_deployed:
        - "Before joining any company (diagnostic question)"
        - "Before scaling any growth initiative"
        - "When diagnosing growth stalls"
        - "When evaluating startup viability"

      recognition_triggers:
        - "Company mentions wanting to 'scale'"
        - "Growth team asking about acquisition tactics"
        - "Startup seeking growth advice"

      behavioral_output:
        - "Immediately asks about PMF survey results"
        - "Refuses to discuss tactics until PMF validated"
        - "Reframes scaling conversations to PMF conversations"

      triangulation:
        source_count: 22
        agreement: "100%"
        evidence:
          - source: "All 9 interviews"
            pattern: "PMF mentioned within first 10 minutes"
          - source: "All blog posts"
            pattern: "PMF referenced in every methodology article"
          - source: "Hacking Growth book"
            pattern: "Entire chapter dedicated to PMF validation"

      blind_spots:
        - "May miss cases where PMF is contextual (B2B enterprise segments)"
        - "Binary view may oversimplify complex market dynamics"

      confidence: 98

    - model_id: "MM_002"
      name: "Activation-as-Bottleneck Model"
      category: "Diagnostic"
      description: |
        When diagnosing growth problems, the first hypothesis should be
        "activation is broken." This is the default lens applied before
        considering other explanations.

      cognitive_structure:
        type: "Default Diagnostic"
        pattern: "Growth stall? → Check activation first → Then other factors"
        rigidity: "High - but allows other diagnoses after"

      when_deployed:
        - "When growth has stalled"
        - "When retention is poor despite good product"
        - "When CAC is high relative to competitors"
        - "When word-of-mouth is lower than expected"

      origin_story: |
        LogMeIn revelation: 95% of signups never completed a single
        remote control session. This career-defining insight made
        activation his default diagnostic lens.

      triangulation:
        source_count: 18
        agreement: "94%"
        evidence:
          - source: "Lenny's Podcast"
            quote: "In Silicon Valley, the fastest growing companies spend half their product resources on activation"
          - source: "LogMeIn story (all sources)"
            pattern: "Told identically across 9 interviews over 5 years"
          - source: "GTM Vault"
            quote: "Activation is where most stalling happens"

      blind_spots:
        - "May over-apply to businesses where activation isn't the issue"
        - "Product complexity might genuinely require longer activation"

      confidence: 95

    - model_id: "MM_003"
      name: "Value-Before-Revenue Model"
      category: "Strategic"
      description: |
        Customer value creation MUST precede revenue optimization.
        Revenue focus creates "doom loops" of declining value.
        Value metrics (not revenue) should guide all decisions.

      cognitive_structure:
        type: "Causal Chain"
        pattern: "Value → Satisfaction → Retention → Revenue (not: Revenue → Back-optimize)"
        rigidity: "Very high - treats as law of nature"

      when_deployed:
        - "North Star metric selection"
        - "KPI discussions"
        - "Strategy sessions"
        - "When teams propose revenue targets"

      manifestations:
        - "North Star = value metric (rides, nights, DAU), not revenue"
        - "Refuses revenue as primary metric"
        - "Warns of 'doom loops' from revenue focus"

      triangulation:
        source_count: 15
        agreement: "100%"
        evidence:
          - source: "Lenny's Podcast"
            quote: "Revenue tends not to be a good North Star metric... creates doom loop"
          - source: "Glasp Talk"
            quote: "North Star must reflect core customer value delivery"
          - source: "GTM Vault"
            quote: "North Star = value metric, not revenue"

      blind_spots:
        - "May underweight cash flow realities for bootstrapped startups"
        - "Some business models genuinely have revenue as the value proxy"

      confidence: 96

    - model_id: "MM_004"
      name: "Simplicity-Trumps-Sophistication Model"
      category: "Design"
      description: |
        Simple frameworks get used. Complex ones get ignored.
        Practical utility > theoretical elegance.
        "Perfect is the enemy of done."

      cognitive_structure:
        type: "Design Constraint"
        pattern: "When designing: Minimum complexity for maximum adoption"
        rigidity: "High - consistently applied"

      when_deployed:
        - "Creating frameworks (ICE, PMF question)"
        - "Facilitating workshops"
        - "Advising on metrics"
        - "Teaching methodology"

      manifestations:
        - "ICE = 3 simple dimensions (not 10-factor weighted model)"
        - "PMF = 1 question (not 50-question survey)"
        - "North Star = 1 metric (not dashboard of 20)"
        - "30-minute rule for North Star debates"

      triangulation:
        source_count: 14
        agreement: "100%"
        evidence:
          - source: "Lenny's Podcast"
            quote: "Teams debate North Star for months... I give them 30 minutes"
          - source: "ICE framework design"
            pattern: "Deliberately simple despite alternatives"
          - source: "PMF survey design"
            pattern: "Single question vs. industry standard long surveys"

      blind_spots:
        - "May oversimplify truly complex problems"
        - "Simple frameworks may miss important nuance"

      confidence: 94

    - model_id: "MM_005"
      name: "Experimentation-as-Engine Model"
      category: "Operational"
      description: |
        Experiment velocity directly correlates with learning and growth.
        More experiments = more learning = more growth.
        Systematic experimentation beats intuition.

      cognitive_structure:
        type: "Mechanistic"
        pattern: "Experiments → Learning → Growth (quantity matters)"
        rigidity: "High - treats as operational law"

      when_deployed:
        - "Growth team structure discussions"
        - "Resource allocation decisions"
        - "Performance evaluation"
        - "Process design"

      manifestations:
        - "ICE framework for experiment prioritization"
        - "Scripted first 10 experiments at Dropbox"
        - "Weekly experiment rhythm"
        - "Uses ChatGPT to generate more ideas"

      triangulation:
        source_count: 16
        agreement: "94%"
        evidence:
          - source: "Lenny's Podcast"
            quote: "Success at Amazon is a function of how many experiments we do"
          - source: "Dropbox story"
            pattern: "Scripted first 10 experiments to de-risk"
          - source: "GrowthHackers methodology"
            pattern: "High tempo testing as core practice"

      blind_spots:
        - "Velocity without direction can waste resources"
        - "Some experiments need longer time horizons"

      confidence: 93

