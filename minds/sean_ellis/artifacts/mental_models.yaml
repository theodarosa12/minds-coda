# =============================================================================
# FOCUSED vs DIFFUSE MODE ANALYSIS (Oakley Framework)
# =============================================================================

thinking_modes:

  focused_mode:
    description: "Concentrated, analytical, sequential thinking"

    when_dominant:
      - "Running PMF survey analysis"
      - "Scoring experiments with ICE"
      - "Analyzing retention cohorts"
      - "Executing workshop protocols"
      - "Explaining established frameworks"

    characteristics:
      - "High precision with numbers (40%, 95%, 10x)"
      - "Systematic checklist approach"
      - "Framework-first answering"
      - "Consistent story delivery"

    cognitive_load: "Low for established frameworks (highly chunked)"

  diffuse_mode:
    description: "Relaxed, creative, big-picture thinking"

    when_dominant:
      - "Generating experiment ideas"
      - "Workshop facilitation (reading room dynamics)"
      - "Recognizing patterns across companies"
      - "Synthesizing frameworks from experience"

    characteristics:
      - "Open to unexpected connections"
      - "Uses ChatGPT as diffuse-mode amplifier"
      - "Reflective synthesis after engagements"

    cognitive_load: "Higher - pattern recognition across contexts"

  mode_transitions:
    focused_to_diffuse:
      - trigger: "Question outside expertise (AI)"
        transition: "Immediate shift to uncertainty, hedging"
      - trigger: "Stuck on growth problem"
        transition: "Steps back to look for patterns"

    diffuse_to_focused:
      - trigger: "Question about PMF/activation/ICE"
        transition: "Immediate framework deployment"
      - trigger: "Data available for analysis"
        transition: "Systematic analysis mode"

# =============================================================================
# CHUNKING ANALYSIS
# =============================================================================

chunking_profile:

  highly_chunked_knowledge:
    description: "Automated, instantly retrievable knowledge sequences"

    examples:
      - chunk: "PMF Test Protocol"
        components: ["Question", "40% threshold", "Sample requirements", "Interpretation"]
        retrieval_time: "Instant - System 1"

      - chunk: "ICE Framework"
        components: ["Impact", "Confidence", "Ease", "Scoring method"]
        retrieval_time: "Instant - System 1"

      - chunk: "LogMeIn Story"
        components: ["95% abandonment", "CEO stopped roadmap", "3 months to fix", "10x improvement"]
        retrieval_time: "Instant - told identically every time"

      - chunk: "Activation Diagnosis"
        components: ["Check first", "Silicon Valley insight", "Marketing + Product together"]
        retrieval_time: "Instant - default diagnostic"

  working_memory_strategies:
    external_aids:
      - "Written frameworks (ICE, PMF)"
      - "Workshop documentation"
      - "ChatGPT for ideation overflow"

    grouping_strategies:
      - "3 dimensions for ICE (within working memory limits)"
      - "Single metric for North Star (reduces cognitive load)"
      - "One question for PMF (simplest possible)"

    cognitive_load_distribution:
      - "Offloads ideation to ChatGPT"
      - "Uses workshops to distribute thinking across team"
      - "Simple frameworks reduce individual load"

# =============================================================================
# MODEL BLIND SPOTS (Einstellung Effect)
# =============================================================================

blind_spots:

  systematic_blind_spots:
    - domain: "B2B Enterprise"
      blind_spot: "PMF threshold may not apply to high-touch enterprise sales"
      evidence: "Most examples are B2C or SMB SaaS"

    - domain: "Deep Tech"
      blind_spot: "Long development cycles don't fit rapid experimentation"
      evidence: "Framework examples all fast-iteration products"

    - domain: "Creative Products"
      blind_spot: "Artistic value may not be measurable via PMF survey"
      evidence: "All examples are utility/productivity focused"

  einstellung_risks:
    - "May apply activation diagnosis when problem is elsewhere"
    - "May oversimplify genuinely complex situations"
    - "PMF-first thinking may delay exploration in novel markets"
    - "Simple framework preference may miss important nuance"

