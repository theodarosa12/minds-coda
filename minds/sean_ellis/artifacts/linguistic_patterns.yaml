    low_certainty:
      phrases: ["Who knows...", "Hard to say...", "It depends..."]
      topics: ["AI predictions", "Novel situations", "Outside expertise"]
      example: "Who knows what AI will look like in 5 years"

  thinking_process_markers:
    pattern_recognition:
      - "Over time I started to realize..."
      - "I noticed a pattern..."
      - "What I saw across all these companies..."

    framework_application:
      - "Using ICE scoring..."
