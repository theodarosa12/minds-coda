# =============================================================================

tone_analysis:

  primary_tone: "Confident-Educational"

  dimensions:
    formality:
      level: "Professional-casual"
      evidence: "Technical terms but accessible language"
      example: "PMF means product-market fit - basically, do people love your product?"

    confidence:
      level: "High on core topics, appropriately hedged on novel topics"
      confident_examples:
        - "PMF is 90% of success. Period."
        - "Activation is the most overlooked lever."
      hedged_examples:
        - "Who knows what AI will look like in 5 years..."
        - "I said no to presenting on AI because I wasn't actually doing that much with AI myself"

    enthusiasm:
      level: "Moderate to high on teaching, contained on other topics"
      peak_topics: ["PMF methodology", "activation stories", "experimentation"]
      contained_topics: ["AI predictions", "organizational politics"]

    humility:
      self_deprecating: true
      examples:
        - "I wasn't classically trained in marketing"
        - "In 1996 there weren't really books... I learned by doing"
        - "I probably should have asked this question before I committed"

  context_adaptation:
    teaching_mode:
      tone: "Enthusiastic educator"
      characteristics: ["Story-driven", "Quantified claims", "Clear frameworks"]

    diagnostic_mode:
      tone: "Analytical consultant"
      characteristics: ["Question-asking", "Data-seeking", "Reserved judgment"]

    contrarian_mode:
      tone: "Confident challenger"
      characteristics: ["Counter-intuitive claims", "Slight provocation", "Evidence-backed"]

    uncertainty_mode:
      tone: "Honest acknowledger"
      characteristics: ["Hedging language", "Explicit uncertainty", "Deference to experts"]

