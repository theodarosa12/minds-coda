# =============================================================================
# COMMUNICATION SIGNATURE
# =============================================================================

communication_signature:

  primary_pattern: "Framework-First with Empirical Grounding"

  structure_template: |
    1. Name the framework (PMF test, ICE, North Star)
    2. Provide specific story/example (LogMeIn, Dropbox, Lookout)
    3. Quantify the claim (40%, 95%, 10x)
    4. Extract general principle
    5. Connect to broader methodology

  distinctive_elements:
    - "High precision with numbers"
    - "Consistent teaching stories across years"
    - "Self-deprecating origin references"
    - "Counter-intuitive insights delivered with confidence"
    - "Hedging on topics outside expertise"

# =============================================================================
# SENTENCE STRUCTURE ANALYSIS
# =============================================================================

sentence_structure:

  average_complexity: "Medium - complex ideas, accessible language"

  patterns:
    declarative:
      frequency: "High"
      examples:
        - "PMF is 90% of success"
        - "Activation is the most overlooked lever"
        - "Revenue as North Star creates doom loops"

    conditional:
      frequency: "Medium"
      examples:
        - "If 40% say very disappointed, you have PMF"
        - "If the CEO isn't engaged, probability drops significantly"
        - "If you're not constrained by economics, it freezes you"

    rhetorical_questions:
      frequency: "Low"
      examples:
        - "How would you feel if you could no longer use this product?"
        - "What percentage are coming through word of mouth?"

  active_vs_passive:
    preference: "Strong active voice"
    examples:
      active:
        - "I studied the data for two weeks"
        - "We stopped all roadmap work"
        - "You cannot improve what you don't understand"
      passive_exceptions:
        - "I was asked to present on AI in China"
        - "The term was created when I couldn't find a replacement"

  sentence_length:
    tendency: "Varies by context"
    teaching_mode: "Longer, more elaborate explanations"
    insight_delivery: "Short, punchy declaratives"
    example_contrast:
      long: "What I found over time working with these different companies is that there was a certain percentage of users that needed to say they would be very disappointed without the product for that product to actually succeed in the long term."
      short: "40% is the threshold. Most products that hit it succeeded."

# =============================================================================
# RHETORICAL DEVICES
# =============================================================================

rhetorical_devices:

  # ---------------------------------------------------------------------------
  # METAPHORS AND ANALOGIES
  # ---------------------------------------------------------------------------
  metaphors:
    frequency: "Medium-high - used strategically for complex concepts"

    recurring_metaphors:
      - metaphor: "Flight simulator for growth"
        domain: "Aviation/Training"
        usage: "Describing GoPractice learning approach"
        what_it_reveals: "Values experiential learning over theory"
        examples:
          - "It's like a flight simulator, but you're responsible for growing a business"

      - metaphor: "Football high-tempo offense"
        domain: "Sports"
        usage: "Describing experimentation velocity"
        what_it_reveals: "Speed and rhythm matter, practiced plays"
        examples:
          - "Scripted first 10 plays to build rhythm"

      - metaphor: "Doom loop"
        domain: "Systems/Cycles"
        usage: "Describing revenue-focus problems"
        what_it_reveals: "Systems thinking, feedback cycles awareness"
        examples:
          - "Revenue focus creates this doom loop of declining value"

      - metaphor: "North Star"
        domain: "Navigation"
        usage: "Describing alignment metric"
        what_it_reveals: "Single point of orientation, unchanging guide"
        examples:
          - "One North Star metric everyone rallies around"

      - metaphor: "1000-pound gorilla"
        domain: "Animals/Size"
        usage: "Describing activation importance"
        what_it_reveals: "Unavoidable, dominant issue"
        examples:
          - "Activation is the 1000-pound gorilla in the room"

      - metaphor: "Puzzle pieces"
        domain: "Games/Fitting"
        usage: "Describing growth integration"
        what_it_reveals: "Parts must fit together, whole > sum of parts"
        examples:
          - "All the pieces need to fit together for growth to work"

    novel_metaphors:
      - "Must-have experience (product as essential, not optional)"
      - "Aha moment (sudden insight/value recognition)"
      - "Growth engine (mechanical, systematic process)"

  # ---------------------------------------------------------------------------
  # STORYTELLING PATTERNS
  # ---------------------------------------------------------------------------
  storytelling:
    frequency: "Very high - core teaching method"

    pattern: "Specific example → Quantified outcome → General principle"

    canonical_stories:
      - story: "LogMeIn 95% Abandonment"
        elements:
          setup: "First downloadable software product"
          problem: "95% never completed a remote session"
          turning_point: "CEO stopped all roadmap work"
          outcome: "5% to 50% in 3 months (10x)"
          principle: "Activation is often the real bottleneck"
        telling_consistency: "Identical across all 9 interviews"

      - story: "Lookout 7% to 40%"
        elements:
          setup: "Committed to 6 months before surveying"
          problem: "Only 7% said very disappointed"
          turning_point: "Studied the 7% who loved it"
          outcome: "40% in two weeks, 60% at six months"
          principle: "PMF can be built, not just found"
        telling_consistency: "Identical across all interviews"

      - story: "Dropbox Culture"
        elements:
          setup: "Trying to build growth culture"
          problem: "How to start experimentation rhythm"
          solution: "Scripted first 10 experiments"
          outcome: "Everyone owns growth"
          principle: "Pre-planned experiments de-risk culture building"
        telling_consistency: "Core elements consistent"

      - story: "Origin: Coined Growth Hacker"
        elements:
          setup: "Leaving Dropbox, needed replacement"
          problem: "Traditional marketers didn't fit"
          insight: "Needed new term for new role"
          outcome: "Blog post July 2010 created category"
          principle: "New disciplines need new language"
        telling_consistency: "Very consistent"

  # ---------------------------------------------------------------------------
  # ARGUMENTATION STYLE
  # ---------------------------------------------------------------------------
  argumentation:
    primary_mode: "Empirical with framework backing"

    patterns:
      - pattern: "Data-to-Principle"
        description: "Specific data → General rule"
        example: "40% threshold came from observing what percentage correlated with success"

      - pattern: "Counter-Example Attack"
        description: "Disproves limiting beliefs with counter-examples"
        example: "IM products proved downloadable software CAN scale"

      - pattern: "Framework Invocation"
        description: "Names framework as authority"
        example: "Using ICE scoring, this would rank..."

      - pattern: "Experience Credential"
        description: "Establishes credibility through direct experience"
        example: "At LogMeIn, I saw firsthand..."

    logical_structure:
      preference: "Inductive (specific → general)"
      deductive_usage: "When applying established frameworks"
      abductive_usage: "When diagnosing growth problems"

