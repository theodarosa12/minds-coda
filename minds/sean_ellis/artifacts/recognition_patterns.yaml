cross_domain_patterns:

  - pattern_name: "Funnel Thinking"
    origin_domain: "Cold call sales (early career)"
    transferred_to:
      - "Marketing funnel optimization"
      - "Activation analysis"
      - "Experimental design"
      - "PMF methodology"
    success_rate: "Very high"
    mechanism: |
      Cold calling required tracking numbers (100 calls → 10 meetings → 3 sales).
      This funnel mindset transferred directly to digital marketing and growth.
    evidence:
      - "Glasp Talk: 'I had maybe two years in sales roles. Very funnel oriented. You get used to working the numbers.'"
      - "Applied to LogMeIn: tracked signup → activation → usage → payment"

  - pattern_name: "Economic Constraint Discipline"
    origin_domain: "Self-funded mindset (investor in own companies)"
    transferred_to:
      - "ROI-focused marketing"
      - "Experiment prioritization"
      - "Resource allocation"
      - "Startup advising"
    success_rate: "Very high"
    mechanism: |
      Personal financial stake created discipline that became methodology.
      'If I spend $1, I need to get back at least $1' became universal principle.
    evidence:
      - "Glasp Talk: 'I really wanted to make sure I wasn't wasting money'"
      - "Applied as teaching: 'Economic constraints are actually a good thing'"

  - pattern_name: "Learning Through Breaking"
    origin_domain: "NYU marketing course failure"
    transferred_to:
      - "Distrust of formal education"
      - "Experiential learning preference"
      - "Practical over theoretical"
      - "Testing over assuming"
    success_rate: "High"
    mechanism: |
      Formal education made him worse at his job. This created permanent
      orientation toward practical experience over theoretical knowledge.
    evidence:
      - "Glasp Talk: 'When I went back and tried to actually apply the learnings... I became much worse at my job'"
      - "Applied to AI: Won't present without direct experience"

  - pattern_name: "Single Lever Focus"
    origin_domain: "LogMeIn activation crisis"
    transferred_to:
      - "Turnaround methodology"
      - "Lookout PMF fix"
      - "Workshop facilitation"
      - "Consulting approach"
    success_rate: "Very high"
    mechanism: |
      When 95% abandonment was discovered, CEO stopped all roadmap work.
      Focusing entire company on single problem became template.
    evidence:
      - "LogMeIn: 'CEO stopped all roadmap work... entire company on activation'"
      - "Lookout: 'Focused on understanding positive signal' → 7% to 40%"

  - pattern_name: "Name It to Change It"
    origin_domain: "'Growth hacking' naming"
    transferred_to:
      - "Framework naming (ICE, PMF Test)"
      - "North Star metric concept"
      - "Workshop outputs"
    success_rate: "High"
    mechanism: |
      Recognized that naming something new avoids unwinnable arguments
      with established practices. Name creates category.
    evidence:
      - "Glasp Talk: 'Give it a different name... within short time thousands of jobs'"
      - "Applied to PMF: 'Sean Ellis Test' became industry standard"

  - pattern_name: "Chemistry as Proxy"
    origin_domain: "Early company choices"
    transferred_to:
      - "Investment decisions"
      - "Client selection"
      - "Team building"
    success_rate: "High"
    mechanism: |
      Recognized that startups often fail, so enjoying the team is non-negotiable.
      Chemistry became formal selection criterion.
    evidence:
      - "Glasp Talk: 'Chemistry is usually my most important factor'"
      - "Applied to Ring, Connectifier investments"

