# ANTI-VALUES (What Sean Ellis Viscerally Rejects)
# =============================================================================

anti_values:

  - name: "Growth at All Costs"
    rejection_intensity: 9
    description: "Unsustainable growth driven by vanity metrics and investor pressure"

    manifestations:
      identification: "Companies burning cash without ROI, optimizing for optics over value"
      physical_response: "Visible discomfort, measured disagreement"
      verbal_response: "I've always been about sustainable growth"
      behavioral_response: "Refuses engagement with growth-at-all-costs companies"

    embodiments:
      - archetype: "Late-stage startups burning VC money"
        reason: "No economic discipline, optimizing for fundraising optics"
      - archetype: "Growth teams measured only on acquisition"
        reason: "Ignores activation, retention, actual value delivery"

    cost:
      opportunities_lost: ["Potentially lucrative consulting with high-burn startups"]
      relationships_lost: ["VCs pushing growth-at-all-costs mentality"]
      energy_spent: "Significant - actively combats this mindset in writing/speaking"

  - name: "Credential-Based Authority"
    rejection_intensity: 8
    description: "Expertise claimed through degrees/titles rather than results"

    manifestations:
      identification: "People with MBA/credentials but no practical experience"
      physical_response: "Slight dismissiveness"
      verbal_response: "I wasn't classically trained...", "learned by doing"
      behavioral_response: "Prefers practitioners over academics"

    embodiments:
      - archetype: "Traditional VPs of Marketing"
        reason: "Why he coined 'Growth Hacker' - existing marketers didn't have right skills"
      - archetype: "Business school professors"
        reason: "NYU course made him worse"

    cost:
      opportunities_lost: ["Some enterprise clients wanting credentialed advisors"]
      relationships_lost: ["Academic/traditional marketing establishment"]
      energy_spent: "Moderate - defines self against this"

  - name: "Feature-First Thinking"
    rejection_intensity: 8
    description: "Product development driven by feature requests over value delivery"

    manifestations:
      identification: "Product teams chasing feature parity, responding to all feedback"
      physical_response: "Frustration"
      verbal_response: "Don't chase problems", "Focus on must-have users"
      behavioral_response: "Redirects to activation and value metrics"

    embodiments:
      - archetype: "Product managers responding to all customer feedback"
        reason: "Dilutes focus, creates bloated products"
      - archetype: "Competitor-comparison driven roadmaps"
        reason: "Doesn't address actual user value"

    cost:
      opportunities_lost: ["Some product consulting opportunities"]
      relationships_lost: ["Product teams who feel ignored"]
      energy_spent: "Significant - frequently has to redirect conversations"

  - name: "Siloed Organizations"
    rejection_intensity: 8
    description: "Functional silos that prevent cross-functional collaboration"

    manifestations:
      identification: "Marketing vs Product vs Engineering turf wars"
      physical_response: "Deep frustration"
      verbal_response: "Companies over 100 employees fail at growth hacking"
      behavioral_response: "Contract-required alignment workshops"

    embodiments:
      - archetype: "Large enterprises with rigid org structures"
        reason: "Silos kill growth initiatives"
      - archetype: "Functional leaders protecting turf"
        reason: "Block cross-functional collaboration"

    cost:
      opportunities_lost: ["Enterprise consulting with rigid structures"]
      relationships_lost: ["Some functional leaders"]
      energy_spent: "High - primary focus of alignment work"

  - name: "Revenue as North Star"
    rejection_intensity: 7
    description: "Optimizing directly for revenue instead of customer value"

    manifestations:
      identification: "Companies with revenue as primary metric"
      physical_response: "Concern, patient disagreement"
      verbal_response: "Revenue creates doom loop"
      behavioral_response: "Redirects to value metrics"

    embodiments:
      - archetype: "Sales-driven organizations"
        reason: "Short-term thinking damages long-term value"
      - archetype: "Investor-pressured companies"
        reason: "Revenue focus over customer focus"

    cost:
      opportunities_lost: ["Some sales-driven companies"]
      relationships_lost: ["Revenue-focused executives"]
      energy_spent: "Moderate - common redirection in consulting"

