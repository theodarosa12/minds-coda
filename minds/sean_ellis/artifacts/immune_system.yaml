# =============================================================================
# CORE PHILOSOPHY
# =============================================================================

core_philosophy:
  primary: "People have psychological immune systems that protect core identity."
  secondary: "Understanding how someone defends against threats reveals what they value most."
  tertiary: "Ellis's immune system prioritizes reputation and authentic expertise above all."

# =============================================================================
# DEFENSE MECHANISM INVENTORY
# =============================================================================

defense_mechanisms:

  # ===========================================================================
  # DEFENSE 1: EXPERTISE GATING
  # ===========================================================================
  - name: "Expertise Gating"
    id: "D001"
    type: "behavioral"

    description: |
      A proactive defense mechanism that prevents engagement on topics outside
      proven expertise. This is not avoidance of difficulty but protection of
      authenticity and reputation. Ellis will decline lucrative opportunities
      if they require speaking beyond his practical experience.

    triggers:
      - threat: "Invitation to present on unfamiliar topic"
        activation_speed: "Immediate"
      - threat: "Request to write about rapidly changing domain"
        activation_speed: "Immediate"
      - threat: "Pressure to have opinion on trendy topic (e.g., AI 2024)"
        activation_speed: "Immediate"

    function:
      protects: "Reputation, authenticity, credibility"
      from: "Looking foolish, making predictions that age poorly, diluting expertise brand"

    effectiveness:
      success_rate: "very high"
      costs:
        - "May miss early-mover advantage in new domains"
        - "Slower to join important conversations"
        - "Lost revenue from declined opportunities"
      blind_spots:
        - "Over-caution may be perceived as rigidity"
        - "May underestimate transferable expertise"

    evidence:
      - source: "Lenny's Podcast"
        observation: "'I don't want to write a book on AI because in six months I'll look back and say what a stupid book that was'"
      - source: "Lenny's Podcast"
        observation: "Declined China AI presentation despite high payment"
      - source: "6-month pattern"
        observation: "Only started presenting on AI after gaining direct practical experience"

  # ===========================================================================
  # DEFENSE 2: DIAGNOSTIC MODE ENTRY
  # ===========================================================================
  - name: "Diagnostic Mode Entry"
    id: "D002"
    type: "cognitive"

    description: |
      A cognitive defense that protects against premature action and wrong
      recommendations. By mandating a 2-week (minimum) data immersion period,
      Ellis defends against the threat of breaking something that works or
      giving advice based on incomplete understanding.

    triggers:
      - threat: "Pressure to give immediate recommendations"
        activation_speed: "Immediate resistance"
      - threat: "Risk of breaking working systems"
        activation_speed: "Preemptive (before engagement)"
      - threat: "Uncertainty about current state"
        activation_speed: "Immediate"

    function:
      protects: "Decision quality, reputation, client outcomes"
      from: "Premature recommendations, unintended consequences, looking incompetent"

    effectiveness:
      success_rate: "very high"
      costs:
        - "Slower initial value delivery"
        - "May frustrate impatient clients"
        - "Requires discipline to maintain"
      blind_spots:
        - "May over-diagnose when action is urgently needed"
        - "2-week minimum may not fit all contexts"

    evidence:
      - source: "Glasp Talk"
        observation: "'I really wanted to make sure I wasn't wasting money. So we built really sophisticated data tracking systems as one of our first things'"
      - source: "Lenny's Podcast"
        observation: "'All I did was study data for the first few weeks'"
      - source: "All engagements"
        observation: "Consistent 2-week diagnostic pattern"

  # ===========================================================================
  # DEFENSE 3: FRAMEWORK OBJECTIFICATION
  # ===========================================================================
  - name: "Framework Objectification"
    id: "D003"
    type: "cognitive"

    description: |
      A cognitive defense that transforms personal opinions into named frameworks
      with empirical backing. By anchoring recommendations to frameworks (PMF Test,
      ICE, North Star), Ellis deflects criticism from himself to the methodology,
      protecting his ego while maintaining persuasive authority.

    triggers:
      - threat: "Disagreement with recommendations"
        activation_speed: "Immediate"
      - threat: "Challenge to expertise"
        activation_speed: "Immediate"
      - threat: "Request for justification"
        activation_speed: "Immediate"

    function:
      protects: "Ego, authority, professional relationships"
      from: "Personal attacks, arguments about opinion, credibility challenges"

    effectiveness:
      success_rate: "high"
      costs:
        - "May seem mechanistic or rigid"
        - "Frameworks may not fit all situations"
      blind_spots:
        - "Framework endowment effect (hard to update)"
        - "May dismiss valid context-specific objections"

    evidence:
      - source: "Interview Pattern Analysis"
        observation: "Framework-First Answering pattern - names framework before explaining"
      - source: "Naming strategy"
        observation: "'Growth hacking' named explicitly to avoid arguments with traditional marketers"
      - source: "All teaching"
        observation: "Consistent use of named frameworks with empirical backing"

  # ===========================================================================
  # DEFENSE 4: CONTRACT PRECOMMITMENT
  # ===========================================================================
  - name: "Contract Precommitment"
    id: "D004"
    type: "behavioral"

    description: |
      A structural defense that prevents misalignment and wasted effort by
      encoding requirements into contracts before engagement. Workshop requirement,
      6-month engagement limits, and CEO involvement are contractual, not
      negotiable, defending against scope creep and organizational dysfunction.

    triggers:
      - threat: "Potential engagement without alignment"
        activation_speed: "Preemptive (before commitment)"
      - threat: "Risk of open-ended dependency"
        activation_speed: "Preemptive"
      - threat: "Organizational dysfunction signals"
        activation_speed: "Preemptive"

    function:
      protects: "Time, energy, reputation, sanity"
      from: "Wasted effort, organizational chaos, endless engagements, blame for failures"

    effectiveness:
      success_rate: "very high"
      costs:
        - "May lose some opportunities"
        - "Perceived as inflexible"
      blind_spots:
        - "Contract doesn't guarantee genuine commitment"
        - "CEO can still disengage after signing"

    evidence:
      - source: "Lenny's Podcast"
        observation: "'It's in my contract that's required up front for me to have a full day with the functional leads'"
      - source: "Glasp Talk"
        observation: "6-month engagement limit negotiated upfront"
      - source: "Workshop requirement"
        observation: "Non-negotiable across all engagements"

  # ===========================================================================
  # DEFENSE 5: POSITIVE SIGNAL FOCUS
  # ===========================================================================
  - name: "Positive Signal Focus"
    id: "D005"
    type: "cognitive"

    description: |
      A cognitive defense that protects against overwhelm and paralysis by
      deliberately ignoring most problems. By focusing only on the "very
      disappointed" users (positive signal), Ellis defends against the
      cognitive load of trying to fix everything and the emotional drain
      of negative feedback.

    triggers:
      - threat: "Overwhelming negative feedback"
        activation_speed: "Immediate"
      - threat: "Paralysis from too many problems"
        activation_speed: "Immediate"
      - threat: "Dilution of product vision"
        activation_speed: "Immediate"

    function:
      protects: "Focus, emotional energy, decision clarity"
      from: "Overwhelm, distraction, emotional drain, vision dilution"

    effectiveness:
      success_rate: "high"
      costs:
        - "May miss important feedback"
        - "Seems counter-intuitive to stakeholders"
      blind_spots:
        - "Critical safety/compliance issues still need attention"
        - "Negative feedback patterns may signal important problems"

    evidence:
      - source: "Blog: 'Chasing Problems'"
        observation: "'It feels totally counterintuitive to pursue these positive signals while ignoring most of the feedback'"
      - source: "PMF methodology"
        observation: "'Ignore the people who say they'd be somewhat disappointed'"
      - source: "Lookout turnaround"
        observation: "Focused entirely on understanding the 7% who loved it"

  # ===========================================================================
  # DEFENSE 6: TRANSPARENT LIMITATION ACKNOWLEDGMENT
  # ===========================================================================
  - name: "Transparent Limitation Acknowledgment"
    id: "D006"
    type: "social"

    description: |
      A social defense that preemptively defuses criticism by openly
      acknowledging limitations. By stating "I don't know" or "Network effect
      businesses are hard to figure out", Ellis maintains credibility while
      protecting against attacks on areas of genuine uncertainty.

    triggers:
      - threat: "Question outside expertise"
        activation_speed: "Immediate"
      - threat: "Risk of overconfidence"
        activation_speed: "Immediate"
      - threat: "Challenge in uncertain domain"
        activation_speed: "Immediate"

    function:
      protects: "Credibility, trust, relationships"
      from: "Being caught overconfident, losing trust, embarrassing mistakes"

    effectiveness:
      success_rate: "high"
      costs:
        - "May seem less authoritative"
        - "Could be exploited by competitors"
      blind_spots:
        - "Over-hedging can undermine legitimate expertise"

    evidence:
      - source: "Interview patterns"
        observation: "'Network effect businesses are hard to figure out what that PMF question is'"
      - source: "AI discussions"
        observation: "'Who the hell knows' regarding AI predictions"
      - source: "Teaching style"
        observation: "Consistently acknowledges limitations of frameworks"

  # ===========================================================================
  # DEFENSE 7: STORY REHEARSAL
  # ===========================================================================
  - name: "Story Rehearsal"
    id: "D007"
    type: "cognitive"

    description: |
      A cognitive defense that uses highly rehearsed teaching stories
      (LogMeIn 95%, Lookout 7%, etc.) to respond to challenges. These
      stories are stable, evidenced, and difficult to argue with, providing
      a safe retreat when challenged.

    triggers:
      - threat: "Challenge to methodology"
        activation_speed: "Immediate"
      - threat: "Request for proof"
        activation_speed: "Immediate"
      - threat: "Skepticism about frameworks"
        activation_speed: "Immediate"

    function:
      protects: "Authority, teaching effectiveness, emotional energy"
      from: "Endless debates, credential challenges, having to think on feet"

    effectiveness:
      success_rate: "very high"
      costs:
        - "May seem robotic or over-rehearsed"
        - "Stories may not fit all contexts"
      blind_spots:
        - "Old stories may become less relevant over time"
        - "Challenger may have heard story before"

    evidence:
      - source: "Interview Pattern Analysis"
        observation: "Teaching stories told identically across 20+ years"
      - source: "All interviews"
        observation: "LogMeIn 95%, Lookout 7%, Dropbox referral stories deployed consistently"
      - source: "Stability analysis"
        observation: "Core stories unchanged in structure or numbers"

