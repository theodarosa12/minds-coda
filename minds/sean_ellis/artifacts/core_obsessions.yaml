analysis_principle: |
  "What someone can't stop thinking about IS their identity."

  Obsessions are not negative - they're the compass pointing to true identity.
  Each obsession below was validated through 5 criteria:
  1. THOUGHT LOOPS: Recurring themes mind returns to when unoccupied
  2. TIME INVESTMENT: Hours spent without resentment
  3. EMOTIONAL INTENSITY: Disproportionate emotional response
  4. RETURN PATTERNS: Keeps coming back despite obstacles
  5. IDENTITY FUSION: Would feel lost without this

