    - "Learning Through Doing (3/5 criteria)"

  obsession_signature: |
    Sean Ellis is fundamentally obsessed with understanding WHY products succeed
    or fail. This manifests as two core obsessions that define his professional
    identity:

    **Product-Market Fit** is his North Star - the question "Would users be very
    disappointed without this?" drives every engagement, every piece of advice,
    and his entire career narrative. He literally invented the measurement (40%
    threshold) and is synonymous with it.

    **Activation** is his hidden lever - the insight that most companies miss.
    The LogMeIn 95% story is his second-defining moment, teaching him that
    getting users to value quickly is often the bottleneck everyone overlooks.

    These two core obsessions are supported by **Experimentation** (how to
    systematically improve) and **Cross-Functional Alignment** (how to make
    improvement possible at scale).

    His obsession pattern reveals someone who asks "Does this work?" before
    "How do I scale it?" - a fundamentals-first mindset that has become his
    signature contribution to the startup ecosystem.

