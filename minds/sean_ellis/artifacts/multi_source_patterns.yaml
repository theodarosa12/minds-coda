structural_patterns:

  - pattern_id: "STR_001"
    pattern_name: "Validation-Before-Action"
    abstract_description: |
      Always validate assumptions before investing significant resources.
      Measure first, understand why, then act. Prevents wasted effort.

    concrete_manifestations:
      - context: "Product Development"
        how_expressed: "PMF survey before scaling"
        source: "All interviews"

      - context: "New Roles"
        how_expressed: "Won't take roles without PMF signal"
        source: "Lenny's, Mahmoud"

      - context: "Experimentation"
        how_expressed: "ICE scoring before running tests"
        source: "All methodology sources"

      - context: "AI Content"
        how_expressed: "Declined China presentation until had experience"
        source: "Lenny's Podcast"

    abstraction_level: "Universal"
    cross_domain_validity: "Yes"
    framework_form: "Validate → Understand → Act → Measure → Iterate"

  - pattern_id: "STR_002"
    pattern_name: "Simple-Over-Sophisticated"
    abstract_description: |
      Prefer simple, memorable frameworks over complex methodologies.
      Simplicity enables adoption and action. Complexity paralyzes.

    concrete_manifestations:
      - context: "PMF Measurement"
        how_expressed: "One question instead of complex surveys"
        source: "All sources"

      - context: "Prioritization"
        how_expressed: "ICE = 3 dimensions, not weighted formulas"
        source: "Lenny's, Book"

      - context: "Alignment"
        how_expressed: "One North Star metric everyone understands"
        source: "Lenny's, Glasp"

      - context: "Decision-making"
        how_expressed: "30 minutes max for North Star debate"
        source: "Lenny's Podcast"

    abstraction_level: "Universal"
    cross_domain_validity: "Yes"
    framework_form: "Minimum viable complexity for maximum adoption"

  - pattern_id: "STR_003"
    pattern_name: "Positive-Signal-Focus"
    abstract_description: |
      Focus resources on understanding and amplifying what works,
      rather than fixing all problems. Positive signals > problem solving.

    concrete_manifestations:
      - context: "PMF Survey"
        how_expressed: "Focus on 'very disappointed' users, not 'somewhat disappointed'"
        source: "All methodology sources"

      - context: "Product Development"
        how_expressed: "Double down on must-have use cases"
        source: "Lenny's, Blog"

      - context: "Customer Feedback"
        how_expressed: "Ignore most problems to focus on success patterns"
        source: "Blog: Chasing Problems"

    abstraction_level: "Domain (Product/Growth)"
    cross_domain_validity: "Partial"
    framework_form: "Find what works → Understand why → Amplify → Ignore distractions"

  - pattern_id: "STR_004"
    pattern_name: "Cross-Functional-Prerequisite"
    abstract_description: |
      Success requires alignment across functions before execution.
      Silos kill growth. Alignment is a prerequisite, not an outcome.

    concrete_manifestations:
      - context: "New Engagements"
        how_expressed: "Contract requires full-day workshop upfront"
        source: "Lenny's, Mahmoud"

      - context: "LogMeIn Turnaround"
        how_expressed: "Marketing + Product worked together on activation"
        source: "All LogMeIn stories"

      - context: "Dropbox Culture"
        how_expressed: "Everyone takes ownership of growth"
        source: "Lenny's Podcast"

      - context: "Scaling Failures"
        how_expressed: "Companies over 100 employees fail at growth hacking due to silos"
        source: "Mahmoud Khodor"

    abstraction_level: "Domain (Organization)"
    cross_domain_validity: "Yes"
    framework_form: "Align first → Define shared goal → Execute together → Own collectively"

  - pattern_id: "STR_005"
    pattern_name: "Value-Leads-Revenue"
    abstract_description: |
      Customer value creation must precede revenue optimization.
      Revenue focus creates short-term thinking that damages long-term value.

    concrete_manifestations:
      - context: "North Star Selection"
        how_expressed: "North Star = value metric, not revenue"
        source: "Lenny's, Glasp, GTM Vault"

      - context: "Growth Strategy"
        how_expressed: "Sustainable growth rooted in genuine value"
        source: "All methodology sources"

      - context: "Freemium Model"
        how_expressed: "Free tier must deliver real value"
        source: "Book, Blog"

      - context: "Anti-Pattern"
        how_expressed: "Revenue focus creates doom loop"
        source: "Lenny's Podcast"

    abstraction_level: "Universal"
    cross_domain_validity: "Yes"
    framework_form: "Create value → Measure value → Monetize value → Don't optimize revenue directly"

  - pattern_id: "STR_006"
    pattern_name: "Story-To-Framework"
    abstract_description: |
      Transform specific experiences into reusable frameworks.
      Stories provide credibility, frameworks enable transfer.

    concrete_manifestations:
      - context: "PMF Test"
        how_expressed: "LogMeIn/Dropbox experience → 40% rule"
        source: "All origin stories"

      - context: "ICE Framework"
        how_expressed: "Prioritization challenges → ICE scoring"
        source: "Lenny's Podcast"

      - context: "Teaching"
        how_expressed: "Consistent stories (LogMeIn 95%, Lookout 7%) to illustrate principles"
        source: "All interviews"

    abstraction_level: "Domain (Communication)"
    cross_domain_validity: "Partial"
    framework_form: "Experience → Pattern Recognition → Abstraction → Named Framework → Teaching Story"

