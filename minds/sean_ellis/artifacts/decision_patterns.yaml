      - "Investment decisions: Chemistry + fundamentals"
      - "New startup (2025): Waited for AI tools to reduce risk"

  routine:
    examples:
      - "PMF assessment methodology"
      - "Experiment prioritization"
      - "Workshop facilitation"
      - "Interview/podcast answers"
    approach: "Framework-based automation"
    automation_level: "High - System 1 pattern matching"
    review_frequency: "Rarely - frameworks validated long ago"
    evidence:
