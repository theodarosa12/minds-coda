# =============================================================================
# CORE PHILOSOPHY
# =============================================================================

core_philosophy:
  primary: "Choices reveal preferences better than words."
  secondary: "Decision architecture = how someone structures their decision environment."
  tertiary: "Ellis structures decisions to maximize understanding before commitment."

# =============================================================================
# HEURISTIC INVENTORY
# =============================================================================

heuristic_inventory:

  # ===========================================================================
  # HEURISTIC 1: 40% THRESHOLD HEURISTIC
  # ===========================================================================
  - name: "40% Threshold Heuristic"
    id: "H001"
    type: "anchoring"

    description: |
      If 40% or more of surveyed users would be "very disappointed" without
      the product, it has product-market fit. This is a hard threshold used
      as a binary decision point: above 40% = proceed with growth investment,
      below 40% = focus on product improvement.

    trigger_conditions:
      - "Evaluating any company's product-market fit"
      - "Deciding whether to invest growth resources"
      - "Advising founders on scaling readiness"
      - "Personal investment decisions"

    accuracy_profile:
      domains_accurate:
        - "Consumer SaaS products"
        - "B2B SaaS with sufficient sample size"
        - "Freemium products"
      domains_biased:
        - "Network effect businesses (may need different question)"
        - "Marketplace products (supply vs demand sides)"
        - "Niche products with small TAM"
      reliability: "very high"

    bias_risks:
      - risk: "May reject potentially good products prematurely"
        mitigation: "Consider trajectory, not just snapshot"
      - risk: "Threshold is somewhat arbitrary"
        mitigation: "Based on empirical correlation with success (originally tested)"
      - risk: "Sample quality can skew results"
        mitigation: "Survey 'active' users, not dormant"

    evidence:
      - source: "Every interview"
        example: "'If you got a high enough percentage of users saying they'd be very disappointed most of those products did pretty well'"
      - source: "Lenny's Podcast"
        example: "'Over time I started to realize... I honed in... it was about 40%'"
      - source: "Blog: 'How Superhuman Built An Engine To Find Product Market Fit'"
        example: "Threshold validated across dozens of companies"

  # ===========================================================================
  # HEURISTIC 2: ACTIVATION-FIRST HEURISTIC
  # ===========================================================================
  - name: "Activation-First Heuristic"
    id: "H002"
    type: "representativeness"

    description: |
      When growth stalls or is slow, check activation before anything else.
      This heuristic stems from the LogMeIn insight where 95% abandonment
      was the hidden blocker. Activation is the "default diagnosis" for
      growth problems.

    trigger_conditions:
      - "Growth stalling despite marketing spend"
      - "Low retention rates"
      - "User complaints about product"
      - "High signup but low engagement"

    accuracy_profile:
      domains_accurate:
        - "SaaS products with free trial"
        - "Freemium models"
        - "Products with complex onboarding"
      domains_biased:
        - "Simple products with obvious value"
        - "Products with long activation cycles"
      reliability: "high"

    bias_risks:
      - risk: "May miss other critical issues"
        mitigation: "Activation as first check, not only check"
      - risk: "Over-attribution to activation"
        mitigation: "Validate with data after hypothesis"

    evidence:
      - source: "LogMeIn story"
        example: "'Discovered that 95% of the people who signed up never used the product'"
      - source: "Glasp Talk"
        example: "'If I can get activation right, then my retention will be stronger'"
      - source: "Multiple interviews"
        example: "'Activation is the 1000lb gorilla in the room'"

  # ===========================================================================
  # HEURISTIC 3: CHEMISTRY-OVER-OPPORTUNITY HEURISTIC
  # ===========================================================================
  - name: "Chemistry-Over-Opportunity Heuristic"
    id: "H003"
    type: "affect"

    description: |
      When choosing between similar opportunities, prioritize personal chemistry
      with founders/team over objective opportunity quality. This stems from
      the belief that startups often fail, so at minimum enjoy the team.

    trigger_conditions:
      - "Multiple job/advisory offers"
      - "Investment decisions between similar companies"
      - "Choosing which clients to work with"

    accuracy_profile:
      domains_accurate:
        - "Advisory relationships"
        - "Long-term partnerships"
        - "Personal investment decisions"
      domains_biased:
        - "Short-term consulting"
        - "Purely financial decisions"
      reliability: "medium-high"

    bias_risks:
      - risk: "May pass on excellent opportunities"
        mitigation: "Chemistry is tiebreaker, not sole criterion"
      - risk: "Personal bias in chemistry assessment"
        mitigation: "Awareness of this bias"

    evidence:
      - source: "Glasp Talk"
        example: "'Chemistry is usually my most important factor in deciding who to work with'"
      - source: "Dropbox story"
        example: "'I just felt really good chemistry with the Dropbox CEO and founder'"
      - source: "Investment philosophy"
        example: "Chose companies partly based on founder relationship"

  # ===========================================================================
  # HEURISTIC 4: EXPERIENCE-BEFORE-EXPERTISE HEURISTIC
  # ===========================================================================
  - name: "Experience-Before-Expertise Heuristic"
    id: "H004"
    type: "custom"

    description: |
      Do not present as an expert on topics without direct practical experience.
      This creates a "gating function" that prevents speaking on unfamiliar
      topics even when invited or paid well. Protects reputation and authenticity.

    trigger_conditions:
      - "Invitation to speak on unfamiliar topic"
      - "Request to write about emerging trends"
      - "Pressure to have opinion on new technology"
      - "High-paying opportunity outside comfort zone"

    accuracy_profile:
      domains_accurate:
        - "Reputation protection"
        - "Long-term credibility"
        - "Authentic communication"
      domains_biased:
        - "May slow down sharing emerging insights"
        - "May miss early-mover advantage in new domains"
      reliability: "high"

    bias_risks:
      - risk: "Over-caution on evolving topics"
        mitigation: "Track comfort level over time"
      - risk: "Miss opportunities to shape emerging fields"
        mitigation: "Gradual expansion of comfort zone"

    evidence:
      - source: "Lenny's Podcast"
        example: "'I don't want to write a book on AI because in six months I'll look back and say what a stupid book that was'"
      - source: "Lenny's Podcast"
        example: "Declined China AI presentation despite high payment"
      - source: "6-month evolution"
        example: "Only started presenting on AI after gaining direct experience"

  # ===========================================================================
  # HEURISTIC 5: POSITIVE-SIGNAL-FOCUS HEURISTIC
  # ===========================================================================
  - name: "Positive-Signal-Focus Heuristic"
    id: "H005"
    type: "custom"

    description: |
      Focus on what's working (the "very disappointed" users who love the
      product) rather than trying to fix all problems. Counter-intuitive
      but highly effective for resource-constrained startups.

    trigger_conditions:
      - "Product development prioritization"
      - "Feedback analysis"
      - "Feature roadmap planning"
      - "PMF improvement efforts"

    accuracy_profile:
      domains_accurate:
        - "Startups with limited resources"
        - "Products seeking PMF"
        - "Early-stage feature decisions"
      domains_biased:
        - "Mature products needing broad appeal"
        - "Products with safety/compliance issues"
      reliability: "high"

    bias_risks:
      - risk: "Ignoring important feedback"
        mitigation: "'Very disappointed' users guide priorities, not all users"
      - risk: "Missing critical bugs/issues"
        mitigation: "Safety issues always addressed; feature prioritization uses this heuristic"

    evidence:
      - source: "Blog: 'Chasing Problems'"
        example: "'It feels totally counterintuitive to pursue these positive signals while ignoring most of the feedback'"
      - source: "PMF methodology"
        example: "'Ignore the people who say they'd be somewhat disappointed'"
      - source: "Lookout turnaround"
        example: "Focused entirely on understanding the 7% who loved it"

  # ===========================================================================
  # HEURISTIC 6: SIMPLICITY HEURISTIC
  # ===========================================================================
  - name: "Simplicity Heuristic"
    id: "H006"
    type: "custom"

    description: |
      If something takes more than 30 minutes to debate, the framework is
      too complex. Simplicity enables adoption and action. Applied to
      North Star metrics, prioritization frameworks, and team alignment.

    trigger_conditions:
      - "Framework design"
      - "Metric selection"
      - "Team alignment discussions"
      - "Tool selection"

    accuracy_profile:
      domains_accurate:
        - "Startup environments"
        - "Cross-functional alignment"
        - "Action-oriented contexts"
      domains_biased:
        - "Complex strategic decisions"
        - "Long-term planning"
      reliability: "high"

    bias_risks:
      - risk: "Over-simplification of genuinely complex situations"
        mitigation: "Simple for communication, complex for execution"
      - risk: "Missing important nuance"
        mitigation: "Use as forcing function, not absolute rule"

    evidence:
      - source: "Lenny's Podcast"
        example: "'Teams will debate North Star for months - I give them 30 minutes maximum'"
      - source: "Framework design philosophy"
        example: "One-question PMF test vs complex methodologies"
      - source: "ICE framework"
        example: "Simple 1-10 scoring on three dimensions"

  # ===========================================================================
  # HEURISTIC 7: ECONOMIC CONSTRAINT HEURISTIC
  # ===========================================================================
  - name: "Economic Constraint Heuristic"
    id: "H007"
    type: "custom"

    description: |
      ROI requirements focus effort and can actually accelerate growth.
      Unconstrained resources lead to waste and paralysis. This counter-
      intuitive heuristic values constraints as a positive force.

    trigger_conditions:
      - "Marketing budget decisions"
      - "Growth strategy evaluation"
      - "Resource allocation"
      - "Startup advising"

    accuracy_profile:
      domains_accurate:
        - "Marketing spend optimization"
        - "Startup resource allocation"
        - "Growth experimentation"
      domains_biased:
        - "Long-term brand building"
        - "Strategic investments with delayed payback"
      reliability: "medium-high"

    bias_risks:
      - risk: "Under-investment in strategic initiatives"
        mitigation: "Apply primarily to tactical marketing, not strategic bets"
      - risk: "Short-term focus"
        mitigation: "Payback window can be adjusted for strategic investments"

    evidence:
      - source: "LogMeIn"
        example: "3-month payback window created discipline"
      - source: "Multiple interviews"
        example: "'Economic constraints are actually a good thing. They actually can help you grow faster'"
      - source: "Personal investment style"
        example: "'I really wanted to make sure I wasn't wasting money'"

# =============================================================================
# CHOICE ARCHITECTURE
# =============================================================================

choice_architecture:

  default_creation:
    description: |
      Ellis creates strong defaults that eliminate ongoing decision-making.
      Once a framework is validated, it becomes the default approach.
    examples:
      - "40% PMF threshold as default success criterion"
      - "2-week diagnostic period as default entry"
      - "Workshop as default engagement start"
      - "ICE as default prioritization framework"
    rationale: "Defaults reduce cognitive load and create consistency"

  choice_reduction:
    description: |
      Simplifies complex decisions into binary or limited-option choices.
    strategies:
      - strategy: "Binary threshold decisions"
        example: "Above 40% = scale, below 40% = improve product"
      - strategy: "Forced ranking"
        example: "ICE score produces single priority list"
      - strategy: "Time-boxing decisions"
        example: "30 minutes max for North Star debate"
      - strategy: "Contract requirements"
        example: "Workshop required = no decision needed"

  commitment_devices:
    description: |
      Self-binding mechanisms that prevent deviation from chosen strategy.
    examples:
      - device: "Contract requirements"
        mechanism: "Workshop requirement written into contract"
        evidence: "Lenny's Podcast: 'It's in my contract'"
      - device: "6-month engagement limits"
        mechanism: "Negotiated upfront to prevent dependency"
        evidence: "Glasp Talk: 6-month limit negotiated"
      - device: "Data immersion period"
        mechanism: "No recommendations until understanding complete"
        evidence: "All interviews: 2-week diagnostic pattern"
      - device: "Public methodology"
        mechanism: "Published frameworks create accountability"
        evidence: "Blog, book, podcast consistency"

  feedback_loops:
    description: |
      Mechanisms for getting decision quality feedback.
    mechanisms:
      - loop: "PMF survey results"
        frequency: "Every new engagement"
        feedback_type: "Binary success/failure signal"
      - loop: "Experiment results"
        frequency: "Weekly/sprint-based"
        feedback_type: "Quantitative learning"
      - loop: "Retention cohorts"
        frequency: "Ongoing"
        feedback_type: "Lagging indicator validation"
      - loop: "Public sharing"
        frequency: "Regular (blog, podcast)"
        feedback_type: "Community validation"

