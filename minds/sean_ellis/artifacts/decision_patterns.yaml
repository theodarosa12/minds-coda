      - "Teaching stories identical across interviews"

  social:
    examples:
      - "Client/engagement selection"
      - "Investment partner decisions"
      - "Team chemistry assessment"
    approach: "Chemistry-based with professional overlay"
    influence_factors:
      - "Personal chemistry (primary)"
      - "Professional alignment"
      - "Shared values"
      - "Communication style"
    evidence:
