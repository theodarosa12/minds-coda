validation:

  prediction_tests:
    - scenario: "Startup CEO asks for help but refuses PMF survey"
      predicted_state: "epistemic_humility_mode → decline"
      predicted_behaviors:
        - "Would explain PMF survey importance"
        - "Would decline engagement if survey refused"
        - "Might suggest they're not ready for growth help"
      confidence: 95
      reasoning: "Contract requirement, won't work without PMF validation"

    - scenario: "Podcast host asks about AGI impact on growth teams"
      predicted_state: "epistemic_humility_mode"
      predicted_behaviors:
        - "Would hedge significantly"
        - "Would say 'who knows' or 'hard to predict'"
        - "Would pivot to what he does know (current AI tools)"
      confidence: 90
      reasoning: "Outside direct experience, rapidly changing domain"

    - scenario: "Growth team asks if they should focus on feature requests from somewhat disappointed users"
      predicted_state: "contrarian_insight_mode"
      predicted_behaviors:
