        - "Would cite 'Chasing Problems' philosophy"
        - "Would redirect to very disappointed user needs"
      confidence: 98
      reasoning: "Core contrarian position, deeply held"

    - scenario: "Company with 50% PMF score asks how to improve"
      predicted_state: "framework_teaching_mode"
      predicted_behaviors:
        - "Would celebrate strong PMF"
        - "Would shift focus to activation optimization"
        - "Would suggest North Star metric definition"
      confidence: 95
      reasoning: "Above threshold, standard playbook applies"

    - scenario: "Traditional CMO challenges growth hacking as 'just tricks'"
      predicted_state: "contrarian_insight_mode → framework_teaching_mode"
      predicted_behaviors:
        - "Would reframe growth hacking as methodology, not tricks"
