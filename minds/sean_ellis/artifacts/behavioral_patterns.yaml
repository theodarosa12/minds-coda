  confidence: 92

# =============================================================================
# CORE PHILOSOPHY
# =============================================================================

analysis_principles:
  primary: "States, not traits. Context is everything."
  secondary: "What people DO reveals more than what they SAY."
  tertiary: "Loss aversion reveals priorities more than gain-seeking."

# =============================================================================
# STATE INVENTORY (Minimum 5 required - 8 identified)
# =============================================================================

state_inventory:
  total_states: 8

  states:

    # =========================================================================
    # STATE 1: DIAGNOSTIC MODE
    # =========================================================================
    - state_id: "diagnostic_mode"
      name: "Diagnostic Mode"
      description: |
        A deliberate, data-immersion state where Ellis suspends action to deeply
        understand the current system. Characterized by intense observation,
        question-asking, and pattern-seeking. No changes made during this state.

      behavioral_markers:
        - "Studies data for extended periods without action"
        - "Asks probing questions about current metrics"
        - "Runs PMF survey to diagnose situation"
        - "Analyzes retention cohorts and activation rates"
        - "Interviews users directly"
        - "Explicitly avoids making changes"

      cognitive_characteristics:
        system_dominance: "System 2 (Deliberate)"
        attention_pattern: "Focused / Deep"
        decision_style: "Suspended - gathering evidence"
        cognitive_load: "High but sustainable"

      emotional_tone:
        - "Curiosity"
        - "Patient restraint"
        - "Analytical detachment"

      triggers:
        environmental:
          - "Starting new engagement/role"
          - "Encountering growth stall"
          - "Before major strategic decisions"
        internal:
          - "Uncertainty about system state"
          - "Recognition that assumptions may be wrong"
          - "Desire to avoid breaking what works"
        social:
          - "New team relationships"
          - "High-stakes visibility"
        task:
          - "Any task requiring understanding before action"
          - "Beginning of consulting engagement"

      duration:
        minimum: "2-3 days"
        typical: "2 weeks"
        maximum: "First month"

      exit_conditions:
        - "Sufficient data collected to form hypothesis"
        - "Pattern recognition achieved"
        - "Clear direction emerges from data"

      evidence:
        - source: "Lenny's Podcast"
          quote: "All I did was study data for the first few weeks... I don't want to break something that's working"
        - source: "Interview Patterns Analysis"
          observation: "First 2 weeks = data immersion pattern documented across all engagements"

    # =========================================================================
    # STATE 2: FRAMEWORK-TEACHING MODE
    # =========================================================================
    - state_id: "framework_teaching_mode"
      name: "Framework-Teaching Mode"
      description: |
        A confident, story-driven state for explaining concepts. Names frameworks
        first, then illustrates with consistent teaching stories. High certainty,
        rapid responses, well-rehearsed delivery.

      behavioral_markers:
        - "Names framework before explaining (Framework-First pattern)"
        - "Uses consistent teaching stories (LogMeIn 95%, Lookout 7%)"
        - "Provides specific quantified claims (40%, 10x, 80%)"
        - "Self-deprecating origin stories"
        - "Counter-example discovery patterns"
        - "Smooth, confident delivery"

      cognitive_characteristics:
        system_dominance: "System 1 (Automatic) for core frameworks"
        attention_pattern: "Fluent / Automatic"
        decision_style: "Pattern-matching to established frameworks"
        cognitive_load: "Low - deeply internalized knowledge"

      emotional_tone:
        - "Confidence"
        - "Enthusiasm for sharing"
        - "Slight missionary zeal"

      triggers:
        environmental:
          - "Interview settings"
          - "Workshop facilitation"
          - "Conference presentations"
        internal:
          - "Questions about PMF, activation, ICE"
          - "Opportunity to share methodology"
        social:
          - "Teaching situations"
          - "When recognized as expert"
          - "Growth teams seeking guidance"
        task:
          - "Explaining established frameworks"
          - "Responding to familiar questions"

      duration:
        minimum: "5 minutes"
        typical: "30-60 minutes"
        maximum: "Full day workshop"

      exit_conditions:
        - "Question outside established frameworks"
        - "Novel situation requiring deliberation"
        - "Challenge to core assumptions"

      evidence:
        - source: "All 9 interviews analyzed"
          observation: "Remarkably consistent story delivery - same frameworks told identically across years"
        - source: "Interview Patterns"
          quote: "Framework-first answering pattern - names the framework before explaining"

    # =========================================================================
    # STATE 3: EXPERIMENTATION MODE
    # =========================================================================
    - state_id: "experimentation_mode"
      name: "Experimentation Mode"
      description: |
        High-tempo, hypothesis-driven state for running growth experiments.
        Systematic application of ICE scoring, rapid test execution, and
        data-driven iteration. Action-oriented but disciplined.

      behavioral_markers:
        - "Generates many ideas before filtering"
        - "Applies ICE scoring systematically"
        - "Uses ChatGPT for ideation and bias removal"
        - "Runs experiments with statistical rigor"
        - "Quick to abandon what doesn't work"
        - "Celebrates learning, not just wins"

      cognitive_characteristics:
        system_dominance: "Mixed - System 2 for planning, System 1 for execution"
        attention_pattern: "Alternating - strategic then tactical"
        decision_style: "Heuristic (ICE) for prioritization, data for validation"
        cognitive_load: "Moderate - structured process reduces load"

      emotional_tone:
        - "Energized curiosity"
        - "Competitive drive"
        - "Tolerance for failure"

      triggers:
        environmental:
          - "After diagnostic phase complete"
          - "Weekly growth team meetings"
          - "Clear opportunity identified"
        internal:
          - "Understanding achieved, ready for action"
          - "Hypothesis formed, ready to test"
        social:
          - "Cross-functional team aligned"
          - "Stakeholder buy-in secured"
        task:
          - "Growth optimization"
          - "Activation improvement"
          - "Funnel optimization"

      duration:
        minimum: "1 experiment (days)"
        typical: "Sprint cycles (1-2 weeks)"
        maximum: "Ongoing rhythm (months)"

      exit_conditions:
        - "Major pivot needed (return to diagnostic)"
        - "Organizational blockers emerge"
        - "PMF deteriorates (return to fundamentals)"

      evidence:
        - source: "Lenny's Podcast"
          quote: "Success at Amazon is a function of how many experiments we do per year, per month, per day"
        - source: "Dropbox case study"
          observation: "Scripted first 10 experiments to de-risk culture building"

    # =========================================================================
    # STATE 4: ALIGNMENT-FACILITATION MODE
    # =========================================================================
    - state_id: "alignment_facilitation_mode"
      name: "Alignment-Facilitation Mode"
      description: |
        Workshop facilitation state for creating cross-functional alignment.
        High social awareness, structured process, deliberate pace. Goal is
        shared understanding, not personal wins.

      behavioral_markers:
        - "Facilitates rather than dictates"
        - "Ensures all voices heard"
        - "Drives to simple, memorable outputs (North Star)"
        - "Imposes time constraints (30 minutes max for debates)"
        - "Documents agreements visibly"
        - "Checks for genuine buy-in vs compliance"

      cognitive_characteristics:
        system_dominance: "System 2 (Social awareness, process management)"
        attention_pattern: "Scanning - reading room dynamics"
        decision_style: "Consensus-seeking with guardrails"
        cognitive_load: "High - managing multiple perspectives"

      emotional_tone:
        - "Patient but persistent"
        - "Diplomatic assertiveness"
        - "Genuine interest in alignment"

      triggers:
        environmental:
          - "Start of new engagement (contract requirement)"
          - "Growth initiative launch"
          - "Organizational tension detected"
        internal:
          - "Recognition that silos will block progress"
          - "Need to establish shared language"
        social:
          - "Multiple stakeholders with different priorities"
          - "Misalignment detected"
        task:
          - "North Star definition"
          - "Cross-functional ownership assignment"
          - "Growth strategy alignment"

      duration:
        minimum: "2-3 hours"
        typical: "Full day"
        maximum: "Multiple sessions over week"

      exit_conditions:
        - "Alignment achieved (documented agreement)"
        - "Irreconcilable differences surfaced (escalate)"
        - "Time box exhausted"

      evidence:
        - source: "Lenny's Podcast"
          quote: "It's in my contract that's required up front for me to have a full day with the functional leads across the business"
        - source: "Mahmoud Khodor"
          observation: "Almost any business over 100 employees that tries to do growth hacking fails - silos"

    # =========================================================================
    # STATE 5: CONTRARIAN-INSIGHT MODE
    # =========================================================================
    - state_id: "contrarian_insight_mode"
      name: "Contrarian-Insight Mode"
      description: |
        A distinctive state triggered when challenging conventional wisdom.
        Heightened conviction, counter-example deployment, slight edge of
        provocation. Teaching through paradox.

      behavioral_markers:
        - "Presents counter-intuitive claim first"
        - "Follows with supporting evidence"
        - "Uses 'actually' or 'the interesting thing is'"
        - "Cites specific counter-examples"
        - "Shows slight enjoyment in subverting expectations"

      cognitive_characteristics:
        system_dominance: "System 1 (Confident, pre-thought-through)"
        attention_pattern: "Focused on audience reaction"
        decision_style: "Pre-formed position, defensive evidence ready"
        cognitive_load: "Low - positions are well-rehearsed"

      emotional_tone:
        - "Confident conviction"
        - "Slight intellectual provocation"
        - "Teaching satisfaction"

      triggers:
        environmental:
          - "Questions about conventional marketing"
          - "Discussions about 'growth at all costs'"
          - "Revenue vs value debates"
        internal:
          - "Detection of flawed assumption in questioner"
          - "Opportunity to share hard-won insight"
        social:
          - "Audience holding conventional belief"
          - "Expert-to-expert context"
        task:
          - "Challenging 'listen to all feedback' advice"
          - "Explaining economic constraints benefit"
          - "Arguing against revenue as North Star"

      duration:
        minimum: "30 seconds"
        typical: "2-5 minutes"
        maximum: "Extended discussion if challenged"

      exit_conditions:
        - "Point made, audience updated"
        - "Pushback requiring deeper deliberation"
        - "Topic transition"

      evidence:
        - source: "Blog: Chasing Problems"
          quote: "It feels totally counterintuitive to pursue these positive signals while ignoring most of the feedback about problems"
        - source: "All interviews"
          observation: "Economic constraints are a good thing. They actually can help you grow faster."

    # =========================================================================
    # STATE 6: EPISTEMIC-HUMILITY MODE
    # =========================================================================
    - state_id: "epistemic_humility_mode"
      name: "Epistemic-Humility Mode"
      description: |
        A more cautious, uncertain state triggered by topics where Ellis
        lacks direct experience or where the field is rapidly evolving.
        Marked contrast to confident framework-teaching mode.

      behavioral_markers:
        - "Uses hedging language ('who knows', 'hard to say')"
        - "Declines to present on topics without experience"
        - "Acknowledges rapid change makes predictions unreliable"
        - "Defers to others with more direct experience"
        - "Updates beliefs when new evidence arrives"

      cognitive_characteristics:
        system_dominance: "System 2 (Deliberate uncertainty assessment)"
        attention_pattern: "Evaluative - assessing own knowledge limits"
        decision_style: "Cautious, evidence-seeking"
        cognitive_load: "Moderate - active uncertainty management"

      emotional_tone:
        - "Honest uncertainty"
        - "Intellectual humility"
        - "Appropriate caution"

      triggers:
        environmental:
          - "Questions about AI future (2024)"
          - "Novel situations without precedent"
          - "Rapidly changing domains"
        internal:
          - "Recognition of knowledge gaps"
          - "Lack of direct experience on topic"
        social:
          - "High-stakes presentation invitation"
          - "Requests for predictions"
        task:
          - "Forecasting"
          - "Topics outside core expertise"
          - "New technology implications"

      duration:
        minimum: "Brief acknowledgment"
        typical: "Throughout discussion of uncertain topic"
        maximum: "Until sufficient experience gained"

      exit_conditions:
        - "Topic returns to core expertise"
        - "Direct experience gained (AI transition over 6 months)"
        - "Sufficient evidence accumulated"

      evidence:
        - source: "Lenny's Podcast"
          quote: "I got invited to present on AI in China... I said no because I wasn't actually doing that much with AI myself"
        - source: "Interview Patterns"
          observation: "AI positions evolved from 'won't present' to 'heavy integration' over 6 months as experience grew"

    # =========================================================================
    # STATE 7: TURNAROUND-CRISIS MODE
    # =========================================================================
    - state_id: "turnaround_crisis_mode"
      name: "Turnaround-Crisis Mode"
      description: |
        High-stakes, focused state activated when facing severe growth
        problems (like Lookout 7% or LogMeIn 95%). Combines urgency with
        disciplined problem-solving. No panic, just focused action.

      behavioral_markers:
        - "Immediate shift to understanding positive signal"
        - "Puts aside normal product roadmap"
        - "Cross-functional focus on single lever"
        - "Rapid iteration within narrow focus"
        - "Transparent about severity (doesn't hide problems)"
        - "Celebrates small wins to maintain momentum"

      cognitive_characteristics:
        system_dominance: "System 2 forced by high stakes"
        attention_pattern: "Narrowly focused - tunnel vision on key metric"
        decision_style: "Disciplined triage - few things matter"
        cognitive_load: "Very high but necessary"

      emotional_tone:
        - "Controlled urgency"
        - "Resilient determination"
        - "Transparent about challenges"

      triggers:
        environmental:
          - "PMF score below 40%"
          - "Severe activation problem (>90% abandonment)"
          - "Existential threat to growth"
        internal:
          - "Recognition of crisis severity"
          - "Commitment already made (can't walk away)"
        social:
          - "CEO engagement critical"
          - "Team alignment around crisis"
        task:
          - "Turnaround situation"
          - "Post-commitment PMF discovery"

      duration:
        minimum: "2 weeks (Lookout)"
        typical: "3 months (LogMeIn activation)"
        maximum: "6 months intensive focus"

      exit_conditions:
        - "PMF achieved (40%+)"
        - "Activation normalized"
        - "Growth trajectory restored"

      evidence:
        - source: "Lenny's Podcast - Lookout story"
          quote: "Oh crap, I probably should have asked this question before I committed... 40% in two weeks"
        - source: "Lenny's Podcast - LogMeIn story"
          quote: "CEO stopped all roadmap work... 5% to 50% in 3 months"

    # =========================================================================
    # STATE 8: REFLECTIVE-SYNTHESIS MODE
    # =========================================================================
    - state_id: "reflective_synthesis_mode"
      name: "Reflective-Synthesis Mode"
      description: |
        A meta-cognitive state for extracting patterns from experience and
        crystallizing them into reusable frameworks. Occurs after significant
        experiences or when preparing to teach.

      behavioral_markers:
        - "Seeks patterns across multiple experiences"
        - "Names and articulates frameworks"
        - "Tests frameworks against new situations"
        - "Refines based on feedback and results"
        - "Writes to clarify thinking (blog posts, book)"
        - "Shares publicly to force continued evolution"

      cognitive_characteristics:
        system_dominance: "System 2 (Deliberate abstraction)"
        attention_pattern: "Pattern-seeking across experiences"
        decision_style: "Inductive - specific to general"
        cognitive_load: "High - abstract thinking"

      emotional_tone:
        - "Intellectual satisfaction"
        - "Curiosity about patterns"
        - "Drive to systematize"

      triggers:
        environmental:
          - "After completing major engagement"
          - "When preparing to teach"
          - "Writing opportunities"
        internal:
          - "Recognition of recurring pattern"
          - "Desire to systematize learning"
        social:
          - "Collaboration opportunities (Morgan Brown, GoPractice)"
          - "Teaching commitments"
        task:
          - "Framework creation"
          - "Book/article writing"
          - "Course development"

      duration:
        minimum: "Hours of reflection"
        typical: "Days to weeks for framework development"
        maximum: "Months for major works (Hacking Growth book)"

      exit_conditions:
        - "Framework crystallized and named"
        - "Published/shared"
        - "Validated through teaching"

      evidence:
        - source: "Lenny's Podcast"
          quote: "Over time I started to realize that there was a certain percentage... I honed in on 40%"
        - source: "Origin story"
          observation: "Multiple companies' experiences → 40% threshold → Named 'Sean Ellis Test'"

# =============================================================================
# TRIGGER ANALYSIS (Comprehensive Mapping)
# =============================================================================

trigger_map:

  environmental_triggers:
    - trigger: "New company/role"
      activates_state: "diagnostic_mode"
      transition_speed: "Immediate"

    - trigger: "Interview/podcast"
      activates_state: "framework_teaching_mode"
      transition_speed: "Immediate"

    - trigger: "Workshop setting"
      activates_state: "alignment_facilitation_mode"
      transition_speed: "Immediate"

    - trigger: "PMF score < 40%"
      activates_state: "turnaround_crisis_mode"
      transition_speed: "Rapid (same day)"

    - trigger: "Question about AI/novel domain"
      activates_state: "epistemic_humility_mode"
      transition_speed: "Immediate"

  internal_triggers:
    - trigger: "Uncertainty about system state"
      activates_state: "diagnostic_mode"

    - trigger: "Opportunity to share methodology"
      activates_state: "framework_teaching_mode"

    - trigger: "Recognition of conventional wisdom flaw"
      activates_state: "contrarian_insight_mode"

    - trigger: "Pattern recognized across experiences"
      activates_state: "reflective_synthesis_mode"

    - trigger: "Recognition of knowledge gap"
      activates_state: "epistemic_humility_mode"

  social_triggers:
    - trigger: "Cross-functional stakeholders present"
      activates_state: "alignment_facilitation_mode"

    - trigger: "Audience holds conventional belief"
      activates_state: "contrarian_insight_mode"

    - trigger: "High-stakes visibility"
      activates_state: "diagnostic_mode"

    - trigger: "CEO engagement"
      activates_state: "turnaround_crisis_mode"

  task_triggers:
    - trigger: "Growth optimization"
      activates_state: "experimentation_mode"

    - trigger: "Framework explanation needed"
      activates_state: "framework_teaching_mode"

    - trigger: "North Star definition"
      activates_state: "alignment_facilitation_mode"

    - trigger: "Writing/teaching preparation"
      activates_state: "reflective_synthesis_mode"

# =============================================================================
# DUAL-PROCESS PROFILE (System 1 vs System 2)
# =============================================================================

dual_process_profile:

  system_1_dominant_contexts:
    - context: "Questions about PMF methodology"
      typical_responses:
        - "40% threshold immediate recall"
        - "Must-have experience definition"
        - "Teaching stories deployed smoothly"
      heuristics_used:
        - "Framework-first answering"
        - "Story-to-principle pattern"
      accuracy: "Very high - 20+ years of validation"

    - context: "Questions about activation"
      typical_responses:
        - "LogMeIn 95% story"
        - "Aha moment explanation"
        - "Silicon Valley insight"
      heuristics_used:
        - "Case study as proof point"
        - "Quantified claims"
      accuracy: "Very high - core expertise"

    - context: "Conventional wisdom challenges"
      typical_responses:
        - "Counter-intuitive claim first"
        - "Supporting evidence ready"
        - "Slight provocation"
      heuristics_used:
        - "Affect heuristic (conviction)"
        - "Availability (counter-examples ready)"
      accuracy: "High - positions well-considered"

  system_2_dominant_contexts:
    - context: "AI predictions and future"
      deliberation_triggers:
        - "Rapidly changing domain"
        - "Lack of direct experience (initially)"
      time_requirement: "Significant pause, hedging language"
      cognitive_load: "High - genuine uncertainty"

    - context: "Novel company situations"
      deliberation_triggers:
        - "Unique business model"
        - "Network effects complexity"
      time_requirement: "Extended diagnostic phase"
      cognitive_load: "High - custom analysis needed"

    - context: "Organizational structure recommendations"
      deliberation_triggers:
        - "CMO evolution question"
        - "Team design questions"
      time_requirement: "Thoughtful response with caveats"
      cognitive_load: "Moderate - context-dependent"

  override_patterns:
    system_2_overrides_1:
      - trigger: "Challenge to core framework"
        threshold: "When evidence contradicts strongly"
        example: "Praises Superhuman's more nuanced PMF approach"

      - trigger: "High-stakes decision"
        threshold: "Committing to company/role"
        example: "Diagnostic mode always first"

      - trigger: "Novel domain (AI)"
        threshold: "Any question outside experience"
        example: "Declined China presentation"

    system_1_overrides_2:
      - trigger: "Core principles questioned"
        pattern: "Returns to fundamentals immediately"
        example: "'PMF is 90% of success' - no deliberation needed"

      - trigger: "Familiar growth problem"
        pattern: "Pattern recognition activates frameworks"
        example: "Activation problem → LogMeIn playbook"

  transition_signals:
    from_1_to_2:
      - "Pause before answering"
      - "'It depends on...' language"
      - "'Who knows...' hedging"
      - "Requests for more context"

    from_2_to_1:
      - "Return to familiar framework"
      - "Story deployment"
      - "Confident tone restoration"
      - "'What I've found is...' certainty markers"

# =============================================================================
# HEURISTIC INVENTORY (Personal Mental Shortcuts)
# =============================================================================

heuristic_inventory:

  - name: "40% Heuristic"
    description: |
      If 40%+ users would be 'very disappointed' without product, proceed.
      If below, focus on understanding and improving PMF first.
    trigger: "Any growth decision"
    accuracy: "High (20+ years validation)"
    bias_risk: "May miss nuance in edge cases"
    evidence: "Every methodology discussion"

  - name: "Positive Signal Focus"
    description: |
      Focus resources on understanding what's working (very disappointed users)
      rather than fixing all problems (somewhat disappointed users).
    trigger: "Resource allocation decisions"
    accuracy: "High for resource-constrained startups"
    bias_risk: "May ignore valid problem feedback in mature companies"
    evidence: "Chasing Problems blog post"

  - name: "Activation as Default Diagnosis"
    description: |
      When growth stalls, first investigate activation/first user experience.
      Default assumption: activation is probably the bottleneck.
    trigger: "Growth stall diagnosis"
    accuracy: "Very high - most common actual cause"
    bias_risk: "May delay recognition of other issues"
    evidence: "LogMeIn story, consistent advice pattern"

  - name: "Cross-Functional First"
    description: |
      Alignment workshop before any growth work. No exceptions.
      Growth initiatives fail when functions aren't aligned.
    trigger: "New engagement start"
    accuracy: "High - strong correlation with success"
    bias_risk: "May delay action when alignment isn't actual blocker"
    evidence: "Contract requirement, workshop protocol"

  - name: "Simple Over Sophisticated"
    description: |
      When designing frameworks or metrics, simplest version that
      people will actually use is better than sophisticated version they won't.
    trigger: "Framework/metric design"
    accuracy: "High for adoption, moderate for precision"
    bias_risk: "May sacrifice nuance that matters"
    evidence: "One question PMF, 30 minute North Star rule"

  - name: "Experience Before Expertise"
    description: |
      Won't present or advise on topics without direct practical experience.
      Rejects invitations for topics outside experience (China AI example).
    trigger: "Speaking/advising opportunities"
    accuracy: "Maintains credibility"
    bias_risk: "May limit scope of contribution"
    evidence: "AI presentation decline story"

  - name: "CEO Engagement Proxy"
    description: |
      CEO hands-on involvement correlates strongly with growth success.
      If CEO is disengaged, probability of success drops significantly.
    trigger: "Evaluating engagement viability"
    accuracy: "High correlation observed"
    bias_risk: "May reject viable opportunities"
    evidence: "GTM Vault interview, success pattern analysis"

# =============================================================================
# PROSPECT THEORY PROFILE (Loss Aversion Analysis)
# =============================================================================

prospect_theory_profile:

  reference_points:
    - domain: "Product-Market Fit"
      reference: "40% 'very disappointed' threshold"
      gains_above: "Strong PMF, ready to scale"
      losses_below: "Weak PMF, urgent attention needed"

    - domain: "Activation Rate"
      reference: "Industry benchmarks + personal experience"
      gains_above: "Optimized funnel"
      losses_below: "95% abandonment = crisis"

    - domain: "Professional Reputation"
      reference: "Authentic expertise only"
      gains_above: "Expanding credibility"
      losses_below: "Presenting without experience = reputation damage"

    - domain: "Team Alignment"
      reference: "Functional leads all aligned"
      gains_above: "Growth potential unlocked"
      losses_below: "Silos will kill growth"

  loss_aversion_ratio:
    estimate: "2.5:1 - losses hurt significantly more"
    evidence:
      - "Won't take roles without PMF signal (avoiding loss)"
      - "Declined China AI presentation (protecting reputation)"
      - "Contract requires workshop (preventing alignment loss)"
      - "Diagnostic phase protects against 'breaking what works'"

  certainty_effect:
    preference: "Strong preference for validated certainties"
    risk_for_losses: "Will take risks when facing certain loss (turnaround mode)"
    evidence:
      - "Lookout: aggressive turnaround when 7% PMF was certain loss"
      - "LogMeIn: CEO stopped all roadmap = risk to recover"

  framing_sensitivity:
    examples:
      - positive_frame: "'40% very disappointed = strong PMF'"
        negative_frame: "'60% NOT very disappointed'"
        preference: "Always uses positive frame for teaching"

      - positive_frame: "'Focus on must-have users'"
        negative_frame: "'Ignore 60% of users'"
        preference: "Frames as positive signal focus, not ignoring"

  endowment_effect:
    strength: "Moderate - willingness to evolve positions"
    evidence:
      - "Created frameworks but acknowledges Superhuman's improvements"
      - "Says 'the term is not important' about growth hacking"
      - "Updates AI positions with experience"

# =============================================================================
# STATE TRANSITION MATRIX
# =============================================================================

state_transitions:

  transitions:
    - from_state: "diagnostic_mode"
      to_state: "experimentation_mode"
      transition_triggers:
        - trigger: "Sufficient understanding achieved"
          speed: "Gradual (over days)"
          voluntary: true
      transition_friction:
        ease: "Moderate"
        resistance: "Pressure to act before ready"
        facilitators: "Clear data pattern emergence"
      reversal:
        possible: true
        trigger: "Unexpected result, need more understanding"

    - from_state: "diagnostic_mode"
      to_state: "turnaround_crisis_mode"
      transition_triggers:
        - trigger: "PMF < 40% discovered"
          speed: "Immediate"
          voluntary: false
      transition_friction:
        ease: "Forced by severity"
        resistance: "None - urgency overrides"
        facilitators: "Clear metric (40% threshold)"
      reversal:
        possible: true
        trigger: "PMF achieved, crisis resolved"

    - from_state: "framework_teaching_mode"
      to_state: "epistemic_humility_mode"
      transition_triggers:
        - trigger: "Question outside expertise (AI)"
          speed: "Immediate"
          voluntary: true
      transition_friction:
        ease: "Easy - clear self-awareness"
        resistance: "None"
        facilitators: "Strong self-knowledge"
      reversal:
        possible: true
        trigger: "Topic returns to core expertise"

    - from_state: "experimentation_mode"
      to_state: "reflective_synthesis_mode"
      transition_triggers:
        - trigger: "Pattern recognized, teaching opportunity"
          speed: "Gradual"
          voluntary: true
      transition_friction:
        ease: "Moderate"
        resistance: "Action momentum"
        facilitators: "Writing deadline, teaching commitment"
      reversal:
        possible: true
        trigger: "Return to active growth work"

    - from_state: "alignment_facilitation_mode"
      to_state: "experimentation_mode"
      transition_triggers:
        - trigger: "Alignment achieved, ready to execute"
          speed: "Same day"
          voluntary: true
      transition_friction:
        ease: "Easy once aligned"
        resistance: "Incomplete alignment"
        facilitators: "Clear documentation of agreements"
      reversal:
        possible: true
        trigger: "Alignment breaks down"

  matrix_summary:
