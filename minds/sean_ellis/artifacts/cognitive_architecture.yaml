  paradox_navigation:
    mechanism: "Context detection triggers appropriate paradox side"
    examples:
      - context: "Early-stage startup asking about scaling"
        paradox_side: "'Don't scale' - do unscalable things first"
      - context: "Post-PMF company with growth stall"
        paradox_side: "'Scale what works' - but check activation first"

