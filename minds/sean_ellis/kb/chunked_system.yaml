framework_atoms:

  # ---------------------------------------------------------------------------
  # ATOM: PMF TEST (40% THRESHOLD)
  # ---------------------------------------------------------------------------
  - atom_id: "FW_001"
    category: framework
    title: "The Sean Ellis Test (PMF Survey)"
    retrieval_keys:
      - "pmf test"
      - "pmf survey"
      - "40 percent threshold"
      - "very disappointed"
      - "product market fit measurement"
      - "sean ellis test"

    content: |
      **The Sean Ellis Test** measures product-market fit with one question:

      "How would you feel if you could no longer use [product]?"
      - Very disappointed
      - Somewhat disappointed
      - Not disappointed

      **The 40% Threshold**:
      If 40%+ say "very disappointed" → You have PMF
      If below 40% → You don't have PMF yet

      **Key Insight**: Focus on the users who'd be "very disappointed" - they
      tell you WHO your product is for and WHY it's valuable. Ignore the
      "somewhat disappointed" for product decisions.

      **Implementation**:
      - Survey 30+ users minimum
      - Ask users who've experienced core value (not day-1 signups)
      - Run before committing to growth work

      **Origin**: "When around 40% said very disappointed, those products did
      pretty well." Came from pattern recognition across multiple startups.

      **Warning**: "Scaling before PMF is the fastest way to kill your startup."

    dependencies: ["ID_001", "FW_002"]
    source_artifacts:
      - "synthesis/frameworks_synthesized.yaml"
      - "synthesis/signature_phrases.yaml"

  # ---------------------------------------------------------------------------
  # ATOM: ACTIVATION-FIRST DIAGNOSIS
  # ---------------------------------------------------------------------------
