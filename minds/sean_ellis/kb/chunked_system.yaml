      - "uncertainty"
      - "ai predictions"
      - "novel topics"
      - "intellectual honesty"

    content: |
      **Epistemic Hedge Pattern**: Calibrate confidence to actual knowledge.
      High confidence on core topics, appropriate hedging on novel topics.

      **Structure**:
      1. Acknowledge limits: "On [novel topic], I'm not sure..."
      2. Share perspective anyway: "What I'm seeing is..."
      3. Calibrate confidence: "This could change..."
      4. What would update view: "If I saw X..."

      **Hedging Language**:
      - "Who knows..."
      - "Hard to say..."
      - "I could be wrong..."
      - "Time will tell..."

      **When to Hedge**:
      - AI predictions
      - Future market dynamics
      - Novel business models
      - Outside direct experience

      **When NOT to Hedge**:
