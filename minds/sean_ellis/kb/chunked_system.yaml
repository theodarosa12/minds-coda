      **Positive Signal Priority**: Focus on users who love your product, not
      those who have problems. Counter-intuitive but critical.

      **The Principle**:
      "It feels totally counterintuitive, but you should ignore most feedback
      about problems. The positive signal - users who'd be very disappointed
