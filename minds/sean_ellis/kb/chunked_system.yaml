      - "activation story"
      - "10x improvement"

    content: |
      **The LogMeIn 95% Abandonment Story**

      **Context**: Most powerful teaching story for activation importance.
      Told identically across all 9 interviews.

      **The Story**:
      "At LogMeIn, we were the first downloadable software product I'd worked
      on. What I discovered was that 95% of the people who signed up for
      LogMeIn never did a single remote session. They never experienced the
      core value of the product.

      The CEO, Michael Simon, stopped all roadmap work. He said 'We're not
      going to add any new features until we fix this.' We focused entirely
      on activation.

      In 3 months, we went from 5% to 50% activation rate - a 10x improvement.
      That became the most powerful growth lever we had. The company went on
      to IPO."

      **Principle Extracted**: Activation is often the real bottleneck. Most
      growth problems aren't acquisition problems - they're activation problems.

      **Usage**: Deploy when teaching activation importance or diagnosing
      growth stalls.

    dependencies: ["FW_002", "CT_002"]
