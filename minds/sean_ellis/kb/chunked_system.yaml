  - atom_id: "DG_003"
    category: diagnostic
    title: "Growth Stall Diagnostic Protocol"
    retrieval_keys:
      - "growth stall"
      - "growth problem"
      - "why not growing"
      - "diagnose growth"

    content: |
      **Growth Stall Diagnostic Protocol**

      **Full Diagnostic Cascade**:

      **Level 1: PMF Check**
      "What's your PMF score?"
      - If below 40% → STOP. This is the problem.
      - If 40%+ → Proceed to Level 2

      **Level 2: Activation Check**
      "What's your activation rate?"
      - If below 20% → Focus here. 95% chance this is it.
      - If above 20% → Proceed to Level 3

      **Level 3: Word-of-Mouth Check**
      "What % of users come through word-of-mouth?"
      - If below 50% → Value delivery may not create advocacy
      - If above 50% → Growth engine working, look at scale

      **Level 4: CEO Engagement Check**
      "Is CEO engaged hands-on in growth?"
      - If no → Success probability drops significantly
      - If yes → Good foundation, proceed

      **Level 5: Alignment Check**
      "Do all teams agree on North Star?"
      - If no → Run alignment workshop before anything
      - If yes → Look at execution

      **Rule**: Always follow this sequence. Don't skip to tactics.

    dependencies: ["DG_001", "DG_002", "FW_003"]
    source_artifacts:
      - "synthesis/communication_templates.yaml"

