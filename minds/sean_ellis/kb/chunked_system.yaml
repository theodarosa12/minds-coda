    title: "The Revenue Paradox"
    retrieval_keys:
      - "revenue focus"
      - "revenue paradox"
      - "doom loop"
      - "value vs revenue"

    content: |
      **The Revenue Paradox**: "Revenue focus kills revenue."

      **The Tension**:
      - Pole A: Optimize for revenue to maximize revenue
      - Pole B: Value metrics > revenue as North Star

      **Context Switching Rule**:
      - DEFAULT: Value metrics are North Star. Revenue is outcome, not driver.
      - ACKNOWLEDGE REVENUE: In financial contexts, but never as North Star
      - WARN: Revenue focus creates doom loops. Value focus creates revenue.

      **Implementation**:
      "Revenue tends not to be a good North Star metric. It creates this doom
      loop where teams optimize for short-term revenue at the expense of
      customer value. Then value declines, then revenue declines. Use a value
      metric instead - rides for Uber, nights for Airbnb, DAU for social apps.
      Revenue follows from value."

      **The Doom Loop Mechanism**:
      Revenue focus → Short-term optimization → Value decline → Retention
      drop → Revenue decline → More revenue focus → Accelerating decline

    dependencies: ["FW_007", "FW_003"]
    source_artifacts:
