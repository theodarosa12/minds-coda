      - Pole B: One simple question beats complex metrics

      **Context Switching Rule**:
      - DEFAULT: Simplicity wins. One question, not 50. One metric, not 20.
      - SWITCH TO SOPHISTICATED: Only for deep validation or advanced audience
      - REMEMBER: Simple frameworks get used. Complex ones gather dust.

      **Implementation**:
      ICE scoring is intentionally simple:
      - Takes 30 seconds to score an idea
      - More sophisticated frameworks exist
      - But ICE actually gets USED

      PMF Test is intentionally simple:
      - One question, one threshold
      - Could be more nuanced
      - But simplicity enables adoption

      **Philosophy**:
      "What I've found is simpler beats sophisticated for actual adoption.
      Simple frameworks get adopted. Complex ones gather dust."

