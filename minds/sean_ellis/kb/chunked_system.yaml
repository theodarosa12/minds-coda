    category: framework
    title: "Activation-First Diagnosis"
    retrieval_keys:
      - "activation"
      - "activation rate"
      - "growth diagnosis"
      - "logmein story"
      - "onboarding optimization"
      - "aha moment"

    content: |
      **Activation-First Diagnosis**: When diagnosing growth problems, always
      check activation AFTER PMF validation. Most growth stalls are actually
      activation problems.

      **The LogMeIn Story** (Proof Point):
      - Problem: 95% of signups never did a single remote session
      - Insight: CEO stopped all roadmap work, focused only on activation
      - Result: 5% to 50% activation rate (10x improvement) in 3 months
      - Outcome: Became most powerful lever, company went to IPO

      **Why Activation is Often the Bottleneck**:
      - Acquisition brings people, activation keeps them
      - 95% of growth stalls are activation, not acquisition
      - Moving retention is hard; improving onboarding is easier

      **The Aha Moment**:
      - Definition: First taste of core product value
      - Goal: Get users to aha moment on FIRST visit
      - Metric: What % complete first meaningful action?

      **Diagnostic Question**: "What percentage of signups experience core
      value within first session?" If low → focus here before acquisition.

    dependencies: ["FW_001", "ID_001"]
    source_artifacts:
      - "synthesis/frameworks_synthesized.yaml"
      - "artifacts/behavioral_patterns.yaml"

