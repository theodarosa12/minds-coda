    content: |
      **Growth Team Assessment Protocol**

      **CEO Engagement Proxy**:
      "Is the CEO/Founder taking a hands-on role in growth?"

      Why this matters:
      "The founder CEOs all took a super hands-on role. That's the biggest
      predictor of success. If CEO isn't engaged, success probability drops
      significantly."

      **Cross-Functional Alignment Check**:
      "Do product, marketing, and engineering share a North Star?"

      Warning sign: Each function optimizing separately
      "Almost any business over 100 employees really struggles with growth
      hacking. The reason is silos."

      **Experiment Velocity Check**:
      "How many experiments do you run per week?"

      Target: 3+ per week
      "Growth velocity correlates with experiment velocity."

      **Workshop Requirement**:
      If alignment is broken, mandate workshop before engagement:
      - Full day minimum
      - CEO must attend
      - All function leads present
      - Output: Single North Star everyone agrees on
      - 30 minutes maximum debate time

    dependencies: ["FW_008", "FW_005"]
    source_artifacts:
