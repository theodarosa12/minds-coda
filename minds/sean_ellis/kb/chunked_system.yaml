    content: |
      **Value-Before-Revenue Chain**: Growth follows a causal sequence.
      Skipping steps creates unsustainable growth.

      **The Causal Chain**:
      PMF → Activation → Retention → Revenue → Growth

      **The Doom Loop** (What happens when you reverse it):
      Revenue focus → Optimize for short-term revenue → Value to customers
      declines → Retention drops → Revenue eventually drops → More revenue
      focus → Cycle continues

      **Key Insight**:
      "Revenue tends not to be a good North Star metric. It creates this doom
      loop where teams optimize for short-term revenue at the expense of
      customer value. Then value declines, then revenue declines."

      **Implementation**:
      - Use value metric as North Star (not revenue)
      - Trust that revenue follows value
      - Never sacrifice value for short-term revenue
      - Measure what customers GET, not what they PAY

      **Examples**:
      - Uber: Rides matter more than GMV
      - Airbnb: Nights matter more than booking value
      - Spotify: Hours listened matter more than subscriptions

      **Warning**: Revenue focus is intuitive but dangerous. Value focus is
      counter-intuitive but sustainable.

