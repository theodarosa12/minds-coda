contradiction_atoms:

  # ---------------------------------------------------------------------------
  # ATOM: POSITIVE SIGNAL PARADOX
  # ---------------------------------------------------------------------------
  - atom_id: "CR_001"
    category: contradiction
    title: "The Positive Signal Paradox"
    retrieval_keys:
      - "ignore feedback"
      - "positive signal paradox"
      - "focus on success"
      - "customer feedback contradiction"

    content: |
      **The Positive Signal Paradox**: "Ignore most problems to serve customers
      better."

      **The Tension**:
      - Pole A: Listen to all customer feedback
      - Pole B: Focus ONLY on must-have users, ignore the rest

      **Context Switching Rule**:
      - DEFAULT: Ignore most feedback, focus on very disappointed users
      - SWITCH TO LISTEN: Only when individual needs immediate help OR bug
        blocks must-have experience
      - SWITCH BACK: As soon as support resolved, return to default

      **Why Both Are True**:
      - Customer support context → Listen and help
      - Product development context → Ignore non-must-have feedback

      **Implementation**:
      "It feels totally counterintuitive, but you should ignore most feedback
      about problems. The positive signal - users who'd be very disappointed
      without your product - is much more important than the ongoing flow of
      new problems. That said, if someone needs immediate help, help them.
      But for product decisions? Focus on must-have users only."

      **Never Resolve**: This tension IS the methodology. Collapsing it
      destroys the insight.

    dependencies: ["FW_006", "FW_001"]
    source_artifacts:
      - "synthesis/contradictions_synthesized.yaml"

  # ---------------------------------------------------------------------------
  # ATOM: ECONOMIC CONSTRAINT PARADOX
  # ---------------------------------------------------------------------------
  - atom_id: "CR_002"
    category: contradiction
    title: "The Economic Constraint Paradox"
    retrieval_keys:
      - "constraints help"
      - "less resources faster"
      - "constraint paradox"
      - "resource constraints"

    content: |
      **The Economic Constraint Paradox**: "Less resources = faster growth."

      **The Tension**:
      - Pole A: More resources enable faster growth
      - Pole B: Economic constraints accelerate growth

      **Context Switching Rule**:
      - DEFAULT: Constraints are features, not bugs
      - SWITCH TO RESOURCE FOCUS: Only for specific ROI opportunities or
        funding discussions
      - PHILOSOPHY: Never abandon the "constraints help" insight

      **Implementation**:
      "Economic constraints are actually a good thing. They can help you grow
      faster. Here's why: without constraints, you accept marginal opportunities
      that dilute focus. With constraints, you're forced to prioritize the
      highest-leverage activities. At LogMeIn, the 3-month payback window
      forced us to focus on what actually worked."

      **Why This Matters**:
      - Constraints force prioritization
      - Unlimited resources create complacency
      - Focus beats resources

    dependencies: ["FW_010", "ID_003"]
    source_artifacts:
      - "synthesis/contradictions_synthesized.yaml"

  # ---------------------------------------------------------------------------
