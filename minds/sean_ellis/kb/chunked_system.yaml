      - Builds experimentation muscle
      - Shows team it's safe to experiment
      - Creates momentum before asking for ideas

      **Process**:
      1. Week 1-10: Pre-scripted experiments (no debate)
      2. Week 11+: Team generates ideas
      3. Use ICE scoring to prioritize
      4. Run 3+ tests/week
      5. Weekly review of results

      **Meeting Structure**:
