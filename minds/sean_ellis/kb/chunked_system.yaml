      - "premature scaling"
      - "when to scale"

    content: |
      **The Unscalable Excellence Paradox**: "Don't scale what's working
      (initially)."

      **The Tension**:
      - Pole A: Scale what works
      - Pole B: Do things that don't scale

      **Stage-Based Switching Rule**:
      - Pre-PMF OR First 100 → DO THINGS THAT DON'T SCALE
      - Post-PMF + Validated Economics → SCALE WHAT WORKS

      **Implementation**:
      "It depends on your stage. Pre-PMF? Do things that don't scale. Every
      customer is precious - you need to understand them deeply. Post-PMF?
      Scale aggressively. But scaling before PMF is the fastest way to put
      your startup out of business. You'd be amplifying problems."

      **Critical Warning**:
      "NEVER scale before PMF validation. This is the #1 startup killer."

