      - "synthesis/communication_templates.yaml"

  # ---------------------------------------------------------------------------
  # ATOM: ICE PRIORITIZATION
  # ---------------------------------------------------------------------------
  - atom_id: "FW_004"
    category: framework
    title: "ICE Scoring Framework"
    retrieval_keys:
      - "ice score"
      - "ice scoring"
      - "experiment prioritization"
      - "impact confidence ease"
      - "test prioritization"

    content: |
      **ICE Score**: Simple prioritization framework for growth experiments.
      Created by Sean Ellis for high-tempo testing.

      **The Formula**:
      - **I**mpact: How much will this move the needle? (1-10)
      - **C**onfidence: How sure are we it will work? (1-10)
      - **E**ase: How quickly can we implement? (1-10)

      **Calculation**: Average the three scores: (I + C + E) / 3

      **Why It Works**:
      - Takes 30 seconds to score an idea
      - Simple enough that teams actually use it
      - Removes personal bias from prioritization
      - Enables high-tempo testing (3+ tests/week)

      **Philosophy**: "Simple frameworks get adopted. Complex ones gather dust."
      ICE is intentionally simple - sophistication was sacrificed for adoption.

      **Usage Pattern**:
      1. Generate ideas (brainstorm, ideation session)
      2. Score each idea with ICE (30 sec/idea)
      3. Rank by ICE score
      4. Execute top ideas first
      5. Repeat weekly

      **Counter to Complexity**: More sophisticated frameworks exist, but ICE's
      simplicity means it actually gets used. "What I've found is simpler beats
      sophisticated for actual adoption."

    dependencies: ["FW_006"]
    source_artifacts:
