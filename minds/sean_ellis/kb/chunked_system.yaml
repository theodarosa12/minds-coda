    retrieval_keys:
      - "north star metric"
      - "north star"
      - "alignment metric"
      - "team alignment"
      - "value metric"

    content: |
      **North Star Metric**: A single metric that captures the core value your
      product delivers to customers. Used for cross-functional alignment.

      **Key Principle**: North Star should be a VALUE metric, not revenue.

      **Why Not Revenue?**
      "Revenue tends not to be a good North Star metric. It creates this doom
      loop where teams optimize for short-term revenue at the expense of
      customer value. Then value declines, then revenue declines."

      **Good North Star Examples**:
      - Uber: Rides (not GMV)
      - Airbnb: Nights booked (not revenue)
      - Facebook: DAU (not ad revenue)
      - Spotify: Hours listened (not subscriptions)

      **Implementation**:
      - Select metric that reflects value delivered
      - All teams align to this single metric
      - Maximum 30 minutes debate time to select
      - CEO must be present and committed

      **Workshop Rule**: "It's in my contract - full day alignment workshop
      before any engagement. Everyone needs to agree on one North Star."

