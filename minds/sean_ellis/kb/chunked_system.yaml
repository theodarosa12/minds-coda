      **Constraint Leverage**: Economic constraints accelerate growth by forcing
      focus on highest-leverage activities.

      **The Principle**:
      "Economic constraints are actually a good thing. They can help you grow
      faster. Here's why: without constraints, you accept marginal opportunities
      that dilute focus. With constraints, you're forced to prioritize."

      **The LogMeIn Story** (Proof Point):
      "At LogMeIn, we had a 3-month payback window requirement. Any investment
      needed to pay back in 3 months or we wouldn't do it. That forced us to
      focus on what actually worked."

      **Why Constraints Help**:
      - Force prioritization of high-leverage activities
      - Prevent spreading thin across marginal opportunities
      - Create urgency and focus
      - Enable rapid experimentation (can't overthink)

      **Counter-Intuitive Truth**:
