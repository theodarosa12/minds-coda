diagnostic_atoms:

  # ---------------------------------------------------------------------------
  # ATOM: PMF DIAGNOSTIC
  # ---------------------------------------------------------------------------
  - atom_id: "DG_001"
    category: diagnostic
    title: "PMF Diagnostic Protocol"
    retrieval_keys:
      - "pmf diagnostic"
      - "check pmf"
      - "pmf assessment"
      - "startup assessment"

    content: |
      **PMF Diagnostic Protocol**

      **Step 1: Run the Sean Ellis Test**
      Question: "How would you feel if you could no longer use [product]?"
      - Very disappointed
      - Somewhat disappointed
      - Not disappointed

      **Step 2: Calculate Percentage**
      What % said "very disappointed"?

      **Step 3: Interpret Result**
      - Below 40%: You do NOT have PMF yet
      - At or above 40%: You likely have PMF

      **If Below 40%**:
      STOP all scaling efforts. Focus entirely on:
      1. Study the users who ARE very disappointed
      2. Find what they have in common
      3. Build for more people like them
      4. Re-run survey

      **If At or Above 40%**:
      You have foundation for growth work.
      Proceed to activation diagnostic.

      **Implementation Requirements**:
      - Survey 30+ users minimum
      - Survey users who've experienced core value
      - Don't survey day-1 signups
      - Run BEFORE committing to engagement

    dependencies: ["FW_001", "CT_006"]
    source_artifacts:
      - "synthesis/frameworks_synthesized.yaml"

  # ---------------------------------------------------------------------------
  # ATOM: ACTIVATION DIAGNOSTIC
  # ---------------------------------------------------------------------------
  - atom_id: "DG_002"
    category: diagnostic
    title: "Activation Diagnostic Protocol"
    retrieval_keys:
      - "activation diagnostic"
      - "check activation"
      - "onboarding assessment"
      - "aha moment check"

    content: |
      **Activation Diagnostic Protocol**

      **Prerequisite**: PMF validated (40%+ very disappointed)

      **Step 1: Define Aha Moment**
      What is the first experience of core value?
      - For LogMeIn: First remote session
      - For Dropbox: First file synced
      - For LinkedIn: First connection made

      **Step 2: Measure Activation Rate**
      What % of signups reach aha moment?

      **Step 3: Interpret Result**
      - Below 20%: CRITICAL - this is likely your bottleneck
      - 20-50%: Significant opportunity
      - 50%+: Good foundation, look elsewhere

      **If Activation is Low**:
      This is your highest-leverage focus area.

      Typical causes:
      - Too many steps to value
      - Unclear value proposition
      - Technical friction
      - Wrong onboarding flow

      **The LogMeIn Benchmark**:
      "95% never did a session. We got it to 50%. 10x improvement in 3 months."

      **Rule**: Check activation BEFORE acquisition. Most acquisition problems
      are actually activation problems.

    dependencies: ["FW_002", "DG_001"]
    source_artifacts:
      - "synthesis/frameworks_synthesized.yaml"

