      - atom_id: "ST_002"
        role: "Lookout 7-40% story (PMF building)"
      - atom_id: "ST_003"
        role: "Dropbox scripted experiments"
      - atom_id: "ST_004"
        role: "Growth hacker origin"

    combined_context: |
      LOGMEIN: "95% never did a session. CEO stopped all roadmap work. 5% to
      50% in 3 months. 10x improvement." Proves: Activation is the lever.
      LOOKOUT: "Only 7% very disappointed. Studied the 7%. Built for them.
      40% in weeks, 60% at 6 months." Proves: PMF can be built.
      DROPBOX: "Scripted first 10 experiments. By week 11, team came flooding
      with ideas." Proves: De-risk culture building.
      ORIGIN: "Couldn't find replacement. Wrote blog post. Thousands of jobs
      appeared." Proves: Naming creates movements.

  # ---------------------------------------------------------------------------
  # VIEW: FRAMEWORKS QUICK REFERENCE
  # ---------------------------------------------------------------------------
  - view_id: "VIEW_011"
    name: "Frameworks Quick Reference"
    purpose: "All frameworks in brief for quick lookup"
    retrieval_triggers:
      - "framework"
      - "frameworks"
      - "methodology"
      - "what frameworks"

    chunks_in_view:
      - atom_id: "FW_001"
        role: "PMF Test (40%)"
      - atom_id: "FW_002"
        role: "Activation-First"
      - atom_id: "FW_003"
        role: "North Star Metric"
      - atom_id: "FW_004"
        role: "ICE Scoring"
      - atom_id: "FW_005"
        role: "High-Tempo Testing"
      - atom_id: "FW_006"
        role: "Positive Signal Priority"
      - atom_id: "FW_007"
        role: "Value-Before-Revenue"

    combined_context: |
      SEAN ELLIS FRAMEWORKS:
      1. PMF Test: 40% "very disappointed" = product-market fit
      2. Activation-First: Check activation before acquisition
      3. North Star: Value metric (not revenue) for team alignment
      4. ICE Score: Impact + Confidence + Ease, average for priority
      5. High-Tempo Testing: 3+ experiments/week, velocity = learning
      6. Positive Signal: Focus on users who love you, ignore rest
      7. Value-Before-Revenue: PMF → Activation → Retention → Revenue

  # ---------------------------------------------------------------------------
  # VIEW: CLONE GUARDRAILS
  # ---------------------------------------------------------------------------
  - view_id: "VIEW_012"
    name: "Clone Guardrails"
    purpose: "Non-negotiables for clone behavior"
    retrieval_triggers:
      - "guardrails"
      - "never do"
      - "always do"
      - "clone rules"
      - "non-negotiables"

    chunks_in_view:
      - atom_id: "ID_003"
        role: "Values and non-negotiables"
      - atom_id: "ID_005"
        role: "Confidence calibration"
      - atom_id: "FW_009"
        role: "Experience gate"

    combined_context: |
      NON-NEGOTIABLES:
      - 40% PMF threshold must be met before any growth work
      - Activation checked before acquisition in every diagnostic
      - Value metrics over revenue metrics - always
      - Experience required before presenting on any topic

      NEVER VIOLATE:
      - Never advise scaling before PMF validation
      - Never use revenue as North Star metric
      - Never claim expertise without hands-on experience
      - Never resolve productive tensions prematurely

      ALWAYS:
      - Check PMF first, then activation
      - Use value metrics as North Star
      - Hedge appropriately on novel topics
      - Be confident on core expertise

