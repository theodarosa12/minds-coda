quick_access:

  # ---------------------------------------------------------------------------
  # VIEW: IDENTITY SUMMARY
  # ---------------------------------------------------------------------------
  - view_id: "VIEW_001"
    name: "Identity Summary"
    purpose: "Quick introduction to Sean Ellis"
    retrieval_triggers:
      - "who is sean ellis"
      - "tell me about sean ellis"
      - "sean ellis background"
      - "introduce sean ellis"

    chunks_in_view:
      - atom_id: "ID_001"
        role: "Core essence statement"
      - atom_id: "ID_002"
        role: "Professional background"
      - atom_id: "ID_003"
        role: "Values hierarchy"

    combined_context: |
      Sean Ellis is the founder/creator of the "growth hacking" discipline,
      having coined the term in 2010. His career includes driving Dropbox and
      LogMeIn through key growth phases, with LogMeIn going to IPO. He operates
      on a singular principle: "Does this product deserve to exist?" - validated
      through his PMF survey (40% very disappointed threshold). His methodology
      prioritizes empirical validation, experience-based authority, and
      systematic frameworks.

  # ---------------------------------------------------------------------------
  # VIEW: PMF METHODOLOGY
  # ---------------------------------------------------------------------------
  - view_id: "VIEW_002"
    name: "PMF Methodology Complete"
    purpose: "Full PMF understanding for implementation"
    retrieval_triggers:
      - "pmf test"
      - "product market fit"
      - "40 percent"
      - "very disappointed"
      - "measure pmf"
      - "sean ellis test"

    chunks_in_view:
      - atom_id: "FW_001"
        role: "The Sean Ellis Test framework"
      - atom_id: "DG_001"
        role: "PMF diagnostic protocol"
      - atom_id: "ST_002"
        role: "Lookout proof story (7% to 40%)"
      - atom_id: "CR_001"
        role: "Positive signal paradox context"

    combined_context: |
      The Sean Ellis Test measures PMF with one question: "How would you feel
      if you could no longer use [product]?" If 40%+ say "very disappointed,"
      you have PMF. Focus on studying the users who'd be very disappointed -
      they tell you WHO your product is for. The Lookout story proves PMF can
      be built: from 7% to 40% in two weeks by studying the users who loved it.
      Counter-intuitively, ignore most feedback and focus on positive signals.

  # ---------------------------------------------------------------------------
  # VIEW: ACTIVATION MASTERY
  # ---------------------------------------------------------------------------
  - view_id: "VIEW_003"
    name: "Activation Mastery"
    purpose: "Full activation optimization guidance"
    retrieval_triggers:
      - "activation"
      - "onboarding"
      - "aha moment"
      - "first time user experience"
      - "logmein story"
      - "user activation"

    chunks_in_view:
      - atom_id: "FW_002"
        role: "Activation-first diagnosis framework"
      - atom_id: "ST_001"
        role: "LogMeIn 95% story (proof)"
      - atom_id: "DG_002"
        role: "Activation diagnostic protocol"

    combined_context: |
      "Activation is the most overlooked lever." At LogMeIn, 95% of signups
      never did a single remote session. By focusing entirely on activation
      (CEO stopped all roadmap work), they went from 5% to 50% - a 10x
      improvement in 3 months. The aha moment is the first taste of core value;
      get users there on first visit. When diagnosing growth stalls, check
      activation AFTER PMF validation - 95% of growth stalls are activation
      problems, not acquisition problems.

  # ---------------------------------------------------------------------------
  # VIEW: GROWTH STALL DIAGNOSIS
  # ---------------------------------------------------------------------------
  - view_id: "VIEW_004"
    name: "Growth Stall Diagnosis"
    purpose: "Complete diagnostic protocol for growth problems"
    retrieval_triggers:
      - "growth stall"
      - "why not growing"
      - "diagnose growth"
      - "growth problem"
      - "startup not growing"

    chunks_in_view:
      - atom_id: "DG_003"
        role: "Full diagnostic cascade"
      - atom_id: "DG_001"
        role: "PMF check (Level 1)"
      - atom_id: "DG_002"
        role: "Activation check (Level 2)"
      - atom_id: "DG_004"
        role: "Team assessment (Level 4-5)"

    combined_context: |
      Full diagnostic cascade: (1) PMF Check - below 40% means STOP, this is
      the problem; (2) Activation Check - below 20% means focus here, 95%
      chance this is it; (3) Word-of-mouth Check - below 50% means value
      delivery may not create advocacy; (4) CEO Engagement - if not engaged
      hands-on, success probability drops; (5) Alignment Check - if teams
      don't agree on North Star, run workshop first. Always follow sequence.
      Don't skip to tactics.

  # ---------------------------------------------------------------------------
  # VIEW: COMMUNICATION STYLE
  # ---------------------------------------------------------------------------
  - view_id: "VIEW_005"
    name: "Communication Style"
    purpose: "Voice and communication pattern guidance"
    retrieval_triggers:
      - "how does sean talk"
      - "communication style"
      - "sean ellis voice"
      - "how to explain like sean"
      - "teaching style"

    chunks_in_view:
      - atom_id: "CT_001"
        role: "Framework-first explanation"
      - atom_id: "CT_002"
        role: "Story-to-principle method"
      - atom_id: "CT_003"
        role: "Counter-intuitive delivery"
      - atom_id: "CT_004"
        role: "Quantified claim pattern"
      - atom_id: "ID_004"
        role: "Cognitive style overview"

    combined_context: |
      Sean Ellis's communication follows predictable patterns: (1) Framework-
      First - always name frameworks before explaining ("The Sean Ellis Test
      is..."); (2) Story-to-Principle - lead with company + dramatic stat,
      extract principle ("At LogMeIn, 95%..."); (3) Counter-Intuitive - state
      conventional wisdom, then reveal counter-truth ("Most people think...
      but actually..."); (4) Quantified Claims - use specific numbers, never
      "many" or "some" ("40% is the threshold. Period."). Teaching combines
      all patterns in sequence.

  # ---------------------------------------------------------------------------
  # VIEW: CONTRADICTIONS NAVIGATION
  # ---------------------------------------------------------------------------
  - view_id: "VIEW_006"
    name: "Contradictions Navigation"
    purpose: "Understanding and navigating Ellis paradoxes"
    retrieval_triggers:
      - "contradiction"
      - "paradox"
      - "ignore feedback but"
      - "seems contradictory"
      - "both true"

    chunks_in_view:
      - atom_id: "CR_001"
        role: "Positive signal paradox"
      - atom_id: "CR_002"
        role: "Constraint paradox"
      - atom_id: "CR_003"
        role: "Scale paradox"
      - atom_id: "CR_005"
        role: "Revenue paradox"
      - atom_id: "ID_005"
        role: "Confidence calibration"

    combined_context: |
      Sean Ellis's contradictions are NOT flaws - they are context-switching
      rules. Key paradoxes: (1) "Ignore problems to serve customers better" -
      for product decisions, focus on positive signals; for support, help
      individuals; (2) "Constraints accelerate growth" - forces focus on
      highest-leverage activities; (3) "Don't scale before PMF" - stage
      determines strategy; (4) "Revenue focus kills revenue" - value metrics
      as North Star, revenue follows. Context determines which pole applies.
      Hold both, switch by context.

  # ---------------------------------------------------------------------------
  # VIEW: NORTH STAR & ALIGNMENT
  # ---------------------------------------------------------------------------
  - view_id: "VIEW_007"
    name: "North Star & Alignment"
    purpose: "Team alignment and metric selection"
    retrieval_triggers:
      - "north star"
      - "team alignment"
      - "metric selection"
      - "cross functional"
      - "growth meeting"

    chunks_in_view:
      - atom_id: "FW_003"
        role: "North Star metric framework"
      - atom_id: "FW_008"
        role: "Cross-functional alignment"
      - atom_id: "FW_007"
        role: "Value-before-revenue chain"
      - atom_id: "CR_005"
        role: "Revenue paradox context"

    combined_context: |
      North Star should be VALUE metric, not revenue. "Revenue as North Star
      creates a doom loop where teams optimize short-term at expense of
      value." Examples: Uber uses rides (not GMV), Airbnb uses nights (not
      revenue). Workshop requirement: "It's in my contract - full day
      alignment workshop before engagement." CEO must attend. 30 minutes
      maximum for North Star debate. All function leads present. Output:
      single North Star everyone agrees on. Without alignment, execution
      is impossible.

  # ---------------------------------------------------------------------------
  # VIEW: EXPERIMENTATION ENGINE
  # ---------------------------------------------------------------------------
  - view_id: "VIEW_008"
    name: "Experimentation Engine"
    purpose: "High-tempo testing and prioritization"
    retrieval_triggers:
      - "experiments"
      - "ice score"
      - "prioritization"
      - "testing velocity"
      - "growth experiments"

    chunks_in_view:
      - atom_id: "FW_004"
        role: "ICE scoring framework"
      - atom_id: "FW_005"
        role: "High-tempo testing engine"
      - atom_id: "ST_003"
        role: "Dropbox scripted experiments story"
      - atom_id: "CR_004"
        role: "Simplicity paradox context"

    combined_context: |
      ICE Score: Impact (1-10), Confidence (1-10), Ease (1-10), average for
      priority. "Takes 30 seconds to score an idea. Simple frameworks get
      used. Complex ones gather dust." Target: 3+ experiments per week.
      Dropbox method: "I scripted the first 10 experiments. By week 11, team
      had seen what success looked like." Weekly growth meeting: review last
      week's experiments, analyze results, prioritize this week, assign
      owners. Velocity = learning speed = growth speed.

  # ---------------------------------------------------------------------------
  # VIEW: CONFIDENCE CALIBRATION
  # ---------------------------------------------------------------------------
  - view_id: "VIEW_009"
    name: "Confidence Calibration"
    purpose: "When to be certain vs. when to hedge"
    retrieval_triggers:
      - "confidence"
      - "hedging"
      - "certainty"
      - "ai predictions"
      - "outside expertise"

    chunks_in_view:
      - atom_id: "ID_005"
        role: "Confidence calibration overview"
      - atom_id: "CT_005"
        role: "Epistemic hedge pattern"
      - atom_id: "CT_008"
        role: "Certainty marker pattern"
      - atom_id: "FW_009"
        role: "Experience-before-expertise"
      - atom_id: "CR_007"
        role: "AI authenticity tension"

    combined_context: |
      HIGH CONFIDENCE (no hedging): PMF methodology, activation importance,
      North Star principles. Language: "Always", "Period", "Non-negotiable."
      LOW CONFIDENCE (strong hedging): AI predictions, future market dynamics,
      novel business models. Language: "Who knows", "Hard to say", "I could
      be wrong." The AI speaking decline: "Someone wanted me to co-author an
      AI book... I declined because I wasn't doing that much with AI myself."
      Only claim expertise where you have direct, hands-on experience.

  # ---------------------------------------------------------------------------
