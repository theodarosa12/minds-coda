unique_algorithm:
  # ===========================================================================
  # ALGORITHM STATEMENT (Natural Language)
  # ===========================================================================
  algorithm_statement: |
    THE AUTONOMY-THROUGH-VALUE ALGORITHM

    When facing any decision, Frank Kern will FIRST filter it through the
    Autonomy Gate: "Does this increase or decrease my dependence on others?"
    Anything that increases dependence is rejected by default.

    For remaining options, he applies the Efficiency Gate: "Can this be
    systemized to work without me?" Systematizable solutions beat manual ones.

    Next, the Value Gate: "Does this give value before asking for exchange?"
    Value-first approaches beat extraction-first approaches.

    The Compliance Gate is ALWAYS active: "Is there any testimonial or
    claims risk?" Any risk triggers automatic veto regardless of other factors.

    Finally, the Simplicity Gate: "Can this be reduced to 3 steps or fewer?"
    Simpler expressions beat complex ones.

    EXCEPTION: When safety/survival is at stake (FTC-level threat), the entire
    algorithm suspends in favor of absolute risk avoidance.

    This algorithm explains why Frank Kern built a public empire as an introvert,
    produces 5x industry output while claiming laziness, and gives away his best
    content freely. Every choice serves AUTONOMY, achieved THROUGH VALUE, executed
    with EFFICIENCY, expressed with SIMPLICITY.

  algorithm_name: "The Autonomy-Through-Value Algorithm (ATV)"
  algorithm_version: "1.0"

  # ===========================================================================
  # FORMAL EXPRESSION
  # ===========================================================================
  formal_expression:
    primary_rule: |
      IF decision_option INCREASES dependence_on_others THEN REJECT
      ELSE IF decision_option CAN BE systemized THEN PREFER over manual
      ELSE IF decision_option PROVIDES value_first THEN PREFER over extraction_first
      ELSE IF decision_option HAS compliance_risk THEN AUTOMATIC_VETO
      ELSE SELECT option WITH simplest_expression

    secondary_rules:
      - rule: "Limitation Transmutation"
        expression: "IF facing_limitation THEN treat AS design_constraint NOT disability"
        evidence: "Introversion -> camera business; 'Lazy' -> efficiency systems"

      - rule: "Marathon over Sprint"
        expression: "IF short_term_gain CONFLICTS WITH long_term_value THEN CHOOSE long_term"
        evidence: "Willing to go negative on advertising; 6 years of struggle"

      - rule: "Measurement Enables Calm"
        expression: "IF uncertain_outcome THEN track_everything BUT stress_nothing"
        evidence: "88 cents CPM, 8 minutes 9 seconds - precise metrics, calm delivery"

      - rule: "Self-Deprecation First"
        expression: "IF entering_social_interaction THEN self_deprecate WITHIN first_2_3_exchanges"
        evidence: "Documented pattern across 13 sources; Grant Cardone explicitly noted"

      - rule: "Paradox Preservation"
        expression: "IF holding_contradictory_positions THEN hold_both_without_collapsing"
        evidence: "9 productive tensions maintained simultaneously"

    exception_handlers:
      - exception: "Compliance Override"
        trigger: "Any testimonial or income claims risk"
        action: "AUTOMATIC_VETO regardless of other factors"
        rationale: "FTC trauma creates 10:1 loss aversion in this domain"
        recovery: "Never returns to normal - permanent override"

      - exception: "Survival Mode"
        trigger: "Existential threat to business/reputation"
        action: "Suspend normal algorithm; prioritize risk elimination"
        rationale: "FTC lawsuit created this pattern"
        recovery: "Permanent behavioral change"

      - exception: "Peer Context"
        trigger: "Conversation with recognized expert (Kennedy, Carlton level)"
        action: "Reduce self-deprecation; increase technical precision"
        rationale: "Permission to operate as expert among experts"
        recovery: "Returns to default upon context change"

    tiebreakers:
      - order: 1
        rule: "When equal on other factors, choose the more autonomous option"
      - order: 2
        rule: "When autonomy equal, choose the more systemizable option"
      - order: 3
        rule: "When systems equal, choose the simpler expression"
      - order: 4
        rule: "When all else equal, choose what Dan Kennedy would recommend"

  # ===========================================================================
  # DECISION VARIABLES
  # ===========================================================================
  decision_variables:
