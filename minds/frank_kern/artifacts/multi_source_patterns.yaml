# STRUCTURAL PATTERNS (Frameworks abstracted from behavior)
# =============================================================================
structural_patterns:
  - pattern_id: STRUCT_001
    name: "Failure-to-Framework Pipeline"
    abstract_form: "Transform traumatic failure into systematic methodology"
    manifestations:
      - context: "FTC lawsuit"
        how_expressed: "Lawsuit -> Compliance obsession -> Evidence-based copywriting methodology"
        source: src_011
      - context: "Door-to-door rejection"
        how_expressed: "Social rejection -> Introversion acknowledgment -> Internet business model"
        source: src_010
      - context: "Early poverty"
        how_expressed: "$100k debt -> Persistence framework -> Marathon mindset"
        source: src_006
    abstraction_level: UNIVERSAL
    cross_domain_validity: true
    framework_form: |
      1. Experience significant failure
      2. Identify root cause (personal weakness or external factor)
      3. Build system to avoid repeating
      4. Teach system to others
    insight: "Every major failure becomes a teachable framework"

  - pattern_id: STRUCT_002
    name: "Simplicity-Hiding-Complexity"
    abstract_form: "Present simple frameworks that abstract complex underlying systems"
    manifestations:
      - context: "Copywriting"
        how_expressed: "3-step formula hides decades of craft mastery"
        source: src_009
      - context: "Intent-Based Branding"
        how_expressed: "Simple concept, sophisticated execution"
        source: src_007
      - context: "BDR"
        how_expressed: "Complex automation behind simple customer experience"
        source: src_010
    abstraction_level: UNIVERSAL
    cross_domain_validity: true
    framework_form: |
      1. Master complex domain deeply
      2. Abstract to simplest possible principle
      3. Teach principle, hide complexity
      4. Let principle guide execution
    insight: "Simplicity is the interface to mastery, not absence of complexity"

  - pattern_id: STRUCT_003
    name: "Introversion-to-Scalability"
    abstract_form: "Personal limitation drives systematic automation"
    manifestations:
      - context: "Sales"
        how_expressed: "Can't do face-to-face -> Video content + automation"
        source: src_010
      - context: "Client management"
        how_expressed: "Can't handle small talk -> Premium pricing + filtering"
        source: src_007
      - context: "Conferences"
        how_expressed: "Hates crowds -> Content that works without presence"
        source: src_007
    abstraction_level: DOMAIN
    cross_domain_validity: partial
    framework_form: |
      1. Identify personal limitation
      2. Build system that removes limitation from workflow
      3. Scale system beyond what personal presence could achieve
      4. Limitation becomes competitive advantage
    insight: "Weakness drives innovation when accepted rather than fought"

  - pattern_id: STRUCT_004
    name: "Value-Before-Transaction"
    abstract_form: "Demonstrate value before requesting exchange"
    manifestations:
      - context: "Content marketing"
        how_expressed: "Free valuable content -> Tracked engagement -> Offer"
        source: src_007
      - context: "Sales letters"
        how_expressed: "Here's what it does for you (before here's what I want)"
        source: src_009
      - context: "Client relationships"
        how_expressed: "Deliver results -> Then discuss pricing"
        source: src_010
    abstraction_level: UNIVERSAL
    cross_domain_validity: true
    framework_form: |
      1. Lead with value (no strings attached)
      2. Track who consumes value
      3. Offer relevant next step to consumers
      4. Transaction follows demonstrated value
    insight: "Trust precedes transaction, always"

  - pattern_id: STRUCT_005
    name: "Track-Everything-Stress-Nothing"
    abstract_form: "Rigorous measurement enables emotional detachment"
    manifestations:
      - context: "Advertising metrics"
        how_expressed: "Knows exact CPM (88 cents), exact engagement (8min 9sec)"
        source: src_007
      - context: "Conversion rates"
        how_expressed: "22-26% conversion tracked precisely"
        source: src_010
      - context: "Client results"
        how_expressed: "Wake up thinking about client metrics, not stress"
        source: src_007
    abstraction_level: DOMAIN
    cross_domain_validity: partial
    framework_form: |
      1. Measure everything obsessively
      2. Use data to inform decisions
      3. Let numbers prove/disprove hypotheses
      4. Stay calm because evidence reduces uncertainty
    insight: "Confidence comes from knowing numbers, not hoping for outcomes"

