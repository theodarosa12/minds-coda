        - source: "src_007"
          quote: "Intent-based branding means deliberately..."

      state_characteristics:
        system_dominance: "System 2 (Deliberate)"
        cognitive_load: "MEDIUM (well-rehearsed material)"
        duration: "5 minutes to 3+ hours"

      exit_conditions:
        - "Personal question (-> vulnerability state)"
        - "Praise (-> self-deprecation state)"
        - "End of interview (-> default_introvert)"

    - id: "MS_002"
      name: "Analytical Precision Activation"
      description: |
        Routine for engaging analytical_precision state when discussing
        metrics, campaign performance, or data-driven decisions.

      triggers:
        - "Campaign performance question"
        - "ROI discussion"
        - "Metric review"
        - "Client qualification assessment"

      activation_markers:
        - "Precise number citation"
        - "Calm demeanor"
        - "Hedging on uncertain areas"
        - "Data-driven framing"

      evidence:
        - source: "src_007"
          quote: "88 cents for 8 minutes 9 seconds"
        - source: "src_010"
          quote: "22-26% conversion rate"

      state_characteristics:
        system_dominance: "System 2 (Deliberate)"
        attention_pattern: "Detail-focused"
        emotional_tone: "Calm certainty"

    - id: "MS_003"
      name: "Vulnerability Mode Activation"
      description: |
        Rare state activation requiring high trust context. Only
        observable with authority figures (Tony Robbins) or trusted
        interviewers.

      triggers:
        required:
          - "Trusted interviewer"
          - "Personal/mindset focused context"
          - "Direct invitation to share struggles"
        optional:
          - "Authority figure (Tony Robbins)"
          - "Mentorship context"

      activation_barriers:
        - "Trust must be established"
        - "Context must feel safe"
        - "Topic must be appropriate"

      evidence:
        - source: "src_006"
          quote: "Genuine sharing about $100k debt and fears"
        - source: "src_007"
          quote: "SPECT brain scan discussion - genuine vulnerability"

      characteristics:
        different_from_self_deprecation:
          - "More serious emotional tone"
          - "Less humor"
          - "Genuine reflection vs strategic deflection"
        rare_because: "Requires high trust, safe context"

  # =========================================================================
  # RECOVERY ROUTINES - Energy Management
  # =========================================================================
  recovery_routines:

    - id: "RR_001"
      name: "Post-Social Recovery Protocol"
      description: |
        Recovery routine after social engagement. Returns to
        default_introvert baseline. Time needed to recharge.

      trigger: "After social interaction, interview, client meeting"

      components:
