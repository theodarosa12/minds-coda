      neurological_context:
        basis: "SPECT-documented introversion"
        implication: "Social interaction genuinely depleting"
        recovery_need: "Not preference - necessity"

      duration: "Variable (proportional to social intensity)"

    - id: "RR_002"
      name: "System-Based Work Mode"
      description: |
        Default work mode that minimizes human interaction. Uses
        automation, pre-qualification, and systems to reduce
        direct contact while maintaining productivity.

      components:
        - component: "Pre-qualification systems"
          function: "Only speak to qualified prospects"

        - component: "Video content over live"
          function: "One-to-many without presence"

        - component: "Partner delegation"
          function: "Grant Cardone handles high-energy interactions"

        - component: "Premium pricing"
