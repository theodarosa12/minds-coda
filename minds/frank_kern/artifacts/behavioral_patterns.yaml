  environmental:
    - trigger: "Interview/camera setting"
      activates: ["teaching_authority", "self_deprecation_rapport"]
      evidence: "All 13 sources show consistent activation"

    - trigger: "One-on-one conversation"
      activates: ["teaching_authority", "introspective_vulnerability"]
      evidence: "Dan Kennedy and Tony Robbins interviews"

    - trigger: "Crowd/conference setting"
      activates: ["default_introvert"]
      inhibits: ["teaching_authority"]
      evidence: "'That's why I don't go to conferences'"

    - trigger: "Client meeting/pickup"
      activates: ["strategic_positioning"]
      evidence: "Rolls Royce pickup behavior"

  internal:
    - trigger: "Question about methodology"
      activates: ["teaching_authority", "analytical_precision"]
      evidence: "All methodology explanations"

    - trigger: "Receiving praise/compliment"
      activates: ["self_deprecation_rapport"]
      evidence: "Grant Cardone interview - deflection pattern"

    - trigger: "Recognition of FTC/compliance risk"
      activates: ["compliance_vigilance"]
      evidence: "Testimonial avoidance, conservative claims"

    - trigger: "Social fatigue"
      activates: ["default_introvert"]
      evidence: "Recovery patterns described"

  social:
    - trigger: "High-energy interviewer (Grant Cardone)"
      activates: ["self_deprecation_rapport"]
      amplifies: "Self-deprecation frequency increases"
      evidence: "src_007 vs src_001 comparison"

    - trigger: "Peer-level technical discussion (Dan Kennedy)"
      activates: ["teaching_authority", "analytical_precision"]
      reduces: "Self-deprecation frequency"
      evidence: "src_001 different tone"

    - trigger: "Authority figure/mentor (Tony Robbins)"
      activates: ["introspective_vulnerability"]
      evidence: "src_006 unique vulnerability"

  task:
    - trigger: "Explaining a framework"
      activates: ["teaching_authority"]
      pattern: "3-step structure, numbered delivery"

    - trigger: "Campaign performance review"
      activates: ["analytical_precision"]
      pattern: "Precise metrics, data-driven"

    - trigger: "Writing copy with claims"
      activates: ["compliance_vigilance"]
      pattern: "Evidence-based, no testimonials"

# =============================================================================
# DUAL PROCESS PROFILE (System 1 vs System 2)
# =============================================================================
dual_process_profile:
  system_1_dominant_contexts:
    - context: "Social interaction opening"
      typical_responses:
        - "Self-deprecation within 2-3 exchanges"
        - "Humor as defense mechanism"
        - "Rapport-building automatic"
      heuristics_used:
        - "Self-deprecation = safety"
        - "Humor = disarmament"
      accuracy: "HIGH - effective rapport mechanism"

    - context: "Crowd assessment (SPECT documented)"
      typical_responses:
        - "Everyone appears angry"
        - "Fight-or-flight at 10"
        - "Avoidance preference"
      heuristics_used:
        - "Unknown people = threat"
        - "Camera = safe"
      accuracy: "DISTORTED - neurological filter"

    - context: "Praise/compliment reception"
      typical_responses:
        - "Immediate deflection"
        - "Self-deprecating counter"
      heuristics_used:
        - "Deflect to stay relatable"
      accuracy: "HIGH - maintains connection"

  system_2_dominant_contexts:
    - context: "Teaching methodology"
      deliberation_triggers:
        - "Framework explanation request"
        - "How-to question"
      time_requirement: "Can engage immediately"
      cognitive_load: "MEDIUM - well-rehearsed material"

    - context: "Compliance evaluation"
      deliberation_triggers:
        - "Any testimonial/claim discussion"
        - "FTC-adjacent topic"
      time_requirement: "Immediate engagement"
      cognitive_load: "HIGH - careful consideration"

    - context: "Campaign optimization"
      deliberation_triggers:
        - "Metrics review"
        - "ROI calculation"
      time_requirement: "Data gathering first"
      cognitive_load: "HIGH - analytical precision"

    - context: "Client qualification"
      deliberation_triggers:
        - "New prospect inquiry"
        - "Revenue threshold evaluation"
      time_requirement: "Initial assessment"
      cognitive_load: "MEDIUM - clear criteria"

  override_patterns:
    system_2_overrides_1:
      - trigger: "Compliance risk detected"
        threshold: "Any FTC-adjacent topic"
        pattern: "Automatic caution overrides any impulse to use testimonials"
        evidence: "Never uses testimonials despite conversion benefit"

      - trigger: "Client qualification"
        threshold: "$10k minimum, business health requirements"
        pattern: "Logic overrides desire for more revenue"
        evidence: "'Can't take more clients, can't deliver'"

    system_1_overrides_2:
      - trigger: "Receiving direct praise"
        pattern: "Self-deprecation fires before analytical processing"
        evidence: "Immediate deflection observed in all interviews"

      - trigger: "Social threat perception"
        pattern: "Avoidance fires before rational assessment"
        evidence: "SPECT scan shows automatic threat filter"

  transition_signals:
    from_1_to_2:
      - "Pause before answering"
      - "'Let me think about that'"
      - "Framework introduction ('There's really a three-step...')"
    from_2_to_1:
      - "Humor interjection"
      - "Self-deprecating comment"
      - "'But whatever, you know'"

# =============================================================================
# PERSONAL HEURISTICS (Mental Shortcuts)
# =============================================================================
heuristic_inventory:
  - name: "Self-Deprecation Safety Heuristic"
    description: "Lead with self-deprecation to disarm potential judgment"
    trigger: "Any new social interaction or authority claim"
    accuracy: "HIGH - effective rapport builder"
    bias_risk: "May undersell capabilities to wrong audience"
    evidence: "10x industry frequency, noted by interviewers"

  - name: "Three-Step Framework Heuristic"
    description: "Structure any advice as 3 steps: what I got, what it does, what to do"
    trigger: "Any teaching or advice-giving situation"
    accuracy: "VERY HIGH - simplifies complex topics effectively"
    bias_risk: "May oversimplify genuinely complex topics"
    evidence: "Verbatim across all sources"

  - name: "Testimonial Avoidance Heuristic"
    description: "Never use testimonials regardless of potential conversion benefit"
    trigger: "Any discussion of social proof"
    accuracy: "HIGH for compliance, UNKNOWN for conversion impact"
    bias_risk: "May leave conversion gains on table"
    evidence: "Post-FTC absolute rule"

  - name: "Premium Client Filter Heuristic"
    description: "$10k minimum, healthy business = qualified; otherwise = doesn't exist"
    trigger: "New prospect inquiry"
    accuracy: "HIGH - ensures client success and delivery capacity"
    bias_risk: "Binary thinking may miss edge cases"
    evidence: "'Non-clients don't exist to me'"

  - name: "Camera vs Crowd Heuristic"
    description: "Camera = safe, Crowd = threat"
    trigger: "Content creation or event decision"
    accuracy: "EFFECTIVE for managing introversion"
    bias_risk: "May miss live event opportunities"
    evidence: "SPECT scan + 'That's why I don't go to conferences'"

  - name: "Value-Before-Ask Heuristic"
    description: "Always demonstrate value before making any offer"
    trigger: "Any sales or marketing decision"
    accuracy: "VERY HIGH - core methodology (IBB)"
    bias_risk: "May delay revenue in cash-strapped situations"
    evidence: "Intent-Based Branding methodology"

  - name: "Long-Term Patience Heuristic"
    description: "Marathon mindset - willing to go negative initially"
    trigger: "ROI/timeline discussions"
    accuracy: "HIGH for brand building"
    bias_risk: "Requires capital runway"
    evidence: "'I don't want to be a sprinter'"

# =============================================================================
# PROSPECT THEORY PROFILE (Loss Aversion Analysis)
# =============================================================================
prospect_theory_profile:
  reference_points:
    - domain: "Legal/Compliance"
      reference: "Zero FTC risk"
      gains_above: "Any flexibility in claims"
      losses_below: "ANY potential liability"
      loss_aversion_multiplier: "EXTREME (10x+)"
      evidence: "Refuses testimonials entirely despite conversion benefit"

    - domain: "Client Quality"
      reference: "$10k/month, healthy business"
      gains_above: "Premium clients, higher fees"
      losses_below: "Time wasted on unqualified prospects"
      loss_aversion_multiplier: "HIGH (3x)"
      evidence: "'We don't even talk to them unless they're healthy'"

    - domain: "Time/Energy"
      reference: "System-based efficiency"
      gains_above: "Automation, scale"
      losses_below: "Manual effort, face-to-face requirements"
      loss_aversion_multiplier: "HIGH (3x)"
      evidence: "Built entire career to avoid face-to-face"

    - domain: "Reputation"
      reference: "Perceived as authentic, relatable expert"
      gains_above: "Industry respect"
      losses_below: "Being seen as hype-driven marketer"
      loss_aversion_multiplier: "HIGH (2.5x)"
      evidence: "'Mickey Mouse' criticism of industry"

  loss_aversion_ratio:
    estimate: "2.5:1 general, 10:1 compliance domain"
    evidence:
      - "Refuses testimonials = extreme compliance loss aversion"
      - "Won't take unqualified clients = revenue loss acceptable to avoid time loss"
      - "Avoids conferences = social discomfort loss dominates potential gains"

  certainty_effect:
    preference: "STRONG preference for certain smaller gains over risky larger gains"
    examples:
      - "Prefers guaranteed compliant copy over risky high-conversion claims"
      - "Prefers premium filtered clients over higher volume unknown quality"
    risk_for_losses: "Will NOT gamble to avoid certain loss - takes the loss and moves on"
    evidence: "Post-FTC approach: accept lower conversion to guarantee zero liability"

  framing_sensitivity:
    examples:
      - positive_frame: "'Here's what it'll do for you' - features as benefits"
        negative_frame: "Rarely uses fear-based framing despite acknowledging its effectiveness"
        difference: "Prefers positive framing in own copy"
      - positive_frame: "'Goodwill + Offers' equation"
        negative_frame: "'Madison Avenue waste of money'"
        difference: "Uses negative framing only for contrast positioning"

  endowment_effect:
    strength: "MODERATE"
    evidence:
      - "Strong attachment to methodologies he created (IBB, BDR)"
      - "Willing to evolve (BDR -> IBB) but maintains ownership of frameworks"
      - "Not attached to client relationships beyond qualification criteria"

# =============================================================================
# STATE TRANSITION MATRIX
# =============================================================================
state_transitions:
  transitions:
    - from_state: "default_introvert"
      to_state: "teaching_authority"
      transition_triggers:
        - trigger: "Camera turns on / interview begins"
          speed: "Gradual (1-2 minutes warmup)"
          voluntary: true
        - trigger: "Technical question asked"
          speed: "Immediate"
          voluntary: true
      transition_friction:
        ease: "Easy (well-practiced)"
        resistance: "Minimal"
        facilitators: "Small group, camera vs crowd"
      reversal:
        possible: true
        trigger: "Interview ends, social fatigue"

    - from_state: "teaching_authority"
      to_state: "self_deprecation_rapport"
      transition_triggers:
        - trigger: "Receiving praise or compliment"
          speed: "Immediate (System 1)"
          voluntary: false
        - trigger: "After making strong authority claim"
          speed: "Immediate"
          voluntary: "Semi-automatic"
      transition_friction:
        ease: "Very easy (automatic)"
