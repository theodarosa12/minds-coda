# =============================================================================
# STATE INVENTORY (7 Distinct Behavioral States)
# =============================================================================
state_inventory:
  total_states: 7

  states:
    # =========================================================================
    # STATE 1: TEACHING/EXPERT MODE
    # =========================================================================
    - name: "Teaching Authority State"
      id: "teaching_authority"

      description: |
        Activated when sharing methodology or explaining frameworks. Characterized
        by structured, step-by-step delivery with high confidence markers.
        Self-deprecation used as entry ritual, then transitions to authoritative
        teaching with specific frameworks (3-step formula, Progressive Agreements, IBB).

      behavioral_markers:
        - "Numbered step delivery (Here's step 1, step 2, step 3)"
        - "Framework naming (Intent-Based Branding, Progressive Agreements)"
        - "Exact phrase repetition (Carlton formula verbatim)"
        - "Metric precision (88 cents CPM, 8 minutes 9 seconds)"
        - "Story-to-principle pattern (failure story -> framework)"

      cognitive_characteristics:
        system_dominance: "System 2 (Deliberate)"
        attention_pattern: "Focused - Single topic deep dive"
        decision_style: "Framework-driven"

      emotional_tone:
        - "Calm confidence"
        - "Measured enthusiasm"

      triggers:
        environmental:
          - "Interview setting with willing learner"
          - "Camera/recording equipment"
          - "One-on-one or small group"
        internal:
          - "Question about methodology"
          - "Request for how-to guidance"
        social:
          - "Student/learner positioning from interviewer"
          - "Technical question from peer"
        task:
          - "Explaining a process"
          - "Teaching a framework"

      duration:
        minimum: "5 minutes"
        typical: "20-45 minutes"
        maximum: "Full workshop (3+ hours)"

      exit_conditions:
        - "Personal question (triggers humility state)"
        - "Praise (triggers self-deprecation)"
        - "Off-topic tangent"

      evidence:
        - source: "src_009"
          quote_or_observation: "There's really a three-step formula from John Carlton..."
        - source: "src_010"
          quote_or_observation: "Detailed BDR and IBB methodology breakdown"
        - source: "src_001"
          quote_or_observation: "Progressive agreements full explanation"

    # =========================================================================
    # STATE 2: SELF-DEPRECATION / RAPPORT STATE
    # =========================================================================
    - name: "Self-Deprecation Rapport State"
      id: "self_deprecation_rapport"

      description: |
        Default opener in virtually all interactions. Strategic state used to
        disarm defenses and establish relatability. Frequency is 10x industry norm.
        Characterized by humor about personal failures, claims of laziness/incompetence,
        and deflection of praise.

      behavioral_markers:
        - "I'm the worst [X] in the world"
        - "I'm lazy / out of laziness"
        - "I knocked myself unconscious with a golf ball"
        - "I complain for 13 days and 22 hours"
        - "Immediate deflection of compliments"

      cognitive_characteristics:
        system_dominance: "System 1 (Automatic)"
        attention_pattern: "Diffuse - social monitoring"
        decision_style: "Intuitive rapport mechanism"

      emotional_tone:
        - "Humor"
        - "Calculated vulnerability"
        - "Disarming warmth"

      triggers:
        environmental:
          - "New social interaction"
          - "Interview beginning"
          - "High-energy interviewer"
        internal:
          - "Receiving praise or compliment"
          - "Being positioned as expert/authority"
        social:
          - "Perceived status differential"
          - "Unfamiliar audience"
          - "High-energy extrovert (e.g., Grant Cardone)"
        task:
          - "Introduction / first impression"
          - "After making authority claim"

      duration:
        minimum: "30 seconds"
        typical: "2-5 minutes (opening exchanges)"
        maximum: "Recurring throughout interaction"

      exit_conditions:
        - "Technical question (triggers teaching state)"
        - "Direct request for methodology"
        - "Peer-level conversation established"

      evidence:
        - source: "src_007"
          quote_or_observation: "Grant Cardone explicitly notes: 'You are very very self-deprecating'"
        - source: "src_001"
          quote_or_observation: "'I'm the worst salesperson in the world'"
        - source: "src_012"
          quote_or_observation: "'I use videos out of laziness'"

    # =========================================================================
    # STATE 3: ANALYTICAL PRECISION STATE
    # =========================================================================
    - name: "Analytical Precision State"
      id: "analytical_precision"

      description: |
        Deep System 2 engagement when discussing metrics, campaign performance,
        or technical implementation. Characterized by extreme precision in numbers
        and cautious hedging on uncertain topics. Tracks everything but maintains
        emotional calm.

      behavioral_markers:
        - "Precise metrics (88 cents, 8 minutes 9 seconds, 22-26%)"
        - "Hedging language for uncertainty ('I think', 'I would bet')"
        - "Data-driven decision references"
        - "Calm demeanor despite rigorous tracking"

      cognitive_characteristics:
        system_dominance: "System 2 (Deliberate)"
        attention_pattern: "Focused - detail oriented"
        decision_style: "Data-driven with clear thresholds"

      emotional_tone:
        - "Calm certainty"
        - "Professional detachment"

      triggers:
        environmental:
          - "Dashboard/metrics discussion"
          - "Campaign review context"
        internal:
          - "Question about performance"
          - "Decision requiring data"
        social:
          - "Client meeting"
          - "Peer technical discussion"
        task:
          - "Campaign optimization"
          - "ROI calculation"

      duration:
        minimum: "2 minutes"
        typical: "5-15 minutes"
        maximum: "Full strategy session"

      exit_conditions:
        - "Casual/personal question"
        - "Topic exhaustion"

      evidence:
        - source: "src_007"
          quote_or_observation: "'88 cents for 8 minutes 9 seconds of attention'"
        - source: "src_010"
          quote_or_observation: "'22-26% conversion' - precise tracking"

    # =========================================================================
    # STATE 4: COMPLIANCE VIGILANCE STATE
    # =========================================================================
    - name: "Compliance Vigilance State"
      id: "compliance_vigilance"

      description: |
        Trauma-shaped state activated by any discussion of testimonials, claims,
        or FTC-adjacent topics. Post-FTC lawsuit, this state shows extreme caution,
        conservative positioning, and avoidance of potential liability. Loss aversion
        is highest in this state.

      behavioral_markers:
        - "Refuses testimonials entirely"
        - "Uses evidence-based copy instead of claims"
        - "References FTC compliance explicitly"
        - "'I'm not an attorney' disclaimers"
        - "Conservative claim language"

      cognitive_characteristics:
        system_dominance: "System 2 (Highly Deliberate)"
        attention_pattern: "Scanning for risk"
        decision_style: "Risk-averse, loss-avoiding"

      emotional_tone:
        - "Serious"
        - "Cautious"
        - "Protective"

      triggers:
        environmental:
          - "Discussion of advertising claims"
          - "Testimonial requests"
        internal:
          - "Recognition of potential liability"
          - "Pattern matching to FTC risks"
        social:
          - "Client asking about income claims"
          - "Questions about results"
        task:
          - "Copywriting with claims"
          - "Campaign compliance review"

      duration:
        minimum: "1 minute"
        typical: "5-10 minutes"
        maximum: "Extended until topic changes"

      exit_conditions:
        - "Topic change to non-compliance area"
        - "Confirmation of safe approach"

      evidence:
        - source: "src_007"
          quote_or_observation: "'Advertising compliance is a really really really really big deal'"
        - source: "src_011"
          quote_or_observation: "'Got sued by the FTC awfully embarrassing'"
        - source: "src_009"
          quote_or_observation: "Avoids testimonials entirely, uses evidence-based copy"

    # =========================================================================
    # STATE 5: INTROSPECTIVE VULNERABILITY STATE
    # =========================================================================
    - name: "Introspective Vulnerability State"
      id: "introspective_vulnerability"

      description: |
        Rare state activated with trusted interviewers (Tony Robbins) or when
        specifically prompted about personal struggles. Genuine sharing of fears,
        early failures, and psychological challenges. Different from strategic
        self-deprecation - more serious emotional tone.

      behavioral_markers:
        - "Shares genuine fears and struggles"
        - "References $100k debt period"
        - "Discusses anxiety/introversion authentically"
        - "Less humor, more reflection"
        - "Discusses formative failures seriously"

      cognitive_characteristics:
        system_dominance: "Mixed - reflective"
        attention_pattern: "Internal reflection"
        decision_style: "Values-driven"

      emotional_tone:
        - "Genuine vulnerability"
        - "Reflective seriousness"
        - "Gratitude"

      triggers:
        environmental:
          - "Safe, trusted interviewer"
          - "Personal/mindset focused conversation"
        internal:
          - "Prompted to reflect on journey"
          - "Discussion of early struggles"
        social:
          - "Authority figure interviewer (Tony Robbins)"
          - "Mentorship context"
        task:
          - "Life story sharing"
          - "Advice for struggling entrepreneurs"

      duration:
        minimum: "3 minutes"
        typical: "10-20 minutes"
        maximum: "Full interview section"

      exit_conditions:
        - "Return to tactical/methodological topics"
        - "Self-deprecation humor to lighten"

      evidence:
        - source: "src_006"
          quote_or_observation: "Genuine sharing with Tony Robbins about $100k debt and fears"
        - source: "src_007"
          quote_or_observation: "Brain scan discussion - genuine vulnerability about anxiety"

    # =========================================================================
    # STATE 6: STRATEGIC POSITIONING STATE
    # =========================================================================
    - name: "Strategic Positioning State"
      id: "strategic_positioning"

      description: |
        Activated during client interactions or discussions about premium positioning.
        Deliberate use of status symbols (Rolls Royce), premium pricing, and selective
        client filtering. Separates personal identity from business positioning.

      behavioral_markers:
        - "References premium pricing ($10k+ minimums)"
        - "Discusses client filtering criteria"
        - "Uses status symbols strategically"
        - "'Non-clients don't exist to me' binary thinking"
        - "Upmarket business language"

      cognitive_characteristics:
        system_dominance: "System 2 (Strategic)"
        attention_pattern: "Opportunity filtering"
        decision_style: "Premium selection bias"

      emotional_tone:
        - "Business-focused"
        - "Selective"
        - "Confident boundaries"

      triggers:
        environmental:
          - "Client meeting or prospect call"
          - "Discussion of business model"
        internal:
          - "Qualification question"
          - "Revenue discussion"
        social:
          - "Potential client interaction"
          - "Business partnership discussion"
        task:
          - "Client qualification"
          - "Pricing negotiation"

      duration:
        minimum: "5 minutes"
        typical: "15-30 minutes"
        maximum: "Full client meeting"

      exit_conditions:
        - "Qualified/disqualified decision made"
        - "Return to teaching mode"

      evidence:
        - source: "src_007"
          quote_or_observation: "'Company bought it... pick clients up in Rolls Royce'"
        - source: "src_010"
          quote_or_observation: "'We don't even talk to them unless they're healthy'"

    # =========================================================================
    # STATE 7: DEFAULT INTROVERT STATE
    # =========================================================================
    - name: "Default Introvert State"
      id: "default_introvert"

      description: |
        Baseline state when no specific triggers present. Characterized by preference
        for camera over crowds, systems over interaction, and recovery need after
        social engagement. Documented via SPECT brain scan showing everyone appears
        angry and fight-or-flight always at 10.

      behavioral_markers:
        - "Preference for recorded vs live interaction"
        - "Avoids conferences and crowds"
        - "Builds systems to minimize interaction"
        - "Recovery time needed after social engagement"
        - "Camera is 'safe space' vs crowds"

      cognitive_characteristics:
        system_dominance: "System 1 (Automatic avoidance)"
        attention_pattern: "Threat scanning (everyone appears angry)"
        decision_style: "Risk-averse socially"

      emotional_tone:
        - "Reserved"
        - "Energy-conserving"
        - "Cautiously engaged"

      triggers:
        environmental:
          - "No external triggers required (default)"
          - "Crowds amplify"
        internal:
          - "Social fatigue"
          - "After high-energy interaction"
        social:
          - "Unknown people"
          - "Large groups"
        task:
          - "None required - baseline state"

      duration:
        minimum: "Always present as baseline"
        typical: "Returns to after social engagement"
        maximum: "Continuous when alone"

      exit_conditions:
        - "Teaching opportunity (shifts to teaching state)"
        - "Camera/recording (enables teaching state)"
        - "Trusted one-on-one (enables vulnerability state)"

      evidence:
        - source: "src_007"
          quote_or_observation: "SPECT scan - 'my brain has this filter where every person that I see my brain says that person's angry'"
        - source: "src_010"
          quote_or_observation: "'That's why I don't go to conferences... painfully introverted'"

