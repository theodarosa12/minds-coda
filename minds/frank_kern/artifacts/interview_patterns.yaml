# =============================================================================
# QUESTION FRAMING ANALYSIS
# =============================================================================
patterns:
  question_framing:
    reasoning_style: "Practical/Empirical with Self-Deprecating Disclaimers"

    first_principles:
      observed: true
      examples:
        - question: "What makes good copy?"
          how_reasoned: "Strips away complexity to core formula: Here's what I got, Here's what it'll do for you, Here's what I want you to do next"
          evidence: "Explicitly credits John Carlton for simplest effective structure"
        - question: "How do you structure problems?"
          how_reasoned: "Reverse engineers from desired outcome - 'In order to buy anything people have to engage in a series of progressive agreements'"
          evidence: "src_001 - Dan Kennedy interview"

    analogy_based:
      observed: true
      favorite_analogies:
        - analogy: "The cookie metaphor for sales"
          context: "Explaining value-first selling"
          frequency: HIGH
          quote: "If someone likes cookies you show them a picture of a cookie and then you let them smell some cookies and then someone comes up and goes hey you want to try one of these cookies"
        - analogy: "Market circles (5% vs 95%)"
          context: "Explaining where the real money is"
          frequency: HIGH
          quote: "Most money isn't in that little five percent of people that are ready to buy today... the most money is in that 95 percent who are thinking about it"
        - analogy: "TV commercials on cell phones"
          context: "Explaining social media value"
          frequency: MEDIUM
          quote: "The telephone is the new TV and radio... we can run TV commercials on a cell phone"

    framework_application:
      observed: true
      frameworks_referenced:
        - framework: "Progressive Agreements"
          how_applied: "Every sale requires sequential buy-in before the close"
          frequency: HIGH
        - framework: "E-Factors (Fear, Guilt, Greed, Pride, Love, Lust)"
          how_applied: "Emotional drivers that must be addressed in sequence"
          frequency: HIGH
        - framework: "Carlton Formula (3-step)"
          how_applied: "Default structure for any sales message"
          frequency: VERY_HIGH

    thinking_mode_signals:
      system_1_fast:
        triggers:
          - "Questions about self-deprecation"
          - "Questions about being lazy"
          - "Questions about introversion"
        examples:
          - "I'm the worst salesperson in the world"
          - "I complain about writing copy for 13 days and 22 hours"

      system_2_slow:
        triggers:
          - "Strategic questions about methodology"
          - "Questions about compliance/legal"
          - "Questions about specific campaign structure"
        examples:
          - "Detailed breakdown of Intent-Based Branding phases"
          - "Progressive agreements explanation"

    certainty_calibration:
      high_confidence_markers:
        - "I know this to be empirically true"
        - "The truth of the matter is"
        - "It comes down to"
        - "That's the freaking magic formula"
      uncertainty_markers:
        - "I don't really know much about"
        - "Break out of my ass about"
        - "I'm not an attorney"
        - "I think" (frequent hedging)
      examples:
        - statement: "It doesn't matter what business we're in - we're in the business of multiplying capital"
          confidence_level: HIGH
          linguistic_markers: "I don't believe this I know this"
        - statement: "Email is pretty much dead"
          confidence_level: MEDIUM
          linguistic_markers: "I would bet though"

    counterfactual_thinking:
      observed: true
      examples:
        - question: "What if you got more clients?"
          counterfactual: "Can't take them because we can't deliver for the clients we have"
        - question: "What if you used testimonials?"
          counterfactual: "Would require seven pages of disclaimers, not worth the legal risk"

# =============================================================================
# RESPONSE PATTERNS
# =============================================================================
  response_patterns:
    deflection_patterns:
      questions_avoided:
        - "Specific revenue numbers (deflects with 'enough')"
        - "Personal life details beyond surface level"
        - "Criticism of specific competitors"
      deflection_techniques:
        - technique: "Self-deprecation redirect"
          example: "Being asked about success -> 'I'm the worst salesperson'"
        - technique: "Humor escape"
          example: "Being asked about qualifications -> 'Dr. Frank Kern attorney at law, engineer at NASA retired'"
        - technique: "Binary dismissal"
          example: "Non-clients don't exist to me, they could be on Mars"

    expansion_patterns:
      questions_expanded:
        - "Any question about methodology"
        - "Any question about how something works"
        - "Origin story prompts"
      expansion_style: "Stories + Frameworks + Concrete Examples"
      signature_expansion: "Here's exactly what we do -> step 1, step 2, step 3"

    precision_vs_approximation:
      preference: "Context-dependent"
      examples:
        - question_type: "Campaign metrics"
          response_style: "Very precise (88 cents, 8 minutes 9 seconds)"
        - question_type: "General business advice"
          response_style: "Approximate with caveats"

    abstraction_level:
      default_altitude: "Mid-level (practical)"
      altitude_shifts:
        - trigger: "Asked about theory"
          shift_direction: "DOWN to concrete examples"
        - trigger: "Asked about specific tactic"
          shift_direction: "UP to principle behind it"

