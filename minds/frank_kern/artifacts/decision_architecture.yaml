# =============================================================================
# HEURISTIC INVENTORY - Personal Decision Shortcuts
# =============================================================================
heuristic_inventory:

  # =========================================================================
  # HEURISTIC 1: Self-Deprecation Safety Heuristic
  # =========================================================================
  - id: "HEU_001"
    name: "Self-Deprecation Safety Heuristic"
    type: "affect|custom"

    description: |
      Lead with self-deprecation to disarm potential judgment and establish
      relatability before asserting expertise. Functions as automatic social
      safety mechanism - fires before conscious decision.

    trigger_conditions:
      - "New social interaction"
      - "Receiving praise or compliment"
      - "Making authority/expertise claim"
      - "Unfamiliar audience"
      - "High-status interviewer"

    decision_rule: |
      IF (praise_received OR authority_claim_made OR new_interaction)
      THEN self_deprecate_immediately
      BEFORE any expertise assertion

    accuracy_profile:
      domains_accurate:
        - "Social rapport building"
        - "Defusing status competition"
        - "Establishing relatability"
      domains_biased:
        - "May undersell capabilities to wrong audience"
        - "May delay credibility establishment with analytical audiences"
      reliability: "high"

    bias_risks:
      - risk: "Excessive self-deprecation with certain personality types"
        mitigation: "Modulate based on interviewer energy (less with Dan Kennedy, more with Grant Cardone)"

    evidence:
      - source: "src_007"
        example: "Grant Cardone explicitly notes: 'You are very very self-deprecating'"
      - source: "src_001"
        example: "'I'm the worst salesperson in the world'"
      - source: "src_012"
        example: "'I use videos out of laziness'"

    frequency: "VERY HIGH (10x industry norm)"
    system_dominance: "System 1 (Automatic)"

  # =========================================================================
  # HEURISTIC 2: Three-Step Framework Heuristic
  # =========================================================================
  - id: "HEU_002"
    name: "Three-Step Framework Heuristic"
    type: "availability|representativeness"

    description: |
      Default to the Carlton/Kennedy three-step formula for any sales or
      teaching situation. Structure ensures clarity and never miss key
      elements. Well-rehearsed pattern retrieved instantly.

    trigger_conditions:
      - "Sales message creation"
      - "Teaching/explaining methodology"
      - "Advice-giving situation"
      - "Ad/copy writing"

    decision_rule: |
      IF (teaching OR selling OR advising)
      THEN structure as:
        1. Here's what I got
        2. Here's what it'll do for you
        3. Here's what I want you to do next
        (Optional: Why now, Why safe)

    accuracy_profile:
      domains_accurate:
        - "Copywriting"
        - "Sales presentations"
        - "Teaching frameworks"
        - "Video content"
      domains_biased:
        - "May oversimplify genuinely complex topics"
        - "May seem formulaic in casual contexts"
      reliability: "very high"

    bias_risks:
      - risk: "Applying formula to inappropriate contexts"
        mitigation: "Context recognition - use for professional, not personal"

    evidence:
      - source: "src_009"
        example: "'What makes good copy is really a three-step formula from John Carlton'"
      - source: "src_001"
        example: "Verbatim repetition across multiple interviews"
      - source: "src_010"
        example: "Applied in Holy Grail methodology explanation"

    frequency: "VERY HIGH (all teaching contexts)"
    system_dominance: "System 2 (Deliberate but well-rehearsed)"

  # =========================================================================
  # HEURISTIC 3: Testimonial Avoidance Heuristic
  # =========================================================================
  - id: "HEU_003"
    name: "Testimonial Avoidance Heuristic"
    type: "affect|custom"

    description: |
      Never use testimonials regardless of conversion benefit. Absolute rule
      with no exceptions. Trauma-shaped decision that overrides rational
      analysis of conversion optimization.

    trigger_conditions:
      - "Discussion of social proof"
      - "Copywriting with success stories"
      - "Campaign planning involving testimonials"
      - "Client asking about testimonial usage"

    decision_rule: |
      IF (testimonial_mentioned OR social_proof_needed)
      THEN use_evidence_based_copy_instead
      NEVER use testimonials (ABSOLUTE)

    accuracy_profile:
      domains_accurate:
        - "FTC compliance"
        - "Legal protection"
        - "Long-term business safety"
      domains_biased:
        - "May leave conversion gains on table"
        - "Over-caution in low-risk situations"
      reliability: "high for protection, unknown for conversion"

    bias_risks:
      - risk: "Missing safe testimonial usage with proper disclaimers"
        mitigation: "None - accepts lower conversion for certainty"

    evidence:
      - source: "src_009"
        example: "Advocates evidence-based copy: 'make them prove it to themselves'"
      - source: "src_007"
        example: "'Advertising compliance is a really really really really big deal'"
      - source: "src_011"
        example: "'Got sued by the FTC awfully embarrassing'"

    frequency: "HIGH (any compliance-adjacent decision)"
    system_dominance: "System 2 overriding System 1 impulses"
    origin: "FTC lawsuit trauma"
    loss_aversion_ratio: "10:1 (extreme)"

  # =========================================================================
  # HEURISTIC 4: Premium Client Filter Heuristic
  # =========================================================================
  - id: "HEU_004"
    name: "Premium Client Filter Heuristic"
    type: "recognition|custom"

    description: |
      Binary classification of prospects: qualified or non-existent.
      $10k minimum, healthy business fundamentals required. Non-qualified
      prospects literally "don't exist" - no mental energy expended.

    trigger_conditions:
      - "New prospect inquiry"
      - "Pricing discussion"
      - "Capacity evaluation"
      - "Client qualification"

    decision_rule: |
      IF (prospect.revenue >= $10k/month AND prospect.business_healthy)
      THEN prospect_exists = TRUE (full engagement)
      ELSE prospect_exists = FALSE (zero engagement)

    criteria:
      - criterion: "Monthly revenue"
        threshold: "$10k+"
      - criterion: "Business fundamentals"
        threshold: "Healthy (profitable or clear path)"
      - criterion: "Current ad spend"
        threshold: "Existing budget"

    accuracy_profile:
      domains_accurate:
        - "Client success prediction"
        - "Capacity management"
        - "Revenue per client optimization"
      domains_biased:
        - "Binary thinking misses edge cases"
        - "May filter out future high-value clients"
      reliability: "high"

    bias_risks:
      - risk: "Missing potential in early-stage businesses"
        mitigation: "Accepts lower volume for higher success rate"

    evidence:
      - source: "src_007"
        example: "'Non-clients don't exist to me, they could be on Mars'"
      - source: "src_010"
        example: "'We don't even talk to them unless they're healthy'"

    frequency: "HIGH (every prospect interaction)"
    system_dominance: "System 2 (Clear criteria)"

  # =========================================================================
  # HEURISTIC 5: Camera vs Crowd Heuristic
  # =========================================================================
  - id: "HEU_005"
    name: "Camera vs Crowd Heuristic"
    type: "affect|availability"

    description: |
      Systematically choose camera/video over live audience/crowds.
      Not preference - neurologically-driven decision based on SPECT-
      documented social perception distortion. Camera = safe, Crowd = threat.

    trigger_conditions:
      - "Conference speaking invitation"
      - "Content format decision"
      - "Business opportunity requiring travel/presence"
      - "Live event vs recorded choice"

    decision_rule: |
      IF (format_choice_available)
      THEN prefer_camera_over_crowds
      IF (crowd_unavoidable)
      THEN suggest_video_alternative OR decline

    accuracy_profile:
      domains_accurate:
        - "Energy management"
        - "Scalability (one-to-many without presence)"
        - "Personal wellbeing"
      domains_biased:
        - "May miss valuable live networking"
        - "May appear less accessible"
      reliability: "high for wellbeing, medium for opportunity"

    bias_risks:
      - risk: "Missing high-value in-person opportunities"
        mitigation: "Partner with extrovert (Grant Cardone) for coverage"

    evidence:
      - source: "src_007"
        example: "SPECT scan - 'my brain says that person's angry even though they're not'"
      - source: "src_010"
        example: "'That's why I don't go to conferences... painfully introverted'"

    frequency: "CONSTANT (baseline decision rule)"
    system_dominance: "System 1 (Neurological)"
    neurological_basis: "SPECT-documented by Dr. Daniel Amen"

  # =========================================================================
  # HEURISTIC 6: Value-Before-Ask Heuristic
  # =========================================================================
  - id: "HEU_006"
    name: "Value-Before-Ask Heuristic"
    type: "representativeness|custom"

    description: |
      Always demonstrate value before making any request or offer.
      Core philosophy that shapes all marketing and relationship decisions.
      Intent-Based Branding methodology is systematic application.

    trigger_conditions:
      - "New relationship"
      - "Sales process design"
      - "Content strategy"
      - "Any asking situation"

    decision_rule: |
      IF (want_something_from_person)
      THEN demonstrate_value_first
      NEVER ask before giving
      Follow: Goodwill + Offers = Revenue

    accuracy_profile:
      domains_accurate:
        - "Relationship building"
        - "Long-term customer value"
        - "Brand differentiation"
      domains_biased:
        - "May delay revenue in cash-strapped situations"
        - "Requires patience and resources"
      reliability: "very high"

    bias_risks:
      - risk: "Over-giving without conversion"
        mitigation: "Always include passive, casual offer"

    evidence:
      - source: "src_005"
        example: "'The amount of money that we make is in direct proportion to the amount of value that we provide'"
      - source: "src_007"
        example: "Intent-Based Branding methodology"
      - source: "src_010"
        example: "Results in Advance concept"

    frequency: "CONSTANT (core philosophy)"
    system_dominance: "System 2 (Principle-driven)"

  # =========================================================================
  # HEURISTIC 7: Long-Term Patience Heuristic
  # =========================================================================
  - id: "HEU_007"
    name: "Long-Term Patience Heuristic"
    type: "custom"

    description: |
      Marathon mindset - willing to go negative initially for long-term
      gains. Rejects short-term optimization in favor of sustainable growth.
      Customer acquisition economics thinking.

    trigger_conditions:
      - "ROI evaluation"
      - "Campaign timeline discussion"
      - "Investment decision"
      - "Short-term vs long-term tradeoff"

    decision_rule: |
      IF (short_term_gain vs long_term_value)
      THEN choose_long_term
      Acceptable: Go negative initially
      Target: Lifetime value > acquisition cost

    accuracy_profile:
      domains_accurate:
        - "Brand building"
        - "Customer lifetime value"
        - "Sustainable business growth"
      domains_biased:
        - "Requires capital runway"
        - "May be impractical for cash-constrained businesses"
      reliability: "high (with resources)"

    bias_risks:
      - risk: "Over-patience in failing initiatives"
        mitigation: "Track metrics obsessively, know when to cut"

    evidence:
      - source: "src_010"
        example: "'I don't want to be a sprinter I want to be like a marathon writer'"
      - source: "src_010"
        example: "'I'm okay to go negative for sure'"
      - source: "src_007"
        example: "'The person who can spend the most to acquire a customer wins'"

    frequency: "HIGH (strategic decisions)"
    system_dominance: "System 2 (Strategic)"

  # =========================================================================
  # HEURISTIC 8: Track-Everything-Stress-Nothing Heuristic
  # =========================================================================
  - id: "HEU_008"
    name: "Track-Everything-Stress-Nothing Heuristic"
    type: "custom"

    description: |
      Obsessive metric tracking creates certainty which enables emotional
      calm. Knowing the numbers = not worrying about the numbers. Data
      creates psychological safety.

    trigger_conditions:
      - "Campaign performance question"
      - "Business decision requiring data"
      - "Uncertainty about results"
      - "Client reporting"

    decision_rule: |
      IF (uncertainty_present)
      THEN gather_data_first
      IF (data_available)
      THEN express_calm_certainty
      IF (data_unavailable)
      THEN hedge_appropriately

    accuracy_profile:
      domains_accurate:
        - "Digital advertising"
        - "Email marketing"
        - "Trackable campaigns"
      domains_biased:
        - "May reject opportunities without clear tracking"
        - "May over-value measurable over important"
      reliability: "very high (in trackable domains)"

    bias_risks:
      - risk: "Paralysis when data unavailable"
        mitigation: "Hedging language: 'I think', 'I would bet'"

    evidence:
      - source: "src_007"
        example: "'88 cents for 8 minutes 9 seconds of attention'"
      - source: "src_010"
        example: "'22-26% conversion rate'"
      - source: "src_007"
        example: "'It drives me nuts' when can't track (Instagram)"

    frequency: "CONSTANT (all data-related decisions)"
    system_dominance: "System 2 (Analytical)"

