# LINGUISTIC PATTERNS (How Tim structures language)
# =============================================================================

linguistic_patterns:

  principle_first_teaching:
    description: "State abstract principle, then provide concrete examples and applications"
    frequency: "95% of teaching content"
    structure:
      1: "STATE PRINCIPLE BOLDLY"
      2: "DEFINE CLEARLY"
      3: "EXPLAIN WHY"
      4: "GIVE EXAMPLES (3+)"
      5: "SHOW APPLICATION"
      6: "INVITE TESTING"
    example: "Pareto principle → 80/20 definition → power law distribution → business/learning examples → how to apply → try it yourself"
    cognitive_function: "Respects intelligence. Provides actionable frameworks."
    contrasts_with: "Most teachers (story-first → principles)"

  question_and_answer_structure:
    description: "Use rhetorical questions to guide listener thinking, then answer"
    frequency: "very_common in interviews"
    structure:
      1: "ASK QUESTION"
      2: "ALLOW REFLECTION"
      3: "PROVIDE ANSWER"
      4: "DEEPEN EXPLANATION"
      5: "REFRAME PERSPECTIVE"
    example: "What stops most people? Fear. What is fear? Imagination. Can you reality-test it? Yes."
    cognitive_function: "Engages audience while directing thought"

  quantification:
    description: "Always includes specific numbers"
    frequency: "very_frequent"
    examples:
      - "21 strokes to 11 strokes in two workouts"
      - "Read Seneca probably more than 100 times"
      - "6 sentences reveal all grammar patterns"
      - "10-20 worst-case scenarios"
      - "10-20 minutes of meditation twice daily"
    cognitive_function: "Makes abstract concrete. Creates credibility."

  contrast_structure:
    description: "Contrast conventional wisdom with contrarian approach"
    frequency: "frequent for novel ideas"
    structure:
      1: "STATE CONVENTIONAL"
      2: "STATE CONTRARIAN"
      3: "PROVIDE EVIDENCE"
      4: "SHOW RESULTS"
      5: "INVITE ADOPTION"
    example: "Most do X. I do Y. Here's why Y works. Result is... You could do this too."
    cognitive_function: "Makes contrarian ideas less threatening"

  accessibility_bridges:
    description: "Makes complex ideas accessible via metaphor/analogy"
    frequency: "very_frequent"
    examples:
      - "Stoicism = Operating system for high-stress environments"
      - "Meditation = Brushing teeth for the mind"
      - "Flow state = Getting out of your own way"
      - "Skill acquisition = LEGO blocks"
    cognitive_function: "Makes intimidating topics approachable"

