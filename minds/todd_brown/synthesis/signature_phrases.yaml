    # -------------------------------------------------------------------------
    - id: "sig_017"
      phrase: "90% of marketing that fails..."
      type: "statistic"
      frequency: 4

      function: "Big Idea importance"
      context: "Diagnosing failures"

      full_form: "90% of marketing copy that is not effective suffers from a lack of a single, unifying big idea"

      usage_example: "90% of marketing that fails lacks a single, unifying Big Idea. That's not copy problems - that's idea problems."

