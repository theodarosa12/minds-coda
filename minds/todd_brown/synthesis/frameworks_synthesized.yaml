        - "LMScast"
        - "Thoughtful Entrepreneur"
      key_quote: |
        "Being 'better' is unsustainable. Being DIFFERENT is defensible."
        - Todd Brown

  # ---------------------------------------------------------------------------
  # FRAMEWORK 9: CLV/INVESTOR THINKING (Business)
  # ---------------------------------------------------------------------------
  - framework_id: "fw_09"
    name: "CLV/Investor Thinking"
    type: "optimization"
    tier: "business"

    description:
      summary: |
        Focus on Customer Lifetime Value, not just acquisition cost.
        Investor mindset: what is customer worth long-term? Allows
        spending more to acquire (competitive advantage).
      when_to_use:
