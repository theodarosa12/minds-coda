        - "toddbrown.me (Drucker attribution)"
        - "E5 Method belief-building"
      key_quote: |
        "The aim of marketing is to make selling superfluous."
        - Peter Drucker via Todd Brown

  # ---------------------------------------------------------------------------
  # FRAMEWORK 12: E5 METHOD (Meta-Framework)
  # ---------------------------------------------------------------------------
  - framework_id: "fw_12"
    name: "E5 Method"
    type: "process"
    tier: "meta-framework"

    description:
      summary: |
        Five-stage process for engineering profitable, predictable customer
        acquisition campaigns. Integrates all other frameworks into
        sequential, executable methodology.
      when_to_use:
        - "Complete campaign development"
        - "Marketing methodology training"
        - "Systematic marketing approach"
      when_not_to_use:
        - "Quick tactical fixes"
        - "Non-marketing business problems"
        - "When resources don't allow full process"

    stages:
      stage_1_examine:
        focus: "Research prospects, products, competition"
        output: "Market sophistication understanding"
        frameworks_deployed:
          - "Market Sophistication Strategy"
          - "Circle of Competence"
        gate: "Market understanding sufficient?"

      stage_2_engineer:
        focus: "Build Big Idea, Unique Mechanism, SIN Offer"
        output: "Campaign components"
        frameworks_deployed:
          - "Idea-First Architecture"
          - "Mechanism-Creates-Believability"
          - "SIN Offer Construction"
          - "Hierarchical Component Architecture"
        gate: "Big Idea present? Mechanism unique? Offer SIN?"

      stage_3_evaluate:
        focus: "Test with Minimum Viable Funnel"
        output: "Validation data"
        frameworks_deployed:
          - "Sequential Validation Architecture"
          - "Quality Gate Enforcement"
        gate: "Data validates approach?"

      stage_4_enhance:
        focus: "Optimize proven elements"
        output: "Full campaign"
        frameworks_deployed:
          - "Hierarchical Component Architecture"
          - "Education-First Persuasion"
        gate: "All components optimized?"

      stage_5_expand:
        focus: "Scale through media buying"
        output: "Growth"
        frameworks_deployed:
          - "CLV/Investor Thinking"
          - "Sequential Validation Architecture (for scaling)"
        gate: "Unit economics positive?"

    cross_domain_validation:
      original_domain: "Direct Response Marketing"
      validated_domains:
        - domain: "Product Development"
          works: partially
          example: "Research → Build → Test → Iterate → Scale"
          limitations: "Marketing-specific language"

        - domain: "Scientific Method"
          works: true
          example: "Observe → Hypothesize → Test → Analyze → Apply"
          validation_notes: "Same sequential validation"

      boundary_conditions:
        - "Requires resources for full 5-stage process"
        - "Direct response context with measurable outcomes"
        - "Capital for testing and scaling"

    first_principles:
      core_axioms:
        - "Systematic process removes emotion from decisions"
        - "Sequential validation prevents compounding errors"
        - "All other frameworks have place in larger system"
        - "Repeatability > one-time creativity"

      necessary_conditions:
        - "Time for full process"
        - "Budget for testing (Stage 3)"
        - "Ability to measure results"

      inversion_insights:
        failure_mode: "Skipping stages or going out of order"
        critical_dependency: "Discipline to complete all stages"
        false_assumption: "Can shortcut the process"
        inverted_question: "How to guarantee campaign failure? → Skip to execution without Examine/Engineer"

    latticework_connections:
      complements: []

      contradicts: []

      prerequisites: []  # This IS the meta-framework

      enhances:
        - framework: "All other frameworks"
          reason: "Provides context for when each framework deploys"

    usability:
      prediction_power: "HIGH"
      explanation_power: "HIGH"
      action_guidance: "VERY HIGH"
      error_prevention: "VERY HIGH"

    evidence:
      occurrence_count: 15
      primary_sources:
        - "E5 Method Book"
        - "Eventual Millionaire"
        - "LMScast"
        - "Copy Chief Radio"
      key_quote: |
        "Five-stage process for engineering profitable, predictable
        customer acquisition campaigns." - Todd Brown

