frameworks:

  # ---------------------------------------------------------------------------
  # FRAMEWORK 1: IDEA-FIRST ARCHITECTURE (Foundational)
  # ---------------------------------------------------------------------------
  - framework_id: "fw_01"
    name: "Idea-First Architecture"
    type: "decision"
    tier: "foundational"

    description:
      summary: |
        The quality of the underlying idea determines system success. Execution
        amplifies the idea but cannot compensate for a weak one. Investment in
        execution without validating the idea is waste.
      when_to_use:
        - "Any marketing campaign development"
        - "Product launch decisions"
        - "Resource allocation in marketing"
        - "Diagnosing underperforming campaigns"
      when_not_to_use:
        - "Pure brand marketing without response measurement"
        - "Early-stage exploration where idea isn't yet formed"
        - "Non-marketing business problems (without adaptation)"

    cross_domain_validation:
      original_domain: "Direct Response Marketing"
      validated_domains:
        - domain: "Product Development"
          works: true
          example: "Minimum Viable Product concept validates idea before full build"
          validation_notes: "Core insight transfers directly"

        - domain: "Content Creation"
          works: true
          example: "Headline testing before writing full article"
          validation_notes: "Tim Ferriss title testing story"

        - domain: "Business Strategy"
          works: true
          example: "Business model validation before scale"
          validation_notes: "Lean startup methodology applies same principle"

        - domain: "Education/Teaching"
          works: partially
          example: "Curriculum design - big idea of course matters"
          limitations: "Some teaching requires iterative discovery"

      boundary_conditions:
        - "Requires measurable outcomes to validate idea quality"
        - "Assumes capital/resources for testing available"
        - "Works best when audience response is quantifiable"

    first_principles:
      core_axioms:
        - "90% of marketing failures trace to weak underlying idea"
        - "Execution amplifies signal; cannot create signal from noise"
        - "Downstream investment on weak foundation = wasted resources"
        - "Ideas are discoverable and testable, not just creative magic"

      necessary_conditions:
        - "Ability to define what 'good idea' means in context"
        - "Mechanism to test/validate idea before full investment"
        - "Willingness to kill ideas that don't validate"

      inversion_insights:
        failure_mode: "Investing in execution while idea quality unknown"
        critical_dependency: "Idea validation mechanism (MVF, testing)"
        false_assumption: "Great execution can save weak idea"
        inverted_question: "How to GUARANTEE a failed campaign? → Skip idea validation"

    latticework_connections:
      complements:
        - framework: "Sequential Validation Architecture"
          synergy: "Validation proves idea before downstream investment"
        - framework: "Mechanism-Creates-Believability"
          synergy: "Mechanism makes the idea credible"
        - framework: "Hierarchical Component Architecture"
          synergy: "Establishes idea as priority 1 in hierarchy"

      contradicts: []

      prerequisites:
        - framework: "Circle of Competence (Munger)"
          reason: "Must understand enough about domain to evaluate ideas"

      enhances:
        - framework: "Quality Gate Enforcement"
          reason: "Provides the gate criterion (Big Idea present?)"

    usability:
      prediction_power: "HIGH"
      prediction_test: |
        Framework predicts: Campaigns with weak ideas will underperform
        regardless of copy quality. Validated by 10+ years of Todd's
        client work and Agora case studies.

      explanation_power: "HIGH"
      explanation_test: |
        Explains why "polished copy" campaigns still fail. Root cause is
        not execution, but underlying idea weakness.

      action_guidance: "HIGH"
      action_test: |
        Provides clear directive: BEFORE any marketing work, ask "What's
        the Big Idea?" If unclear or weak, stop and fix idea first.

      error_prevention: "HIGH"
      error_test: |
        Prevents common error of optimizing execution while ignoring
        fundamentals. The "button color" mistake.

    evidence:
      occurrence_count: 22
      primary_sources:
        - "E5 Method Book"
        - "Eventual Millionaire Interview"
        - "Copy Chief Radio"
        - "LMScast"
      key_quote: |
        "90% of marketing copy that is not effective suffers from one of
        three problems. The number one problem is a lack of a single,
        unifying big idea." - Mark Ford via Todd Brown

  # ---------------------------------------------------------------------------
  # FRAMEWORK 2: SEQUENTIAL VALIDATION ARCHITECTURE (Foundational)
  # ---------------------------------------------------------------------------
  - framework_id: "fw_02"
    name: "Sequential Validation Architecture"
    type: "decision"
    tier: "foundational"

    description:
      summary: |
        Validate core assumptions before scaling investment. Small bets →
        Data → Decision → Scale (or Kill). Skip validation = multiply risk
        downstream.
      when_to_use:
        - "Campaign development (MVF concept)"
        - "Business investment decisions"
        - "New product launches"
        - "Any high-stakes resource commitment"
      when_not_to_use:
        - "Proven patterns with established track record"
        - "Time-critical opportunities with asymmetric upside"
        - "Low-stakes experiments"

    cross_domain_validation:
      original_domain: "Direct Response Marketing"
      validated_domains:
        - domain: "Product Development"
          works: true
          example: "MVP → User feedback → Iterate or pivot"
          validation_notes: "Lean startup methodology"

        - domain: "Scientific Research"
          works: true
          example: "Hypothesis → Experiment → Data → Conclusion"
          validation_notes: "Scientific method is sequential validation"

        - domain: "Investment/Finance"
          works: true
          example: "Position sizing based on conviction level"
          validation_notes: "Munger/Buffett approach to concentration"

        - domain: "Personal Development"
          works: partially
          example: "Test new habits for 30 days before committing"
          limitations: "Some growth requires commitment without proof"

      boundary_conditions:
        - "Requires resources for testing (ad spend, time, etc.)"
        - "Must have clear success/failure criteria"
        - "Assumes iteration is possible (not one-shot)"

    first_principles:
      core_axioms:
        - "Unknown assumptions multiply into compounding risk"
        - "Small tests generate data that de-risks larger investments"
        - "Sunk cost is irrelevant; future cost is what matters"
        - "Speed to validated learning > speed to execution"

      necessary_conditions:
        - "Testing budget/resources available"
        - "Clear metrics defining success"
        - "Willingness to kill invalidated approaches"

      inversion_insights:
        failure_mode: "Full investment before validation = maximum risk exposure"
        critical_dependency: "Clear go/no-go criteria before test begins"
        false_assumption: "Conviction eliminates need for validation"
        inverted_question: "How to maximize wasted resources? → Skip testing, go all-in immediately"

    latticework_connections:
      complements:
        - framework: "Idea-First Architecture"
          synergy: "Validates idea before downstream investment"
        - framework: "Quality Gate Enforcement"
          synergy: "Gates enforce validation checkpoints"

      contradicts:
        - framework: "Move Fast Break Things"
          resolution: "Context-dependent: Fast for low-risk, validate for high-risk"

      prerequisites:
        - framework: "Idea-First Architecture"
          reason: "Must have idea to test before validation applies"

      enhances:
        - framework: "CLV/Investor Thinking"
          reason: "Validation data informs investment sizing"

    usability:
      prediction_power: "HIGH"
      explanation_power: "HIGH"
      action_guidance: "HIGH"
      error_prevention: "HIGH"

    evidence:
      occurrence_count: 15
      primary_sources:
        - "E5 Method Stage 3 (Evaluate)"
        - "Bacon Wrapped Business"
        - "Tim Ferriss AdWords testing story"
      key_quote: |
        "Test your Big Idea before committing full investment. MVF:
        4-page stripped-down funnel for validation." - E5 Method

  # ---------------------------------------------------------------------------
  # FRAMEWORK 3: MECHANISM-CREATES-BELIEVABILITY (Domain)
  # ---------------------------------------------------------------------------
  - framework_id: "fw_03"
    name: "Mechanism-Creates-Believability"
    type: "cause-effect"
    tier: "domain"

    description:
      summary: |
        Promise alone creates skepticism. Promise + Mechanism creates
        believability. The "how it works" is what makes claims credible.
        Formula: Promise + Mechanism = Believability.
      when_to_use:
        - "Sophisticated markets (Level 3-5)"
        - "Marketing copy development"
        - "Product positioning"
        - "Building credibility for any claim"
      when_not_to_use:
        - "Early markets (Level 1-2) where direct claims work"
        - "When mechanism is truly proprietary/secret"
        - "Casual conversation vs. persuasion context"

    cross_domain_validation:
      original_domain: "Direct Response Marketing"
      validated_domains:
        - domain: "Science Communication"
          works: true
          example: "Explaining HOW vaccine works creates acceptance"
          validation_notes: "Mechanism understanding reduces skepticism"

        - domain: "Sales"
          works: true
          example: "Explaining WHY this solution works for their specific problem"
          validation_notes: "B2B sales methodology uses mechanism"

        - domain: "Education"
          works: true
          example: "Teaching WHY something works creates deeper learning"
          validation_notes: "Understanding mechanism > memorizing facts"

        - domain: "Personal Persuasion"
          works: partially
          example: "Explaining logic behind request"
          limitations: "Emotional contexts may not need mechanism"

      boundary_conditions:
        - "Requires audience capable of processing mechanism"
        - "Mechanism must be genuinely interesting/different"
        - "Only works if mechanism is true and defensible"

    first_principles:
      core_axioms:
        - "Skepticism is default response to claims"
        - "Mechanisms explain causation, reducing uncertainty"
        - "Differentiated mechanisms create category of one"
        - "Understanding 'how' enables belief in 'what'"

      necessary_conditions:
        - "Actual mechanism exists (can't be fabricated)"
        - "Mechanism is communicable to audience"
        - "Mechanism differentiates from competitors"

      inversion_insights:
        failure_mode: "Making claims without mechanism = generating skepticism"
        critical_dependency: "Genuine, interesting mechanism to communicate"
        false_assumption: "Bigger claims create more credibility"
        inverted_question: "How to maximize skepticism? → Bigger promises, no explanation of HOW"

    latticework_connections:
      complements:
        - framework: "Idea-First Architecture"
          synergy: "Mechanism supports and enables the Big Idea"
        - framework: "Market Sophistication Strategy"
          synergy: "Sophistication level determines mechanism emphasis"
        - framework: "Differentiation Over Improvement"
          synergy: "Unique Mechanism IS the differentiation"

      contradicts: []

      prerequisites:
        - framework: "Idea-First Architecture"
          reason: "Must have idea before developing mechanism"

      enhances:
        - framework: "Hierarchical Component Architecture"
          reason: "Mechanism is Priority 2 in hierarchy"

    usability:
      prediction_power: "HIGH"
      explanation_power: "HIGH"
      action_guidance: "HIGH"
      error_prevention: "HIGH"

    evidence:
      occurrence_count: 18
      primary_sources:
        - "E5 Method Book"
        - "LMScast"
        - "Fat burner market evolution example"
      key_quote: |
        "In marketing, the Unique Mechanism is the unique manner, method,
        or material that allows the product or service to deliver the
        desired benefits." - Todd Brown

  # ---------------------------------------------------------------------------
  # FRAMEWORK 4: MARKET SOPHISTICATION STRATEGY (Domain)
  # ---------------------------------------------------------------------------
  - framework_id: "fw_04"
    name: "Market Sophistication Strategy"
    type: "pattern"
    tier: "domain"

    description:
      summary: |
        Prospects evolve as they see more marketing. Strategy must match
        sophistication level. Using Level 1 strategy in Level 5 market
        guarantees failure.
      when_to_use:
        - "Market analysis (E5 Stage 1 Examine)"
        - "Campaign strategy selection"
        - "Diagnosing campaign failures"
        - "Competitive positioning decisions"
      when_not_to_use:
        - "Brand new category creation (no existing sophistication)"
        - "Internal communications"
        - "Non-marketing contexts"

    levels:
      level_1:
        market_state: "Unaware of solutions"
        strategy: "Direct claim - 'This works'"
        example: "First fat burner in market"

      level_2:
        market_state: "Aware of basic solutions"
        strategy: "Expanded claim - 'This works better'"
        example: "Fat burner with more ingredients"

      level_3:
        market_state: "Skeptical of claims"
        strategy: "Introduce mechanism - 'Here's HOW'"
        example: "Green tea extract fat burner"

      level_4:
        market_state: "Saturated with mechanisms"
        strategy: "Elaborate mechanism - 'WHY this is different'"
        example: "Proprietary extraction method"

      level_5:
        market_state: "Exhausted with marketing"
        strategy: "Identification and story"
        example: "For people like you who..."

    cross_domain_validation:
      original_domain: "Direct Response Marketing"
      validated_domains:
        - domain: "Technology Adoption"
          works: true
          example: "Rogers Diffusion Curve - same evolution pattern"
          validation_notes: "Early adopters → Skeptics → Laggards"

        - domain: "Political Communication"
          works: true
          example: "Messaging must match voter sophistication"
          validation_notes: "Primary vs general election messaging"

        - domain: "Education"
          works: true
          example: "Teaching must match student knowledge level"
          validation_notes: "Scaffolding concept in pedagogy"

      boundary_conditions:
        - "Requires understanding of current market position"
        - "Markets can regress (new entrants reset sophistication)"
        - "Different segments may be at different levels"

    first_principles:
      core_axioms:
        - "Audiences evolve through exposure to marketing"
        - "What worked yesterday may not work today"
        - "Mismatched strategy wastes resources"
        - "Markets rarely stay at Level 1-2 for long"

      necessary_conditions:
        - "Ability to assess current market sophistication"
        - "Flexibility to adapt strategy to level"
        - "Mechanism available for Level 3-5 markets"

      inversion_insights:
        failure_mode: "Using Level 1 strategy in Level 5 market"
        critical_dependency: "Accurate market sophistication assessment"
        false_assumption: "What worked before will work again"
        inverted_question: "How to guarantee campaign failure? → Ignore market evolution"

    latticework_connections:
      complements:
        - framework: "Mechanism-Creates-Believability"
          synergy: "Mechanism becomes critical at Level 3+"
        - framework: "Differentiation Over Improvement"
          synergy: "Differentiation is essential at Level 4-5"

      contradicts: []

      prerequisites:
        - framework: "Idea-First Architecture"
          reason: "Need idea to position at any level"

      enhances:
        - framework: "Idea-First Architecture"
          reason: "Determines HOW to present the idea"

    usability:
      prediction_power: "HIGH"
      explanation_power: "HIGH"
      action_guidance: "HIGH"
      error_prevention: "HIGH"

    evidence:
      occurrence_count: 11
      primary_sources:
        - "E5 Method Book"
        - "Eugene Schwartz (Breakthrough Advertising)"
        - "Fat burner market evolution example"
      key_quote: |
        "Schwartz's 5 levels explained the evolution. What worked at Level 1
        fails at Level 5." - Todd Brown

  # ---------------------------------------------------------------------------
  # FRAMEWORK 5: HIERARCHICAL COMPONENT ARCHITECTURE (Domain)
  # ---------------------------------------------------------------------------
  - framework_id: "fw_05"
    name: "Hierarchical Component Architecture"
    type: "optimization"
    tier: "domain"

    description:
      summary: |
        Marketing components have strict hierarchy: Idea > Mechanism >
        Offer > Copy. Higher components determine lower ones. Fixing low
        components cannot compensate for broken high ones.
      when_to_use:
        - "Campaign diagnosis"
        - "Resource allocation decisions"
        - "Prioritizing marketing improvements"
        - "Teaching marketing strategy"
      when_not_to_use:
        - "When all higher components already validated"
        - "Quick tactical fixes for proven campaigns"

    hierarchy:
      priority_1:
        component: "Big Idea"
        weight: "40%"
        function: "Core concept that drives resonance"
        if_broken: "Nothing else matters - fix this first"

      priority_2:
        component: "Unique Mechanism"
        weight: "25%"
        function: "Creates believability for idea"
        if_broken: "Copy optimization is wasted effort"

      priority_3:
        component: "SIN Offer"
        weight: "20%"
        function: "Makes decision easy"
        if_broken: "Good copy can't overcome weak offer"

      priority_4:
        component: "Copy Execution"
        weight: "15%"
        function: "Articulates above components"
        if_broken: "Only fix after above are solid"

    cross_domain_validation:
      original_domain: "Direct Response Marketing"
      validated_domains:
        - domain: "Software Development"
          works: true
          example: "Architecture > Framework > Implementation > UI"
          validation_notes: "Same hierarchy principle applies"

        - domain: "Construction"
          works: true
          example: "Foundation > Structure > Systems > Finishes"
          validation_notes: "Can't polish finishes on cracked foundation"

        - domain: "Medicine"
          works: true
          example: "Diagnosis > Treatment Plan > Medication > Compliance"
          validation_notes: "Wrong diagnosis = wasted treatment"

      boundary_conditions:
        - "Hierarchy is absolute for campaign diagnosis"
        - "Quick tactical fixes OK when hierarchy is solid"
        - "Assumes time to address hierarchy sequentially"

    first_principles:
      core_axioms:
        - "Upstream problems propagate downstream"
        - "Optimization below the problem wastes resources"
        - "Most 'copy problems' are actually idea problems"
        - "Hierarchy enforces disciplined diagnosis"

      necessary_conditions:
        - "Ability to assess each component independently"
        - "Willingness to stop and fix upstream before continuing"
        - "Process that enforces sequential validation"

      inversion_insights:
        failure_mode: "Optimizing copy while idea is weak"
        critical_dependency: "Accurate diagnosis of problem level"
        false_assumption: "Better copy can save weak idea"
        inverted_question: "How to waste maximum resources? → Polish copy without checking idea"

    latticework_connections:
      complements:
        - framework: "Idea-First Architecture"
          synergy: "Hierarchy operationalizes idea-first principle"
        - framework: "Mechanism-Creates-Believability"
          synergy: "Mechanism at Priority 2 supports hierarchy"

      contradicts: []

      prerequisites:
        - framework: "Idea-First Architecture"
          reason: "Must believe in idea primacy to accept hierarchy"

      enhances:
        - framework: "Sequential Validation Architecture"
          reason: "Provides what to validate in sequence"

    usability:
      prediction_power: "HIGH"
      explanation_power: "HIGH"
      action_guidance: "HIGH"
      error_prevention: "HIGH"

    evidence:
      occurrence_count: 12
      primary_sources:
        - "E5 Method Structure"
        - "Hidden curriculum analysis"
        - "Copy Chief Radio"
      key_quote: |
        "Button colors are noise, idea is signal. Fix the hierarchy from
        top to bottom." - Todd Brown (inferred)

  # ---------------------------------------------------------------------------
  # FRAMEWORK 6: QUALITY GATE ENFORCEMENT (Decision)
  # ---------------------------------------------------------------------------
  - framework_id: "fw_06"
    name: "Quality Gate Enforcement"
    type: "constraint"
    tier: "operational"

    description:
      summary: |
        Non-negotiable checkpoints before campaign progression. Binary
        gates (pass/fail) prevent advancement of substandard work.
        Commitment device for maintaining standards.
      when_to_use:
        - "Campaign launch decisions"
        - "Stage progressions in E5"
        - "Content publication decisions"
        - "Any quality-critical decision"
      when_not_to_use:
        - "Early exploration/brainstorming phases"
        - "Iterative testing where failure is expected"
        - "Low-stakes content"

    gates:
      big_idea_gate:
        question: "Does this have a Big Idea?"
        test: "Can explain in 15 seconds?"
        result: "Binary pass/fail"
        action_on_fail: "Stop and develop idea"

      mechanism_gate:
        question: "Is there a Unique Mechanism?"
        test: "Can explain WHY and HOW differently?"
        result: "Binary pass/fail"
        action_on_fail: "Stop and develop mechanism"

      validation_gate:
        question: "Has MVF validated the idea?"
        test: "Data shows positive response?"
        result: "Binary pass/fail"
        action_on_fail: "Stop or iterate"

    cross_domain_validation:
      original_domain: "Direct Response Marketing"
      validated_domains:
        - domain: "Software Development"
          works: true
          example: "Code review, QA gates, deployment approvals"
          validation_notes: "Same gate concept"

        - domain: "Manufacturing"
          works: true
          example: "Quality control checkpoints"
          validation_notes: "Statistical process control"

        - domain: "Aviation"
          works: true
          example: "Pre-flight checklists"
          validation_notes: "Safety-critical gates"

      boundary_conditions:
        - "Gates must be binary to be effective"
        - "Gate criteria must be clear before reaching gate"
        - "Requires authority to enforce gates"

    first_principles:
      core_axioms:
        - "Unclear standards produce inconsistent quality"
        - "Commitment devices overcome in-the-moment weakness"
        - "Gates prevent compounding of early errors"
        - "Public commitment to standards creates accountability"

      necessary_conditions:
        - "Clear, measurable gate criteria"
        - "Authority to enforce gates"
        - "Willingness to delay for quality"

      inversion_insights:
        failure_mode: "Flexible standards that bend under pressure"
        critical_dependency: "Pre-defined, non-negotiable criteria"
        false_assumption: "We can fix it after launch"
        inverted_question: "How to guarantee quality problems? → Make all gates negotiable"

    latticework_connections:
      complements:
        - framework: "Idea-First Architecture"
          synergy: "Idea gate enforces idea-first principle"
        - framework: "Sequential Validation Architecture"
          synergy: "Gates enforce validation checkpoints"

      contradicts:
        - framework: "Move Fast Break Things"
          resolution: "Gates for quality-critical; fast iteration for learning"

      prerequisites: []

      enhances:
        - framework: "Hierarchical Component Architecture"
          reason: "Enforces hierarchy through gates"

    usability:
      prediction_power: "HIGH"
      explanation_power: "MEDIUM"
      action_guidance: "HIGH"
      error_prevention: "VERY HIGH"

    evidence:
      occurrence_count: 8
      primary_sources:
        - "Copy Chief Radio"
        - "toddbrown.me"
        - "Three-Finger Engagement Test"
      key_quote: |
        "If it doesn't have a big idea, it does not go out the door."
        - Todd Brown

  # ---------------------------------------------------------------------------
  # FRAMEWORK 7: ATTRIBUTION-RESPECT PROTOCOL (Meta)
  # ---------------------------------------------------------------------------
  - framework_id: "fw_07"
    name: "Attribution-Respect Protocol"
    type: "heuristic"
    tier: "meta-cognitive"

    description:
      summary: |
        Honor intellectual lineage. Never claim invention of inherited
        ideas. Add synthesis and application, not false origin. Authority
        through integration, not origination.
      when_to_use:
        - "Teaching concepts from others"
        - "Writing about marketing theory"
        - "Public speaking/presenting"
        - "All professional content creation"
      when_not_to_use:
        - "Genuinely original insights (proper to claim)"
        - "General knowledge with no clear source"

    protocol:
      step_1: "Identify original source of concept"
      step_2: "Explicitly credit using attribution language"
      step_3: "Explain the concept"
      step_4: "Add personal synthesis/application"
      step_5: "Never claim concept is your invention"

    attribution_language:
      patterns:
        - "Mark Ford taught us that..."
        - "As Eugene Schwartz explained..."
        - "Via [mentor name]..."
        - "I learned from [name] that..."
        - "According to [name]..."

    cross_domain_validation:
      original_domain: "Marketing Education"
      validated_domains:
        - domain: "Academic Research"
          works: true
          example: "Citation requirements"
          validation_notes: "Foundation of scholarly work"

        - domain: "Journalism"
          works: true
          example: "Source attribution"
          validation_notes: "Credibility through sourcing"

        - domain: "Open Source Software"
          works: true
          example: "License attribution"
          validation_notes: "Community norm"

        - domain: "Personal Reputation"
          works: true
          example: "Intellectual honesty builds trust"
          validation_notes: "Differentiation from ego-driven peers"

      boundary_conditions:
        - "Not needed for general common knowledge"
        - "Can over-attribute (acceptable cost)"
        - "Requires knowledge of intellectual lineage"

    first_principles:
      core_axioms:
        - "Intellectual honesty builds lasting credibility"
        - "Attribution connects to prestigious lineage"
        - "Synthesis expertise is valuable; origination claim is unnecessary"
        - "Trust accumulates through consistent honesty"

      necessary_conditions:
        - "Knowledge of where concepts originate"
        - "Willingness to share credit"
        - "Ego security to not need false originality"

      inversion_insights:
        failure_mode: "Claiming others' concepts as own"
        critical_dependency: "Knowledge of intellectual history"
        false_assumption: "Originality claims build more credibility"
        inverted_question: "How to destroy credibility? → Claim others' work as your invention"

    latticework_connections:
      complements: []

      contradicts: []

      prerequisites:
        - framework: "Circle of Competence (Munger)"
          reason: "Must know domain well enough to know sources"

      enhances:
        - framework: "All other frameworks"
          reason: "Creates credibility for all teaching"

    usability:
      prediction_power: "HIGH"
      explanation_power: "MEDIUM"
      action_guidance: "HIGH"
      error_prevention: "HIGH"

    evidence:
      occurrence_count: 14
      primary_sources:
        - "All interviews (14/14 Mark Ford attribution)"
        - "All Schwartz mentions (7/7 attributed)"
      key_quote: |
        "Mark Ford taught us that we were in the idea business."
        - Todd Brown (never claims Big Idea as his concept)

  # ---------------------------------------------------------------------------
  # FRAMEWORK 8: DIFFERENTIATION OVER IMPROVEMENT (Strategic)
  # ---------------------------------------------------------------------------
  - framework_id: "fw_08"
    name: "Differentiation Over Improvement"
    type: "heuristic"
    tier: "strategic"

    description:
      summary: |
        Being "better" invites comparison race (unsustainable). Being
        "different" creates new category (defensible). Seek differentiation,
        not incremental improvement.
      when_to_use:
        - "Competitive positioning decisions"
        - "Product differentiation strategy"
        - "Marketing messaging development"
        - "Personal/professional positioning"
      when_not_to_use:
        - "Early markets where better works (Level 1-2)"
        - "When genuine improvement creates category"
        - "Internal process optimization"

    cross_domain_validation:
      original_domain: "Marketing Strategy"
      validated_domains:
        - domain: "Business Strategy"
          works: true
          example: "Blue Ocean Strategy - create uncontested market"
          validation_notes: "Same insight, different framing"

        - domain: "Career Development"
          works: true
          example: "Unique skill combinations vs being best at one thing"
          validation_notes: "Scott Adams 'talent stack'"

        - domain: "Personal Branding"
          works: true
          example: "The expert other experts consult"
          validation_notes: "Todd's own positioning"

        - domain: "Product Development"
          works: partially
          example: "Feature innovation vs performance improvement"
          limitations: "Sometimes 10x better IS different"

      boundary_conditions:
        - "Market must be sophisticated enough for differentiation to matter"
        - "Differentiation must be genuine and sustainable"
        - "Some markets reward pure performance (Level 1)"

    first_principles:
      core_axioms:
        - "'Better' invites feature comparison races"
        - "'Different' creates category of one"
        - "Defensibility comes from uniqueness, not superiority"
        - "Comparison neutralization is strategic advantage"

      necessary_conditions:
        - "Genuine unique angle exists or can be created"
        - "Audience values uniqueness over marginal improvement"
        - "Differentiation is communicable"

      inversion_insights:
        failure_mode: "Competing on 'better' in saturated market"
        critical_dependency: "Unique Mechanism or positioning angle"
        false_assumption: "Best product always wins"
        inverted_question: "How to guarantee commoditization? → Compete only on being better"

    latticework_connections:
      complements:
        - framework: "Mechanism-Creates-Believability"
          synergy: "Unique Mechanism IS the differentiation"
        - framework: "Market Sophistication Strategy"
          synergy: "Differentiation critical at Level 4-5"

      contradicts:
        - framework: "Continuous Improvement"
          resolution: "Improve execution; differentiate positioning"

      prerequisites:
