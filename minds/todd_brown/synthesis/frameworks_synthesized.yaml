        - "First transaction is just the beginning of value"
        - "Higher allowable acquisition cost = competitive advantage"
        - "Backend value creation expands acquisition options"
        - "Transaction thinking limits growth"

      necessary_conditions:
        - "Backend products/services to increase CLV"
        - "Cash flow to support longer payback periods"
        - "Tracking systems to measure CLV"

      inversion_insights:
