  # ---------------------------------------------------------------------------
  # FRAMEWORK 10: SIN OFFER CONSTRUCTION (Domain)
  # ---------------------------------------------------------------------------
  - framework_id: "fw_10"
    name: "SIN Offer Construction"
    type: "pattern"
    tier: "domain"

    description:
      summary: |
        Three qualities make offers irresistible: Superior (clearly better
        than alternatives), Irresistible (emotionally compelling),
        No-brainer (obviously valuable decision). SIN = S + I + N.
      when_to_use:
        - "Offer development (E5 Stage 2)"
        - "Improving conversion rates"
        - "Competitive positioning"
        - "Price-value communication"
      when_not_to_use:
        - "Premium/luxury positioning (scarcity over value)"
        - "B2B complex sales (relationship over offer)"

    components:
      superior:
        definition: "Clearly better than alternatives"
        elements:
          - "Unique Mechanism"
          - "Better results promised"
          - "Additional value not available elsewhere"
        question: "How is this clearly better than alternatives?"

      irresistible:
        definition: "Emotionally compelling"
        elements:
          - "Emotional resonance with desires/fears"
          - "Urgency drivers"
          - "Scarcity elements"
        question: "Why would someone feel compelled to act?"

      no_brainer:
        definition: "Obviously valuable decision"
        elements:
          - "Risk reversal (guarantee)"
          - "Value stacking (bonuses)"
          - "Price-value gap (clearly worth more)"
        question: "Why is this obviously a good decision?"

    cross_domain_validation:
      original_domain: "Direct Response Marketing"
      validated_domains:
        - domain: "Negotiation"
          works: true
          example: "Making proposals the other side can't refuse"
          validation_notes: "Same value-communication principles"

        - domain: "Proposal Writing"
          works: true
          example: "Business proposals that win"
          validation_notes: "SIN framework applies"

        - domain: "Job Offers"
          works: partially
          example: "Employer value proposition"
          limitations: "Relationship factors complicate"

      boundary_conditions:
        - "Must be able to deliver on offer promises"
        - "Works best for considered purchases"
        - "Requires genuine value to stack"

    first_principles:
      core_axioms:
        - "Offers drive conversion more than copy"
        - "Decision ease reduces friction"
        - "Risk reversal removes final objection"
        - "Value perception must exceed price"

      necessary_conditions:
        - "Genuine value to communicate"
        - "Ability to deliver on promises"
        - "Understanding of customer desires"

      inversion_insights:
        failure_mode: "Weak offer that copy can't save"
        critical_dependency: "Genuine value creation"
        false_assumption: "Better copy can overcome weak offer"
        inverted_question: "How to guarantee low conversion? → Create offer that's easy to say no to"

    latticework_connections:
      complements:
        - framework: "Hierarchical Component Architecture"
          synergy: "SIN Offer is Priority 3 in hierarchy"
        - framework: "Mechanism-Creates-Believability"
          synergy: "Mechanism makes Superior believable"

      contradicts: []

      prerequisites:
        - framework: "Idea-First Architecture"
          reason: "Big Idea shapes what offer should be"
        - framework: "Mechanism-Creates-Believability"
          reason: "Mechanism supports Superior claim"

      enhances:
        - framework: "Quality Gate Enforcement"
          reason: "SIN criteria become gate"

    usability:
      prediction_power: "HIGH"
      explanation_power: "HIGH"
      action_guidance: "HIGH"
      error_prevention: "HIGH"

    evidence:
      occurrence_count: 8
      primary_sources:
        - "E5 Method Stage 2"
        - "Thoughtful Entrepreneur"
        - "toddbrown.me"
      key_quote: |
        "Superior, Irresistible, No-brainer. The three qualities of
        compelling offers." - E5 Method

  # ---------------------------------------------------------------------------
  # FRAMEWORK 11: EDUCATION-FIRST PERSUASION (Strategic)
  # ---------------------------------------------------------------------------
  - framework_id: "fw_11"
    name: "Education-First Persuasion"
    type: "cause-effect"
    tier: "strategic"

    description:
      summary: |
        Effective marketing educates prospects about mechanisms and builds
        belief, rather than using hyperbolic claims or high-pressure tactics.
        Education creates qualified demand that makes selling collaborative.
      when_to_use:
        - "Content marketing strategy"
        - "Sales funnel design"
        - "Complex product/service marketing"
        - "Building long-term customer relationships"
      when_not_to_use:
        - "Impulse purchase products"
        - "Time-sensitive promotions"
        - "Mass-market simple products"

    cross_domain_validation:
      original_domain: "Direct Response Marketing"
      validated_domains:
        - domain: "B2B Sales"
          works: true
          example: "Consultative selling approach"
          validation_notes: "Education builds trust and qualification"

        - domain: "Professional Services"
          works: true
          example: "Thought leadership content"
          validation_notes: "Education demonstrates expertise"

        - domain: "Healthcare"
          works: true
          example: "Patient education improves compliance"
          validation_notes: "Understanding drives adoption"

        - domain: "Retail"
          works: partially
          example: "Depends on product complexity"
          limitations: "Simple products don't need education"

      boundary_conditions:
        - "Product must have sufficient complexity to educate about"
        - "Audience must be willing to invest in learning"
        - "Requires patience - longer sales cycle"

    first_principles:
      core_axioms:
        - "Educated prospects make better buying decisions"
        - "Understanding mechanism creates belief"
        - "Qualified demand converts more easily"
        - "Education builds trust that hyperbole destroys"

      necessary_conditions:
        - "Something genuine to educate about"
        - "Patience for longer conversion path"
        - "Content creation capability"

      inversion_insights:
        failure_mode: "Hyperbolic claims that breed skepticism"
        critical_dependency: "Genuine educational value to provide"
        false_assumption: "Aggressive selling converts better"
        inverted_question: "How to create resistant prospects? → Push hard without educating"

    latticework_connections:
      complements:
        - framework: "Mechanism-Creates-Believability"
          synergy: "Education explains mechanism"
        - framework: "Quality Gate Enforcement"
          synergy: "Education quality becomes gate"

      contradicts:
        - framework: "Hard Sell Tactics"
          resolution: "Context-dependent - education for complex, urgency for simple"

      prerequisites:
        - framework: "Idea-First Architecture"
          reason: "Must have idea worth educating about"

      enhances:
        - framework: "CLV/Investor Thinking"
          reason: "Educated customers have higher CLV"

    usability:
      prediction_power: "HIGH"
      explanation_power: "HIGH"
      action_guidance: "HIGH"
      error_prevention: "HIGH"

    evidence:
      occurrence_count: 9
      primary_sources:
