    - routine: "Pragmatic Failure Processing"
      triggers:
        - "Campaign underperformance"
        - "Business setbacks"
        - "Failure questions"
      mechanism: "Process attribution + lesson extraction"
      effectiveness: "high"
      recovery_time: "Quick (neutral emotional processing)"
