mental_models:

  - id: "MM_001"
    name: "We're in the Idea Business"
    source: "Mark Ford"
    confidence: "HIGH"

    content: |
      Success is determined by the quality of the underlying idea,
      not copy techniques, budgets, or funnels.

    application: "E5 Stage 2 starts with idea development"

  - id: "MM_002"
    name: "Education Over Selling"
    source: "Todd Brown"
    confidence: "HIGH"

    content: |
      Effective marketing educates prospects about the mechanism
      rather than pitching with exaggerated claims.

    application: "Builds belief before presenting offer"

  - id: "MM_003"
    name: "Market Sophistication Levels"
    source: "Eugene Schwartz via Todd"
    confidence: "HIGH"

    content: |
      Prospects evolve as they see more marketing. Strategy must
      match sophistication level. Higher levels require mechanism focus.

    levels:
      - level: 1
        strategy: "Direct claim"
      - level: 2
        strategy: "Expand claim"
      - level: 3
        strategy: "Introduce mechanism"
      - level: 4
        strategy: "Elaborate mechanism"
      - level: 5
        strategy: "Identification and story"

  - id: "MM_004"
    name: "Mechanism Creates Believability"
    source: "Todd Brown synthesis"
    confidence: "HIGH"

    content: "Promise + Mechanism = Believability. Promise alone = Skepticism."

  - id: "MM_005"
    name: "Investor vs Transactional Thinking"
    source: "E5 Method"
    confidence: "HIGH"

    content: |
      Focus on Customer Lifetime Value (CLV), not just cost per
      acquisition. Allows spending more to acquire.

  - id: "MM_006"
    name: "Differentiation Over Improvement"
    source: "Todd Brown"
    confidence: "HIGH"

    content: |
      Being "better" is unsustainable. Being DIFFERENT is defensible.

  - id: "MM_007"
    name: "Offer Drives Copy"
    source: "E5 Method structure"
    confidence: "HIGH"

    content: |
      The offer is engineered first. Copy articulates the offer.
      Not the other way around.

  - id: "MM_008"
    name: "Validate Before Scale"
    source: "E5 Stage 3"
    confidence: "HIGH"

    content: |
      Test with minimum viable funnel before investing in full
      build-out. Prove the idea works first.

