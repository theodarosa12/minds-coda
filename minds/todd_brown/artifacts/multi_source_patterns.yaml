# =============================================================================
# STRUCTURAL PATTERNS (Abstracted Frameworks)
# =============================================================================
structural_patterns:

  - pattern_id: "STRUCT_001"
    name: "Idea-First Architecture"
    abstract_form: "Quality of underlying concept determines system success"
    abstraction_level: "Universal"
    cross_domain_validity: true

    concrete_manifestations:
      - context: "Marketing Campaigns"
        how_expressed: "Big Idea determines campaign success"
        source: "E5 Method Book"
        evidence: "90% of underperforming copy lacks unified idea"

      - context: "Business Strategy"
        how_expressed: "Differentiation through unique positioning"
        source: "toddbrown.me"
        evidence: "Different > Better philosophy"

      - context: "Product Development"
        how_expressed: "Unique Mechanism as differentiation"
        source: "Multiple interviews"
        evidence: "Mechanism creates believability"

    framework_form: |
      1. Start with idea quality (not execution)
      2. Validate idea before investing in execution
      3. Execution articulates the idea (not the other way)
      4. Poor idea = wasted execution investment

  - pattern_id: "STRUCT_002"
    name: "Sequential Validation Architecture"
    abstract_form: "Validate core assumptions before scaling investment"
    abstraction_level: "Universal"
    cross_domain_validity: true

    concrete_manifestations:
      - context: "Marketing Funnels"
        how_expressed: "MVF (Minimum Viable Funnel) before full build"
        source: "E5 Method Book"
        evidence: "4-page test funnel in Stage 3"

      - context: "Campaign Development"
        how_expressed: "E5 stages progress only after validation"
        source: "Multiple interviews"
        evidence: "Evaluate before Enhance"

      - context: "Business Decisions"
        how_expressed: "Test before commit"
        source: "Bacon Wrapped Business"
        evidence: "Peaks and valleys narrative"

    framework_form: |
      1. Hypothesis first (Stage 2)
      2. Minimum viable test (Stage 3)
      3. Data-driven decision to scale (Gate)
      4. Full investment only after validation (Stage 4-5)

  - pattern_id: "STRUCT_003"
    name: "Sophistication-Responsive Strategy"
    abstract_form: "Strategy must match audience evolution"
    abstraction_level: "Domain"
    cross_domain_validity: true

    concrete_manifestations:
      - context: "Marketing"
        how_expressed: "5 levels of market sophistication"
        source: "E5 Method Book (Schwartz-derived)"
        evidence: "Fat burner market evolution example"

      - context: "Communication"
        how_expressed: "Mechanism emphasis in sophisticated markets"
        source: "Multiple interviews"
        evidence: "Shift from claims to mechanisms at Level 4-5"

      - context: "Differentiation"
        how_expressed: "Unique Mechanism becomes key"
        source: "toddbrown.me"
        evidence: "How > What in sophisticated markets"

    framework_form: |
      Level 1: Direct claim ("This works")
      Level 2: Expanded claim ("This works better")
      Level 3: Introduce mechanism ("Here's HOW")
      Level 4: Elaborate mechanism ("Here's WHY this is different")
      Level 5: Identification/story ("For people like you who...")

  - pattern_id: "STRUCT_004"
    name: "Hierarchical Component Architecture"
    abstract_form: "System success depends on hierarchy of components"
    abstraction_level: "Domain"
    cross_domain_validity: true

    concrete_manifestations:
      - context: "Marketing"
        how_expressed: "Idea > Mechanism > Copy hierarchy"
        source: "mined_content.yaml HC_001"
        evidence: "Behavior-advice gap analysis"

      - context: "Campaign Development"
        how_expressed: "Big Idea → Unique Mechanism → SIN Offer → Copy"
        source: "E5 Method Book"
        evidence: "Stage 2 (Engineer) sequence"

      - context: "Value Creation"
        how_expressed: "Strategy > Tactics"
        source: "Multiple sources"
        evidence: "Button colors are noise"

    framework_form: |
      Priority 1: Idea quality (non-negotiable)
      Priority 2: Mechanism clarity (enables belief)
      Priority 3: Offer construction (creates decision)
      Priority 4: Copy execution (articulates above)

  - pattern_id: "STRUCT_005"
    name: "Attribution-Respect Architecture"
    abstract_form: "Honor intellectual lineage; never claim invention of inherited ideas"
    abstraction_level: "Universal"
    cross_domain_validity: true

    concrete_manifestations:
      - context: "Big Idea Concept"
        how_expressed: "Always attributes to Mark Ford"
        source: "Every interview analyzed"
        evidence: "14/14 mentions include attribution"

      - context: "Market Sophistication"
        how_expressed: "Always attributes to Eugene Schwartz"
        source: "Multiple sources"
        evidence: "7/7 mentions include attribution"

      - context: "Teaching"
        how_expressed: "Cites source of each concept"
        source: "interview_patterns.yaml"
        evidence: "Heroes referenced consistently"

    framework_form: |
      1. Acknowledge source of concepts
      2. Use "via" or "learned from" language
      3. Never claim invention of inherited ideas
      4. Add own synthesis/application, not origin

