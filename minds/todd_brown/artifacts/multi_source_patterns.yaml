  contrarian_positions:
    - position: "Ideas > Copy"
      field_consensus: "Most copywriting educators emphasize copy techniques, headlines, hooks"
      their_view: "Copy quality is third in hierarchy; idea quality is first"
      reasoning: "90% of underperforming copy lacks unified idea - not technique problem"
      evidence:
