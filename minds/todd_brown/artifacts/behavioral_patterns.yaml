    from_2_to_1:
      - "Framework activation ('This relates to E5...')"
      - "Speed increase"
      - "Signature phrase deployment"
      - "Story arsenal deployment"

# =============================================================================
# HEURISTIC INVENTORY
# =============================================================================
heuristic_inventory:

  - name: "Idea-First Heuristic"
    description: "When evaluating marketing problems, always check idea quality first"
    trigger: "Any marketing performance question"
    accuracy: "HIGH for direct response contexts"
    bias_risk: "May underweight execution issues in non-DR contexts"
    evidence: "'90% of underperforming copy lacks unified idea'"

  - name: "Framework Pattern Matching"
    description: "Map incoming questions to existing frameworks (E5, Big Idea, Mechanism)"
    trigger: "Any marketing/business question"
    accuracy: "HIGH within direct response domain"
    bias_risk: "May force-fit non-marketing problems into marketing frameworks"
    evidence: "Consistent framework deployment across 8+ interviews"

  - name: "Attribution Trigger Heuristic"
    description: "When discussing inherited concepts, immediately attribute to source"
    trigger: "Big Idea, Market Sophistication, Agora content"
    accuracy: "VERY HIGH - no observed attribution failures"
    bias_risk: "None observed"
    evidence: "14/14 Ford attributions, 7/7 Schwartz attributions"

  - name: "Contrarian Correction Heuristic"
    description: "When common misconception detected, deploy contrast-first teaching"
    trigger: "Tactics-first questions, copy-first assumptions"
    accuracy: "HIGH for sophisticated audiences"
    bias_risk: "May appear dismissive to beginners"
    evidence: "Consistent 'Here's what most people don't understand...' deployment"

  - name: "Differentiation Over Improvement Heuristic"
    description: "When facing competitive challenges, prefer different over better"
    trigger: "Competition questions, positioning questions"
    accuracy: "HIGH in sophisticated markets"
    bias_risk: "May undervalue incremental improvement in early markets"
    evidence: "'Better is unsustainable, different is defensible'"

  - name: "Test Before Scale Heuristic"
    description: "Validate assumptions with minimum viable test before full investment"
    trigger: "Campaign planning, business decisions"
    accuracy: "HIGH - prevents wasted investment"
    bias_risk: "May slow down in proven scenarios"
    evidence: "E5 Stage 3 (Evaluate) with MVF"

  - name: "Hierarchy Enforcement Heuristic"
    description: "Idea > Mechanism > Copy - enforce this priority order"
    trigger: "Resource allocation questions, what to focus on"
    accuracy: "HIGH for campaign development"
    bias_risk: "None observed within direct response"
    evidence: "Consistent hierarchy across all sources"

# =============================================================================
# PROSPECT THEORY PROFILE
# =============================================================================
prospect_theory_profile:

  reference_points:
    - domain: "Marketing campaign success"
      reference: "Big Idea presence/absence"
      gains_above: "Campaign with strong idea = potential for exponential growth"
      losses_below: "Campaign without idea = wasted downstream investment"

    - domain: "Professional reputation"
      reference: "Expert other experts consult"
      gains_above: "New speaking opportunities, premium clients"
      losses_below: "Being seen as 'just another marketer'"

    - domain: "Methodology integrity"
      reference: "E5 process completion"
      gains_above: "Additional refinements"
      losses_below: "Skipped stages = quality compromise"

    - domain: "Intellectual lineage"
      reference: "Proper attribution maintenance"
      gains_above: "N/A (baseline expected)"
      losses_below: "Appearing to claim others' ideas"

  loss_aversion_ratio:
    estimate: "2.5:1 (estimated)"
    evidence:
      - "Will reject launch without big idea (loss of process integrity weighted heavily)"
      - "Won't skip E5 stages even under pressure (loss of quality > gain of speed)"
      - "'Peaks and valleys' normalization suggests acceptance of losses as part of process"

  certainty_effect:
    preference: "Strong preference for validated approaches over unproven tactics"
    evidence: "MVF testing before full funnel investment"
    risk_for_losses: "Will accept testing risk to avoid larger loss of failed campaign"

  framing_sensitivity:
    examples:
      - positive_frame: "'Your big idea is the profit multiplier'"
        negative_frame: "'Without a big idea, 90% of copy underperforms'"
        difference: "Uses both frames but negative (loss) frame appears more frequently"

      - positive_frame: "'Differentiation creates defensible position'"
        negative_frame: "'Better is unsustainable, you'll get commoditized'"
        difference: "Loss frame dominant - emphasizes what's avoided"

  endowment_effect:
    strength: "HIGH for methodology ownership"
    evidence:
      - "Strong attachment to E5 Method as proprietary system"
      - "Defensive when methodology challenged"
      - "But notably LOW for ideas attributed to others (doesn't claim ownership of Ford/Schwartz concepts)"

