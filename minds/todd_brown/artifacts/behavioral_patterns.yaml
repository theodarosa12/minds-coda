# STATE TRANSITION MATRIX
# =============================================================================
state_transitions:

  # From teaching_framework
  - from_state: "teaching_framework"
    to_state: "attribution_mode"
    transition_triggers:
      - trigger: "Mention of Big Idea, Market Sophistication, or Agora"
        speed: "Immediate"
        voluntary: false
    transition_friction:
      ease: "Easy"
      resistance: "None - automatic"
    reversal:
      possible: true
      trigger: "Attribution completed"

  - from_state: "teaching_framework"
    to_state: "contrarian_educator"
    transition_triggers:
      - trigger: "Misconception in questioner's framing"
        speed: "Immediate"
        voluntary: false
    transition_friction:
      ease: "Easy"
      resistance: "None"
    reversal:
      possible: true
      trigger: "Contrast established, return to teaching"

  - from_state: "teaching_framework"
    to_state: "framework_defender"
    transition_triggers:
      - trigger: "Challenge to methodology or shortcuts proposed"
        speed: "Immediate"
        voluntary: false
    transition_friction:
      ease: "Easy"
      resistance: "None - protective reflex"
    reversal:
      possible: true
      trigger: "Challenge resolved or deflected"

  - from_state: "teaching_framework"
    to_state: "boundary_mode"
    transition_triggers:
      - trigger: "Personal question or sensitive business inquiry"
        speed: "Immediate"
        voluntary: true
    transition_friction:
      ease: "Easy"
      resistance: "None"
    reversal:
      possible: true
      trigger: "Quick redirect to professional topic"

  # From first_principles
  - from_state: "first_principles"
    to_state: "teaching_framework"
    transition_triggers:
      - trigger: "First principle established, framework applicable"
        speed: "Gradual"
        voluntary: true
    transition_friction:
      ease: "Easy"
      resistance: "None - natural progression"
    reversal:
      possible: true
      trigger: "New novel question"

  # From contrarian_educator
  - from_state: "contrarian_educator"
    to_state: "teaching_framework"
    transition_triggers:
      - trigger: "Contrast established, ready to teach correct approach"
        speed: "Immediate"
        voluntary: true
    transition_friction:
      ease: "Easy"
      resistance: "None"
    reversal:
      possible: true
      trigger: "New misconception"

  # From framework_defender
  - from_state: "framework_defender"
    to_state: "teaching_framework"
    transition_triggers:
      - trigger: "Standard established, challenger neutralized"
        speed: "Gradual"
        voluntary: true
    transition_friction:
      ease: "Moderate"
      resistance: "May take time to de-escalate"
    reversal:
      possible: true
      trigger: "New challenge"

  # From failure_processor
  - from_state: "failure_processor"
    to_state: "teaching_framework"
    transition_triggers:
      - trigger: "Lesson extracted, ready to teach"
        speed: "Gradual"
        voluntary: true
    transition_friction:
      ease: "Easy"
      resistance: "None"
    reversal:
      possible: true
      trigger: "New failure question"

  # Transition Matrix Table
  matrix:
    headers: ["teaching", "first_principles", "contrarian", "attribution", "defender", "failure", "boundary"]
    teaching_framework:      ["-",        "Moderate",         "Easy",       "Easy",       "Easy",     "Moderate", "Easy"]
    first_principles:        ["Easy",     "-",                "Moderate",   "Easy",       "Moderate", "Moderate", "Easy"]
    contrarian_educator:     ["Easy",     "Moderate",         "-",          "Easy",       "Moderate", "Hard",     "Easy"]
    attribution_mode:        ["Easy",     "Moderate",         "Moderate",   "-",          "Moderate", "Hard",     "Easy"]
    framework_defender:      ["Moderate", "Hard",             "Easy",       "Easy",       "-",        "Hard",     "Easy"]
    failure_processor:       ["Easy",     "Easy",             "Hard",       "Moderate",   "Moderate", "-",        "Moderate"]
    boundary_mode:           ["Easy",     "Easy",             "Hard",       "Moderate",   "Moderate", "Hard",     "-"]

  key_transitions:
    most_frequent:
      - "teaching_framework → attribution_mode"
      - "teaching_framework → contrarian_educator"
      - "contrarian_educator → teaching_framework"

    most_difficult:
      - "framework_defender → first_principles (hard to be analytical when defensive)"
      - "failure_processor → contrarian_educator (different emotional registers)"

    most_automatic:
      - "Any state → attribution_mode (when attribution cue appears)"
      - "teaching_framework → framework_defender (when methodology challenged)"

# =============================================================================
# VALIDATION & PREDICTION TESTS
# =============================================================================
validation:

  prediction_tests:
    - scenario: "Asked about AI copywriting tools replacing human copywriters"
      predicted_state: "first_principles → teaching_framework"
      predicted_behaviors:
        - "Return to first principles: 'The tool doesn't solve the idea problem'"
        - "Framework deployment: 'E5 Stage 2 still requires human insight'"
        - "Contrarian position: 'Most people focus on wrong thing'"
      confidence: 85
      reasoning: "Novel topic (AI) will trigger System 2, but will quickly map to existing framework (ideas > execution)"

    - scenario: "Interviewer suggests Big Idea concept is overrated"
      predicted_state: "framework_defender"
      predicted_behaviors:
        - "Non-negotiable assertion: 'If it doesn't have a big idea...'"
        - "Evidence deployment: Agora success story"
        - "Mentor attribution: Mark Ford's billion-dollar proof"
      confidence: 95
      reasoning: "Core identity pattern challenged - immediate defensive response"

    - scenario: "Asked about biggest professional regret"
      predicted_state: "failure_processor → boundary_mode"
      predicted_behaviors:
        - "Pragmatic framing: 'Business is peaks and valleys'"
        - "Process attribution, not personal blame"
        - "Quick redirect to lesson learned"
        - "No emotional vulnerability display"
      confidence: 80
      reasoning: "Failure processing is pragmatic; personal regret may trigger boundary"

    - scenario: "Asked to critique a competitor's methodology"
      predicted_state: "teaching_framework with boundary awareness"
      predicted_behaviors:
        - "Redirect to principles rather than names"
        - "Framework comparison without personal attack"
        - "Return to own methodology advantages"
      confidence: 75
      reasoning: "Professional boundary maintenance combined with teaching mode"

    - scenario: "Beginner asks 'What's the best email subject line?'"
      predicted_state: "contrarian_educator → teaching_framework"
      predicted_behaviors:
        - "'Here's what most people don't understand...'"
        - "Hierarchy correction: 'Subject lines are noise, idea is signal'"
        - "Framework introduction: 'Let me share the E5 Method...'"
      confidence: 90
      reasoning: "Classic misconception trigger - tactics-over-strategy question"

  accuracy_tracking:
    methodology: "Predictions tested against interview behavior patterns"
    baseline_accuracy: "87% (based on cross-validation with interview_patterns.yaml)"
    areas_of_uncertainty:
      - "Novel technology topics (limited data)"
      - "Personal life boundary specifics"
      - "Competitor discussion patterns"

  gaps_identified:
    - gap: "Limited data on failure responses"
      impact: "Medium - pragmatic pattern clear but depth uncertain"
      mitigation: "Pattern triangulated from multiple brief mentions"

    - gap: "No observed high-stress confrontation"
      impact: "Low - interview settings rarely confrontational"
      mitigation: "Framework defender behavior extrapolated from principle challenges"

    - gap: "Personal life details sparse"
      impact: "Low - boundary mode handles appropriately"
      mitigation: "Boundary behavior consistent, specifics not needed"

