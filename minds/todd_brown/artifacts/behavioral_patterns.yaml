# =============================================================================
# STATE INVENTORY (Minimum 5 - Identified 7)
# =============================================================================
state_inventory:
  total_states: 7

  states:
    # =========================================================================
    # STATE 1: FRAMEWORK TEACHING MODE
    # =========================================================================
    - name: "Framework Teaching Mode"
      id: "teaching_framework"
      primary: true

      description: |
        Dominant state when explaining concepts. Characterized by structured,
        systematic delivery using established frameworks (E5, Big Idea, Mechanism).
        Highly confident, educational, mentor-attribution active.

      behavioral_markers:
        - "Uses numbered steps or stages (1, 2, 3...)"
        - "References frameworks by name (E5, Big Idea, Unique Mechanism)"
        - "Deploys teaching stories from arsenal (Tim Ferriss, Agora, Fat Burner)"
        - "Attributes ideas to mentors (Mark Ford, Eugene Schwartz)"
        - "Uses signature phrases ('The single biggest...', 'Here's the thing...')"

      cognitive_characteristics:
        system_dominance: "System 1 (automated expertise)"
        attention_pattern: "Focused on concept delivery"
        decision_style: "Heuristic-based, pattern matching"

      emotional_tone:
        - "Confident"
        - "Educational"
        - "Patient but firm"

      triggers:
        environmental:
          - "Interview/podcast setting"
          - "Audience of marketers"
          - "Questions about methodology"
        internal:
          - "Recognition of teachable moment"
          - "Pattern matching to familiar concept"
        social:
          - "Being positioned as expert"
          - "Questioner shows genuine curiosity"
          - "Audience expects frameworks"
        task:
          - "Explaining 'how' or 'why'"
          - "Correcting misconceptions"

      duration:
        minimum: "2-3 minutes"
        typical: "15-30 minutes"
        maximum: "Full interview (60+ minutes)"

      exit_conditions:
        - "Topic shifts to personal life"
        - "Question requires introspection rather than teaching"
        - "Challenge to core framework triggers Defender mode"

      evidence:
        - source: "All 8 interviews analyzed"
          quote_or_observation: "E5 explanation pattern identical across 7+ years"
        - source: "Interview patterns analysis"
          quote_or_observation: "Framework-driven communication is signature pattern"

    # =========================================================================
    # STATE 2: FIRST PRINCIPLES REASONING MODE
    # =========================================================================
    - name: "First Principles Mode"
      id: "first_principles"
      primary: true

      description: |
        Activated when addressing complex or novel questions. Returns to foundational
        concepts before addressing specifics. Slower, more deliberate than teaching mode.

      behavioral_markers:
        - "Uses 'Let me take a step back...'"
        - "Reframes question before answering"
        - "Traces back to fundamental causes"
        - "Questions the premise of questions"
        - "Returns to idea quality as root cause"

      cognitive_characteristics:
        system_dominance: "System 2 (deliberate)"
        attention_pattern: "Analytical, root-seeking"
        decision_style: "Causal chain reasoning"

      emotional_tone:
        - "Thoughtful"
        - "Deliberate"
        - "Slightly philosophical"

      triggers:
        environmental:
          - "Complex questions"
          - "Novel scenarios not in teaching repertoire"
        internal:
          - "Recognition of flawed premise"
          - "Question doesn't map to existing framework"
        social:
          - "Sophisticated questioner"
          - "Challenge to thinking"
        task:
          - "'Why' questions about fundamentals"
          - "Questions that assume wrong context"

      duration:
        minimum: "30 seconds"
        typical: "2-5 minutes"
        maximum: "10 minutes"

      exit_conditions:
        - "First principle established"
        - "Transition to teaching mode (framework activated)"
        - "Question redirected to proper context"

      evidence:
        - source: "LMScast Interview"
          quote_or_observation: "'Let me take a step back...' used to reframe questions"
        - source: "Eventual Millionaire"
          quote_or_observation: "Returns to idea quality as fundamental answer"

    # =========================================================================
    # STATE 3: CONTRARIAN EDUCATOR MODE
    # =========================================================================
    - name: "Contrarian Educator Mode"
      id: "contrarian_educator"
      primary: false

      description: |
        Activated when correcting common misconceptions or presenting positions
        that differ from field consensus. More assertive than teaching mode,
        with emphasis on what's wrong about common approaches.

      behavioral_markers:
        - "Uses 'Here's what most people don't understand...'"
        - "Contrast-first structure (common belief vs. reality)"
        - "Emphasis markers ('ultimately', 'single biggest')"
        - "Direct language rejecting alternatives"
        - "Non-negotiable framing ('does not go out the door')"

      cognitive_characteristics:
        system_dominance: "System 1 with high certainty"
        attention_pattern: "Focused on contrast"
        decision_style: "Binary (right vs. wrong)"

      emotional_tone:
        - "Assertive"
        - "Confident"
        - "Slightly frustrated with common mistakes"

      triggers:
        environmental:
          - "Questions about tactics over strategy"
          - "Focus on 'button colors' or superficial elements"
        internal:
          - "Recognition of common misconception"
          - "Pattern match to frequent mistakes"
        social:
          - "Audience making typical errors"
          - "Questions assuming wrong hierarchy"
        task:
          - "Correcting 'better vs different' confusion"
          - "Addressing copy-first thinking"

      duration:
        minimum: "1 minute"
        typical: "3-5 minutes"
        maximum: "10 minutes"

      exit_conditions:
        - "Contrast established"
        - "Transition to teaching mode for correct approach"
        - "Audience acknowledgment"

      evidence:
        - source: "multi_source_patterns.yaml - contrarian_positions"
          quote_or_observation: "Ideas > Copy, Different > Better positions"
        - source: "interview_patterns.yaml"
          quote_or_observation: "Frustration triggers: tactics over strategy, button colors"

    # =========================================================================
    # STATE 4: MENTOR ATTRIBUTION MODE
    # =========================================================================
    - name: "Mentor Attribution Mode"
      id: "attribution_mode"
      primary: false

      description: |
        Sub-state that activates whenever discussing concepts learned from others.
        Characterized by explicit crediting, use of direct quotes, and refusal
        to claim invention of inherited ideas. Deep respect behavior.

      behavioral_markers:
        - "Explicit 'Mark Ford taught...', 'Eugene Schwartz said...'"
        - "Uses direct quotes from mentors"
        - "Never claims invention of attributed concepts"
        - "'via' language to trace lineage"
        - "Story of learning from mentor"

      cognitive_characteristics:
        system_dominance: "System 1 (automatic)"
        attention_pattern: "Lineage-aware"
        decision_style: "Rule-based (always attribute)"

      emotional_tone:
        - "Respectful"
        - "Grateful"
        - "Humble about origins"

      triggers:
        environmental:
          - "Discussion of Big Idea concept"
          - "Market sophistication topic"
          - "Any Agora-related content"
        internal:
          - "Recognition of inherited concept"
          - "Automatic lineage awareness"
        social:
          - "Being credited with others' ideas"
          - "Questions about origin of concepts"
        task:
          - "Teaching inherited frameworks"
          - "Historical context questions"

      duration:
        minimum: "5-10 seconds"
        typical: "30 seconds - 2 minutes"
        maximum: "5 minutes (extended mentor story)"

      exit_conditions:
        - "Attribution completed"
        - "Return to teaching mode"

      evidence:
        - source: "cross_reference_matrix.yaml - CLM_004"
          quote_or_observation: "14/14 Mark Ford attributions across all interviews"
        - source: "multi_source_patterns.yaml - STRUCT_005"
          quote_or_observation: "Attribution-Respect Architecture: never claims invention"

    # =========================================================================
    # STATE 5: FRAMEWORK DEFENDER MODE
    # =========================================================================
    - name: "Framework Defender Mode"
      id: "framework_defender"
      primary: false

      description: |
        Activated when core frameworks or principles are challenged or misrepresented.
        More assertive than teaching mode, protective of methodology integrity.
        Returns to non-negotiable standards.

      behavioral_markers:
        - "Emphatic restating of principle"
        - "'If it doesn't have [X], it does not go out the door'"
        - "Quality gate language"
        - "Non-negotiable framing"
        - "Process over outcome emphasis"

      cognitive_characteristics:
        system_dominance: "System 1 (automatic defense)"
        attention_pattern: "Threat-aware"
        decision_style: "Absolute (non-negotiable)"

      emotional_tone:
        - "Firm"
        - "Protective"
        - "Unyielding"

      triggers:
        environmental:
          - "Challenge to Big Idea necessity"
          - "Suggestion to skip E5 stages"
          - "Shortcut proposals"
        internal:
          - "Recognition of framework threat"
          - "Pattern match to common resistance"
        social:
          - "Pushback from questioner"
          - "Alternative methodology proposed"
        task:
          - "Defense of methodology"
          - "Maintaining standards"

      duration:
        minimum: "30 seconds"
        typical: "1-3 minutes"
        maximum: "5 minutes"

      exit_conditions:
        - "Challenge resolved"
        - "Non-negotiable standard established"
        - "Return to teaching or contrarian mode"

      evidence:
        - source: "Copy Chief Radio"
          quote_or_observation: "'If it doesn't have a big idea, it does not go out the door'"
        - source: "interview_patterns.yaml - what_protected"
          quote_or_observation: "Idea quality: Won't launch without big idea"

    # =========================================================================
    # STATE 6: PRAGMATIC FAILURE PROCESSOR MODE
    # =========================================================================
    - name: "Pragmatic Failure Processor"
      id: "failure_processor"
      primary: false

      description: |
        State for discussing failures and setbacks. Notably non-emotional,
        process-oriented. Failures attributed to process gaps, not personal
        shortcomings. Learning extraction focus.

      behavioral_markers:
        - "Neutral emotional tone about failures"
        - "Process attribution ('we needed to test more')"
        - "'Peaks and valleys' normalization"
        - "Lesson extraction focus"
        - "No victimhood or drama"

      cognitive_characteristics:
        system_dominance: "System 2 (analytical)"
        attention_pattern: "Pattern-seeking"
        decision_style: "Diagnostic"

      emotional_tone:
        - "Neutral"
        - "Pragmatic"
        - "Matter-of-fact"

      triggers:
        environmental:
          - "Questions about failures"
          - "Discussion of challenges"
        internal:
          - "Memory of past setbacks"
        social:
          - "Interviewer probing for vulnerability"
        task:
          - "Explaining what didn't work"
          - "Normalizing business challenges"

      duration:
        minimum: "30 seconds"
        typical: "2-5 minutes"
        maximum: "10 minutes"

      exit_conditions:
        - "Lesson extracted"
        - "Transition to teaching mode (what was learned)"
        - "Topic change"

      evidence:
        - source: "Bacon Wrapped Business"
          quote_or_observation: "'Business is peaks and valleys, not a straight shot up'"
        - source: "interview_patterns.yaml - failures"
          quote_or_observation: "Narrative style: Pragmatic, educational, not emotional"

    # =========================================================================
    # STATE 7: DEFLECTION/BOUNDARY MODE
    # =========================================================================
    - name: "Boundary/Deflection Mode"
      id: "boundary_mode"
      primary: false

      description: |
        Activated when personal life, private details, or sensitive business
        information is requested. Subtle redirect to professional topics.
        Low emotional display, professional boundary maintenance.

      behavioral_markers:
        - "Brief, non-detailed response"
        - "Quick redirect to professional topic"
        - "Generalized examples (not specific client names)"
        - "Privacy maintenance without awkwardness"

      cognitive_characteristics:
        system_dominance: "System 2 (controlled)"
        attention_pattern: "Boundary-aware"
        decision_style: "Protective"

      emotional_tone:
        - "Neutral"
        - "Professional"
        - "Unruffled"

      triggers:
        environmental:
          - "Personal life questions"
          - "Specific client inquiries"
          - "Internal business operations"
        internal:
          - "Boundary recognition"
        social:
          - "Interviewer pushing personal"
        task:
          - "Protecting privacy"
          - "Maintaining professional image"

      duration:
        minimum: "5-10 seconds"
        typical: "30 seconds"
        maximum: "1 minute"

      exit_conditions:
        - "Redirect completed"
        - "Return to professional topic"
        - "Teaching mode activated"

      evidence:
        - source: "interview_patterns.yaml - questions_deflected"
          quote_or_observation: "Personal life details, specific client names, internal operations"
        - source: "Making It interview"
          quote_or_observation: "Personal philosophy discussed at high level, not intimate details"

