    - context: "Personal philosophy questions"
      deliberation_triggers: "Introspection required"
      time_requirement: "5-15 seconds pause"
      cognitive_load: "Low-moderate"

    - context: "First principles analysis"
      deliberation_triggers: "Flawed premise in question"
