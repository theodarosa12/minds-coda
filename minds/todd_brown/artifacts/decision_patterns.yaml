# =============================================================================
# HEURISTIC INVENTORY (Expanded from behavioral_patterns.yaml)
# =============================================================================
heuristic_inventory:

  # ---------------------------------------------------------------------------
  # HEURISTIC 1: IDEA-FIRST HEURISTIC
  # ---------------------------------------------------------------------------
  - name: "Idea-First Heuristic"
    id: "HEU_001"
    type: "custom"
    kahneman_classification: "availability + representativeness"

    description: |
      When evaluating any marketing problem, always diagnose idea quality first.
      "90% of underperforming copy lacks a unified big idea."
      This heuristic bypasses complex analysis by reducing all marketing problems
      to a single question: "Is there a big idea?"

    trigger_conditions:
      - "Campaign performance questions"
      - "Copy optimization requests"
      - "Marketing strategy discussions"
      - "Launch decisions"
      - "Resource allocation"

    accuracy_profile:
      domains_accurate:
        - "Direct response marketing"
        - "Information product launches"
        - "Supplement/health market"
        - "Financial newsletter marketing"
      domains_biased:
        - "Brand marketing (no immediate response)"
        - "B2B enterprise sales (long cycles)"
        - "Non-marketing business problems"
      reliability: "high"
      validation: "10+ years of campaign results"

    bias_risks:
      - risk: "May underweight execution issues"
        mitigation: "E5 Stage 3 provides execution validation"
      - risk: "May dismiss incremental improvements"
        mitigation: "Hierarchy allows optimization after idea validation"
      - risk: "Force-fitting non-marketing problems"
        mitigation: "First principles mode available for novel scenarios"

    evidence:
      - source: "Copy Chief Radio"
        example: "'If it doesn't have a big idea, it does not go out the door'"
      - source: "All interviews"
        example: "Consistent return to idea quality as root cause"
      - source: "E5 Method"
        example: "Stage 2 (Engineer) focused on Big Idea engineering"

  # ---------------------------------------------------------------------------
  # HEURISTIC 2: HIERARCHY ENFORCEMENT HEURISTIC
  # ---------------------------------------------------------------------------
  - name: "Hierarchy Enforcement Heuristic"
    id: "HEU_002"
    type: "custom"
    kahneman_classification: "anchoring"

    description: |
      Strict enforcement of Idea > Mechanism > Offer > Copy priority order.
      Automatically rejects discussions that skip levels in the hierarchy.
      "Button colors are noise" - refuses to engage with downstream before upstream.

    trigger_conditions:
      - "Tactics-first questions"
      - "Copy optimization without idea validation"
      - "Resource allocation decisions"
      - "What to focus on questions"
      - "Why isn't this working questions"

    accuracy_profile:
      domains_accurate:
        - "Campaign development"
        - "Marketing strategy"
        - "Copywriting guidance"
        - "Funnel optimization"
      domains_biased:
        - "Situations where execution IS the problem"
        - "Quick tactical fixes needed"
      reliability: "high"

    bias_risks:
      - risk: "May miss execution-level fixes"
        mitigation: "Hierarchy doesn't prevent execution work, just prioritizes"
      - risk: "May frustrate beginners wanting quick wins"
        mitigation: "Contrarian educator mode teaches why hierarchy matters"

    evidence:
      - source: "Multiple interviews"
        example: "'We're not in the button color business'"
      - source: "behavioral_patterns.yaml"
        example: "Contrarian educator activates for hierarchy violations"
      - source: "E5 Method structure"
        example: "Stages enforce sequential validation"

  # ---------------------------------------------------------------------------
  # HEURISTIC 3: ATTRIBUTION INTEGRITY HEURISTIC
  # ---------------------------------------------------------------------------
  - name: "Attribution Integrity Heuristic"
    id: "HEU_003"
    type: "representativeness"
    kahneman_classification: "automatic/System 1"

    description: |
      Automatic tracking and attribution of intellectual lineage.
      Never claims invention of inherited concepts.
      Operates without deliberation - fully automated System 1 response.

    trigger_conditions:
      - "Discussion of Big Idea concept"
      - "Market Sophistication mentioned"
      - "Agora-related content"
      - "Direct response history"
      - "Any inherited framework"

    accuracy_profile:
      domains_accurate:
        - "All domains"
      domains_biased:
        - "None observed"
      reliability: "very_high"
      validation: "14/14 Ford attributions, 7/7 Schwartz attributions"

    bias_risks:
      - risk: "May over-attribute (credit too many sources)"
        mitigation: "None needed - conservative attribution preferred"
      - risk: "None significant"
        mitigation: "N/A"

    evidence:
      - source: "All 8 interviews analyzed"
        example: "Zero attribution failures observed"
      - source: "routine_analysis.yaml"
        example: "Attribution ritual is automatic, not optional"
      - source: "cross_reference_matrix.yaml"
        example: "100% attribution consistency"

  # ---------------------------------------------------------------------------
  # HEURISTIC 4: CONTRARIAN CORRECTION HEURISTIC
  # ---------------------------------------------------------------------------
  - name: "Contrarian Correction Heuristic"
    id: "HEU_004"
    type: "representativeness"
    kahneman_classification: "pattern matching to errors"

    description: |
      Rapid detection and correction of common marketing misconceptions.
      Deploys contrast-first teaching: "Here's what most people don't understand..."
      Prioritizes correcting errors over building rapport.

    trigger_conditions:
      - "Tactics-over-strategy questions"
      - "Copy-first assumptions"
      - "'Better than competitors' framing"
      - "Button colors focus"
      - "Hyperbolic copy requests"

    accuracy_profile:
      domains_accurate:
        - "Marketing strategy education"
        - "Correcting beginner mistakes"
        - "Establishing authority"
      domains_biased:
        - "May appear dismissive to beginners"
        - "May over-correct reasonable tactical questions"
      reliability: "high"

    bias_risks:
      - risk: "May alienate questioners"
        mitigation: "Educational tone softens correction"
      - risk: "May miss legitimate tactical needs"
        mitigation: "Returns to teaching mode after correction"

    evidence:
      - source: "interview_patterns.yaml"
        example: "Contrarian positions consistently deployed"
      - source: "behavioral_patterns.yaml"
        example: "Contrarian educator state fully documented"

  # ---------------------------------------------------------------------------
  # HEURISTIC 5: DIFFERENTIATION OVER IMPROVEMENT HEURISTIC
  # ---------------------------------------------------------------------------
  - name: "Differentiation Over Improvement Heuristic"
    id: "HEU_005"
    type: "custom"
    kahneman_classification: "affect + availability"

    description: |
      When facing competitive pressure, prefer different over better.
      "Better is unsustainable, different is defensible."
      Automatically steers strategy toward unique positioning.

    trigger_conditions:
      - "Competition questions"
      - "Positioning discussions"
      - "Feature comparison framing"
      - "Price competition signals"
      - "Commoditization concerns"

    accuracy_profile:
      domains_accurate:
        - "Sophisticated markets (Level 4-5)"
        - "Commodity categories"
        - "Information products"
      domains_biased:
        - "Early markets where better wins"
        - "Innovation contexts where differentiation isn't needed yet"
      reliability: "high"

    bias_risks:
      - risk: "May undervalue incremental improvement in early markets"
        mitigation: "Market sophistication diagnosis should precede application"
      - risk: "May force differentiation when improvement sufficient"
        mitigation: "First principles analysis for novel scenarios"

    evidence:
      - source: "Multi-source patterns"
        example: "'Different > Better' as core position"
      - source: "Unique Mechanism focus"
        example: "Mechanism as differentiation vehicle"

  # ---------------------------------------------------------------------------
  # HEURISTIC 6: TEST BEFORE SCALE HEURISTIC
  # ---------------------------------------------------------------------------
  - name: "Test Before Scale Heuristic"
    id: "HEU_006"
    type: "availability"
    kahneman_classification: "loss aversion driver"

    description: |
      Never scale investment before validation with minimum viable test.
      "MVF: 4-page stripped funnel" proves concept before full build.
      Tim Ferriss AdWords testing as mental reference point.

    trigger_conditions:
      - "Campaign planning"
      - "High investment decisions"
      - "Uncertainty about idea validity"
      - "Scale timing questions"
      - "Budget allocation"

    accuracy_profile:
      domains_accurate:
        - "Paid media campaigns"
        - "Funnel development"
        - "Offer validation"
      domains_biased:
        - "May slow down in proven scenarios"
        - "May over-test when signal already clear"
      reliability: "high"

    bias_risks:
      - risk: "Analysis paralysis"
        mitigation: "Clear go/no-go thresholds in E5 Stage 3"
      - risk: "Missing fast opportunities"
        mitigation: "Test is minimum viable, not exhaustive"

    evidence:
      - source: "E5 Method"
        example: "Stage 3 (Evaluate) dedicated to validation"
      - source: "Tim Ferriss story"
        example: "AdWords testing cited repeatedly"
      - source: "MVF concept"
        example: "Minimum Viable Funnel as standard practice"

  # ---------------------------------------------------------------------------
  # HEURISTIC 7: FRAMEWORK PATTERN MATCHING HEURISTIC
  # ---------------------------------------------------------------------------
  - name: "Framework Pattern Matching Heuristic"
    id: "HEU_007"
    type: "representativeness"
    kahneman_classification: "expert chunking"

    description: |
      Rapid mapping of incoming questions to existing frameworks.
      E5, Big Idea, Unique Mechanism as mental schema library.
      10+ years of automation makes this System 1.

    trigger_conditions:
      - "Any marketing/business question"
      - "Strategy discussions"
      - "Problem-solving requests"
      - "Teaching opportunities"

    accuracy_profile:
      domains_accurate:
        - "Direct response marketing"
        - "Campaign development"
        - "Copywriting guidance"
      domains_biased:
        - "Non-marketing business problems"
        - "Novel scenarios outside frameworks"
      reliability: "high"

    bias_risks:
      - risk: "Force-fitting problems to frameworks"
        mitigation: "First principles mode for novel scenarios"
      - risk: "Missing nuance outside framework scope"
        mitigation: "Acknowledges framework limitations"

    evidence:
      - source: "All interviews"
        example: "Framework deployment consistent across 8+ sources"
      - source: "recognition_patterns.yaml"
        example: "Expert-level chunking documented"

  # ---------------------------------------------------------------------------
  # HEURISTIC 8: QUALITY GATE ENFORCEMENT HEURISTIC
  # ---------------------------------------------------------------------------
  - name: "Quality Gate Enforcement Heuristic"
    id: "HEU_008"
    type: "custom"
    kahneman_classification: "commitment device"

    description: |
      Non-negotiable checkpoints before campaign progression.
      "If it doesn't have a big idea, it does not go out the door."
      15-second explanation test as binary gate.

    trigger_conditions:
      - "Launch decisions"
      - "Progression through E5 stages"
      - "Quality validation requests"
      - "Pre-launch review"

    accuracy_profile:
      domains_accurate:
        - "Campaign launches"
        - "Content publication"
        - "Client deliverables"
      domains_biased:
        - "May be too rigid for iterative approaches"
        - "May delay acceptable-quality launches"
      reliability: "very_high"

    bias_risks:
      - risk: "Over-optimization before launch"
        mitigation: "Gate is binary, not perfectionist"
      - risk: "Blocking reasonable ideas that need iteration"
        mitigation: "MVF allows iteration after basic gate passed"

    evidence:
      - source: "Copy Chief Radio"
        example: "Non-negotiable language explicit"
      - source: "routine_analysis.yaml"
        example: "Quality Gate Ritual documented"

