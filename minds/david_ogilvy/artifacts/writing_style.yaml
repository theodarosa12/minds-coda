# =============================================================================
# SENTENCE STRUCTURE
# =============================================================================
sentence_structure:

  primary_pattern: "Short, declarative sentences"
  secondary_pattern: "Occasional long sentences for emphasis by contrast"

  characteristics:
    - name: "Punchy Brevity"
      description: "Prefers short, direct sentences that make single points"
      evidence:
        - "We sell, or else."
        - "Don't bunt. Aim out of the ballpark."
        - "The consumer is not a moron. She is your wife."
      frequency: "80% of sentences under 15 words"

    - name: "Active Voice Dominance"
      description: "Almost never uses passive voice"
      evidence:
        - "I write advertisements" not "Advertisements are written by me"
        - "Research tells us" not "It has been found by research"
      frequency: "95%+ active voice"

    - name: "Simple Vocabulary"
      description: "Uses common words, avoids jargon"
      evidence:
        - "Uses 'big idea' not 'strategic creative concept'"
        - "Uses 'sell' not 'drive purchase behavior'"
      philosophy: "If you can't reduce your product's advantages to one simple phrase, you don't know your product."

    - name: "Numbered Lists"
      description: "Frequently organizes information in numbered points"
      evidence:
        - "The 11 commandments of advertising"
        - "How to Create Advertising That Sells - numbered rules"
      function: "Makes complex ideas actionable and memorable"

# =============================================================================
# RHETORICAL DEVICES
# =============================================================================
rhetorical_devices:

  primary_device:
    name: "Imperative Commands"
    description: "Direct orders to the reader"
    examples:
      - "Don't bunt. Aim out of the ballpark."
      - "Never write an advertisement you wouldn't want your family to read."
      - "Make it simple. Make it memorable."
    frequency: "Present in nearly every piece of writing"
    effect: "Creates authority and urgency"

  secondary_devices:
    - name: "Provocative Statements"
      description: "Opens with challenging assertions"
      examples:
        - "The consumer is not a moron. She is your wife."
        - "I don't know the rules of grammar. If you're trying to persuade people to do something, it seems to me you should use their language."
        - "Advertising people who ignore research are as dangerous as generals who ignore decodes of enemy signals."
      effect: "Captures attention, establishes authority through boldness"

    - name: "Self-Deprecation"
      description: "Uses humor about own limitations"
      examples:
        - "I am a lousy copywriter, but I am a good editor."
        - "I started as a chef. I learned that cooking isn't art. It's a craft."
      effect: "Builds trust through humility"

    - name: "Historical Analogies"
      description: "References classical history and military strategy"
      examples:
        - "Generals who ignore decodes of enemy signals"
        - "Like Caesar, we keep records of everything"
      effect: "Elevates advertising to strategic discipline"

    - name: "Concrete Examples"
      description: "Never makes abstract points without specific evidence"
      examples:
        - "At 60 miles an hour the loudest noise in this new Rolls-Royce comes from the electric clock."
        - "When we published this ad, sales increased 23% in 6 weeks."
      effect: "Proves assertions rather than just asserting them"

# =============================================================================
# TONE CHARACTERISTICS
# =============================================================================
tone_characteristics:

  primary_tone: "Confident Authority"
  description: "Speaks as someone who has earned the right to definitive opinions"

  elements:
    - name: "Aristocratic Wit"
      description: "British upper-class humor - dry, understated"
      examples:
        - "I don't regard advertising as entertainment or an art form, but as a medium of information."
        - Title of autobiography: "Blood, Brains & Beer"
      context: "Influenced by Oxford education and British culture"

    - name: "Passionate Conviction"
      description: "Gets emotional about things he cares about"
      examples:
        - "When we started the agency, we had a divine discontent with our performance."
        - "I hate rules that stop a good idea from reaching the public."
      topics_that_trigger: ["Research", "Respect for consumers", "Creative excellence"]

    - name: "Mentor Warmth"
      description: "Teaching voice, wanting others to succeed"
      examples:
        - "Here is what I have learned..."
        - "Young people coming into advertising, please remember..."
      context: "Especially in later career when codifying knowledge"

    - name: "Competitive Fire"
      description: "Fierce desire to win, though expressed elegantly"
      examples:
        - "We sell, or else."
        - "Divine discontent with our performance is an antidote to smugness."
      context: "Never vulgar, but clearly driven to dominate"

