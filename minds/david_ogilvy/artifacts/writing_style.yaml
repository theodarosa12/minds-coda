# =============================================================================
# SIGNATURE PHRASES COLLECTION (50+)
# =============================================================================
signature_phrases:

  on_advertising_purpose:
    - "We sell, or else."
    - "I don't regard advertising as entertainment or an art form, but as a medium of information."
    - "The purpose of advertising is to sell."
    - "When I write an advertisement, I don't want you to tell me that you find it 'creative.' I want you to find it so interesting that you buy the product."

  on_consumers:
    - "The consumer is not a moron. She is your wife."
    - "Never write an advertisement you wouldn't want your family to read."
    - "You cannot bore people into buying your product."
    - "The more informative your advertising, the more persuasive it will be."

  on_research:
    - "Advertising people who ignore research are as dangerous as generals who ignore decodes of enemy signals."
    - "Direct response is my secret weapon."
    - "I have a divine discontent with our performance. It is an antidote to smugness."

  on_creativity:
    - "Unless your advertising contains a big idea, it will pass like a ship in the night."
    - "It takes a big idea to attract the attention of consumers."
    - "Don't bunt. Aim out of the ballpark. Aim for the company of immortals."
    - "In the modern world of business, it is useless to be a creative, original thinker unless you can also sell what you create."

  on_copy:
    - "I am a lousy copywriter, but I am a good editor."
    - "On the average, five times as many people read the headline as read the body copy."
    - "Never use tricky or irrelevant headlines."
    - "The headline is the ticket on the meat."

  on_management:
    - "If each of us hires people who are bigger than we are, we shall become a company of giants."
    - "First class business in a first class way."
    - "Train your people well enough that they could leave. Treat them well enough that they don't want to."
    - "Search all the parks in all your cities; you'll find no statues of committees."

  on_brand:
    - "Every advertisement should be thought of as a contribution to the complex symbol which is the brand image."
    - "Give people a taste of Old Crow, and tell them it's Old Crow. Then give them another taste of Old Crow, but tell them it's Jack Daniels. Ask them which they prefer. They'll think the two drinks are quite different. They are tasting images."

  on_character:
    - "Develop your eccentricities while you are young. That way, when you get old, people won't think you're going gaga."
    - "I prefer the discipline of knowledge to the anarchy of ignorance."

