# =============================================================================
# ARGUMENTATION STYLE
# =============================================================================
argumentation_style:

  primary_method: "Evidence-Based Assertion"
  description: "Makes bold claims, then proves them with data"

  structure:
    - step: "1. Bold assertion"
      example: "Long copy sells more than short copy."
    - step: "2. Evidence"
      example: "In 26 tests, long copy outperformed short in 24."
    - step: "3. Source credibility"
      example: "I learned this from Claude Hopkins, who invented split-run testing."
    - step: "4. Practical application"
      example: "So when you write your next advertisement, don't be afraid of copy length."

  characteristics:
    - name: "Data Over Opinion"
      description: "Cites specific numbers and test results"
      examples:
        - "Increased sales by 23%"
        - "In 26 out of 30 tests..."
      philosophy: "Direct response is my secret weapon - it tells me what works."

    - name: "Authority References"
      description: "Cites masters of advertising"
      key_references:
        - "Claude Hopkins"
        - "John Caples"
        - "Rosser Reeves"
        - "George Gallup"
      effect: "Positions self in lineage of proven practitioners"

    - name: "Contrarian Positioning"
      description: "Often argues against industry consensus"
      examples:
        - Against: "Nobody reads long copy"
        - Against: "Image advertising doesn't sell"
        - Against: "Creativity is more important than strategy"
      effect: "Establishes unique authority"

