prospect_theory_profile:

  reference_points:
    - domain: "Campaign Effectiveness"
      reference: "Direct response measurability"
      gains_above: "Any measurable improvement in sales/response"
      losses_below: "Campaigns that don't sell"

    - domain: "Professional Reputation"
      reference: "World-class advertising standard"
      gains_above: "Industry recognition, award-winning work"
      losses_below: "Mediocre work, client failures"

    - domain: "Agency Culture"
      reference: "Company of giants"
      gains_above: "Exceptional hires, talent development"
      losses_below: "Hiring dull, pedestrian hacks"

    - domain: "Creative Standards"
      reference: "Hopkins/proven principles"
      gains_above: "Work that proves principles right"
      losses_below: "Work that violates proven principles"

  loss_aversion:
    ratio: 3.0  # Losses hurt 3x more than equivalent gains
    evidence:
      - "Obsessive quality control to prevent failures"
      - "Willingness to reject clients to avoid bad work"
      - "Divine discontent - never satisfied"
      - "Protected morning hours to prevent creative loss"

  certainty_effect:
    preference: "Strongly prefers certain outcomes over risky gambles"
    evidence:
      - "Research-driven approach reduces uncertainty"
      - "Testing before scaling campaigns"
      - "Proven principles over untested theories"

  framing_sensitivity:
    more_motivated_by: "Loss framing"
    example_positive: "'This campaign could increase sales 20%'"
    example_negative: "'Without this campaign, we'll lose market share'"
    response_difference: "More motivated by loss framing"

