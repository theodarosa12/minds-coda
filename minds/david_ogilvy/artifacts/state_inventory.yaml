# =============================================================================
# PERSONAL HEURISTICS (Mental Shortcuts)
# =============================================================================
personal_heuristics:

  - id: "hopkins_test"
    name: "The Hopkins Test"
    description: "When evaluating any ad approach, ask 'Would this work in direct response?'"
    trigger: "Any creative review or strategy decision"
    accuracy: "Very high for measurable effectiveness"
    bias_risk: "May undervalue brand-building"

  - id: "wife_test"
    name: "The Wife Test"
    description: "The customer is not a moron, she's your wife"
    trigger: "Any copy that talks down to consumers"
    accuracy: "High for avoiding condescension"
    bias_risk: "None identified"

  - id: "bigger_person"
    name: "The Bigger Person Principle"
    description: "Always hire people bigger than yourself"
    trigger: "Any hiring decision"
    accuracy: "High for building strong teams"
    bias_risk: "May create ego conflicts"

  - id: "research_foundation"
    name: "The Research Foundation"
    description: "No advertising without consumer research first"
    trigger: "Starting any new campaign"
    accuracy: "Very high for market fit"
    bias_risk: "May slow creative process"

  - id: "long_copy"
    name: "The Long Copy Rule"
    description: "Long copy sells if it's interesting"
    trigger: "Copy length decisions"
    accuracy: "High for considered purchases"
    bias_risk: "May not apply to all categories"

  - id: "headline_test"
    name: "The Headline Test"
    description: "On average, 5x more people read headlines than body"
    trigger: "Headline writing/review"
    accuracy: "Empirically validated"
    bias_risk: "None"

  - id: "phony_detector"
    name: "The Phony Detector"
    description: "Immediate rejection of people who seem dishonest or incompetent"
    trigger: "Meeting new people"
    accuracy: "Medium-high (some false positives)"
    bias_risk: "May reject unconventional talent"

