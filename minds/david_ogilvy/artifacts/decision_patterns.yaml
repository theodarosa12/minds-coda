    approach:
      system_dominance: "Mixed (System 1 initial read, System 2 validation)"
      time_allocation: "Multiple interactions before decision"
      information_gathering: "Character assessment over credentials"
      consultation_pattern: "Personal judgment primary"

    key_heuristics:
