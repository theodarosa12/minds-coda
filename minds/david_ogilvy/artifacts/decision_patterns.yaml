# =============================================================================
# CORE PHILOSOPHY
# =============================================================================
core_philosophy:
  principle: "Decisions reveal values better than declarations."
  kahneman_insight: "The quality of a decision is not determined by the outcome."
  ogilvy_insight: "Facts are better than intuition. Research before you leap."
  critical_distinction:
    wrong: "He made good decisions because he's smart (trait-based)"
    correct: "He structured his environment to make good decisions easier (architecture-based)"

# =============================================================================
# HEURISTIC INVENTORY (10 Personal Decision Rules)
# =============================================================================
heuristic_inventory:

  # HEURISTIC 1: The Hopkins Test
  - id: "hopkins_test"
    name: "The Hopkins Test"
    type: "custom"

    description: |
      When evaluating any advertising approach, ask: "Would this work in direct
      response?" If the answer is no, the approach is likely wrong. Direct response
      is the ultimate accountability mechanism - it either sells or it doesn't.

    trigger_conditions:
      - "Reviewing creative work"
      - "Evaluating campaign strategy"
      - "Deciding between creative approaches"
      - "Justifying budget allocation"

    accuracy_profile:
      domains_accurate:
        - "Print advertising"
        - "Direct mail campaigns"
        - "Sales-focused copy"
        - "Measurable campaigns"
      domains_biased:
        - "Pure brand advertising"
        - "Awareness campaigns"
        - "Long-term positioning"
      reliability: "very_high"

    bias_risks:
      - risk: "May undervalue brand-building without immediate response"
        mitigation: "Recognize that some campaigns build cumulative value"
      - risk: "Short-term focus over long-term brand equity"
        mitigation: "Consider 'contribution to brand image' as secondary metric"

    evidence:
      - source: "We Sell or Else (speech)"
        example: "Direct response is my 'secret weapon' - if it doesn't sell, it isn't creative"
      - source: "Confessions"
        example: "Every ad must contribute to the complex symbol which is the brand image"

  # HEURISTIC 2: The Wife Test
  - id: "wife_test"
    name: "The Wife Test"
    type: "affect"

    description: |
      The consumer is not a moron, she is your wife. Never write advertising that
      you would be ashamed to show your family. This heuristic prevents condescension,
      manipulation, and disrespect for consumer intelligence.

    trigger_conditions:
      - "Writing copy"
      - "Reviewing ads for tone"
      - "Detecting condescension"
      - "Evaluating message clarity"

    accuracy_profile:
      domains_accurate:
        - "Consumer messaging"
        - "Tone and voice decisions"
        - "Respect for audience"
      domains_biased: []
      reliability: "very_high"

    bias_risks:
      - risk: "None identified"
        mitigation: "N/A"

    evidence:
      - source: "Confessions of an Advertising Man"
        example: "The consumer is not a moron. She is your wife."
      - source: "Ogilvy on Advertising"
        example: "Don't patronize the public. They know more than you think."

  # HEURISTIC 3: The Research Foundation
  - id: "research_foundation"
    name: "The Research Foundation"
    type: "anchoring"

    description: |
      Never begin creative work without consumer research. Data is the anchor
      from which all creative decisions should adjust. Advertising without research
      is like generals ignoring decoded enemy signals.

    trigger_conditions:
      - "Starting any new campaign"
      - "Entering unfamiliar market"
      - "Client makes unverified claims"
      - "Creative direction is unclear"

    accuracy_profile:
      domains_accurate:
        - "Campaign strategy"
        - "Positioning decisions"
        - "Message development"
        - "Target audience definition"
      domains_biased:
        - "Very fast turnaround projects"
        - "Highly creative/artistic work"
      reliability: "very_high"

    bias_risks:
      - risk: "May slow creative process"
        mitigation: "Build research into timeline from start"
      - risk: "Over-reliance on existing data"
        mitigation: "Commission fresh research for novel situations"

    evidence:
      - source: "Gallup Training"
        example: "400+ surveys conducted, scientific methodology internalized"
      - source: "Confessions"
        example: "Advertising people who ignore research are as dangerous as generals who ignore decodes of enemy signals"

  # HEURISTIC 4: The Bigger Person Principle
  - id: "bigger_person"
    name: "The Bigger Person Principle"
    type: "custom"

    description: |
      Always hire people you consider bigger than yourself. If each person hires
      people smaller, the company becomes a company of dwarfs. If each person hires
      bigger, it becomes a company of giants.

    trigger_conditions:
      - "Hiring decisions"
      - "Promotion decisions"
      - "Team composition"
      - "Succession planning"

    accuracy_profile:
      domains_accurate:
        - "Building strong teams"
        - "Long-term organizational health"
        - "Talent development"
      domains_biased:
        - "Very junior roles"
        - "Highly specialized technical roles"
      reliability: "high"

    bias_risks:
      - risk: "May create ego conflicts if not managed"
        mitigation: "Culture of mutual respect and shared mission"
      - risk: "Intimidation for insecure managers"
        mitigation: "Model from the top; Ogilvy did this personally"

    evidence:
      - source: "Principles of Management"
        example: "If each of us hires people smaller than we are, we shall become a company of dwarfs"
      - source: "Russian Dolls ritual"
        example: "Gave nesting dolls to new directors as physical reminder"

  # HEURISTIC 5: The Headline Test
  - id: "headline_test"
    name: "The Headline Test"
    type: "availability"

    description: |
      On average, five times as many people read the headline as read the body copy.
      Therefore, invest disproportionate effort in headlines. A poor headline wastes
      80% of the advertising budget.

    trigger_conditions:
      - "Writing headlines"
      - "Reviewing ad layouts"
      - "Allocating creative time"
      - "Prioritizing revision effort"

    accuracy_profile:
      domains_accurate:
        - "Print advertising"
        - "Digital ads"
        - "Email subject lines"
        - "Any attention-competitive context"
      domains_biased: []
      reliability: "very_high"

    bias_risks:
      - risk: "Neglecting body copy quality"
        mitigation: "High standards apply to both, but priority to headline"

    evidence:
      - source: "Ogilvy on Advertising"
        example: "Five times as many people read the headline as read the body copy"
      - source: "Campaign results"
        example: "Rolls-Royce headline 'At 60 miles an hour...' ran for years"

  # HEURISTIC 6: The Long Copy Rule
  - id: "long_copy_rule"
    name: "The Long Copy Rule"
    type: "representativeness"

    description: |
      Long copy sells if it's interesting. More information is more persuasive.
      The assumption that "nobody reads long copy" is wrong - people will read
      anything that interests them.

    trigger_conditions:
      - "Copy length decisions"
      - "Considered purchase advertising"
      - "Direct response campaigns"
      - "Complex product explanations"

    accuracy_profile:
      domains_accurate:
        - "High-involvement purchases"
        - "B2B advertising"
        - "Technical products"
        - "Luxury goods"
      domains_biased:
        - "Impulse purchases"
        - "Brand awareness only"
        - "Social media formats"
      reliability: "high"

    bias_risks:
      - risk: "Not applicable to all media/categories"
        mitigation: "Consider context and format constraints"

    evidence:
      - source: "Direct response data"
        example: "Long copy consistently outperformed short in Ogilvy's tests"
      - source: "Confessions"
        example: "All my experience says long copy sells more than short"

  # HEURISTIC 7: The Phony Detector
  - id: "phony_detector"
    name: "The Phony Detector"
    type: "affect"

    description: |
      Immediate rejection of people who seem dishonest, incompetent, or inauthentic.
      "No phonies, zeros, or bastards." This is a rapid categorization heuristic
      that prioritizes character over credentials.

    trigger_conditions:
      - "Meeting new people"
      - "Interview situations"
      - "Client evaluations"
      - "Partnership considerations"

    accuracy_profile:
      domains_accurate:
        - "Character assessment"
        - "Cultural fit"
        - "Trust decisions"
      domains_biased:
        - "Unconventional personalities"
        - "Cultural differences"
      reliability: "medium-high"

    bias_risks:
      - risk: "False positives (rejecting good people)"
        mitigation: "Allow second chances in controlled settings"
      - risk: "May reject unconventional talent"
        mitigation: "Separate 'different' from 'dishonest'"

    evidence:
      - source: "Quotations"
        example: "No phonies, zeros or bastards"
      - source: "Hiring practices"
        example: "Known for rapid character judgments"

  # HEURISTIC 8: The Big Idea Filter
  - id: "big_idea_filter"
    name: "The Big Idea Filter"
    type: "representativeness"

    description: |
      Every advertisement needs a Big Idea - something unique, memorable, and capable
      of running for 30 years. If the idea isn't big enough, the ad will pass like
      a ship in the night.

    trigger_conditions:
      - "Campaign concept evaluation"
      - "Creative reviews"
      - "Distinguishing good from great"
      - "Strategic positioning"

    accuracy_profile:
      domains_accurate:
        - "Brand campaigns"
        - "Long-term positioning"
        - "Differentiation strategy"
      domains_biased:
        - "Tactical promotions"
        - "Short-term campaigns"
      reliability: "very_high"

    bias_risks:
      - risk: "Rejecting solid work that lacks 'brilliance'"
        mitigation: "Not everything needs to be groundbreaking"

    evidence:
      - source: "Ogilvy on Advertising"
        example: "Unless your advertising contains a big idea, it will pass like a ship in the night"
      - source: "Campaign legacy"
        example: "Hathaway, Rolls-Royce, Dove all had 'big ideas' that ran for decades"

  # HEURISTIC 9: The Family Test
  - id: "family_test"
    name: "The Family Test"
    type: "affect"

    description: |
      Never write an advertisement you wouldn't want your family to read. This ensures
      honesty, integrity, and prevents manipulative or shameful work.

    trigger_conditions:
      - "Evaluating ethical boundaries"
      - "Reviewing potentially manipulative copy"
      - "Making claims about products"
      - "Personal brand decisions"

    accuracy_profile:
      domains_accurate:
        - "Ethical advertising"
        - "Honest claims"
        - "Reputation protection"
      domains_biased: []
      reliability: "very_high"

    bias_risks:
      - risk: "None - purely protective"
        mitigation: "N/A"

    evidence:
      - source: "Confessions"
        example: "Never write an advertisement you wouldn't want your family to read"
      - source: "Client management"
        example: "Refused accounts for products he didn't believe in"

  # HEURISTIC 10: The Tested Principle Rule
  - id: "tested_principle"
    name: "The Tested Principle Rule"
    type: "anchoring"

    description: |
      Always prefer approaches that have been tested and proven over untested innovation.
      Hopkins' principles, validated by direct response, are more reliable than
      fashionable theories.

    trigger_conditions:
      - "Choosing between creative approaches"
      - "Evaluating 'innovative' proposals"
      - "Deciding methodology"
      - "Training others"

    accuracy_profile:
      domains_accurate:
        - "Campaign execution"
        - "Copywriting techniques"
        - "Format decisions"
      domains_biased:
        - "Truly novel categories"
        - "Emerging media formats"
      reliability: "very_high"

    bias_risks:
      - risk: "May miss genuine innovation"
        mitigation: "Test new approaches before scaling"
      - risk: "Conservatism in changing markets"
        mitigation: "Principles adapt; specific techniques may not"

    evidence:
      - source: "All major works"
        example: "Constant reference to Hopkins, Gallup, proven techniques"
      - source: "Direct response results"
        example: "Tracked and documented what worked"

# =============================================================================
# CHOICE ARCHITECTURE (How He Structured Decisions)
# =============================================================================
choice_architecture:

  default_creation:
    description: "How Ogilvy set up default options to make good decisions automatic"

    defaults:
      - domain: "Creative Time"
        default_structure: "Morning 8AM-12PM reserved for writing"
        why_effective: "Eliminated daily decision about when to do creative work"
        enforcement: "Absolute protection; gatekeeper (secretary) enforced"

      - domain: "Research First"
        default_structure: "No campaign starts without consumer research"
        why_effective: "Removed temptation to skip research under pressure"
        enforcement: "Agency policy; personal example"

      - domain: "Quality Review"
        default_structure: "All work reviewed before client presentation"
        why_effective: "Built-in quality gate prevented mediocrity"
        enforcement: "Creative Council reviews"

      - domain: "Hiring Standards"
        default_structure: "Russian dolls metaphor as hiring default"
        why_effective: "Anchored hiring decisions to 'bigger than me' standard"
        enforcement: "Cultural expectation; personal example"

  choice_reduction:
    description: "How Ogilvy simplified decision environments"

    strategies:
      - strategy: "Eliminate bad options entirely"
        example: "Refused accounts that would require compromising principles"
        mechanism: "Avoids decision fatigue by removing temptation"

      - strategy: "Create clear criteria"
        example: "Hopkins Test, Wife Test, Family Test"
        mechanism: "Converts complex judgment to simple checklist"

      - strategy: "Codify principles"
        example: "Written rules for creating advertising that sells"
        mechanism: "Reduces decisions to principle application"

      - strategy: "Separate thinking from doing"
        example: "Research phase separate from creative phase"
        mechanism: "Focus on one type of decision at a time"

  commitment_devices:
    description: "Self-binding mechanisms Ogilvy used"

    devices:
      - device: "Public commitments"
        example: "Published principles in books read by industry"
        mechanism: "Reputation stake in maintaining standards"

      - device: "Temporal separation"
        example: "Weekend creative work, weekday management"
        mechanism: "Physical/temporal barriers prevent mode mixing"

      - device: "Financial skin in game"
        example: "Built agency on principles; failure = personal loss"
        mechanism: "Aligned incentives with stated values"

      - device: "Cultural institutionalization"
        example: "Taught principles to every employee"
        mechanism: "Social pressure enforces standards"

  feedback_loops:
    description: "How Ogilvy structured decision feedback"

    mechanisms:
      - loop: "Direct response measurement"
        timing: "Immediate (days/weeks)"
        what_measured: "Sales, responses, conversions"
        adjustment_pattern: "Rapid iteration based on data"

      - loop: "Client relationship longevity"
        timing: "Long-term (years)"
        what_measured: "Account retention, expansion"
        adjustment_pattern: "Validate relationship approaches"

      - loop: "Talent development tracking"
        timing: "Medium-term (months/years)"
        what_measured: "Employee growth, promotions, departures"
        adjustment_pattern: "Refine hiring and mentoring approaches"

      - loop: "Industry reputation"
        timing: "Long-term (decades)"
        what_measured: "Recognition, respect, legacy"
        adjustment_pattern: "Validate career-level strategies"

