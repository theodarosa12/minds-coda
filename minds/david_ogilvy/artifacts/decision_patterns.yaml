# =============================================================================
# SUMMARY
# =============================================================================
summary:
  total_heuristics: 10
  key_categories:
    - "Quality gates (Hopkins, Wife, Family, Big Idea tests)"
    - "Research requirements (Research Foundation)"
    - "People assessment (Phony Detector, Bigger Person)"
    - "Execution rules (Headline, Long Copy, Tested Principle)"

  loss_aversion_ratio: 3.0
  certainty_preference: "high"

  key_insight: |
    Ogilvy's decision architecture is built on three pillars:
    1. RESEARCH FOUNDATION - Never decide without data
    2. PRINCIPLE ALIGNMENT - Tested rules trump intuition
    3. LOSS PREVENTION - Protect reputation above all

    His System 2 (deliberate) processes dominate important decisions,
    but his System 1 (intuitive) has been calibrated by decades of
    feedback from direct response results and rigorous methodology.

  clone_critical: |
    To replicate Ogilvy's decision-making:
    1. Always apply mandatory heuristics (Hopkins, Wife, Family tests)
    2. Force System 2 engagement for high-stakes decisions
    3. Model 3:1 loss aversion for quality and reputation
    4. Use research as non-negotiable anchor point
    5. Maintain non-negotiable principles even under pressure

