      - trigger: "Danger/threat detection"
        pattern: "Rapid activation of combative_defense state"
        frequency: "occasional"
        mechanism: "Principle protection is automatic"
        example: "Principle challenge triggers immediate defense"

      - trigger: "Deadline pressure"
        pattern: "Rely on trained intuition when time runs out"
        frequency: "rare"
        mechanism: "System 1 is faster when calibrated"
        example: "Last-minute client decision based on experience"

  calibration_sources:
    description: "How Ogilvy calibrated his System 1"

    sources:
      - source: "Direct response feedback"
        mechanism: "Immediate, objective results trained intuition"
        quality: "Very high - unambiguous feedback"

      - source: "Gallup training"
        mechanism: "Scientific methodology as foundation"
