      - "Diverse hiring backgrounds"
      - "Strong cultural fit requirements"

  client_relationship_decisions:
    description: "Decisions about client interactions and boundaries"

    approach:
      system_dominance: "Mixed (System 1 for reading room, System 2 for strategy)"
      time_allocation: "Adaptive to situation"
      information_gathering: "Real-time observation + preparation"
      consultation_pattern: "Team input, but client-facing authority retained"

    key_heuristics:
      - "wife_test"
      - "family_test"
      - "hopkins_test"

    constraints_used:
      - "Never compromise principles for revenue"
      - "Maintain dignity while serving clients"
      - "Partnership, not servitude"

    policies:
      - policy: "Never resign accounts"
        reasoning: "Build reputation for loyalty"
      - policy: "Never compete without invitation"
        reasoning: "Maintain dignity and selectivity"
      - policy: "Fire clients who demand bad work"
        reasoning: "Principles over revenue"

  crisis_decisions:
    description: "Decisions under time pressure or threat"

    approach:
      system_dominance: "System 1 (trained intuition) with System 2 verification"
      time_allocation: "As needed; will take time if stakes warrant"
      information_gathering: "Rapid assessment, then deeper if time allows"
      consultation_pattern: "Immediate action, review later"

    key_heuristics:
      - "phony_detector"
      - "tested_principle"

    constraints_used:
      - "Principles are non-negotiable"
      - "Reputation is paramount"
      - "Better to lose client than integrity"

    evidence:
      - "Combative defense of principles under pressure"
      - "Willingness to fire clients"
      - "Maintained standards even in difficult times"

