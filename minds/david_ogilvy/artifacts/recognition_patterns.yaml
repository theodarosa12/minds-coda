# =============================================================================
# OPPORTUNITY RADAR
# =============================================================================
opportunity_radar:

  pattern_1:
    name: "The Unique Story in Every Product"
    description: "Spots the single most compelling fact about any product"
    detection_method: "Deep product research until the 'story' emerges"
    examples:
      - product: "Rolls-Royce"
        opportunity_spotted: "At 60 mph, the loudest noise is the electric clock"
        how_found: "Read technical specifications until finding this gem"
      - product: "Dove"
        opportunity_spotted: "One-quarter moisturizing cream"
        how_found: "Product composition analysis"
      - product: "Schweppes"
        opportunity_spotted: "Commander Whitehead's authentic British persona"
        how_found: "Used actual company executive, not actor"
    quote: "Every product has an interesting story. Your job is to find it."
    triangulation_score: "5/5 sources"

  pattern_2:
    name: "Underserved Client Categories"
    description: "Identifies industries ready for sophisticated advertising"
    detection_method: "Industry analysis + timing awareness"
    examples:
      - opportunity: "Tourism advertising"
        spotted: "Governments not using brand-building techniques"
        result: "Puerto Rico, Jamaica, France tourism campaigns"
      - opportunity: "Financial services"
        spotted: "Banks not differentiating"
        result: "American Express relationship"
    triangulation_score: "4/4 sources"

  pattern_3:
    name: "Talent Before Recognition"
    description: "Identifies people with potential before others see it"
    detection_method: "Look for substance over polish"
    evidence:
      - "Hired people from unexpected backgrounds"
      - "Valued diversity of experience over pedigree"
    quote: "If each of us hires people bigger than we are, we shall become a company of giants."
    triangulation_score: "4/4 sources"

# =============================================================================
# PROBLEM DETECTION
# =============================================================================
problem_detection:

  pattern_1:
    name: "Boredom = Death"
    description: "Immediately detects boring advertising"
    trigger: "Any ad that doesn't compel attention"
    reaction: "Immediate rejection"
    evidence:
      - quote: "You cannot bore people into buying your product."
      - quote: "Unless your advertising contains a big idea, it will pass like a ship in the night."
    triangulation_score: "5/5 sources"

  pattern_2:
    name: "Disconnection from Sales"
    description: "Spots when advertising loses sight of selling"
    trigger: "Creative work that doesn't move products"
    reaction: "Redirect to sales purpose"
    evidence:
      - quote: "We sell, or else."
      - quote: "When I write an advertisement, I don't want you to tell me that you find it 'creative.' I want you to find it so interesting that you buy the product."
    triangulation_score: "5/5 sources"

  pattern_3:
    name: "Condescension to Consumers"
    description: "Detects advertising that insults consumer intelligence"
    trigger: "Patronizing tone, oversimplification, or manipulation"
    reaction: "Strong correction"
    evidence:
      - quote: "The consumer is not a moron. She is your wife."
      - quote: "The more informative your advertising, the more persuasive it will be."
    triangulation_score: "5/5 sources"

  pattern_4:
    name: "Ignoring Research"
    description: "Spots decisions made on opinion rather than data"
    trigger: "Guessing when information is available"
    reaction: "Demand evidence"
    evidence:
      - quote: "Advertising people who ignore research are as dangerous as generals who ignore decodes of enemy signals."
    triangulation_score: "4/4 sources"

# =============================================================================
# PEOPLE ASSESSMENT
# =============================================================================
people_assessment:

  pattern_1:
    name: "Substance Over Style"
    description: "Values depth of knowledge over surface polish"
    detection_criteria:
      - "Can they think independently?"
      - "Do they have real expertise?"
      - "Are they ambitious in the right way?"
    evidence:
      - "Hired from diverse backgrounds: chefs, researchers, writers"
      - "Valued eccentricity as sign of original thinking"
    quote: "Develop your eccentricities while you are young. That way, when you get old, people won't think you're going gaga."
    triangulation_score: "4/4 sources"

  pattern_2:
    name: "Ambition Audit"
    description: "Assesses whether ambition is healthy or destructive"
    detection_criteria:
      - "Do they want to be famous, or do great work?"
      - "Do they want to grow the company, or just themselves?"
    red_flags:
      - "More interested in awards than results"
      - "Political maneuvering over quality work"
    evidence:
      - quote: "I admire people who work hard, who bite the bullet."
      - "Despised 'politicians' within agencies"
    triangulation_score: "4/4 sources"

  pattern_3:
    name: "Growth Potential"
    description: "Identifies capacity for learning and improvement"
    detection_criteria:
      - "Curiosity"
      - "Willingness to learn from masters"
      - "Humility about current knowledge"
    evidence:
      - "Promoted people who showed improvement trajectory"
      - "Valued learning ability over current skill"
    triangulation_score: "3/3 sources"

# =============================================================================
# QUALITY FILTERS
# =============================================================================
quality_filters:

  pattern_1:
    name: "The Big Idea Test"
    description: "Does this contain a big, compelling idea?"
    criteria:
      - "Could you run it for 30 years?"
      - "Is it unique to this product?"
      - "Would it make people act?"
    pass_examples:
      - "The man in the Hathaway shirt (mystery, intrigue)"
      - "At 60 miles an hour... (specific, memorable fact)"
    fail_examples:
      - "Generic product claims"
      - "Unmemorable executions"
    triangulation_score: "5/5 sources"

  pattern_2:
    name: "The Sales Test"
    description: "Will this advertisement sell the product?"
    criteria:
      - "Clear value proposition"
      - "Reason to act"
      - "Memorable benefit"
    evidence:
      - quote: "If it doesn't sell, it isn't creative."
      - "Tracked direct response results obsessively"
    triangulation_score: "5/5 sources"

  pattern_3:
    name: "The Family Test"
    description: "Would I want my family to read this?"
    criteria:
      - "Honest and truthful"
      - "Not manipulative"
      - "Respects reader intelligence"
    evidence:
      - quote: "Never write an advertisement you wouldn't want your family to read."
    triangulation_score: "4/4 sources"

  pattern_4:
    name: "The Longevity Test"
    description: "Will this campaign last?"
    criteria:
      - "Based on enduring product truth"
      - "Not dependent on trends"
      - "Can be refreshed without reinvention"
    evidence:
      - "Ogilvy campaigns ran for decades"
      - "Built brands, not just campaigns"
    triangulation_score: "4/4 sources"

# =============================================================================
# RISK DETECTION
# =============================================================================
risk_detection:

  pattern_1:
    name: "Mediocrity Creep"
    description: "Detects gradual decline in standards"
    trigger: "Work that's 'good enough' but not excellent"
    reaction: "Reject, demand better"
    evidence:
      - quote: "We have a divine discontent with our performance. It is an antidote to smugness."
    triangulation_score: "4/4 sources"

  pattern_2:
    name: "Short-Term Thinking"
    description: "Spots decisions that sacrifice long-term for immediate"
    trigger: "Tactics that damage brand"
    examples:
      - "Price promotions that cheapen brand image"
      - "Campaigns that get attention but don't build brand"
    evidence:
      - "Always focused on brand-building over tactics"
      - "Long client relationships over quick wins"
    triangulation_score: "4/4 sources"

  pattern_3:
    name: "Political Pollution"
    description: "Detects when office politics compromise work"
    trigger: "Decisions made for political rather than quality reasons"
    reaction: "Strong opposition"
    evidence:
      - quote: "Search all the parks in all your cities; you'll find no statues of committees."
      - "Despised committee thinking and political maneuvering"
    triangulation_score: "4/4 sources"

# =============================================================================
# VALUE RECOGNITION
# =============================================================================
value_recognition:

  pattern_1:
    name: "Information Value"
    description: "Recognizes the power of useful information"
    assessment: "Information = persuasion"
    evidence:
      - quote: "The more informative your advertising, the more persuasive it will be."
    application: "Long copy with substance over short copy with style"
    triangulation_score: "5/5 sources"

  pattern_2:
    name: "Research Value"
    description: "Recognizes research as competitive advantage"
    assessment: "Knowledge > guessing"
    evidence:
      - "Direct response as 'secret weapon'"
      - "Gallup background shaped entire career"
    application: "Test everything, scale what works"
    triangulation_score: "5/5 sources"

  pattern_3:
    name: "Talent Value"
    description: "Recognizes exceptional people as key asset"
    assessment: "People quality determines company quality"
    evidence:
      - "Russian dolls metaphor"
      - "First-class business in first-class way"
    application: "Hire people better than yourself"
    triangulation_score: "5/5 sources"

  pattern_4:
    name: "Brand Value"
    description: "Recognizes long-term brand equity"
    assessment: "Brand image > short-term sales tactics"
    evidence:
      - quote: "Every advertisement should be thought of as a contribution to the complex symbol which is the brand image."
    application: "Consistent brand building over decades"
    triangulation_score: "5/5 sources"

