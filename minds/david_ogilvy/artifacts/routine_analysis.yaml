stress_immunity:

  early_warning_recognition:
    signals:
      physical:
        - "Sleep disruption (waking before 5:30)"
        - "Appetite changes"
        - "Tension in shoulders/neck"
      behavioral:
        - "Shorter temper than usual"
        - "Rushing through routines"
        - "Skipping exercise"
        - "Difficulty entering creative_flow"
      cognitive:
        - "Rumination on problems"
        - "Difficulty focusing"
        - "Pessimistic framing"

    typical_timing:
      - "Major pitch deadlines"
      - "Difficult client situations"
      - "Agency financial pressures"
      - "Key personnel departures"

  coping_routines:
    - routine: "Extended morning walk"
      triggers: ["Rising stress levels", "Poor sleep", "Upcoming pressure"]
      mechanism: "Physical activity metabolizes stress hormones"
      effectiveness: "High"
      recovery_time: "1-2 hours for acute relief"

    - routine: "Return to fundamentals (Hopkins principles)"
      triggers: ["Creative uncertainty", "Client pressure for bad work"]
      mechanism: "Certainty in methodology reduces anxiety"
      effectiveness: "High"
      recovery_time: "Immediate grounding effect"

    - routine: "Research deep dive"
      triggers: ["Uncertainty about direction", "New territory anxiety"]
      mechanism: "Knowledge reduces fear of unknown"
      effectiveness: "High"
      recovery_time: "Hours to days depending on complexity"

    - routine: "Complete disconnection"
      triggers: ["Accumulated fatigue", "Extended high stress"]
      mechanism: "True recovery requires full break"
      effectiveness: "Very high"
      recovery_time: "Weekend to week for full restoration"

  recovery_rituals:
    - ritual: "Chateau Touffou retreats"
      states_restored: ["reflective_learning", "creative_flow", "restorative_balance"]
      required_conditions:
        - "Physical removal from agency"
        - "Extended time (weeks)"
        - "Beautiful environment"
        - "Access to books and writing materials"
      frequency: "Annual or semi-annual"
      effectiveness: "Complete restoration"

    - ritual: "Evening reading absorption"
      states_restored: ["reflective_learning"]
      required_conditions:
        - "Quiet environment"
        - "Interesting material"
        - "No interruptions"
      frequency: "Daily"
      effectiveness: "Daily maintenance"

    - ritual: "Family dinner presence"
      states_restored: ["restorative_balance"]
      required_conditions:
        - "Family gathered"
        - "No work discussion"
        - "Present attention"
      frequency: "Daily"
      effectiveness: "Relationship and grounding maintenance"

  failure_modes:
    - when: "Extended travel without routine"
      breakdown_pattern: "Gradual erosion of creative output quality"
      consequence: "Increased stress, lower work quality, health impact"
      recovery: "Immediate return to routine upon returning"

    - when: "Crisis requiring extended client focus"
      breakdown_pattern: "Creative block sacrificed for firefighting"
      consequence: "Short-term client save, long-term creative debt"
      recovery: "Deliberate routine restoration after crisis"

    - when: "Success complacency"
      breakdown_pattern: "Relaxing quality control standards"
      consequence: "Gradual mediocrity creep"
      recovery: "Recommitment to 'divine discontent'"

