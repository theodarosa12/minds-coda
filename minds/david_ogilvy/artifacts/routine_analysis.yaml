# =============================================================================
# CORE PHILOSOPHY (DANIEL ADDITION)
# =============================================================================
core_philosophy:
  principle: "Routines are not habits. They are state-activation rituals."
  ogilvy_insight: "Protect your creative hours like a miser protects his gold."
  kahneman_framing: "Each routine primes a specific cognitive/emotional state"
  critical_distinction:
    wrong: "I do this at 8AM because I always have (habit)"
    correct: "I do this at 8AM because it primes my creative state (ritual)"

# =============================================================================
# DAILY STRUCTURE
# =============================================================================
daily_structure:

  # DANIEL ENRICHED: Added specific times, state-priming analysis
  early_morning:  # 5:30-8:00 AM
    wake_time: "5:30 AM"
    consistency: "Very high - maintained for 40+ years"

    first_hour:  # 5:30-6:30 AM
      activities:
        - "Wake naturally (internal clock, no alarm)"
        - "Light stretching or brief walk"
        - "Morning coffee preparation"
        - "Read newspapers (Times, business press)"
      states_primed:  # DANIEL ADDITION
        - "reflective_learning"
        - "analytical_research (passive)"
      purpose: "World awareness + gentle activation"

    pre_work:  # 6:30-8:00 AM
      activities:
        - "Breakfast (simple, consistent)"
        - "Light exercise or walking"
        - "Personal hygiene routine"
        - "Review day's priorities mentally"
        - "Commute to office (or home office transition)"
      states_primed:  # DANIEL ADDITION
        - "restorative_balance"
        - "preparing for creative_flow"
      purpose: "Physical readiness + mental clearing"

  weekday_pattern:
    morning:
      activities:
        - "Early rise"
        - "Review of work from previous day"
        - "Correspondence and memos"
      focus: "Administrative and communication tasks"
      # DANIEL ADDITION
      state_note: "Pre-creative administrative clearing"

    work_blocks:
      structure: "Office hours for management, meetings, client work"
      note: "Reserved creative work for weekends"
      # DANIEL ADDITION
      state_analysis: |
        Ogilvy intentionally separated ADMINISTRATIVE work (weekdays, office)
        from CREATIVE work (weekends, home). This is a deliberate state-separation
        strategy - different environments prime different cognitive modes.

    evening:
      activities:
        - "Business dinners with clients (strategic)"
        - "Reading"
        - "Family time"
      # DANIEL ADDITION
      states_primed:
        - "persuasion_mode (business dinners)"
        - "reflective_learning (reading)"
        - "restorative_balance (family)"

  weekend_pattern:
    description: "Sacred creative time"
    activities:
      - "Deep creative work on campaigns"
      - "Writing long-form pieces"
      - "Revision of existing copy"
    evidence:
      - source: "Autobiography"
        quote: "I do my creative work at home on weekends, not in the office."
    significance: "Separated management from creation physically and temporally"
    # DANIEL ADDITION
    state_priming:
      target_state: "creative_flow"
      priming_mechanism: "Physical location change + absence of office demands"
      protection_level: "Absolute"

