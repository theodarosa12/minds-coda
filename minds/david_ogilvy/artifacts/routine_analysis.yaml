        - "Willingness to follow data"
      external:
        - "Clear question requiring answer"
        - "Sufficient time for thorough work"

    state_markers:
      onset:
        - "Narrowed focus on problem"
        - "Systematic approach activates"
        - "Emotional detachment from outcome"
      maintenance:
        - "Pattern recognition accelerating"
        - "Hypotheses forming and testing"
        - "Data organization improving"
      degradation:
        - "Diminishing returns"
