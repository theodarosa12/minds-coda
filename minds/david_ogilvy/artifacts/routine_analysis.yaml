        - "Close research materials"
        - "Short break (walk, coffee)"
        - "Return to creative space"
        - "Allow 15-20 min warm-up"
      transition_time: "20-45 minutes"
      friction: "Medium-high"
      note: "Harder transition - analytical thinking can inhibit creative flow"

    interference_patterns:
      - pattern: "Analytical interrupt during creative peak"
        damage: "High - flow state very hard to recover"
        prevention: "Never schedule meetings during creative block"

      - pattern: "Unfinished analytical question during creative"
        damage: "Medium - creates cognitive load"
        prevention: "Complete research phases before creative sessions"

