# =============================================================================
# STATE-PRIMING ROUTINES (DANIEL ADDITION)
# =============================================================================
state_priming_routines:

  - routine_name: "Morning Creative Activation"
    routine_id: "morning_creative"
    timing: "7:00 AM - 8:00 AM"
    target_state: "creative_flow"

    activities:
      - activity: "Light breakfast (same foods)"
        duration: "20 minutes"
        optional: false
        priming_function: "Physical energy without heaviness"

      - activity: "Brief walk or movement"
        duration: "15-20 minutes"
        optional: false
        priming_function: "Increased blood flow, mental clearing"

      - activity: "Coffee preparation/consumption"
        duration: "10 minutes"
        optional: false
        priming_function: "Caffeine + ritual comfort"

      - activity: "Transition to workspace"
        duration: "15-30 minutes"
        optional: false
        priming_function: "Mental preparation, boundary crossing"

      - activity: "Enter private space, close door"
        duration: "1 minute"
        optional: false
        priming_function: "Physical signal of mode change"

    priming_mechanism:
      physical: "Movement increases alertness without fatigue"
      chemical: "Caffeine peaks ~45 min after consumption"
      environmental: "Consistent space = conditioned response"
      psychological: "Ritual sequence signals 'creative time'"
      social: "Absence of others = permission to focus"

    success_rate: "Very high (95%+ when followed)"

    disruption_analysis:
      when_disrupted: "Travel, illness, urgent client issues"
      consequence: "Reduced creative output quality and quantity"
      recovery_time: "1-2 days to return to full rhythm"
      alternative_priming: "Abbreviated version: coffee + 10 min alone = minimum"

    minimum_viable:
      essential_elements:
        - "Coffee"
        - "Private space"
        - "No interruptions for minimum 2 hours"
      time_required: "15 minutes preparation + 2 hours minimum"

  - routine_name: "Evening Learning Ritual"
    routine_id: "evening_learning"
    timing: "7:00 PM - 10:00 PM"
    target_state: "reflective_learning"

    activities:
      - activity: "Post-dinner settling"
        duration: "15 minutes"
        optional: true
        priming_function: "Transition from social to solitary"

      - activity: "Select reading material"
        duration: "5 minutes"
        optional: false
        priming_function: "Intentional choice activates curiosity"

      - activity: "Extended reading session"
        duration: "2-3 hours"
        optional: false
        priming_function: "Deep engagement with ideas"

      - activity: "Note-taking and synthesis"
        duration: "Variable"
        optional: false
        priming_function: "Active processing cements learning"

    priming_mechanism:
      physical: "Relaxed posture, comfortable environment"
      environmental: "Home space = safety for exploration"
      psychological: "Day's work complete = mental space free"
      content: "Self-selected topics = intrinsic motivation"

    success_rate: "High (85%+ on typical days)"

    disruption_analysis:
      when_disrupted: "Social obligations, travel, family needs"
      consequence: "Accumulating knowledge debt"
      recovery_time: "Minimal - can resume next evening"
      alternative_priming: "Even 30 min reading maintains habit"

    minimum_viable:
      essential_elements:
        - "30 minutes reading"
        - "Quiet environment"
      time_required: "30 minutes minimum"

  - routine_name: "Quality Control Activation"
    routine_id: "quality_review"
    timing: "5:00 PM - 6:00 PM (or any work review)"
    target_state: "quality_control"

    activities:
      - activity: "Gather all work for review"
        duration: "5 minutes"
        optional: false
        priming_function: "Mental preparation for critique"

      - activity: "Review against principles checklist"
        duration: "Variable"
        optional: false
        priming_function: "Systematic evaluation framework"

      - activity: "Document specific improvements"
        duration: "Variable"
        optional: false
        priming_function: "Actionable feedback focus"

    priming_mechanism:
      mental: "Shifting from creation to evaluation"
      reference: "Accessing internalized quality standards"
      emotional: "Cultivated 'divine discontent'"

    success_rate: "Very high (automatic activation)"

    minimum_viable:
      essential_elements:
        - "Pause before submission"
        - "Mental checklist: research, headline, wife test"
      time_required: "3 minutes minimum"

  - routine_name: "Client Presentation Preparation"
    routine_id: "presentation_prep"
    timing: "Morning of or day before major presentations"
    target_state: "persuasion_mode"

    activities:
      - activity: "Review all materials thoroughly"
        duration: "1-2 hours"
        optional: false
        priming_function: "Complete command of content"

      - activity: "Anticipate objections (write them down)"
        duration: "30 minutes"
        optional: false
        priming_function: "Reduces anxiety, prepares responses"

      - activity: "Mental rehearsal"
        duration: "15-30 minutes"
        optional: true
        priming_function: "Performance visualization"

    priming_mechanism:
      cognitive: "Deep familiarity enables fluid delivery"
      emotional: "Confidence from preparation"
      strategic: "Pre-thought objections = control"

    success_rate: "High when followed completely"

    minimum_viable:
      essential_elements:
        - "Know the material cold"
        - "Anticipate top 3 objections"
      time_required: "1 hour minimum prep"

  - routine_name: "Teaching/Mentoring Activation"
    routine_id: "teaching_activation"
    timing: "3:00 PM - 5:00 PM (or mentoring opportunities)"
    target_state: "teaching_mode"

    activities:
      - activity: "Review mentee's work beforehand"
        duration: "15-30 minutes"
        optional: false
        priming_function: "Specific feedback preparation"

      - activity: "Identify principle to transmit"
        duration: "5 minutes"
        optional: false
        priming_function: "Focus teaching on transferable insight"

    priming_mechanism:
      shift: "From creator to guide"
      emotional: "Generosity and patience activation"
      structural: "Principle-based explanation mode"

    success_rate: "Very high - natural teacher"

    minimum_viable:
      essential_elements:
        - "Have reviewed the work"
        - "One clear principle to teach"
      time_required: "15 minutes prep + meeting time"

# =============================================================================
# CREATIVE PROCESS
# =============================================================================
creative_process:

  ideation:
    timing: "After extensive research phase"
    method: "Immersion then incubation"
    triggers:
      - "Thorough product research"
      - "Consumer research review"
      - "Competitive analysis"
    quote: "First, study the product. Become steeped in it."
    # DANIEL ADDITION
    state_requirement: "analytical_research → creative_flow transition"

  big_idea_discovery:
    method: "Look for single dramatic fact or story"
    process:
      - step: 1
        action: "Research exhaustively"
      - step: 2
        action: "Look for the 'story' in the product"
      - step: 3
        action: "Find the one thing that makes it different"
      - step: 4
        action: "Express it in simplest possible terms"
    examples:
      - product: "Rolls-Royce"
        discovery: "The clock is the loudest thing at 60 mph"
      - product: "Dove"
        discovery: "It's one-quarter moisturizing cream"
      - product: "Hathaway"
        discovery: "Added eye patch for mystique"

  execution:
    cadence: "Multiple revision cycles"
    method: "Write first draft quickly, then edit ruthlessly"
    evidence:
      - "I am a lousy copywriter, but I am a good editor."
    revision_count: "Often 15-30 revisions on major pieces"

  review:
    internal: "Creative committee review"
    personal: "Read aloud for rhythm and flow"
    testing: "Direct response testing when possible"

