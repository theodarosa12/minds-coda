# =============================================================================
# ALGORITHM STATEMENT
# =============================================================================

unique_algorithm:
  algorithm_statement: |
    When facing any decision, David Ogilvy first asks "Does this sell?" - filtering
    everything through the lens of effectiveness. If the answer is yes, he then
    applies the Research Test: "What does the evidence say?" Only after satisfying
    these two gates does he consider the Quality Test: "Is this first-class work?"

    His algorithm uniquely combines aristocratic standards with commercial pragmatism.
    He NEVER sacrifices effectiveness for awards or creativity. He NEVER sacrifices
    quality for speed (but will sacrifice speed for quality that sells better).

    When faced with ambiguity, he defaults to "What would direct response testing
    reveal?" This is his tiebreaker - the scientific approach inherited from Hopkins
    and Gallup that distinguishes him from intuition-driven competitors like Bernbach.

    The counterintuitive element: He hates rules but creates them obsessively. This
    paradox resolves because his rules ARE research - codified evidence, not arbitrary
    conventions. He rebels against tradition but submits to data.

  one_liner: |
    "First ask if it sells, then prove it with research, then make it excellent."

# =============================================================================
# FORMAL EXPRESSION
# =============================================================================

  formal_expression:
    primary_rule: |
      IF (decision affects advertising/work output)
      THEN prioritize EFFECTIVENESS (selling)
      UNLESS quality of execution undermines credibility
      IN WHICH CASE balance effectiveness with first-class execution

    secondary_rules:
      - rule: "When choosing between people"
        expression: "Hire bigger than yourself, fire phonies immediately"
        weight: 9

      - rule: "When facing creative choices"
        expression: "Research first, intuition second, revision third"
        weight: 9

      - rule: "When resources are limited"
        expression: "Quality over speed, results over awards"
        weight: 8

      - rule: "When facing ethical choices"
        expression: "Never deceive consumer, never betray client trust"
        weight: 10

    exception_handlers:
      - exception: "When direct response cannot be tested"
        handling: "Trust informed intuition from deep research"
        example: "Hathaway eye patch - intuitive but from research-saturated mind"

      - exception: "When speed is truly urgent"
        handling: "Maintain minimum quality threshold, never compromise integrity"
        example: "Client deadline met but never with dishonest work"

      - exception: "When personal fear is triggered (e.g., flying)"
        handling: "Avoid rather than confront; find workaround"
        example: "Take ship instead of plane; still get there"

    tiebreakers:
      - level: 1
        tiebreaker: "What does direct response data say?"
        rationale: "Data is the ultimate arbiter"

      - level: 2
        tiebreaker: "What would Claude Hopkins do?"
        rationale: "Hopkins is the intellectual north star"

      - level: 3
        tiebreaker: "Will this build or damage the brand long-term?"
        rationale: "Short-term tactics vs long-term brand equity"

