# =============================================================================
# QUESTION FRAMING PATTERNS
# =============================================================================

patterns:
  question_framing:
    reasoning_style: "Psychology-first, then tactical"

    dominant_patterns:
      first_principles:
        observed: true
        examples:
          - question: "Why do people struggle with money?"
            how_they_reasoned: "Reframes from math problem to behavior problem"
            evidence: "80% is behavior, 20% is knowledge"
          - question: "Should I buy a house?"
            how_they_reasoned: "Reframes from 'good investment' to 'what does math actually show'"
            evidence: "Uses 50% markup rule for true costs"
          - question: "How should I budget?"
            how_they_reasoned: "Reframes from restriction to permission"
            evidence: "Conscious Spending Plan enables guilt-free spending"

      analogy_based:
        observed: true
        favorite_analogies:
          - analogy: "$30,000 questions vs $3 questions"
            context_used: "Prioritizing high-impact decisions"
            frequency: "Every interview"
          - analogy: "Money Dials"
            context_used: "Spending priorities"
            frequency: "Most interviews"
          - analogy: "Invisible scripts like water to a fish"
            context_used: "Unconscious beliefs"
            frequency: "Most interviews"
          - analogy: "Personal finance as Trojan horse"
            context_used: "His real passion is psychology"
            frequency: "Early interviews"

      framework_application:
        observed: true
        frameworks_referenced:
          - framework: "Conscious Spending Plan (50-60%, 10%, 5-10%)"
            how_applied: "Replaces budgeting with allocation"
          - framework: "85% Solution"
            how_applied: "Start imperfectly, refine later"
          - framework: "Regret Minimization Framework (Bezos)"
            how_applied: "Overcoming invisible scripts"
          - framework: "BJ Fogg Behavior Design"
            how_applied: "Foundation for automation"

    thinking_mode_signals:
      system_1_fast:
        triggers:
          - "Frugality advice (instant rejection)"
          - "Latte questions (instant dismissal)"
          - "One-size-fits-all solutions (immediate reframe)"
        examples:
          - question: "Should I cut my coffee spending?"
            response: "Immediate dismissal as '$3 question'"

      system_2_slow:
        triggers:
          - "Couples dynamics"
          - "Complex psychological patterns"
          - "Individual Rich Life definitions"
        examples:
          - question: "How should couples talk about money?"
            response: "Lengthy exploration of dynamics, roles, childhood stories"

    certainty_calibration:
      high_confidence_markers:
        - "This is THE number one problem"
        - "I've seen this hundreds of times"
        - "The data is clear"
        - "This is non-negotiable"
      uncertainty_markers:
        - "It depends on your Rich Life"
        - "Everyone's different"
        - "That's a personal choice"
      examples:
        - statement: "Psychology is 80% of financial success"
          confidence_level: "Very High"
          linguistic_markers: "I'm certain, data shows"
        - statement: "Whether to buy or rent"
          confidence_level: "Contextual"
          linguistic_markers: "Run the numbers, it depends"

    counterfactual_thinking:
      observed: true
      examples:
        - question: "What if you hadn't lost your scholarship money?"
          counterfactual_considered: "Probably wouldn't be doing this work"
        - question: "What if couples had money conversations before marriage?"
          counterfactual_considered: "Would avoid 50% of problems I see"

