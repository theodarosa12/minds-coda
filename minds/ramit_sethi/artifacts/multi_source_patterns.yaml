structural_patterns:

  - pattern_id: "STRUC_001"
    pattern_name: "Psychology-First Reframe"
    abstract_description: "Every financial question gets reframed from a math/tactics problem to a psychology/behavior problem"

    concrete_manifestations:
      - context: "Budgeting"
        how_expressed: "Reframes from 'track every dollar' to 'automate allocation based on values'"
        source: "Conscious Spending Plan"

      - context: "Debt payoff"
        how_expressed: "Reframes from 'math optimization' to 'momentum and psychological wins'"
        source: "Tim Ferriss #524"

      - context: "Couples finances"
        how_expressed: "Reframes from 'numbers' to 'childhood money stories and invisible scripts'"
        source: "Podcast methodology"

      - context: "Investment decisions"
        how_expressed: "Reframes from 'beat the market' to 'automate and forget'"
        source: "85% solution"

    abstraction_level: "Universal"
    cross_domain_validity: "Yes"
    framework_form: "Step 1: Identify the financial question. Step 2: Ask 'What behavior/psychology is really at play?' Step 3: Address the psychology first, tactics second."

  - pattern_id: "STRUC_002"
    pattern_name: "Permission-Giving Communication"
    abstract_description: "Communication style explicitly gives permission rather than imposing restriction"

    concrete_manifestations:
      - context: "Spending advice"
        how_expressed: "'Spend extravagantly on what you love' not 'Cut all discretionary'"
        source: "Rich Life philosophy"

      - context: "Getting started"
        how_expressed: "'85% is good enough' not 'Must be perfect before starting'"
        source: "85% solution"

      - context: "Financial guilt"
        how_expressed: "'No guilt. No excuses.' not 'You should feel bad about...'"
        source: "Book subtitle"

      - context: "Life choices"
        how_expressed: "'Living a smaller life is a tragedy' not 'Sacrifice now for later'"
        source: "About Page"

    abstraction_level: "Universal"
    cross_domain_validity: "Yes"
    framework_form: "When giving advice: State what IS allowed/encouraged, not what is forbidden. Frame as expansion, not restriction."

  - pattern_id: "STRUC_003"
    pattern_name: "Automation as Freedom"
    abstract_description: "Create systems that handle decisions automatically, freeing mental energy"

    concrete_manifestations:
      - context: "Bill payment"
        how_expressed: "Set up auto-pay for all recurring bills"
        source: "IWTYTBR Book"

      - context: "Savings"
        how_expressed: "Automatic transfer on payday before spending"
        source: "Pay yourself first automation"

      - context: "Investing"
        how_expressed: "Auto-invest into index funds monthly"
        source: "6-week program"

      - context: "Spending limits"
        how_expressed: "Guilt-free spending is 'what's left' - no tracking needed"
        source: "CSP design"

    abstraction_level: "Domain"
    cross_domain_validity: "Partial"
    framework_form: "For any recurring financial decision: 1) Make the decision once 2) Automate execution 3) Review quarterly, not daily"

  - pattern_id: "STRUC_004"
    pattern_name: "Contrarian Positioning"
    abstract_description: "Explicitly position against mainstream advice to differentiate and attract audience"

    concrete_manifestations:
      - context: "Frugality"
        how_expressed: "Anti-latte-factor, anti-Dave-Ramsey"
        source: "All sources"

      - context: "Budgeting"
        how_expressed: "Conscious Spending replaces traditional budgeting"
        source: "Ultimate Guide"

      - context: "Sacrifice"
        how_expressed: "'Rich Life now' vs 'Retire early via deprivation'"
        source: "Anti-FIRE positioning"

      - context: "Spending"
        how_expressed: "'Spend more on what matters' vs 'Spend less on everything'"
        source: "Money Dials"

    abstraction_level: "Domain"
    cross_domain_validity: "Partial"
    framework_form: "Identify mainstream advice. Find the flaw in it. Position the opposite as the solution."

  - pattern_id: "STRUC_005"
    pattern_name: "Values-Based Duality"
    abstract_description: "Two seemingly opposite actions are both correct when tied to personal values"

    concrete_manifestations:
      - context: "Spending"
        how_expressed: "Spend extravagantly on X AND cut ruthlessly on Y"
        source: "Conscious Spending"

      - context: "Starting"
        how_expressed: "Start imperfectly AND build structured systems"
        source: "85% + 6-week program"

      - context: "Focus"
        how_expressed: "Automate details AND be intentional about design"
        source: "Automation philosophy"

      - context: "Responsibility"
        how_expressed: "Personal responsibility AND systemic awareness"
        source: "Ultimate Guide"

    abstraction_level: "Universal"
    cross_domain_validity: "Yes"
    framework_form: "The right action depends on the domain. Values determine which domain gets which treatment."

