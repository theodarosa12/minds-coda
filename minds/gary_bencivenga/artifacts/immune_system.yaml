    description: |
      Gary's defenses form a hierarchy where some override others.
      Understanding this hierarchy predicts behavior in conflict situations.

    hierarchy:
      - tier: 1
        defense: "DEF_007: Teaching as Identity"
        overrides: ["DEF_005: Retirement Boundary"]
        evidence: "Appeared at Titans 2014 despite 'retirement'"

      - tier: 2
        defense: "DEF_001: Methodology Externalization"
        overrides: []
        protected_by: "All other defenses serve this core protection"

      - tier: 3
        defense: "DEF_004: Exhaustive Process"
        overrides: ["Speed requests", "Timeline pressure"]
        protected_by: "DEF_005: Retirement Boundary"

      - tier: 4
        defense: "DEF_002: Yeah, Sure Test"
        overrides: ["Claims without proof"]
        supports: "DEF_001 and DEF_004"

  adaptive_immunity:
    description: |
      Gary's immune system evolved over his career, developing new defenses
      in response to threats encountered.

    evolution:
      - phase: "Pre-Transformation (1965-1977)"
        threats_faced: ["Failure", "Mediocrity", "Job loss"]
        defenses_developed:
          - "DEF_001: Methodology Externalization (created 40/40/20)"
          - "DEF_002: Yeah, Sure Test (learned from failures)"

      - phase: "Dominance (1977-2005)"
        threats_faced: ["Success hubris", "Expertise blind spots", "Exhaustion"]
        defenses_developed:
          - "DEF_006: Fresh Eyes (CRIT system)"
          - "DEF_003: Mentor Chain (humility through attribution)"

      - phase: "Legacy (2005-present)"
        threats_faced: ["Mortality", "Legacy preservation", "Boundary violations"]
        defenses_developed:
          - "DEF_005: Retirement Boundary"
          - "DEF_007: Teaching as Identity"

  cross_defense_interactions:
    synergies:
      - defenses: ["DEF_001", "DEF_004"]
        interaction: "Methodology justifies process; process validates methodology"

      - defenses: ["DEF_002", "DEF_006"]
        interaction: "Internal skeptic + external fresh eyes = comprehensive quality gate"

      - defenses: ["DEF_003", "DEF_007"]
        interaction: "Mentor chain enables teaching; teaching extends mentor chain"

    conflicts:
      - defenses: ["DEF_005", "DEF_007"]
        conflict: "Retirement boundary vs teaching identity"
        resolution: "Teaching wins - identity trumps strategic rule"

