      duration: "30-60 minutes estimated"
      frequency: "Daily - non-negotiable"

      components:
        - activity: "Select ads to study"
          purpose: "Continuous exposure to persuasion patterns"
        - activity: "Ask two critical questions per ad"
          purpose: "Structured learning acceleration"
        - activity: "Study BOTH winning AND losing ads"
          purpose: "Learn from failure as well as success"
        - activity: "Absorb patterns for subconscious programming"
          purpose: "Train System 1 pattern recognition"

      behavioral_state_connection: "default_baseline_mode"
      state_connection_notes: |
        This routine maintains the default baseline state by continuously
        programming the subconscious. It's the 'maintenance' that keeps
        expertise sharp even without active projects.

      evidence:
        - source: "mined_content.yaml META_002"
          quote: "Daily ad study programs subconscious"
        - source: "mined_content.yaml BEH_001"
          quote: "Daily study of winning ads - daily ritual"
        - source: "mined_content.yaml BEH_003"
          quote: "Asking two critical questions per ad studied"
        - source: "mined_content.yaml BEH_004"
          quote: "Studying both winning AND losing ads"
        - source: "career-history-timeline.md"
          quote: "Learned from Prentice Hall copy chief to study both"

      connection_to_recognition:
        - pattern: "Headline evaluation"
          impact: "Maintains instant recognition speed"
        - pattern: "Proof assessment"
          impact: "Keeps 'yeah, sure' test calibrated"
        - pattern: "Copy structure"
          impact: "Reinforces Persuasion Equation chunking"

      trigger_protection:
        what_triggers: "Morning time block"
        what_protects: "Non-negotiable daily commitment"
        what_could_disrupt: "Travel, illness, major crisis"

      priority: "CRITICAL - Core maintenance ritual"

    - routine_id: "DAILY_002"
      name: "Morning Power Hours"
      description: |
        Protected time block in the morning for high-impact work before
        distractions. This is when cognitive resources are freshest and
        willpower is strongest.

      time_of_day: "Early morning"
      duration: "2-4 hours estimated"
      frequency: "Daily during active projects"

      components:
        - activity: "No interruptions permitted"
          purpose: "Deep work protection"
        - activity: "High-cognitive-load tasks"
          purpose: "Match task difficulty to energy level"
        - activity: "Creative or research work"
          purpose: "Use peak System 2 capacity"

      behavioral_state_connection: "deep_research_mode OR writing_creation_mode"
      state_connection_notes: |
        Morning power hours are the container for whatever state is currently
