        the ritual reinforces learner identity. This prevents the
        arrogance that expertise can bring.

      identity_statement: "Craftsman, not genius"
      boundary_function: "Separates 'doing' from 'being'"

      evidence:
        - "Maintained ritual throughout career, including after retirement"
        - "Part of 'missing piece' transformation"
        - "Programmed subconscious with daily exposure"

      abandonment_consequence: |
        Abandoning this ritual would signal abandonment of learner identity.
        It would also degrade System 1 pattern recognition over time.

    - ritual_id: "RIT_002"
      name: "40/40/20 as Sacred Ratio"
      functional_purpose: "Time allocation optimization"
      symbolic_meaning: |
        "Research matters" - the ritual of dedicating 40% to research
        before touching keyboard is a statement that understanding
        precedes expression.

      identity_statement: "Researcher, not hack"
      boundary_function: "Creates clear phase transitions"

      evidence:
        - "Never documented deviation from ratio"
        - "Would decline projects that couldn't accommodate it"
        - "748 hours = investment in quality"

      abandonment_consequence: |
        Abandoning this ratio would be abandoning core methodology.
