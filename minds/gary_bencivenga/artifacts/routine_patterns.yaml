        what_protects: "Discipline, no email/calls"
        what_could_disrupt: "Family emergencies, travel"

      priority: "CRITICAL - Peak productivity window"

    - routine_id: "DAILY_003"
      name: "Evening Problem Review"
      description: |
        Before sleep, review current problems/challenges to enable subconscious
        processing overnight. Part of the "sleep on it" methodology.

      time_of_day: "Evening, before sleep"
      duration: "10-20 minutes estimated"
      frequency: "Daily during active projects"

