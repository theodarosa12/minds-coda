routine_state_mapping:

  state_routine_connections:

    - state: "default_baseline_mode"
      primary_routines:
        - "DAILY_001 (Daily Ad Study)"
        - "DAILY_003 (Evening Problem Review)"
      routine_function: "Maintenance - keeps expertise calibrated"
      notes: |
        Default state is maintained by daily rituals. Without these routines,
        the baseline would degrade over time. The routines are the 'exercise'
        that keeps the cognitive muscles in shape.

    - state: "deep_research_mode"
      primary_routines:
        - "PROJECT_001 (40% Research Phase)"
        - "DAILY_002 (Morning Power Hours)"
      routine_function: "Structured immersion"
      notes: |
        Research state is expressed through the 40% routine. Morning power
        hours provide the container for deep work within this phase.

    - state: "writing_creation_mode"
      primary_routines:
        - "PROJECT_002 (40% Writing Phase)"
        - "DAILY_002 (Morning Power Hours)"
      routine_function: "Structured creation"
      notes: |
        Writing state uses same morning power hours container but different
        content. The routine provides structure; the state provides activity.

    - state: "skeptic_evaluator_mode"
      primary_routines:
        - "Self-critique sub-routine within PROJECT_002"
        - "CRIT review within PROJECT_003"
      routine_function: "Quality gate activation"
      notes: |
        Skeptic state doesn't have its own dedicated routine - it's an overlay
        that activates within other routines. It's woven into the fabric of
        the writing and polishing routines.

    - state: "teaching_transmission_mode"
      primary_routines:
        - "TEACH_001 (Bullets Writing)"
        - "TEACH_002 (Mentorship Interactions)"
      routine_function: "Knowledge transmission"
      notes: |
        Teaching state has both scheduled (Bullets) and spontaneous (mentorship)
        routines. The spontaneous nature of TEACH_002 shows that teaching is
        identity-triggered, not calendar-triggered.

    - state: "crit_feedback_mode"
      primary_routines:
        - "CRIT session sub-routine within PROJECT_003"
      routine_function: "Perspective gathering"
      notes: |
        CRIT state has a specific routine structure but occurs within the
        larger 20% polish phase. It's not daily but project-phase-bound.

    - state: "testing_measurement_mode"
      primary_routines:
        - "Post-campaign analysis (implicit)"
      routine_function: "Results validation"
      notes: |
        Testing state routine is the least documented. It appears to be
        triggered by results availability rather than scheduled time.

  routine_transition_patterns:

    - transition: "Morning → Research/Writing"
      pattern: "Wake → Power Hours → Deep Work"
      duration: "First 4-6 hours of day"
      state_sequence: "default → deep_research OR writing_creation"

    - transition: "Writing → Self-Critique"
      pattern: "Create → Review → Refine"
      duration: "End of each writing session"
      state_sequence: "writing_creation → skeptic_evaluator → writing_creation"

    - transition: "Draft → CRIT"
      pattern: "Complete draft → Gather feedback → Integrate"
      duration: "Multiple sessions during polish phase"
      state_sequence: "writing_creation → crit_feedback → skeptic_evaluator"

    - transition: "Evening → Subconscious"
      pattern: "Review problem → Sleep → Morning insight"
      duration: "Evening through next morning"
      state_sequence: "any_state → default_baseline → insight_emergence"

