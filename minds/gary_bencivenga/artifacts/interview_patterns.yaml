      - name: "The Mentor Chain"
        pattern: "Ancestor → Mentor → Self → Students"
        example: "Hopkins → Caples/Ogilvy → Bencivenga → Industry"

      - name: "The Obvious Reveal"
        pattern: "Complex problem → Exhaustive search → Simple solution"
        example: "748 hours → find the obvious answer"

