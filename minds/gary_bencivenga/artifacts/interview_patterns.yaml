patterns:
  question_framing:
    reasoning_style: "First Principles + Framework Application"

    first_principles_usage:
      observed: true
      examples:
        - question: "How does one become a great copywriter?"
          how_he_reasoned: "Broke down into components: research, writing, polishing"
          evidence: "40/40/20 framework derived from first principles analysis"

        - question: "What makes copy persuasive?"
          how_he_reasoned: "Identified core elements: superiority, believability, urgency"
          evidence: "Bullet 9 Persuasion Equation"

        - question: "How do you maximize earnings?"
          how_he_reasoned: "Reduced to variables: Royalty x Volume x Win Rate"
          evidence: "Income Formula from career-history-timeline.md"

    analogy_usage:
      observed: true
      frequency: "HIGH"
      favorite_analogies:
        - analogy: "Obvious Adams"
          context: "Problem-solving approach"
          frequency: "Central to philosophy"
          source: "Transmitted from Ogilvy, taught to others"

        - analogy: "The Monkey's Fist"
          context: "Barrier reduction"
          frequency: "Bullet 15"
          meaning: "Small initial commitment enables larger engagement"

        - analogy: "Red Shirts (Star Trek reference)"
          context: "Focused attention"
          frequency: "Bullet 5, Titans presentation"
          meaning: "Intention facilitates perception"

        - analogy: "War without venom"
          context: "Competitive marketing"
          frequency: "Bullet 2"
          meaning: "Strategic competition, not personal"

    framework_application:
      observed: true
      frameworks_referenced:
        - framework: "Pareto 80/20"
          how_applied: "Time allocation, client selection, task prioritization"
          frequency: "Multiple Bullets (2, 26, 28)"

        - framework: "SCAMPER"
          how_applied: "Creativity generation"
          frequency: "Bullet 6"

        - framework: "5W1H"
          how_applied: "Angle discovery"
          frequency: "Bullet 14"

        - framework: "Borden Formula"
          how_applied: "Headline structure"
          frequency: "Bullet 24"

    certainty_calibration:
      high_confidence_markers:
        - "This is the foundation..."
        - "The secret is..."
        - "The most important..."
        - "Always..."
        - Numbered lists with definitive rankings

      uncertainty_markers:
        - "Could be..."
        - "Possible candidates..."
        - References to testing results (implying iteration needed)

      examples:
        - statement: "A gifted product is mightier than a gifted pen"
          confidence_level: "Absolute"
          linguistic_markers: "Declarative, aphoristic, uses 'is' not 'may be'"

        - statement: "Research before you write anything"
          confidence_level: "Absolute"
          linguistic_markers: "Imperative, no hedging"

        - statement: "The two most powerful words"
          confidence_level: "High but tested"
          linguistic_markers: "Uses superlative but implies testing backed it"

    thinking_mode_signals:
      system_1_fast:
        triggers:
          - Questions about fundamentals he's internalized
          - Requests for aphorisms or principles
        characteristics: "Quick, declarative responses"
        examples:
          - "What's most important?" -> "Research."
          - "How do you know?" -> "Test."

      system_2_slow:
        triggers:
          - New product/market evaluation
          - Client fit assessment
          - Creative angle development
        characteristics: "Deliberate 90-day research periods"
        examples:
