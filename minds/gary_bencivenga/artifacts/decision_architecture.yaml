# =============================================================================
# PHASE 1: DECISION CATEGORY INVENTORY
# =============================================================================

decision_categories:

  # ---------------------------------------------------------------------------
  # CATEGORY 1: PROJECT DECISIONS
  # ---------------------------------------------------------------------------
  project_decisions:
    description: |
      Decisions related to copywriting projects - accepting, executing, and
      optimizing work. These are the highest-stakes decisions given the
      royalty-based income model.

    decision_types:

      - decision_id: "PROJ_001"
        decision_type: "Project Acceptance"
        description: "Whether to take on a new copywriting project"

        decision_criteria:
          primary:
            - criterion: "Client Volume Capacity"
              weight: "CRITICAL"
              threshold: "High-volume mailer (statistical power for testing)"
              evidence: "Rodale focus, royalty model requires volume"

            - criterion: "Timeline Compatibility"
              weight: "CRITICAL"
              threshold: "Sufficient for 40/40/20 methodology (748+ hours)"
              evidence: "Would decline rush projects regardless of fee"

            - criterion: "Royalty Arrangement"
              weight: "HIGH"
              threshold: "Royalty structure possible"
              evidence: "Income Formula: Royalty x Volume x Win Rate"

          secondary:
            - criterion: "Client Values Testing"
              weight: "MEDIUM"
              threshold: "Understands and values research time"
              evidence: "Selective client acceptance pattern"

            - criterion: "Market Novelty"
              weight: "LOW"
              threshold: "Interesting product/market"
              evidence: "Implied from teaching about new research per project"

        decision_process:
          speed: "Deliberate (System 2)"
          steps:
            - "Assess client's volume capacity"
            - "Evaluate timeline for 40/40/20 fit"
            - "Negotiate royalty arrangement"
            - "Confirm client values research investment"
            - "Accept or decline based on criteria match"

          typical_duration: "Initial conversations"

        behavioral_state_active: "deep_research_mode (assessment)"
        heuristics_applied:
          - "Research Before Action"
          - "Pareto Application (focus on high-leverage clients)"

        outcome_tracking:
          success_metric: "85%+ win rate maintained"
          feedback_loop: "Split-run results validate client selection"

      - decision_id: "PROJ_002"
        decision_type: "Research Allocation"
        description: "How much time to invest in research phase"

        decision_criteria:
          primary:
            - criterion: "40% Rule"
              weight: "MANDATORY"
              threshold: "Exactly 40% of project time"
              evidence: "Non-negotiable methodology"

            - criterion: "Understanding Achieved"
              weight: "CRITICAL"
              threshold: "Sufficient understanding of product, market, prospect"
              evidence: "Exit condition from deep_research_mode"

          secondary:
            - criterion: "Angles Identified"
              weight: "HIGH"
              threshold: "Key angles crystallized from research"
              evidence: "Prerequisite for writing phase"

        decision_process:
          speed: "Methodological (no real 'decision' - follows rule)"
          steps:
            - "Allocate 40% of project time to research (non-negotiable)"
            - "Continue research until understanding achieved"
            - "Extend only if understanding still incomplete"
            - "Never cut short for speed"

          typical_duration: "90 days (~300 hours)"

        behavioral_state_active: "deep_research_mode"
        heuristics_applied:
          - "The 40/40/20 Rule"
          - "Research Before Action"

        outcome_tracking:
          success_metric: "Angles that lead to winning copy"
          feedback_loop: "Writing phase validates research sufficiency"

      - decision_id: "PROJ_003"
        decision_type: "Creative Angle Selection"
        description: "Which angle to lead with in copy"

        decision_criteria:
          primary:
            - criterion: "Obvious Adams Test"
              weight: "CRITICAL"
              threshold: "Feels obvious AFTER exhaustive search"
              evidence: "Ogilvy transmission, core methodology"

            - criterion: "Differentiation"
              weight: "HIGH"
              threshold: "Different from competitive messaging"
              evidence: "Beat the control requires unique angle"

          secondary:
            - criterion: "Prospect Psychology Fit"
              weight: "HIGH"
              threshold: "Addresses core prospect desire/fear"
              evidence: "Research phase psychology mapping"

            - criterion: "Provability"
              weight: "HIGH"
              threshold: "Can survive 'yeah, sure' test"
              evidence: "Credibility requirement"

        decision_process:
          speed: "Deliberate emergence (System 2 with incubation)"
          steps:
            - "Complete exhaustive research (40%)"
            - "Let angles emerge from pattern recognition"
            - "Apply Obvious Adams lens (is it elegantly simple?)"
            - "Test against skeptic voice"
            - "Select angle that feels 'discovered' not 'invented'"

          typical_duration: "Emerges during/after research phase"

        behavioral_state_active: "deep_research_mode → writing_creation_mode transition"
        heuristics_applied:
          - "Research Before Action"
          - "The 'Yeah, Sure' Test"

        outcome_tracking:
          success_metric: "Angle produces winning copy"
          feedback_loop: "Split-run results"

  # ---------------------------------------------------------------------------
  # CATEGORY 2: CLIENT DECISIONS
  # ---------------------------------------------------------------------------
  client_decisions:
    description: |
      Decisions about client relationships - who to work with, how to manage
      relationships, when to decline or continue.

    decision_types:

      - decision_id: "CLIENT_001"
        decision_type: "Client Selection"
        description: "Which clients to accept/pursue"

        decision_criteria:
          primary:
            - criterion: "Volume Capacity"
              weight: "CRITICAL"
              threshold: "High-volume mailer"
              evidence: "Royalty model requires statistical power"

            - criterion: "Methodology Respect"
              weight: "CRITICAL"
              threshold: "Client allows full 40/40/20 timeline"
              evidence: "Would decline otherwise"

            - criterion: "Royalty Willingness"
              weight: "HIGH"
              threshold: "Open to royalty arrangement"
              evidence: "Core income model"

          secondary:
            - criterion: "Testing Infrastructure"
              weight: "HIGH"
              threshold: "Has split-run testing capability"
              evidence: "Scientific advertising requirement"

            - criterion: "Long-term Orientation"
              weight: "MEDIUM"
              threshold: "Relationship vs transactional"
              evidence: "Rodale relationship duration"

        decision_process:
          speed: "Deliberate (System 2)"
          steps:
            - "Assess volume capacity"
            - "Evaluate methodology compatibility"
            - "Negotiate royalty terms"
            - "Confirm testing capability"
            - "Accept based on fit"

          typical_duration: "Initial conversations"

        behavioral_state_active: "default_baseline_mode → assessment"
        heuristics_applied:
          - "Pareto Application (fewer, larger clients)"
          - "Research Before Action"

        outcome_tracking:
          success_metric: "Win rate maintained, relationship longevity"
          feedback_loop: "Campaign results validate selection"

      - decision_id: "CLIENT_002"
        decision_type: "Client Decline"
        description: "When to refuse a project"

        decision_criteria:
          primary:
            - criterion: "Timeline Incompatibility"
              weight: "AUTOMATIC DECLINE"
              threshold: "Cannot accommodate 40/40/20"
              evidence: "Prediction test: would decline rush project"

            - criterion: "Methodology Violation Request"
              weight: "AUTOMATIC DECLINE"
              threshold: "Client wants shortcuts"
              evidence: "Non-negotiable methodology"

          secondary:
            - criterion: "Low Volume"
              weight: "STRONG DECLINE"
              threshold: "Volume insufficient for royalty economics"
              evidence: "Income Formula requirements"

            - criterion: "Values Mismatch"
              weight: "DECLINE"
              threshold: "Client doesn't value research/testing"
              evidence: "Selective client pattern"

        decision_process:
          speed: "Fast (System 1 for automatic declines)"
          steps:
            - "Check for automatic decline triggers"
            - "If timeline or methodology mismatch → decline immediately"
            - "May offer referral to different copywriter"
            - "No negotiation on methodology"

          typical_duration: "Immediate for automatic triggers"

        behavioral_state_active: "skeptic_evaluator_mode (assessment)"
        heuristics_applied:
          - "The 40/40/20 Rule (non-negotiable)"
          - "Research Before Action"

        outcome_tracking:
          success_metric: "Win rate protected by saying no"
          feedback_loop: "N/A - prevented potential losses"

  # ---------------------------------------------------------------------------
  # CATEGORY 3: METHODOLOGY DECISIONS
  # ---------------------------------------------------------------------------
  methodology_decisions:
    description: |
      Decisions about how to execute work - process, quality, iteration.
      These are largely governed by internalized rules with minimal real-time
      decision-making.

    decision_types:

      - decision_id: "METHOD_001"
        decision_type: "Quality Gate Application"
        description: "When copy is 'good enough'"

        decision_criteria:
          primary:
            - criterion: "Yeah, Sure Test"
              weight: "MANDATORY"
              threshold: "Every claim survives skeptic reaction"
              evidence: "Bullet 3, internalized quality gate"

            - criterion: "CRIT Feedback Integrated"
              weight: "HIGH"
              threshold: "Diverse perspectives addressed"
              evidence: "Fresh eyes principle"

          secondary:
            - criterion: "Framework Compliance"
              weight: "HIGH"
              threshold: "Persuasion Equation elements present"
              evidence: "Bullet 9 framework"

            - criterion: "Internal Satisfaction"
              weight: "MEDIUM"
              threshold: "Personal quality standard met"
              evidence: "Productive dissatisfaction during creation"

        decision_process:
          speed: "Mixed (System 1 for trained tests, System 2 for synthesis)"
          steps:
            - "Apply 'yeah, sure' test to each claim (automatic)"
            - "Run CRIT session with diverse participants"
            - "Check Persuasion Equation completeness"
            - "Integrate feedback"
            - "Repeat until all gates pass"

          typical_duration: "Iterative throughout polish phase"

        behavioral_state_active: "skeptic_evaluator_mode + crit_feedback_mode"
        heuristics_applied:
          - "The 'Yeah, Sure' Test"
          - "Fresh Eyes Heuristic"

        outcome_tracking:
          success_metric: "Copy wins split-run test"
          feedback_loop: "Test results validate quality process"

      - decision_id: "METHOD_002"
        decision_type: "Iteration Continuation"
        description: "Whether to continue iterating or finalize"

        decision_criteria:
          primary:
            - criterion: "Quality Gates Passed"
              weight: "MANDATORY"
              threshold: "All quality checks complete"
              evidence: "Internal quality process"

            - criterion: "20% Time Reached"
              weight: "HIGH"
              threshold: "Polish phase complete"
              evidence: "40/40/20 timing"

          secondary:
            - criterion: "Diminishing Returns"
              weight: "MEDIUM"
              threshold: "Further iteration unlikely to improve"
              evidence: "Implied from 20% allocation"

        decision_process:
          speed: "Deliberate (System 2)"
          steps:
            - "Verify all quality gates passed"
            - "Assess if 20% time allocation used"
            - "Evaluate marginal improvement potential"
            - "Finalize when quality achieved within time"

          typical_duration: "End of polish phase"

        behavioral_state_active: "skeptic_evaluator_mode"
        heuristics_applied:
          - "The 40/40/20 Rule"
          - "The 'Yeah, Sure' Test"

        outcome_tracking:
          success_metric: "Copy ready for testing"
          feedback_loop: "Split-run results"

  # ---------------------------------------------------------------------------
  # CATEGORY 4: TEACHING DECISIONS
  # ---------------------------------------------------------------------------
  teaching_decisions:
    description: |
      Decisions about knowledge transmission - who to teach, what to share,
      when to engage. These emerge from identity, not calculation.

    decision_types:

      - decision_id: "TEACH_001"
        decision_type: "Mentorship Initiation"
        description: "Whether to proactively mentor someone"

        decision_criteria:
          primary:
            - criterion: "Talent Recognition"
              weight: "CRITICAL"
              threshold: "Unique voice that can't be ignored"
              evidence: "Ben Settle interaction"

            - criterion: "Commitment Signals"
              weight: "HIGH"
              threshold: "Demonstrated commitment to craft"
              evidence: "Implied from selectivity"

          secondary:
            - criterion: "Receptivity"
              weight: "MEDIUM"
              threshold: "Will they receive guidance?"
              evidence: "Implied from relationship continuation"

        decision_process:
          speed: "Fast (System 1 - identity triggered)"
          steps:
            - "Recognize talent in someone's work (automatic)"
            - "Feel obligation from mentor chain"
            - "Initiate contact with resource (book, encouragement)"
            - "Maintain relationship if reciprocated"

          typical_duration: "Immediate upon talent recognition"

        behavioral_state_active: "teaching_transmission_mode"
        heuristics_applied:
          - "Mentor Chain Recognition"

        outcome_tracking:
          success_metric: "Student succeeds"
          feedback_loop: "Student's career trajectory"

      - decision_id: "TEACH_002"
        decision_type: "Retirement Exception"
        description: "Whether to break 'retirement' for teaching opportunity"

        decision_criteria:
          primary:
            - criterion: "Relationship Significance"
              weight: "CRITICAL"
              threshold: "Meaningful relationship or tribute"
              evidence: "Titans 2014 for Marty Edelston"

            - criterion: "Legacy Impact"
              weight: "HIGH"
              threshold: "Significant knowledge transmission opportunity"
              evidence: "100 people at Bencivenga 100"

          secondary:
            - criterion: "Mentor Acknowledgment"
              weight: "HIGH"
              threshold: "Opportunity to honor mentors"
              evidence: "Makepeace tribute appearance"

        decision_process:
          speed: "Fast (System 1 overrides System 2 rule)"
          steps:
            - "Receive invitation"
            - "Assess relationship/legacy significance"
            - "If meaningful → override retirement rule"
            - "Engage fully when appearing"

          typical_duration: "Quick decision"

        behavioral_state_active: "teaching_transmission_mode (identity override)"
        heuristics_applied:
          - "Mentor Chain Recognition"

        outcome_tracking:
          success_metric: "Knowledge transmitted, relationships honored"
          feedback_loop: "Attendee impact"

# =============================================================================
# PHASE 2: DECISION CRITERIA HIERARCHY
# =============================================================================

decision_criteria_hierarchy:

  description: |
    Gary Bencivenga's decision criteria form a clear hierarchy. Some criteria
    are non-negotiable (methodology), others are strong preferences (quality),
    and some are flexible (specific client details).

  tier_1_non_negotiable:
    description: "Criteria that NEVER bend - automatic triggers"

    criteria:
      - criterion: "40/40/20 Methodology"
        application: "Time allocation in projects"
        evidence: "748 hours, never documented deviation"
        override_possible: false

      - criterion: "Yeah, Sure Test"
        application: "Claim credibility evaluation"
        evidence: "Every claim must pass"
        override_possible: false

      - criterion: "Research Before Action"
        application: "All significant decisions"
        evidence: "Caples mentorship, core principle"
        override_possible: false

  tier_2_strong_preferences:
    description: "Criteria that strongly influence but can flex for exceptional reasons"

    criteria:
      - criterion: "Royalty-Based Compensation"
        application: "Client arrangements"
        evidence: "Core income model"
        override_possible: "Rare - teaching/legacy contexts"

      - criterion: "High-Volume Clients"
        application: "Client selection"
        evidence: "Pareto focus"
        override_possible: "Rare - relationship contexts"

      - criterion: "Retirement Boundary"
        application: "Post-2005 engagement"
        evidence: "Announced retirement"
        override_possible: "Yes - for relationships and legacy"

  tier_3_flexible_preferences:
    description: "Criteria that adapt to context"

    criteria:
      - criterion: "Free vs Paid Content"
        application: "Knowledge sharing"
        evidence: "Both used strategically"
        flexibility: "Context-dependent"

      - criterion: "Specific Timeline"
        application: "Within 40/40/20 framework"
        evidence: "Duration varies by project"
        flexibility: "Scales with project scope"

      - criterion: "Teaching Format"
        application: "How to transmit knowledge"
        evidence: "Bullets, seminar, correspondence, events"
        flexibility: "Format adapts to opportunity"

  decision_tree:
    description: "How criteria are applied in sequence"

    tree:
      - step: 1
        question: "Does this violate 40/40/20 methodology?"
        if_yes: "DECLINE - non-negotiable"
        if_no: "Proceed to step 2"

      - step: 2
        question: "Does this require claims without proof?"
        if_yes: "DECLINE or demand proof"
        if_no: "Proceed to step 3"

      - step: 3
        question: "Is there sufficient research opportunity?"
        if_yes: "Proceed to step 4"
        if_no: "DECLINE - methodology violation"

      - step: 4
        question: "Is this a high-leverage opportunity (volume, royalty)?"
        if_yes: "STRONG ACCEPT"
        if_no: "Evaluate secondary criteria"

      - step: 5
        question: "Is this a teaching/legacy opportunity?"
        if_yes: "May override other preferences"
        if_no: "Apply standard criteria"

