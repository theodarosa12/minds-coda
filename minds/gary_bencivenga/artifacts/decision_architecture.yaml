# =============================================================================
# PHASE 4: HEURISTIC APPLICATION PATTERNS
# =============================================================================

heuristic_application:

  description: |
    How Gary's 7 core heuristics apply to specific decision types.
    Maps heuristic → decision context → typical application.

  heuristics:

    - heuristic: "The 40/40/20 Rule"
      trigger_contexts:
        - "Any major copywriting project"
        - "Time allocation decisions"
        - "Project scoping"
      application_pattern: |
        Automatically allocate 40% research, 40% writing, 20% polishing.
        No real-time decision required - rule is absolute.
      accuracy: "Very high - tested over decades"
      bias_risk: "May over-invest in low-stakes projects"
      mitigation: "Client selection filters for appropriate projects"

    - heuristic: "The 'Yeah, Sure' Test"
      trigger_contexts:
        - "Evaluating any claim in copy"
        - "Assessing credibility"
        - "Quality gate decisions"
      application_pattern: |
        Run each claim through skeptic's sarcastic reaction filter.
        If internal voice says "yeah, sure" → claim needs more proof.
        Binary decision: pass or fail, no middle ground.
      accuracy: "Very high - catches weak proof"
      bias_risk: "May be overly conservative"
      mitigation: "CRIT feedback provides additional perspective"

    - heuristic: "Research Before Action"
      trigger_contexts:
        - "Any new project or problem"
        - "Creative decisions"
        - "Client evaluation"
      application_pattern: |
        Default to investigation before any action.
        Never write without understanding.
        Never commit without assessment.
      accuracy: "Very high"
      bias_risk: "Analysis paralysis in time-sensitive situations"
      mitigation: "40/40/20 creates time boundary"

    - heuristic: "Mentor Chain Recognition"
      trigger_contexts:
        - "Teaching or credibility establishment"
        - "Knowledge transmission"
        - "Legacy decisions"
      application_pattern: |
        Identify and acknowledge intellectual lineage.
        Hopkins → Caples → Ogilvy → Bencivenga → Students.
        Teaching decision includes obligation to transmit.
      accuracy: "High - shows humility and legitimacy"
      bias_risk: "Over-reliance on authority"
      mitigation: "Testing validates principles beyond authority"

    - heuristic: "Fresh Eyes Heuristic"
      trigger_contexts:
        - "Quality review process"
        - "Copy evaluation"
        - "Blind spot detection"
      application_pattern: |
        Include non-experts for perspective experts miss.
        Receptionists, art directors, account executives in CRIT.
        Actively seek perspectives that challenge expertise.
      accuracy: "High - catches blind spots"
      bias_risk: "May weight non-expert opinion too highly"
      mitigation: "Expert judgment synthesizes all feedback"

    - heuristic: "Control Is Your Enemy"
      trigger_contexts:
        - "Success/completion"
        - "Complacency risk"
        - "Repeat projects"
      application_pattern: |
        Treat previous wins as challenges to beat, not rest on.
        Success triggers risk recognition, not security.
        Every control is a target to surpass.
      accuracy: "High - drives continuous improvement"
      bias_risk: "Never satisfied, potential burnout"
      mitigation: "Retirement eventually taken"

    - heuristic: "Pareto Application"
      trigger_contexts:
        - "Prioritization decisions"
        - "Client selection"
        - "Time allocation within phases"
      application_pattern: |
        Identify 20% of activities driving 80% of results.
        Focus on high-leverage clients (fewer, larger).
        Prioritize highest-impact tasks.
      accuracy: "High for resource allocation"
      bias_risk: "May undervalue long-tail activities"
      mitigation: "Teaching represents long-tail investment"

# =============================================================================
# PHASE 5: TRADEOFF RESOLUTION PATTERNS
# =============================================================================

tradeoff_resolution:

  description: |
    How Gary resolves competing priorities. Each tradeoff has a default
    resolution and exception conditions.

  tradeoffs:

    - tradeoff_id: "TRADE_001"
      tradeoff: "Speed vs Quality"
      competing_values:
        - "Speed: Faster delivery, more projects, client satisfaction"
        - "Quality: Thorough research, tested copy, win rate"

      default_resolution: "Quality ALWAYS wins"
      evidence: "748 hours per project, would decline rush projects"

      exception_conditions: "None documented - this is non-negotiable"
      exception_examples: []

      decision_rule: |
        If timeline doesn't allow full quality process → decline project.
        Never compromise methodology for speed.

    - tradeoff_id: "TRADE_002"
      tradeoff: "Quantity vs Quality (Clients)"
      competing_values:
        - "Quantity: More clients, more income streams, diversification"
        - "Quality: Fewer clients, deeper relationships, higher win rate"

      default_resolution: "Quality (fewer, larger clients)"
      evidence: "Rodale focus, selective acceptance"

      exception_conditions: "None documented"
      exception_examples: []

      decision_rule: |
        Focus on high-volume clients that allow full methodology.
        Decline clients that can't accommodate quality process.

    - tradeoff_id: "TRADE_003"
      tradeoff: "Free vs Paid Content"
      competing_values:
        - "Free: Legacy building, wider impact, teaching identity"
        - "Paid: Revenue, perceived value, serious students filter"

      default_resolution: "BOTH - different purposes"
      evidence: "Free Bullets newsletter + $5,000 DVDs"

      exception_conditions: "N/A - deliberate dual strategy"
      exception_examples:
        - "Bullets: Free for wide transmission"
        - "Bencivenga 100 DVDs: Paid for serious students"

      decision_rule: |
        Free content serves teaching identity and legacy.
        Paid content ensures serious audience and protects value.
        Both serve knowledge transmission through different mechanisms.

    - tradeoff_id: "TRADE_004"
      tradeoff: "Retirement vs Engagement"
      competing_values:
        - "Retirement: Rest, recovery, no production grind"
        - "Engagement: Teaching, legacy, relationship honoring"

      default_resolution: "Retirement from production, not teaching"
      evidence: "Announced retirement but continued teaching"

      exception_conditions:
        - "Meaningful relationships (Marty Edelston tribute)"
        - "Legacy opportunities (Titans 2014)"
        - "Mentor chain obligations"
      exception_examples:
        - event: "Titans of Direct Response 2014"
          justification: "Honoring Marty Edelston - relationship trumps rule"
        - event: "Clayton Makepeace tribute"
          justification: "Honoring peer - relationship trumps rule"

      decision_rule: |
        Default to retirement boundary for production work.
        Override for teaching/legacy opportunities where relationships matter.
        Teaching is identity, not work - can't retire from identity.

    - tradeoff_id: "TRADE_005"
      tradeoff: "Expert Study vs Fresh Eyes"
      competing_values:
        - "Expert Study: Learn from masters (Caples, Ogilvy)"
        - "Fresh Eyes: Include non-experts for blind spot detection"

      default_resolution: "BOTH - different phases"
      evidence: "Studied masters AND used receptionists in CRIT"

      exception_conditions: "N/A - complementary strategies"
      exception_examples:
        - "Learning phase: Study masters"
        - "Evaluation phase: Include fresh eyes"

      decision_rule: |
        In learning mode → study masters.
        In evaluation mode → include non-experts.
        Expertise has value AND creates blind spots - both true.

    - tradeoff_id: "TRADE_006"
      tradeoff: "Income vs Impact (Post-Security)"
      competing_values:
        - "Income: Maximize financial return"
        - "Impact: Maximize knowledge transmission"

      default_resolution: "Impact wins after security achieved"
      evidence: "Free Bullets, generous mentorship post-retirement"

      exception_conditions: "Only applies post-financial-security"
      exception_examples:
        - "Free newsletter despite potential paid subscription"
        - "Sending books to strangers showing talent"

      decision_rule: |
        Pre-security: Balance income and impact (royalty model does both).
        Post-security: Impact becomes primary currency.
        Legacy outlasts income.

# =============================================================================
# PHASE 6: PROSPECT THEORY IN DECISIONS
# =============================================================================

prospect_theory_application:

  description: |
    How Kahneman's Prospect Theory manifests in Gary's decision-making.
    Loss aversion, reference points, and certainty effects.

  loss_aversion_in_decisions:

    - domain: "Reputation/Win Rate"
      loss_aversion_ratio: "3:1"
      description: "Will invest heavily to avoid reputation loss"
      evidence:
        - "748 hours to avoid losing split-run test"
        - "Would decline project rather than risk loss"
        - "Never compromised methodology despite pressure"
      decision_implications: |
        Extremely conservative on reputation risks.
        Will decline lucrative projects if win rate at risk.
        Massive investment to maintain 85%+ win rate.

    - domain: "Methodology Integrity"
      loss_aversion_ratio: "Infinite (non-negotiable)"
      description: "Cannot trade methodology for any gain"
      evidence:
        - "40/40/20 never compromised"
        - "Declined rush projects regardless of fee"
      decision_implications: |
        Methodology is not a decision - it's a constraint.
        No amount of gain justifies methodology loss.

    - domain: "Financial (Post-Security)"
      loss_aversion_ratio: "1:1 or lower"
      description: "Minimal financial loss aversion after security achieved"
      evidence:
        - "Free Bullets newsletter"
        - "Sending books without expectation"
        - "Time investment in mentorship"
      decision_implications: |
        Financial considerations secondary to impact.
        Willing to "lose" money for legacy gains.

  reference_point_shifting:

    - decision_context: "Project Success"
      reference_point: "Beat the existing control"
      above_reference: "Win (gain)"
      below_reference: "Lose (devastating loss)"
      decision_implication: "Every project evaluated against control"

    - decision_context: "Career Standard"
      reference_point: "Never lost at Rodale"
      above_reference: "Continued excellence"
      below_reference: "First loss would be identity threat"
      decision_implication: "Reference point prevents complacency"

    - decision_context: "Teaching Impact"
      reference_point: "Mentor chain preserved"
      above_reference: "Students who exceed expectations"
      below_reference: "Wisdom dying with him"
      decision_implication: "Teaching decisions driven by legacy preservation"

  certainty_effect_in_decisions:

    - context: "Project Methodology"
      certainty_preference: "STRONG"
      description: "40/40/20 provides certainty in uncertain creative process"
      evidence: "Methodology is the certain part in uncertain outcomes"
      decision_implication: "Will always choose methodological certainty"

    - context: "Testing"
      certainty_preference: "STRONG"
      description: "Testing reduces uncertainty about copy effectiveness"
      evidence: "Split-run testing obsession"
      decision_implication: "Data-based certainty over intuition"

    - context: "Client Selection"
      certainty_preference: "STRONG"
      description: "Selective acceptance provides certain fit"
      evidence: "Would rather have no project than uncertain project"
      decision_implication: "Certainty of fit over quantity of opportunity"

