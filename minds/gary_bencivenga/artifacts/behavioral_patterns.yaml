        - "Multiple sources consulted systematically"
        - "Note-taking and pattern extraction"
        - "Prospect psychology immersion"
        - "Product testing and personal use when possible"

      cognitive_characteristics:
        system_dominance: "System 2"
        attention_pattern: "Deep focused / Absorptive"
        decision_style: "Deliberate - no shortcuts"
        mental_operations:
          - "Pattern recognition across sources"
          - "Hypothesis generation about prospects"
          - "Question formulation"

      emotional_tone:
        primary: "Curiosity"
        secondary: "Patience"
        underlying: "Disciplined excitement"

      triggers:
        environmental:
