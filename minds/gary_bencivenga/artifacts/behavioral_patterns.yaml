# =============================================================================
state_transitions:

  key_transitions:
    - from_state: "default_baseline_mode"
      to_state: "deep_research_mode"
      transition_triggers:
        - trigger: "New project commitment"
          speed: "Immediate"
          voluntary: true
      transition_friction:
        ease: "Easy"
        resistance: "None - this is the methodology"
        facilitators: "Project commitment, royalty structure"
      reversal:
        possible: true
        trigger: "Project completion or cancellation"

    - from_state: "deep_research_mode"
      to_state: "writing_creation_mode"
      transition_triggers:
        - trigger: "Research 40% complete, understanding achieved"
          speed: "Gradual"
          voluntary: true
      transition_friction:
        ease: "Moderate"
        resistance: "May extend research if understanding incomplete"
        facilitators: "Clear angles emerging, time pressure"
      reversal:
        possible: true
        trigger: "Discovery of knowledge gap during writing"

    - from_state: "writing_creation_mode"
      to_state: "skeptic_evaluator_mode"
      transition_triggers:
        - trigger: "Claim written that needs proof"
          speed: "Immediate (overlay)"
          voluntary: false
      transition_friction:
        ease: "Very easy"
        resistance: "None - automatic quality gate"
        facilitators: "Internalized 'yeah, sure' habit"
      reversal:
        possible: true
        trigger: "Claim passes test, return to writing"

    - from_state: "writing_creation_mode"
      to_state: "crit_feedback_mode"
      transition_triggers:
        - trigger: "Draft ready for review"
          speed: "Immediate"
          voluntary: true
      transition_friction:
        ease: "Easy"
        resistance: "Ego (overcome by methodology)"
        facilitators: "CRIT system structure, team availability"
      reversal:
        possible: true
        trigger: "Feedback collected, return to revision"

    - from_state: "any_active_state"
      to_state: "teaching_transmission_mode"
      transition_triggers:
        - trigger: "Teachable moment recognized"
          speed: "Immediate"
          voluntary: true
        - trigger: "Legacy event opportunity"
          speed: "Immediate"
          voluntary: true
      transition_friction:
        ease: "Very easy"
        resistance: "None - core identity"
        facilitators: "Talent recognition, question received"
      reversal:
        possible: true
        trigger: "Teaching complete, external interruption"

    - from_state: "testing_measurement_mode"
      to_state: "deep_research_mode"
      transition_triggers:
        - trigger: "Test results reveal new question"
          speed: "Gradual"
          voluntary: true
      transition_friction:
        ease: "Easy"
        resistance: "None - continuous improvement"
        facilitators: "Data that challenges assumptions"
      reversal:
        possible: true
        trigger: "New understanding achieved"

  transition_matrix:
    # Ease of transition: VE=Very Easy, E=Easy, M=Moderate, D=Difficult, VD=Very Difficult
    #                    default  research  writing  skeptic  teaching  crit  testing
    default_baseline:      "-"      "VE"      "M"       "E"      "VE"    "E"     "E"
    deep_research:        "M"       "-"       "E"       "E"      "VE"    "M"     "E"
    writing_creation:     "D"       "E"       "-"       "VE"     "VE"    "E"     "M"
    skeptic_evaluator:    "E"       "E"       "VE"      "-"      "E"     "E"     "E"
    teaching_transmission:"E"       "M"       "M"       "E"      "-"     "M"     "M"
    crit_feedback:        "E"       "E"       "VE"      "E"      "E"     "-"     "E"
    testing_measurement:  "E"       "E"       "E"       "E"      "E"     "E"     "-"

  sticky_states:
    - state: "teaching_transmission_mode"
      stickiness: "High"
      reason: "Core identity - hard to exit mid-teaching"
      exit_difficulty: "Can override for high-stakes project only"

    - state: "deep_research_mode"
      stickiness: "High"
      reason: "Methodology demands completion"
      exit_difficulty: "Won't exit until understanding achieved"

# =============================================================================
# PHASE 8: VALIDATION & PREDICTION
# =============================================================================
validation:

  prediction_tests:
    - scenario: "A young copywriter emails Gary asking for career advice"
      predicted_state: "teaching_transmission_mode"
      predicted_behaviors:
        - "Story about his own 12-year transformation"
        - "Framework recommendation (40/40/20)"
        - "Possible unsolicited resource (book, article)"
        - "Mentor chain acknowledgment"
      confidence: 95
      reasoning: "Pattern matches Ben Settle interaction, core identity"

    - scenario: "Client offers rush project with high fee but impossible timeline"
      predicted_state: "Rejection / No engagement"
      predicted_behaviors:
        - "Decline the project"
        - "Explanation that methodology requires time"
        - "Possible referral to someone who works differently"
      confidence: 90
      reasoning: "40/40/20 is non-negotiable; never compromised methodology"

    - scenario: "Split-test results show his copy lost to control"
      predicted_state: "testing_measurement_mode -> deep_research_mode"
      predicted_behaviors:
        - "Accept result without excuse"
        - "Analyze why loss occurred"
        - "Increase research on next iteration"
        - "Apply CRIT for fresh perspective"
      confidence: 85
      reasoning: "Data beats ego; 'Control is your enemy' mindset"

    - scenario: "Interviewer asks about his natural talent"
      predicted_state: "teaching_transmission_mode"
      predicted_behaviors:
        - "Correction: 'I was NOT a natural'"
        - "12-year transformation story"
        - "Methodology over talent thesis"
        - "Mentor acknowledgment"
      confidence: 98
      reasoning: "Core narrative, repeated in every source"

    - scenario: "Someone claims great results without testing"
      predicted_state: "skeptic_evaluator_mode"
      predicted_behaviors:
        - "Internal 'yeah, sure' reaction"
        - "Questions about proof"
        - "Reference to testing imperative"
      confidence: 90
      reasoning: "Testing obsession, proof over claims"

  contradiction_resolution:
    - apparent_contradiction: "Gave away free content AND charged $5,000 for DVDs"
      resolution: "Different states serve different purposes"
      explanation: |
        In teaching_transmission_mode, generosity is default (free Bullets).
        Premium pricing ensures serious students and protects perceived value.
        Both serve knowledge transmission goal through different mechanisms.

    - apparent_contradiction: "Said 'retired' but kept appearing at events"
      resolution: "Retired from production, not from teaching state"
      explanation: |
        Retirement was from deep_research_mode and writing_creation_mode
        (the 748-hour grind). Teaching_transmission_mode IS identity,
        not work - cannot retire from who you are.

    - apparent_contradiction: "Advised studying masters, used non-experts in CRIT"
      resolution: "Different states require different inputs"
      explanation: |
        In learning_mode (deep_research), study masters.
        In crit_feedback_mode, include non-experts for fresh eyes.
        Expertise has value AND creates blind spots - both true.

  accuracy_estimate: 92

  gaps_identified:
    - gap: "Stress response states not directly observable"
      impact: "LOW - sources suggest minimal observable stress response"
      mitigation: "Infer from 'never lost at Rodale' - suggests adaptive stress handling"

    - gap: "Private/family states not documented"
      impact: "LOW - focus is professional clone"
      mitigation: "Acceptable scope limitation"

    - gap: "Real-time decision-making not observable"
      impact: "MEDIUM - reconstructed from outcomes"
      mitigation: "Methodology (40/40/20) reduces real-time decisions"

# =============================================================================
# LINEAGE & METHODOLOGY
# =============================================================================
lineage:
  sources_used:
    - "mined_content.yaml (47 extractions)"
    - "interview_patterns.yaml (6 interviews analyzed)"
    - "multi_source_patterns.yaml (28 patterns)"
    - "cross_reference_validation.yaml"
    - "expert_map.yaml"
    - "source_triangulation.yaml"
    - "knowledge_gaps.yaml"
    - "sources-master.yaml"
    - "Source materials (6 web documents)"

  methodology: "Kahneman Dual-Process Theory + Prospect Theory + State-Based Mapping"
  agent: "daniel-behavioral-analyst"

  methodology_notes: |
    This analysis follows Kahneman's insight that people don't have ONE personality
    but rather STATES that activate contextually. Each state has:
    - Specific triggers (environmental, internal, social, task)
    - Characteristic behaviors
    - Cognitive patterns (System 1 vs System 2)
    - Transition rules

    Gary Bencivenga's behavioral architecture is remarkably consistent:
    1. Strong methodology-driven states (40/40/20)
    2. Teaching as core identity (not work)
    3. Skeptic voice as internalized quality gate
    4. Testing/measurement as epistemic foundation
    5. Fresh eyes principle to counter expertise blind spots

    This allows prediction of behavior in novel contexts with high confidence.

# =============================================================================
# SUMMARY
# =============================================================================
summary:
  total_states_identified: 7
  core_states:
    - deep_research_mode
    - writing_creation_mode
    - skeptic_evaluator_mode
    - teaching_transmission_mode

  key_findings:
    - finding: "Teaching is identity state, not work state"
      confidence: 95
      implications: "Can't 'retire' from core identity - explains post-retirement behavior"

    - finding: "Skeptic voice is internalized overlay state"
      confidence: 90
      implications: "'Yeah, sure' test runs automatically during and after creation"

    - finding: "40/40/20 creates predictable state sequence"
      confidence: 95
      implications: "Research -> Writing -> Polish is mandatory, non-negotiable"

    - finding: "Fresh eyes principle is deliberate counter to expertise blindspots"
      confidence: 90
      implications: "Actively seeks non-expert feedback despite being expert"

    - finding: "Loss aversion shifts with security achievement"
      confidence: 85
      implications: "Post-security, reputation loss aversion >> financial loss aversion"

  clone_construction_readiness: "EXCELLENT"
  confidence_for_behavioral_replication: 92

  recommendations_for_phase_2_next_tasks:
    - "Use state inventory for recognition-patterns-analysis"
    - "Use dual-process profile for decision-architecture-analysis"
    - "Use trigger map for routine-patterns-analysis"
    - "Consider loss aversion patterns in immune-system-analysis"
