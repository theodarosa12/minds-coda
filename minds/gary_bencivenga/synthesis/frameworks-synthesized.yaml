  # ---------------------------------------------------------------------------
  # FRAMEWORK 8: The CRIT System
  # ---------------------------------------------------------------------------
  - id: "FW_008"
    name: "The CRIT System"
    tier: "OPERATIONAL"
    type: "Quality Assurance Framework"

    core_formula:
      participants: "Diverse perspectives including non-experts"
      process: "Everyone critiques for grammar, psychology, readability, persuasiveness"
      key_insight: "Fresh eyes catch what expertise blinds"

    description: |
      Collaborative critique involving diverse perspectives. Include
