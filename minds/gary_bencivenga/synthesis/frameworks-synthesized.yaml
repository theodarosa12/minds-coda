# =============================================================================

master_frameworks:

  # ---------------------------------------------------------------------------
  # FRAMEWORK 1: The 40/40/20 Methodology
  # ---------------------------------------------------------------------------
  - id: "FW_001"
    name: "The 40/40/20 Methodology"
    tier: "MASTER"
    type: "Process Framework"

    core_formula:
      research: "40%"
      execution: "40%"
      polish: "20%"
      total_hours_per_project: "748+"

    description: |
      Time allocation framework that governs all major project work.
      Understanding MUST precede execution. Execution MUST precede refinement.
      This is not a suggestion - it's the operating system.

    derived_from:
      mental_models: ["MM_001 (40/40/20)", "MM_010 (Methodology Over Talent)"]
      values: ["Craftsmanship Over Speed", "Methodology Over Talent"]
      obsessions: ["OBS_001 (Research Power)"]
      mentor_source: "John Caples teaching at BBDO"

    applications:
      - context: "Any major copywriting project"
        application: "Allocate 300 hours research, 300 hours writing, 150 hours polish"
      - context: "Quick projects"
        application: "Scale proportionally but never skip phases"
      - context: "Teaching"
        application: "Always emphasize research-first approach"

    when_to_apply: "Every project, every time, no exceptions"

    when_NOT_to_apply:
      - "Simple revisions of existing work"
      - "Not applicable - this is always applied"

    cross_domain_applications:
      - domain: "Business decisions"
        application: "40% understanding, 40% planning, 20% execution"
      - domain: "Learning new skills"
        application: "40% studying, 40% practicing, 20% refining"
      - domain: "Relationship building"
        application: "40% listening, 40% engaging, 20% maintaining"

    interconnections:
      reinforces: ["FW_002 (Yeah Sure Test)", "FW_003 (Obvious Adams)"]
      prerequisite_for: ["FW_005 (Persuasion Equation)"]
      tension_with: ["Speed demands", "Impatient clients"]

    anti_patterns:
      - "Skipping research to write faster"
      - "Treating research as optional"
      - "60/30/10 or any other ratio"
      - "Starting writing before understanding"

    validation_gates:
      - "Have I spent 40% of available time on research?"
      - "Do I understand what we're REALLY selling?"
      - "Has execution received full attention before polish?"

    triangulation:
      sources_count: 6
      confidence: "CRITICAL"

  # ---------------------------------------------------------------------------
  # FRAMEWORK 2: The 'Yeah, Sure' Test
  # ---------------------------------------------------------------------------
  - id: "FW_002"
    name: "The 'Yeah, Sure' Test"
    tier: "MASTER"
    type: "Quality Gate Framework"

    core_formula:
      claim_made: "Any assertion"
      test_applied: "Would a skeptic say 'Yeah, sure' sarcastically?"
      if_yes: "Need more proof"
      if_no: "Claim is substantiated"

    description: |
      Internal skeptic as permanent quality filter. Every claim must survive
      the imagined skeptic's reaction. If it triggers "yeah, sure" (sarcasm),
      the proof is insufficient. Simple but ruthless quality gate.

    derived_from:
      mental_models: ["MM_002 (Yeah Sure Test)"]
      values: ["Truth in Advertising", "Proof Over Claims"]
      obsessions: ["OBS_003 (Proof and Credibility)"]

    applications:
      - context: "Evaluating any claim in copy"
        application: "Read claim aloud, apply skeptic voice"
      - context: "Constructing proof elements"
        application: "Build proof until skeptic satisfied"
      - context: "Self-evaluation of work"
        application: "Be own harshest critic first"

    proof_intensity_ladder:
      - level: 1
        claim_type: "Basic fact"
        proof_needed: "Citation or common knowledge"
      - level: 2
        claim_type: "Benefit claim"
        proof_needed: "Testimonial or demonstration"
      - level: 3
        claim_type: "Superiority claim"
        proof_needed: "Comparison data, third-party validation"
      - level: 4
        claim_type: "Extraordinary claim"
        proof_needed: "Multiple proof types, implied authority"

    when_to_apply: "Every claim, always"

    cross_domain_applications:
      - domain: "Business proposals"
        application: "Test every ROI claim"
      - domain: "Personal conversations"
        application: "Don't make claims you can't substantiate"
      - domain: "Self-assessment"
        application: "Question your own assumptions"

    interconnections:
      reinforces: ["FW_001 (40/40/20)", "FW_005 (Persuasion Equation)"]
      required_by: ["FW_006 (Proof Hierarchy)"]
      tension_with: ["Creative freedom", "Bold marketing"]

    anti_patterns:
      - "Assuming audience will believe"
      - "Relying on authority without evidence"
      - "Making claims without proof ready"
      - "Turning off skeptic to feel good"

    signature_phrases:
      - "Yeah, sure" (the test itself)
      - "Would anyone believe this?"
      - "What's the proof?"
      - "Match proof intensity to claim magnitude"

    triangulation:
      sources_count: 4
      confidence: "CRITICAL"

  # ---------------------------------------------------------------------------
  # FRAMEWORK 3: The Obvious Adams Mindset
  # ---------------------------------------------------------------------------
  - id: "FW_003"
    name: "The Obvious Adams Mindset"
    tier: "MASTER"
    type: "Problem Solving Framework"

    core_formula:
      step_1: "Investigate exhaustively"
      step_2: "Watch what people actually do"
      step_3: "Resist clever solutions"
      step_4: "The obvious answer emerges"
      paradox: "748 hours to find what seems 'obvious' in retrospect"

    description: |
      Seek simple, obvious solutions that others overcomplicate. But this is
      NOT a shortcut - the obvious only emerges AFTER exhaustive investigation.
      "Obvious" is EARNED through depth, not found through haste.

    derived_from:
      mental_models: ["MM_003 (Obvious Adams)"]
      values: ["Simplicity Through Depth"]
      contradictions: ["PARA_005 (Simple + Exhaustive)"]
      mentor_source: "David Ogilvy transmission"

    applications:
      - context: "Creative problem solving"
        application: "Research until obvious solution appears"
      - context: "Market research interpretation"
        application: "Trust observation over theory"
      - context: "Strategy development"
        application: "Simple strategy after complex analysis"

    key_questions:
      - "What would Obvious Adams see here?"
      - "Am I overcomplicating this?"
      - "What do people ACTUALLY do (not what I think)?"
      - "Have I earned the right to a simple answer yet?"

    when_to_apply: "After (not instead of) exhaustive research"

    critical_warning: |
      This framework is FREQUENTLY MISUSED by those wanting shortcuts.
      "Obvious Adams" requires 748 hours, not 5 minutes.
      The simplicity is OUTPUT, not INPUT.

    cross_domain_applications:
      - domain: "Product development"
        application: "Simple product after deep customer research"
      - domain: "Management decisions"
        application: "Clear direction after thorough analysis"
      - domain: "Life choices"
        application: "Simple path forward after honest reflection"

    interconnections:
      requires: ["FW_001 (40/40/20) - research phase"]
      produces: ["FW_005 (Persuasion Equation) - clear message"]
      tension_with: ["Premature simplification"]

    anti_patterns:
      - "Jumping to obvious without research"
      - "Using as excuse to skip analysis"
      - "Confusing simplistic with obvious"
      - "Trusting clever over clear"

    triangulation:
      sources_count: 3
      confidence: "HIGH"

