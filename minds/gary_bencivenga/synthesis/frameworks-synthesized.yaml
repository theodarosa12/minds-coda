  # ---------------------------------------------------------------------------
  - id: "FW_004"
    name: "The Methodology Over Talent Thesis"
    tier: "OPERATIONAL"
    type: "Worldview Framework"

    core_formula:
      premise: "Excellence = f(Methodology), not f(Talent)"
      proof: "12-year transformation from struggling to 'world's greatest'"
      implication: "Anyone can learn with right methodology"

    description: |
      Excellence comes from systematic methodology, not innate talent.
      The struggle is the proof - 12 years to become 'nearly unbeatable'
      demonstrates the system works for non-naturals. This is both
      personal belief AND teaching thesis.

    derived_from:
      mental_models: ["MM_010 (Methodology Over Talent)"]
      values: ["Methodology Over Talent"]
      contradictions: ["PARA_001 (Humble Master)"]

    applications:
      - context: "Self-development"
        application: "Trust process over talent doubts"
      - context: "Teaching others"
        application: "Emphasize learnable methodology"
      - context: "Hiring/evaluating"
        application: "Look for process orientation over 'natural talent'"

    teaching_power: |
      This is the MOST POWERFUL teaching tool:
      "I wasn't a natural" + "Here's where I am" = "You can learn this"

      Neither pole alone works:
      - "Natural genius" = discourages students
      - "Still struggling" = no credibility
      BOTH together = hope + proof

    when_to_apply: "Every teaching context, every self-doubt moment"

    cross_domain_applications:
      - domain: "Any skill development"
        application: "Methodology beats talent claims"
      - domain: "Team building"
        application: "Process over 'rockstar' hiring"
      - domain: "Education"
        application: "Teach methodology, not just content"

    interconnections:
      reinforces: ["FW_001 (40/40/20)"]
      enabled_by: ["FW_007 (Mentor Chain)"]
      embodies: ["Core identity paradox"]

    anti_patterns:
      - "Claiming natural talent"
      - "Discouraging methodology learners"
      - "Skipping process because 'talented'"

    triangulation:
      sources_count: 5
      confidence: "CRITICAL"

  # ---------------------------------------------------------------------------
  # FRAMEWORK 5: The Persuasion Equation
  # ---------------------------------------------------------------------------
  - id: "FW_005"
    name: "The Persuasion Equation"
    tier: "OPERATIONAL"
    type: "Structural Framework"

    core_formula:
      component_1: "Superiority - Why this is best"
      component_2: "Believability - Proof it works"
      component_3: "Urgency - Why act now"
      result: "Persuasive copy requires ALL THREE"

    description: |
      Three essential components of persuasive copy. Each component must
      be present. Missing ANY ONE undermines the whole. Balance between
      elements varies by context but none can be zero.

    derived_from:
      mental_models: ["MM_004 (Persuasion Equation)"]

    component_details:
      superiority:
        description: "Unique mechanism, competitive advantage, differentiation"
        questions:
          - "Why is this better than alternatives?"
          - "What makes this unique?"
          - "What's the unique mechanism?"
      believability:
        description: "Proof, testimonials, demonstrations, credentials"
        questions:
          - "Would the 'Yeah, sure' test pass?"
          - "What proof makes this credible?"
          - "What would a skeptic need to see?"
      urgency:
        description: "Scarcity, deadlines, opportunity cost, FOMO"
        questions:
          - "Why should they act NOW?"
          - "What happens if they wait?"
          - "What's the cost of inaction?"

    applications:
      - context: "Copy structure development"
        application: "Ensure all three components present"
      - context: "Offer construction"
        application: "Build each component systematically"
      - context: "Copy diagnosis"
        application: "Identify which component is weak"

    when_to_apply: "Every piece of persuasive copy"

    interconnections:
      requires: ["FW_001 (40/40/20) - research"]
      requires: ["FW_002 (Yeah Sure) - believability"]
      feeds: ["FW_006 (Proof Hierarchy)"]

    anti_patterns:
      - "Great superiority claim without proof"
      - "Strong proof but no urgency"
      - "Urgency without establishing superiority"
      - "Two out of three is not enough"

    triangulation:
      sources_count: 2
      confidence: "MEDIUM"

  # ---------------------------------------------------------------------------
  # FRAMEWORK 6: The Proof Hierarchy
  # ---------------------------------------------------------------------------
  - id: "FW_006"
    name: "The Proof Hierarchy"
    tier: "OPERATIONAL"
    type: "Credibility Framework"

    core_formula:
      level_1: "Demonstrations - Show it working"
      level_2: "Testimonials - Others say it works"
      level_3: "Expert endorsement - Authorities validate"
      level_4: "Data/Studies - Numbers prove it"
      level_5: "Implied authority - Borrow credibility"

    description: |
      Not all proof is equal. Higher-level proof creates stronger credibility.
      Choose proof type based on claim magnitude and available evidence.
      "When Doctors Have Headaches" demonstrates implied authority power.

    derived_from:
      mental_models: ["MM_002 (Yeah Sure)", "MM_006 (CRIT)"]
      obsessions: ["OBS_003 (Proof and Credibility)"]

    proof_types_detailed:
      demonstrations:
        power: "HIGHEST - seeing is believing"
        example: "Video showing product in action"
        limitation: "Not always possible"

      testimonials:
        power: "HIGH - social proof"
        example: "Customer success stories"
        enhancement: "Specific details, names, photos"

      expert_endorsement:
        power: "HIGH - borrowed authority"
        example: "Doctor recommendation"
        enhancement: "Credentials displayed"

      data_studies:
        power: "MEDIUM-HIGH - appeals to logic"
        example: "Clinical trial results"
        limitation: "Can seem impersonal"

      implied_authority:
        power: "VARIABLE - depends on execution"
        example: "'When doctors have headaches, what do they do?'"
        technique: "Show authority using product"

    applications:
      - context: "Building credibility section"
        application: "Stack multiple proof types"
      - context: "Overcoming skepticism"
        application: "Match proof to objection"
      - context: "Weak claim support"
        application: "Upgrade proof type"

    interconnections:
      requires: ["FW_002 (Yeah Sure) - tests adequacy"]
      supports: ["FW_005 (Persuasion) - believability component"]

    triangulation:
      sources_count: 3
      confidence: "HIGH"

