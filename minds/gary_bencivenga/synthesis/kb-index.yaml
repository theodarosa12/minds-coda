methodology_layer:

  # ---------------------------------------------------------------------------
  # CHUNK M1: The 'Yeah, Sure' Test
  # ---------------------------------------------------------------------------
  - id: "M1"
    title: "The 'Yeah, Sure' Test"
    type: "methodology"
    priority: 4
    dependencies: ["F3"]

    content_summary: |
      Internal skeptic as quality gate.
      Every claim must survive imagined skeptic's sarcastic reaction.
      If triggers "yeah, sure" → need more proof.

    how_to_apply:
      step_1: "State your claim"
      step_2: "Imagine skeptical reader"
      step_3: "Would they say 'Yeah, sure...' sarcastically?"
      step_4: "If yes → add more proof"
      step_5: "If no → claim is substantiated"

    proof_intensity_ladder:
      - level: 1
        claim: "Basic fact"
        proof: "Citation or common knowledge"
      - level: 2
        claim: "Benefit claim"
        proof: "Testimonial or demonstration"
      - level: 3
        claim: "Superiority claim"
        proof: "Comparison data, third-party validation"
      - level: 4
        claim: "Extraordinary claim"
        proof: "Multiple proof types"

    retrieval_tags:
      - "yeah sure test"
      - "credibility test"
      - "proof requirements"
      - "skeptic filter"
      - "how to prove claims"

  # ---------------------------------------------------------------------------
  # CHUNK M2: Obvious Adams Philosophy
  # ---------------------------------------------------------------------------
  - id: "M2"
    title: "Obvious Adams Philosophy"
    type: "methodology"
    priority: 5
    dependencies: ["F3"]

    content_summary: |
      Seek simple, obvious solutions that others overcomplicate.
      BUT: This requires exhaustive research first.
      The obvious emerges AFTER 748 hours, not instead of them.

    key_principle: |
      "748 hours to find the obvious answer"
      Simplicity = f(Depth of Investigation)
      You cannot shortcut to simplicity.

    how_to_apply:
      step_1: "Research exhaustively (40% phase)"
      step_2: "Watch what people actually do"
      step_3: "Resist clever solutions"
      step_4: "The obvious will emerge"
      warning: "This takes time - no shortcuts"

    common_misuse: |
      People use "Obvious Adams" as excuse for shallow thinking.
      The framework requires DEEP work to produce SIMPLE output.

    retrieval_tags:
      - "obvious adams"
      - "simple solutions"
      - "simplicity through depth"
      - "problem solving approach"

  # ---------------------------------------------------------------------------
  # CHUNK M3: The Persuasion Equation
  # ---------------------------------------------------------------------------
  - id: "M3"
    title: "The Persuasion Equation"
    type: "methodology"
    priority: 6
    dependencies: ["M1"]

    content_summary: |
      Three components of persuasive copy:
      1. Superiority (why this is best)
      2. Believability (proof it works)
      3. Urgency (why act now)
      ALL THREE must be present.

    component_details:
      superiority:
        function: "Differentiation, unique mechanism"
        questions:
          - "Why is this better than alternatives?"
          - "What makes this unique?"

      believability:
        function: "Proof, credibility"
        questions:
          - "Would the 'Yeah, sure' test pass?"
          - "What proof makes this credible?"

      urgency:
        function: "Scarcity, deadlines"
        questions:
          - "Why should they act NOW?"
          - "What's the cost of inaction?"

    retrieval_tags:
      - "persuasion equation"
      - "copy structure"
      - "superiority believability urgency"
      - "how to write persuasive copy"

  # ---------------------------------------------------------------------------
  # CHUNK M4: The CRIT System
  # ---------------------------------------------------------------------------
  - id: "M4"
    title: "The CRIT System"
    type: "methodology"
    priority: 7
    dependencies: ["M1"]

    content_summary: |
      Collaborative critique involving diverse perspectives.
      Include non-experts (receptionists).
      Fresh eyes catch what expertise blinds.

    participants:
      - "Copywriter (craft)"
      - "Art director (visual)"
      - "Account executive (client view)"
      - "Receptionist (fresh reader)" # KEY VALUE

    critique_dimensions:
      - "Grammar - Is it correct?"
      - "Psychology - Does it resonate?"
      - "Readability - Is it clear?"
      - "Persuasiveness - Would it convince?"

    key_insight: "Expertise creates blind spots"

    retrieval_tags:
      - "crit system"
      - "copy review"
      - "quality assurance"
      - "collaborative critique"

  # ---------------------------------------------------------------------------
  # CHUNK M5: The Proof Hierarchy
  # ---------------------------------------------------------------------------
  - id: "M5"
    title: "The Proof Hierarchy"
    type: "methodology"
    priority: 8
    dependencies: ["M1", "M3"]

    content_summary: |
      Not all proof is equal. Higher-level proof = stronger credibility.
      Choose proof type based on claim magnitude.

    proof_types_ranked:
      - rank: 1
        type: "Demonstrations"
        power: "HIGHEST - seeing is believing"
        example: "Video showing product working"

      - rank: 2
        type: "Testimonials"
        power: "HIGH - social proof"
        example: "Customer success stories with specifics"

      - rank: 3
        type: "Expert endorsement"
        power: "HIGH - borrowed authority"
        example: "Doctor recommendation"

      - rank: 4
        type: "Data/Studies"
        power: "MEDIUM-HIGH - appeals to logic"
        example: "Clinical trial results"

      - rank: 5
        type: "Implied authority"
        power: "VARIABLE"
        example: "'When doctors have headaches, what do they do?'"

