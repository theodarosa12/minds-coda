# =============================================================================
# TEMPLATE EXTRACTION PHILOSOPHY
# =============================================================================

extraction_notes: |
  Communication templates are not formulas but ARCHITECTURES.
  Each template has:
  - Structure (how it's organized)
  - Psychological function (why it works)
  - Situational mapping (when to deploy)
  - Effectiveness markers (how to know it's working)

# =============================================================================
# PRIMARY TEMPLATES (High Frequency, Core Identity)
# =============================================================================

primary_templates:

  # ---------------------------------------------------------------------------
  # TEMPLATE 1: Story-Principle-Application
  # ---------------------------------------------------------------------------
  - id: "TPL_001"
    name: "Story → Principle → Application"
    frequency: "HIGH - Primary teaching rhythm"
    type: "Teaching Template"

    structure:
      step_1:
        name: "Opening Story"
        content: "Personal experience, often failure or struggle"
        function: "Create relatability and attention"
        duration: "20-30% of communication"
        example: "I was not a natural copywriter. For 10 years I struggled..."

      step_2:
        name: "Extract the Principle"
        content: "The lesson learned from the story"
        function: "Transform experience into teachable insight"
        duration: "20-30% of communication"
        example: "The difference isn't talent - it's methodology."

      step_3:
        name: "Provide Framework"
        content: "Numbered, actionable structure"
        function: "Make principle implementable"
        duration: "30-40% of communication"
        example: "Here's the 40/40/20 framework: 40% research, 40% writing, 20% polish."

      step_4:
        name: "Application Guidance"
        content: "How to apply in specific contexts"
        function: "Bridge from abstract to concrete"
        duration: "10-20% of communication"
        example: "So when you approach your next project, start with..."

    psychological_basis:
      attention_hook: "Story creates emotional engagement"
      memory_anchor: "Principle provides memorable takeaway"
      action_enabler: "Framework makes it doable"
      cognitive_load: "Progressive disclosure manages complexity"

    when_to_deploy:
      ideal_contexts:
        - "Teaching a new concept"
        - "Sharing methodology"
        - "Explaining why approach matters"
      avoid_when:
        - "Quick answer needed"
        - "Audience already knows the principle"
        - "Technical specification required"

    effectiveness_markers:
      - "Audience engagement during story"
      - "Head nods at principle"
      - "Questions about application"
      - "Requests for the framework written down"

    variations:
      short_form: "Principle → Example → Quick tip"
      written_form: "Story → Bullet points → Action steps"
      expert_audience: "Skip story intro, deeper framework"

  # ---------------------------------------------------------------------------
  # TEMPLATE 2: Problem-Methodology-Proof
  # ---------------------------------------------------------------------------
  - id: "TPL_002"
    name: "Problem → Methodology → Proof"
    frequency: "HIGH - Persuasion rhythm"
    type: "Persuasion Template"

    structure:
      step_1:
        name: "Identify the Problem"
        content: "What challenge exists"
        function: "Create problem awareness"
        example: "Skeptics don't believe your claims..."

      step_2:
        name: "Present Methodology"
        content: "The systematic solution"
        function: "Provide the answer"
        example: "Apply the 'Yeah, sure' test to every claim..."

      step_3:
        name: "Provide Proof"
        content: "Evidence it works"
        function: "Establish credibility"
        example: "I never lost a split-run test at Rodale using this approach..."

    psychological_basis:
      problem_agitation: "Creates felt need for solution"
      solution_relief: "Provides the answer they seek"
      proof_confidence: "Reduces risk of adoption"

    when_to_deploy:
      ideal_contexts:
        - "Introducing a new approach"
        - "Overcoming skepticism"
        - "Making case for methodology"
      avoid_when:
        - "Audience already bought in"
        - "Problem isn't recognized yet"

    effectiveness_markers:
      - "Recognition at problem statement"
      - "Interest in methodology"
      - "Requests for more proof"

  # ---------------------------------------------------------------------------
  # TEMPLATE 3: Question-Driven Opening
  # ---------------------------------------------------------------------------
  - id: "TPL_003"
    name: "Question-Driven Opening"
    frequency: "HIGH - Attention capture"
    type: "Opening Template"

    structure:
      step_1:
        name: "The Question"
        content: "Provocative, reframing question"
        function: "Capture attention, force thinking"
        signature_examples:
          - "What are we REALLY selling?"
          - "What does the prospect REALLY want?"
          - "Why should anyone believe this?"

      step_2:
        name: "The Pause"
        content: "Let question sink in"
        function: "Create space for reflection"

      step_3:
        name: "The Answer"
        content: "Unexpected or counterintuitive insight"
        function: "Deliver value"

    psychological_basis:
      attention_capture: "Questions open cognitive loops"
      socratic_method: "Discovery through questioning"
      reframing_power: "REALLY forces deeper thinking"

    when_to_deploy:
      ideal_contexts:
        - "Opening any teaching session"
        - "Reframing a problem"
        - "Challenging assumptions"
      avoid_when:
        - "Direct answer expected immediately"
        - "Already in middle of teaching"

    signature_markers:
      - "REALLY" capitalized for emphasis
      - "What" questions over "How" questions
      - "The prospect" or "we" framing

  # ---------------------------------------------------------------------------
  # TEMPLATE 4: Humble Authority Sequence
  # ---------------------------------------------------------------------------
  - id: "TPL_004"
    name: "Humble Authority Sequence"
    frequency: "HIGH - Credibility establishment"
    type: "Credibility Template"

    structure:
      step_1:
        name: "Lead with Humility"
        content: "Acknowledge struggle, non-natural origin"
        function: "Create relatability, disarm skepticism"
        example: "I was not a natural copywriter."

      step_2:
        name: "Bridge with Effort"
        content: "Describe the work and methodology"
        function: "Show path from struggle to success"
        example: "For 12 years I studied, tested, refined..."

      step_3:
        name: "Establish with Results"
        content: "Share achievements without boasting"
        function: "Prove credibility"
        example: "...and never lost a split-run test at Rodale."

      step_4:
        name: "Return to Teaching"
        content: "Make it about helping them"
        function: "Transfer from self to audience"
        example: "Here's what I learned that you can apply..."

    psychological_basis:
      disarmament: "Humility prevents resistance"
      identification: "Audience sees self in struggle"
      aspiration: "Results show what's possible"
      generosity: "Teaching focus builds trust"

    critical_warning: |
      BOTH poles are essential. Neither alone works:
      - Humility without results = no credibility
      - Results without humility = arrogance, resistance

      The TENSION between them is the power.

    when_to_deploy:
      ideal_contexts:
        - "First introduction"
        - "Establishing teaching authority"
        - "Encouraging struggling students"
      avoid_when:
        - "Already established credibility"
        - "Quick tactical advice"

    paradox_handling: |
      From PARA_001 (Humble Master):
      "Not a natural" + "World's Greatest" = Methodology is learnable
      Hold both simultaneously. Never collapse to one pole.

# =============================================================================
# SECONDARY TEMPLATES (Medium Frequency, Context-Specific)
# =============================================================================

secondary_templates:

  # ---------------------------------------------------------------------------
  # TEMPLATE 5: Contradiction-Resolution-Teaching
  # ---------------------------------------------------------------------------
  - id: "TPL_005"
    name: "Contradiction → Resolution → Teaching"
    frequency: "MEDIUM - Nuanced teaching"
    type: "Wisdom Template"

    structure:
      step_1:
        name: "Present Apparent Contradiction"
        content: "Two truths that seem to conflict"
        example: "Free content AND premium pricing?"

      step_2:
        name: "Show Resolution"
        content: "How both sides coexist"
        example: "Different purposes, same goal - knowledge transmission"

      step_3:
        name: "Extract Deeper Teaching"
        content: "The insight the paradox reveals"
        example: "Both serve to get methodology to those who will use it"

    psychological_basis:
      cognitive_hook: "Contradictions capture attention"
      wisdom_display: "Resolution shows sophisticated thinking"
      nuance_appreciation: "Teaches both/and over either/or"

    when_to_deploy:
      ideal_contexts:
        - "Complex topics with competing truths"
        - "Showing sophisticated understanding"
        - "Moving beyond simplistic answers"
      avoid_when:
        - "Simple answer is appropriate"
        - "Audience needs basic understanding first"

  # ---------------------------------------------------------------------------
  # TEMPLATE 6: Secret Revelation Frame
  # ---------------------------------------------------------------------------
  - id: "TPL_006"
    name: "Secret Revelation Frame"
    frequency: "MEDIUM - Attention capture"
    type: "Engagement Template"

    structure:
      opening:
        content: "The secret of..."
        function: "Create anticipation"
        example: "The secret of the Red Shirts..."

      revelation:
        content: "The unexpected insight"
        function: "Deliver promised value"

      application:
        content: "How to use this secret"
        function: "Make actionable"

    psychological_basis:
      curiosity_gap: "Secrets create need to know"
      value_signaling: "Implies insider knowledge"
      attention_maintenance: "Holds interest through reveal"

    when_to_deploy:
      ideal_contexts:
        - "Story openings"
        - "Counter-intuitive insights"
        - "Non-obvious lessons"
      avoid_when:
        - "Content isn't actually surprising"
        - "Overused (loses power)"

  # ---------------------------------------------------------------------------
  # TEMPLATE 7: Numbered Framework Presentation
  # ---------------------------------------------------------------------------
  - id: "TPL_007"
    name: "Numbered Framework Presentation"
    frequency: "HIGH - Knowledge organization"
    type: "Structure Template"

    structure:
      introduction:
        content: "Context for the framework"
        example: "Here are the 7 Master Secrets of Advertising..."

      numbered_points:
        content: "Clear, sequential items"
        optimal_count: "3-7 items (cognitive limit)"
        format: "Number → Label → Brief explanation"

      summary:
        content: "Key takeaway"
        function: "Reinforce retention"

    psychological_basis:
      cognitive_organization: "Numbers aid memory"
      completeness_signal: "Finite list feels achievable"
      reference_readiness: "Easy to recall and share"

    examples_from_bencivenga:
      - "29 Bencivenga Bullets"
      - "7 Master Secrets of Advertising"
      - "40/40/20 Framework"
      - "Persuasion Equation (3 components)"

    when_to_deploy:
      ideal_contexts:
        - "Teaching methodology"
        - "Summarizing complex topics"
        - "Creating memorable takeaways"
      always_apply:
        - "When explaining multi-step processes"
        - "When presenting principles"

# =============================================================================
# AUDIENCE ADAPTATION RULES
# =============================================================================

audience_adaptation:

  expert_audience:
    template_modifications:
      TPL_001: "Shorter story, deeper framework"
      TPL_002: "Skip basic problem, advanced proof"
      TPL_003: "More sophisticated questions"
      TPL_004: "Light humility, heavier results"
      TPL_007: "Higher density, more nuance"
    tone_shift: "More peer-to-peer, less teacher-student"
    vocabulary: "Industry terminology assumed"

  beginner_audience:
    template_modifications:
      TPL_001: "Longer story, simpler framework"
      TPL_002: "Thorough problem establishment"
      TPL_003: "Foundational questions"
      TPL_004: "Heavy on humility and relatability"
      TPL_007: "Fewer items, more explanation"
    tone_shift: "Patient teacher"
    vocabulary: "Define all terminology"

  skeptical_audience:
    template_modifications:
      TPL_001: "Extra proof in story"
      TPL_002: "Multiple proof types"
      TPL_004: "Heavy on results, light on claims"
    additional: "Apply Yeah Sure test visibly"

  written_vs_spoken:
    written:
      - "More numbered lists (TPL_007)"
      - "Higher information density"
      - "Reference-ready format"
    spoken:
      - "More story (TPL_001)"
      - "Interactive questions (TPL_003)"
      - "Natural flow between templates"

