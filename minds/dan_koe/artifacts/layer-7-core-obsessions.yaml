layer_info:
  number: 7
  name: "Core Obsessions"
  category: "Deep Identity"
  description: |
    The 'why behind the why' - recurring themes, incessant pursuits, and existential drives
    that animate Dan Koe's work and life. These are not goals or strategies but compulsions
    that manifest across all content, all business decisions, and all intellectual exploration.
    They are what make Dan Koe write about the same fundamental themes year after year while
    finding new angles, new depth, and new frameworks.
  source_types: ["books", "newsletter", "courses", "videos", "twitter", "podcast", "interviews", "instagram", "shorts", "playbooks"]
  extraction_method: "Theme frequency analysis across 22 identified themes, 1,043+ items, 312+ cross-source connections"
  coverage: 97

# ==============================================================================
# CORE OBSESSIONS (8 Primary Drives)
# ==============================================================================
core_obsessions:

  obsession_1_one_person_business:
    name: "The One-Person Business Model"
    intensity: 10
    category: "Business/Existential"
    status: "Lifelong, Deepening"
    theme_tier: "A (Core)"

    description: |
      THE MASTER OBSESSION. Not just a business model but an existential stance.
      The idea that one individual, armed with writing, ideas, and digital tools, can build
      a multi-million dollar business without employees, investors, or institutional backing.
      This is sovereignty made tangible. It is simultaneously a business strategy, a philosophy
      of human potential, and a rebellion against the default career path.

    manifestations:
      content_themes:
        - "One-person business architecture as recurring framework"
        - "Revenue Path Framework (social → newsletter → products)"
        - "Content Avatar Method (write for past self)"
        - "Anti-niche thesis (you ARE the niche)"
        - "$4.2M/year as proof-of-concept"
      behavioral:
        - "Refuses to hire traditional employees"
        - "Pivoted away from Kortex when it required team scaling"
        - "Every product designed to be created and delivered solo"
        - "Eden ($17/month) designed for minimal operational overhead"
      intellectual:
        - "Connects one-person business to Naval's 'Productize Yourself'"
        - "Frames it within HUMAN 3.0 as individual sovereignty in action"
        - "Sees it as civilizational contribution (not just personal success)"

    why_behind_the_why: |
      The one-person business is not about money. It's about proof that sovereignty is possible.
      If one person can build a multi-million dollar business writing 2 hours per day, then
      the entire premise of corporate employment, credential-seeking, and institutional dependency
      is called into question. Dan Koe is not just building a business — he is building an argument.

    evolution:
      early: "2020-2022: Tactical focus (how to freelance, how to build products)"
      middle: "2023-2024: Philosophical framing (why one-person matters, anti-niche thesis)"
      current: "2025-2026: Integral synthesis (one-person business as HUMAN 3.0 expression)"

  obsession_2_writing_as_thinking:
    name: "Writing as Thinking (Not Just Communication)"
    intensity: 9.5
    category: "Creative/Cognitive"
    status: "Lifelong, Intensifying"
    theme_tier: "A (Core)"

    description: |
      Writing is not content marketing, not communication, not even self-expression.
      Writing is thinking. It is the process by which raw experience becomes structured
      understanding. The 2-Hour Writer is not a productivity system — it is a cognitive
      discipline. Dan Koe writes to think, and sells the thinking.

    manifestations:
      content_themes:
        - "'Writing allows you to make a living from living'"
        - "2-Hour Writer as daily cognitive practice"
        - "'A digital product is a crystallized version of your mind'"
        - "Writer's Leverage Equation (1 piece → many formats)"
      behavioral:
        - "Daily writing practice for years without interruption"
        - "Newsletter as primary intellectual output (not YouTube, not Twitter)"
        - "Books as ultimate expression of sustained thinking"
        - "All other content formats derive from written originals"
      intellectual:
        - "Writing as the meta-skill of the attention economy"
        - "Connects writing to flow (Csikszentmihalyi)"
        - "Treats writing as a philosophical practice, not just business tool"

    why_behind_the_why: |
      For Dan Koe, writing is the bridge between living and understanding. Without writing,
      experiences remain unprocessed. With writing, everything becomes material — every failure,
      every insight, every philosophical question. Writing is how Dan Koe makes sense of reality,
      and the business is built on selling that sense-making.

  obsession_3_anti_niche_thesis:
    name: "The Anti-Niche Thesis"
    intensity: 9.0
    category: "Business/Philosophical"
    status: "Established, Evolving into HUMAN 3.0"
    theme_tier: "A (Core)"

    description: |
      The contrarian thesis that defined Dan Koe's brand: you don't need to find a niche,
      YOU are the niche. Your unique combination of interests, skills, and perspective is
      the differentiator. This thesis is simultaneously a business strategy, a philosophical
      position about human complexity, and a rejection of reductive categorization.

    manifestations:
      content_themes:
        - "'You are the niche' as defining brand statement"
        - "'Specialization is for insects' (Heinlein)"
        - "'The generalist is the new specialist'"
        - "Digital Renaissance Thinking framework"
        - "Curiosity-Driven Skill Stacking"
      behavioral:
        - "Personal brand spans philosophy, business, technology, consciousness"
        - "Refuses to be categorized as 'business coach' or 'productivity expert'"
        - "Content topics shift freely across domains"
        - "22 themes identified across content — not 1 or 2"
      intellectual:
        - "Anti-niche as expression of anti-specialization philosophy"
        - "Cross-domain synthesis as evidence that generalism works"
        - "HUMAN 3.0 as ultimate anti-niche framework (spans all domains of human experience)"

    why_behind_the_why: |
      The anti-niche thesis is not just business advice — it's a statement about human nature.
      Dan Koe rejects specialization because he rejects the reduction of humans to functions.
      A person is not a niche. A person is a complex, evolving, multi-dimensional being, and
      the best business strategy is to be fully that being.

    evolution:
      early: "2020-2021: Followed conventional niche-down advice (web design niche)"
      pivot: "2022-2023: Rejected niching, articulated 'you are the niche'"
      current: "2025-2026: Anti-niche evolved into HUMAN 3.0 integral framework"

  obsession_4_human_3_0:
    name: "HUMAN 3.0 as Unifying Meta-Framework"
    intensity: 9.0
    category: "Intellectual/Civilizational"
    status: "Active Development, Deepening"
    theme_tier: "A (Core)"

    description: |
      The intellectual magnum opus. HUMAN 3.0 is a 92KB meta-framework that integrates
      personal development, business, consciousness, and civilizational thinking into a
      unified model. It is the culmination of Dan Koe's evolution from tactical creator
      to integral synthesist.

    manifestations:
      content_themes:
        - "4 Quadrants (adapted from Ken Wilber AQAL)"
        - "3 Levels: Survive, Thrive, Transcend"
        - "3 Phases per level: Awaken, Build, Create"
        - "Metatypes, Channels, Glitches"
        - "Meta-glitch (AI as civilizational pattern disruptor)"
      behavioral:
        - "2+ years of development before public release"
        - "Tested components through newsletter before formalization"
        - "Restructured courses and community around HUMAN 3.0 framework"
        - "Purpose & Profit book as HUMAN 3.0 business application"
      intellectual:
        - "Synthesis of Wilber (AQAL), Graves (Spiral Dynamics), Schmachtenberger (metacrisis)"
        - "Attempt to create a 'theory of everything' for the creator economy"
        - "Individual development within civilizational context"

    why_behind_the_why: |
      HUMAN 3.0 represents Dan Koe's need to make sense of EVERYTHING — not just business,
      not just personal development, but the entire human condition. It's the logical endpoint
      of someone who refuses to specialize: you end up trying to integrate all of reality into
      a single coherent framework. Whether it succeeds or not, the attempt IS the obsession.

  obsession_5_ai_as_meta_glitch:
    name: "AI as Meta-Glitch Accelerator"
    intensity: 8.0
    category: "Technological/Civilizational"
    status: "Rapidly Intensifying"
    theme_tier: "A (Core)"

    description: |
      AI is not just a tool but a civilizational inflection point — a 'meta-glitch' that
      accelerates all developmental patterns, both constructive and destructive. Dan Koe
      sees AI as simultaneously the greatest opportunity for individual sovereignty and
      the greatest threat to human meaning.

    manifestations:
      content_themes:
        - "AI within HUMAN 3.0 framework as 'meta-glitch'"
        - "AI as leverage tool for one-person business"
        - "AI replacing tasks, not people (if people develop)"
        - "AI and the future of creative work"
      behavioral:
        - "Rapid adoption of AI in content creation workflow"
        - "Eden community includes AI integration"
        - "Content frequency on AI topics increasing"
      intellectual:
        - "AI analyzed through HUMAN 3.0 lens (quadrants, levels, glitches)"
        - "Connects AI to Schmachtenberger metacrisis framework"
        - "Sees AI as both threat and opportunity depending on individual development level"

    why_behind_the_why: |
      AI threatens the very foundation of Dan Koe's thesis: that writing, thinking, and
      individual creativity are the ultimate leverage tools. If AI can write, think, and
      create — then what? This existential tension drives Dan Koe's obsession with AI: not
      as a tool to adopt but as a force to understand.

  obsession_6_metacrisis:
    name: "Metacrisis as Context for Individual Action"
    intensity: 7.5
    category: "Civilizational/Philosophical"
    status: "Growing, Post-2024"
    theme_tier: "A (Core)"

    description: |
      The adoption of Daniel Schmachtenberger's metacrisis framework as the context for
      why individual development matters. Not just 'improve yourself' but 'improve yourself
      because civilization depends on developed individuals making wise decisions.'

    manifestations:
      content_themes:
        - "Individual sovereignty as civilizational solution"
        - "Metacrisis as backdrop for personal development"
        - "HUMAN 3.0 as response to civilizational challenges"
        - "Creator economy as alternative to extractive systems"
      behavioral:
        - "Content increasingly frames personal development in systemic terms"
        - "Purpose & Profit explicitly connects individual purpose to civilizational contribution"
        - "HUMAN 3.0 includes collective/systemic quadrants (not just individual)"
      intellectual:
        - "Schmachtenberger's analysis adopted but simplified for creator audience"
        - "Metacrisis used to elevate one-person business from lifestyle to mission"

    why_behind_the_why: |
      The metacrisis obsession provides Dan Koe's work with gravitas. Without it, he's a
      successful creator teaching content tactics. With it, he's a thinker responding to
      civilizational challenges. The metacrisis framing transforms personal development from
      self-help into a moral imperative.

  obsession_7_flow_state:
    name: "Flow State as Optimal Mode of Existence"
    intensity: 7.0
    category: "Psychological/Creative"
    status: "Established, Stable"
    theme_tier: "B (Secondary)"

    description: |
      The obsession with achieving and sustaining flow state — the optimal psychological
      state where challenge meets skill and time disappears. Flow is not just a productivity
      hack but the mode of existence that makes life worth living.

    manifestations:
      content_themes:
        - "Creative Workflow designed to induce flow"
        - "2-Hour Writer as flow-inducing practice"
        - "Deep work philosophy (Cal Newport influence)"
        - "4-Hour Workday as flow-optimized schedule"
      behavioral:
        - "Daily writing practice structured for flow entry"
        - "Environmental design (minimal distractions, focused workspace)"
        - "Resistance to meetings and synchronous communication (flow-breakers)"
        - "Content about dopamine management and attention protection"
      intellectual:
        - "Csikszentmihalyi (Flow theory) as primary influence"
        - "Kotler (flow neuroscience) as supporting framework"
        - "Flow state analyzed through HUMAN 3.0 lens"

    why_behind_the_why: |
      Flow is the experiential proof that Dan Koe's philosophy works. When you're in flow,
      sovereignty is not abstract — it's felt. The 2-Hour Writer works not because of time
      management but because it induces the state where writing becomes thinking becomes living.
      Flow is the feeling of being Dan Koe.

  obsession_8_dopamine_attention:
    name: "Dopamine / Attention Management"
    intensity: 6.5
    category: "Psychological/Practical"
    status: "Established, Stable"
    theme_tier: "B (Secondary)"

    description: |
      The practical obsession with managing dopamine pathways and attention allocation
      as foundational skills for creative work and meaningful life. Not just 'reduce
      screen time' but a systematic understanding of how neurochemistry shapes behavior.

    manifestations:
      content_themes:
        - "Dopamine Detox Protocol as named framework"
        - "'Attention is the new currency'"
        - "Digital minimalism philosophy"
        - "Anti-distraction content and strategies"
      behavioral:
        - "Curated information environment (signal over noise)"
        - "Structured dopamine sources (creative work over social media)"
        - "Morning routine designed to protect dopamine baseline"
        - "Content about phone addiction, social media, and attention hijacking"
      intellectual:
        - "Neuroscience of dopamine applied to productivity and creativity"
        - "The Art of Focus as practical guide to attention management"
        - "Connects attention management to flow state access"

    why_behind_the_why: |
      Dopamine management is the unsexy foundation that makes everything else work.
      Without it, there's no flow state, no 2-Hour Writer, no deep thinking. Dan Koe
      obsesses about this because he knows from experience: the quality of your attention
      determines the quality of your life and your work.

