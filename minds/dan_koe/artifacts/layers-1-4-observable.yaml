# ==============================================================================
# LAYER 3: MENTAL MODELS (Catalog of 30 Frameworks)
# ==============================================================================
layer_3_mental_models:

  framework_count: 30
  categorization: "Business (12), Creative (8), Philosophical (6), Meta/Integral (4)"

  tier_1_signature_frameworks:
    description: "Frameworks Dan Koe created or significantly adapted. Core to his intellectual identity."

    frameworks:
      - id: "FW-01"
        name: "Creative Workflow (2-Hour Writer)"
        category: "Creative"
        origin: "Self-created, influenced by Csikszentmihalyi flow theory"
        description: |
          The core productivity system. 2 hours of focused creative writing per day as the engine
          of a one-person business. Not about speed but depth. Writing as thinking, not content production.
        components:
          - "Morning deep work block (no inputs)"
          - "Single creative output per session"
          - "Ideas marinated overnight (subconscious processing)"
          - "Weekly theme cycling across interests"
        evidence_sources: ["newsletter", "courses", "videos", "books"]
        frequency: "very_high"

      - id: "FW-02"
        name: "APAG Persuasion Framework"
        category: "Business/Creative"
        origin: "Self-created"
        description: "Attention → Problem → Agitation → Goal. Content structure for persuasive writing."
        components:
          - "A: Hook with pattern interrupt or curiosity gap"
          - "P: Name the specific problem the reader faces"
          - "A: Agitate by showing consequences of inaction"
          - "G: Present the goal/solution via framework"
        evidence_sources: ["courses", "newsletter"]
        frequency: "high"

      - id: "FW-03"
        name: "One-Person Business Architecture"
        category: "Business"
        origin: "Self-created, influenced by Naval Ravikant (Productize Yourself)"
        description: |
          The business model where one individual creates content, builds audience, and sells digital
          products without employees, investors, or traditional business infrastructure. Leverages
          writing, personal brand, and digital distribution.
        components:
          - "Content as customer acquisition (free education)"
          - "Newsletter as owned distribution channel"
          - "Digital products as scalable revenue ($225-$999)"
          - "Community as retention layer (Eden $17/month)"
          - "Personal brand as moat"
        evidence_sources: ["videos", "newsletter", "courses", "twitter", "books"]
        frequency: "very_high"

      - id: "FW-04"
        name: "Revenue Path Framework"
        category: "Business"
        origin: "Self-created"
        description: "Social media → Newsletter → Free value → Paid product funnel architecture"
        components:
          - "Top of funnel: Social media (Twitter, YouTube, Instagram)"
          - "Mid funnel: Newsletter (279K subscribers)"
          - "Bottom funnel: Courses and community"
          - "Flywheel: Each piece of content feeds all stages"
        evidence_sources: ["courses", "newsletter", "videos"]
        frequency: "high"

      - id: "FW-05"
        name: "Value Hierarchy"
        category: "Business"
        origin: "Self-created"
        description: "Hierarchy of value creation in the creator economy: entertainment < education < transformation"
        evidence_sources: ["newsletter", "videos", "courses"]
        frequency: "moderate"

      - id: "FW-06"
        name: "HUMAN 3.0"
        category: "Meta/Integral"
        origin: "Self-created, synthesized from Ken Wilber (AQAL), Clare Graves (Spiral Dynamics), integral philosophy"
        description: |
          92KB meta-framework for human development. The magnum opus. Integrates personal development,
          business, consciousness, and civilizational thinking into a unified model.
        components:
          - "4 Quadrants: Interior-Individual, Interior-Collective, Exterior-Individual, Exterior-Collective"
          - "3 Levels: Survive, Thrive, Transcend"
          - "3 Phases per level: Awaken, Build, Create"
          - "Metatypes: Archetypes of developmental stages"
          - "Channels: Information processing and distribution"
          - "Glitches: Developmental blocks and failure modes"
          - "Meta-glitch: AI as civilizational pattern disruptor"
        evidence_sources: ["books", "newsletter", "courses", "videos"]
        frequency: "high"
        note: "Represents Dan Koe's intellectual evolution from tactical to integral. The framework IS the person at this stage."

      - id: "FW-07"
        name: "Sovereignty Test"
        category: "Philosophical"
        origin: "Self-created"
        description: "Decision filter: Does this increase or decrease my autonomy? Applied to business decisions, relationships, tools, platforms."
        evidence_sources: ["newsletter", "twitter", "videos"]
        frequency: "moderate"

      - id: "FW-08"
        name: "Polarity Principle"
        category: "Philosophical"
        origin: "Influenced by integral philosophy"
        description: "Every concept has a productive opposite. Truth lives in the tension between polarities, not in choosing one side."
        evidence_sources: ["books", "newsletter"]
        frequency: "moderate"

      - id: "FW-09"
        name: "Iceberg Model of Content"
        category: "Creative"
        origin: "Self-adapted"
        description: "10% visible (social content) sits atop 90% invisible (deep thinking, reading, living). The quality of the 10% depends entirely on the 90%."
        evidence_sources: ["newsletter", "videos"]
        frequency: "moderate"

      - id: "FW-10"
        name: "Digital Renaissance Thinking"
        category: "Meta/Integral"
        origin: "Self-created"
        description: "The internet enables a new Renaissance where polymaths thrive. Generalists with depth across multiple domains will outperform specialists."
        evidence_sources: ["twitter", "newsletter", "videos", "books"]
        frequency: "moderate"

  tier_2_operational_frameworks:
    description: "Frameworks used regularly in content and business operations"

    frameworks:
      - id: "FW-11"
        name: "Content Avatar Method"
        category: "Creative"
        description: "Write for your past self. Your ideal reader is who you were 2-3 years ago."

      - id: "FW-12"
        name: "Curiosity-Driven Skill Stacking"
        category: "Business"
        description: "Stack skills by following curiosity, not market demand. The unique combination creates the moat."

      - id: "FW-13"
        name: "Problem-Solution Content Loop"
        category: "Creative"
        description: "Every piece of content follows: identify real problem → share personal experience → present framework → give action step."

      - id: "FW-14"
        name: "4-Hour Workday System"
        category: "Business"
        description: "2 hours creative deep work + 2 hours business operations = sustainable full output."

      - id: "FW-15"
        name: "Dopamine Detox Protocol"
        category: "Philosophical"
