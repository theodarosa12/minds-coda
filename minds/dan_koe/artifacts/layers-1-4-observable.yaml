      - id: "FW-17"
        name: "Attention Funnel Architecture"
        category: "Business"
        description: "Broad attention (social) → filtered attention (newsletter) → deep attention (courses/community)."

      - id: "FW-18"
        name: "The Writer's Leverage Equation"
        category: "Creative"
        description: "One piece of writing → multiple formats → multiple platforms → compounding returns over years."

      - id: "FW-19"
        name: "Personal Monopoly Framework"
        category: "Business"
        description: "Unique knowledge + unique skills + unique personality = unreplicable market position."

      - id: "FW-20"
        name: "Flow-State Optimization"
        category: "Creative"
        description: "Environmental design, challenge-skill balance, clear goals, immediate feedback for sustained creative flow."

  tier_3_referenced_frameworks:
    description: "Frameworks Dan Koe references from others but has adapted into his system"

    frameworks:
      - id: "FW-21"
        name: "Productize Yourself (Naval Ravikant)"
        adaptation: "Extended into One-Person Business Architecture"

      - id: "FW-22"
        name: "Deep Work (Cal Newport)"
        adaptation: "Compressed into 2-Hour Writer and 4-Hour Workday"

      - id: "FW-23"
        name: "AQAL (Ken Wilber)"
