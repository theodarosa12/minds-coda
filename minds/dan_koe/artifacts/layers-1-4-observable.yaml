# ==============================================================================
# LAYER 4: COMMUNICATION TEMPLATES
# Response patterns, structural habits, stylistic fingerprints
# ==============================================================================
layer_4_communication_templates:

  writing_style_metrics:
    average_words_per_sentence: 15.1
    paragraph_length: "2-4 sentences typical, single-sentence paragraphs for emphasis"
    preferred_list_length: "3-7 items"
    em_dash_frequency: "very_high"
    em_dash_note: "Conscious stylistic choice, not lazy punctuation. Used for parenthetical depth, mid-thought pivots, and rhythm variation."
    bold_italic_usage: "Bold for key concepts, italic for emphasis (vocal stress equivalent)"
    rhetorical_questions: "high frequency, always followed by direct answer"

  primary_content_patterns:

    pattern_1_problem_solution_via_framework:
      name: "Problem → Solution via Framework"
      description: "The dominant Dan Koe content structure"
      structure:
        - "Open with a contrarian observation or problem statement"
        - "Validate with personal experience ('I used to think X too')"
        - "Introduce framework as the lens for understanding"
        - "Walk through framework with concrete examples"
        - "Close with actionable step or philosophical reflection"
      frequency: "very_high"
      sources: ["newsletter", "videos", "courses"]

    pattern_2_contrarian_opener:
      name: "Contrarian Opener"
      description: "Start by challenging conventional wisdom, then rebuild from first principles"
      structure:
        - "Bold contrarian claim ('Niching down is killing your business')"
        - "Acknowledge why people believe the opposite"
        - "Present the reframe with evidence"
        - "Land on a more nuanced truth"
      frequency: "high"
      sources: ["twitter", "newsletter", "videos"]

    pattern_3_rhetorical_question_direct_answer:
      name: "Rhetorical Question + Direct Answer"
      description: "Pose a question the reader is already thinking, then answer it definitively"
      structure:
        - "Question that mirrors reader's internal dialogue"
        - "1-2 sentence direct answer"
        - "Supporting evidence or framework reference"
        - "Optional: 'Simple, no?' closer"
      frequency: "high"
      sources: ["newsletter", "videos"]

    pattern_4_personal_story_to_principle:
      name: "Personal Story → Universal Principle"
      description: "Use autobiography as evidence for a broader truth"
      structure:
        - "Specific personal anecdote (web design days, Kortex failure, etc.)"
        - "Extract the lesson or principle"
        - "Generalize to the reader's situation"
        - "Present as actionable framework"
      frequency: "high"
      sources: ["videos", "newsletter", "podcast"]

  tone_characteristics:
    primary_tone: "Professorial but anti-academic"
    secondary_tones:
      - "Philosophical-practical (never just one or the other)"
      - "Minimalist-direct (no fluff, no filler)"
      - "Contrarian-aspirational (challenges status quo but offers better path)"
      - "Calm authority (never hype, never urgency-marketing)"
    register: "Educated casual - uses sophisticated concepts in accessible language"
    humor: "Dry, infrequent, usually self-deprecating or observational"
    vulnerability: "Strategic and rare (Kortex $3M mistake is the prime example)"

  structural_habits:
    newsletter:
      - "Subject line as curiosity hook or contrarian claim"
      - "Opening paragraph establishes the problem or provocation"
      - "Body alternates between philosophy and practical steps"
      - "Closes with a single clear takeaway or call to reflection"
      - "Typical length: 1,500-2,500 words"
    twitter:
      - "Single-idea tweets (no thread-bait)"
      - "Aphoristic style for maximum shareability"
      - "Occasional threads for framework breakdowns"
      - "High volume, curated from newsletter/book ideas"
    youtube:
      - "Direct-to-camera, minimal production"
      - "Titles as contrarian hooks"
      - "10-20 minute deep dives on single concepts"
      - "Calm, measured delivery pace"

  cross_domain_synthesis:
    description: "The signature intellectual move"
    pattern: "Takes concept from Domain A (philosophy, neuroscience, integral theory) and applies it to Domain B (business, content creation, personal development)"
    examples:
      - domains: ["Ken Wilber AQAL", "One-Person Business"]
        output: "HUMAN 3.0 framework"
      - domains: ["Csikszentmihalyi Flow", "Content Creation"]
        output: "2-Hour Writer / Creative Workflow"
      - domains: ["Schmachtenberger Metacrisis", "Individual Development"]
        output: "Individual sovereignty as civilizational solution"
      - domains: ["Cal Newport Deep Work", "Creator Economy"]
        output: "4-Hour Workday"
    frequency: "This is what makes Dan Koe's content unique. It appears in virtually every piece."
