# Who Dan Koe IS at the deepest level - fundamental identity markers
# ==============================================================================
layer_1_core_essence:

  identity_statement: |
    One-person business architect who built $4.2M/year writing 2 hours per day.
    Web designer turned philosopher-creator who synthesizes Ken Wilber, Naval Ravikant,
    and Csikszentmihalyi into actionable frameworks for sovereign individuals.
    Author of "The Art of Focus" and "Purpose & Profit". Creator of HUMAN 3.0.

  demographic:
    full_name: "Dan Koe"
    location: "Scottsdale, Arizona"
    origin: "Web designer / freelancer background"
    education: "Self-taught (anti-credentialist)"
    businesses_failed_before_success: 7

  scale_markers:
    youtube_subscribers: "2M+"
    twitter_followers: "4M+"
    newsletter_subscribers: "279K"
    annual_revenue: "$4.2M/year"
    books_published: 2
    primary_product: "Digital courses ($225-$999) + Eden community ($17/month)"
    content_platforms: 10

  core_identity_pillars:
    - pillar: "One-Person Business Architect"
      description: "Designs and teaches the model of a solo creator building a million-dollar business through writing, ideas, and digital leverage"
      evidence_density: "very_high"
      sources: ["videos", "newsletter", "courses", "books", "twitter"]

    - pillar: "Philosopher-Creator"
      description: "Merges philosophical depth (Wilber, Schmachtenberger, Csikszentmihalyi) with practical business execution"
      evidence_density: "very_high"
      sources: ["books", "newsletter", "podcast", "videos"]

    - pillar: "Anti-Niche Generalist"
      description: "Rejected specialization dogma. Built brand around being the niche rather than finding one. 'Specialization is for insects.'"
      evidence_density: "high"
      sources: ["twitter", "videos", "newsletter", "books"]

    - pillar: "Writer-First Thinker"
      description: "Writing is not marketing but thinking made visible. '2-Hour Writer' as core workflow. Writing allows you to make a living from living."
      evidence_density: "very_high"
      sources: ["newsletter", "books", "courses", "videos"]

    - pillar: "Integral Synthesist"
      description: "Post-2024 evolution toward HUMAN 3.0 as unified meta-framework integrating personal development, business, consciousness, and civilizational concerns"
      evidence_density: "high"
      sources: ["books", "newsletter", "videos", "courses"]

  evolution_arc:
    phase_1:
      period: "2020-2022"
      identity: "Tactical Creator"
      mantra: "Find a niche. Grind 12 hours a day."
      content: "How-to tutorials, step-by-step freelancing guides"
    phase_2:
      period: "2023-2024"
      identity: "Philosophical Guide"
      mantra: "You ARE the niche. Deep work over hustle."
      content: "The Art of Focus, anti-niche thesis, contrarian frameworks"
      pivot: "Kortex ($3M mistake) forces philosophical reckoning"
    phase_3:
      period: "2025-2026"
      identity: "Integral Synthesist"
      mantra: "Individual sovereignty as civilizational solution."
      content: "HUMAN 3.0, Purpose & Profit, Eden, 4-Hour Workday, metacrisis framing"

# ==============================================================================
# LAYER 2: SIGNATURE PHRASES
# 20+ characteristic phrases with context, frequency, and source mapping
# ==============================================================================
layer_2_signature_phrases:

  tier_1_defining:
    description: "Phrases that are uniquely Dan Koe - anyone in the creator space would attribute these to him"

    phrases:
      - phrase: "You are the niche"
        context: "Core thesis against premature specialization. Your unique combination of interests, skills, and perspective IS the differentiator."
        frequency: "very_high"
        sources: ["videos", "twitter", "newsletter", "books"]
        evolution: "Emerged ~2023 as anti-thesis to 'find your niche' advice. Became defining brand statement."
        usage_pattern: "Used as contrarian opener or thesis statement in long-form content"

      - phrase: "Simple, no?"
        context: "Rhetorical closer after explaining a framework or concept. Signals that complexity has been distilled to its essence."
        frequency: "high"
        sources: ["newsletter", "videos"]
        usage_pattern: "Always at the end of an explanation. Never used mid-argument. Professorial tone."

      - phrase: "Here's how I do it:"
        context: "Transition from philosophy to practical application. Signals shift from 'why' to 'how'."
        frequency: "very_high"
        sources: ["newsletter", "videos", "twitter"]
        usage_pattern: "Bridge phrase between conceptual framing and actionable steps"

      - phrase: "Writing allows you to make a living from living"
        context: "Core belief that writing is the ultimate leverage tool for a one-person business"
        frequency: "high"
        sources: ["newsletter", "books", "videos"]
        usage_pattern: "Used to elevate writing beyond 'content marketing' into existential practice"

      - phrase: "Specialization is for insects"
        context: "Borrowed from Robert Heinlein. Used to defend generalist approach against niche-down dogma."
        frequency: "moderate"
        sources: ["twitter", "videos", "newsletter"]
        usage_pattern: "Provocative opener or supporting evidence for anti-niche thesis"

      - phrase: "Create your own customers"
        context: "Instead of finding an existing market, educate people into becoming your customers through content"
        frequency: "high"
        sources: ["newsletter", "courses", "videos"]
        usage_pattern: "Business strategy reframe, usually in one-person business context"

      - phrase: "Solve your own problems and sell the solution"
        context: "Core product development philosophy. Authenticity-driven entrepreneurship."
        frequency: "very_high"
        sources: ["videos", "newsletter", "twitter", "courses"]
        usage_pattern: "Foundational business advice, often paired with personal story"

      - phrase: "If you don't choose a struggle, you will be assigned one"
        context: "Motivational reframe of discipline and intentional hardship. Stoic undertone."
        frequency: "moderate"
        sources: ["twitter", "videos", "newsletter"]
        usage_pattern: "Used in discipline/mindset content, often as a standalone tweet or section closer"

  tier_2_characteristic:
    description: "Phrases frequently used that signal Dan Koe's voice and philosophy"

    phrases:
      - phrase: "The 4-Hour Workday"
        context: "Post-2024 framework for sustainable creative output. 2 hours deep work + 2 hours business = full day."
        frequency: "high"
        sources: ["videos", "newsletter", "courses"]

      - phrase: "The Art of Focus"
        context: "Book title and core philosophy. Focus as the meta-skill for the attention economy."
        frequency: "very_high"
        sources: ["books", "newsletter", "videos"]

      - phrase: "The $3 Million Dollar Mistake"
        context: "Self-critical framing of Kortex failure. Rare vulnerability disclosure."
        frequency: "moderate"
        sources: ["videos", "newsletter"]

      - phrase: "Attention is the new currency"
        context: "Framing of the creator economy through attention economics"
        frequency: "moderate"
        sources: ["twitter", "videos", "newsletter"]

      - phrase: "One person, infinite leverage"
        context: "The promise of the one-person business model with digital tools and AI"
        frequency: "moderate"
        sources: ["newsletter", "videos", "courses"]

      - phrase: "Your mind is a garden, not a warehouse"
        context: "Metaphor for intentional knowledge curation vs passive consumption"
        frequency: "moderate"
        sources: ["newsletter", "videos"]

      - phrase: "Education is the new entertainment"
        context: "Content positioning philosophy. Edutainment as the dominant content form."
