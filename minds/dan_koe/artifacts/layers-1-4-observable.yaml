      - id: "FW-26"
        name: "Metacrisis (Schmachtenberger)"
        adaptation: "Civilizational framing for why individual sovereignty matters"

      - id: "FW-27"
        name: "Antifragility (Nassim Taleb)"
        adaptation: "Business resilience through one-person model"

      - id: "FW-28"
        name: "1000 True Fans (Kevin Kelly)"
        adaptation: "Newsletter and community strategy"

      - id: "FW-29"
