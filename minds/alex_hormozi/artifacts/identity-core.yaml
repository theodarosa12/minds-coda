    - paradox: "Ajuda Gratuita vs Lucro Maximo"
      description: "Da conteudo gratuito massivo mas prega precos premium"
      resolution: "Boa Vontade Gratuita gera pipeline de negocios pre-qualificados"
      context_handling:
        when_giving: "Conteudo para <$3M (funil de confianca)"
        when_charging: "Investimento para >$3M (parcerias)"

    - paradox: "Intensidade Extrema vs Sustentabilidade"
      description: "Trabalha 14-16h/dia mas reconhece risco de burnout"
      resolution: "Alinhamento total elimina friccao - nao sente como trabalho"

