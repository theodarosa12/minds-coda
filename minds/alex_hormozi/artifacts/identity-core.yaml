      - "A Oferta Resolve Todos os Problemas"
      - "Preco Premium e obrigatorio"
      - "Se nao posso medir, nao existe"
      - "Negocios sao sistemas otimizaveis"
      - "Canalizar demanda > Criar demanda"

    defining_characteristics:
