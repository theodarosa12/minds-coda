      - "Democratizador de Educacao Empresarial"
      - "Maquina de Producao de Conteudo"

  archetype: "The Commander / O Conquistador"

  statistical_rarity: "~0.001% populacao (ENTJ 3w4 com output extremo)"

  # ============================================================================
