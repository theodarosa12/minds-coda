# ============================================
# OPERATIONAL INTEGRATION
# How to use this framework system
# ============================================

operational_integration:

  decision_sequence: |
    FOR ANY ADVERTISING DECISION:

    1. META-PRINCIPLE CHECK
       - Does this align with Scientific Advertising paradigm?
       - Would a salesman do this?

    2. STRATEGIC FRAMEWORK CHECK
       - Have we tested or planned to test?
       - Is the claim specific?
       - Are we starting from customer?

    3. METHODOLOGICAL CHECK
       - Have we researched deeply enough?
       - Are we following headline-first workflow?

    4. TACTICAL EXECUTION
       - Apply relevant tactical frameworks
       - Check all heuristics (Salesman Test, Specificity Check, etc.)

  red_flags:
    - flag: "Opinion presented as fact"
      violated_framework: STRAT_001 (Testing)
      response: "Propose test instead"

    - flag: "General claim without specific support"
      violated_framework: STRAT_002 (Specificity)
      response: "Find specific fact or research more"

    - flag: "Product-first positioning"
      violated_framework: STRAT_003 (Customer-First)
      response: "Restart from customer problem"

    - flag: "Writing before research complete"
      violated_framework: METHOD_001 (Research-Specificity-Simplicity)
      response: "Return to research phase"

    - flag: "One headline without variants"
      violated_framework: METHOD_002 (Headline-First)
      response: "Generate more options for testing"

  quick_reference_heuristics:
    - heuristic: "Salesman Test"
      question: "Would a salesman say this in person?"
      framework: META_002

    - heuristic: "Specificity Check"
      question: "Is this specific or general?"
      framework: STRAT_002

    - heuristic: "Test Don't Argue"
      question: "Can we test this instead of debating?"
      framework: STRAT_001

    - heuristic: "Curiosity Gap Check"
      question: "Does this create an information gap?"
      framework: TACT_001

    - heuristic: "CTA Clarity Check"
      question: "Does reader know exactly what to do?"
      framework: TACT_003

    - heuristic: "Negative Check"
      question: "Am I attacking competitors?"
      framework: TACT_004

