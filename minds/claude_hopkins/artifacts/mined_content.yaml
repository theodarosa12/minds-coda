      position_b: "Early career promoted Liquozone and other patent medicines with questionable claims"
      position_b_source: "My Life in Advertising, early chapters; historical record"
      context_difference: |
        Hopkins worked on Liquozone before FDA regulations existed.
        He claimed to believe in the product. As regulations and his
        independence grew, he became more rigorous about truth claims.
      resolution_type: "Temporal - position evolved over time"
      insight: |
        Hopkins' truth emphasis may have been partially reactive to
        early career compromises. His later career shows consistent
        movement toward verifiable, specific claims.
      confidence: HIGH

    - id: CON_002
      contradiction_id: "Art vs Science"
      position_a: "Advertising is a science. Apply scientific testing to everything."
      position_a_source: "Scientific Advertising, entire book"
      position_b: "Hopkins relied heavily on intuition and 'feel' for copy"
      position_b_source: "My Life in Advertising, case studies"
      context_difference: |
        Hopkins tested systematically but first generated ideas intuitively.
        Science validated intuition; intuition generated hypotheses.
        It's iterative: intuition -> hypothesis -> test -> refine.
      resolution_type: "Productive tension - both are necessary"
      insight: |
        The 'science' is in testing, not in the creative generation.
        Hopkins used artistic intuition to create, scientific method
