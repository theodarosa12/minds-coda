  mind_name: "Claude C. Hopkins"
  analysis_date: "2026-01-23"
  analyst: "identity-analyst"
  layer: 7
  layer_name: "Core Obsessions"

  methodology_note: |
    Obsessions are not negative - they're the compass pointing to true identity.
    "What someone can't stop thinking about IS their identity."

    For Claude Hopkins (1866-1932), we analyze obsessions through:
    - His autobiographical writings (thought loops in narrative)
    - Time investment patterns (what he spent decades doing)
    - Emotional intensity (what triggered passion/contempt)
    - Return patterns (what persisted across career)
    - Identity fusion (what he couldn't imagine life without)

  sources_analyzed:
    - "Scientific Advertising (1923)"
    - "My Life in Advertising (1927)"
    - "Disciple commentary (Ogilvy, Halbert, Schwartz)"
    - "Historical records"
    - "Case study patterns"

  key_insight: |
    Hopkins' obsessions were remarkably aligned with his values.
    The hidden curriculum reveals his obsessions were MORE INTENSE
    than his writings suggest - 10x the depth he explicitly advised.

# ============================================
