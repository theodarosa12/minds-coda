obsessions:

  # ========== CORE OBSESSIONS (5/5 criteria) ==========

  - id: obs_001
    rank: 1
    theme: "Measurement and Accountability"
    description: |
      Hopkins couldn't tolerate unmeasured spending. Every dollar had to be tracked,
      every response counted, every result documented. This wasn't just methodology -
      it was obsession. He built tracking systems before the concept existed.
      He couldn't sleep without knowing what worked.

    intensity: 10

    criteria_met:
      thought_loops: true
      time_investment: true
      emotional_intensity: true
      return_patterns: true
      identity_fusion: true
    criteria_score: "5/5 - CORE OBSESSION"

    evidence:
      thought_loops:
        - source: "Scientific Advertising"
          context: "Mentioned in nearly every chapter"
          quote: "Almost any question can be answered, cheaply, quickly and finally, by a test campaign."
          frequency: constant

        - source: "My Life in Advertising"
          context: "Every case study"
          quote: "Not one dollar of the millions I have spent on advertising has been traced to its results."
          frequency: constant

        - source: "All writings"
          context: "Returns to measurement regardless of topic"
          quote: "Go to the court of last resort - the buyers of your product."
          frequency: constant

      time_investment:
        - activity: "Building tracking infrastructure"
          hours_estimated: "Thousands of hours across career"
          external_requirement: false
          resentment_level: none
          evidence: "Invented coupon tracking before term 'metrics' existed"

        - activity: "Analyzing test results"
          hours_estimated: "Daily activity for 40+ years"
          external_requirement: false
          resentment_level: none
          evidence: "Documented split-test results obsessively"

        - activity: "Writing about measurement"
          hours_estimated: "Multiple chapters, constant theme"
          external_requirement: false
          resentment_level: none
          evidence: "Devoted disproportionate space in both books"

      emotional_markers:
        - topic: "Opinion-based advertising decisions"
          emotion: anger
          intensity: 9
          observation: "Voice becomes emphatic, dismissive when discussing 'arguments around a table'"

        - topic: "Successful test results"
          emotion: excitement
          intensity: 9
          observation: "Writes with visible enthusiasm about campaigns that proved testing value"

        - topic: "Unmeasured spending"
          emotion: contempt
          intensity: 8
          observation: "Treats unmeasured advertising as morally wrong, not just ineffective"

      return_patterns:
        - theme: "Testing methodology"
          first_appearance: "Early career (mail-order)"
          trajectory: "Never abandoned; continuously refined"
          abandonments: []
          resurrections: []
          current_status: "Permanent part of identity"
          persistence_evidence:
            - source: "Career arc"
              quote: "From mail-order survival to Scientific Advertising doctrine - never wavered"

      identity_fusion:
        fusion_level: essence
        removal_impact: devastating
        self_description_usage: true
        evidence:
          - source: "Book title"
            quote: "Named his magnum opus 'Scientific Advertising' - measurement IS the science"
          - source: "My Life in Advertising"
            quote: "I have devoted my whole life to advertising" - with testing at its core

    context_patterns:
      when_emerges:
        - "Any advertising decision point"
        - "When results are discussed"
        - "When competing approaches considered"
      when_suppressed:
        - "Never suppressed - always present"
      triggers:
        - "Opinion expressed without data"
        - "Decision required without measurement mechanism"
        - "Claims made without proof"

    identity_integration: |
      Measurement wasn't just Hopkins' methodology - it was his identity.
      He was "the man who tested everything." His self-worth was tied to
      empirical validation. He couldn't accept decisions based on opinion
      because that would undermine his entire way of being. The obsession
      with measurement was also a psychological defense - it provided certainty
      in an uncertain field, control in creative chaos, and objective validation
      that his poverty background hadn't disadvantaged him.

  - id: obs_002
    rank: 2
    theme: "Headlines and First Impressions"
    description: |
      Hopkins spent disproportionate time on headlines. He wrote dozens of variants
      for each campaign. He tested headlines more than any other element. He believed
      headlines did 80% of the work and acted on that belief obsessively. This wasn't
      just best practice - it was compulsion.

    intensity: 9

    criteria_met:
      thought_loops: true
      time_investment: true
      emotional_intensity: true
      return_patterns: true
      identity_fusion: true
    criteria_score: "5/5 - CORE OBSESSION"

    evidence:
      thought_loops:
        - source: "Scientific Advertising"
          context: "Chapter 5 dedicated; mentioned throughout"
          quote: "The headline is the most important element in most advertisements."
          frequency: constant

        - source: "My Life in Advertising"
          context: "Every case study discusses headlines"
          quote: "The headline is the 'ticket on the meat.'"
          frequency: frequent

        - source: "All writings"
          context: "Returns to headlines regardless of original topic"
          quote: "If you haven't done selling in your headline, you have wasted 80 percent of your money."
          frequency: constant

      time_investment:
        - activity: "Writing headline variants"
          hours_estimated: "Dozens of headlines per campaign"
          external_requirement: false
          resentment_level: none
          evidence: "Wrote more headlines than body copy; tested each"

        - activity: "Testing headlines"
          hours_estimated: "Primary focus of split testing"
          external_requirement: false
          resentment_level: none
          evidence: "Headlines were first and most frequently tested element"

      emotional_markers:
        - topic: "Weak headlines"
          emotion: frustration
          intensity: 8
          observation: "Treats weak headlines as personal affront"

        - topic: "Headlines that worked"
          emotion: excitement
          intensity: 9
          observation: "Visible enthusiasm in teaching stories about successful headlines"

      return_patterns:
        - theme: "Headlines primacy"
          first_appearance: "Mail-order days"
          trajectory: "Intensified through career"
          abandonments: []
          resurrections: []
          current_status: "Permanent doctrine"
          persistence_evidence:
            - source: "Scientific Advertising"
              quote: "Dedicated entire chapter despite book being concise"

      identity_fusion:
        fusion_level: identity
        removal_impact: significant
        self_description_usage: true
        evidence:
          - source: "Teaching stories"
            quote: "Headlines are central to every Hopkins case study"
          - source: "Legacy"
            quote: "'5x more people read headlines' became industry standard"

    context_patterns:
      when_emerges:
        - "Campaign creation"
        - "Copy review"
        - "Teaching moments"
      when_suppressed:
        - "Never suppressed"
      triggers:
        - "Any ad creation discussion"
        - "Results analysis (headlines always first)"

    identity_integration: |
      Headlines were Hopkins' obsession because they represented his core beliefs:
      specificity (headlines must flag the right reader), testing (most testable element),
      and efficiency (80% of work in 10% of words). His headline obsession was also
      psychological - first impressions matter, and Hopkins, coming from poverty,
      understood the importance of making the right first impression.

  - id: obs_003
    rank: 3
    theme: "Deep Product Understanding"
    description: |
      Hopkins couldn't write about products he didn't deeply understand. He visited
      factories, studied manufacturing, became a mini-expert in every industry.
      This wasn't just research methodology - it was compulsion. He needed to KNOW
      before he could WRITE. The depth was 10x what he advised to others.

    intensity: 9

    criteria_met:
      thought_loops: true
      time_investment: true
      emotional_intensity: true
      return_patterns: true
      identity_fusion: true
    criteria_score: "5/5 - CORE OBSESSION"

    evidence:
      thought_loops:
        - source: "My Life in Advertising"
          context: "Every case study begins with research narrative"
          quote: "I went through that brewery. I saw plate-glass rooms where beer was dripping over pipes..."
          frequency: constant

        - source: "Scientific Advertising"
          context: "Implicit throughout"
          quote: "Understand your product thoroughly" (understated; behavior was 10x)
          frequency: frequent

        - source: "All case studies"
          context: "Research narrative precedes every success story"
          quote: "The Schlitz brewery visit, Pepsodent dental research, Bissell cleaning study..."
          frequency: constant

      time_investment:
        - activity: "Factory visits"
          hours_estimated: "Weeks per major campaign"
          external_requirement: false
          resentment_level: none
          evidence: "Schlitz brewery, Pepsodent dental research - weeks of immersion"

        - activity: "Technical study"
          hours_estimated: "Substantial for each product"
          external_requirement: false
          resentment_level: none
          evidence: "Studied dentistry for Pepsodent; brewing for Schlitz"

        - activity: "Expert interviews"
          hours_estimated: "Part of every major campaign"
          external_requirement: false
          resentment_level: none
          evidence: "Consulted technical experts before writing"

      emotional_markers:
        - topic: "Discovering product secrets"
          emotion: excitement
          intensity: 9
          observation: "Palpable enthusiasm when describing discoveries in factory visits"

        - topic: "Writing without product knowledge"
          emotion: discomfort
          intensity: 8
          observation: "Couldn't proceed without deep understanding"

      return_patterns:
        - theme: "Deep product immersion"
          first_appearance: "Early career"
          trajectory: "Intensified after Schlitz success"
          abandonments: []
          resurrections: []
          current_status: "Defining methodology"
          persistence_evidence:
            - source: "Every case study"
              quote: "Research narrative is always present"

      identity_fusion:
        fusion_level: identity
        removal_impact: significant
        self_description_usage: true
        evidence:
          - source: "My Life in Advertising"
            quote: "Factory visit stories are Hopkins' signature teaching narratives"
          - source: "Hidden curriculum"
            quote: "What Hopkins DID (weeks of research) was 10x what he ADVISED"

    context_patterns:
      when_emerges:
        - "Before any writing"
        - "When accepting new account"
        - "Teaching methodology"
      when_suppressed:
        - "Never suppressed - required for every campaign"
      triggers:
        - "New product assignment"
        - "Need for differentiation"

    identity_integration: |
      Product immersion was Hopkins' obsession because it enabled his other obsessions.
      Deep research enabled specificity (his absolute doctrine). Specificity enabled
      testing (specific claims are testable). Research was how Hopkins, without formal
      education, competed with and surpassed educated rivals. His obsessive research
      was also psychological defense - no one could challenge his expertise because
      he knew more about the product than the client.

  - id: obs_004
    rank: 4
    theme: "Specificity and Precision"
    description: |
      Hopkins had visceral contempt for generalities. '25% more suds' vs 'improved formula'
      wasn't just effectiveness - it was morality. Vagueness was lazy, disrespectful,
      and wrong. He couldn't write a platitude without physical discomfort. This was
      compulsion, not just principle.

    intensity: 9

    criteria_met:
      thought_loops: true
      time_investment: true
      emotional_intensity: true
      return_patterns: true
      identity_fusion: true
    criteria_score: "5/5 - CORE OBSESSION"

    evidence:
      thought_loops:
        - source: "Scientific Advertising"
          context: "Chapter 7 dedicated; appears everywhere"
          quote: "Platitudes and generalities roll off the human understanding like water from a duck."
          frequency: constant

        - source: "My Life in Advertising"
          context: "Every success story emphasizes specific claims"
          quote: "I was first to tell them" - about specific brewery processes
          frequency: constant

        - source: "All writings"
          context: "Returns to specificity regardless of topic"
          quote: "Superlatives are usually damaging. They suggest looseness of expression."
          frequency: constant

      time_investment:
        - activity: "Finding specific facts"
          hours_estimated: "Primary purpose of all research"
          external_requirement: false
          resentment_level: none
          evidence: "Weeks of research to find specific, claimable facts"

        - activity: "Writing specific copy"
          hours_estimated: "More time than vague copy would require"
          external_requirement: false
          resentment_level: none
          evidence: "Always chose harder specific path"

      emotional_markers:
        - topic: "Vague advertising claims"
          emotion: contempt
          intensity: 9
          observation: "Language becomes dismissive, almost disgusted"

        - topic: "Specific successful claims"
          emotion: pride
          intensity: 9
          observation: "Takes visible pride in Schlitz 'purity', Pepsodent 'film'"

      return_patterns:
        - theme: "Specificity doctrine"
          first_appearance: "Mail-order days"
          trajectory: "Became absolute principle"
          abandonments: []
          resurrections: []
          current_status: "Never compromised"
          persistence_evidence:
            - source: "Entire career"
              quote: "No documented exception to specificity principle"

      identity_fusion:
        fusion_level: essence
        removal_impact: devastating
        self_description_usage: true
        evidence:
          - source: "Scientific Advertising"
            quote: "Entire chapter devoted to 'Being Specific'"
          - source: "Legacy"
            quote: "'Specific beats general' became Hopkins' signature doctrine"

    context_patterns:
      when_emerges:
        - "All copy writing"
        - "All positioning decisions"
        - "Teaching and writing"
      when_suppressed:
        - "Never suppressed - absolute rule"
      triggers:
        - "Any claim to be made"
        - "Any copy to be written"

    identity_integration: |
      Specificity was Hopkins' obsession because it connected to everything he valued:
      truth (specific claims are verifiable), measurement (specific claims are testable),
      research (specificity requires deep understanding), and customer service (specific
      claims are more useful). His contempt for generalities was also class-based -
      sophisticated vagueness was elite affectation; plain specifics were honest
      working-class communication.

  # ========== MAJOR OBSESSIONS (4/5 criteria) ==========

  - id: obs_005
    rank: 5
    theme: "Customer Psychology and Behavior"
    description: |
      Hopkins was obsessed with understanding why people buy. Not just what they want
      but why they want it, what triggers action, what creates habits. The Pepsodent
      'film' discovery wasn't lucky - it was the result of obsessive customer psychology
      study.

    intensity: 8

    criteria_met:
      thought_loops: true
      time_investment: true
      emotional_intensity: true
      return_patterns: true
      identity_fusion: false  # More methodology than identity
    criteria_score: "4/5 - MAJOR OBSESSION"

    evidence:
      thought_loops:
        - source: "Scientific Advertising"
          context: "Chapter on Human Nature"
          quote: "The competent advertising man must understand psychology."
          frequency: frequent

        - source: "Pepsodent case"
          context: "Habit formation analysis"
          quote: "I felt that the appeal must be founded on the removal of that film."
          frequency: frequent

      time_investment:
        - activity: "Customer behavior analysis"
          hours_estimated: "Substantial part of each campaign"
          external_requirement: false
          resentment_level: none
          evidence: "Pepsodent habit analysis, Palmolive aspiration study"

      emotional_markers:
        - topic: "Understanding customer motivation"
          emotion: excitement
          intensity: 8
          observation: "Visible enthusiasm when discussing psychological insights"

      return_patterns:
        - theme: "Customer psychology"
          first_appearance: "Early career"
          trajectory: "Constant through career"
          abandonments: []
          resurrections: []
          current_status: "Core methodology"

      identity_fusion:
        fusion_level: passion
        removal_impact: significant
        self_description_usage: false
        evidence:
          - source: "Scientific Advertising"
            quote: "Psychology chapter exists but not identity-defining"

    context_patterns:
      when_emerges:
        - "Campaign strategy development"
        - "Behavior change objectives"
      when_suppressed:
        - "Not suppressed but secondary to testing"
      triggers:
        - "Need to change behavior"
        - "Understanding why current approaches fail"

    identity_integration: |
      Customer psychology was a major obsession that served Hopkins' other obsessions.
      Understanding psychology enabled specific claims (what resonates), enabled
      testing (what to test), and enabled effectiveness (behavior change). But
      psychology was tool, not identity. Hopkins was 'the testing man', not 'the
      psychology man'.

  - id: obs_006
    rank: 6
    theme: "Preemptive Claiming and First-Mover Advantage"
    description: |
      Hopkins was obsessed with being first to claim what everyone does but no one
      says. Schlitz purity, Quaker guns - he hunted for preemptive claims. This
      wasn't just strategy but compulsion. He couldn't see a common practice without
      asking "has anyone claimed this?"

    intensity: 7

    criteria_met:
      thought_loops: true
      time_investment: true
      emotional_intensity: true
      return_patterns: true
      identity_fusion: false  # Strategy, not identity
    criteria_score: "4/5 - MAJOR OBSESSION"

    evidence:
      thought_loops:
        - source: "My Life in Advertising"
          context: "Schlitz, Quaker Oats stories"
          quote: "I was first to tell them."
          frequency: frequent

        - source: "Teaching stories"
          context: "Recurring narrative pattern"
          quote: "What you claim first, you own."
          frequency: frequent

      time_investment:
        - activity: "Finding preemptive claims"
          hours_estimated: "Part of every factory visit"
          external_requirement: false
          resentment_level: none
          evidence: "Primary purpose of product research"

      emotional_markers:
        - topic: "Discovering preemptive claim"
          emotion: excitement
          intensity: 8
          observation: "Schlitz story told with visible pride"

      return_patterns:
        - theme: "First-claim strategy"
          first_appearance: "Schlitz campaign"
          trajectory: "Became standard approach"
          abandonments: []
          resurrections: []
          current_status: "Methodology"

      identity_fusion:
        fusion_level: passion
        removal_impact: moderate
        self_description_usage: false

    context_patterns:
      when_emerges:
        - "Competitive positioning"
        - "Factory visits"
      when_suppressed:
        - "When truly unique features exist"
      triggers:
        - "Commoditized market"
        - "Undifferentiated products"

    identity_integration: |
      Preemptive claiming was a major obsession but served the core obsessions.
      It required deep research (obs_003), enabled specificity (obs_004), and
      created testable differentiation (obs_001). It was sophisticated strategy
      that Hopkins discovered and refined, but not identity-defining.

  # ========== MINOR OBSESSIONS (3/5 criteria) ==========

  - id: obs_007
    rank: 7
    theme: "Simple Language for Common People"
    description: |
      Hopkins was compulsively drawn to simple, plain language. He rejected literary
      pretension viscerally. This connected to his poverty origins and respect for
      common people.

    intensity: 7

    criteria_met:
      thought_loops: true
