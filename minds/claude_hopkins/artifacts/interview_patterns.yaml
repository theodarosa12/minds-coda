# ============================================
# PHASE 2: QUESTION FRAMING ANALYSIS
# (Adapted for autobiographical text)
# ============================================

question_framing_analysis:
  source_id: "AUTO_001 + AUTO_002"

  reasoning_patterns:
    first_principles:
      observed: true
      examples:
        - question: "How should advertising work?"
          how_they_reasoned: |
            Hopkins didn't start from 'what are other ads doing' but from
            'what is a salesman doing?' He traced back to fundamentals:
            advertising is salesmanship, salesmanship is persuasion,
            persuasion requires understanding the buyer.
          evidence_of_first_principles: |
            "Advertising is salesmanship. Its principles are the principles
            of salesmanship." - Starts from base reality, not convention.

        - question: "How to make Pepsodent successful?"
          how_they_reasoned: |
            Didn't ask 'what are toothpaste ads saying' but 'why don't
            people brush their teeth?' Started from behavior, not marketing.
            Discovered the 'film' angle through dental research.
          evidence_of_first_principles: |
            Researched dentistry, not advertising. Found physical trigger
            (film on teeth) rather than using existing category claims.

        - question: "How to sell Schlitz beer?"
          how_they_reasoned: |
            Didn't accept 'beer purity' as industry convention. Asked
            'what does pure actually mean in production?' Toured brewery,
            found specific processes, claimed them first.
          evidence_of_first_principles: |
            "I went through that brewery." Physical investigation over
            desk research. Understanding manufacturing, not marketing.

    analogy_based:
      observed: true
      favorite_analogies:
        - analogy: "Advertising is salesmanship in print"
          context_used: "Core framing for ALL advertising philosophy"
          frequency: "Mentioned 20+ times across works"
          significance: |
            Not just a metaphor - a thinking tool. Hopkins evaluated
            every ad decision by asking 'would a salesman do this?'

        - analogy: "The mail-order test"
          context_used: "Evaluating any advertising approach"
          frequency: "Frequent - entire chapter dedicated"
          significance: |
            Mail-order provides immediate feedback. Hopkins used this
            as benchmark: 'would this work in mail-order?' If not,
            likely won't work in other contexts.

        - analogy: "The one-on-one conversation"
          context_used: "Copy tone and approach"
          frequency: "Consistent throughout"
          significance: |
            Write as if talking to one person. Never 'address crowds.'
            The analogy guides voice, specificity, and personalization.

        - analogy: "The ticket on the meat"
          context_used: "Headlines"
          frequency: "Multiple references"
          significance: |
            Headlines are labels that attract the right buyer. Not
            clever wordplay - functional identification.

    framework_application:
      observed: true
      frameworks_referenced:
        - framework: "Test-Measure-Iterate"
          how_applied: |
            Every campaign decision run through this loop. Headlines,
            offers, media - all tested before scaling. Hopkins couldn't
            proceed without measurement mechanism.

        - framework: "Service-to-Customer"
          how_applied: |
            Positioning started from customer benefit, not product feature.
            Asked 'what problem does this solve?' before 'what does this do?'

        - framework: "Reason-Why Advertising"
          how_applied: |
            Every claim backed by specific proof. No assertion without
            evidence. Framework inherited from John E. Kennedy, systematized.

        - framework: "Preemptive Claim Strategy"
          how_applied: |
            Identify universal truths, claim them first. Schlitz purity,
            Quaker Oats 'shot from guns' - common practices, first claims.

  thinking_mode_signals:
    system_1_fast:
      triggers:
        - "Questions about copy quality (instant recognition of good/bad)"
        - "Spotting fraud or exaggeration (immediate skepticism)"
        - "Evaluating headlines (fast pattern matching)"
        - "Identifying customer benefit angles"
      examples:
        - "Reading copy immediately tells Hopkins if it will sell"
        - "Factory visits - instant recognition of claimable differentiators"
        - "Headline evaluation - decades of testing internalized"
      note: |
        Hopkins developed strong intuition through 40+ years of testing.
        His System 1 was trained by System 2 data. Fast responses
        came from deeply internalized patterns, not natural talent.

    system_2_slow:
      triggers:
        - "Strategy questions (market entry, positioning)"
        - "New product categories (no existing pattern)"
        - "Major investment decisions (high stakes)"
        - "Ethical gray areas (Liquozone period)"
      examples:
        - "Pepsodent strategy took months of research and iteration"
        - "Schlitz required factory investigation before positioning"
        - "New product launches always got extensive testing"
      note: |
        Hopkins emphasized deliberation for strategy but speed for tactics.
        Testing infrastructure allowed fast tactical iteration with
        slow strategic foundation.

  certainty_calibration:
    high_confidence_markers:
      linguistic_signals:
        - "The law is" (absolute principle)
        - "Always" / "Never" (universal rule)
        - "Proved by test" (empirical validation)
        - "In all my years" (experience-backed)
      context: |
        Hopkins expressed high confidence on tested principles and
        observed patterns. Lower confidence on new situations.

    uncertainty_markers:
      linguistic_signals:
        - "It seems" / "I believe" (tentative)
        - "Test to verify" (deferred to data)
        - "Exceptions exist" (acknowledges limits)
        - "Context matters" (situational awareness)
      context: |
        Hopkins rarely expressed absolute certainty on tactics without
        testing. Even for principles, he acknowledged context matters.

    examples:
      - statement: "Headlines are the most important element in most advertisements"
        confidence_level: HIGH
        linguistic_markers: "'most important', 'most advertisements' (qualified universal)"
        evidence: "Decades of split-test data"

      - statement: "Five times as many people read headlines as body copy"
        confidence_level: HIGH
        linguistic_markers: "Specific number, empirical tone"
        evidence: "Measurement across campaigns"

      - statement: "Negative advertising is seldom wise"
        confidence_level: MEDIUM
        linguistic_markers: "'seldom' (not never), allows exceptions"
        evidence: "Pattern observation, not absolute rule"

  counterfactual_thinking:
    observed: true
    examples:
      - question: "What if Schlitz had not claimed purity first?"
        counterfactual_considered: |
          Hopkins explicitly noted that every brewer used the same process.
          The counterfactual (another brewer claiming first) would have
          given THEM the differentiation. Hopkins recognized timing luck.

      - question: "What if I hadn't visited the brewery?"
        counterfactual_considered: |
          Without factory visit, Hopkins would have written generic 'pure beer'
          copy like everyone else. The visit enabled specificity. He used this
          as teaching example: research enables differentiation.

      - question: "What if testing wasn't possible?"
        counterfactual_considered: |
          Hopkins acknowledged that before mail-order testing infrastructure,
          advertising was guesswork. The counterfactual (no testing) meant
          reliance on opinion - which he explicitly rejected.

    pattern: |
      Hopkins frequently considered 'what if' scenarios, especially
      when teaching. Used counterfactuals to emphasize the importance
      of research, timing, and testing. Strong causal reasoning.

# ============================================
# PHASE 2: RESPONSE PATTERN ANALYSIS
# ============================================

response_pattern_analysis:
  source_id: "AUTO_001 + AUTO_002"

  deflection_patterns:
    questions_avoided:
      - topic: "Personal life beyond work"
        evidence: |
          My Life in Advertising mentions wife once, children rarely.
          Almost no content about friendships, hobbies, or life outside
          advertising. The book IS the work; the work IS the life.

      - topic: "Specific failures in detail"
        evidence: |
          Hopkins mentions failures generically but rarely gives specific
          campaigns that flopped. Focus is on success stories. Learning
          framed as 'what I discovered' not 'what I got wrong.'

      - topic: "Competitors and agency politics"
        evidence: |
          Very little criticism of specific individuals or agencies.
          Professional discretion. Even Liquozone ethical issues are
          glossed rather than confronted directly.

      - topic: "Money and wealth"
        evidence: |
          Hopkins became very wealthy but downplays it. 'I never worked
          for money' repeated. Uncomfortable with wealth discussion.

    deflection_techniques:
      - technique: "Redirect to principle"
        example: |
          When personal questions might arise, Hopkins pivots to
          professional principle. 'What I learned was...' rather than
          'How I felt was...'

      - technique: "Generalize the specific"
        example: |
          Individual failures become 'common mistakes' that 'many make.'
          Personal errors become universal lessons without personal exposure.

      - technique: "Forward to future benefit"
        example: |
          Past difficulties reframed as necessary education for future
          success. 'This taught me...' rather than 'This hurt me...'

  expansion_patterns:
    questions_expanded:
      - topic: "Campaign case studies"
        expansion_style: "Detailed narrative with specific examples"
        note: "Hopkins expansive on process, specific on numbers"

      - topic: "Principles of advertising"
        expansion_style: "Framework + multiple supporting examples"
        note: "Each principle gets chapter-length treatment"

      - topic: "Testing methodology"
        expansion_style: "Technical detail + real-world validation"
        note: "Clearly passionate; goes deep on measurement"

      - topic: "Headlines and copy"
        expansion_style: "Before/after examples, specific improvements"
        note: "His craft area - most detailed expansion"

    expansion_style: "Stories + Frameworks + Examples"
    note: |
      Hopkins expands through concrete examples, not abstract theory.
      Even principles are illustrated with specific campaigns.
      Teaching style: principle -> example -> example -> example.

  precision_vs_approximation:
    preference: "Precise when measured, approximate when not"
    examples:
      - question_type: "Campaign results"
        response_style: |
          Precise: specific numbers, percentages, cost-per-acquisition.
          'Sales increased 300%', '5x more people read headlines.'

      - question_type: "Principles"
        response_style: |
          Approximate: 'most', 'usually', 'in my experience.'
          Acknowledges exceptions even for strong principles.

      - question_type: "Attribution"
        response_style: |
          Humble: 'I was fortunate', 'circumstances favored.'
          Doesn't overclaim personal credit, acknowledges luck.

    pattern: |
      Hopkins was precisely quantitative when data existed,
      appropriately uncertain when data didn't. Strong calibration
      between certainty and evidence base.

  abstraction_level:
    default_altitude: "Concrete examples grounded in specific campaigns"

    altitude_shifts:
      - trigger: "When teaching principles"
        shift_direction: "Rises to principle, then descends to example"
        pattern: |
          Principle statement -> 'For instance...' -> Specific campaign
          Never stays abstract; always grounds in concrete.

      - trigger: "When reflecting on career"
        shift_direction: "Rises to life lessons"
        pattern: |
          'Looking back, I learned...' -> Abstract wisdom
          Only at end of book, after earning right through examples.

      - trigger: "When discussing ethics"
        shift_direction: "Rises to universal principle"
        pattern: |
          'Truth in advertising is essential because...'
          Ethical claims are abstract; doesn't detail specific ethical dilemmas.

# ============================================
# PHASE 3: STORY MINING
# ============================================

origin_story_analysis:
  source_id: "AUTO_001"

  core_narrative: |
    Claude Hopkins was born into poverty. His father, a minister, died young.
    From age 9, Hopkins worked to support his family. He had no formal education
    beyond high school, no inherited advantages, no connections. Yet through
    relentless hard work, systematic thinking, and obsessive study of human
    nature, he rose to become the highest-paid advertising man in the world.

    The narrative arc: Poverty -> Hard Work -> Self-Education -> Systematic Approach
    -> Measurable Success -> Industry Transformation.

    Key message: Anyone can succeed with the right methods. Genius is unnecessary.
    Systems and effort trump talent and privilege.

  key_turning_points:
    - event: "Childhood poverty and father's death"
      age_or_date: "Age 9"
      significance: |
        Origin of work ethic. Had to work to survive.
        No fallback, no safety net. This created permanent drive.
      how_they_frame_it: |
        Matter-of-fact. Not seeking sympathy. 'This was my circumstance.'
        Uses poverty as credential for understanding common people.

    - event: "Discovery of mail-order advertising"
      age_or_date: "Early career"
      significance: |
        Mail-order required measurement. This aligned with Hopkins'
        natural inclination toward data. Found his methodology.
      how_they_frame_it: |
        'The university of advertising.' Mail-order as training ground
        that forced discipline others could avoid.

    - event: "Meeting John E. Kennedy"
      age_or_date: "Lord & Thomas years"
      significance: |
        Kennedy's 'salesmanship in print' definition crystallized
        Hopkins' thinking. Mentor relationship. Intellectual foundation.
      how_they_frame_it: |
        Acknowledges Kennedy's influence. Hopkins built on Kennedy's
        insight; didn't claim to originate it.

    - event: "Schlitz Pure campaign"
      age_or_date: "Early 1900s"
      significance: |
        Proved preemptive claim strategy. Factory visit -> specificity
        -> market dominance. Validated research approach.
      how_they_frame_it: |
        Signature teaching story. Told repeatedly. Demonstrates
        his full methodology in one example.

    - event: "Pepsodent success"
      age_or_date: "1915-1920s"
      significance: |
        Created behavioral change for millions. Changed American
        dental habits. Proved habit-formation advertising works.
      how_they_frame_it: |
        Crowning achievement narrative. Most detailed case study.
        Shows full evolution from research to mass behavior change.

  hero_journey_elements:
    call_to_adventure: |
      Poverty forced Hopkins into work world early. The 'call' was
      survival, not inspiration. Advertising found him; he didn't
      choose it romantically.

    mentor_figures:
      - name: "John E. Kennedy"
        role: |
          Gave Hopkins the 'salesmanship in print' definition.
          Intellectual foundation. Kennedy was the philosopher;
          Hopkins became the practitioner who systematized it.

      - name: "Albert Lasker"
        role: |
          Patron at Lord & Thomas. Gave Hopkins platform, resources,
          and major accounts. Business enabler, not intellectual mentor.

      - name: "The common people"
        role: |
          Hopkins' upbringing among working class taught him their
          language, concerns, and motivations. Experiential mentor.

    trials:
      - "Poverty and early struggle for survival"
      - "Learning by doing (no formal education in advertising)"
      - "Liquozone ethical challenges (patent medicine era)"
      - "Multiple campaign failures before systematic approach"
      - "Skepticism from 'creative' advertising establishment"

    transformation: |
      From poor, uneducated boy to highest-paid advertising man.
      But the deeper transformation: from intuition-based to
      systematic, data-driven advertising. Hopkins transformed
      himself AND transformed the industry.

  consistency_across_sources:
    stable_elements:
      - "Poverty origin story"
      - "Work ethic as primary success driver"
      - "Systematic approach over genius"
      - "Testing and measurement emphasis"
      - "Service to customer philosophy"

    variable_elements:
      - "Degree of self-criticism (less in public works)"
      - "Attribution of luck vs skill (varies by context)"
      - "Ethical framing of patent medicine work"

    evolution_of_story: |
      Hopkins' story became more polished over time. My Life in
      Advertising (1927) is the refined version. Earlier writings
      and contemporary accounts show more rough edges. The autobiography
      is the 'official narrative' - somewhat sanitized.

