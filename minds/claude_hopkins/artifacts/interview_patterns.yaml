# ============================================
# INTERVIEW PATTERN SUMMARY
# ============================================

interview_pattern_summary:
  mind_slug: claude_hopkins

  question_framing_signature:
    dominant_reasoning: |
      First-principles combined with analogy. Hopkins reasoned from
      base realities ('what is a salesman doing?') but used powerful
      analogies to communicate and apply ('salesmanship in print').
      Strong induction from data to principle.

    certainty_calibration: |
      High confidence on tested principles, appropriate uncertainty
      on untested situations. Hopkins was precisely quantitative
      when data existed, carefully hedged when it didn't. Strong
      calibration between evidence and certainty.

    key_frameworks_referenced:
      - "Salesmanship in print (core definition)"
      - "Test-Measure-Iterate (methodology)"
      - "Service to customer (orientation)"
      - "Reason-why (copy approach)"
      - "Preemptive claiming (positioning)"
      - "Habit formation (behavior change)"

  story_signature:
    origin_story_core: |
      Self-made success from poverty. No advantages, no formal
      education, no genius - just systematic hard work and
      commitment to measurement. Anyone can succeed with the
      right methods.

    teaching_story_themes:
      - "The overlooked discovery (Schlitz purity)"
      - "The specific enemy (Pepsodent film)"
      - "The preemptive claim (Quaker Oats guns)"
      - "The mail-order education (measurement discipline)"
      - "The customer desire angle (Palmolive beauty)"

    failure_narrative_style: |
      Learning-focused with internal attribution. Failures reframed
      as education. Specific failures generalized into universal
      lessons. Emotional processing minimal; analytical processing
      dominant. Some sanitization/omission of uncomfortable failures.

  decision_signature:
    priority_patterns:
      - "Measured results over speed"
      - "Selling effectiveness over creative awards"
      - "Specific targeting over mass appeal"
      - "Research depth over quick delivery"
      - "Testing rigor over confident opinion"

    tradeoff_tendencies:
      - "Quality > Speed (always test before scaling)"
      - "Effectiveness > Creativity (sales are the only measure)"
      - "Specific > Broad (targeting over reach)"
      - "Data > Opinion (test don't argue)"

    exception_triggers:
      - "Early career necessity (Liquozone)"
      - "Before infrastructure existed"
      - "Personal financial pressure"
      - "Belief in product (however misguided)"

  hidden_curriculum:
    behavior_advice_gaps:
      - "Research obsessively, not adequately (10x depth implied)"
      - "Test continuously, not occasionally (never stop)"
      - "Simple output requires complex input (depth enables clarity)"
      - "Customer-first is sequence, not just attitude"
      - "Build systems, not just follow principles"
      - "Visualize literally, not metaphorically"

    implicit_rules:
      - "Depth of research determines quality of copy"
      - "Testing is continuous process, not event"
      - "Simplicity is earned through understanding"
      - "Start from customer problems, not product features"
      - "Systematize everything that works"
      - "Literally imagine single reader"

    environmental_designs:
      - "Factory visits as standard practice"
      - "Measurement infrastructure built in"
      - "Research-before-writing sequence"
      - "Headlines-before-body process"
      - "Test-before-scale gate"
      - "Client selection for method fit"

  meta_learning_revealed:
    how_they_learn: |
      Hopkins learned through mail-order testing - immediate feedback,
      measurable results, rapid iteration. His learning was data-driven
      and cumulative. Pattern recognition from thousands of tests.
      Principles emerged from patterns; patterns emerged from data.

    who_influenced_them:
      - "John E. Kennedy (intellectual foundation)"
      - "Albert Lasker (opportunity and platform)"
      - "Mail-order discipline (methodology)"
      - "Common people (understanding consumers)"
      - "Product immersion (each new campaign)"

    what_they_practice: |
      Hopkins practiced: systematic research, headline testing,
      measurement tracking, customer understanding, product immersion,
      and relentless iteration. His practice was embedded in systems
      that made the practice automatic. The hidden practice: intense
      visualization of single reader when writing.

