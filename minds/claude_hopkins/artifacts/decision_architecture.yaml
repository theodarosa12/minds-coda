decision_architecture_summary:

  core_insight: |
    Hopkins' exceptional decision quality came from sophisticated architecture,
    not just smart thinking. He designed his environment, process, and
    commitments to make good decisions automatic and bad decisions difficult.

    Key components:
    1. HEURISTICS: 12 fast-and-frugal rules trained by testing data
    2. CHOICE ARCHITECTURE: Physical and procedural designs that nudged
       toward principled decisions
    3. OVERRIDE PATTERNS: Clear rules for when System 2 must override System 1
    4. COMMITMENT DEVICES: Mechanisms that locked in good behavior
    5. STAKES CALIBRATION: Appropriate decision investment by magnitude

  dominant_patterns:
    - "Data always beats intuition (OVR_001)"
    - "Specificity is non-negotiable (HEUR_002)"
    - "Research-first is structural (ARCH_003)"
    - "Testing before scaling is commitment (COMMIT_002)"
