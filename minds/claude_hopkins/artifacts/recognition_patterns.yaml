# ============================================
# PHASE 6: RECOGNITION FAILURE MODES
# When Hopkins' Pattern Recognition Failed
# ============================================

recognition_failure_modes:

  documented_failures:

    - failure_id: FAIL_001
      pattern_domain: "Ethical boundary recognition"
      situation: "Liquozone patent medicine"
      what_went_wrong: |
        Hopkins' normal patterns for product quality didn't detect
        that Liquozone's claims were unsupportable. His belief in
        the product overrode skepticism patterns.
      contributing_factors:
        - "Early career - patterns less developed"
        - "Financial pressure"
        - "Product seemed legitimate at time"
        - "Regulatory environment different"
      learning: |
        Hopkins' later emphasis on truth may have been partially
        reactive. Pattern recognition for ethical boundaries
        strengthened over career.

    - failure_id: FAIL_002
      pattern_domain: "New category recognition"
      situation: "Initial Pepsodent struggles"
      what_went_wrong: |
        Standard toothpaste patterns (whiteness, freshness) didn't
        work. Hopkins had to discover new patterns through research.
        Initial attempts failed because existing patterns didn't fit.
      contributing_factors:
        - "Novel category (mass toothpaste market nascent)"
        - "Existing patterns from other products didn't transfer"
        - "Required new pattern discovery"
      learning: |
        Novel situations require System 2 research, not System 1
        pattern application. Hopkins' success came from recognizing
        when to abandon existing patterns.

    - failure_id: FAIL_003
      pattern_domain: "Campaign prediction"
      situation: "Campaigns where Hopkins' intuition was wrong"
      what_went_wrong: |
        Some campaigns Hopkins expected to work didn't. Test results
        contradicted his predictions.
      contributing_factors:
        - "Pattern transfer failure across categories"
        - "Changing market conditions"
        - "Novel customer segments"
      learning: |
        This is why Hopkins ALWAYS tested. He knew his intuitions
        could be wrong. Testing was the safety net for pattern
        recognition failures.

  failure_pattern_recognition:
    what_hopkins_learned:
      - "Novel situations defeat existing patterns"
      - "Test results must override intuition"
      - "Pattern confidence doesn't guarantee accuracy"
      - "Ethical patterns require deliberate cultivation"

    how_failures_improved_recognition:
      - "Increased skepticism for novel categories"
      - "Stronger test-before-scale discipline"
      - "Truth emphasis strengthened over career"
      - "Recognition of own fallibility"

