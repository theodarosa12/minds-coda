      - domain: "Headline effectiveness"
        accuracy: "95%"
        why_reliable: |
          Thousands of split tests. Clear feedback loop.
          Patterns deeply internalized over decades.

      - domain: "Specificity recognition"
        accuracy: "95%"
        why_reliable: |
