# How Hopkins Organized Recognition Patterns
# ============================================

pattern_library_structure:

  hierarchical_organization:

    level_1_core_patterns:
      description: "Foundational patterns that inform all recognition"
      patterns:
        - id: CORE_PAT_001
          name: "Salesmanship Standard"
          application: "Every piece of copy, every ad decision"
          query: "Would a salesman say this in person?"

        - id: CORE_PAT_002
          name: "Specificity Imperative"
          application: "Every claim, every promise"
          query: "Is this specific or general?"

        - id: CORE_PAT_003
          name: "Measurable Action"
          application: "Every campaign, every ad"
          query: "Can we track response?"

    level_2_domain_patterns:
