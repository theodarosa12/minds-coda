        - "New category vs established category"
        - "Big budget vs limited budget"
        - "Sophisticated vs common audience"

  pattern_retrieval_mechanism:
    description: |
      Hopkins' pattern retrieval was automatic for trained domains.
      Trigger stimuli activated relevant patterns without conscious
      search. This is characteristic of expert intuition.

    retrieval_triggers:
      - trigger_type: "Visual/textual"
        example: "Reading a headline"
        patterns_activated: "COPY_001 through COPY_005"

      - trigger_type: "Sensory/experiential"
        example: "Factory visit observation"
        patterns_activated: "DIFF_001 through DIFF_003"

      - trigger_type: "Conversational"
        example: "Client meeting"
        patterns_activated: "OPP_001, THREAT_001 through THREAT_003"

      - trigger_type: "Data/numerical"
        example: "Test results review"
        patterns_activated: "TEST_001 through TEST_004"

  pattern_updating_mechanism:
    description: |
      Hopkins continuously updated his pattern library through testing.
      Every test result refined or added patterns. This is why his
      intuitions remained accurate - they were empirically maintained.

    update_process:
      - step: 1
        action: "Test generates data"
        outcome: "New pattern evidence"

      - step: 2
        action: "Data confirms/refutes hypothesis"
        outcome: "Pattern strengthened/weakened"

      - step: 3
        action: "Pattern integrated into library"
        outcome: "Future recognition adjusted"

      - step: 4
        action: "Multiple confirmations create strong pattern"
        outcome: "Pattern becomes automatic (System 1)"

