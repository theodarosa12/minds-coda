# ============================================
# STRUCTURAL PATTERNS
# Abstract frameworks appearing across domains
# ============================================

structural_patterns:

  - pattern_id: STRUCT_001
    name: "Research -> Specificity -> Simplicity Pipeline"
    abstract_form: "Deep input enables simple output"
    cross_domain: true

    manifestations:
      - context: "Copywriting"
        how_expressed: "Weeks of research produce simple, specific claims"
        source: "Schlitz brewery visit -> 'Pure' campaign"

      - context: "Product understanding"
        how_expressed: "Factory tours enable product differentiation"
        source: "Every Hopkins case study"

      - context: "Customer insight"
        how_expressed: "Deep customer study enables precise positioning"
        source: "Pepsodent 'film' discovery"

      - context: "Communication"
        how_expressed: "Complex understanding enables simple explanation"
        source: "Scientific Advertising writing style"

    abstraction_ladder:
      level_1_specific: "Hopkins visited the Schlitz brewery"
      level_2_domain: "Hopkins researched products exhaustively"
      level_3_cross_domain: "Deep input creates clear output"
      level_4_universal: "Simplicity is earned through understanding complexity"

    framework_form: |
      PIPELINE: Research (weeks) -> Extract specifics -> Communicate simply
      PRINCIPLE: You cannot simplify what you don't understand deeply

  - pattern_id: STRUCT_002
    name: "Data Supremacy Over Opinion"
    abstract_form: "Empirical validation trumps expert judgment"
    cross_domain: true

    manifestations:
      - context: "Campaign decisions"
        how_expressed: "Test campaigns settle all arguments"
        source: "Scientific Advertising Ch.9"

      - context: "Headline selection"
        how_expressed: "Data picks headlines, not copywriters"
        source: "Split-test methodology"

      - context: "Strategic choices"
        how_expressed: "Market response > boardroom debate"
        source: "My Life in Advertising cases"

      - context: "Career decisions"
        how_expressed: "Results prove methods, not credentials"
        source: "Self-made success narrative"

    abstraction_ladder:
      level_1_specific: "Hopkins tested headlines before selecting"
      level_2_domain: "Hopkins tested all advertising decisions"
      level_3_cross_domain: "Hopkins trusted measurement over intuition"
      level_4_universal: "What can be tested should be tested"

    framework_form: |
      HIERARCHY: Measured results > Expert opinion > Untested theory
      PRINCIPLE: Opinion is worthless without data

  - pattern_id: STRUCT_003
    name: "Customer-First Sequencing"
    abstract_form: "Start from need, not from offer"
    cross_domain: true

    manifestations:
      - context: "Campaign creation"
        how_expressed: "Ask what customer wants before studying product"
        source: "Pepsodent started with 'why don't people brush?'"

      - context: "Positioning"
        how_expressed: "Customer problem defines market angle"
        source: "Schlitz started with 'why distrust beer?'"

      - context: "Copy approach"
        how_expressed: "Service frame before product features"
        source: "Scientific Advertising Ch.3"

      - context: "Value proposition"
        how_expressed: "Outcome > mechanism"
        source: "Palmolive: beauty > soap features"

    abstraction_ladder:
      level_1_specific: "Hopkins asked what customers wanted"
      level_2_domain: "Hopkins started from customer problems"
      level_3_cross_domain: "Hopkins sequenced customer insight first"
      level_4_universal: "Understand the need before offering the solution"

    framework_form: |
      SEQUENCE: Customer problem -> Product fit -> Communication angle
      PRINCIPLE: The sequence of work determines its quality

  - pattern_id: STRUCT_004
    name: "Systematization of Success"
    abstract_form: "Convert working principles into repeatable systems"
    cross_domain: true

    manifestations:
      - context: "Testing"
        how_expressed: "Built tracking infrastructure into every campaign"
        source: "Coupon tracking systems"

      - context: "Research"
        how_expressed: "Factory visits as standard practice"
        source: "My Life in Advertising methodology"

      - context: "Writing"
        how_expressed: "Headlines-before-body process"
        source: "Hopkins' writing sequence"

      - context: "Client selection"
        how_expressed: "Refused accounts that couldn't be tested"
        source: "Method protection behavior"

    abstraction_ladder:
      level_1_specific: "Hopkins built coupon tracking"
      level_2_domain: "Hopkins systematized his advertising process"
      level_3_cross_domain: "Hopkins converted principles into systems"
      level_4_universal: "Systems enforce principles; principles without systems decay"

    framework_form: |
      CONVERSION: Principle -> Process -> System -> Infrastructure
      PRINCIPLE: What works once should be systematized to work always

  - pattern_id: STRUCT_005
    name: "Preemptive Communication Advantage"
    abstract_form: "First to articulate the universal truth wins differentiation"
    cross_domain: true

    manifestations:
      - context: "Beer advertising"
        how_expressed: "First to claim purity (all breweries did same)"
        source: "Schlitz campaign"

      - context: "Cereal advertising"
        how_expressed: "First to name process ('shot from guns')"
        source: "Quaker Oats campaign"

      - context: "Positioning theory"
        how_expressed: "First claim creates ownership"
        source: "Extended by Ries & Trout"

    abstraction_ladder:
      level_1_specific: "Hopkins claimed Schlitz purity first"
      level_2_domain: "Hopkins claimed common practices as differentiators"
      level_3_cross_domain: "First to articulate wins perception"
      level_4_universal: "Communication creates differentiation even when reality is uniform"

    framework_form: |
      STRATEGY: Find universal truth -> Articulate first -> Own the category
      PRINCIPLE: What you claim first, you own forever

