          - "Advertising is salesmanship"
          - "I am a servant to the customer"
          - "Ordinary people have wisdom"
        how_reinforce: |
          If people are selfish, serve their self-interest. If advertising is selling,
          serve the buyer. If ordinary people have wisdom, trust their response.

    conflicting_pairs:
