        tension: |
          Hopkins explicitly rejected opinion but implicitly relied on intuition
          to generate hypotheses to test. The conflict is managed by separating
          GENERATION (intuition) from SELECTION (testing).

      - pair: "I have little genius" vs "I wrote definitive books"
        tension: |
          Claiming to lack genius while writing authoritative books seems contradictory.
          Resolved by: methods are genius, not the person. Anyone can learn methods.

      - pair: "I never deceived" vs "Liquozone work"
        tension: |
          Truth emphasis conflicts with early patent medicine work.
          Managed by: temporal separation (early necessity vs. later principles).

