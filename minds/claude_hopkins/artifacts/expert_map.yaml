# ============================================
# FERRISS DISCOVERY PROTOCOL
# ============================================

ferriss_discovery_protocol:

  question_1_who_is_best:
    prompt: "Who is the best in the world at direct response advertising?"
    findings:
      - name: "Claude C. Hopkins"
        evidence: "David Ogilvy called Scientific Advertising essential reading. Gary Halbert required all students to read it 10x."
        verdict: "Consensus pick as foundational pioneer"
      - name: "David Ogilvy"
        evidence: "Built Ogilvy & Mather, wrote Confessions of an Advertising Man. Called Hopkins 'the most influential.'"
        verdict: "Most successful modern disciple"
      - name: "Eugene Schwartz"
        evidence: "Breakthrough Advertising considered a masterpiece. 5 levels of awareness framework."
        verdict: "Extended Hopkins' psychology focus"

  question_2_who_is_unknown:
    prompt: "Who is exceptional but relatively unknown in this domain?"
    findings:
      - name: "John E. Powers"
        evidence: "First modern copywriter (1880s), pioneered honest advertising, influenced Kennedy and Hopkins"
        why_hidden: "Predates mass media documentation"
        why_valuable: "Established 'reason-why' foundation Hopkins built upon"
      - name: "Maxwell Sackheim"
        evidence: "Invented the Book-of-the-Month Club, pioneered negative option billing"
        why_hidden: "Less prolific writer, more focused on execution"
        why_valuable: "Proved Hopkins' mail-order principles at scale"
      - name: "Victor Schwab"
        evidence: "Wrote 'How to Write a Good Advertisement' (1942), tested 100+ headlines"
        why_hidden: "Overshadowed by Ogilvy's fame"
        why_valuable: "Systematized headline testing Hopkins pioneered"

  question_3_who_is_unconventional:
    prompt: "Who achieves results using unconventional methods?"
    findings:
      - name: "Gary Halbert"
        evidence: "The Boron Letters, wrote from prison, used 'A-pile' psychology"
        unconventional: "Personal, irreverent style while following Hopkins' testing discipline"
      - name: "Dan Kennedy"
        evidence: "No B.S. series, magnetic marketing"
        unconventional: "Combined Hopkins' directness with entrepreneurial systems"
      - name: "Joe Sugarman"
        evidence: "BluBlocker ads, 'Triggers' methodology"
        unconventional: "Applied Hopkins to long-form TV infomercials"

  question_4_who_produces_experts:
    prompt: "Who produced other experts? (coach of champions)"
    findings:
      - name: "Albert Lasker"
        evidence: "Employed Hopkins, Kennedy. Lord & Thomas became training ground."
        produced: "Hopkins, Kennedy, other agency leaders"
      - name: "Claude Hopkins (himself)"
        evidence: "His books trained generations: Ogilvy, Halbert, Abraham"
        produced: "Every major copywriter since 1923"
      - name: "Gary Halbert"
        evidence: "Halbert Letter, seminars, trained Bond Halbert, Carlton, others"
        produced: "Carlton, Makepeace, modern copy community"
      - name: "Jay Abraham"
        evidence: "Strategy of Preeminence, trained thousands of marketers"
        produced: "Entire generation of marketing consultants"

  question_5_who_recovered:
    prompt: "Who failed spectacularly and came back?"
    findings:
      - name: "Claude Hopkins"
        evidence: "Early patent medicine work at Liquozone was ethically questionable; pivoted to legitimate advertising"
        recovery: "Built legitimate success at Lord & Thomas, documented honest principles"
      - name: "Gary Halbert"
        evidence: "Imprisoned for mail fraud, emerged with Boron Letters"
        recovery: "Became legendary teacher, transparent about failures"

