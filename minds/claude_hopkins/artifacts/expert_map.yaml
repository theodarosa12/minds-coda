    the "reason-why" philosophy from Kennedy and the honest advertising tradition
    from Powers, then systematized it with testing methodology. His two books became
    the transmission mechanism that trained every major copywriter since 1923.
    The lineage shows THREE generations of impact:

    Generation 1 (1920s-1950s): Caples, Schwab, Collier - Direct contemporaries
    Generation 2 (1950s-1980s): Ogilvy, Schwartz - Built agencies on Hopkins
    Generation 3 (1980s-present): Halbert, Kennedy, Abraham, Sugarman - Modern disciples

