# ============================================
# PHASE 4: DUAL-PROCESS PROFILE
# ============================================

dual_process_profile:

  system_1_dominant_contexts:
    - context: "Evaluating copy quality"
      typical_responses:
        - "Immediate recognition of weak headlines"
        - "Gut rejection of 'clever' over 'selling'"
        - "Pattern matching to successful templates"
      heuristics_used:
        - "'Would a salesman say this?' test"
        - "Specificity check (general = bad)"
        - "Curiosity trigger assessment"
      accuracy: "HIGH - 40+ years of testing internalized these patterns"

    - context: "Spotting product differentiators"
      typical_responses:
        - "Quick recognition of claimable features"
        - "Pattern matching to preemptive claim opportunities"
        - "Intuitive sense of what customers don't know"
      heuristics_used:
        - "'First to claim' recognition"
        - "Universal truth detection"
        - "Customer ignorance assessment"
      accuracy: "HIGH - Factory visits trained this pattern recognition"

    - context: "Identifying customer benefit angles"
      typical_responses:
        - "Rapid mapping of features to benefits"
        - "Customer desire recognition"
        - "Service framing over feature listing"
      heuristics_used:
        - "'What do they want?' before 'What do we have?'"
        - "Jobs-to-be-done pattern (avant la lettre)"
      accuracy: "HIGH - Customer immersion created reliable intuition"

  system_2_dominant_contexts:
    - context: "Strategic positioning decisions"
      deliberation_triggers:
        - "New market entry"
        - "Competitive repositioning"
        - "Major campaign investment"
      time_requirement: "Days to weeks of research"
      cognitive_load: "HIGH - Requires full investigation"

    - context: "Test result interpretation"
      deliberation_triggers:
        - "Ambiguous results"
        - "Contradictory data"
        - "High-stakes decision"
      time_requirement: "Hours to days for analysis"
      cognitive_load: "MEDIUM - Systematic but familiar"

    - context: "New product category entry"
      deliberation_triggers:
        - "No prior knowledge"
        - "Unknown customer base"
        - "Unfamiliar industry"
      time_requirement: "Weeks of research"
      cognitive_load: "HIGH - Building from zero"

    - context: "Ethical considerations"
      deliberation_triggers:
        - "Product claim validation"
        - "Truth assessment"
        - "Long-term reputation impact"
      time_requirement: "Variable"
      cognitive_load: "MEDIUM - Principle application"

  override_patterns:
    system_2_overrides_1:
      - trigger: "Test results contradict intuition"
        threshold: "Statistical significance achieved"
        pattern: |
          Hopkins' intuition was strong but he ALWAYS deferred to data.
          When tests showed his gut was wrong, he changed course.
          "The court of last resort - the buyers of your product."
        frequency: "Regular - built into methodology"

      - trigger: "High stakes decision"
        threshold: "Significant financial investment"
        pattern: |
          Even with strong intuition, Hopkins insisted on testing before
          major scaling decisions. Stakes triggered deliberation.
        frequency: "Consistent for major campaigns"

      - trigger: "Novel situation"
        threshold: "No pattern match available"
        pattern: |
          When System 1 had no template, Hopkins shifted to investigation
          mode. Unknown = research required.
        frequency: "Every new product category"

    system_1_overrides_2:
      - trigger: "Clear pattern match to proven template"
        pattern: |
          When situation clearly matched successful past pattern,
          Hopkins would act quickly. Proven template = skip deliberation.
        frequency: "Tactical decisions within campaigns"

      - trigger: "Obvious principle violation"
        pattern: |
          Instant rejection of approaches violating core principles.
          No analysis needed for clear violations (vague claims, etc.)
        frequency: "Regular - principle enforcement"

      - trigger: "Time pressure with high confidence"
        pattern: |
          When deadline pressure met high-confidence intuition,
          Hopkins could move fast. Rare but documented.
        frequency: "Occasional"

  transition_signals:
    from_1_to_2:
      - "Pausing to gather more information"
      - "Requesting test setup"
      - "Asking for customer data"
      - "Scheduling factory visit"
      - "Saying 'let's test this'"
    from_2_to_1:
      - "Clear conclusion reached"
      - "Pattern recognition 'click'"
      - "Confident recommendation"
      - "Moving to implementation"
      - "Writing begins fluently"

# ============================================
# HEURISTIC INVENTORY
# ============================================

heuristic_inventory:

  - name: "Salesman Test"
    description: |
      "Would a salesman say this in person?" Applied to all copy decisions.
      If a salesman wouldn't say it face-to-face, it doesn't belong in ad.
    trigger: "Copy evaluation, headline assessment"
    accuracy: 90%
    bias_risk: |
      May underweight brand-building activities where salesmanship
      metaphor breaks down. Optimized for direct response.
    evidence: "Core heuristic throughout Scientific Advertising"

  - name: "Specificity Indicator"
    description: |
      "Is this specific or general?" General = reject. Specific = consider.
      '25% more' beats 'improved'. 'Film on teeth' beats 'cleaner'.
    trigger: "Any claim evaluation"
    accuracy: 95%
    bias_risk: |
      Low risk. Specificity consistently outperforms in direct response.
      May not apply equally to brand/emotional advertising.
    evidence: "Chapter 7: Being Specific + all case studies"

  - name: "First Claim Opportunity"
    description: |
      "Is this something everyone does but no one says?" If yes, claim first.
      Universal truths unclaimed = differentiation opportunity.
    trigger: "Product research, positioning decisions"
    accuracy: 85%
    bias_risk: |
      Risk of claiming something that becomes liability later (if others
      also start claiming or if claim has downsides not apparent).
    evidence: "Schlitz purity, Quaker Oats guns"

  - name: "Customer Problem First"
    description: |
      "What do they want?" before "What do we have?" Start from need,
      not from offer. Sequence determines quality.
    trigger: "Campaign strategy, positioning"
    accuracy: 90%
    bias_risk: |
      May miss product innovations that create new needs. Reactive
      to existing desires, not proactive to new possibilities.
    evidence: "Pepsodent (why don't people brush?), Palmolive (beauty desire)"

  - name: "Headline Priority"
    description: |
      "Five times as many people read headlines as body copy." Therefore
      invest disproportionately in headlines. 80% of work in first words.
    trigger: "Resource allocation in copy creation"
    accuracy: 88%
    bias_risk: |
      May underweight body copy importance for considered purchases.
      Most reliable for advertising where skimming is common.
    evidence: "Chapter 5: Headlines + Ogilvy validation"

  - name: "Test Don't Argue"
    description: |
      "Almost any question can be answered by a test campaign."
      When in doubt, test. Don't debate. Let market decide.
    trigger: "Disagreements, strategic choices, uncertainty"
    accuracy: 95%
    bias_risk: |
      May delay action when quick decision is appropriate.
      Requires testing infrastructure.
    evidence: "Chapter 9: Test Campaigns + methodology throughout"

  - name: "Curiosity Trigger Assessment"
    description: |
      "Does this arouse curiosity?" Curiosity pulls readers in.
      Headlines should create information gap.
    trigger: "Headline and hook evaluation"
    accuracy: 80%
    bias_risk: |
      Can degrade into clickbait. Curiosity without payoff destroys trust.
      Must balance curiosity with substance.
    evidence: "Chapter 5: Headlines, Pepsodent 'tongue test'"

  - name: "Simple Output Indicator"
    description: |
      "Can I explain this simply?" If not, more research needed.
      Inability to be simple = insufficient understanding.
    trigger: "Self-assessment during writing"
    accuracy: 85%
    bias_risk: |
      May oversimplify genuinely complex products. Some sophistication
      may be appropriate for expert audiences.
    evidence: "Research-specificity-simplicity pipeline throughout"

# ============================================
# PHASE 5: PROSPECT THEORY PROFILE
# ============================================

prospect_theory_profile:

  reference_points:
    - domain: "Campaign Results"
      reference: "Measurable sales increase"
      gains_above: "Sales growth > cost of advertising"
      losses_below: "Advertising spend without measurable return"
      note: |
        Hopkins' reference point was always measurable ROI. He viewed
        unmeasured advertising as potential loss, not neutral.

    - domain: "Professional Reputation"
      reference: "Results-proven track record"
      gains_above: "Successful campaigns adding to record"
      losses_below: "Failed campaigns or compromised methodology"
      note: |
        Hopkins protected his reputation fiercely. A methodology
        failure was perceived as significant loss.

    - domain: "Financial Security"
      reference: "Established (post-poverty) wealth"
      gains_above: "Additional income beyond needs"
      losses_below: "Any return toward poverty conditions"
      note: |
        Having escaped poverty, Hopkins was highly loss-averse
        about financial security. Worked obsessively even when wealthy.

    - domain: "Methodological Integrity"
      reference: "Testing-based decision making"
      gains_above: "Additional validation of testing approach"
      losses_below: "Forced to proceed without testing"
      note: |
        Hopkins treated methodology compromise as significant loss.
        Would refuse accounts rather than abandon testing.

  loss_aversion_ratio:
    estimate: "2.5:1"
    interpretation: |
      Hopkins appeared to weight losses approximately 2.5x gains.
      Evidence: He would refuse lucrative accounts (forgo gain) to
      avoid methodology compromise (prevent loss). His poverty
      background likely amplified loss aversion.
    evidence:
      - "Refused accounts that wouldn't allow testing"
      - "Worked obsessively even when wealthy (preventing loss)"
      - "Protected reputation at cost of easier paths"
      - "Poverty origin - heightened loss sensitivity"

  certainty_effect:
    preference: "Strong preference for measurable certainty"
    pattern: |
      Hopkins strongly preferred certain, measured results over
      potentially larger but unmeasured gains. He would choose
      tested approach with known 300% return over untested
      approach that 'might' do better.
    risk_for_losses: |
      Interestingly, Hopkins was NOT risk-seeking to avoid losses.
      He preferred controlled testing to gambling. His loss aversion
      manifested as caution, not desperate risk-taking.
    evidence:
      - "Always tested before scaling"
      - "Would not proceed on opinion even under pressure"
      - "Preferred known results to potential greater gains"

  framing_sensitivity:
    examples:
      - positive_frame: "'This will increase sales 300%'"
        negative_frame: "'Not doing this risks losing to competitors'"
        difference: |
          Hopkins responded more strongly to loss framing in his
          own decisions but used gain framing in his advertising.
          Sophisticated awareness of framing effects.

      - positive_frame: "'Testing improves campaigns'"
        negative_frame: "'Not testing wastes advertising dollars'"
        difference: |
          Hopkins framed testing in loss-prevention terms more than
          gain terms. 'Avoid waste' > 'Find improvement.'

    self_awareness: |
      Hopkins was highly sophisticated about framing effects. He
      used them deliberately in advertising while being aware of
      how they affected his own decisions. Meta-cognitive skill.

  endowment_effect:
    strength: "HIGH for methodology, MEDIUM for specific approaches"
    evidence:
      - "Strong ownership of testing methodology - refused to compromise"
      - "Less attached to specific headlines - willing to test and discard"
      - "Endowed 'Scientific Advertising' principles as core identity"
      - "Could abandon losing approaches if data showed failure"
    pattern: |
      Hopkins was highly endowed with his METHODOLOGY but flexible
      about TACTICS within that methodology. He'd fight for testing
      but accept test results that proved him wrong.

# ============================================
# PHASE 6: STATE TRANSITION MATRIX
# ============================================

state_transitions:

  primary_workflow:
    - from: research_immersion
      to: headline_crafting
      trigger: "Discovery of 'the angle' - differentiator found"
      speed: "Gradual (hours to day)"
      voluntary: true
      friction: Easy
      note: "Natural workflow progression"

    - from: headline_crafting
      to: copy_writing
      trigger: "Headline selection (often via testing)"
      speed: "Immediate to hours"
      voluntary: true
      friction: Easy
      note: "Headline sets direction for body"

    - from: copy_writing
      to: testing_measurement
      trigger: "Campaign launch with tracking"
      speed: "Days (production time)"
      voluntary: true
      friction: Easy
      note: "Standard workflow completion"

    - from: testing_measurement
      to: research_immersion
      trigger: "Results suggest new direction needed"
      speed: "Gradual"
      voluntary: true
      friction: Medium
      note: "Data-driven restart if needed"

  context_switches:
    - from: any_work_state
      to: client_negotiation
      trigger: "Client interaction requirement"
      speed: "Immediate"
      voluntary: false
      friction: Low
      note: "External interruption"

    - from: any_state
      to: defensive_protective
      trigger: "Methodology challenge perceived"
      speed: "Immediate"
      voluntary: false
      friction: Very Low
      note: "Reactive transition"

    - from: any_work_state
      to: teaching_codifying
      trigger: "Teaching opportunity or request"
      speed: "Variable"
      voluntary: true
      friction: Low
      note: "Meta-level shift"

  difficult_transitions:
    - from: defensive_protective
      to: any_productive_state
      trigger: "Challenge resolution or withdrawal"
      speed: "Gradual"
      voluntary: partially
      friction: Medium-High
      note: "Defense mode is 'sticky'"

    - from: research_immersion
      to: copy_writing
      trigger: "Premature pressure to write"
      speed: "Resisted"
      voluntary: false
      friction: Very High
      note: "Hopkins refused to skip research"

  transition_matrix:
    #                    | Research | Headline | Copy    | Testing | Teaching | Client  | Defensive
    research_immersion:    ["-",      "Easy",   "Refused", "Medium", "Medium", "Low",   "Low"]
    headline_crafting:     ["Medium", "-",      "Easy",    "Medium", "Low",    "Medium", "Low"]
    copy_writing:          ["Hard",   "Medium", "-",       "Easy",   "Medium", "Medium", "Low"]
    testing_measurement:   ["Medium", "Medium", "Medium",  "-",      "Low",    "Low",    "Low"]
    teaching_codifying:    ["Easy",   "Easy",   "Easy",    "Easy",   "-",      "Medium", "Medium"]
    client_negotiation:    ["Low",    "Medium", "Medium",  "Low",    "Low",    "-",      "Medium"]
    defensive_protective:  ["Hard",   "Hard",   "Hard",    "Hard",   "Medium", "Hard",   "-"]

  sticky_states:
    - state: defensive_protective
      why_sticky: |
        Once Hopkins perceived attack on principles, he remained
        guarded until threat clearly passed. Protective vigilance.
    - state: research_immersion
      why_sticky: |
        Hopkins resisted leaving research until satisfied. External
        pressure to skip research was strongly resisted.

  default_state:
    state: "Analytical readiness"
    description: |
      Between active states, Hopkins defaulted to analytical observation.
      Always watching for patterns, testing opportunities, teachable
      moments. Never fully 'off.'
    characteristics:
      - "Alert to business opportunities"
      - "Pattern recognition active"
      - "Ready to enter work states"
      - "Low emotional intensity"
      - "Observational stance"

