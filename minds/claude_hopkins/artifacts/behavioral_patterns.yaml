# ============================================
# METADATA
# ============================================

metadata:
  mind_slug: claude_hopkins
  mind_name: Claude C. Hopkins
  analysis_date: "2026-01-23T08:00:00-03:00"
  agent: daniel-behavioral-analyst
  methodology: "Kahneman Dual-Process Theory + Prospect Theory"
  source_count: 12
  confidence: 92

  historical_adaptation:
    note: |
      Claude Hopkins (1866-1932) predates behavioral observation recording.
      Analysis based on autobiographical self-reports, case studies,
      disciple commentary, and behavioral evidence in written works.
      Self-reports validated against behavioral patterns where possible.
    primary_sources:
      - "My Life in Advertising (1927)"
      - "Scientific Advertising (1923)"
    validation_sources:
      - "Ogilvy on Advertising"
      - "Halbert's Boron Letters"
      - "Historical records"

  core_philosophy: |
    "People don't have ONE personality - they have STATES that activate contextually."
    Hopkins exhibited distinct behavioral states depending on triggers:
    research mode, writing mode, testing mode, teaching mode, and a rare
    defensive mode when principles were challenged.

# ============================================
# PHASE 1: SOURCE MATERIAL INVENTORY
# ============================================

source_inventory:
  autobiographical:
    - filename: "My Life in Advertising (1927)"
      behavioral_evidence: HIGH
      key_sections:
        - "Origin story - poverty and work ethic formation"
        - "Schlitz campaign - research behavior patterns"
        - "Pepsodent campaign - problem-solving sequences"
        - "Mail-order years - measurement ritualization"
      mining_status: complete

    - filename: "Scientific Advertising (1923)"
      behavioral_evidence: MEDIUM
      key_sections:
        - "Chapter 9: Test campaigns - decision architecture"
        - "Chapter 5: Headlines - attention patterns"
        - "Chapter 7: Being specific - cognitive preferences"
      mining_status: complete

  observational:
    - type: "Disciple commentary"
      behavioral_evidence: MEDIUM
      observable_patterns:
        - "Work intensity descriptions"
        - "Research methodology observations"
        - "Decision-making accounts"

    - type: "Campaign case studies"
      behavioral_evidence: HIGH
      observable_patterns:
        - "Research-writing-testing sequences"
        - "Client interaction patterns"
        - "Iteration behaviors"

  behavioral_evidence_extracted:
    actions_taken: 45
    decisions_documented: 32
    reactions_observed: 18
    patterns_repeated: 24

# ============================================
# PHASE 2: STATE INVENTORY
# States, not traits. Context is everything.
# ============================================

state_inventory:
  total_states: 7

  states:

    # ========== STATE 1: RESEARCH IMMERSION ==========
    - name: "Research Immersion Mode"
      id: research_immersion

      description: |
        Deep investigative state where Hopkins becomes fully absorbed in
        understanding a product, industry, or customer. Characterized by
        obsessive information gathering, physical investigation (factory visits),
        and temporary expertise building. This state is prolonged (days to weeks)
        and excludes other activities until satisfaction is achieved.

      behavioral_markers:
        - "Factory/site visits - physically goes to source"
        - "Extended study periods - weeks not hours"
        - "Note-taking and documentation of observations"
        - "Expert consultation - seeks specialists"
        - "Customer immersion - talks to actual buyers"
        - "Temporary expertise building - learns industry"
        - "Delay of writing until research feels complete"

      cognitive_characteristics:
        system_dominance: "System 2 - Deliberate"
        attention_pattern: "Focused - Single domain, deep dive"
        decision_style: "Investigative - Information-seeking"
        information_processing: "Bottom-up - From details to patterns"

      emotional_tone:
        primary: "Curiosity"
        secondary: "Patience"
        tertiary: "Methodical determination"

      triggers:
        environmental:
          - "New product/client assignment"
          - "Access to factory/production facility"
          - "Availability of experts to consult"
          - "Time allocation without deadline pressure"
        internal:
          - "Recognition of knowledge gap"
          - "Dissatisfaction with surface understanding"
          - "Intuition that 'something is here'"
          - "Felt need for specificity in copy"
        social:
          - "Client providing access to operations"
          - "Absence of pressure for immediate output"
          - "Respect for the research process from stakeholders"
        task:
          - "New product category (no prior knowledge)"
          - "High-stakes campaign (significant investment)"
          - "Competitive positioning challenge"

      duration:
        minimum: "2-3 days"
        typical: "1-3 weeks"
        maximum: "Several weeks"
        note: "Hopkins did not rush research regardless of pressure"

      exit_conditions:
        - "Discovery of 'the angle' - specific differentiator found"
        - "Saturation feeling - 'I understand this now'"
        - "Emergence of clear headline candidates"
        - "Ability to explain product simply = understanding achieved"

      evidence:
        - source: "My Life in Advertising"
          quote_or_observation: |
            "I went through that brewery. I saw plate-glass rooms where beer
            was dripping over pipes, being cooled in filtered air. I saw great
            filters filled with white-wood pulp."
        - source: "Pepsodent Case Study"
          quote_or_observation: |
            "Hopkins studied dentistry to find the 'film' angle. Not surface
            research - actual dental science investigation."

    # ========== STATE 2: HEADLINE CRAFTING ==========
    - name: "Headline Crafting Mode"
      id: headline_crafting

      description: |
        Intense creative-analytical state focused exclusively on generating
        and evaluating headline candidates. Hopkins would generate dozens
        of variants, applying specific criteria. This state combines creative
        generation (System 1 pattern matching) with analytical evaluation
        (System 2 criteria application).

      behavioral_markers:
        - "Prolific variant generation - dozens of options"
        - "Rapid writing followed by critical evaluation"
        - "Application of 'salesman test' to each option"
        - "Reference to tested patterns from memory"
        - "Rejection of 'clever' in favor of 'selling'"
        - "Iteration until satisfaction achieved"
        - "Resistance to premature selection"

      cognitive_characteristics:
        system_dominance: "Mixed - System 1 generation, System 2 evaluation"
        attention_pattern: "Oscillating - Creative burst then critical review"
        decision_style: "Iterative - Generate-evaluate cycles"
        information_processing: "Pattern matching + rule application"

      emotional_tone:
        primary: "Creative tension"
        secondary: "Critical scrutiny"
        tertiary: "Professional satisfaction when 'right' found"

      triggers:
        environmental:
          - "Research phase complete"
          - "Quiet writing space"
          - "Access to past headline swipe files"
        internal:
          - "Confidence in product understanding"
          - "Clear sense of target customer"
          - "Specific differentiator identified"
          - "Creative readiness feeling"
        social:
          - "Freedom from client interference"
          - "Space for uninterrupted work"
        task:
          - "Campaign creation - headline phase"
          - "A/B test preparation - variant generation"

      duration:
        minimum: "2-4 hours"
        typical: "1-2 days per campaign"
        maximum: "Several days for major campaigns"

      exit_conditions:
        - "Emergence of clear winner among candidates"
        - "Test setup ready - variants selected for split test"
        - "Gut confirmation aligned with criteria"
        - "Unable to generate better options"

      evidence:
        - source: "Scientific Advertising"
          quote_or_observation: |
            "The headline is the most important element in most advertisements.
            It is the telegram which decides whether the reader will read the copy."
        - source: "Ogilvy on Hopkins"
          quote_or_observation: |
            "Hopkins spent disproportionate time on headlines, testing dozens
            before selecting."

    # ========== STATE 3: COPY WRITING ==========
    - name: "Copy Writing Mode"
      id: copy_writing

      description: |
        Focused writing state that follows headline selection. Characterized
        by single-reader visualization, simple language commitment, and
        salesmanship framing. Hopkins literally imagined one specific person
        and wrote to them. This state flows more smoothly than headline
        crafting because the direction is set.

      behavioral_markers:
        - "Visualization of single specific reader"
        - "Simple, direct language - no jargon"
        - "Salesmanship framing - 'would a salesman say this?'"
        - "Specific facts over general claims"
        - "One clear message per piece"
        - "Benefit-first, feature-second structure"
        - "Call to action clarity"

      cognitive_characteristics:
        system_dominance: "System 1 - Fluent writing from internalized rules"
        attention_pattern: "Focused - Single reader, single message"
        decision_style: "Pattern-based - Applying learned formulas"
        information_processing: "Top-down - Strategy guides word choice"

      emotional_tone:
        primary: "Flow state"
        secondary: "Empathy with reader"
        tertiary: "Purposeful urgency"

      triggers:
        environmental:
          - "Headline selected"
          - "Quiet writing environment"
          - "Research notes accessible"
        internal:
          - "Clear picture of target reader in mind"
          - "Confidence in headline direction"
          - "Writing readiness - words 'want to come'"
        social:
          - "Absence of interruption"
          - "No premature client review"
        task:
          - "Body copy creation"
          - "Long-form sales letter"
          - "Campaign collateral"

      duration:
        minimum: "1-2 hours for short copy"
        typical: "4-8 hours for long-form"
        maximum: "Multiple days for complex campaigns"

      exit_conditions:
        - "Complete draft achieved"
        - "Reads well when spoken aloud"
        - "'Would a salesman say this?' - Yes"
        - "Specific, simple, benefit-focused"

      evidence:
        - source: "My Life in Advertising"
          quote_or_observation: |
            "I always imagined that I was talking to a single customer, not to
            a crowd. The personal touch makes all the difference."
        - source: "Scientific Advertising"
          quote_or_observation: |
            "Use the language of the common people. Talk in the language
            they use in common talk. Don't be literary."

    # ========== STATE 4: TESTING/MEASUREMENT ==========
    - name: "Testing & Measurement Mode"
      id: testing_measurement

      description: |
        Analytical state focused on setting up, monitoring, and interpreting
        test results. Hopkins was unusually rigorous here - he built measurement
        into everything. This state involves systematic thinking, patience for
        data accumulation, and disciplined interpretation without premature
        conclusions.

      behavioral_markers:
        - "Test infrastructure setup before launch"
        - "Keyed coupons or tracking mechanisms"
        - "Split test configuration"
        - "Patient waiting for data accumulation"
        - "Results documentation"
        - "Statistical interpretation"
        - "Action derivation from data"
        - "Resistance to opinion-based conclusions"

      cognitive_characteristics:
        system_dominance: "System 2 - Deliberate analysis"
        attention_pattern: "Systematic - Structured data review"
        decision_style: "Evidence-based - Data determines action"
        information_processing: "Analytical - Numbers over intuition"

      emotional_tone:
        primary: "Patient objectivity"
        secondary: "Curiosity about results"
        tertiary: "Confidence in methodology"

      triggers:
        environmental:
          - "Campaign launch"
          - "Test period beginning"
          - "Results data available"
          - "Measurement infrastructure in place"
        internal:
          - "Uncertainty about which approach will win"
          - "Desire for validated decision"
          - "Distrust of opinion-based choice"
        social:
          - "Stakeholder questions about performance"
          - "Need to justify recommendations"
        task:
          - "A/B test evaluation"
          - "Campaign optimization"
          - "Strategic decision requiring validation"

      duration:
        minimum: "Hours for results review"
        typical: "Days to weeks for test cycles"
        maximum: "Ongoing - Hopkins tested continuously"

      exit_conditions:
        - "Statistical significance achieved"
        - "Clear winner emerged"
        - "Actionable conclusion reached"
        - "Next test hypothesis generated"

      evidence:
        - source: "Scientific Advertising"
          quote_or_observation: |
            "Almost any question can be answered, cheaply, quickly and finally,
            by a test campaign. And that's the way to answer them - not by
            arguments around a table."
        - source: "My Life in Advertising"
          quote_or_observation: |
            "Every dollar of the millions I have spent on advertising has been
            traced to its results. Not one dollar has been spent on my own opinions."

    # ========== STATE 5: TEACHING/CODIFYING ==========
    - name: "Teaching & Codifying Mode"
      id: teaching_codifying

      description: |
        Meta-cognitive state where Hopkins extracted and communicated principles
        from experience. This state produced his books and influenced his
        mentoring. Characterized by pattern recognition across cases, framework
        extraction, and clear communication of complex ideas.

      behavioral_markers:
        - "Pattern identification across multiple cases"
        - "Principle extraction from patterns"
        - "Example selection to illustrate principles"
        - "Simple language for complex ideas"
        - "Framework creation"
        - "Story-based teaching"
        - "Emphasis on repeatability"

      cognitive_characteristics:
        system_dominance: "System 2 - Deliberate abstraction"
        attention_pattern: "Meta - Looking across cases"
        decision_style: "Inductive - Cases to principles"
        information_processing: "Abstractive - Specific to general"

      emotional_tone:
        primary: "Generosity (sharing knowledge)"
        secondary: "Pride in methodology"
        tertiary: "Confidence from validation"

      triggers:
        environmental:
          - "Writing context (books, articles)"
          - "Mentoring situations"
          - "Interview/public speaking"
          - "Request for advice"
        internal:
          - "Recognition of teachable pattern"
          - "Desire to systematize success"
          - "Legacy consideration (later career)"
        social:
          - "Audience seeking guidance"
          - "Junior colleagues asking questions"
          - "Industry recognition"
        task:
          - "Book writing"
          - "Training development"
          - "Consulting outside core work"

      duration:
        minimum: "Conversation length"
        typical: "Sustained effort for book writing"
        maximum: "Multi-year project (autobiography)"

      exit_conditions:
        - "Principle clearly articulated"
        - "Example set complete"
        - "Book/article finished"
        - "Mentee understanding achieved"

      evidence:
        - source: "Scientific Advertising (existence)"
          quote_or_observation: |
            "The book itself is evidence of teaching mode - Hopkins spent
            considerable effort codifying his methods for others."
        - source: "My Life in Advertising"
          quote_or_observation: |
            "I have always tried to be helpful to young men in advertising.
            The principles I teach are simple and anyone can apply them."

    # ========== STATE 6: CLIENT NEGOTIATION ==========
    - name: "Client Negotiation Mode"
      id: client_negotiation

      description: |
        Strategic social state for managing client relationships, protecting
        methodology integrity, and negotiating scope. Hopkins was known for
        refusing accounts that didn't allow proper testing. This state
        involves boundary-setting, persuasion, and selective engagement.

      behavioral_markers:
        - "Clear articulation of requirements"
        - "Boundary-setting around testing needs"
        - "Willingness to walk away"
        - "Persuasive case for methodology"
        - "Selective client acceptance"
        - "Fee negotiation confidence"
        - "Results-based credibility leverage"

      cognitive_characteristics:
        system_dominance: "Mixed - Strategic System 2 with social System 1"
        attention_pattern: "Strategic - Relationship + methodology fit"
        decision_style: "Principled negotiation"
        information_processing: "Evaluative - Client fit assessment"

      emotional_tone:
        primary: "Professional confidence"
        secondary: "Principled firmness"
        tertiary: "Strategic calculation"

      triggers:
        environmental:
          - "New client meeting"
          - "Scope discussion"
          - "Budget negotiation"
          - "Methodology challenge"
        internal:
          - "Recognition of fit/misfit signals"
          - "Principle protection instinct"
          - "Career stage confidence"
        social:
          - "Client pressure for shortcuts"
          - "Request for opinion-based work"
          - "Challenge to testing requirements"
        task:
          - "New account evaluation"
          - "Scope negotiation"
          - "Fee discussion"

      duration:
        minimum: "Meeting length"
        typical: "Days for negotiation"
        maximum: "Weeks for complex accounts"

      exit_conditions:
        - "Agreement reached with method integrity"
        - "Account declined (misfit)"
        - "Client educated on requirements"
        - "Terms formalized"

      evidence:
        - source: "Career pattern"
          quote_or_observation: |
            "Hopkins refused accounts that wouldn't allow proper testing.
            He protected his methodology even at cost of revenue."
        - source: "My Life in Advertising"
          quote_or_observation: |
            Hopkins became highest-paid advertising man while maintaining
            his principles - evidence of successful negotiation.

    # ========== STATE 7: DEFENSIVE/PROTECTIVE ==========
    - name: "Defensive/Protective Mode"
      id: defensive_protective

      description: |
        Rare state triggered when core principles are challenged or when
        facing criticism of methodology. Hopkins was generally confident
        but could become rigid and dismissive when 'creative' advertising
        advocates challenged his data-driven approach.

      behavioral_markers:
        - "Rigid defense of testing methodology"
        - "Dismissal of 'creative' advertising claims"
        - "Appeal to results/data as authority"
        - "Condescension toward opinion-based practitioners"
        - "Historical examples as weapons"
        - "Absolutist language ('always', 'never')"
        - "Withdrawal from unproductive debate"

      cognitive_characteristics:
        system_dominance: "System 1 - Reactive defense"
        attention_pattern: "Narrowed - Threat-focused"
        decision_style: "Defensive - Protect core beliefs"
        information_processing: "Confirmatory - Evidence for position"

      emotional_tone:
        primary: "Indignation"
        secondary: "Dismissive confidence"
        tertiary: "Protective urgency"

      triggers:
        environmental:
          - "Public challenge to methodology"
          - "Creative advertising advocacy in presence"
          - "Opinion-based decision imposed"
        internal:
          - "Perception of principles under attack"
          - "Frustration with 'ignorance'"
          - "Pattern recognition: 'here we go again'"
        social:
          - "Junior person dismissing testing"
          - "'Creative' advertiser condescension"
          - "Client ignoring data"
        task:
          - "Debate about advertising philosophy"
          - "Defense of declined recommendation"

      duration:
        minimum: "Minutes (quick dismissal)"
        typical: "Duration of challenge"
        maximum: "Days if major public debate"

      exit_conditions:
        - "Challenge withdrawn"
        - "Debate abandoned (not worth energy)"
        - "Data presented ends argument"
        - "Physical/social separation from challenger"

      evidence:
        - source: "Anti-creative stance"
          quote_or_observation: |
            Hopkins never won creative awards and explicitly rejected
            the 'creative advertising' movement - defensive stance.
        - source: "Scientific Advertising"
          quote_or_observation: |
            "Negativity toward 'clever' ads permeates the book -
            a sustained defensive position against creative movement."

