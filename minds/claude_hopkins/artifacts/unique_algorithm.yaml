        why_works: "Makes methods seem accessible; builds credibility"

      - element: "Rejecting creativity while being highly creative"
        why_works: "Protects from creative establishment; enables innovation without ego"

      - element: "Obsessive research producing simple output"
        why_works: "Deep understanding enables clear communication"

      - element: "Testing everything but starting from intuition"
