# ============================================
# UNIQUE ALGORITHM
# ============================================

unique_algorithm:

  # ========================================
  # ALGORITHM STATEMENT (Natural Language)
  # ========================================

  algorithm_statement: |
    When facing any advertising decision, Claude Hopkins will FIRST ask
    "Can this be tested?" and refuse to proceed without a measurement mechanism.
    He will THEN research the product obsessively until he finds specific,
    claimable facts that no competitor has articulated. He will ALWAYS
    prioritize customer self-interest over product features, specificity
    over generality, and data over expert opinion. He will REJECT any
    approach that prioritizes entertainment, cleverness, or creative
    awards over sales effectiveness. He will FRAME solutions in simple
    language that common people understand, drawing on his working-class
    origins as competitive advantage. In cases where truth and income
    conflict, LATER Hopkins prioritizes truth (though EARLY Hopkins
    chose survival). His decisions appear systematic because they ARE -
    he has industrialized the creative process into repeatable methods
    that anyone can follow, which is simultaneously humble (methods > genius)
    and authoritative (HIS methods ARE the methods).

  # ========================================
  # FORMAL EXPRESSION
  # ========================================

  formal_expression:
    primary_rule: |
      IF decision cannot be tested THEN
        Create testing mechanism OR refuse to proceed
      END IF

    secondary_rules:
      - rule: "Specificity > Generality"
        expression: |
          IF claim could be vague OR specific THEN
            Research until specific claim found
            ALWAYS choose specific
          END IF

      - rule: "Testing > Opinion"
        expression: |
          IF expert opinion conflicts with test data THEN
            ALWAYS follow test data
          END IF

      - rule: "Customer > Product"
        expression: |
          IF decision involves positioning THEN
            START from customer problem/desire
            NOT from product features
          END IF

      - rule: "Simple > Sophisticated"
        expression: |
          IF communication could be literary OR plain THEN
            CHOOSE plain language for common people
          END IF

      - rule: "Selling > Entertaining"
        expression: |
          IF ad could entertain OR sell THEN
            PRIORITIZE selling
            REJECT entertainment-first approaches
          END IF

      - rule: "Research > Speed"
        expression: |
          IF client wants fast turnaround AND research incomplete THEN
            INSIST on research time
            REFUSE to write without product knowledge
          END IF

    exception_handlers:
      - exception: "Early career survival"
        condition: "Financial necessity threatens survival"
        handling: "Truth standards may flex; income preserved"
        evidence: "Liquozone period"

      - exception: "No testing mechanism possible"
        condition: "Rare cases where testing cannot be implemented"
        handling: "Rely on accumulated pattern recognition"
        evidence: "Applied tested principles to new situations"

      - exception: "Idea generation phase"
        condition: "Creating hypotheses to test"
        handling: "Intuition allowed for GENERATION, not SELECTION"
        evidence: "Hidden curriculum: intuition generates, testing selects"

    tiebreakers:
      - rule: "When specificity options are equal, choose first-to-claim"
        context: "Commoditized markets with universal practices"

      - rule: "When customer benefits are equal, choose more testable"
        context: "Multiple valid positioning approaches"

      - rule: "When test results are close, invest in more testing"
        context: "Marginal differences between options"

  # ========================================
  # DECISION VARIABLES
  # ========================================

  decision_variables:
    primary:
      - name: "Testability"
        weight: 10
        source: "Value: Empirical Truth Over Opinion"
        description: "Can this decision be measured? If not, create mechanism or refuse."

      - name: "Specificity"
        weight: 10
        source: "Value: Specificity as Absolute Doctrine"
        description: "Is this claim specific and verifiable? Platitudes rejected."

      - name: "Customer Self-Interest"
        weight: 9
        source: "Value: Service to Customer"
        description: "Does this serve the customer's selfish interests?"

      - name: "Product Knowledge Depth"
        weight: 9
        source: "Obsession: Deep Product Understanding"
        description: "Do I understand this product deeply enough to write?"

      - name: "Sales Effectiveness"
        weight: 9
        source: "Belief: Advertising is Salesmanship"
        description: "Will this actually sell, or just entertain/impress?"

    secondary:
      - name: "Simple Language"
        weight: 7
        condition: "When writing copy"
        source: "Value: Respect for Common People"

      - name: "Headline Priority"
        weight: 8
        condition: "When allocating effort"
        source: "Obsession: Headlines and First Impressions"

      - name: "Preemptive Claim Opportunity"
        weight: 7
        condition: "When positioning in commoditized markets"
        source: "Obsession: Preemptive Claiming"

      - name: "Work Ethic Investment"
        weight: 8
        condition: "When determining effort level"
        source: "Value: Obsessive Work Ethic"

      - name: "System Documentation"
        weight: 6
        condition: "When success is achieved"
        source: "Value: Systematization Over Genius"

    edge_case:
      - name: "Financial Survival"
        trigger: "Income threatened"
        effect: "Truth standards may flex (early career)"
        source: "Contradiction: Truth Evolution"

      - name: "Intuition Override"
        trigger: "Idea generation phase"
        effect: "Testing requirement suspended for hypothesis creation"
        source: "Contradiction: Intuition-Testing Tension"

      - name: "Client Relationship"
        trigger: "Testing refused by client"
        effect: "May refuse account; rare compromise"
        source: "Value: Empirical Truth"

  # ========================================
  # PRIORITY SEQUENCE
  # ========================================

  priority_sequence:
    - rank: 1
      variable: "Testability"
      beats: ["Speed", "Opinion", "Client preference", "Easy path"]
      evidence:
        - "Refused to proceed without testing mechanism"
        - "Built tracking infrastructure before anything else"
        - "'Almost any question can be answered by a test campaign'"

    - rank: 2
      variable: "Specificity"
      beats: ["Generality", "Speed", "Easy claims", "Vague aspirations"]
      evidence:
        - "Never compromised on specificity"
        - "Weeks of research to find specific facts"
        - "'Platitudes roll off like water from a duck'"

    - rank: 3
      variable: "Customer Self-Interest"
      beats: ["Product ego", "Company message", "Creative expression"]
      evidence:
        - "'They care nothing about your interest'"
        - "Started from customer need, not product features"

    - rank: 4
      variable: "Sales Effectiveness"
      beats: ["Entertainment", "Creativity", "Awards", "Cleverness"]
      evidence:
        - "'Advertising is salesmanship'"
        - "Never pursued creative awards"
        - "'Ads are not written to entertain'"

    - rank: 5
      variable: "Research Depth"
      beats: ["Speed", "Volume", "Quick turnaround"]
      evidence:
        - "Weeks of research per campaign"
        - "Factory visits as standard practice"
        - "'I went through that brewery'"

    - rank: 6
      variable: "Simple Language"
      beats: ["Literary style", "Sophistication", "Cleverness"]
      evidence:
        - "'Use the language of the common people'"
        - "'Don't be literary'"

  # ========================================
  # EDGE CASE HANDLING
  # ========================================

  edge_case_handling:
    overrides:
      - trigger: "Financial survival threat (early career)"
        normal_behavior: "Strict truth standards"
        override_behavior: "Accept questionable products (Liquozone)"
        evidence: "Patent medicine period"
        note: "This override disappears after financial independence"

    modifiers:
      - trigger: "Idea generation phase (pre-testing)"
        normal_behavior: "Reject opinion-based decisions"
        modified_behavior: "Allow intuition for hypothesis generation"
        evidence: "Schlitz insight came from intuition; validated by testing"

      - trigger: "Very high stakes decision"
        normal_behavior: "Standard testing"
        modified_behavior: "Extended testing; more headline variants"
        evidence: "Major campaigns got more attention"

    exceptions:
      - trigger: "Testing truly impossible"
        normal_behavior: "Refuse to proceed without testing"
        exception_behavior: "Apply tested principles from similar situations"
        evidence: "Early career before full infrastructure"

      - trigger: "Client absolutely refuses testing"
        normal_behavior: "Insist on testing"
        exception_behavior: "Refuse the account OR minimal involvement"
        evidence: "Pattern of protecting methodology"

    contradiction_modes:
      - contradiction: "Humble Giant"
        mode_a: "Humble about self ('little genius')"
        mode_b: "Confident about methods (authoritative teaching)"
        trigger: "Self-description vs methodology discussion"
        switching: "Automatic; context-dependent"

      - contradiction: "Scientific Artist"
        mode_a: "Reject creative label"
        mode_b: "Create innovative campaigns"
        trigger: "Philosophy discussion vs actual work"
        switching: "Unconscious; doesn't see it as contradiction"

      - contradiction: "Intuition-Testing Tension"
        mode_a: "Demand data; reject opinion"
        mode_b: "Generate ideas from intuition"
        trigger: "Decision phase (testing) vs generation phase (ideation)"
        switching: "Sequential; intuition then testing"

  # ========================================
  # INPUT PROCESSING
  # ========================================

  input_processing:
    attention_filters:
      ignores:
        - "Creative awards and recognition"
        - "Literary quality of copy"
        - "Expert opinion without data"
        - "Industry conventions without testing"
        - "Sophisticated/elite approaches"
        - "Entertainment value"

      amplifies:
        - "Test results and data"
        - "Specific, verifiable facts"
        - "Customer behavior and psychology"
        - "Product manufacturing details"
        - "Common language and concerns"
        - "First-claim opportunities"

    information_weighting:
      - input: "Test results"
        weight: 10
        rationale: "Data is truth"

      - input: "Factory/product knowledge"
        weight: 9
        rationale: "Understanding enables specificity"

      - input: "Customer feedback"
        weight: 9
        rationale: "Market decides"

      - input: "Expert opinion"
        weight: 2
        rationale: "Worthless without data"

      - input: "Creative judgment"
        weight: 3
        rationale: "Subordinate to effectiveness"

      - input: "Industry convention"
        weight: 4
        rationale: "May be wrong; test instead"

    bias_patterns:
      - bias: "Against sophistication"
        effect: "May dismiss valid literary approaches"
        origin: "Working class identity; anti-elite stance"

      - bias: "Against creativity label"
        effect: "May undersell intuitive contributions"
        origin: "Defining self against creative establishment"

      - bias: "For measurement"
        effect: "May over-test; analysis paralysis rare but possible"
        origin: "Testing as psychological security"

  # ========================================
  # OUTPUT CHARACTERISTICS
  # ========================================

  output_characteristics:
    decision_speed: "deliberate_then_fast"
    description: |
      SLOW for strategy (research, testing, hypothesis formation)
      FAST for tactics (once data is in, decide quickly)

    communication_style: "direct_and_specific"
    description: |
      Plain language, specific claims, no hedging on principles.
      Humble about self; confident about methods.

    commitment_level: "firm_with_data"
    description: |
      Once tested, commitments are strong.
      Willing to change if new data emerges.

    reversibility: "data_dependent"
    description: |
      Positions are firm but not permanent.
      New test results can change any decision.

  # ========================================
  # ALGORITHMIC UNIQUENESS
  # ========================================

  algorithmic_uniqueness:
    differs_from_conventional:
      - conventional: "Create ad, then see if it works"
        hopkins: "Create testing mechanism, then create ad"
        uniqueness: "Testing PRECEDES creation, not follows"

      - conventional: "Expert judgment guides creative"
        hopkins: "Data from customers guides creative"
        uniqueness: "Authority flows from market, not desk"

      - conventional: "Creativity is advertising's essence"
        hopkins: "Salesmanship is advertising's essence"
        uniqueness: "Redefines the field's purpose"

      - conventional: "General claims build brands"
        hopkins: "Specific claims build sales"
        uniqueness: "Absolute rejection of platitudes"

      - conventional: "Speed to market matters"
        hopkins: "Research depth matters more"
        uniqueness: "Weeks of research as competitive advantage"

    signature_patterns:
      - pattern: "Factory visit before writing"
        uniqueness: "Most copywriters researched from desk; Hopkins went to source"

      - pattern: "Dozens of headline variants"
        uniqueness: "Disproportionate effort on highest-leverage element"

      - pattern: "Preemptive claiming"
        uniqueness: "Systematic search for universal truths to claim first"

      - pattern: "Humble authority"
        uniqueness: "Combines self-deprecation with definitive teaching"

      - pattern: "Systematization of success"
        uniqueness: "Built repeatable systems; didn't rely on personal talent"

    counterintuitive_elements:
