        actual_outcome: "Wrote definitive testing-focused book with accessible framing"
        match: true

      - decision: "Liquozone work (early career)"
        algorithm_prediction: |
          Early Hopkins would accept questionable products if financially
          necessary (Financial Survival override), though later Hopkins
          would refuse
        actual_outcome: "Worked on patent medicines early; moved away after financial security"
        match: true

      - decision: "Factory visit standard practice"
        algorithm_prediction: |
