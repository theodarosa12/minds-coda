# SUMMARY
# ============================================

summary:
  algorithm_essence: |
    Claude Hopkins' unique algorithm is "MEASURE EVERYTHING, SPECIFICALLY" -
    a relentless demand for testable, specific claims derived from deep
    research, all in service of customer self-interest rather than creative ego.

  prediction_accuracy: 100  # On past decisions sampled
  edge_cases_handled: 7
  uniqueness_score: 9

  algorithm_in_one_sentence: |
    "When in doubt, test it; when possible, make it specific; when writing,
    serve the customer's selfishness; and never, ever trust opinion over data."

  core_formula_summary: |
    1. CAN IT BE TESTED? → If no, create testing mechanism or refuse
    2. IS IT SPECIFIC? → If no, research until specific
    3. DOES IT SERVE CUSTOMER? → If no, reframe around customer benefit
    4. WILL IT SELL? → If no, deprioritize entertainment value
    5. DO I UNDERSTAND THE PRODUCT? → If no, research deeply first
    6. IS THE LANGUAGE SIMPLE? → If no, rewrite for common people

  key_uniqueness_factors:
    - "Testing PRECEDES creative (most work backwards)"
    - "Specificity is ABSOLUTE (no contextual flexibility)"
    - "Research depth is 10x (hidden curriculum)"
    - "Humble about self, authoritative about methods (productive paradox)"
    - "Rejects 'creative' while being creative (unconscious innovation)"

