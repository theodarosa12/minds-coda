          "Curiosity is one of the strongest human incentives."

    - id: "MM_009"
      name: "The Sample Principle"
      category: persuasion
      priority: MEDIUM

      formulation:
        core: |
          The best way to sell is to let people try. Samples reduce risk,
          create experience, and convert skeptics. A sample is worth
          10,000 words of copy.
        rule: |
          IF product allows sampling AND economics work THEN
            ALWAYS include sampling strategy
            Track conversion from sample to purchase
            Optimize sampling for ROI
          END IF

      cognitive_function: |
        This model provides a CONVERSION ACCELERATOR. It recognizes that
        experience beats argument.

      application_contexts:
        primary:
          - "Product launches"
          - "Conversion optimization"
          - "Customer acquisition"
        secondary:
          - "Pricing strategy"
          - "Offer design"

      triggers:
        activates_when:
          - "New product introduction"
          - "High customer skepticism"
          - "Copy alone isn't converting"
        activation_speed: "Strategic (slow)"

      acquisition_source:
        origin: "Mail-order experience"
        training: "Pepsodent, Liquozone sampling campaigns"
        reinforcement: "Sampling increased conversion significantly"
        evidence: |
          "Sampling is an important factor in advertising. A sample enables
          the consumer to test the product at the advertiser's expense."

      model_strength:
        centrality: 7
        frequency_of_use: "When applicable"
        resistance_to_override: "Medium"
        integration_with_identity: "Proven technique"

      relationships:
        reinforces: ["MM_005"]
        conflicts_with: ["Copy-only approaches"]
        prerequisite_for: ["N/A"]
        derived_from: ["Testing"]

      evidence:
        source: "Scientific Advertising, Chapter 13"
        quote: |
          "Sampling is an important factor in advertising."

    - id: "MM_012"
      name: "Positive Over Negative"
      category: persuasion
      priority: MEDIUM

      formulation:
        core: |
          Don't attack competitors. Don't use negative arguments.
          Positive claims about your product beat negative claims about others.
          People want to feel good about choices, not afraid.
        rule: |
          IF copy mentions competitors negatively THEN
            Reject approach
            Reframe as positive claim for own product
            Focus on benefits, not competitor attacks
          END IF

      cognitive_function: |
        This model provides TONE GUIDANCE. It protects against approaches
        that may win arguments but lose customers.

      application_contexts:
        primary:
          - "Competitive positioning"
          - "Copy tone"
          - "Campaign strategy"
        secondary:
          - "Public relations"
          - "Brand building"

      triggers:
        activates_when:
          - "Competitive pressure"
          - "Temptation to attack competitors"
          - "Fear-based approaches suggested"
        activation_speed: "Fast"

      acquisition_source:
        origin: "Testing results"
        training: "Negative ads underperformed"
        reinforcement: "Positive campaigns consistently won"
        evidence: |
          "Show the bright side, the happy and attractive side, not the dark
          and repellent side of things."

      model_strength:
        centrality: 6
        frequency_of_use: "When tempted"
        resistance_to_override: "Medium"
        integration_with_identity: "Professional standard"

      relationships:
        reinforces: ["MM_005"]
        conflicts_with: ["Attack advertising"]
        prerequisite_for: ["N/A"]
        derived_from: ["Testing"]

      evidence:
        source: "Scientific Advertising, Chapter 18"
        quote: |
          "Negative advertising is seldom wise."

    - id: "MM_014"
      name: "One Thing at a Time"
      category: persuasion
      priority: HIGH

      formulation:
        core: |
          Focus on one claim, one benefit, one action. Confused minds
          don't buy. A sharp single message beats a dull comprehensive one.
        rule: |
          IF ad tries to communicate multiple messages THEN
            Reject approach
            Pick the strongest single message
            Save others for separate ads or tests
          END IF

      cognitive_function: |
        This model ensures MESSAGE CLARITY. It prevents the common error
        of trying to say everything at once.

      application_contexts:
        primary:
          - "Copy focus"
