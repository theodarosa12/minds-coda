          - "Optimization decisions"
          - "Testing prioritization"
        activation_speed: "Fast"

      acquisition_source:
        origin: "Testing data analysis"
        training: "Headlines showed largest variance"
        reinforcement: "Headline tests most predictive"
        evidence: |
          "The headline is the most important element. It's the first thing to test."

      model_strength:
        centrality: 8
        frequency_of_use: "Most tests"
        resistance_to_override: "High"
        integration_with_identity: "Best practice"

      relationships:
        reinforces: ["MM_004", "PROC_002"]
        conflicts_with: ["Body copy obsession"]
        prerequisite_for: ["Efficient testing"]
        derived_from: ["Testing data"]

      evidence:
        source: "Scientific Advertising"
        quote: |
          "The headline is the most important element."

  # ===========================================
