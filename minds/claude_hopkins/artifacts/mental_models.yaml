          - "Analyzing competitors"
          - "Understanding customers"
        activation_speed: "Analytical"

      acquisition_source:
        origin: "Observation"
        training: "Noting gaps in own behavior"
        reinforcement: "Behavioral patterns more predictive"
        evidence: |
          Hopkins' own hidden curriculum (10x research) vs advice ("understand product")

      model_strength:
        centrality: 7
        frequency_of_use: "Learning contexts"
        resistance_to_override: "Medium"
        integration_with_identity: "Meta-learning"

      note: |
        This is the most ironic model - Hopkins himself demonstrated
        a significant hidden curriculum. What he DID (weeks of research,
        obsessive testing, refusing shortcuts) was far more extreme than
        what he WROTE ("understand product", "test ads").

      relationships:
