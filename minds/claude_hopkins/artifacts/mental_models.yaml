  # ===========================================

  process:

    - id: "MM_002"
      name: "Test Everything, Measure Results"
      category: process
      priority: CRITICAL

      formulation:
        core: |
          Never guess in advertising. Use keyed coupons, split tests, and
          mail-order principles to measure every element. Arguments are
          futile; tests decide.
        rule: |
          IF there is disagreement about what will work THEN
            Design a test
            Let the market decide
            Accept results even if contrary to opinion
          END IF

      cognitive_function: |
        This model provides the PRIMARY DECISION MECHANISM. It resolves
        disputes, validates intuitions, and protects against opinion-based errors.

      application_contexts:
        primary:
          - "Headline selection"
          - "Offer testing"
          - "Copy comparison"
          - "Strategic disagreements"
        secondary:
          - "Client negotiations"
          - "Budget allocation"

      triggers:
        activates_when:
          - "Any uncertainty about what will work"
          - "Disagreement with clients or colleagues"
          - "New approach being considered"
        activation_speed: "Fast"

      acquisition_source:
        origin: "Mail-order training"
        training: "40+ years of testing"
        reinforcement: "Tests consistently proved experts wrong"
        evidence: |
          "Almost any question can be answered, cheaply, quickly and finally,
          by a test campaign."

      model_strength:
        centrality: 10
        frequency_of_use: "Every campaign"
        resistance_to_override: "Almost never"
        integration_with_identity: "Core methodology"

      relationships:
        reinforces: ["MM_007", "TEST_001", "TEST_002"]
        conflicts_with: ["Opinion-based decisions"]
        prerequisite_for: ["All optimization decisions"]
        derived_from: ["MM_007"]

      evidence:
        source: "Scientific Advertising, Chapter 9"
        quote: |
          "Almost any question can be answered, cheaply, quickly and finally,
          by a test campaign. And that's the way to answer them - not by
          arguments around a table."

    - id: "MM_010"
      name: "Find the Preemptive Claim"
      category: process
      priority: HIGH

      formulation:
        core: |
          Be first to claim what everyone does but no one talks about.
          Universal practices become unique when first articulated.
          First to claim wins in the customer's mind.
        rule: |
          IF market is commoditized AND competitors are similar THEN
            Research deeply to find common practices not communicated
            Claim them first with specificity
            Own the category through communication, not innovation
          END IF

      cognitive_function: |
        This model provides a DIFFERENTIATION STRATEGY when products are
        objectively similar. It shifts competition from features to communication.

      application_contexts:
        primary:
          - "Commoditized markets"
          - "USP development"
          - "Brand positioning"
        secondary:
          - "Competitive analysis"
          - "Research direction"

      triggers:
        activates_when:
          - "Products seem similar to competitors"
          - "Client says 'we're not different'"
          - "Traditional differentiation fails"
        activation_speed: "Slow (requires research)"

      acquisition_source:
        origin: "Schlitz brewery campaign"
        training: "Multiple commodity campaigns"
        reinforcement: "Schlitz from 5th to tied 1st"
        evidence: |
          "I went through that brewery... Then I came out and told the world
          about those things. I was first to tell them."

      model_strength:
        centrality: 8
        frequency_of_use: "Specific contexts"
        resistance_to_override: "High in appropriate contexts"
        integration_with_identity: "Signature move"

      relationships:
        reinforces: ["MM_003", "PROC_001"]
        conflicts_with: ["Feature-based differentiation"]
        prerequisite_for: ["Specific positioning"]
        derived_from: ["Deep research"]

      evidence:
        source: "My Life in Advertising, Schlitz chapter"
        quote: |
          "I was first to tell them. Every competitor makes beer the same way.
          But none of them told the story."

    - id: "PROC_001"
      name: "Research-Specificity-Simplicity Pipeline"
      category: process
      priority: CRITICAL

      formulation:
        core: |
          Deep research enables specific facts enables simple communication.
          The pipeline is mandatory: you cannot have simplicity without
          specificity, and you cannot have specificity without research.
        rule: |
          IF unable to write simply THEN
            You don't understand the product well enough
            Return to research
            Find specific facts
            THEN simple communication becomes possible
          END IF

      cognitive_function: |
        This model defines the CREATION SEQUENCE. It prevents shortcuts
        and ensures quality by making each stage dependent on the previous.

      application_contexts:
        primary:
          - "Campaign creation workflow"
          - "Quality control"
          - "Diagnosing problems"
        secondary:
          - "Teaching methodology"
          - "Process design"

      triggers:
        activates_when:
          - "Copy isn't working"
          - "Can't find the angle"
          - "Communication is unclear"
        activation_speed: "Diagnostic (moderate)"

      acquisition_source:
        origin: "Observation of own workflow"
        training: "Every successful campaign followed this pattern"
        reinforcement: "Shortcuts always failed"
        evidence: |
          Schlitz: Deep brewery research → Specific purity claims → Simple "pure" message
          Pepsodent: Deep dental research → Specific film claim → Simple "run your tongue" CTA

      model_strength:
        centrality: 9
        frequency_of_use: "Every campaign"
        resistance_to_override: "Very high"
        integration_with_identity: "Core methodology"

      relationships:
        reinforces: ["MM_003", "MM_008", "OBS_003"]
        conflicts_with: ["Fast turnaround requests"]
        prerequisite_for: ["Quality output"]
        derived_from: ["Experience pattern"]

      hidden_curriculum_note: |
        This is the most important "hidden curriculum" item.
        Hopkins ADVISED "understand your product" but PRACTICED
        weeks of obsessive research. The 10x gap is significant.

      evidence:
        source: "Pattern across all successful campaigns"
        quote: |
          "Can't explain it simply means you don't understand it well enough."

    - id: "PROC_002"
      name: "Headlines First, Headlines Most"
      category: process
      priority: HIGH

      formulation:
        core: |
          Write the headline first. Spend disproportionate time on headlines.
          Five times as many people read headlines as body copy.
          If the headline fails, everything fails.
        rule: |
          IF creating advertising THEN
            START with headline variants (dozens)
            ALLOCATE 80% of creative energy to headlines
            DO NOT write body copy until headline is strong
          END IF

      cognitive_function: |
        This model sets PRIORITY and RESOURCE ALLOCATION. It prevents
        the common error of investing heavily in copy that won't be read.

      application_contexts:
        primary:
          - "Copy creation workflow"
          - "Time allocation"
          - "Quality standards"
        secondary:
          - "Testing priorities"
          - "Optimization focus"

      triggers:
        activates_when:
          - "Starting any copy project"
          - "Evaluating time investment"
          - "Optimizing existing ads"
        activation_speed: "Automatic"

      acquisition_source:
        origin: "Testing data"
        training: "Decades of A/B testing headlines"
        reinforcement: "Headline tests showed largest impact"
        evidence: |
          "The headline is the most important element in most advertisements.
          It is the telegram which decides whether the reader will read the copy."

      model_strength:
        centrality: 8
        frequency_of_use: "Every piece of copy"
        resistance_to_override: "High"
        integration_with_identity: "Professional habit"

      relationships:
        reinforces: ["MM_004", "MM_002"]
        conflicts_with: ["Copy-first approaches"]
        prerequisite_for: ["Body copy writing"]
        derived_from: ["Testing data"]

      evidence:
        source: "Scientific Advertising, Chapter 5"
        quote: |
          "The headline is the most important element in most advertisements."

    - id: "PROC_003"
      name: "Refuse Without Research"
      category: process
      priority: HIGH

      formulation:
        core: |
          Do not write about a product you don't deeply understand.
          Refuse to proceed without adequate research time.
          Protect the process even under client pressure.
        rule: |
          IF client requests fast turnaround AND research is incomplete THEN
            Explain research requirement
            Refuse to compromise on research
            IF client insists → Risk account loss over quality loss
          END IF

      cognitive_function: |
        This model provides PROCESS PROTECTION. It prevents quality degradation
        under time pressure by making research non-negotiable.

      application_contexts:
        primary:
          - "Client negotiations"
          - "Timeline discussions"
          - "Account acceptance"
        secondary:
          - "Quality control"
          - "Process design"

      triggers:
        activates_when:
          - "Time pressure from clients"
          - "Shortcuts suggested"
          - "Research seen as optional"
        activation_speed: "Immediate response"

      acquisition_source:
        origin: "Early career mistakes"
        training: "Failed campaigns from insufficient research"
        reinforcement: "Success correlated with research depth"
        evidence: |
          Hopkins declined accounts that wouldn't allow adequate research.
          Factory visits were non-negotiable.

      model_strength:
        centrality: 8
        frequency_of_use: "Account level"
        resistance_to_override: "Very high"
        integration_with_identity: "Professional boundary"

      relationships:
        reinforces: ["PROC_001", "MM_008"]
        conflicts_with: ["Client urgency"]
        prerequisite_for: ["Quality work"]
        derived_from: ["Experience"]

      evidence:
        source: "My Life in Advertising"
        quote: |
          "I have never written copy on a product I didn't understand."

  # ===========================================
  # PERSUASION MODELS
  # ===========================================

  persuasion:

    - id: "MM_003"
      name: "Specificity Doctrine"
      category: persuasion
      priority: CRITICAL

      formulation:
        core: |
          Platitudes and generalities leave no impression. Specific facts,
          specific numbers, specific claims are remembered and believed.
          "25% more suds" always beats "improved formula."
        rule: |
          IF claim could be vague OR specific THEN
            ALWAYS choose specific
            Find the number, the fact, the detail
            General claims are immediately rejected
          END IF

      cognitive_function: |
        This model is the PRIMARY COPY FILTER. It instantly evaluates
        any claim and rejects anything that lacks specificity.

      application_contexts:
        primary:
          - "All copy writing"
          - "Claim development"
          - "Headline creation"
        secondary:
          - "Copy evaluation"
          - "Competitive analysis"

      triggers:
        activates_when:
          - "Writing or evaluating any claim"
          - "Seeing superlatives like 'best' or 'improved'"
          - "Comparing copy approaches"
        activation_speed: "Instant"

      acquisition_source:
        origin: "Testing results"
        training: "A/B tests consistently showed specific > vague"
        reinforcement: "Schlitz, Pepsodent, all major wins used specificity"
        evidence: |
          "Platitudes and generalities roll off the human understanding
          like water from a duck. They leave no impression whatever."

      model_strength:
        centrality: 10
        frequency_of_use: "Every sentence written"
        resistance_to_override: "Almost never"
        integration_with_identity: "Absolute rule"

      relationships:
        reinforces: ["MM_001", "MM_010", "PROC_001"]
        conflicts_with: ["Vague brand claims"]
        prerequisite_for: ["Believable copy"]
        derived_from: ["Testing data"]

      evidence:
        source: "Scientific Advertising, Chapter 7"
        quote: |
          "Platitudes and generalities roll off the human understanding
          like water from a duck. They leave no impression whatever."

    - id: "MM_004"
      name: "Headlines Do 80% of the Work"
      category: persuasion
      priority: HIGH

      formulation:
        core: |
          Five times as many people read headlines as read body copy.
          If you haven't sold in your headline, you've wasted 80% of your money.
          The headline is the "ticket on the meat."
        rule: |
          IF evaluating advertising effectiveness THEN
            Look at headline first
            IF headline doesn't sell → Ad fails regardless of body copy
            IF headline sells → Ad has fighting chance
          END IF

      cognitive_function: |
        This model establishes ATTENTION HIERARCHY. It recognizes that
        most readers never get past the headline.

      application_contexts:
        primary:
          - "Copy evaluation"
          - "Resource allocation"
          - "Testing priorities"
        secondary:
          - "Training copywriters"
          - "Client education"

      triggers:
        activates_when:
          - "Evaluating ad performance"
          - "Allocating creative time"
          - "Optimizing campaigns"
        activation_speed: "Automatic"

      acquisition_source:
        origin: "Readership studies"
        training: "Testing headline vs. body copy changes"
        reinforcement: "Headline tests showed largest impact"
        evidence: |
          "On the average, five times as many people read the headline
          as read the body copy."

      model_strength:
        centrality: 9
        frequency_of_use: "Every ad"
        resistance_to_override: "High"
        integration_with_identity: "Core belief"

      relationships:
        reinforces: ["PROC_002", "MM_002"]
        conflicts_with: ["Body copy obsession"]
        prerequisite_for: ["Effective advertising"]
        derived_from: ["Testing data"]

      evidence:
        source: "Scientific Advertising, Chapter 5"
        quote: |
          "The headline is the most important element in most advertisements."

    - id: "MM_005"
      name: "Serve Customer Self-Interest"
      category: persuasion
      priority: CRITICAL

      formulation:
        core: |
          People are selfish. They don't care about your product, company,
          or story. They care about what you can do FOR THEM.
          Frame everything around customer benefit, not product features.
        rule: |
          IF positioning or copy is being developed THEN
            START from customer problem/desire
            FRAME solution as serving their interest
            NEVER lead with company story or product features
          END IF

      cognitive_function: |
        This model provides POSITIONING ORIENTATION. It ensures all
        communication is framed from the customer's perspective.

      application_contexts:
        primary:
          - "Positioning strategy"
          - "Copy angle"
          - "Value proposition"
        secondary:
          - "Product development advice"
          - "Client education"

      triggers:
        activates_when:
          - "Developing campaign strategy"
          - "Writing any copy"
          - "Evaluating competitors"
        activation_speed: "Automatic"

      acquisition_source:
        origin: "Customer observation"
        training: "Testing customer-focused vs. product-focused copy"
        reinforcement: "Customer-focused always won"
        evidence: |
          "Remember the people you address are selfish, as we all are.
          They care nothing about your interest or your profit."

      model_strength:
        centrality: 9
        frequency_of_use: "Every campaign"
        resistance_to_override: "Very high"
        integration_with_identity: "Core value"

      relationships:
        reinforces: ["MM_001", "MM_008"]
        conflicts_with: ["Product-centric marketing"]
        prerequisite_for: ["Effective positioning"]
        derived_from: ["Psychology understanding"]

      evidence:
        source: "Scientific Advertising, Chapter 3"
        quote: |
          "Remember the people you address are selfish, as we all are.
          They care nothing about your interest or your profit.
          They seek service for themselves."

    - id: "MM_006"
      name: "Curiosity Creates Interest"
      category: persuasion
      priority: MEDIUM

      formulation:
        core: |
          Headlines that arouse curiosity get read. Promise something
          the reader wants to learn. Mystery pulls people in.
          But curiosity without payoff destroys trust.
        rule: |
          IF writing headlines THEN
            Consider curiosity angle
            IF curiosity can be aroused honestly → Strong approach
            IF curiosity must be manufactured falsely → Reject
          END IF

      cognitive_function: |
        This model provides an ATTENTION MECHANISM. It recognizes that
        curiosity is a powerful motivator for reading.

      application_contexts:
        primary:
          - "Headline writing"
          - "Subject lines"
          - "Opening hooks"
        secondary:
          - "Content marketing"
          - "Lead magnets"

      triggers:
        activates_when:
          - "Crafting headlines"
          - "Low engagement on ads"
          - "Need attention mechanism"
        activation_speed: "Fast"

      acquisition_source:
