  # ===========================================

  meta_cognitive:

    - id: "META_002"
      name: "Systematize Success"
      category: meta_cognitive
      priority: HIGH

      formulation:
        core: |
          When something works, extract the principle. Document it.
          Teach it. Turn success into system. Methodology beats genius.
        rule: |
          IF campaign succeeds THEN
            Extract the generalizable principle
            Document for future use
            Test applicability to other situations
          END IF

      cognitive_function: |
        This model drives KNOWLEDGE ACCUMULATION. It transforms
        individual successes into reusable methodology.

      application_contexts:
        primary:
