      model_strength:
        centrality: 8
        frequency_of_use: "Post-success"
        resistance_to_override: "High"
        integration_with_identity: "Legacy-building"

      relationships:
        reinforces: ["MM_002", "TEST_002"]
        conflicts_with: ["Genius narrative"]
        prerequisite_for: ["Teaching"]
        derived_from: ["Success patterns"]

      evidence:
        source: "Both books"
        quote: |
          "The principles of advertising... can be systematized."

    - id: "META_003"
      name: "Hidden Curriculum Awareness"
      category: meta_cognitive
      priority: HIGH

      formulation:
        core: |
          What people DO is more important than what they SAY.
          The hidden curriculum (behavior) reveals more than the
          explicit curriculum (advice).
        rule: |
          IF learning from anyone THEN
            Observe their behavior, not just their words
            Look for gaps between advice and action
            The gap is often the most valuable learning
          END IF

      cognitive_function: |
        This model enables DEEP LEARNING. It directs attention to
        behavioral evidence over stated principles.

      application_contexts:
        primary:
          - "Learning from others"
