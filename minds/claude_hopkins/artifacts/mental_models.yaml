  # ===========================================
  # TESTING MODELS
  # ===========================================

  testing:

    - id: "TEST_001"
      name: "Test Before Scale"
      category: testing
      priority: CRITICAL

      formulation:
        core: |
          Never scale before testing. Small tests with real customers
          predict large-scale results. The market's verdict is final.
        rule: |
          IF campaign is ready to scale THEN
            FIRST run small-scale test
            IF test results positive → Scale proportionally
            IF test results negative → Iterate or abandon
            NEVER scale on opinion alone
          END IF

      cognitive_function: |
        This model provides RISK MANAGEMENT. It prevents catastrophic
        failures by validating before large investments.

      application_contexts:
        primary:
          - "Campaign launches"
          - "Budget decisions"
          - "New approaches"
        secondary:
          - "Client negotiations"
          - "Process design"

      triggers:
        activates_when:
          - "Budget allocation decisions"
          - "New campaign launch"
          - "Scaling decision"
        activation_speed: "Automatic"

      acquisition_source:
        origin: "Mail-order training"
        training: "Small-market tests before national"
        reinforcement: "Tests saved from disasters"
        evidence: |
          "We never go into any campaign blindly. We test the proposition first."

      model_strength:
        centrality: 10
        frequency_of_use: "Every campaign"
        resistance_to_override: "Almost never"
        integration_with_identity: "Non-negotiable"

      relationships:
        reinforces: ["MM_002", "MM_007"]
        conflicts_with: ["Fast scaling"]
        prerequisite_for: ["Scaling decisions"]
        derived_from: ["Mail-order discipline"]

      evidence:
        source: "Scientific Advertising"
        quote: |
          "We never go into any campaign blindly."

    - id: "TEST_002"
      name: "Data Overrides Opinion"
      category: testing
      priority: CRITICAL

      formulation:
        core: |
          When test data contradicts expert opinion, follow the data.
          When intuition conflicts with results, trust results.
          The market is always smarter than any individual.
        rule: |
          IF expert opinion conflicts with test data THEN
            ALWAYS follow test data
            Document the learning
            Update mental models accordingly
          END IF

      cognitive_function: |
        This model provides TRUTH-SEEKING mechanism. It overrides ego,
        reputation, and seniority in favor of evidence.

      application_contexts:
        primary:
          - "Test result interpretation"
          - "Strategy decisions"
          - "Disagreement resolution"
        secondary:
          - "Learning"
          - "Methodology protection"

      triggers:
        activates_when:
          - "Test results surprise"
          - "Expert disagrees with data"
          - "Intuition contradicts results"
        activation_speed: "Immediate"

      acquisition_source:
        origin: "Repeated experience"
        training: "Expert predictions often wrong"
        reinforcement: "Following data led to success"
        evidence: |
          Hopkins regularly overrode his own intuitions based on test data.

      model_strength:
        centrality: 10
        frequency_of_use: "Whenever conflict arises"
        resistance_to_override: "Never"
        integration_with_identity: "Core principle"

      relationships:
        reinforces: ["MM_002", "TEST_001"]
        conflicts_with: ["Opinion-based decisions"]
        prerequisite_for: ["Accurate learning"]
        derived_from: ["Experience"]

      evidence:
        source: "Scientific Advertising"
        quote: |
          "That's the way to answer questions - not by arguments around a table."

    - id: "TEST_003"
      name: "Headlines Are the Best Test"
      category: testing
      priority: HIGH

      formulation:
        core: |
          If you can only test one thing, test headlines. Headlines have
          the largest impact and the clearest signal. Headline tests
          reveal the best angle, not just the best words.
        rule: |
          IF limited testing budget THEN
            Prioritize headline tests
            Test different angles, not just word variations
            Use headline test results to guide all copy
          END IF

      cognitive_function: |
        This model optimizes TESTING EFFICIENCY. It directs limited
        resources to highest-impact tests.

      application_contexts:
        primary:
          - "Testing prioritization"
          - "Resource allocation"
          - "Optimization focus"
        secondary:
          - "Campaign strategy"
          - "Client recommendations"

      triggers:
        activates_when:
