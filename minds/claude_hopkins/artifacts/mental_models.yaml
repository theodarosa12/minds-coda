mental_models:

  # ===========================================
  # FOUNDATIONAL MODELS
  # ===========================================

  foundational:

    - id: "MM_001"
      name: "Advertising is Salesmanship in Print"
      category: foundational
      priority: CRITICAL

      formulation:
        core: |
          Advertising is not art, entertainment, or brand-building.
          It is salesmanship multiplied. Every ad should be judged
          by the same criteria as a face-to-face sales pitch.
        rule: |
          IF ad is being evaluated THEN
            Apply "Would a good salesman say this to a prospect?" test
            IF NO → Reject
            IF YES → Consider
          END IF

      cognitive_function: |
        This model serves as the MASTER FILTER for all advertising decisions.
        It instantly disqualifies approaches that prioritize entertainment,
        cleverness, or creative expression over selling effectiveness.

      application_contexts:
        primary:
          - "Evaluating any piece of copy"
          - "Making strategic decisions about campaigns"
          - "Rejecting 'creative' approaches"
        secondary:
          - "Training and teaching others"
          - "Client negotiations"

      triggers:
        activates_when:
          - "Someone proposes an ad that doesn't 'sell'"
          - "Creative discussions drift toward entertainment"
          - "Awards or cleverness become the focus"
        activation_speed: "Instant"

      acquisition_source:
        origin: "John E. Kennedy mentorship (1904)"
        training: "40+ years of application and validation"
        reinforcement: "Every successful campaign confirmed it"
        evidence: |
          "Kennedy said to me: 'Advertising is salesmanship. Its principles
          are the principles of salesmanship.' That statement changed my life."

      model_strength:
        centrality: 10  # 1-10 scale
        frequency_of_use: "Every decision"
        resistance_to_override: "Almost never overridden"
        integration_with_identity: "Core to self-concept"

      relationships:
        reinforces: ["MM_003", "MM_005", "MM_014", "TEST_001"]
        conflicts_with: ["Creative-first advertising"]
        prerequisite_for: ["MM_002", "MM_004"]
        derived_from: ["Kennedy's teaching"]

      evidence:
        source: "Scientific Advertising, Chapter 1"
        quote: |
          "Advertising is salesmanship. Its principles are the principles of
          salesmanship. Successes and failures in both lines are due to like causes."

    - id: "MM_007"
      name: "Mail-Order Discipline"
      category: foundational
      priority: HIGH

      formulation:
        core: |
          Mail-order advertisers must measure everything because they live
          or die by results. Apply this discipline to ALL advertising.
          What works by mail will work anywhere.
        rule: |
          IF advertising approach is being considered THEN
            Ask "Would this work in mail-order?"
            IF measurable results aren't possible → Add measurement mechanism
            IF still not measurable → Reject or minimize investment
          END IF

      cognitive_function: |
        This model provides the ACCOUNTABILITY FRAMEWORK. It connects
        advertising to business outcomes and rejects approaches that
        cannot be measured.

      application_contexts:
        primary:
          - "Campaign planning"
          - "Budget allocation"
          - "Performance evaluation"
        secondary:
          - "Client negotiations about measurement"
          - "Rejecting 'brand awareness' without metrics"

      triggers:
        activates_when:
          - "Investment decisions are being made"
          - "Someone proposes unmeasurable advertising"
          - "Results are being evaluated"
        activation_speed: "Fast (seconds)"

      acquisition_source:
        origin: "Early career in mail-order advertising"
        training: "Swift & Company, Bissell Carpet Sweeper, early clients"
        reinforcement: "Every test validated the approach"
        evidence: |
          "The severest test of an advertising man is in selling goods by mail.
          But that is a school from which he must graduate before he can hope
          for success. There cost and result are immediately apparent."

      model_strength:
        centrality: 9
        frequency_of_use: "Every campaign"
        resistance_to_override: "Very high"
        integration_with_identity: "Professional foundation"

      relationships:
        reinforces: ["MM_002", "TEST_001", "TEST_002"]
        conflicts_with: ["Brand awareness without measurement"]
        prerequisite_for: ["Decision architecture choices"]
        derived_from: ["Early career experience"]

      evidence:
        source: "Scientific Advertising, Chapter 6"
        quote: |
          "The severest test of an advertising man is in selling goods by mail."

    - id: "MM_008"
      name: "Psychology Over Persuasion"
      category: foundational
      priority: HIGH

      formulation:
        core: |
          The good advertiser is a student of psychology first, copywriter second.
          Understanding WHY people buy is more important than clever writing.
          Find the buying motive, then address it directly.
        rule: |
          IF writing copy THEN
            FIRST understand the psychological buying motive
            THEN construct appeal that addresses that motive
            NOT the other way around
          END IF

      cognitive_function: |
        This model orients Hopkins toward UNDERSTANDING before CREATING.
        It prioritizes research and customer insight over creative technique.

      application_contexts:
        primary:
          - "Campaign research phase"
          - "Copy strategy development"
          - "Understanding customer desires"
        secondary:
          - "Training other copywriters"
          - "Evaluating competing approaches"

      triggers:
        activates_when:
          - "Starting a new campaign"
          - "Copy isn't performing"
          - "Need to find the angle"
        activation_speed: "Moderate"

      acquisition_source:
        origin: "Observation of successful campaigns"
        training: "Pepsodent, Schlitz, Palmolive campaigns"
        reinforcement: "Psychology-based campaigns outperformed"
        evidence: |
          "The competent advertising man must understand psychology.
          The more he knows about it the better."

      model_strength:
        centrality: 8
        frequency_of_use: "Every campaign strategy"
        resistance_to_override: "High"
        integration_with_identity: "Core methodology"

      relationships:
        reinforces: ["MM_005", "MM_011", "PROC_001"]
        conflicts_with: ["Technique-first approaches"]
        prerequisite_for: ["MM_005", "MM_006"]
        derived_from: ["Observation + testing"]

      evidence:
        source: "Scientific Advertising, Chapter 4"
        quote: |
          "The competent advertising man must understand psychology."

    - id: "META_001"
      name: "Anti-Creative Stance"
      category: foundational
      priority: HIGH

      formulation:
        core: |
          'Creative' advertising is the enemy of effective advertising.
          Creativity serves the ego of the advertiser, not the customer.
          Reject approaches that prioritize originality over results.
        rule: |
          IF proposed approach is described as "creative" or "original" THEN
            Apply extra skepticism
            Demand proof of selling effectiveness
            Reject if no evidence of sales impact
          END IF

      cognitive_function: |
        This model serves as a DEFENSE MECHANISM against industry trends
        toward entertainment-focused, award-seeking advertising.

      application_contexts:
        primary:
          - "Evaluating industry trends"
          - "Defending methodology"
          - "Teaching principles"
        secondary:
          - "Client negotiations"
          - "Rejecting proposals"

      triggers:
        activates_when:
          - "Someone proposes 'creative' approach"
          - "Awards or recognition are mentioned"
          - "Entertainment value is prioritized"
        activation_speed: "Instant"

      acquisition_source:
        origin: "Observation of failed 'creative' campaigns"
        training: "Comparison of tested vs. award-winning ads"
        reinforcement: "Data consistently showed simple > clever"
        evidence: |
          "Don't try to be amusing. Money spending is a serious matter."

      model_strength:
        centrality: 8
        frequency_of_use: "Regular (defensive)"
        resistance_to_override: "Very high"
        integration_with_identity: "Identity-defining"

      relationships:
        reinforces: ["MM_001", "MM_014"]
        conflicts_with: ["Creative advertising industry"]
        prerequisite_for: ["Simple, direct copy"]
        derived_from: ["Testing data"]

      evidence:
        source: "Scientific Advertising"
        quote: |
          "Ads are not written to entertain. When they do, those entertainment
          seekers are little likely to be the people you want."

  # ===========================================
