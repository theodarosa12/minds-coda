# ============================================
# PHASE 1: DAILY RHYTHM MAPPING
# ============================================

daily_rhythm:
  overview: |
    Hopkins was a legendary workaholic. By all accounts, he worked 16-hour
    days for decades. His daily rhythm was organized around work, not around
    life. Work wasn't part of his day - work WAS his day.

  reconstructed_structure:
    note: |
      Hopkins didn't leave detailed daily schedules, but his output and
      case studies reveal a consistent work pattern organized around
      research phases, writing phases, and measurement analysis.

  morning:
    wake_time: "Early (pre-dawn based on era norms and work intensity)"
    first_hour:
      activities:
        - "Review previous day's results/data"
        - "Mental planning for day's focus"
        - "Coffee and simple breakfast (efficiency over luxury)"
      states_primed:
        - "Analytical readiness"
        - "Data-oriented thinking"
        - "Work mode activation"
      evidence: |
        Hopkins mentions starting work early in his autobiography.
        His poverty background instilled early rising habits.
        "I have worked harder than any man I have ever known."

    pre_work:
      activities:
        - "Review campaign status and test results"
        - "Prioritize day's most important task"
        - "Brief correspondence handling"
      states_primed:
        - "Research Immersion readiness"
        - "Strategic overview"
      note: |
        Hopkins likely minimized pre-work routine to maximize
        productive hours. Efficiency was a core value.

  work_periods:
    primary_block:
      time: "Morning through early afternoon"
      typical_activities:
        - "Deep research (factory visits, product study)"
        - "Headline generation and testing"
        - "Copy writing (when research complete)"
      state_maintained: "Research Immersion or Headline Crafting"
      characteristics:
        - "Uninterrupted focus"
        - "Single-task immersion"
        - "No frivolous activities"
      evidence: |
        Hopkins' case studies show extended periods of focused research.
        Schlitz brewery visit, Pepsodent dental study - these weren't
        brief visits but immersive experiences lasting days/weeks.

    secondary_blocks:
      - time: "Afternoon"
        activities:
          - "Writing and revision"
          - "Test result analysis"
          - "Client communications"
        state: "Copy Writing or Testing/Measurement"
        note: |
          Hopkins likely reserved afternoon for less creative work
          after primary mental energy expended on morning research.

      - time: "Late afternoon/Evening"
        activities:
          - "Review and planning"
          - "Additional testing analysis"
          - "Reading and study (competitors, industry)"
        state: "Teaching/Codifying or continued work"
        note: |
          Hopkins worked late into evening regularly. No evidence
          of strict work-life separation.

  transitions:
    work_to_personal:
      description: "Minimal transition - work dominated"
      evidence: |
        Hopkins mentions wife once in autobiography. Work consumed
        his life. He reportedly had few close friendships outside
        professional relationships.
      pattern:
        - "Work continued until exhaustion"
        - "Minimal decompression rituals"
        - "Sleep as necessity, not rest"

    energy_management:
      description: "Task switching rather than rest"
      strategies:
        - "Alternate between research and writing"
        - "Move from creative to analytical tasks"
        - "Physical movement (factory visits) as energy renewal"
      note: |
        Hopkins managed energy through variety of work, not
        through leisure. Different work = different state = renewal.

  evening:
    decompression:
      activities:
        - "Continued reading (industry, competitors)"
        - "Planning next day's work"
        - "Review of current campaigns"
      note: |
        Hopkins' evening likely resembled his day - work-focused.
        Decompression was minimal by modern standards.

    family_time:
      activities:
        - "Minimal - mentioned once in autobiography"
      evidence: |
        Hopkins' autobiography is notably silent on family life.
        Work was his identity. Family was background, not foreground.

    pre_sleep:
      activities:
        - "Final review of day's work"
        - "Mental preparation for next day"
      states: "Analytical wind-down"
      note: |
        Hopkins likely worked until sleep was necessary.
        No evidence of relaxation rituals.

# ============================================
# PHASE 2: STATE-PRIMING ROUTINES
# ============================================

state_priming_routines:
  overview: |
    Hopkins' routines served as state-activation rituals. Each routine
    primed a specific behavioral state. The routines were not habits
    performed mindlessly - they were deliberate state-transitions.

  routines:

    # ========== ROUTINE 1: RESEARCH IMMERSION ACTIVATION ==========
    - routine_name: "Research Immersion Activation"
      routine_id: "ROUT_001"

      description: |
        Hopkins' signature routine for entering deep research mode.
        This wasn't casual research - it was obsessive product immersion
        that lasted days to weeks. The routine activated his most
        powerful analytical state.

      timing:
        when: "Start of new product/campaign"
        duration: "Days to weeks"
        frequency: "Every new assignment"

      activities:
        - activity: "Physical site visit (factory, store, production)"
          duration: "Full day or more"
          optional: false
          state_effect: "Triggers sensory immersion, grounds abstract in concrete"
          evidence: |
            "I went through that brewery. I saw plate-glass rooms where
            beer was dripping over pipes..." - Schlitz case study

        - activity: "Expert consultation"
          duration: "Hours to days"
          optional: false
          state_effect: "Builds domain expertise, finds hidden differentiators"
          evidence: |
            Hopkins studied dentistry for Pepsodent, carpet cleaning
            for Bissell, brewing for Schlitz. Not surface study.

        - activity: "Customer immersion"
          duration: "Hours to days"
          optional: false
          state_effect: "Understands buyer psychology, finds pain points"
          evidence: |
            "Remember the people you address are selfish."
            Hopkins understood customers through direct study.

        - activity: "Note-taking and documentation"
          duration: "Continuous during research"
          optional: false
          state_effect: "Captures insights, forces explicit articulation"

        - activity: "Delay of writing until understanding achieved"
          duration: "Until 'angle' emerges"
          optional: false
          state_effect: "Prevents premature commitment, ensures depth"

      state_priming:
        target_state: "Research Immersion Mode"
        priming_mechanism: |
          Physical presence at source (factory, customer) triggers
          deep investigative state. Can't stay shallow when physically
          immersed. The body commits the mind.
        success_rate: "high"
        time_to_state: "Hours (for full immersion)"

      disruption_analysis:
        when_disrupted: "Client pressure for fast delivery"
        consequence: |
          Hopkins would refuse or renegotiate. He protected research
          time fiercely. Premature writing without research = failure.
        recovery_time: "N/A - Hopkins didn't allow disruption"
        alternative_priming: |
          If physical visit impossible, Hopkins would request all
          available documentation and expert access remotely.

      minimum_viable:
        essential_elements:
          - "Physical/direct contact with product or process"
          - "Expert consultation"
          - "Time for insight emergence"
        time_required: "Minimum 2-3 days, typical 1-3 weeks"

      evidence:
        - source: "My Life in Advertising"
          quote: |
            "I went through that brewery. I saw plate-glass rooms where
            beer was dripping over pipes, being cooled in filtered air."
        - source: "Pepsodent case study"
          quote: "Hopkins studied dentistry to find the 'film' angle."

    # ========== ROUTINE 2: HEADLINE CRAFTING SESSION ==========
    - routine_name: "Headline Crafting Session"
      routine_id: "ROUT_002"

      description: |
        Intensive creative-analytical session for generating and
        testing headline candidates. Hopkins spent disproportionate
        time here because "headlines do 80% of the work."

      timing:
        when: "After research phase complete, 'angle' identified"
        duration: "Hours to days per campaign"
        frequency: "Every campaign"

      activities:
        - activity: "Review research notes and differentiators"
          duration: "30-60 minutes"
          optional: false
          state_effect: "Activates research insights, primes creative generation"

        - activity: "Prolific variant generation"
          duration: "2-4 hours"
          optional: false
          state_effect: "Generates dozens of options, suspends judgment"
          evidence: |
            Ogilvy noted Hopkins wrote dozens of headlines for each
            campaign, never stopping at first ideas.

        - activity: "Apply 'salesman test' to each option"
          duration: "1-2 hours"
          optional: false
          state_effect: "Filters creative output through sales lens"

        - activity: "Reference past successful patterns"
          duration: "30 minutes"
          optional: false
          state_effect: "Pattern matching to proven templates"

        - activity: "Select variants for testing"
          duration: "30-60 minutes"
          optional: false
          state_effect: "Transition from creation to measurement"

      state_priming:
        target_state: "Headline Crafting Mode"
        priming_mechanism: |
          Research completion signal + quiet workspace + past headline
          swipe files creates creative tension that generates options.
          The salesman test provides evaluation filter.
        success_rate: "high"
        time_to_state: "30-60 minutes"

      disruption_analysis:
        when_disrupted: "Interruptions, premature client feedback"
        consequence: |
          Quality degradation. Hopkins needed uninterrupted creative
          time to generate sufficient variants.
        recovery_time: "30-60 minutes to re-enter state"
        alternative_priming: |
          Reviewing swipe file of past successes can restart the
          creative process if interrupted.

      minimum_viable:
        essential_elements:
          - "Clear differentiator from research"
          - "Uninterrupted time"
          - "Salesman test filter"
        time_required: "Minimum 2-4 hours"

      evidence:
        - source: "Scientific Advertising"
          quote: |
            "The headline is the most important element in most
            advertisements. It is the telegram which decides
            whether the reader will read the copy."

    # ========== ROUTINE 3: COPY WRITING FLOW ==========
    - routine_name: "Copy Writing Flow Session"
      routine_id: "ROUT_003"

      description: |
        Single-reader visualization writing session. Hopkins would
        imagine one specific person and write directly to them,
        creating conversational, salesmanship-focused copy.

      timing:
        when: "After headline selection"
        duration: "2-8 hours per piece"
        frequency: "Every campaign, multiple sessions"

      activities:
        - activity: "Visualize specific reader"
          duration: "5-10 minutes"
          optional: false
          state_effect: "Creates empathic connection, personalizes writing"
          evidence: |
            "I always imagined that I was talking to a single customer,
            not to a crowd."

        - activity: "Write in simple, direct language"
          duration: "1-4 hours"
          optional: false
          state_effect: "Flow state, pattern-based writing"

        - activity: "Apply salesman test throughout"
          duration: "Continuous"
          optional: false
          state_effect: "Quality control, keeps copy selling"

        - activity: "Read aloud for natural flow"
          duration: "15-30 minutes"
          optional: false
          state_effect: "Catches awkward phrasing, ensures conversational tone"

        - activity: "Revise for specificity"
          duration: "30-60 minutes"
          optional: false
          state_effect: "Replaces generals with specifics"

      state_priming:
        target_state: "Copy Writing Mode"
        priming_mechanism: |
          Clear headline direction + reader visualization creates
          flow state where internalized rules generate copy fluently.
          System 1 writing trained by System 2 principles.
        success_rate: "high"
        time_to_state: "15-30 minutes"

      disruption_analysis:
        when_disrupted: "Interruptions, unclear headline direction"
        consequence: |
          Flow state breaks. Writing becomes labored rather than
          fluent. Quality suffers.
        recovery_time: "15-30 minutes to re-visualize reader"
        alternative_priming: |
          Re-read headline, review customer notes, re-visualize
          specific reader to restart flow.

      minimum_viable:
        essential_elements:
          - "Clear headline/direction"
          - "Reader visualization active"
          - "Uninterrupted time"
        time_required: "Minimum 1-2 hours for short copy"

      evidence:
        - source: "My Life in Advertising"
          quote: |
            "I always imagined that I was talking to a single customer,
            not to a crowd. The personal touch makes all the difference."

    # ========== ROUTINE 4: TEST SETUP AND MONITORING ==========
    - routine_name: "Test Setup and Monitoring Protocol"
      routine_id: "ROUT_004"

      description: |
        Systematic routine for setting up tracking, running tests,
        and monitoring results. Hopkins built measurement into
        every campaign from start.

      timing:
        when: "Before campaign launch, ongoing during campaign"
        duration: "Setup: hours; Monitoring: ongoing"
        frequency: "Every campaign"

      activities:
        - activity: "Design tracking mechanism (keyed coupons, codes)"
          duration: "1-2 hours"
          optional: false
          state_effect: "Activates measurement mindset"

        - activity: "Configure split test variants"
          duration: "1-2 hours"
          optional: false
          state_effect: "Structures experimental approach"

        - activity: "Launch with tracking in place"
          duration: "N/A"
          optional: false
          state_effect: "Transition to monitoring mode"

        - activity: "Daily/weekly results review"
          duration: "30-60 minutes per review"
          optional: false
          state_effect: "Data-driven decision making"

        - activity: "Document learnings and iterate"
          duration: "1-2 hours per cycle"
          optional: false
          state_effect: "Pattern extraction, knowledge accumulation"

      state_priming:
        target_state: "Testing & Measurement Mode"
        priming_mechanism: |
          Data availability triggers analytical state. Hopkins couldn't
          NOT analyze when results were available. The routine was
          automatic: data arrives → analyze.
        success_rate: "high"
        time_to_state: "Immediate upon data availability"

      disruption_analysis:
        when_disrupted: "Inadequate tracking, client impatience"
        consequence: |
          Hopkins would refuse to proceed without testing capability.
          This was non-negotiable. No tracking = no campaign.
        recovery_time: "N/A - Hopkins didn't allow this"
        alternative_priming: |
          If tracking impossible, Hopkins would reduce scale until
          testing could be implemented.

      minimum_viable:
        essential_elements:
          - "Tracking mechanism in place"
          - "Clear variants for comparison"
          - "Patience for data accumulation"
        time_required: "Setup: 2-4 hours; Monitoring: ongoing"

      evidence:
        - source: "Scientific Advertising"
          quote: |
            "Every dollar of the millions I have spent on advertising
            has been traced to its results."

    # ========== ROUTINE 5: TEACHING AND CODIFYING ==========
    - routine_name: "Teaching and Codification Session"
      routine_id: "ROUT_005"

      description: |
        Meta-cognitive routine for extracting principles from
        experience and communicating them clearly. This produced
        Hopkins' books and influenced his mentoring.

      timing:
        when: "After significant experience accumulation"
        duration: "Hours to sustained periods (book writing)"
        frequency: "Throughout career, intensifying later"

      activities:
        - activity: "Pattern recognition across cases"
          duration: "Hours to days"
          optional: false
          state_effect: "Identifies recurring success factors"

        - activity: "Principle extraction from patterns"
          duration: "Hours"
          optional: false
          state_effect: "Abstracts from specific to general"

        - activity: "Example selection for teaching"
          duration: "Hours"
          optional: false
          state_effect: "Grounds principles in concrete stories"

        - activity: "Simple language for complex ideas"
          duration: "Throughout"
          optional: false
          state_effect: "Makes wisdom accessible"

        - activity: "Framework creation"
          duration: "Days to weeks"
          optional: false
          state_effect: "Systematizes knowledge"

      state_priming:
        target_state: "Teaching & Codifying Mode"
        priming_mechanism: |
          Recognition of teachable pattern + audience need triggers
          codification. Hopkins saw teaching as duty - sharing what
          worked so others could succeed.
        success_rate: "high"
        time_to_state: "Variable - triggered by insight recognition"

      disruption_analysis:
        when_disrupted: "Active campaign demands"
        consequence: |
          Teaching deferred but not abandoned. Hopkins prioritized
          active work over codification, but always returned to teaching.
        recovery_time: "Hours to days to re-enter reflective state"
        alternative_priming: |
          Mentoring conversations could trigger teaching mode
          even during active campaign work.

      minimum_viable:
        essential_elements:
          - "Pattern recognition achieved"
          - "Audience for teaching"
          - "Time for abstraction"
        time_required: "Minimum hours for conversation; weeks for books"

      evidence:
        - source: "Scientific Advertising (existence)"
          observation: |
            The book itself is evidence of teaching mode - Hopkins
            spent considerable effort codifying his methods for others.

# ============================================
# PHASE 3: STRESS IMMUNITY ROUTINES
# ============================================

stress_immunity:
  overview: |
    Hopkins' psychological immune system was built around methodology
    protection and data validation. His defenses activated when his
    scientific approach was threatened.

  early_warning_recognition:
    signals:
      - signal: "Client pressure to skip testing"
        meaning: "Methodology threat detected"
        typical_response: "Boundary-setting negotiation"

      - signal: "'Creative' advertising advocates challenging approach"
        meaning: "Identity threat detected"
        typical_response: "Defensive mode activation"

      - signal: "Uncertainty about campaign direction"
        meaning: "Insufficient research signal"
        typical_response: "Return to research mode"

      - signal: "Test results contradicting intuition"
        meaning: "Calibration check needed"
        typical_response: "Accept data, update mental model"

    typical_timing: "Immediate recognition - System 1 pattern match"
    note: |
      Hopkins developed sensitive threat detection through decades
      of experience. He recognized methodology threats instantly.

  coping_routines:
    - routine: "Data Validation Defense"
      id: "COPE_001"
      triggers:
        - "Opinion offered without data"
        - "Pressure to proceed without testing"
        - "Intuition vs data conflict"
      response_pattern:
        - "Cite historical test results"
        - "Offer to test opposing view"
        - "Refuse to proceed on opinion alone"
      effectiveness: "high"
      recovery_time: "Immediate - data provides certainty"
      evidence: |
        "Almost any question can be answered by a test campaign.
        And that's the way to answer them - not by arguments around a table."

    - routine: "Research Deepening Response"
      id: "COPE_002"
      triggers:
        - "Copy not working"
        - "Unclear differentiation"
        - "Weak headline candidates"
      response_pattern:
        - "Return to source material"
        - "Request additional factory/customer access"
        - "Delay until understanding deepens"
      effectiveness: "high"
      recovery_time: "Days to weeks (research timeframe)"
      evidence: |
        When initial Pepsodent campaigns failed, Hopkins deepened
        research into dentistry until he found the 'film' angle.

    - routine: "Principle Citation Response"
      id: "COPE_003"
      triggers:
        - "Challenge to methodology"
        - "'Creative' advertising advocacy"
        - "Request for opinion-based decisions"
      response_pattern:
        - "Cite proven principles"
        - "Reference historical successes"
        - "Appeal to salesmanship test"
        - "Offer to prove through testing"
      effectiveness: "high"
      recovery_time: "Immediate - principles provide framework"
      evidence: |
        Hopkins' books are themselves a principle citation system.
        He systematized his defenses into teachable principles.

    - routine: "Account Refusal Protocol"
      id: "COPE_004"
      triggers:
        - "Client won't allow testing"
        - "Requirement for exaggerated claims"
        - "Methodology compromise demanded"
      response_pattern:
        - "Explain requirements clearly"
        - "Offer compromise if possible"
        - "Decline account if compromise impossible"
      effectiveness: "high"
      recovery_time: "Immediate - boundary maintained"
      evidence: |
        Hopkins refused accounts that wouldn't allow testing.
        He protected methodology even at cost of revenue.

  recovery_rituals:
    - ritual: "Return to Proven Principles"
      states_restored: ["Confidence", "Analytical clarity"]
      required_conditions:
        - "Access to documented principles"
        - "Historical success examples"
      mechanism: |
        When stressed, Hopkins could re-ground in tested principles.
        The system provided security. "It works because it's tested."

    - ritual: "Test and Validate"
      states_restored: ["Certainty", "Confidence"]
      required_conditions:
        - "Testing infrastructure"
        - "Time for data accumulation"
      mechanism: |
        Uncertainty resolved through testing. Hopkins' ultimate
        recovery was always "let's test it."

    - ritual: "Research Deepening"
      states_restored: ["Understanding", "Creative confidence"]
      required_conditions:
        - "Access to product/customer"
        - "Time for investigation"
      mechanism: |
        When stuck, go deeper. More research = more specificity =
        better copy. The solution was always in the details.

  failure_modes:
    - when: "No testing infrastructure available"
      breakdown_pattern: |
        Hopkins' primary defense (data validation) unavailable.
        Forced to rely on intuition alone, which violated his
        methodology. Stress increased without resolution path.
      consequence: |
        Either refused the work or (in early career) compromised.
        This failure mode drove his later insistence on measurement.
      frequency: "Rare in mature career - he built infrastructure"

    - when: "Time pressure preventing adequate research"
      breakdown_pattern: |
        Couldn't enter proper Research Immersion state.
        Forced to write from insufficient understanding.
        Quality degraded, specificity suffered.
      consequence: |
        Hopkins resisted this strongly. He would delay deadlines
        or reduce scope rather than skip research.
      frequency: "Occasional - some client pressure inevitable"

    - when: "Personal health/exhaustion"
      breakdown_pattern: |
        Hopkins' 16-hour workdays eventually took toll.
        When physically depleted, all states became harder to enter.
        Quality suffered from exhaustion.
      consequence: |
        Hopkins died relatively young (66). His work intensity
        may have contributed to health issues.
      frequency: "Increasing over career"
      note: |
        This is the hidden failure mode. Hopkins' immunity system
        didn't protect against self-imposed overwork.

# ============================================
# PHASE 4: COGNITIVE MODE RITUALS
# ============================================

cognitive_mode_rituals:
  overview: |
    Hopkins alternated between creative and analytical modes
    with clear switching protocols. His genius was in knowing
    WHEN to use each mode.

  creative_mode:
    name: "Generative Creation Mode"
    description: |
      State for generating headline variants, copy options,
      positioning angles. Divergent thinking, suspension of
      judgment, quantity over quality initially.

    activation_rituals:
      - "Research completion (understanding achieved)"
      - "Review of swipe file/past successes"
      - "Clear single-reader visualization"
      - "Uninterrupted time block"

    optimal_conditions:
      - "Morning (fresh mental energy)"
      - "After research phase complete"
      - "Clear differentiator identified"
      - "No pending data requiring analysis"
      - "Quiet workspace"

    state_markers:
      - "Rapid idea generation"
      - "Suspended judgment"
      - "Pattern matching to templates"
      - "Flow state feeling"
      - "Time distortion (hours feel like minutes)"

    system_dominance: "Mixed - System 1 generation, System 2 evaluation"

    evidence: |
      Hopkins wrote dozens of headline variants. This requires
      creative generation mode followed by analytical selection.

  analytical_mode:
    name: "Analytical Evaluation Mode"
    description: |
      State for evaluating options, analyzing test results,
      making data-driven decisions. Convergent thinking,
      critical assessment, quality over quantity.

    activation_rituals:
      - "Data availability (test results ready)"
      - "Multiple options to compare"
      - "Clear evaluation criteria"
      - "Time for deliberation"

    optimal_conditions:
      - "After creative generation complete"
      - "Test results accumulated"
      - "Stakes high enough to warrant deliberation"
      - "No time pressure forcing premature decision"

    state_markers:
      - "Critical evaluation active"
      - "Comparison thinking"
      - "Data > intuition orientation"
      - "Slower, more deliberate processing"
      - "Reference to principles and criteria"

    system_dominance: "System 2 - Deliberate analysis"

    evidence: |
      Hopkins' testing methodology required analytical mode.
      Every test result triggered evaluation, not just acceptance.

  switching_protocol:
    creative_to_analytical:
      trigger: "Sufficient options generated"
      process:
        - "Stop generation consciously"
        - "Shift to evaluation criteria"
        - "Apply salesman test to options"
        - "Reference past test data"
        - "Select variants for testing"
      time_required: "Minutes (clear transition)"
      note: |
        Hopkins had clear switching. Generation then evaluation.
        He didn't try to generate and evaluate simultaneously.

    analytical_to_creative:
      trigger: "Evaluation complete, need new options"
      process:
        - "Release critical judgment temporarily"
        - "Return to research insights"
        - "Visualize customer/reader"
        - "Allow pattern matching"
        - "Generate without filtering"
      time_required: "15-30 minutes"
      note: |
        Harder transition. Analytical mode is 'sticky.'
        Hopkins needed re-priming to return to generation.

    interference_patterns:
      - pattern: "Premature evaluation killing creativity"
        description: |
          Evaluating during generation stops flow. Hopkins learned
          to separate the phases clearly.
        solution: "Strict phase separation - generate THEN evaluate"

      - pattern: "Creative attachment overriding data"
        description: |
          Loving your headline more than test results. Hopkins
          explicitly warned against this.
        solution: "Data always wins. Test, don't argue."

      - pattern: "Analysis paralysis"
        description: |
          Too much evaluation, not enough action. Hopkins avoided
          this through testing - let market decide.
        solution: "When in doubt, test. Don't debate endlessly."

# ============================================
# PHASE 5: MINIMUM VIABLE ROUTINES
# ============================================

minimum_viable_routines:
  overview: |
    Under time pressure or resource constraints, what are the
    absolute essentials Hopkins would not skip?

  research_minimum:
    routine: "Research Immersion (Compressed)"
    essential_elements:
      - "Direct product contact (minimum 1 day)"
      - "Expert consultation (minimum 1 session)"
      - "Customer insight (minimum 10 representative examples)"
    time_required: "Minimum 2-3 days"
    note: |
      Hopkins would not write without AT LEAST this much research.
