  core_values:

    # === SUPREME VALUES (Rank 1-3) - Would sacrifice everything ===

    - rank: 1
      name: "Empirical Truth Over Opinion"
      description: |
        Hopkins held an absolute conviction that measurable data trumps all expert
        opinion, intuition, or theory. He refused to proceed on any advertising
        decision without a mechanism to test and measure results. This wasn't just
        a professional practice but a core identity element - he was the man who
        tested everything.
      intensity: 10
      immutability: "never_violated"

      evidences:
        - evidence_id: 1
          date: "1890s-1920s"
          context: "Entire career at Lord & Thomas"
          sacrifice: "Speed, convenience, client relationships"
          preservation: "Testing and measurement rigor"
          opportunity_cost: "Lost accounts that wouldn't allow testing"
          quote: "Almost any question can be answered, cheaply, quickly and finally, by a test campaign. And that's the way to answer them - not by arguments around a table."
          justification: "Testing was non-negotiable despite client pressure for faster delivery"
          consequences: "Built testing infrastructure that became industry standard"
          source: "Scientific Advertising, Chapter 9"
          source_type: "document"

        - evidence_id: 2
          date: "Entire career"
          context: "Every documented campaign"
          sacrifice: "Personal opinion, intuition, faster execution"
          preservation: "Data-driven decision making"
          opportunity_cost: "Time and resources spent on testing infrastructure"
          quote: "Not one dollar has been spent on my own opinions."
          justification: "Hopkins built coupon tracking systems before the term 'metrics' existed"
          consequences: "Created the direct response measurement standard"
          source: "My Life in Advertising"
          source_type: "document"

        - evidence_id: 3
          date: "Throughout career"
          context: "Headline selection process"
          sacrifice: "Personal preference, creative judgment"
          preservation: "Data-selected headlines"
          opportunity_cost: "Time writing dozens of variants for testing"
          quote: "The headline is the most important element in most advertisements."
          justification: "Always tested multiple headlines; data chose the winner, not copywriter"
          consequences: "Established headline testing as industry practice"
          source: "Scientific Advertising, Chapter 5"
          source_type: "document"

        - evidence_id: 4
          date: "Throughout career"
          context: "Client disagreements"
          sacrifice: "Client relationships, easy agreement"
          preservation: "Testing methodology"
          opportunity_cost: "Potential lost accounts from insisting on testing"
          quote: "Go to the court of last resort - the buyers of your product."
          justification: "Frequently disagreed with clients and proved them wrong through tests"
          consequences: "Built reputation as results-driven advertiser"
          source: "Scientific Advertising, Chapter 9"
          source_type: "document"

      triangulation:
        words: "Consistently advocated for testing in all writings; entire book titled 'Scientific' advertising"
        actions: "Built measurement infrastructure; refused to proceed without tracking; tested everything continuously"
        consequences_accepted: "Lost accounts that wanted fast, opinion-based work; spent resources on tracking systems"
        alignment: 0.95

      language:
        keywords: ["test", "measure", "results", "data", "proof", "court of last resort"]
        metaphors: ["university of advertising (mail-order)", "the buyers decide"]
        emotional_tone: "Passionate certainty when discussing measurement; dismissive of opinion"
        frequency: "Every chapter of Scientific Advertising; every case study in My Life"

      extreme_test:
        limit_situation: "Built entire career methodology around testing; would not write copy without measurement mechanism"
        would_die_for: false
        violations_count: 0
        violations_contexts: []

      tensions:
        conflicts_with_values: ["Speed", "Creative intuition"]
        conflicts_with_people: ["'Creative' advertising movement", "Impatient clients"]
        recurring_cost: "Time spent testing rather than producing; client pressure for faster work"
        unresolved_tensions: []

      origin:
        formative_event: "Mail-order career beginning - forced to measure everything to survive"
        formative_event_date: "Early career (1890s)"
        influence_person: "Mail-order industry discipline"
        influence_philosophy: "Scientific method applied to business"
        crystallization_age: 25
        evolution: "Started as survival necessity (mail-order), became absolute principle"

    - rank: 2
      name: "Obsessive Work Ethic"
      description: |
        Hopkins worked with an intensity that far exceeded industry norms. 16-hour days,
        weeks of research per campaign, relentless iteration. This wasn't just dedication
        but a core identity element that poverty instilled and success never removed.
        Work was who Hopkins WAS, not just what he did.
      intensity: 10
      immutability: "never_violated"

      evidences:
        - evidence_id: 1
          date: "From age 9"
          context: "Father's death forced Hopkins to work to support family"
          sacrifice: "Childhood, play, leisure"
          preservation: "Family survival, self-reliance"
          opportunity_cost: "Normal childhood development"
          quote: "I have pursued good principles all my life, and worked hard at it."
          justification: "Poverty created permanent work ethic"
          consequences: "Never stopped working intensely even when wealthy"
          source: "My Life in Advertising, early chapters"
          source_type: "document"

        - evidence_id: 2
          date: "Entire career"
          context: "Research for campaigns (Schlitz, Pepsodent, Palmolive)"
          sacrifice: "Personal time, relationships, easier approaches"
          preservation: "Research depth and quality"
          opportunity_cost: "Could have earned same by doing less (was already highest-paid)"
          quote: "I went through that brewery. I saw plate-glass rooms where beer was dripping over pipes..."
          justification: "Weeks of research when hours would satisfy most clients"
          consequences: "Discovered specific, claimable differentiators"
          source: "My Life in Advertising, Schlitz chapter"
          source_type: "document"

        - evidence_id: 3
          date: "Late career"
          context: "Continued working despite wealth"
          sacrifice: "Retirement, leisure, family time"
          preservation: "Continued productivity and contribution"
          opportunity_cost: "Could have retired comfortably"
          quote: "I have devoted my whole life to advertising."
          justification: "Kept working even when financially independent"
          consequences: "Wrote Scientific Advertising and My Life in Advertising"
          source: "My Life in Advertising, final chapters"
          source_type: "document"

        - evidence_id: 4
          date: "Throughout career"
          context: "Research depth compared to industry"
          sacrifice: "Speed, efficiency, work-life balance"
          preservation: "10x research depth vs. typical copywriter"
          opportunity_cost: "Could have taken more accounts with less depth"
          quote: "I have little genius, and I suppose I might say less education."
          justification: "Compensated for lack of 'genius' with disproportionate effort"
          consequences: "Discovered hidden differentiators others missed"
          source: "My Life in Advertising, introduction"
          source_type: "document"

      triangulation:
        words: "Repeatedly emphasized hard work as primary success driver; dismissed 'genius'"
        actions: "16-hour days documented; weeks of research per campaign; factory visits standard"
        consequences_accepted: "Limited personal relationships; work consumed life"
        alignment: 0.95

      language:
        keywords: ["work", "effort", "devoted", "pursued", "hard"]
        metaphors: ["life devoted to advertising", "university of advertising"]
        emotional_tone: "Matter-of-fact about intensity; no self-pity about sacrifice"
        frequency: "Origin story told repeatedly; work ethic mentioned throughout"

      extreme_test:
        limit_situation: "Worked from age 9 until death; never stopped even when wealthy"
        would_die_for: false
