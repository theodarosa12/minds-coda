  # ============================================
  # ANTI-VALUES (Visceral Rejections)
  # What Hopkins rejected is as revealing as what he embraced
  # ============================================

  anti_values:
    - anti_value_id: 1
      name: "Opinion-Based Decision Making"
      description: |
        Hopkins viscerally rejected making advertising decisions based on opinion,
        intuition, or boardroom debate. 'Arguments around a table' were not just
        ineffective but morally wrong - a betrayal of the scientific approach.
      rejection_intensity: 10

      manifestations:
        identification_signals:
          - "Decisions made without testing mechanism"
          - "Debates based on personal preference"
          - "Expert opinion without data backing"
          - "'I think' or 'I feel' language"
        physical_response: "Not documented, but written dismissal is strong"
        verbal_response:
          - "'Not by arguments around a table'"
          - "'Go to the court of last resort - the buyers'"
          - "'Opinion is worthless'"
        behavioral_response: "Would refuse to proceed; insisted on testing"

      embodiments:
        - person: "The 'creative' advertising establishment"
          reason: "Made decisions based on artistic judgment, not data"
        - person: "Impatient clients"
          reason: "Wanted decisions without testing"

      energy_spent_combating:
        hours_per_week: 0  # Historical figure - not measurable
        percent_of_public_discourse: 30
        resources_invested: "Entire book (Scientific Advertising) argues against opinion"

      cost_of_rejection:
        opportunities_lost:
          - "Some clients who wanted fast, opinion-based work"
        relationships_lost:
          - "Creative advertising community"
        energy_wasted: "Significant effort arguing for testing vs. opinion"

      exceptions:
        - situation: "Early career before testing infrastructure"
          reason: "Had to rely on intuition before systems existed"

    - anti_value_id: 2
      name: "Generality and Vagueness"
      description: |
        Hopkins had visceral contempt for platitudes, general claims, and vague
        language. 'Best in the world' and 'improved formula' were not just
        ineffective but offensive - lazy thinking that insulted the reader.
      rejection_intensity: 10

      manifestations:
        identification_signals:
          - "Superlatives without specifics ('best', 'greatest', 'improved')"
          - "Claims without proof"
          - "Vague language that could apply to anything"
        physical_response: "Not documented, but contempt is clear in writing"
        verbal_response:
          - "'Platitudes roll off like water from a duck'"
          - "'Superlatives are usually damaging'"
          - "'Suggest looseness of expression'"
        behavioral_response: "Would rewrite; would not approve vague copy"

      embodiments:
        - person: "Lazy copywriters"
          reason: "Default to easy general claims"
        - person: "Advertisers using 'best in the world'"
          reason: "Meaningless superlatives"

      energy_spent_combating:
        hours_per_week: 0  # Historical figure
        percent_of_public_discourse: 25
        resources_invested: "Entire chapter on Being Specific"

      cost_of_rejection:
        opportunities_lost:
          - "Faster copy production"
        relationships_lost: []
        energy_wasted: "Time rewriting vague copy to be specific"

      exceptions: []  # No exceptions - specificity was absolute

    - anti_value_id: 3
      name: "Creative Entertainment Priority"
      description: |
        Hopkins rejected advertising that prioritized entertainment, cleverness,
        or artistic merit over selling effectiveness. Awards, recognition, and
        'creative' acclaim were not just irrelevant but actively harmful.
      rejection_intensity: 9

      manifestations:
        identification_signals:
          - "Ads designed to win awards"
          - "Clever wordplay that doesn't sell"
          - "Entertainment value prioritized"
          - "Creative discussion separate from results"
        physical_response: "Not documented"
        verbal_response:
          - "'Advertising is salesmanship'"
          - "'Not written to entertain'"
          - "'The purpose is to sell'"
        behavioral_response: "Rejected creative assignments; never pursued awards"

      embodiments:
