  temporal_evolution:
    - phase_id: 1
      age_range: "0-18"
      period: "Childhood & Youth"
      life_context: |
        Born into poverty. Father (minister) died when Hopkins was 9.
        Had to work to support family. No formal education beyond high school.
        Learned work ethic from necessity, not choice.

      dominant_values:
        - value: "Hard Work as Survival"
          intensity: 10
          manifestation: "Worked from age 9 to support family"

        - value: "Understanding Common People"
          intensity: 8
          manifestation: "Grew up among working class; understood their concerns"

        - value: "Self-Reliance"
          intensity: 9
          manifestation: "No safety net; had to create own success"

      transition_event:
        event: "Father's death"
        date: "Age 9"
        impact: "Forced early responsibility; created permanent work ethic"
        values_before: ["Childhood innocence"]
        values_after: ["Work as identity", "Self-reliance", "Understanding common people"]
        values_unchanged: []

    - phase_id: 2
      age_range: "18-35"
      period: "Early Career"
      life_context: |
        Entered mail-order advertising. Learned through immediate feedback.
        Developed testing methodology out of necessity. Some ethical gray areas
        (patent medicine). Building reputation and methodology.

      dominant_values:
        - value: "Testing and Measurement"
          intensity: 9
          manifestation: "Mail-order forced measurement; began systematizing"

        - value: "Hard Work"
          intensity: 10
          manifestation: "16-hour days; obsessive effort"

        - value: "Specificity"
