    # === IMPORTANT VALUES (Rank 8-12) - Important but contextual ===

    - rank: 8
      name: "Headlines as Priority Investment"
      description: |
        Hopkins believed headlines deserved disproportionate attention because
        they do 80% of the work. This was both tactical (where to focus) and
        philosophical (importance of first impressions). He spent more time
