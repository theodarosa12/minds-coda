    - rank: 3
      name: "Specificity as Absolute Doctrine"
      description: |
        Hopkins held specificity as an inviolable principle. General claims, platitudes,
        and vague language were not just ineffective but morally wrong - a betrayal
        of the reader and the craft. '25% more suds' always beats 'improved formula'.
        This was non-negotiable, never contextual, never compromised.
      intensity: 10
      immutability: "never_violated"

      evidences:
        - evidence_id: 1
          date: "Throughout career"
          context: "All copy and positioning work"
          sacrifice: "Easy, general claims; faster writing"
          preservation: "Specific, verifiable statements"
          opportunity_cost: "Required deep research to find specific facts"
          quote: "Platitudes and generalities roll off the human understanding like water from a duck. They leave no impression whatever."
          justification: "Never wrote vague copy despite it being easier"
          consequences: "Copy that outperformed competitors consistently"
          source: "Scientific Advertising, Chapter 7"
          source_type: "document"

        - evidence_id: 2
          date: "Schlitz campaign"
          context: "Beer purity positioning"
          sacrifice: "Generic 'pure beer' claim"
          preservation: "Specific details: plate-glass rooms, wood-pulp filters, bottles washed 4 times"
          opportunity_cost: "Required brewery visit to find specifics"
          quote: "Then I came out and told the world about those things. I was first to tell them."
          justification: "Found specific, claimable facts rather than using industry-standard claims"
          consequences: "Schlitz rose from 5th to tied for 1st"
          source: "My Life in Advertising, Schlitz chapter"
          source_type: "document"

        - evidence_id: 3
          date: "Pepsodent campaign"
          context: "Toothpaste positioning"
          sacrifice: "Generic 'clean teeth' claims"
          preservation: "Specific enemy: 'film on teeth'"
          opportunity_cost: "Required dental research to find specific angle"
          quote: "I felt that the appeal must be founded on the removal of that film."
          justification: "Researched dentistry to find specific, tangible enemy"
          consequences: "Changed American dental habits; toothpaste usage rose 7% to 65%"
          source: "My Life in Advertising, Pepsodent chapter"
          source_type: "document"

        - evidence_id: 4
          date: "All writings"
          context: "Teaching principles to others"
          sacrifice: "Nuanced, contextual advice"
          preservation: "Absolute specificity doctrine"
          opportunity_cost: "Could have allowed more flexibility"
          quote: "Superlatives of that sort are usually damaging. They suggest looseness of expression, a tendency to exaggerate."
          justification: "Never suggested specificity was contextual; always absolute"
          consequences: "Became foundational copywriting principle for 100+ years"
          source: "Scientific Advertising, Chapter 7"
          source_type: "document"

      triangulation:
        words: "Entire chapter dedicated to 'Being Specific'; repeatedly condemned generalities"
        actions: "Every campaign shows specific claims; never wrote vague copy"
        consequences_accepted: "Required extra research time; refused easier general approaches"
        alignment: 0.95

      language:
        keywords: ["specific", "facts", "figures", "precise", "exact", "reason why"]
        metaphors: ["water from a duck (generalities)", "ticket on the meat (specificity)"]
        emotional_tone: "Contemptuous of platitudes; passionate about specific facts"
        frequency: "Core theme in every chapter; every case study"

      extreme_test:
        limit_situation: "Never compromised on specificity even when general claims would be faster"
        would_die_for: false
        violations_count: 0
        violations_contexts: []

      tensions:
        conflicts_with_values: ["Speed", "Ease"]
        conflicts_with_people: ["Lazy copywriters", "Clients wanting quick turnaround"]
        recurring_cost: "Extended research time to find specific facts"
        unresolved_tensions: []

      origin:
        formative_event: "Mail-order discipline where vague claims failed immediately"
        formative_event_date: "Early career"
        influence_person: "John E. Kennedy (reason-why advertising)"
        influence_philosophy: "Reason-why advertising school"
        crystallization_age: 30
        evolution: "Consistent from Kennedy influence onwards; never wavered"

    # === CORE VALUES (Rank 4-7) - Core identity, rare exceptions ===

    - rank: 4
      name: "Service to Customer (Not Self-Promotion)"
      description: |
        Hopkins believed advertising must serve the customer's interests first.
        Self-aggrandizement, clever entertainment, and ego-driven creativity were
        betrayals of purpose. The customer is the hero; the advertiser is the servant.
        This wasn't altruism but enlightened self-interest - service creates sales.
      intensity: 9
      immutability: "rare_exceptions"

      evidences:
        - evidence_id: 1
          date: "Throughout career"
          context: "Campaign positioning philosophy"
          sacrifice: "Self-promotion, agency branding, personal glory"
          preservation: "Customer-focused messaging"
          opportunity_cost: "Could have built personal brand more aggressively"
          quote: "Remember the people you address are selfish, as we all are. They care nothing about your interest or your profit. They seek service for themselves."
          justification: "Campaigns rarely mentioned Hopkins or his agency"
          consequences: "Customers responded because focus was on their needs"
          source: "Scientific Advertising, Chapter 3"
          source_type: "document"

        - evidence_id: 2
          date: "Palmolive campaign"
          context: "Positioning soap for women"
          sacrifice: "Product-feature focused messaging"
          preservation: "Customer-desire focused messaging (beauty)"
          opportunity_cost: "Required understanding what customers wanted, not what product did"
          quote: "The advertising man is a servant. He serves those who sell goods. He serves the people who buy."
          justification: "Started from 'what do women want?' not 'what does soap do?'"
          consequences: "Cleopatra angle resonated because it served customer aspiration"
          source: "Scientific Advertising, Chapter 3"
          source_type: "document"

        - evidence_id: 3
          date: "Throughout career"
          context: "Rejection of 'creative' advertising"
          sacrifice: "Awards, recognition, creative acclaim"
          preservation: "Customer results, sales effectiveness"
          opportunity_cost: "Never won creative awards; not recognized for 'art'"
          quote: "The purpose of advertising is to sell."
          justification: "Rejected entire awards culture that prioritized creativity over results"
          consequences: "Built reputation for results, not creativity"
          source: "Scientific Advertising"
          source_type: "document"

      triangulation:
        words: "Entire chapter on 'Offer Service'; consistently framed advertising as service"
        actions: "Campaigns focused on customer benefit; rejected self-promotional opportunities"
        consequences_accepted: "Lower personal recognition; no creative awards"
        alignment: 0.90

      language:
        keywords: ["service", "customer", "buyer", "prospect", "selfish (understanding, not judging)"]
        metaphors: ["servant to buyer", "salesman's standards"]
        emotional_tone: "Pragmatic; service as strategy, not morality"
        frequency: "Core theme; appears in multiple chapters"

      extreme_test:
        limit_situation: "Rejected creative awards culture entirely"
        would_die_for: false
        violations_count: 1
        violations_contexts: ["Wrote autobiography (My Life in Advertising) which is self-promotional, though framed as educational"]

      tensions:
        conflicts_with_values: ["Personal recognition", "Creative expression"]
        conflicts_with_people: ["Creative advertising establishment", "Award-focused agencies"]
        recurring_cost: "Lower personal visibility; not credited for 'art'"
        unresolved_tensions: []

      origin:
        formative_event: "Poverty - understood working class concerns from experience"
        formative_event_date: "Childhood"
        influence_person: "Working class upbringing"
        influence_philosophy: "Customer centricity as sales strategy"
        crystallization_age: 25
        evolution: "Consistent across career; framing refined but principle stable"

    - rank: 5
      name: "Truth in Advertising (Evolved)"
      description: |
        Hopkins believed advertising must be truthful - not primarily for ethical
        reasons but because truth builds long-term business. Lies destroy response
        rates and customer relationships. This value EVOLVED over his career - early
        patent medicine work had ethical gray areas, but later career showed
        consistent truth emphasis.
      intensity: 8
      immutability: "rare_exceptions"

      evidences:
        - evidence_id: 1
          date: "Late career (1920s)"
          context: "Codifying principles in Scientific Advertising"
          sacrifice: "Easier exaggeration, bolder claims"
          preservation: "Verifiable, truthful statements"
          opportunity_cost: "Some dramatic possibilities foreclosed"
          quote: "Any attempt to make people feel that they will be missing something valuable by not investigating your proposition will be wasted."
          justification: "Advocated against manipulation and false urgency"
          consequences: "Built long-term trust with consumers"
          source: "Scientific Advertising, Chapter 17"
          source_type: "document"

        - evidence_id: 2
          date: "Throughout career"
          context: "Claim substantiation practice"
          sacrifice: "Unverifiable big claims"
          preservation: "Specific, provable claims"
          opportunity_cost: "Smaller claims than competitors willing to exaggerate"
          quote: "I have never tried to deceive the people. I have never played on their credulity or ignorance."
          justification: "Tied specificity doctrine to truth - specific claims are verifiable"
          consequences: "Claims could be validated by consumer experience"
          source: "My Life in Advertising"
          source_type: "document"

        - evidence_id: 3
          date: "Post-Liquozone career"
          context: "Transition to mainstream products"
          sacrifice: "Patent medicine income (higher margins)"
          preservation: "Ethical clarity, verifiable products"
          opportunity_cost: "Lost lucrative patent medicine market"
          quote: "I have always tried to deal with them as I would be dealt with."
          justification: "Shifted to products with verifiable benefits (Pepsodent, Palmolive)"
          consequences: "Career associated with mainstream, ethical brands"
          source: "My Life in Advertising"
          source_type: "document"

      triangulation:
        words: "Chapter 17 dedicated to truth; repeatedly emphasized honest dealing"
        actions: "Later career focused on mainstream products with verifiable claims"
        consequences_accepted: "Moved away from lucrative patent medicine market"
        alignment: 0.75

      language:
        keywords: ["truth", "honest", "verify", "prove", "genuine"]
        metaphors: []
        emotional_tone: "Earnest when discussing truth; defensive about early career"
        frequency: "Moderate; increased emphasis in later writings"

      extreme_test:
        limit_situation: "Transitioned away from patent medicine despite income potential"
        would_die_for: false
        violations_count: 1
        violations_contexts: ["Liquozone period - early career work on questionable products"]

      tensions:
        conflicts_with_values: ["Income (early career)", "Client demands"]
        conflicts_with_people: ["Patent medicine industry"]
        recurring_cost: "Lost some income potential from strict truth standards"
        unresolved_tensions: ["Early career patent medicine work sits uncomfortably with later emphasis"]

      origin:
        formative_event: "Liquozone regulatory troubles and ethical reflection"
        formative_event_date: "Early 1900s"
        influence_person: ""
        influence_philosophy: "Long-term business building over short-term manipulation"
        crystallization_age: 45
        evolution: "EVOLVED significantly - early career more flexible; later career rigid"

    - rank: 6
      name: "Respect for Common People"
      description: |
        Hopkins came from poverty and never forgot it. He wrote for average people,
        not intellectuals. He believed in the wisdom of the masses over elite opinion.
        He lived modestly despite wealth. This was both practical (understanding customers)
        and philosophical (anti-elitism).
      intensity: 8
      immutability: "rare_exceptions"

      evidences:
        - evidence_id: 1
          date: "Entire career"
          context: "Writing style and approach"
          sacrifice: "Sophisticated, literary copy"
          preservation: "Simple, accessible language"
          opportunity_cost: "No literary recognition; dismissed by sophisticates"
          quote: "Use the language of the common people. Talk in the language they use in common talk. Don't be literary."
          justification: "Consistently wrote simple copy when sophisticated was fashionable"
          consequences: "Copy resonated with target audience; high response rates"
          source: "Scientific Advertising"
          source_type: "document"

        - evidence_id: 2
          date: "Entire career"
          context: "Personal lifestyle despite wealth"
          sacrifice: "Ostentatious living; social climbing"
          preservation: "Modest lifestyle; connection to working class"
          opportunity_cost: "Could have lived more lavishly; better social position"
          quote: "I have always lived among common people. I know them."
          justification: "Lived simply despite being highest-paid advertising man"
          consequences: "Maintained understanding of target customers"
          source: "My Life in Advertising"
          source_type: "document"

        - evidence_id: 3
          date: "Throughout career"
          context: "Philosophy of advertising"
          sacrifice: "Elite perspective; sophisticated targeting"
          preservation: "Mass market understanding; democratic approach"
          opportunity_cost: "Could have targeted wealthy consumers exclusively"
          quote: "We must remember that the people we reach are of all degrees of intelligence. Some are shrewd, others are confiding. But all are human beings with human interests."
          justification: "Consistently focused on mass market, not elite"
          consequences: "Built campaigns that reached millions"
          source: "My Life in Advertising"
          source_type: "document"

      triangulation:
        words: "Poverty origin story; simple language advocacy; anti-elite statements"
        actions: "Simple copy style; modest living; mass market focus"
        consequences_accepted: "Lower literary prestige; dismissed by sophisticates"
        alignment: 0.85

      language:
        keywords: ["common", "simple", "plain", "ordinary", "people"]
        metaphors: []
        emotional_tone: "Warm toward common people; dismissive of sophisticates"
        frequency: "Origin story told repeatedly; writing style consistent"

      extreme_test:
        limit_situation: "Maintained simple living despite massive wealth"
        would_die_for: false
        violations_count: 1
        violations_contexts: ["Some patent medicine campaigns could be seen as exploiting vulnerable populations"]

      tensions:
        conflicts_with_values: ["Social prestige", "Literary recognition"]
        conflicts_with_people: ["Sophisticated advertising establishment"]
        recurring_cost: "Dismissed by literary and elite circles"
        unresolved_tensions: []

      origin:
        formative_event: "Poverty upbringing; working class childhood"
        formative_event_date: "0-18"
        influence_person: "Family and community"
        influence_philosophy: "Democratic ideals; anti-elitism"
        crystallization_age: 18
        evolution: "Consistent from childhood; never lost connection to origins"

    - rank: 7
      name: "Systematization Over Genius"
      description: |
        Hopkins believed success came from systems and methods, not talent or genius.
        He built repeatable processes and infrastructure to enforce principles.
        He credited his system, not himself, for success. This democratized success -
        anyone could succeed with the right methods.
      intensity: 8
      immutability: "rare_exceptions"

      evidences:
        - evidence_id: 1
          date: "Entire career"
          context: "Self-presentation and teaching"
          sacrifice: "Personal credit; genius narrative"
          preservation: "System credit; method narrative"
          opportunity_cost: "Could have claimed unique talent"
          quote: "I have little genius, and I suppose I might say less education."
          justification: "Consistently attributed success to methods, not talent"
          consequences: "Made principles seem accessible to anyone"
          source: "My Life in Advertising, introduction"
          source_type: "document"

        - evidence_id: 2
          date: "Throughout career"
          context: "Building measurement infrastructure"
          sacrifice: "Ad-hoc intuitive approaches"
          preservation: "Systematic tracking and testing"
          opportunity_cost: "Time and resources building systems"
          quote: "Almost any question can be answered by a test campaign."
          justification: "Built coupon tracking, split-test methodology into systems"
          consequences: "Systems worked even without Hopkins personally"
          source: "Scientific Advertising"
          source_type: "document"

        - evidence_id: 3
          date: "Late career"
          context: "Writing books to codify principles"
          sacrifice: "Keeping secrets; maintaining advantage"
          preservation: "Teaching others; democratizing success"
          opportunity_cost: "Gave away competitive advantages"
          quote: "These are principles which I have been testing for forty years."
          justification: "Wrote Scientific Advertising to share methods"
          consequences: "Created entire industry of followers"
          source: "Scientific Advertising, preface"
          source_type: "document"

      triangulation:
