      quote: "95 percent of the reasons prospects buy involve a subconscious decision"

  - framework_id: fw_05
    name: "Strategic Honesty (Trust Architecture)"
    type: credibility_building
    tier: CORE

    description:
      summary: |
        Admitting product flaws paradoxically builds more trust than claiming
        perfection. When you're honest about weaknesses, claims about strengths
        become credible. Vulnerability is a power move, not a weakness.

      when_to_use:
        - "Products with obvious or known flaws"
        - "Skeptical or sophisticated audiences"
        - "Competitive markets where trust is scarce"
        - "High-ticket purchases requiring confidence"
        - "Personal branding and introductions"

      when_not_to_use:
        - "When flaw is a dealbreaker (no pivot possible)"
        - "When audience doesn't value authenticity"
        - "When competitor can immediately counter"

    cross_domain_validation:
      original_domain: "Product Advertising"
      validated_domains:
        - domain: "Personal Branding"
          works: true
          example: "Leading with 'biggest failure' in interviews"
        - domain: "Leadership"
          works: true
          example: "Admitting mistakes increases leader credibility"
        - domain: "Negotiations"
          works: true
          example: "Acknowledging weaknesses before they're discovered"
        - domain: "Relationships"
          works: true
          example: "Vulnerability creates deeper trust"

      boundary_conditions:
        - "Only works if flaw can be reframed or contextualized"
        - "Must have genuine strength to pivot to"
        - "Timing matters - honesty first, not after being caught"

    first_principles:
      core_axioms:
        - "Perfect claims trigger skepticism"
        - "Honesty about flaws signals integrity"
        - "Credibility transfers from honest claims to all claims"
        - "Vulnerability when voluntary is strength, not weakness"

      necessary_conditions:
        - "Must have genuine flaw to admit (not invented)"
        - "Must have genuine strength to pivot to"
        - "Flaw must be stated before strengths"

      inversion_insights:
        failure_mode: "Admitting fatal flaw with no pivot"
        critical_dependency: "Must have compelling pivot point"
        false_assumption: "That all honesty is equally effective"

    latticework_connections:
