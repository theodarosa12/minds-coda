  - framework_id: fw_04
    name: "Emotional Purchase / Logical Justification"
    type: decision_psychology
    tier: CORE

    description:
      summary: |
        People buy emotionally (95% subconscious) then justify with logic.
        Effective selling must address both: lead with emotional triggers
        and stories, then provide rational ammunition for the buyer to
        defend their decision to themselves and others.

      when_to_use:
        - "Any B2C selling situation"
        - "High-ticket items requiring justification"
        - "Products with strong experiential value"
        - "Any situation where buyer needs to justify purchase"

      when_not_to_use:
        - "Purely commoditized purchases (price-only decisions)"
        - "B2B technical procurement with explicit criteria"

    cross_domain_validation:
      original_domain: "Consumer Products"
      validated_domains:
        - domain: "Real Estate"
          works: true
          example: "Emotional vision of life there + rational investment analysis"
        - domain: "Career Decisions"
          works: true
          example: "Emotional fit + rational salary/growth analysis"
        - domain: "B2B Sales"
          works: partially
          example: "Still emotional but requires more logical scaffolding"

      boundary_conditions:
        - "B2B may invert: logic first, then emotional comfort"
        - "Low-cost impulse purchases may skip logical phase"
        - "Highly regulated purchases may require more logic"

    first_principles:
      core_axioms:
        - "Humans are emotional beings who rationalize"
        - "Buying is a fundamentally emotional act"
        - "Logic serves to justify, not to decide"
        - "Both elements required for purchase completion"

      necessary_conditions:
        - "Emotional hook must precede logical support"
        - "Logical support must be genuine and specific"
        - "Both must align with product truth"

      inversion_insights:
        failure_mode: "Leading with logic, burying emotion"
        critical_dependency: "Emotional resonance must happen first"
        false_assumption: "That logic can override negative emotion"

    latticework_connections:
