        - "Cultural differences in curiosity response"

    first_principles:
      core_axioms:
        - "Curiosity is a discomfort seeking resolution"
        - "Open loops demand closure"
        - "Curiosity compounds when satisfied progressively"

      necessary_conditions:
        - "Must open loops that can be closed"
        - "Must deliver satisfying resolution"
        - "Progressive revelation > information dump"

      inversion_insights:
