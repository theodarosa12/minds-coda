        teachable, repeatable methodology.

      when_to_use:
        - "Any persuasive communication"
        - "Sales copy, marketing messages"
        - "Negotiation and influence situations"
        - "Product positioning and messaging"

      when_not_to_use:
        - "When manipulation would damage long-term relationship"
        - "Purely informational communication"
        - "When audience has explicit anti-manipulation filters"

    cross_domain_validation:
      original_domain: "Direct Response Marketing"
      validated_domains:
        - domain: "Retail Sales"
          works: true
          example: "Scarcity, social proof, authority in store design"
        - domain: "Negotiations"
          works: true
          example: "Reciprocity, commitment, contrast principles"
        - domain: "Leadership"
          works: partially
          example: "Works for influence, not for long-term trust"
        - domain: "Education"
          works: partially
          example: "Curiosity, storytelling work; urgency less applicable"

      boundary_conditions:
        - "Effectiveness varies by audience sophistication"
        - "Some triggers (scarcity, urgency) can backfire if overused"
        - "Cultural differences affect trigger effectiveness"

    first_principles:
      core_axioms:
        - "95% of decisions are subconscious (emotional)"
        - "Logic justifies what emotion decides"
        - "Humans have predictable psychological patterns"
        - "These patterns can be ethically leveraged"

      necessary_conditions:
        - "Understanding of specific audience"
        - "Authentic application (not manipulative)"
        - "Multiple triggers working together"

      inversion_insights:
        failure_mode: "Using triggers that conflict with product truth"
        critical_dependency: "Product must actually deliver on trigger promises"
        false_assumption: "That all triggers work equally on all audiences"

    latticework_connections:
