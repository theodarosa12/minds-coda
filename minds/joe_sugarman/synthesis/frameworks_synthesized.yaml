      explanation_power: HIGH
      action_guidance: HIGH
      error_prevention: MEDIUM

    evidence:
      sources: 3
      reference: "Seeds of curiosity - planted and grown"

  - framework_id: fw_10
    name: "Mystery Preservation"
    type: conversion_strategy
    tier: DOMAIN

    description:
      summary: |
        Maintain mystery about the EXPERIENCE to force purchase decision.
        Be honest about CLAIMS and specifications, but withhold what it
        FEELS like. Let curiosity about the experience drive action.

      when_to_use:
        - "Experiential products"
        - "Products where experience IS the selling point"
        - "When 'try before buy' would satisfy curiosity without purchase"

      when_not_to_use:
        - "Commoditized products"
        - "Technical products judged on specs"
        - "When demos are expected/required"

    cross_domain_validation:
      original_domain: "Consumer Products"
      validated_domains:
        - domain: "Entertainment"
          works: true
          example: "Movie trailers tease but don't reveal"
        - domain: "Travel"
          works: true
          example: "Destination marketing shows but doesn't replicate"
        - domain: "Food"
          works: partially
          example: "Samples can reduce mystery but also convert"

      boundary_conditions:
        - "Only works for experiential products"
        - "Must have compelling experience to protect"
        - "Can't be used with commodities"

    first_principles:
      core_axioms:
        - "Experience cannot be fully conveyed in description"
        - "Curiosity about experience drives purchase"
        - "Satisfied curiosity reduces purchase motivation"

      necessary_conditions:
        - "Product has genuinely compelling experience"
        - "Experience is worth protecting"
        - "Alternative (description) can't replicate experience"

      inversion_insights:
        failure_mode: "Revealing experience eliminates purchase need"
        critical_dependency: "Experience must be worth the mystery"
        false_assumption: "That full transparency is always best"

    latticework_connections:
      complements:
        - "fw_09: Curiosity Engine - Mystery fuels curiosity"
      contradicts:
        - "fw_05: Strategic Honesty - APPEARS to conflict but resolved by domain"
        - resolution: "Honest about CLAIMS, mysterious about EXPERIENCE"
      prerequisites: []
      enhances:
        - "fw_09: Curiosity Engine - Protects the curiosity"

    usability:
      prediction_power: MEDIUM
      explanation_power: HIGH
      action_guidance: MEDIUM
      error_prevention: MEDIUM

    evidence:
      sources: 2
      example: "Never showed BluBlocker lens view on camera - customers had to buy to experience"

  - framework_id: fw_12
    name: "Storytelling Architecture"
    type: engagement_structure
    tier: DOMAIN

    description:
      summary: |
        Stories create emotional hooks that facts cannot. People get hooked
        when told compelling stories. Every product has an origin story,
        every lesson has a narrative. Stories are the vehicle for all
        other frameworks.

      when_to_use:
        - "Any persuasive communication"
        - "Making abstract concepts concrete"
        - "Creating emotional connection"
        - "Making content memorable"

      when_not_to_use:
        - "Pure data presentation"
        - "Technical specifications"
        - "When brevity is paramount"

    cross_domain_validation:
      original_domain: "Sales Copy"
      validated_domains:
        - domain: "Leadership"
          works: true
          example: "Vision stories, origin stories"
        - domain: "Education"
          works: true
          example: "Case studies, examples"
        - domain: "Journalism"
          works: true
          example: "Narrative journalism"

      boundary_conditions:
        - "Stories must be relevant to audience"
        - "Must support (not replace) key message"
        - "Can't be forced where inappropriate"

    first_principles:
      core_axioms:
        - "Humans are wired for narrative"
        - "Stories create emotional resonance"
        - "Concrete stories > abstract facts"
        - "Stories are remembered; facts are forgotten"

      necessary_conditions:
        - "Story must be relevant"
        - "Must connect to desired outcome"
        - "Must be authentic (or clearly parable)"

      inversion_insights:
        failure_mode: "Stories that don't connect to message"
        critical_dependency: "Story must serve the point"
        false_assumption: "That any story is better than no story"

    latticework_connections:
      complements:
        - "fw_04: Emotional Purchase - Stories create emotion"
        - "fw_05: Strategic Honesty - Honest stories most compelling"
      contradicts: []
      prerequisites: []
      enhances:
        - "fw_01: Slippery Slide - Stories provide momentum"
        - "fw_04: Emotional Purchase - Stories access emotion"

    usability:
      prediction_power: MEDIUM
      explanation_power: HIGH
      action_guidance: HIGH
      error_prevention: MEDIUM

    evidence:
      sources: 4
      quote: "People get kind of hooked when told compelling stories"

