  - framework_id: fw_06
    name: "Simplification Architecture"
    type: decision_optimization
    tier: METHODOLOGY

    description:
      summary: |
        Reduce complexity to increase conversion. Single options consistently
        outperform multiple options. Make decisions so simple that people
        can say yes or no, not 'which one.'

      when_to_use:
        - "Product offers and pricing"
        - "Call-to-action design"
        - "Copy structure and messaging"
        - "Any decision point in customer journey"

      when_not_to_use:
        - "When legitimate customization is required"
        - "Enterprise sales requiring configuration"
        - "When variety is the product (e.g., buffet)"

    cross_domain_validation:
      original_domain: "Product Offers"
      validated_domains:
        - domain: "UX Design"
          works: true
          example: "Fewer options = higher conversion (Hick's Law)"
        - domain: "Restaurant Menus"
          works: true
          example: "Paradox of choice - fewer items = more satisfaction"
        - domain: "Software"
          works: true
          example: "Feature reduction increases adoption"

      boundary_conditions:
        - "B2B may require more options for procurement"
        - "Some audiences expect/value choice"
        - "Premium positioning may require customization"

    first_principles:
      core_axioms:
        - "Decision fatigue is real and costly"
        - "Every choice is cognitive load"
        - "Simple decisions get made; complex ones get postponed"
        - "Binary choices (yes/no) have highest completion"

      necessary_conditions:
        - "Single option must be compelling"
        - "Must genuinely simplify (not hide complexity)"
        - "Must test single vs multiple"

      inversion_insights:
        failure_mode: "Offering many options to seem customer-friendly"
        critical_dependency: "The single option must be the right option"
        false_assumption: "That more choice equals better customer experience"

    latticework_connections:
      complements:
        - "fw_01: Slippery Slide - Simplicity reduces friction"
        - "fw_07: Volume Architecture - Test single vs multiple"
      contradicts: []
      prerequisites: []
