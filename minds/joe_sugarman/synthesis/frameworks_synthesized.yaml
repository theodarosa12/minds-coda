  - framework_id: fw_01
    name: "The Slippery Slide"
    type: momentum_architecture
    tier: CORE

    description:
      summary: |
        Every element in any communication exists solely to propel the reader
        to the next element. Like a playground slide, once momentum starts,
        it's nearly impossible to stop until the destination is reached.

      when_to_use:
        - "Any written persuasive communication"
        - "Sales pages, emails, landing pages"
        - "Video scripts and presentations"
        - "Any content requiring sustained attention"

      when_not_to_use:
        - "Reference documentation requiring scanning"
        - "When audience needs time to deliberate complex decisions"
        - "Educational content requiring reflection between concepts"

    cross_domain_validation:
      original_domain: "Print Advertising"
      validated_domains:
        - domain: "Video/Infomercials"
          works: true
          example: "BluBlocker: Hook → Celebrity → Demo → Testimonials → Offer"
        - domain: "Digital Marketing"
          works: true
          example: "Landing pages, email sequences"
        - domain: "Public Speaking"
          works: true
          example: "Presentation structure"
        - domain: "Storytelling"
          works: true
          example: "Narrative arc with compounding tension"

      boundary_conditions:
        - "Fails when audience is actively comparison shopping (needs scannable structure)"
        - "Less effective for highly technical/analytical decisions"
        - "Doesn't apply to reference materials"

    first_principles:
      core_axioms:
        - "Attention is borrowed, must be renewed each moment"
        - "Momentum compounds - each successful element lowers resistance to next"
        - "Energy required to stop exceeds energy to continue"
        - "Cognitive load of switching is higher than continuing"

      necessary_conditions:
        - "Strong opening that creates forward momentum"
        - "Each element must connect to the next (no dead ends)"
        - "Curiosity or value must build, not plateau"
        - "Clear destination (what reader is sliding toward)"

      inversion_insights:
        failure_mode: "Including ANY element that doesn't push forward"
        critical_dependency: "First sentence/element must work or slide never starts"
        false_assumption: "That readers will 'get back on track' if they stop"

    latticework_connections:
      complements:
        - "fw_02: First Sentence Primacy - First sentence is TOP of slide"
        - "fw_06: Simplification Architecture - Complexity creates friction"
        - "fw_09: Curiosity Engine - Curiosity creates slope"
      contradicts: []
      prerequisites:
        - "fw_02: Must understand first sentence before understanding slide"
      enhances:
        - "fw_03: Psychological Triggers - Triggers provide propulsion"
        - "fw_05: Strategic Honesty - Honesty removes friction"

    usability:
      prediction_power: HIGH
      explanation_power: VERY_HIGH
      action_guidance: HIGH
      error_prevention: HIGH

    evidence:
      sources: 8
      temporal_consistency: "50+ years"
      quote: "Once you're at the top of the slide and begin your descent, it's nearly impossible not to reach the bottom"

  - framework_id: fw_02
    name: "First Sentence Primacy"
    type: attention_architecture
    tier: CORE

    description:
      summary: |
        The first sentence is THE most important element in any written piece.
        Its sole purpose is to get the reader to read the second sentence.
        Everything else is secondary to this single function.

      when_to_use:
        - "ANY written communication requiring engagement"
        - "Headlines, email subject lines, opening paragraphs"
        - "Video hooks, presentation openings"
        - "Any situation where attention must be captured"

      when_not_to_use:
        - "Technical documentation where users know what they're looking for"
        - "Internal communications where attention is guaranteed"

    cross_domain_validation:
      original_domain: "Print Advertising"
      validated_domains:
        - domain: "Email Marketing"
          works: true
          example: "Subject line + opening line obsession"
        - domain: "Video Content"
          works: true
          example: "First 3-8 seconds determine retention"
        - domain: "Presentations"
          works: true
          example: "Opening determines whether audience pays attention"
        - domain: "Conversations"
          works: true
          example: "Opening statement frames entire interaction"

      boundary_conditions:
        - "Less critical when audience is already committed (e.g., paid course)"
        - "Context matters - 'first sentence' might be a headline or subject line"

    first_principles:
      core_axioms:
        - "Attention is the scarcest resource in communication"
        - "Permission to continue must be earned at each step"
        - "The first moment is the highest leverage point"
        - "Failure at the start makes success impossible"

      necessary_conditions:
        - "Sentence must be short and accessible"
        - "Must create intrigue or promise value"
        - "Must compel continuation, not completion"

      inversion_insights:
        failure_mode: "Starting with something that doesn't demand continuation"
        critical_dependency: "If first sentence fails, nothing else matters"
        false_assumption: "That readers will 'push through' a weak opening"

    latticework_connections:
      complements:
        - "fw_01: Slippery Slide - First sentence is entry point to slide"
        - "fw_09: Curiosity Engine - Curiosity is primary first-sentence tool"
      contradicts: []
      prerequisites: []
      enhances:
        - "fw_01: Slippery Slide - Strong start creates stronger momentum"

    usability:
      prediction_power: VERY_HIGH
      explanation_power: VERY_HIGH
      action_guidance: VERY_HIGH
      error_prevention: VERY_HIGH

    evidence:
      sources: 7
      temporal_consistency: "50+ years"
      quote: "The most important part of an ad is the first sentence"

