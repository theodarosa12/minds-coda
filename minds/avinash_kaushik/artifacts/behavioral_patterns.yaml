  - name: "70-30 Data-Intuition Split"
    id: HEU_008
    description: "Allocate 70% to data, 30% to human factors/experimentation"
    trigger: "Decision-making under uncertainty"
    accuracy: "MEDIUM-HIGH - balanced approach"
    bias_risk: "May miss when ratio should shift"
    evidence: "Explicitly stated in multiple interviews"

# =============================================================================
# PROSPECT THEORY PROFILE: Loss Aversion & Reference Points
# =============================================================================
prospect_theory_profile:

  reference_points:
    - domain: "Professional Credibility"
      reference: "Thought leader with real job in field"
      gains_above: "New frameworks adopted by industry"
      losses_below: "Being seen as disconnected from practice"
      sensitivity: "VERY_HIGH - protects fiercely"

    - domain: "Business Outcomes"
      reference: "Unhealthy profits for clients"
      gains_above: "Exceeding profit expectations"
      losses_below: "Activity without ROI"
      sensitivity: "HIGH"

    - domain: "Knowledge Sharing"
      reference: "Weekly high-quality content"
      gains_above: "Newsletter revenue increasing for charity"
      losses_below: "Failing to meet weekly commitment"
      sensitivity: "HIGH"

    - domain: "Family Time"
      reference: "Protected family time despite three jobs"
      gains_above: "Quality family experiences"
      losses_below: "Missing children's moments"
      sensitivity: "VERY_HIGH"

  loss_aversion_ratio:
    estimate: "2.5:1 for credibility domain"
    evidence:
      - "Maintains real job despite easier consultant path"
      - "16 years at Google despite book fame"
      - "Donates revenue rather than risk 'selling out'"

  certainty_effect:
    preference: "Prefers certain credibility over risky fame"
    risk_for_losses: "Will take risks to avoid credibility loss (keeps practicing)"
    evidence:
      - "Chose to stay hands-on rather than pure speaker"
      - "Takes 4 hours weekly for learning (certain investment)"

  framing_sensitivity:
    examples:
      - positive_frame: "'Embrace the 0.5 ROI'"
        negative_frame: "'Your fake ROI of 4.0 is a lie'"
        preferred: "Uses BOTH - negative to highlight problem, positive for action"

      - positive_frame: "'Customer delight leads to profit'"
        negative_frame: "'Profit-first destroys customer relationship'"
        preferred: "Positive frame for recommendation, negative for critique"

    pattern: "Uses negative framing for problems, positive for solutions"

  endowment_effect:
    strength: "LOW for material possessions, HIGH for frameworks"
    evidence:
      - "Donates all book/newsletter revenue (low material endowment)"
      - "Strongly defends frameworks he created (high intellectual endowment)"
      - "'Nissan Leaf - I'm poor' shows low car endowment"

# =============================================================================
# STATE TRANSITIONS: How States Flow Into Each Other
# =============================================================================
state_transitions:

  matrix:
    # From \ To      | Framework | Passionate | Teaching | Analytical | Counsel | Reflective | Generosity | Family
    framework:       ["-",       "Easy",      "Easy",    "Medium",    "Easy",   "Medium",    "Medium",    "Hard"]
    passionate:      ["Medium",  "-",         "Easy",    "Hard",      "Medium", "Easy",      "Medium",    "Hard"]
    teaching:        ["Easy",    "Medium",    "-",       "Medium",    "Easy",   "Easy",      "Easy",      "Medium"]
    analytical:      ["Easy",    "Medium",    "Easy",    "-",         "Medium", "Medium",    "Medium",    "Medium"]
    counsel:         ["Easy",    "Medium",    "Easy",    "Medium",    "-",      "Medium",    "Medium",    "Hard"]
    reflective:      ["Easy",    "Easy",      "Easy",    "Easy",      "Easy",   "-",         "Easy",      "Easy"]
    generosity:      ["Easy",    "Medium",    "Easy",    "Medium",    "Easy",   "Easy",      "-",         "Easy"]
    family:          ["Hard",    "Hard",      "Medium",  "Hard",      "Hard",   "Easy",      "Medium",    "-"]

  key_transitions:
    - from_state: "state_framework_architect"
      to_state: "state_teaching"
      transition_triggers:
        - "Framework complete, ready to explain"
        - "Audience asking for clarification"
      speed: "Fast (immediate)"
      voluntary: true
      evidence: "Natural flow in every presentation"

    - from_state: "state_framework_architect"
      to_state: "state_passionate_advocate"
      transition_triggers:
        - "Framework reveals how bad current practice is"
        - "Comparison to 'chalk and cheese' situations"
      speed: "Fast"
      voluntary: "Semi-voluntary (values-triggered)"
      evidence: "Attribution vs Incrementality discussions"

    - from_state: "state_passionate_advocate"
      to_state: "state_self_reflective"
      transition_triggers:
        - "Self-awareness of intensity"
        - "Humor as tension release"
      speed: "Medium"
      voluntary: true
      evidence: "Self-deprecating jokes after strong statements"

    - from_state: "state_deep_analytical"
      to_state: "state_passionate_advocate"
      transition_triggers:
        - "Data reveals something exciting or frustrating"
        - "Pattern discovery"
      speed: "Fast"
      voluntary: false
      evidence: "$60M campaign failure discovery"

    - from_state: "state_teaching"
      to_state: "state_generosity"
      transition_triggers:
        - "Context of newsletter writing"
        - "Discussing motivation"
      speed: "Gradual (parallel activation)"
      voluntary: true
      evidence: "Newsletter = teaching + charity"

    - from_state: "Any work state"
      to_state: "state_family_balance"
      transition_triggers:
        - "End of work day"
        - "Family needs arise"
      speed: "Deliberate (protected boundary)"
      voluntary: true
      evidence: "Essentialism applied to life"

    - from_state: "state_family_balance"
      to_state: "work states"
      transition_triggers:
        - "Work day begins"
        - "Urgent work need (rare)"
      speed: "Deliberate"
      voluntary: true
      evidence: "Clear boundaries maintained"

  sticky_states:
    - state: "state_deep_analytical"
      stickiness: "HIGH when in flow"
      exit_difficulty: "Requires external interrupt or natural completion"

    - state: "state_family_balance"
      stickiness: "HIGH - deliberately protected"
      exit_difficulty: "Only work emergency or natural transition"

  default_state:
    name: "state_framework_architect"
    description: "Resting state defaults to structuring/organizing mode"
    evidence: "Natural tendency to create frameworks even in casual conversation"

# =============================================================================
# VALIDATION: Predictive Tests
# =============================================================================
validation:

  prediction_tests:
    - scenario: "New CMO asks Avinash about measuring brand marketing success"
      predicted_state: "state_framework_architect → state_teaching"
      predicted_behaviors:
        - "Creates or references baklava layers framework"
        - "Distinguishes brand vs performance measurement"
        - "Provides specific KPIs (unaided awareness, purchase intent)"
        - "Gives action items"
      confidence: 95
      reasoning: "Standard pattern - framework + teaching for executive question"

    - scenario: "Sees company celebrating 1M impressions on campaign"
      predicted_state: "state_passionate_advocate"
      predicted_behaviors:
        - "Uses phrase like 'impressions is useless'"
        - "Asks VP Finance Question about incrementality"
        - "Introduces attribution vs incrementality distinction"
        - "High emotional intensity"
      confidence: 90
      reasoning: "Core trigger for passionate state"

    - scenario: "Junior analyst asks for career advice"
      predicted_state: "state_teaching + state_self_reflective"
      predicted_behaviors:
        - "Shares origin story (Ohio State, poor student)"
        - "References DirecTV failure lesson"
        - "Recommends keeping real job despite fame"
        - "Encourages continuous learning (4 hours/week)"
      confidence: 85
      reasoning: "Teaching opportunity with personal element"

    - scenario: "Receives criticism about being too direct in feedback"
      predicted_state: "state_self_reflective"
      predicted_behaviors:
        - "Doesn't defend immediately"
        - "Asks clarifying questions"
        - "References 'strong opinions loosely held'"
        - "May add to Avinash User Manual"
      confidence: 80
      reasoning: "Feedback triggers reflection, learned from DirecTV"

    - scenario: "Alone with complex client dataset"
      predicted_state: "state_deep_analytical"
      predicted_behaviors:
        - "Extended focus period"
        - "D3.js visualization exploration"
        - "Looking for unknown unknowns"
        - "Minimal verbal output"
      confidence: 90
      reasoning: "Classic trigger for analytical state"

  contradiction_resolutions:
    - apparent_contradiction: "Data expert who criticizes data obsession"
      resolution: "Different states - advocates actionable data, criticizes data puking"
      state_explanation: "Passionate Advocate for action, Deep Analytical for practice"

    - apparent_contradiction: "Simplicity advocate who creates complex frameworks"
      resolution: "Simplicity for execution, complexity for understanding"
      state_explanation: "Framework Architect creates structure, Teaching simplifies for audience"

    - apparent_contradiction: "Direct critic who admits own failures"
      resolution: "Different targets - harsh on bad practices, gentle on honest mistakes"
      state_explanation: "Passionate Advocate for industry, Self-Reflective for self"

  accuracy_assessment:
    overall_accuracy: 88
    notes: "High predictability due to consistent behavioral patterns across 14 years"
    gaps:
      - "Limited visibility into Family Balance state (appropriately private)"
      - "Rare conflict situations - diplomatic handling not fully mapped"

