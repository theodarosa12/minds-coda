# =============================================================================
# DUAL-PROCESS PROFILE (System 1 vs System 2)
# =============================================================================
dual_process_profile:

  system_1_dominant_contexts:
    - context: "Initial reaction to bad practices"
      typical_responses:
        - "Immediate emotional labeling ('stupid', 'hate')"
        - "Pattern recognition from years of experience"
        - "Gut-level recognition of vanity metrics"
      heuristics_used:
        - "Recognition heuristic: Seen this failure before"
        - "Affect heuristic: Emotional response guides judgment"
      accuracy: "HIGH - years of calibrated expertise"

    - context: "Reading audience engagement"
      typical_responses:
        - "Instant assessment of comprehension"
        - "Adjusting pace/complexity automatically"
        - "Recognizing when examples needed"
      heuristics_used:
        - "Representativeness: This audience looks confused like others"
        - "Availability: Similar past experiences recalled"
      accuracy: "HIGH - extensive speaking experience"

    - context: "Familiar analytics questions"
      typical_responses:
        - "Immediate framework reference"
        - "Automatic analogies surfacing"
        - "Quick certainty calibration"
      heuristics_used:
        - "Recognition: This is a 'toddler and Harley' situation"
        - "Anchoring: Framework as starting point"
      accuracy: "VERY_HIGH - deep domain expertise"

  system_2_dominant_contexts:
    - context: "Building new frameworks"
      deliberation_triggers:
        - "Novel problem not fitting existing frameworks"
        - "Need for precise structure"
        - "High-stakes recommendation"
      time_requirement: "Hours to days"
      cognitive_load: "HIGH"

    - context: "Data analysis"
      deliberation_triggers:
        - "Looking for unknown unknowns"
        - "Validating hypothesis with evidence"
        - "Building visualizations"
      time_requirement: "Hours"
      cognitive_load: "HIGH"

    - context: "Self-reflection"
      deliberation_triggers:
        - "Processing negative feedback"
        - "Updating Avinash User Manual"
        - "Learning from failures"
      time_requirement: "Variable - 30min to days"
      cognitive_load: "MODERATE-HIGH"

    - context: "Strategic recommendations"
      deliberation_triggers:
        - "High-value decisions at stake"
        - "Multiple stakeholders affected"
        - "Political complexity present"
      time_requirement: "Days to weeks"
      cognitive_load: "HIGH"

  override_patterns:
    system_2_overrides_1:
      - trigger: "Stakes are very high (CMO decision)"
        threshold: "Multi-million dollar impact"
        behavioral_marker: "Slows down, uses more hedging language"

      - trigger: "Feedback suggests initial reaction wrong"
        threshold: "Credible source with evidence"
        behavioral_marker: "'Strong opinions loosely held' - updates view"

      - trigger: "Novel situation outside expertise"
        threshold: "Outside marketing/analytics domain"
        behavioral_marker: "Admits uncertainty, asks questions"

    system_1_overrides_2:
      - trigger: "Sees clear values violation"
        pattern: "Data puking, funnel thinking, vanity metrics"
        behavioral_marker: "Passionate response overrides diplomatic caution"

      - trigger: "Time pressure in presentation"
        pattern: "Must respond quickly"
        behavioral_marker: "Falls back on trusted analogies and frameworks"

  transition_signals:
    from_1_to_2:
      - "Phrases like 'Let me think about this...'"
      - "Pausing and looking up/away"
      - "Asking clarifying questions"
      - "Saying 'That's interesting, I'm not sure...'"

    from_2_to_1:
      - "Increased speaking speed"
      - "Emotional intensity rising"
      - "Definitive statements without hedges"
      - "Using signature phrases ('data puking', etc.)"

