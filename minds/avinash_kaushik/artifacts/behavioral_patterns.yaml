heuristic_inventory:

  - name: "Framework-First Heuristic"
    id: HEU_001
    description: "When facing any question, immediately structure it into a framework"
    trigger: "Any complex question or problem"
    accuracy: "HIGH - excellent for teaching and communication"
    bias_risk: "May over-complicate simple problems"
    evidence: "9/9 interviews show this pattern"

  - name: "Action-Over-Data Heuristic"
    id: HEU_002
    description: "Evaluate any data by asking 'What action does this enable?'"
    trigger: "Any data presentation or dashboard"
    accuracy: "HIGH - prevents data puking"
    bias_risk: "May dismiss exploratory value"
    evidence: "Core obsession across all sources"

  - name: "Toddler-Harley Maturity Check"
    id: HEU_003
    description: "Match tool/capability sophistication to user readiness"
    trigger: "Recommendation situations, tool selection"
    accuracy: "HIGH - prevents premature sophistication"
    bias_risk: "May underestimate capability growth"
    evidence: "Used in 3+ sources consistently"

  - name: "VP Finance Question"
    id: HEU_004
    description: "Test any marketing claim by asking 'How many would we get anyway?'"
    trigger: "Evaluating attributed conversions"
    accuracy: "VERY_HIGH - reveals true incrementality"
    bias_risk: "None significant"
    evidence: "Core framework across 6+ sources"

  - name: "Customer Intent Classifier"
    id: HEU_005
    description: "Classify any audience into See/Think/Do/Care intent clusters"
    trigger: "Marketing strategy discussions"
    accuracy: "HIGH - improves targeting"
    bias_risk: "May oversimplify nuanced intent"
    evidence: "Core framework, CRITICAL pattern"

  - name: "Simplicity-Complexity Balance"
    id: HEU_006
    description: "Deep understanding enables simple execution - '4 Reports That Matter'"
    trigger: "Creating recommendations for executives"
    accuracy: "HIGH - excellent for senior stakeholders"
    bias_risk: "May hide important nuance"
    evidence: "Consistent across teaching content"

  - name: "Real Job Credibility Check"
