        Immediately structures information into numbered lists, ladders, matrices.
        This is the DOMINANT state - Avinash spends majority of professional time here.

      behavioral_markers:
        - "Creates numbered frameworks on the spot (3-step, 5-step, 9-step)"
        - "Draws on whiteboard/visualizes structure"
        - "Uses phrases like 'Let me break this down into...'"
        - "Names the framework with memorable titles"
        - "Connects new framework to existing ones"

      cognitive_characteristics:
        system_dominance: "System 2"
        attention_pattern: "Focused - Pattern Recognition"
        decision_style: "Deliberate - Structuring before answering"
        thinking_mode: "Analytical with creative naming"

      emotional_tone:
        - "Intellectual excitement"
        - "Teaching satisfaction"
        - "Clarity-seeking"

      triggers:
        environmental:
          - "Whiteboard or presentation setting"
          - "Complex question from audience"
          - "Client meeting discussing strategy"
          - "Newsletter writing session"
        internal:
          - "Encountering fuzzy thinking"
          - "Detecting patterns across data"
          - "Need to teach/explain something"
        social:
          - "CMO/CEO asking for guidance"
          - "Conference keynote delivery"
          - "Podcast interview questions"
        task:
          - "Strategic marketing problems"
          - "Attribution/measurement questions"
          - "Explaining complex analytics"

      duration:
        minimum: "30 minutes"
        typical: "2-4 hours"
        maximum: "Full work session (8+ hours)"

      exit_conditions:
        - "Framework complete and communicated"
        - "Interruption requiring different state"
        - "Transition to Teaching Mode to explain framework"
        - "Physical fatigue"

      evidence:
        - source: "677-digital-analytics-with-avinash-kaushik.md"
          quote: "I've created these two Frameworks for AI... the first framework is AI as what... the second framework is the AI activation framework"
        - source: "interview_patterns.yaml"
          observation: "9/9 interviews show numbered frameworks"
        - source: "pattern_database.yaml"
          reference: "COG_001 Framework-First Thinking - 95% triangulation"

