        duration: "Daily protected time"
        optional: false
      - activity: "Time with wife"
        duration: "Daily protected time"
        optional: false
      - activity: "Boundary enforcement against work"
        duration: "Continuous"
        optional: false

    state_priming:
      target_state: "state_family_balance"
      priming_mechanism: |
        Essentialism philosophy applied to relationships.
        Deliberate choice to have "only X number of friends."
        Work expansion constrained by family commitments.
      success_rate: "high (requires deliberate effort)"

    purpose:
      primary: "Be present for children"
      secondary: "Be good partner to wife"
      tertiary: "Maintain personal fulfillment"
      evidence: |
