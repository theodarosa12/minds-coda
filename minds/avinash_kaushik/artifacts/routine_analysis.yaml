      - "Shift is usually smooth"
    interference_patterns:
      - "Time pressure forces analytical shortcuts"
      - "Creative deadlines interrupt analytical flow"
      - "Meeting interruptions break both states"

  unique_pattern:
    description: |
      Avinash's cognitive modes are unusually integrated:
      - Analytical discovery → Creative framework → Teaching explanation
      This flow is his dominant professional pattern.
      The 4-hour weekly learning block feeds the analytical reservoir.
      Real client work triggers the creative framework impulse.
      Newsletter writing channels both into teaching.

