        - "Deliberate presence"
        - "Boundary enforcement"
      time_required: "Variable but protected"

# =============================================================================
# III. STRESS IMMUNITY ROUTINES
# =============================================================================

stress_immunity:

  philosophy:
    description: |
      Avinash's stress immunity comes from:
      1. Essentialism - knowing what matters
      2. External motivation - charity donations reduce ego pressure
      3. Strong opinions loosely held - flexibility reduces cognitive load
      4. Feedback loops - prevents blind spots from creating stress

  early_warning_recognition:
    signals:
      - "Repeated explanations of same concept (triggers newsletter topic)"
      - "Client frustration patterns"
      - "Time compression on protected activities"
    typical_timing: "When work encroaches on essentials"

  coping_routines:
    - routine: "Convert frustration to content"
      triggers:
        - "Repeated client misunderstandings"
        - "Seeing bad practices repeatedly"
      effectiveness: "high"
      mechanism: |
        Rather than staying frustrated, channels energy into creating
        frameworks/content that addresses the root issue.
        Example: "This week is simply the blog post about the baklava of brand measurement
        because I've met a bunch of CMOs over the last three weeks and I keep running into the same challenge."
      recovery_time: "Immediate (productive redirection)"

    - routine: "Self-deprecating humor"
      triggers:
        - "High intensity situations"
        - "After passionate statements"
      effectiveness: "high"
      mechanism: |
        Humor releases tension from strong opinions.
        Example: "I have a Nissan Leaf. I'm poor."
        Prevents ego rigidity, maintains approachability.
      recovery_time: "Immediate"

    - routine: "Data as arbiter"
      triggers:
        - "Uncertainty about direction"
        - "Disagreement with stakeholders"
      effectiveness: "high"
      mechanism: |
        "Strong opinions loosely held" + "70-80% data influenced"
        Data provides objective ground, reducing interpersonal stress.
      recovery_time: "Time to gather evidence"

  recovery_rituals:
    - ritual: "Weekly learning block"
      states_restored:
        - state_deep_analytical
        - state_framework_architect
      required_conditions:
        - "4 hours protected"
        - "No deliverables expected"
      evidence: "Exploration without pressure restores cognitive resources"

    - ritual: "Family time"
      states_restored:
        - state_family_balance
        - "General restoration"
      required_conditions:
        - "Protected from work intrusion"
        - "Present attention"

  failure_modes:
    - when: "Protected time repeatedly violated"
      breakdown_pattern: "Essentialism philosophy fails, overwhelm begins"
      consequence: "Quality degradation, relationship strain"

    - when: "External validation replaces internal motivation"
      breakdown_pattern: "Newsletter becomes obligation vs passion"
      consequence: "Content quality suffers"
      mitigation: "Charity motivation maintains external pressure structure"

