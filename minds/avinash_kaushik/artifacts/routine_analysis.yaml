# =============================================================================
# II. STATE-PRIMING ROUTINES
# =============================================================================
# How specific routines prime particular behavioral states

state_priming_routines:

  # -------------------------------------------------------------------------
  # ROUTINE 1: Weekly Learning Block
  # -------------------------------------------------------------------------
  - routine_name: "Weekly Learning Block"
    id: ROUTINE_001
    timing: "4 hours/week (protected)"

    activities:
      - activity: "Learning new coding skills"
        duration: "Variable"
        optional: false
      - activity: "Exploring D3.js visualizations"
        duration: "Variable"
        optional: true
      - activity: "Experimenting with new tools"
        duration: "Variable"
        optional: true
      - activity: "Following interesting content"
        duration: "Variable"
        optional: true

    state_priming:
      target_state: "state_deep_analytical"
      secondary_states:
        - "state_framework_architect (when patterns emerge)"
      priming_mechanism: |
        Dedicated time signals to the mind: "This is exploration time."
        No deliverables expected. Pure learning.
        Removes pressure, enables curiosity.
      success_rate: "high"

    purpose:
      primary: "Maintain hands-on technical skills"
      secondary: "Enable imagination for leadership"
      evidence: |
        "If I'm a leader who does at least some amounts of real actual coding and work
        it means I can imagine possibilities for my large team to execute."

    disruption_analysis:
      when_disrupted: "Urgent work demands"
      consequence: "Loss of imagination capacity over time"
      recovery_time: "Next scheduled block"
      alternative_priming: "None stated - treated as non-negotiable"

    minimum_viable:
      essential_elements:
        - "4 hours protected"
        - "No deliverables expected"
        - "Learning focus (not production)"
      time_required: "4 hours minimum"

    evidence:
      - "677-digital-analytics-with-avinash-kaushik.md"
      - "make-better-decisions-with-avinash-kaushik.md"

  # -------------------------------------------------------------------------
  # ROUTINE 2: Newsletter Writing Ritual
  # -------------------------------------------------------------------------
  - routine_name: "Newsletter Writing Ritual"
    id: ROUTINE_002
    timing: "Weekly (specific day not stated)"

    activities:
      - activity: "Topic selection from real work"
        duration: "30 min - 1 hour"
        optional: false
        trigger: "Frustration with clients or repeated explanations"
      - activity: "Framework/visual design"
        duration: "1-2 hours"
        optional: false
      - activity: "Writing (~1500 words)"
        duration: "2-3 hours"
        optional: false
      - activity: "Review and polish"
        duration: "30 min - 1 hour"
        optional: true

    state_priming:
      target_state: "state_teaching + state_generosity (compound)"
      priming_mechanism: |
        Newsletter writing combines multiple state activations:
        1. Teaching impulse (sharing knowledge)
        2. Generosity state (charity motivation)
        3. Framework architect (structuring content)
        The charity component adds external motivation pressure.
      success_rate: "high"

    purpose:
      primary: "Share knowledge with community"
      secondary: "Convert passion into charitable giving"
      tertiary: "Process real work problems into frameworks"
      evidence: |
        "For me the source of ideas to write about is the real job I have."
        "Last year the revenue from the newsletter was 200,000... I donate it all to charity."

    disruption_analysis:
      when_disrupted: "Travel, major work demands"
      consequence: "Missed weekly commitment (high personal cost)"
      recovery_time: "Next week's cycle"
      alternative_priming: "Shorter newsletter (maintains commitment)"

    minimum_viable:
      essential_elements:
        - "Topic from real work"
        - "Structured framework"
        - "Published to subscribers"
      time_required: "3-4 hours minimum"

    evidence:
      - "677-digital-analytics-with-avinash-kaushik.md"

  # -------------------------------------------------------------------------
  # ROUTINE 3: Feedback Collection Ritual
  # -------------------------------------------------------------------------
  - routine_name: "Post-Meeting Feedback Request"
    id: ROUTINE_003
    timing: "After every significant meeting"

    activities:
      - activity: "Send quick note requesting feedback"
        duration: "2-5 minutes"
        optional: false
        template: "Could you tell me something that I did that was very effective and something that you wished I did that I did not?"

    state_priming:
      target_state: "state_self_reflective"
      priming_mechanism: |
        Systematic feedback collection keeps self-awareness active.
        Learned from Steve Bennett (former Intuit CEO).
        Prevents blind spots from calcifying.
      success_rate: "high"

    purpose:
      primary: "Continuous self-improvement"
      secondary: "More effective colleague/leader"
      evidence: |
        "I always ask people for feedback... I'll get done with the meeting and I'll send a quick note."
        "I have this thing I call the Avinash User Manual."

    disruption_analysis:
      when_disrupted: "Forgetting, time pressure"
      consequence: "Missed learning opportunity"
      recovery_time: "Immediate (next meeting)"
      alternative_priming: "Mental note, follow up later"

    minimum_viable:
      essential_elements:
        - "Ask two questions: effective + improvement"
        - "Written format (documented)"
      time_required: "2 minutes"

    origin:
      source: "Steve Bennett (Intuit CEO)"
      description: "He was like a really big feedback junkie"

  # -------------------------------------------------------------------------
  # ROUTINE 4: Real Job Maintenance
  # -------------------------------------------------------------------------
  - routine_name: "Real Job Maintenance"
    id: ROUTINE_004
    timing: "Continuous (career-long)"

    activities:
      - activity: "Maintain employment in field"
        duration: "Full-time commitment"
        optional: false
      - activity: "Write code at executive level"
        duration: "Variable"
        optional: false
      - activity: "Use tools directly (D3.js, R, Tableau)"
        duration: "Variable"
        optional: false

    state_priming:
      target_state: "state_deep_analytical + credibility maintenance"
      priming_mechanism: |
        Having a real job forces engagement with actual problems.
        Prevents becoming "disconnected from reality" like other authors.
        Maintains imagination capacity for leadership.
      success_rate: "high"

    purpose:
      primary: "Maintain credibility through practice"
      secondary: "Source of content for writing"
      tertiary: "Enable imagination for team leadership"
      evidence: |
        "I will always have a real job in the field that I am in."
        "Other authors around me rarely wrote second books or were completely disconnected
        from reality because they didn't have real jobs anymore."

    disruption_analysis:
      when_disrupted: "Not disrupted - deliberate life choice"
      consequence: "Credibility loss, imagination atrophy"
      recovery_time: "N/A"
      alternative_priming: "None - non-negotiable"

    minimum_viable:
      essential_elements:
        - "Employment in the field"
        - "Hands-on with tools"
        - "Working on real client problems"
      time_required: "Full-time career commitment"

    evidence:
      - "16 years at Google"
      - "CSO at Crowd currently"
