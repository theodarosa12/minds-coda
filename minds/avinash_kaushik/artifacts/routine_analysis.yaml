# Note: Avinash maintains deliberate privacy about personal routines.
# This analysis reconstructs patterns from public statements and behaviors.

daily_rhythm:

  philosophy:
    description: |
      Avinash practices ESSENTIALISM - making very deliberate choices about
      time allocation. With "three jobs" (CSO at Crowd, newsletter, teaching),
      he has systematized his routines to protect what matters most.
    evidence:
      - "I have three jobs. It's very important for me to figure out how to still make time for my family"
      - "Making very deliberate choices"
      - "Only X number of friends. Zero hours watching TV except my San Francisco Giants."

  morning:
    wake_time: "Early (inferred from productivity output)"
    first_hour:
      activities:
        - "Likely: Check urgent items"
        - "Likely: Mental framing for the day"
      states_primed:
        - state_framework_architect  # Default professional state
    pre_work:
      activities:
        - "Family time protection (high priority)"
        - "Transition ritual to work mode"
      states_primed:
        - state_family_balance  # Protected start
        - state_framework_architect  # Work transition

  work_periods:
    primary_block:
      time: "9-to-9 job reference suggests full days"
      typical_activities:
        - "Strategic meetings with CMOs/CEOs"
        - "Client strategy sessions"
        - "Framework development"
        - "Data analysis (when alone)"
      state_maintained: "state_framework_architect"
      evidence: "I always have a real job in the field that I am in"

    dedicated_learning_block:
      time: "4 hours/week (non-negotiable)"
      typical_activities:
        - "Learning new coding skills"
        - "Exploring D3.js visualizations"
        - "Following interesting content (e.g., chocolate blogger)"
        - "Experimenting with new tools"
      state_maintained: "state_deep_analytical"
      evidence: "Every single week I set aside four hours to learn something new"
      frequency: "Weekly, protected time"
      importance: CRITICAL

    newsletter_writing:
      time: "Weekly commitment"
      duration: "Several hours (produces ~1500 words)"
      typical_activities:
        - "Topic selection from real work problems"
        - "Framework design/visualization"
        - "Writing with passion"
        - "Quality assurance"
      states_maintained:
        - state_framework_architect  # During structuring
        - state_teaching  # During writing
        - state_generosity  # Knowing proceeds go to charity
      evidence: "Every newsletter takes a lot of time and effort"
      motivation: "Three charities receive all revenue (~$200K/year)"

  transitions:
