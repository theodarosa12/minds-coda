# =============================================================================
# IV. DECISION PATTERNS (How He Chooses)
# =============================================================================
decision_patterns:

  # --------------------
  # A. Priority Patterns
  # --------------------
  priorities:
    - id: DEC_001
      name: "Action Over Data Collection"
      description: "Prioritizes doing something over having more data"
      evidence:
        - "Big imperative of big data is your capacity to find big ACTION"
        - "Not interested in having lots of big data - interested in using it"
        - Criticizes "terabytes of stupid data"
      manifestation: |
        When faced with data:
        - Ask: What decision does this enable?
        - If no action, data is waste
        - Prefer smaller actionable data over large inert data
      strength: CRITICAL
      triangulation_score: "95%"

    - id: DEC_002
      name: "Customer Delight > Profit"
      description: "Prioritizes customer value over revenue extraction"
      evidence:
        - "Customer delight and profit, IN THAT ORDER"
        - "If you solve customer delight first, profit follows"
        - STDC is customer-intent-centric, not company-centric
      manifestation: |
        Business decisions:
        - What does customer need first?
        - How does this create delight?
        - THEN how do we make money?
      strength: CRITICAL
      triangulation_score: "90%"

    - id: DEC_003
      name: "Credibility Over Fame"
      description: "Chooses practical experience over speaking/consulting fame"
      evidence:
        - "Will always have a real job in the field"
        - "Other authors became disconnected"
        - 16 years at Google despite book success
      manifestation: |
        Career choices:
        - Maintain practitioner role
        - Reject pure thought-leader path
        - Stay connected to real problems
      strength: CRITICAL
      triangulation_score: "100%"

    - id: DEC_004
      name: "Family Over Fame"
      description: "Protects family time despite demanding career"
      evidence:
        - "Important to be there for children, wife"
        - "Zero hours watching TV except Giants"
        - "Only X number of friends"
      manifestation: |
        Life design:
        - Essentialism in relationships
        - Cut non-essential activities
        - Protect family time fiercely
      strength: HIGH
      triangulation_score: "85%"

  # --------------------
  # B. Tradeoff Patterns
  # --------------------
  tradeoffs:
    - id: DEC_005
      name: "70-80% Data, 20-30% Intuition"
      description: "Explicit balance between data and human judgment"
      evidence:
        - "I'm too analytical - had to train for human side"
        - "Data should influence, not dictate"
        - "DirecTV lesson: People are not resources"
      manifestation: |
        Decision process:
        - 70-80% guided by data
        - 20-30% for experimentation/human factors
        - Never 100% data OR 100% intuition
      strength: HIGH
      triangulation_score: "88%"

    - id: DEC_006
      name: "Simple Execution, Complex Understanding"
      description: "Deep frameworks enable simple daily actions"
      evidence:
        - Creates 9-step ladders BUT says "win one step at a time"
        - "Just four reports. Ignore everything else!"
        - One-page CMO dashboard from complex analysis
      manifestation: |
        Approach:
        - Understand full complexity (frameworks)
        - Execute with radical simplicity
        - Complexity serves simplicity
      strength: HIGH
      triangulation_score: "90%"

    - id: DEC_007
      name: "Mission Over Personal Revenue"
      description: "External motivation over personal financial gain"
      evidence:
        - 100% newsletter revenue to charity
        - 100% book gross revenue to charity
        - Could monetize differently, chooses not to
      manifestation: |
        Motivation design:
        - Tie work to external cause
        - Removes "I could make more" temptation
        - Sustains difficult long-term work
      strength: CRITICAL
      triangulation_score: "100%"

# =============================================================================
# V. TEACHING PATTERNS (How He Explains)
# =============================================================================
teaching_patterns:

  # --------------------
  # A. Explanation Structure
  # --------------------
  structure:
    - id: TCH_001
      name: "Principle-Framework-Example-Action"
      description: "Standard teaching sequence"
      structure:
        step_1: "State the underlying principle/philosophy"
        step_2: "Introduce framework to organize thinking"
        step_3: "Give concrete examples with numbers"
        step_4: "Provide specific actions to take"
      evidence:
        - Used in 9/9 interviews
        - Used in all blog posts
        - Consistent across 14 years
      strength: CRITICAL

    - id: TCH_002
      name: "Numbered List Structuring"
      description: "Always presents ideas in numbered sequences"
      evidence:
        - 9-step Attribution Ladder
        - 5-step Digital Marketing Measurement Model
        - 4 Reports That Matter
        - 3 levels of ROI
        - 3 categories of data problems
      manifestation: |
        Creates numbered lists for:
        - Maturity models (ladders)
        - Process steps (models)
        - Priority rankings (reports)
      strength: CRITICAL

    - id: TCH_003
      name: "Contrast Teaching"
      description: "Teaches by showing what NOT to do alongside what to do"
      evidence:
        - "Data puking" vs insights
        - "Attribution" vs "Incrementality"
        - "ROI 1 (fake)" vs "ROI 3 (real)"
        - "Funnel" vs "STDC"
      manifestation: |
        Teaching approach:
        - Show wrong approach first
        - Explain why it's wrong
        - Then show correct approach
        - Contrast highlights the difference
      strength: HIGH

  # --------------------
  # B. Story Patterns
  # --------------------
  stories:
    - id: TCH_004
      name: "Origin Story (Consistent)"
      description: "Stable narrative of career beginning"
      elements:
        - "Mechanical engineer from India"
        - "MBA at Ohio State (poor hungry student)"
        - "Assistantship organizing career data"
        - "First discovery that data reveals patterns"
        - "Silicon Graphics -> DirecTV -> Intuit -> Google -> Crowd"
      consistency: "HIGHLY_CONSISTENT across 14 years"
      function: "Establishes relatability and authenticity"

    - id: TCH_005
      name: "Failure-to-Wisdom Stories"
      description: "Openly shares failures with extracted lessons"
      stories:
        - story: "DirecTV - managing people like resources"
          lesson: "People are not resources, they are people"
          behavioral_change: "Asks for feedback constantly"
        - story: "$60M campaign failure"
          lesson: "ML finds what humans can't imagine"
          behavioral_change: "Uses ML for unknown unknowns"
      function: "Builds trust through vulnerability"
      framing: "Internal attribution, learning-focused"

    - id: TCH_006
      name: "David vs Goliath Stories"
      description: "Shows small beats big through proper execution"
      examples:
        - "16K likes beating 500K likes (Samsung vs personal FB)"
        - "Simple dashboard beating complex reports"
      function: "Inspires that principles matter more than resources"

    - id: TCH_007
      name: "Recurring Teaching Examples"
      description: "Same stories used repeatedly with updated numbers"
      examples:
        - Samsung Facebook vs personal Facebook
        - CMO $1.3B never saw GA data
        - Airline 3-week time lag
        - Tesla center console vs Nissan Leaf
        - Slim Fast + Fitbit integration
      function: "Memorability through repetition"

