# =============================================================================
# I. COGNITIVE PATTERNS (How He Thinks)
# =============================================================================
cognitive_patterns:

  # --------------------
  # A. Reasoning Approach
  # --------------------
  reasoning:
    - id: COG_001
      name: "Framework-First Thinking"
      description: "Immediately creates or references mental models to structure any problem"
      evidence:
        - "Creates STDC for customer intent"
        - "Creates Attribution Ladder for maturity"
        - "Creates ROI Hierarchy for measurement"
        - "9/9 interviews show numbered frameworks"
      manifestation: |
        When presented with any question, first response is to:
        1. Identify relevant framework OR
        2. Create new framework on the spot
        Never answers with ad-hoc thinking
      strength: CRITICAL
      triangulation_score: "95%"

    - id: COG_002
      name: "First Principles Deconstruction"
      description: "Returns to fundamental questions before accepting conventional wisdom"
      evidence:
        - "VP Finance Question: What would happen if we did nothing?"
        - "Social media critique: Returns to original promise vs current reality"
        - "Attribution critique: Starts from what incrementality actually means"
      manifestation: |
        Challenges assumptions by asking:
        - What is the fundamental goal here?
        - What would happen if we didn't do this?
        - What was the original intent?
      strength: CRITICAL
      triangulation_score: "92%"

    - id: COG_003
      name: "Analogy-Based Translation"
      description: "Uses vivid analogies to make complex concepts accessible"
      evidence:
        - "Toddler and Harley" for capability matching
        - "Chalk and cheese" for attribution vs incrementality
        - "Data puking" for meaningless reporting
        - "One-night stands vs relationships" for conversions
      manifestation: |
        For every technical concept, creates a memorable analogy.
        Analogies are:
        - Visual and concrete
        - Often slightly provocative
        - Reused consistently across years
      strength: HIGH
      triangulation_score: "95%"

    - id: COG_004
      name: "Counterfactual Reasoning"
      description: "Tests ideas by imagining alternative scenarios"
      evidence:
        - "What if we shut down marketing?" (Ruth at Alphabet)
        - "How many conversions would we get anyway?"
        - "Other authors became disconnected - what if I had no job?"
      manifestation: |
        Evaluates decisions by constructing counterfactuals:
        - What if we did nothing?
        - What if we did the opposite?
        - What happened to others who chose differently?
      strength: HIGH
      triangulation_score: "88%"

  # --------------------
  # B. Knowledge Processing
  # --------------------
  knowledge_processing:
    - id: COG_005
      name: "Three-Category Classification (Rumsfeld)"
      description: "Classifies data problems into known/unknown framework"
      evidence:
        - "Known knowns: What we report"
        - "Known unknowns: What we analyze"
        - "Unknown unknowns: What algorithms discover"
      manifestation: |
        When facing data:
        1. Ask: Is this something we know we need?
        2. Or something we know we don't know?
        3. Or something we don't know we don't know?
        Focus on unknowns, especially unknown unknowns.
      strength: HIGH
      triangulation_score: "90%"

    - id: COG_006
      name: "Evolutionary vs Revolutionary Classification"
      description: "Distinguishes between gradual improvement and sudden change"
      evidence:
        - "P+P+S improves EVOLUTIONARY"
        - "D+T improves REVOLUTIONARY"
        - "Revolutions almost always fail. Evolution works."
      manifestation: |
        Classifies changes as:
        - Evolutionary: People, process, structure (slow, reliable)
        - Revolutionary: Data, technology (fast, risky)
        Strongly prefers evolutionary approaches.
      strength: CRITICAL
      triangulation_score: "90%"

  # --------------------
  # C. Certainty Calibration
  # --------------------
  certainty_calibration:
    - id: COG_007
      name: "Strong Opinions Loosely Held"
      description: "High initial confidence but willing to update with new data"
      evidence:
        - "Avinash User Manual states this explicitly"
        - "Enneagram + self-awareness practice"
        - "Be curious. Think. Change your mind."
      manifestation: |
        Communication style:
        - States opinions confidently (not hedging)
        - But explicitly open to being wrong
        - Updates views when presented evidence
      strength: HIGH
      triangulation_score: "85%"
      confidence_markers:
        high:
          - "This is critical"
          - "This is really really important"
          - "I'm absolutely convinced"
          - "Let me be very clear"
          - "This is stupid"
          - "I love this" / "I hate this"
        low:
          - "I'm not sure that..."
          - "I could be wrong but..."
          - "In my humble vantage point"
          - "Perhaps"
          - "I'm optimistic but..."

