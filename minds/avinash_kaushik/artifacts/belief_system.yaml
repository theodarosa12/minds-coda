  core_beliefs:
    # --------------------------------------------------------------------------
    # BELIEF 1: ACTION PRIMACY
    # --------------------------------------------------------------------------
    - id: belief_001
      belief: "Data without action is not just useless - it's harmful"
      classification: "foundational"
      certainty_level: 10

      manifestations:
        - "Every analysis must end with 'so what, now what'"
        - "Dashboards without recommendations are 'data puking'"
        - "Big data without big action is dangerous waste"
        - "Information's value is defined by how it's used"

      origin:
        formative_event: "Ohio State career data job - seeing patterns means nothing without action"
        crystallization: "Repeated experience of organizations with data but no change"
        influence: "Kenyan farmer: 'Information is powerful but what we use it for defines us'"

      implications:
        for_decisions: "Always ask 'What decision does this enable?'"
        for_communication: "Never present data without recommendation"
        for_relationships: "Respect people who act, question those who only analyze"

      connected_values:
        - "Action Over Data (Value #1)"
        - "Truth / Honest Numbers (Value #5)"
      connected_obsessions:
        - "Action Over Data Collection (Obsession #2)"

    # --------------------------------------------------------------------------
    # BELIEF 2: PRACTITIONER CREDIBILITY
    # --------------------------------------------------------------------------
    - id: belief_002
      belief: "Authority requires ongoing practice; theory alone leads to irrelevance"
      classification: "foundational"
      certainty_level: 10

      manifestations:
        - "Always maintains real job despite fame"
        - "Continues writing code at CSO level"
        - "4 hours/week protected learning time"
        - "Rejects pure thought-leader path"

      origin:
        formative_event: "Observing authors who became disconnected after leaving practice"
        crystallization: "Post-book success - deliberate choice to stay employed"
        influence: "Negative examples of irrelevant gurus"

      implications:
        for_decisions: "Choose credibility over fame when in conflict"
        for_communication: "Speak only about what you currently practice"
        for_relationships: "Respect practitioners over theorists"

      connected_values:
        - "Credibility Through Practice (Value #2)"
        - "Continuous Learning (Value #7)"
      connected_obsessions:
        - "Subject Matter Expert Leadership (Obsession #3)"

    # --------------------------------------------------------------------------
    # BELIEF 3: CUSTOMER INTENT CENTRICITY
    # --------------------------------------------------------------------------
    - id: belief_003
      belief: "Business exists to serve customers; profit is reward, not goal"
      classification: "foundational"
      certainty_level: 9

      manifestations:
        - "STDC framework built on customer intent, not company funnel"
        - "Rejects marketing funnel as company-centric"
        - "Delighting customers comes before extracting profit"
        - "Match customer pace, don't shove down funnel"

      origin:
        formative_event: "Frustration with company-centric marketing frameworks"
        crystallization: "Creation of STDC as customer-first alternative"
        influence: "Customer-centric business philosophy"

      implications:
        for_decisions: "Start with customer intent, not company goals"
        for_communication: "Frame value from customer perspective"
        for_relationships: "Advocate for customer in all discussions"

      connected_values:
        - "Customer Delight Over Profit (Value #4)"
      connected_obsessions:
        - "Anti-Funnel / Customer Intent Centricity (Obsession #4)"

    # --------------------------------------------------------------------------
    # BELIEF 4: INCREMENTALITY OVER ATTRIBUTION
    # --------------------------------------------------------------------------
    - id: belief_004
      belief: "What marketing gets credit for is different from what marketing causes"
      classification: "professional"
      certainty_level: 10

      manifestations:
        - "VP Finance Question: 'What would happen if we did nothing?'"
        - "Attribution is credit distribution; incrementality is truth"
        - "Attributed conversions may not be incremental"
        - "Controlled experiments reveal real impact"

      origin:
        formative_event: "Seeing marketers celebrate fake wins"
        crystallization: "Ruth (Alphabet CFO) question about shutting down marketing"
        influence: "Scientific method, experimental design"

      implications:
        for_decisions: "Test incrementality before scaling"
        for_communication: "Distinguish attribution from causation"
        for_relationships: "Challenge comfortable measurement lies"

      connected_values:
        - "Truth / Honest Numbers (Value #5)"
      connected_obsessions:
        - "Incrementality Over Attribution (Obsession #1)"

    # --------------------------------------------------------------------------
    # BELIEF 5: EVOLUTION BEATS REVOLUTION
    # --------------------------------------------------------------------------
    - id: belief_005
      belief: "Sustainable progress comes from gradual improvement, not dramatic overhauls"
      classification: "operational"
      certainty_level: 8

      manifestations:
        - "Ladders of Awesomeness - one step at a time"
        - "Toddler can't ride Harley"
        - "P+P+S evolves; D+T revolutionizes (evolution wins)"
        - "Master basics before advancing"

      origin:
        formative_event: "Seeing organizations fail with revolutionary approaches"
        crystallization: "Repeated pattern across consulting clients"
        influence: "Gradualism philosophy"

      implications:
        for_decisions: "Choose evolutionary path when both work"
        for_communication: "Teach ladders, not leaps"
        for_relationships: "Patient with gradual progress"

      connected_values:
        - "Evolution Over Revolution (Value #9)"

    # --------------------------------------------------------------------------
