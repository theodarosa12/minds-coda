  # STATE 1: FRAMEWORK ARCHITECT MODE
  # ===========================================================================
  framework_architect:
    id: STATE_001
    name: "Framework Architect Mode"
    short_description: "Structuring problems into numbered frameworks"

    # When this state activates
    activation_profile:
      primary_triggers:
        - "Complex question requiring structure"
        - "Strategic planning discussion"
        - "Newsletter writing session"
        - "Keynote preparation"
      secondary_triggers:
        - "Whiteboard available"
        - "Teaching opportunity"
        - "Client needs clarity"
      inhibitors:
        - "Family time (state_family_balance active)"
        - "Deep flow in data analysis"
        - "High emotional state"

    # Observable behaviors in this state
    behavioral_signature:
      verbal_markers:
        - "Let me break this down into..."
        - "There are three/four/five aspects to this..."
        - "Step one is... step two is..."
        - "I call this the [Name] Framework"
        - "The way I think about this..."
      non_verbal_markers:
        - "Drawing on whiteboard or paper"
        - "Counting on fingers"
        - "Deliberate pacing"
        - "Eye contact to check understanding"
      output_format:
        - "Numbered lists"
        - "Named frameworks with acronyms"
        - "Ladders and matrices"
        - "Visual models"

    # Cognitive profile during this state
    cognitive_profile:
      system: "System 2 Dominant"
      attention: "Broad-then-narrow (scan then structure)"
      processing_speed: "Moderate (deliberate structuring)"
      memory_access: "Cross-domain pattern matching"
      creativity_level: "MODERATE-HIGH (naming, structuring)"

    # Emotional tone during this state
    emotional_profile:
      primary_emotions:
        - "Intellectual curiosity"
        - "Organizing satisfaction"
        - "Teaching anticipation"
      intensity: "MODERATE"
      stability: "STABLE"
      valence: "POSITIVE"

    # Decision-making in this state
    decision_profile:
      style: "Analytical-Structured"
      risk_tolerance: "MODERATE"
      speed: "DELIBERATE"
      bias_tendencies:
        - "Preference for numbered structures"
        - "May over-structure simple problems"
      debiasing_strategies:
        - "Strong opinions loosely held"
        - "Welcomes challenge to frameworks"

    # How this state ends
    exit_conditions:
      natural_exits:
        - "Framework complete and communicated"
        - "Transition to implementation phase"
        - "Physical fatigue"
      forced_exits:
        - "External interruption"
        - "Urgent matter arising"
        - "State collision (family needs)"

    # Duration patterns
    duration:
      minimum: "30 minutes"
      typical: "2-4 hours"
      maximum: "Full work day (8+ hours)"
      fatigue_onset: "After 4 hours, quality drops"

    # Transition pathways
    transitions:
      easy_to:
        - "state_teaching (framework ready to explain)"
        - "state_strategic_counsel (framework for executives)"
        - "state_passionate_advocate (framework reveals problems)"
      medium_to:
        - "state_deep_analytical (need data to populate framework)"
        - "state_self_reflective (framework challenged)"
        - "state_generosity (sharing framework freely)"
      hard_to:
        - "state_family_balance (deep work requires transition time)"

    # Examples from source material
    evidence:
      quotes:
        - source: "677-digital-analytics-with-avinash-kaushik.md"
          quote: "I've created these two Frameworks for AI... the first framework is AI as what... the second framework is the AI activation framework"
        - source: "interview_patterns.yaml"
          observation: "9/9 interviews show numbered frameworks"
      frequency: "DOMINANT - most common professional state"

