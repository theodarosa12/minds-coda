        Reframes from company-centric to customer-centric.
      confidence: 93
      evidence:
        - "677-digital-analytics: 'I hate people who like the marketing funnel'"
        - "Consistent across 6+ sources"

    - id: REC_SIT_005
      situation: "Channel Prioritization Question"
      recognition_cues:
