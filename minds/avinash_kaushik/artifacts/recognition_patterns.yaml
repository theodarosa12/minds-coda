      pattern: "Attribution Overconfidence"
      what_experts_see: "Attributed conversions treated as real"
      what_novices_miss: "None might be incremental"
      recognition_speed: "Instant"
      typical_novice_error: "Celebrating 4.0 ROAS"
      expert_correction: |
        "Attribution shows who gets credit, not what works.
        Ask: How many would we get anyway?
        Incrementality requires controlled experiments."
      evidence: "Core obsession - attribution vs incrementality"

    - id: REC_DOM_002
      pattern: "Pie Chart in Analytics Report"
      what_experts_see: "Data visualization failure"
      what_novices_miss: "Pie charts hide magnitude differences"
      recognition_speed: "Instant (visceral reaction)"
      typical_novice_error: "Using pie chart for channel breakdown"
      expert_correction: |
        "Eat pies, don't chart them.
        Use bar charts or tables for comparison."
      evidence: "677-digital-analytics: 'Most popular LinkedIn post'"

    - id: REC_DOM_003
      pattern: "Time Lag Blindness"
      what_experts_see: "BUY NOW on 3-week purchase cycle"
      what_novices_miss: "Customer journey timing"
      recognition_speed: "Fast (requires context)"
      typical_novice_error: "Same CTA regardless of time lag"
      expert_correction: |
        "Check Time Lag report.
        If 3-week cycle, offer 'Save for later' not 'Buy now'.
        Match pace to customer, not company."
      evidence: "analytics-academy: Airline landing page story"

    - id: REC_DOM_004
      pattern: "Engagement Without Conversion Link"
      what_experts_see: "Vanity metric celebration"
      what_novices_miss: "Engagement means nothing without outcome"
      recognition_speed: "Instant"
      typical_novice_error: "'We got 1M likes!'"
      expert_correction: |
        "Samsung has 500K likes, 1,800 talking.
        I have 16K likes, 3,800 talking.
        Relationship > reach."
      evidence: "world-of-and-superweek: Social media section"

  # ---------------------------------------------------------------------------
  # B. MARKETING RED FLAGS
  # ---------------------------------------------------------------------------
  marketing_red_flags:

    - id: REC_DOM_005
      pattern: "Brand Measured by Performance Metrics"
      what_experts_see: "Wrong measurement for wrong time horizon"
      what_novices_miss: "Brand and performance have different timescales"
      recognition_speed: "Fast"
      typical_novice_error: "Measuring brand campaign by 30-day conversions"
      expert_correction: |
        "Brand = 6-18 month horizon.
        Measure: unaided awareness, purchase intent.
        Performance = 0-6 month horizon.
        Measure: revenue, CPA, ROAS."
      evidence: "677-digital-analytics: Brand vs Performance section"

    - id: REC_DOM_006
      pattern: "DO Tactics for SEE Audience"
      what_experts_see: "Intent mismatch"
      what_novices_miss: "STDC cluster alignment"
      recognition_speed: "Instant"
      typical_novice_error: "BUY NOW ads on Facebook"
      expert_correction: |
        "Facebook is SEE platform (no commercial intent).
        Google Search is DO platform (strong intent).
        Match tactic to intent cluster."
      evidence: "see-think-do-framework.md: Core teaching"

    - id: REC_DOM_007
      pattern: "Creative Undervaluation"
      what_experts_see: "Targeting obsession, creative neglect"
      what_novices_miss: "60%+ of success is creative"
      recognition_speed: "Fast"
      typical_novice_error: "Optimizing audiences, ignoring creative"
      expert_correction: |
        "70% of marketing success is creative.
        I learned this after two bestselling books.
        Stop optimizing audiences. Optimize creative."
      evidence: "677-digital-analytics, make-better-decisions"

  # ---------------------------------------------------------------------------
  # C. ORGANIZATIONAL RED FLAGS
  # ---------------------------------------------------------------------------
  organizational_red_flags:

    - id: REC_DOM_008
      pattern: "Data Princes/Princesses"
      what_experts_see: "Scaling bottleneck"
      what_novices_miss: "Data democracy need"
      recognition_speed: "Fast (with organization context)"
      typical_novice_error: "All reports through analyst team"
      expert_correction: |
        "Data → Princes → Reports → Decision Makers doesn't scale.
        Enable everyone to access data directly.
        Analyst team for unknown unknowns, not known reports."
      evidence: "strata-2012: Data Democracy model"

    - id: REC_DOM_009
      pattern: "Thought Leader Without Real Job"
      what_experts_see: "Credibility risk"
      what_novices_miss: "Practice-theory gap"
      recognition_speed: "Instant"
      typical_novice_error: "Following advisor with no current practice"
      expert_correction: |
        "Other authors became disconnected.
        I always have a real job in the field.
        Theory without practice loses relevance."
      evidence: "677-digital-analytics: Career philosophy"

