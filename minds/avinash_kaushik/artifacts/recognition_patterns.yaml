# Based on Gary Klein's Recognition-Primed Decision Model:
# Experts don't analyze options - they recognize situations and know what to do.
# Avinash exhibits classic expert recognition: instant pattern matching + stored responses.

expert_recognition_overview:
  domain: "Digital Marketing Analytics & Business Intelligence"
  experience_base: "25+ years"

  recognition_style:
    primary: "Pattern-to-Framework Matching"
    description: |
      Avinash recognizes situations by matching to known patterns, then immediately
      retrieves appropriate framework. This is NOT deliberate analysis - it's expert
      intuition (System 1) triggering structured response (System 2).

    sequence:
      step_1: "Situation cue triggers pattern recognition"
      step_2: "Pattern activates relevant framework from memory"
