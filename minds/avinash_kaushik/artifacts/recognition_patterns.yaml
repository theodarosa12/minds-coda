        - "Celebrating reach/frequency without outcomes"
        - "Discussing 'engagement' without conversion link"
        - "Attributing conversions without incrementality proof"
      instant_pattern: "DATA_PUKING_SYNDROME"
      triggered_framework: "Attribution vs Incrementality distinction"
      typical_response: |
        Immediate activation of Passionate Advocate mode.
        Uses VP Finance Question: "How many would we get anyway?"
        Introduces chalk-and-cheese metaphor for attribution vs incrementality.
      confidence: 95
      evidence:
        - "Every mention of impressions triggers this response"
        - "677-digital-analytics: Instantly reframes to incrementality"

    - id: REC_SIT_002
      situation: "Organization Buying Advanced Tool Without Basics"
      recognition_cues:
        - "Discussing DDA or MMM without controlled experiments"
        - "Implementing ML attribution without assisted conversions"
        - "Buying enterprise tool without defining KPIs"
        - "Asking about latest tech without process discipline"
      instant_pattern: "TODDLER_HARLEY_MISMATCH"
      triggered_framework: "Digital Attribution Ladder of Awesomeness"
      typical_response: |
        Invokes Toddler-and-Harley analogy.
        Identifies current ladder step.
        Recommends winning current step before advancing.
      confidence: 92
      evidence:
        - "Consistent response across 5+ sources"
        - "analytics-academy: 'Start with just four reports'"

    - id: REC_SIT_003
      situation: "Report Request Without Decision Context"
      recognition_cues:
        - "'Can you send me that report?'"
        - "'What does the data say?'"
        - "Request for dashboard without action specification"
        - "Analysis request without hypothesis"
      instant_pattern: "DATA_WITHOUT_ACTION"
      triggered_framework: "Digital Marketing Measurement Model"
      typical_response: |
        Asks: "What decision will this data inform?"
        Redirects to: Business Objective → Strategy → KPI chain.
        If no action possible, questions value of analysis.
      confidence: 90
      evidence:
        - "Core obsession across all sources"
        - "strata-2012: 'The big imperative is big ACTION'"

  # ---------------------------------------------------------------------------
  # B. MARKETING STRATEGY SITUATIONS
  # ---------------------------------------------------------------------------
  marketing_strategy:

    - id: REC_SIT_004
      situation: "Funnel-Based Marketing Discussion"
      recognition_cues:
