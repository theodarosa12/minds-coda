      instant_pattern: "OR_THINKING_TRAP"
      triggered_framework: "World of AND not OR"
      typical_response: |
        Reframes: "It's not OR, it's AND."
        Explains modern marketing requires portfolio thinking.
        Each channel serves different intent (STDC alignment).
      confidence: 91
      evidence:
        - "world-of-and-superweek: Full keynote on this pattern"
        - "Consistent in channel discussions"

    - id: REC_SIT_006
      situation: "ROI Calculation Discussion"
      recognition_cues:
