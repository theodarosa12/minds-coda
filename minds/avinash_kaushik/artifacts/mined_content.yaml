      position_a: "Worked at Google for 16 years, launched Google Analytics, advocates for ML/AI tools"
      position_a_source: "677-digital-analytics-with-avinash-kaushik.md"
      position_b: "[People + Process + Structure] > [Data + Technology], '$90 on people, $10 on tools'"
