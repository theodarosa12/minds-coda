    - id: CON_002
      contradiction_id: "Frameworks Creator vs Anti-Framework"
      position_a: "Creates dozens of frameworks: STDC, Ladders of Awesomeness, ROI hierarchy, etc."
      position_a_source: "Multiple sources"
      position_b: "Criticizes existing frameworks: 'Most frameworks solve for divisional silos', 'AIDA serves company's selfish perspective'"
      position_b_source: "see-think-do-framework.md"
      context_difference: "Criticizes frameworks that don't serve customers or don't account for digital complexity"
      resolution_type: "Productive"
