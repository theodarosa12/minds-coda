    - id: MM_016
      name: "Brand vs Performance Marketing"
      description: "Not OR but AND - different time horizons, different measurement"
      content: |
        BRAND MARKETING:
        - Attaches values/attributes to brand
        - Time horizon: 6-18 months
        - Product = 50-60% of brand perception
        - Customer service = 20-30%
        - Advertising = minority contribution
        - Measure: Unaided brand awareness, purchase intent

        PERFORMANCE MARKETING:
        - Competitively differentiated value proposition
        - Time horizon: 0-6 months
        - Science of optimizing portfolio
        - Measure: Revenue, profit, CPA

        "60%+ of marketing success is determined by the creative."
      application: "Balance both. Don't measure brand by performance metrics or vice versa."
      source: "677-digital-analytics-with-avinash-kaushik.md, make-better-decisions-with-avinash-kaushik.md"
      confidence: HIGH
      triangulation: []

    - id: MM_017
      name: "Four Reports That Matter"
      description: "If you're new, focus on just four reports from GA"
      content: |
        1. AUDIENCE → Engagement Report (Behavior folder)
           - Page Depth, Time on Site
           - "How deeply do people engage with us?"

        2. CONTENT → Landing Pages Report
           - Bounce rate, Per Visit Value
           - "Which campaigns/pages need optimization?"

        3. TRAFFIC → All Traffic Sources Report
           - Owned, earned, paid media in one place
           - "See everything in one place"

        4. CONVERSIONS → Goals Overview Report
           - All goals including micro conversions
           - "Did we do anything of value for the 98% who don't convert?"

        "Just four reports. Ignore everything else!"
      application: "Pick one report from each folder. That discipline brings focus."
      source: "analytics-academy-live-event-2.md"
      confidence: HIGH
      triangulation: []

    - id: MM_018
      name: "AI Framework: Tool vs Copilot vs Muse"
      description: "Three categories of AI application in business"
      content: |
        AI AS A TOOL: Deterministic task execution
        AI AS A COPILOT: Augmenting human decisions
        AI AS A MUSE: Generating creative starting points

        "First understand WHAT are we going to use AI for."

        Second framework: AI Activation Framework
        - Five clusters rank-ordered by profit potential
        - Generative AI = most immediately profitable
        - NLP = more work needed before monetization
      application: "Before implementing AI, classify: are we using it as tool, copilot, or muse?"
      source: "make-better-decisions-with-avinash-kaushik.md"
      confidence: MEDIUM
      triangulation: []

    - id: MM_019
      name: "Time Lag and Path Length Analysis"
      description: "Understanding how long and how many visits before conversion"
      content: |
        TIME LAG: Days from first exposure to conversion
        PATH LENGTH: Number of visits before conversion

        Example: Airline company found vacation purchases have 3-week time lag.

        Action: Changed landing page from BIG "Buy Now" button to:
        - Smaller "Buy Now"
        - Bigger "Search and Save"
        - Added: "Check this box if you want us to email you if price goes down by X%"

        Result: Micro conversion (save) + permission to email + matching customer pace

        "If the customer wants to go at a certain pace, we'll change ourselves to match that pace."
      application: "Don't scream BUY NOW when data shows 3-week purchase cycle. Match the pace."
      source: "analytics-academy-live-event-2.md"
      confidence: HIGH
      triangulation: []

    - id: MM_020
      name: "Strong Opinions Loosely Held"
      description: "Personal operating principle for decision-making"
      content: |
        "I have this thing I call the Avinash User Manual. One of the things in it is: strong opinions loosely held."

        Be curious. Think. Change your mind.

