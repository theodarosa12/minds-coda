    - id: MM_001
      name: "See-Think-Do-Care Framework"
      description: "Intent-centric marketing framework replacing demographic/psychographic targeting with behavioral intent clusters"
      content: |
        Four audience clusters based on INTENT, not demographics:
        - SEE: Largest Addressable Qualified Audience (LAQA) - NO commercial intent
        - THINK: Audience displaying weak commercial intent
        - DO: Audience with strong commercial intent (where 97.296% of marketing wrongly focuses)
        - CARE: Extra-loyal customers with multiple purchases/renewals
      application: "Match marketing tactics to intent clusters. Don't run BUY NOW ads on Facebook (SEE platform). Don't do brand awareness on Google Search (DO platform)."
      source: "see-think-do-framework.md, 677-digital-analytics-with-avinash-kaushik.md"
      confidence: CRITICAL
      triangulation:
        - "677-digital-analytics-with-avinash-kaushik.md"
        - "make-better-decisions-with-avinash-kaushik.md"
        - "see-think-do-framework.md"

    - id: MM_002
      name: "Attribution vs Incrementality Distinction"
      description: "Attribution and incrementality are NOT the same - chalk and cheese"
      content: |
        ATTRIBUTION: Science of distributing credit for conversions (who gets credit)
        INCREMENTALITY: Identifying conversions that would NOT have occurred without marketing

        Key insight: None of attributed conversions might be incremental.
        Very large percentage of paid media conversions are NOT incremental.

        The VP Finance Question: "How many of these conversions would we have gotten anyway?"
      application: "Stop celebrating attributed conversions. Measure incrementality through controlled experiments."
      source: "attribution-vs-incrementality.md"
      confidence: CRITICAL
      triangulation:
        - "677-digital-analytics-with-avinash-kaushik.md"
        - "marketing-roi-formula.md"
        - "controlled-experiments-incrementality.md"

    - id: MM_003
      name: "[People + Process + Structure] > [Data + Technology]"
      description: "Culture is a stronger determinant of success with data than anything else. Including data."
      content: |
        Formula: [People + Process + Structure] > [Data + Technology]

        P+P+S improves in EVOLUTIONARY manner
        D+T improves in REVOLUTIONARY manner

        Challenge: Revolutions seem attractive, so leaders charge full speed ahead.
        Result: Frustration, derailed careers, massive money wasted.

        "Revolutions in our context, almost always fail. Evolution works."
      application: "Invest in growing people skills, scalable processes, and structures BEFORE buying new technology."
      source: "attribution-ladder-awesomeness.md"
      confidence: CRITICAL
      triangulation:
        - "world-of-and-w-avinash-kaushik-superweek-analytics-summit.md"
        - "analytics-academy-live-event-2.md"
        - "strata-2012-big-data-imperative.md"

    - id: MM_004
      name: "The 10/90 Rule"
      description: "If you have $100 to invest in making smart decisions, invest $10 in tools and $90 in people"
      content: |
        $10 → Tools and implementation
        $90 → People who will extract insights from the data

        "The continued obsession with tools and putting $95 there is the biggest threat."

        Reality: Most companies put 90% in tools, 10% in people. This is backwards.
      application: "Before buying new analytics tools, hire/train analysts who can extract value from existing data."
      source: "world-of-and-w-avinash-kaushik-superweek-analytics-summit.md"
      confidence: HIGH
      triangulation:
        - "677-digital-analytics-with-avinash-kaushik.md"
        - "strata-2012-big-data-imperative.md"

    - id: MM_005
      name: "The Toddler and the Harley Metaphor"
      description: "Match capability to sophistication level - don't give advanced tools to beginners"
      content: |
        "You can't give a toddler a Harley Davidson motorcycle. The moment you start it, the toddler cries."

        Not the toddler's fault. Not the Harley's fault. YOUR fault.

        The toddler needs: Something to steady her, something to push, something to exercise her legs.

        At some point, she would love a Harley.
      application: "Before implementing advanced attribution models, master basics: optimal metrics, macro/micro outcomes, assisted conversions."
      source: "attribution-ladder-awesomeness.md"
      confidence: HIGH
      triangulation:
        - "analytics-academy-live-event-2.md"
        - "make-better-decisions-with-avinash-kaushik.md"

    - id: MM_006
      name: "ROI Formula Hierarchy (ROI 1→2→3)"
      description: "Three levels of ROI truth, from fake to real"
      content: |
        ROI 1 (FAKE): [(Revenue – Media Costs) / Media Costs]
        - "ROI = 4" is fake news

        ROI 2 (Gross Profit): [(Revenue – COGS – Media Costs) / Media Costs]
        - Account for Cost of Goods Sold
        - ROI drops from 4 to 0.5 (heartbreaking but real)

        ROI 3 (Net Profit): [(Revenue – Non-working Costs – COGS – Campaign Budget) / Campaign Budget]
        - Include non-working media costs (creative, production, agency fees)
        - Total campaign budget, not just media spend

        "While heartbreaking, please learn to embrace the 0.5 – or you will never know how to be better."
      application: "Calculate ROI 3 (Net Profit ROI). A painful 0.5 is better than a fake 4.0."
      source: "marketing-roi-formula.md"
      confidence: CRITICAL
      triangulation:
        - "677-digital-analytics-with-avinash-kaushik.md"

    - id: MM_007
      name: "Known Knowns / Known Unknowns / Unknown Unknowns"
      description: "Three categories of data problems (credited to Rumsfeld, applied to analytics)"
      content: |
        KNOWN KNOWNS: What we report (dashboards, data puking)
        KNOWN UNKNOWNS: What we analyze (drilling, segmenting)
        UNKNOWN UNKNOWNS: What we discover (machine learning, algorithms)

        "If we could figure out the unknown unknowns, we could have saved Afghanistan from a big problem."

        The magic is in the middle - not the extremes where data is sparse.

        Solution: Sort data by "interestingness" not by value.
      application: "Use algorithms to surface unknown unknowns. Don't just sort by highest/lowest - find the middle where opportunities hide."
      source: "strata-2012-big-data-imperative.md"
      confidence: HIGH
      triangulation:
        - "677-digital-analytics-with-avinash-kaushik.md"

    - id: MM_008
      name: "Data Democracy Model"
      description: "Replace data princes with empowered employees making decisions from data"
      content: |
        OLD MODEL (Broken):
        Data → Princes/Analysts → Reports → Decision Makers
        "Doesn't scale. Company becomes MORE inefficient."

        NEW MODEL (Data Democracy):
        Data → Everyone directly (janitor, marketer, CMO)
        "You janitor, figure out how to use data every day to do your job better."

        Very large decisions still made by faith/Jesus.
        All actual useful decisions made by people closer to data.

        "This scales because it's part of every person's job."
      application: "Empower everyone to access data directly. Reserve analysts for the arrogant who refuse to touch data."
      source: "strata-2012-big-data-imperative.md"
      confidence: HIGH
      triangulation:
        - "analytics-academy-live-event-2.md"

    - id: MM_009
      name: "Digital Attribution Ladder of Awesomeness"
      description: "Nine-step evolutionary path from basic metrics to advanced experimentation"
      content: |
        STEP 1: Optimal Metrics (foundation)
        STEP 2: Macro and Micro-Outcomes
        STEP 3: Assisted Conversions
        STEP 4: Standard Attribution Models
        STEP 5: Custom Attribution Modeling
        STEP 6: Data-driven Attribution Modeling
        STEP 7: Pan-Existence Modeling (cross-device)
        STEP 8: Nonline Controlled Experiments
        STEP 9: Advanced Controlled Experiments

        Methodology: Honest self-reflection → Identify current step → Move to NEXT step only → Win that, then go next.
      application: "Don't jump to step 9 from step 2. Win each step before advancing."
      source: "attribution-ladder-awesomeness.md"
      confidence: HIGH
      triangulation:
        - "make-better-decisions-with-avinash-kaushik.md"

    - id: MM_010
      name: "The World of And (Not Or)"
      description: "Modern marketing requires AND thinking, not OR thinking"
      content: |
        "Should I do TV OR Google? Should I do Google OR Facebook? Should I do Twitter OR email?"

        WRONG QUESTION.

        "It's not OR. It's AND. Today the world is so complicated that you have to do AND."

        TV AND Google AND Radio AND Content Marketing AND AND AND AND AND.

        "Most marketers, many CEOs try to play the OR game. They say: tell me what to stop doing and what to replace it with."

        "There's no replacement. We live in a world of AND. We don't live in a world of OR."
      application: "Stop asking 'which one?' Start asking 'how do all of these work together?'"
      source: "world-of-and-w-avinash-kaushik-superweek-analytics-summit.md"
      confidence: HIGH
      triangulation:
        - "677-digital-analytics-with-avinash-kaushik.md"

    - id: MM_011
      name: "Macro vs Micro Conversions"
      description: "98% of visitors don't convert - track the value they still provide"
      content: |
        MACRO CONVERSION: The one thing that makes you money (purchase, lead)
        MICRO CONVERSIONS: Other valuable actions (email signups, downloads, reviews, app installs)

        "If 2% convert, did we do anything of value for the 98%?"

        Reorder micro conversions by time horizon:
        - Revenue in next 30 days
        - Revenue in next 90 days
        - Revenue in next 9 months

        Segment by acquisition source to understand which channels drive which conversions.
      application: "Track micro conversions. A visitor who downloads a whitepaper has value even without converting."
      source: "analytics-academy-live-event-2.md, make-better-decisions-with-avinash-kaushik.md"
      confidence: HIGH
      triangulation:
        - "677-digital-analytics-with-avinash-kaushik.md"

    - id: MM_012
      name: "Step Change vs Incremental Change"
      description: "Quality of ideas determines breakthrough vs marginal improvement"
      content: |
        INCREMENTAL CHANGE: Small improvements, comfortable, low risk
        STEP CHANGE: Large or sudden discontinuous change that makes things better

        The difference: Quality of ideas you are considering.

        Principle: Aggregation of Marginal Gains - small improvements compound.

        Examples:
        - "Improve bounce rate of top 10 landing pages by 50%"
        - "Eliminate 40% of numbers from your dashboard"
        - "Take first steps towards unlocking smart algorithms"
      application: "Don't optimize for 2% better. Ask: what would create 50% improvement?"
      source: "marketing-analytics-obsessions.md"
      confidence: HIGH
      triangulation: []

    - id: MM_013
      name: "Think > Ink (Data Visualization)"
      description: "Data visualization is about the thinking, not the drawing"
      content: |
        "Anyone can make a complicated visual. It takes someone very special to draw out the essence of the story data is trying to tell."

        "It's not the ink, it's the think."

        Obsess about improving the THINK just as much as improving the INK.
      application: "Before beautifying a chart, clarify what decision it should drive."
      source: "marketing-analytics-obsessions.md, 677-digital-analytics-with-avinash-kaushik.md"
      confidence: HIGH
      triangulation: []

    - id: MM_014
      name: "Digital Marketing Measurement Model"
      description: "Five-step framework for measurement discipline"
      content: |
        STEP 1: Business Objectives (talk to most senior person - CMO/CEO)
        STEP 2: Specific Strategies executing in next 6 MONTHS (VP level)
        - Cut off time horizon: 6 months, not 900 years
        STEP 3: KPIs for those strategies
        STEP 4: Targets
        STEP 5: Segments

        "Stop all the other nonsense!"

        Creates Custom Reports, Advanced Segments, focus in GA.
      application: "Ask CMO: what's most important? Ask VP: what strategies for next 6 months? Measure ONLY that."
      source: "analytics-academy-live-event-2.md"
      confidence: HIGH
      triangulation:
        - "make-better-decisions-with-avinash-kaushik.md"

    - id: MM_015
      name: "Controlled Experiments for Incrementality"
      description: "True incrementality comes from proper test vs control design"
      content: |
        CONTROLLED EXPERIMENT:
        - Understand all environmental variables
        - Carefully choose more than one group of "like type" subjects
        - Expose to different mix of media
        - Measure differences in outcomes
        - Prove/disprove hypothesis

        Requirements:
        1. People with deep skills in Scientific Method, Design of Experiments, Statistical Analysis
        2. Support from top and bottom and middle
        3. Understanding of all environmental variables

        "Rewards: Very close to entering heaven. Marketing heaven that is."
      application: "Attribution tells you who gets credit. Controlled experiments tell you what actually works."
      source: "controlled-experiments-incrementality.md"
      confidence: CRITICAL
      triangulation:
        - "677-digital-analytics-with-avinash-kaushik.md"
        - "attribution-vs-incrementality.md"

