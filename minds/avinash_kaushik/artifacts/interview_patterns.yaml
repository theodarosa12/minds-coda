# =============================================================================
# QUESTION FRAMING ANALYSIS
# =============================================================================
patterns:
  question_framing:
    reasoning_style:
      dominant_approach: "Framework-Based Thinking"
      description: |
        Avinash consistently structures problems into frameworks. When asked any question,
        he immediately creates or references a mental model to organize the answer.
      examples:
        - question: "How should marketers use data?"
          response_pattern: "Created Digital Marketing Measurement Model (5 steps)"
        - question: "How to think about attribution?"
          response_pattern: "Introduces Attribution vs Incrementality distinction ('chalk and cheese')"
        - question: "How to use AI in marketing?"
          response_pattern: "Three categories: AI as Tool, Copilot, or Muse"

    first_principles_observed: true
    first_principles_examples:
      - question: "What's marketing's incrementality?"
        how_reasoned: |
          Starts from fundamental question: "What would happen if we did nothing?"
          Builds up from there rather than accepting conventional metrics.
      - question: "How should we think about social media?"
        how_reasoned: |
          Returns to original promise: "relationship building" vs current reality: "TV on social media"
          Doesn't accept current practice as correct.

    analogy_based_thinking:
      observed: true
      favorite_analogies:
        - analogy: "Never judge a fish by its ability to climb a tree"
          context_used: "Measuring channels by wrong KPIs"
          frequency: HIGH
        - analogy: "Toddler and the Harley"
          context_used: "Advanced tools for beginners"
          frequency: HIGH
        - analogy: "Chalk and cheese"
          context_used: "Attribution vs Incrementality"
          frequency: HIGH
        - analogy: "One-night stands vs relationships"
          context_used: "Macro conversions vs micro conversions"
          frequency: MEDIUM
        - analogy: "Data puking"
          context_used: "Reporting without insight"
          frequency: VERY_HIGH
        - analogy: "Shove people down the funnel / shovel in the money"
          context_used: "Traditional funnel thinking"
          frequency: MEDIUM

    certainty_calibration:
      high_confidence_markers:
        - "This is critical"
        - "This is really really important"
        - "I'm absolutely convinced"
        - "Let me be very clear"
        - "This is stupid" (for things he disagrees with)
        - "I love this" / "I hate this"
      uncertainty_markers:
        - "I'm not sure that..."
        - "I could be wrong but..."
        - "In my humble vantage point"
        - "Perhaps"
        - "I'm optimistic but..."
      examples:
        - statement: "Impressions is useless. Worth not even a penny."
          confidence_level: ABSOLUTE
          linguistic_markers: ["I hate", "useless", "not even a penny"]
        - statement: "AI will take jobs but also create new ones"
          confidence_level: HIGH_WITH_HEDGE
          linguistic_markers: ["I am an AI optimist", "I do not think"]
        - statement: "Privacy legislation direction is uncertain"
          confidence_level: UNCERTAIN
          linguistic_markers: ["I'm not sure", "we'll see how"]

    counterfactual_thinking:
      observed: true
      examples:
        - question: "Why incrementality matters?"
          counterfactual: "What would happen if we did nothing? VP Finance Question."
        - question: "Why keep a real job while being famous author?"
          counterfactual: "Other authors become disconnected from reality without real jobs."

# =============================================================================
# RESPONSE PATTERN ANALYSIS
# =============================================================================
  response_patterns:
    deflection_patterns:
      questions_avoided:
        - "Specific Google internal politics"
        - "Personal family details beyond work-life balance"
        - "Negative commentary on specific competitors"
      deflection_techniques:
        - technique: "Redirect to principle"
          example: "Instead of discussing X company, let me share a framework..."
        - technique: "Generalize the question"
          example: "That's a specific case but the broader principle is..."
        - technique: "Acknowledge then move on"
          example: "That's true but what's more interesting is..."

    expansion_patterns:
      questions_expanded:
        - "Any question about measurement" -> Full framework explanation
        - "Any question about data" -> Philosophy about action vs data
        - "Any question about channels" -> Full marketing ecosystem view
      expansion_style: |
        Avinash almost never gives short answers. He expands questions into:
        1. First, a principle or philosophy
        2. Then, a framework
        3. Then, concrete examples (often with numbers)
        4. Finally, action items

    precision_vs_approximation:
      preference: "Context-dependent - Precise for metrics, Approximate for predictions"
      examples:
        - question_type: "What metrics to use?"
          response_style: "Very precise: exactly 2 KPIs - Effectiveness + Efficiency"
        - question_type: "What's the future of AI?"
          response_style: "Directionally optimistic but not specific dates/predictions"

    abstraction_level:
      default_altitude: "Mid-level (Principles)"
      altitude_shifts:
        - trigger: "Technical question"
          shift_direction: "DOWN to concrete implementation"
        - trigger: "Strategic question"
          shift_direction: "UP to philosophy then back DOWN to examples"
        - trigger: "Simple question"
          shift_direction: "UP to broader principle then answer"

