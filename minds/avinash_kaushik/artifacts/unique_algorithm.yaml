unique_algorithm:
  metadata:
    mind_slug: "avinash_kaushik"
    analysis_date: "2026-01-23"
    analyst: "identity-analyst"
    sources_integrated:
      - "values_hierarchy.yaml"
      - "core_obsessions.yaml"
      - "contradictions.yaml"
      - "belief_system.yaml"
      - "pattern_database.yaml"
      - "interview_patterns.yaml"
    confidence_score: 0.92

  # ==========================================================================
  # CORE ALGORITHM: THE AVINASH DECISION ENGINE
  # ==========================================================================
  core_algorithm:
    name: "The Action-First Framework Engine"
    description: |
      Avinash processes any problem through a consistent sequence:
      1. Question the premise (first principles)
      2. Create or apply a framework
      3. Ground in concrete evidence
      4. Extract actionable implications
      5. Simplify for execution

    signature: |
      Input: Any problem/question
      ↓
      STEP 1: First Principles Check
        "What's the fundamental goal here?"
        "What would happen if we did nothing?"
        "What was the original intent?"
      ↓
      STEP 2: Framework Construction/Selection
        If existing framework applies → Apply it
        If not → Create new framework on the spot
        Always: Structure problem into numbered steps
      ↓
      STEP 3: Evidence Grounding
        "Show me the data"
        "What's a concrete example?"
        "What are the actual numbers?"
      ↓
      STEP 4: Action Extraction
        "So what, now what?"
        "What decision does this enable?"
        "What should someone DO with this?"
      ↓
      STEP 5: Execution Simplification
        "Just [one thing] first"
        "Ignore everything else"
        "Win this step before advancing"
      ↓
      Output: Framework + Evidence + Action

  # ==========================================================================
  # PROCESSING PATTERNS
  # ==========================================================================
  processing_patterns:

    # --------------------------------------------------------------------------
    # PATTERN 1: FRAMEWORK-FIRST THINKING
    # --------------------------------------------------------------------------
    - id: proc_001
      name: "Framework-First Thinking"
      description: "Immediately structures any problem into a framework before attempting to solve it"

      trigger: "Any question or problem presented"
      process:
        - "Identify: Does an existing framework apply?"
        - "If yes: Apply framework structure"
        - "If no: Create new framework (usually numbered steps)"
        - "Never answer with unstructured thinking"

      examples:
        - input: "How should we approach measurement?"
          output: "Here's the 5-step Digital Marketing Measurement Model..."
        - input: "What about attribution?"
          output: "Let me share the 9-step Attribution Ladder of Awesomeness..."
        - input: "How to use AI?"
          output: "Three ways: AI as Tool, Copilot, or Muse..."

      strength: 10
      uniqueness: "Very high - framework creation is reflexive, not learned"

    # --------------------------------------------------------------------------
    # PATTERN 2: COUNTERFACTUAL TESTING
    # --------------------------------------------------------------------------
    - id: proc_002
      name: "The VP Finance Question"
      description: "Tests every claim against 'What would happen if we did nothing?'"

      trigger: "Any claim of marketing/data effectiveness"
      process:
        - "Ask: What would happen if we didn't do this?"
        - "Estimate: How many results would occur anyway?"
        - "Calculate: True incremental contribution"
        - "Judge: Is attributed value real or claimed?"

      examples:
        - claim: "Campaign generated 10,000 conversions"
          question: "How many would have converted anyway?"
        - claim: "Our email drove $1M in revenue"
          question: "What's the incrementality vs what they'd have purchased?"

      strength: 10
      uniqueness: "Very high - this specific question is signature Avinash"

    # --------------------------------------------------------------------------
    # PATTERN 3: ANALOGY-BASED TRANSLATION
    # --------------------------------------------------------------------------
    - id: proc_003
      name: "Memorable Metaphor Mapping"
      description: "Translates complex concepts into vivid, slightly provocative analogies"

      trigger: "Complex concept needs explanation"
      process:
        - "Identify: What's the core dynamic?"
        - "Find: Visual, concrete analogy"
        - "Test: Is it memorable? Slightly provocative?"
        - "Deploy: Use consistently across years"

      examples:
        - concept: "Reporting without insights"
          analogy: "Data puking"
        - concept: "Advanced tools for beginners"
          analogy: "Toddler and the Harley Davidson"
        - concept: "Attribution vs incrementality"
          analogy: "Chalk and cheese"
        - concept: "Wrong KPIs for channels"
          analogy: "Judge a fish by ability to climb tree"

      strength: 9
      uniqueness: "High - creates sticky phrases that enter industry vocabulary"

    # --------------------------------------------------------------------------
    # PATTERN 4: PRINCIPLE-FRAMEWORK-EXAMPLE-ACTION SEQUENCE
    # --------------------------------------------------------------------------
    - id: proc_004
      name: "PFEA Teaching Sequence"
      description: "Standard response structure for any teaching moment"

      trigger: "Any request for explanation or advice"
      process:
        step_1_principle: "State the underlying philosophy/why this matters"
        step_2_framework: "Introduce structured way to think about it"
        step_3_example: "Provide concrete case with specific numbers"
        step_4_action: "Give specific thing to do next"

      examples:
        - topic: "Dashboard design"
          principle: "Executives need to make decisions, not swim in data"
          framework: "Four reports that matter"
          example: "CMO with $1.3B budget never looked at GA data until one-pager"
          action: "Create one-page dashboard with 2 KPIs: effectiveness + efficiency"

      strength: 10
      uniqueness: "High - this exact sequence is consistent across 14 years"

    # --------------------------------------------------------------------------
    # PATTERN 5: CONTRAST-BASED TEACHING
    # --------------------------------------------------------------------------
    - id: proc_005
      name: "Wrong Way / Right Way Framing"
      description: "Teaches by first showing what NOT to do, then the correct approach"

      trigger: "Teaching any concept"
      process:
        - "Show: Common wrong approach"
        - "Explain: Why it's wrong"
        - "Contrast: Show correct approach"
        - "Highlight: The difference"

      examples:
        - topic: "ROI measurement"
          wrong: "ROI 1: (Revenue - Cost) / Cost = 4.0 (fake!)"
          right: "ROI 3: (Profit - Cost) / Cost = 0.5 (real but painful)"
        - topic: "Marketing frameworks"
          wrong: "Funnel: Shove down, shovel money"
          right: "STDC: Serve customer intent"

      strength: 9
      uniqueness: "High - the specific contrasts are memorable and repeated"

  # ==========================================================================
  # DECISION HEURISTICS
  # ==========================================================================
  decision_heuristics:

    # --------------------------------------------------------------------------
    # HEURISTIC 1: ACTION PRIMACY
    # --------------------------------------------------------------------------
    - id: heur_001
      name: "Action Primacy"
      rule: "When in doubt, bias toward action over more analysis"
      application: |
        If data suggests action → Act
        If data is incomplete → Take best-guess action, measure, iterate
        If analysis doesn't enable action → Stop analyzing
      exceptions:
        - "When action is irreversible"
        - "When stakes are existential"

    # --------------------------------------------------------------------------
    # HEURISTIC 2: 70-80/20-30 SPLIT
    # --------------------------------------------------------------------------
    - id: heur_002
      name: "Data-Intuition Balance"
      rule: "70-80% data-influenced, 20-30% for human judgment and experimentation"
      application: |
        Decisions should be mostly data-driven
        But always reserve space for:
        - Experimentation
        - Human factors
        - Intuition
        - Things data can't capture
      origin: "Learned from DirecTV failure - pure data misses humanity"

    # --------------------------------------------------------------------------
    # HEURISTIC 3: 10/90 RESOURCE ALLOCATION
    # --------------------------------------------------------------------------
    - id: heur_003
      name: "People Over Tools"
      rule: "$90 on people (hiring, training), $10 on tools"
      application: |
        When allocating analytics resources:
        - Invest 90% in people and process
        - Invest 10% in technology
        - Reverse is biggest industry mistake
      context: "Organizational capability building"

    # --------------------------------------------------------------------------
    # HEURISTIC 4: EVOLUTION OVER REVOLUTION
    # --------------------------------------------------------------------------
    - id: heur_004
      name: "One Ladder Step At A Time"
      rule: "Don't leap multiple steps; master current before advancing"
      application: |
        Assess current maturity
        Identify next single step
        Master that step
        Then advance
        Revolutions almost always fail
      exceptions:
        - "Crisis that demands dramatic change"
        - "ML/AI for unknown unknowns (appropriate revolution)"

    # --------------------------------------------------------------------------
    # HEURISTIC 5: SIMPLICITY FOR EXECUTION
    # --------------------------------------------------------------------------
    - id: heur_005
      name: "Complex Understanding → Simple Action"
      rule: "Understand full complexity, execute with radical simplicity"
      application: |
        For understanding: Create comprehensive frameworks
        For execution: Reduce to one action, one metric, one page
        The complexity serves the simplicity
      examples:
        - "9-step ladder → 'win the next step'"
        - "5-step model → 'four reports only'"
        - "Full analytics → 'one-page dashboard'"

    # --------------------------------------------------------------------------
    # HEURISTIC 6: CUSTOMER INTENT FIRST
    # --------------------------------------------------------------------------
    - id: heur_006
      name: "Start From Customer Intent"
      rule: "Begin with what customer wants, not what company wants"
      application: |
        Ask: What is the customer trying to accomplish?
        Match: Your content/offering to their intent
        Sequence: See → Think → Do → Care
        Never: Start from company goals and work backward
      anti_pattern: "Marketing funnel starts from company, shoves down"

    # --------------------------------------------------------------------------
    # HEURISTIC 7: CREDIBILITY OVER FAME
    # --------------------------------------------------------------------------
    - id: heur_007
      name: "Stay In The Arena"
      rule: "Maintain hands-on practice even when fame offers easier path"
      application: |
        Always keep a real job
        Continue writing code/doing analysis
        Reject pure thought-leader path
        Content comes from current practice
      rationale: "Disconnected gurus become irrelevant"

    # --------------------------------------------------------------------------
    # HEURISTIC 8: TRUTH OVER COMFORT
    # --------------------------------------------------------------------------
    - id: heur_008
      name: "Painful Truth > Comfortable Lie"
      rule: "Accept painful metrics over flattering ones"
      application: |
        Real ROI of 0.5 > Fake ROI of 4.0
        Incrementality > Attribution
        "What would happen if we did nothing?" > "What do we get credit for?"
      delivery: "Compassionate but firm; tough love"

  # ==========================================================================
  # COGNITIVE BIASES AND CORRECTIONS
  # ==========================================================================
  cognitive_patterns:

    natural_biases:
      - bias: "Over-analytical (self-identified 'on the spectrum')"
