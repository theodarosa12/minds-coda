    # RANK 1: ACTION OVER DATA
    # --------------------------------------------------------------------------
    - rank: 1
      name: "Action Over Data"
      description: "Data is meaningless without action. The purpose of analysis is to drive decisions, not to accumulate information."
      intensity: 10
      immutability: "never_violated"

      evidences:
        - evidence_id: 1
          date: "2012"
          context: "Strata 2012 keynote to data professionals"
          sacrifice: "Could have celebrated big data hype; chose to criticize it"
          preservation: "Integrity of message about action"
          opportunity_cost: "Speaker popularity with hype-driven audience"
          quote: "I'm not really interested in having lots of big data. What I'm really interested in is trying to figure out how to use that intelligence to make life better for people."
          justification: "Data exists to serve humans, not the reverse"
          consequences: "Challenged industry orthodoxy at major conference"
          source: "strata-2012-big-data-imperative.md"
          source_type: "interview"

        - evidence_id: 2
          date: "2014"
          context: "SUPERWEEK Analytics Summit panel"
          sacrifice: "Could have praised tools; criticized tool obsession"
          preservation: "Truth about what matters"
          opportunity_cost: "Vendor relationships"
          quote: "The big imperative of big data is your capacity to find big ACTION."
          justification: "Action is the only metric that matters"
          consequences: "Positioned against industry tool vendors"
          source: "world-of-and-w-avinash-kaushik-superweek-analytics-summit.md"
          source_type: "interview"

        - evidence_id: 3
          date: "2023"
          context: "Super Data Science Podcast"
          sacrifice: "Time spent consulting on action, not just analysis"
          preservation: "Real-world impact"
          opportunity_cost: "Could charge more for pure analysis"
          quote: "Information is powerful but it is what we use it for that will define us."
          justification: "Legacy is defined by action, not knowledge"
          consequences: "Career built on driving decisions, not reports"
          source: "677-digital-analytics-with-avinash-kaushik.md"
          source_type: "interview"

        - evidence_id: 4
          date: "2013"
          context: "Analytics Academy Live Event"
          sacrifice: "Could have taught more tools; focused on action"
          preservation: "Practical impact for students"
          opportunity_cost: "More technical content demand"
          quote: "Not just analysis, but insights and influence and ACTION."
          justification: "Analysts must drive change, not just observe"
          consequences: "Teaching methodology emphasizes outcomes"
          source: "analytics-academy-live-event-2.md"
          source_type: "interview"

      triangulation:
        words: "Consistently preaches 'action over data' in every speech, interview, and blog post for 14+ years"
        actions: "Built career on driving decisions at Google, Intuit, Crowd - not just analyzing"
        consequences_accepted: "Criticizes own industry's data obsession; challenges clients to act"
        alignment: 0.98

      language:
        keywords: ["action", "decision", "impact", "change", "do something"]
        metaphors: ["data puking", "big ACTION not big data"]
        emotional_tone: "Passionate frustration when data hoarded without action"
        frequency: "In 10/15 sources analyzed"

      extreme_test:
        limit_situation: "Keynotes where he tells data professionals their work is worthless without action"
        would_die_for: false
        violations_count: 0
        violations_contexts: []

      tensions:
        conflicts_with_values: ["Thoroughness - sometimes action before full data is risky"]
        conflicts_with_people: ["Data hoarders", "Dashboard builders without recommendations"]
        recurring_cost: "Constantly fighting 'data puking' culture"
        unresolved_tensions: ["When to wait for more data vs act now"]

      origin:
        formative_event: "Ohio State career services data job - saw data reveal patterns but only mattered when acted on"
        formative_event_date: "~1990s"
        influence_person: "Kenyan farmer quoted in Strata talk"
        influence_philosophy: "Pragmatism - knowledge without application is useless"
        crystallization_age: 25
        evolution: "Intensified over time; moved from 'use data' to 'data without action is harmful'"

    # --------------------------------------------------------------------------
    # RANK 2: CREDIBILITY THROUGH PRACTICE
    # --------------------------------------------------------------------------
