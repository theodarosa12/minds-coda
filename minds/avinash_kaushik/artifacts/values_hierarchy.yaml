          preservation: "Ability to imagine possibilities for team"
          opportunity_cost: "Could delegate all technical work"
          quote: "I appreciate subject matter expert leaders and I try to be one. If I'm a leader who does at least some actual coding, it means I can IMAGINE possibilities for my team."
          justification: "Leaders who don't do real work lack imagination"
          consequences: "Still writes D3.js, R, Tableau at executive level"
          source: "677-digital-analytics-with-avinash-kaushik.md"
          source_type: "interview"

