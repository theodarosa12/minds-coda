          sacrifice: "Personal time for continuous learning"
          preservation: "Technical relevance"
          opportunity_cost: "4 hours/week that could be leisure"
          quote: "Every single week I set aside four hours to learn something new. If you want to keep doing something for a very long time you have to figure out how to keep growing and learning."
          justification: "Staying current is non-negotiable"
          consequences: "Scheduled, protected learning time weekly"
          source: "677-digital-analytics-with-avinash-kaushik.md"
          source_type: "interview"

        - evidence_id: 4
          date: "2023"
          context: "Explaining content creation model"
          sacrifice: "Could create hypothetical content; uses only real cases"
          preservation: "Authenticity of examples"
          opportunity_cost: "Slower content production"
          quote: "I actually have a job in the things I write about."
          justification: "Content must come from lived experience"
          consequences: "Newsletter and blog only use real client examples"
          source: "make-better-decisions-with-avinash-kaushik.md"
          source_type: "interview"

      triangulation:
        words: "Explicitly states must have real job, must stay hands-on, must keep learning"
        actions: "16 years at Google + CSO role despite book fame; codes at executive level"
        consequences_accepted: "Less income than pure consulting; more work than needed"
        alignment: 1.00

      language:
        keywords: ["real job", "hands-on", "in the arena", "subject matter expert"]
        metaphors: ["disconnected from reality", "toddler can't ride Harley"]
        emotional_tone: "Firm conviction, almost defensive about staying practical"
        frequency: "In 6/15 sources"

      extreme_test:
        limit_situation: "Rejected lucrative speaking-only career path"
        would_die_for: false
        violations_count: 0
        violations_contexts: []

      tensions:
