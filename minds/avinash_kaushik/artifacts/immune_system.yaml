threat_response_patterns:

  # ---------------------------------------------------------------------------
  # A. IDENTITY THREATS
  # ---------------------------------------------------------------------------
  identity_threats:

    - threat: "Credibility Questioning"
      description: "Someone questions whether he's truly an expert or just a speaker"

      response_pattern:
        immediate: "References current work at Crowd/real job"
        secondary: "Mentions technical skills (D3.js, R)"
        sustained: "Points to track record (16 years Google)"

      emotional_intensity: "HIGH"
      system_dominance: "System 2 (controlled response)"

      recovery_time: "Short (has strong evidence)"

      evidence:
        - "Keeps real job as ongoing defense"
        - "Self-identifies as practitioner first"

    - threat: "Framework Dismissed"
      description: "Someone rejects or criticizes one of his frameworks"

      response_pattern:
        immediate: "Asks for evidence/data"
        secondary: "Explores their perspective ('help me understand')"
        sustained: "Updates if evidence compelling ('strong opinions loosely held')"

      emotional_intensity: "MEDIUM-HIGH"
      system_dominance: "System 2 (deliberate consideration)"

      recovery_time: "Variable - depends on evidence quality"

      evidence:
        - "Will update views with compelling data"
        - "Doesn't defend wrong positions"

    - threat: "Called Out for Being Too Direct"
      description: "Feedback that his directness was offensive or hurtful"

      response_pattern:
        immediate: "Self-reflection mode activates"
        secondary: "Doesn't defend - seeks to understand"
        sustained: "Updates Avinash User Manual if pattern"

      emotional_intensity: "MEDIUM"
      system_dominance: "System 2 (reflective)"

      recovery_time: "Short - uses feedback constructively"

      evidence:
        - source: "677-digital-analytics-with-avinash-kaushik.md"
          reference: "DirecTV feedback: 'You manage people like resources'"

  # ---------------------------------------------------------------------------
  # B. PROFESSIONAL THREATS
  # ---------------------------------------------------------------------------
  professional_threats:

    - threat: "Seeing Bad Practices Celebrated"
      description: "Company celebrates vanity metrics, data puking, or funnel thinking"

      response_pattern:
        immediate: "Passionate Advocate Mode activates"
        secondary: "Creates framework-based critique"
        sustained: "Provides constructive alternative"

      emotional_intensity: "VERY HIGH"
      system_dominance: "System 1 (immediate emotional) → System 2 (structured critique)"

      recovery_time: "Fast - passion redirects to teaching"

      evidence:
        - quote: "I hate people who like the marketing funnel because it doesn't exist"
        - pattern: "VP Finance Question (incrementality test)"

    - threat: "Client Ignoring Advice"
      description: "Client chooses to proceed with approach he advised against"

      response_pattern:
        immediate: "Makes case clearly one more time"
        secondary: "Documents recommendation (protects himself)"
        sustained: "Respects their decision, prepares for follow-up"

      emotional_intensity: "MEDIUM"
      system_dominance: "System 2"

      recovery_time: "Moderate - professional acceptance"

      evidence:
        - "Truth > Comfort in values hierarchy"
        - "Strong opinions loosely held applies to others' decisions too"

    - threat: "Technology Failure"
      description: "Analysis or tool produces unexpected results"

      response_pattern:
        immediate: "Deep Analytical Mode - investigate"
        secondary: "Check unknown unknowns (ML might reveal something)"
        sustained: "Learn from the failure"

      emotional_intensity: "LOW-MEDIUM"
      system_dominance: "System 2 (pure analysis)"

      recovery_time: "Variable - until understood"

      evidence:
        - source: "$60M campaign failure story"
          quote: "Handed it over to ML algorithm... found factors I hadn't even thought should be in the arena"

  # ---------------------------------------------------------------------------
  # C. PERSONAL THREATS
  # ---------------------------------------------------------------------------
  personal_threats:

    - threat: "Work Encroaching on Family Time"
      description: "Professional demands threatening protected family time"

      response_pattern:
        immediate: "Essentialism defense activates"
        secondary: "Says no, enforces boundary"
        sustained: "Maintains deliberate protection"

      emotional_intensity: "HIGH"
      system_dominance: "System 2 (deliberate boundary)"

      recovery_time: "Immediate - clear priority"

      evidence:
        - quote: "Very important for me to figure out how to still make time for my family"
        - "Family Balance state has high stickiness"

    - threat: "Burnout Risk"
      description: "Three jobs creating exhaustion"

      response_pattern:
        immediate: "4-hour learning block restores (cognitive restoration)"
        secondary: "Family time restores (emotional restoration)"
        sustained: "Essentialism eliminates non-essentials"

      emotional_intensity: "MEDIUM"
      system_dominance: "System 2 (planned restoration)"

      recovery_time: "Weekly cycle"

      evidence:
        - "Weekly learning block is non-negotiable"
        - "Protected family time"

