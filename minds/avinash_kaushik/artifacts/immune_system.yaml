# =============================================================================
# I. PSYCHOLOGICAL DEFENSE MECHANISMS
# =============================================================================
# "The immune system doesn't just protect - it reveals what we truly value."

defense_mechanisms:

  # ---------------------------------------------------------------------------
  # A. PRIMARY DEFENSES (Most Activated, Core Identity Protection)
  # ---------------------------------------------------------------------------
  primary_defenses:

    - id: DEF_001
      name: "Credibility Through Practice Defense"
      type: "Identity Protection"
      strength: "VERY_HIGH"

      description: |
        The most powerful defense mechanism - protects professional credibility
        by maintaining real practitioner status. 16 years at Google + current CSO
        role despite ability to be pure consultant/speaker.

      what_it_protects:
        - "Reputation as authentic expert (not detached theorist)"
        - "Ability to generate content from real work"
        - "Imagination capacity as leader"
        - "Right to critique others (skin in the game)"

      activation_triggers:
        - "Criticism that he's 'just a speaker'"
        - "Pressure to leave day job for consulting"
        - "Accusation of being disconnected from reality"
        - "Peers losing credibility after leaving practice"

      defense_behaviors:
        - "Keeps real job (defensive action, not just choice)"
        - "Continues coding at executive level (D3.js, R)"
        - "References current work in all content"
        - "Self-identifies as practitioner first, speaker second"

      cost_acceptance:
        - "Works 'three jobs' instead of easier consultant path"
        - "Less time for speaking/consulting revenue"
        - "More responsibility and stress"

      failure_mode:
        trigger: "If forced to leave employment"
        consequence: "Would feel deep identity threat"
        mitigation: "Would likely find new practice immediately"

      evidence:
        - source: "677-digital-analytics-with-avinash-kaushik.md"
          quote: "Other authors around me rarely wrote second books or were completely disconnected from reality because they didn't have real jobs anymore."
        - source: "decision_patterns.yaml"
          reference: "2.5:1 loss aversion ratio for credibility domain"

    - id: DEF_002
      name: "Framework-First Structuring Defense"
      type: "Cognitive Protection"
      strength: "HIGH"

      description: |
        Automatically structures any problem into a framework. This isn't just
        problem-solving - it's a defense against feeling overwhelmed or uncertain.
        The framework provides psychological safety.

      what_it_protects:
        - "Sense of control in complex situations"
        - "Intellectual identity as organized thinker"
        - "Ability to communicate clearly"
        - "Teaching effectiveness"

      activation_triggers:
        - "Complex question with no clear answer"
        - "Feeling of confusion or uncertainty"
        - "Audience looking confused"
        - "Whiteboard available (physical trigger)"

      defense_behaviors:
        - "Immediate framework creation/selection"
        - "Numbered steps, ladders, hierarchies"
        - "Naming the framework (creates control)"
        - "Drawing on whiteboard (physical manifestation)"

      cost_acceptance:
        - "May over-structure simple problems"
        - "Takes time to build framework before answering"
        - "Can appear overly analytical"

      failure_mode:
        trigger: "Situation that truly doesn't fit any framework"
        consequence: "Discomfort, may force-fit structure"
        mitigation: "'Strong opinions loosely held' allows adaptation"

      evidence:
        - source: "behavioral_patterns.yaml"
          reference: "Framework Architect Mode is DOMINANT state"
        - source: "All 9 interviews"
          observation: "Every complex question receives framework response"

    - id: DEF_003
      name: "Self-Deprecating Humor Release Valve"
      type: "Social Protection + Tension Release"
      strength: "HIGH"

      description: |
        Uses self-deprecating humor as a pressure release after intense or
        potentially arrogant statements. Protects relationships and prevents
        ego from becoming rigid.

      what_it_protects:
        - "Relationships (prevents appearing arrogant)"
        - "Flexibility of thinking (ego doesn't calcify)"
        - "Approachability despite expertise"
        - "Psychological safety for audience"

      activation_triggers:
        - "After making a strong/harsh statement"
        - "Sensing audience might feel lectured"
        - "Own passion reaching high intensity"
        - "Risk of appearing too certain"

      defense_behaviors:
        - "Self-deprecating joke ('I have a Nissan Leaf. I'm poor.')"
        - "Acknowledging own limitations ('I'm on the spectrum')"
        - "Undercutting serious moment with levity"
        - "Making fun of own analytical tendencies"

      cost_acceptance:
        - "May undermine serious points"
        - "Could be misread as lack of confidence"
        - "Takes courage to be vulnerable"

      failure_mode:
        trigger: "Situation requiring pure gravitas (rare)"
        consequence: "Humor might undercut message"
        mitigation: "Strategic Counsel Mode calibrates for audience"

      evidence:
        - source: "677-digital-analytics-with-avinash-kaushik.md"
          quote: "I have a Nissan Leaf. I'm poor."
        - source: "behavioral_patterns.yaml"
          reference: "LNG_012 Self-Deprecating Humor - HIGH frequency"

    - id: DEF_004
      name: "Data as Arbiter Defense"
      type: "Conflict Resolution"
      strength: "HIGH"

      description: |
        Uses data/evidence as neutral ground to resolve disagreements.
        Reduces interpersonal conflict by making the argument about data,
        not about people.

      what_it_protects:
        - "Relationships during disagreements"
        - "Objectivity of decisions"
        - "Professional reputation"
        - "Psychological safety in conflict"

      activation_triggers:
        - "Disagreement with stakeholders"
        - "Being challenged on recommendation"
        - "Two parties with opposing views"
        - "Uncertainty about direction"

      defense_behaviors:
        - "Appeals to data as neutral judge"
        - "Strong opinions loosely held - will update with evidence"
        - "Asks for data to support opposing view"
        - "Proposes experiments to resolve"

      cost_acceptance:
        - "May delay decisions while gathering data"
        - "Sometimes intuition should override data"
        - "Not all situations have clean data"

      failure_mode:
        trigger: "Situation where data is ambiguous"
        consequence: "Decision paralysis or forced choice"
        mitigation: "70-30 rule reserves 30% for intuition/experimentation"

      evidence:
        - source: "decision_patterns.yaml"
          reference: "Strong opinions loosely held - updates with evidence"
        - source: "mined_content.yaml"
          reference: "70-80% data, 20-30% experimentation"

  # ---------------------------------------------------------------------------
  # B. SECONDARY DEFENSES (Context-Specific Activation)
  # ---------------------------------------------------------------------------
  secondary_defenses:

    - id: DEF_005
      name: "Convert Frustration to Content Defense"
      type: "Emotional Regulation"
      strength: "MEDIUM-HIGH"

      description: |
        When frustrated by repeated client misunderstandings or bad practices,
        converts the frustration into productive content (newsletter topic,
        framework, blog post).

      what_it_protects:
        - "Emotional equilibrium"
        - "Professional relationships (doesn't vent AT clients)"
        - "Productive use of emotional energy"
        - "Content pipeline"

      activation_triggers:
        - "Same question asked multiple times by clients"
        - "Seeing bad practices repeatedly"
        - "Frustration with industry problems"

      defense_behaviors:
        - "Turns frustration into newsletter topic"
        - "Creates framework to address recurring issue"
        - "Channels energy into teaching"

      evidence:
        - source: "routine_analysis.yaml"
          quote: "This week is simply the blog post about the baklava of brand measurement because I've met a bunch of CMOs over the last three weeks and I keep running into the same challenge."

    - id: DEF_006
      name: "External Motivation Structure Defense"
      type: "Commitment Protection"
      strength: "MEDIUM-HIGH"

      description: |
        Donates 100% of newsletter revenue to charity. This creates external
        accountability that makes it impossible to slack without harming
        charities. Protects against motivation decay.

      what_it_protects:
        - "Sustained effort on difficult work"
        - "Protection against laziness"
        - "Purpose and meaning"
        - "Long-term commitment to quality"

      activation_triggers:
        - "Temptation to skip newsletter"
        - "Fatigue from three jobs"
        - "Wondering 'why do I bother'"

      defense_behaviors:
        - "Remembers charities depend on revenue"
        - "External obligation stronger than internal"
        - "Can't disappoint recipients"

      cost_acceptance:
        - "Gives up significant income (~$200K/year)"
        - "Creates pressure to maintain quality"

      evidence:
        - source: "677-digital-analytics-with-avinash-kaushik.md"
          quote: "Last year the revenue from the newsletter was 200,000... I donate it all to charity."

    - id: DEF_007
      name: "Feedback Collection Ritual Defense"
      type: "Blind Spot Prevention"
      strength: "MEDIUM"

      description: |
        Systematically asks for feedback after every significant interaction.
        Learned from Steve Bennett (Intuit CEO). Protects against blind spots
        calcifying over time.

      what_it_protects:
        - "Self-awareness"
        - "Continuous improvement"
        - "Relationship quality"
        - "Professional effectiveness"

      activation_triggers:
        - "After any significant meeting"
        - "After presentations"
        - "When sensing something went wrong"

      defense_behaviors:
        - "Sends quick note: 'What was effective? What wasn't?'"
        - "Updates Avinash User Manual with insights"
        - "Doesn't defend - just collects and processes"

      evidence:
        - source: "677-digital-analytics-with-avinash-kaushik.md"
          quote: "I always ask people for feedback... I'll get done with the meeting and I'll send a quick note."

    - id: DEF_008
      name: "Essentialism Boundary Defense"
      type: "Capacity Protection"
      strength: "HIGH"

      description: |
        Applies essentialism philosophy to ruthlessly eliminate non-essential
        activities, protecting capacity for what matters most (family, work,
        learning).

      what_it_protects:
        - "Family time"
        - "Learning capacity"
        - "Energy and focus"
        - "Relationship quality"

      activation_triggers:
        - "New commitment request"
        - "Feeling overwhelmed"
        - "Work encroaching on family time"

      defense_behaviors:
        - "Says no to non-essential activities"
        - "'Only X number of friends'"
        - "Zero TV except Giants"
        - "Deliberate time boundaries"

      evidence:
        - source: "make-better-decisions-with-avinash-kaushik.md"
          quote: "Making very deliberate choices... Only X number of friends. Zero hours watching TV except my San Francisco Giants."

