          sacrifice: "Productivity, ambition expression, aggressive goal-chasing"
          preservation: "Centeredness, peace, non-reactivity"
          quote: "Calm is your superpower - react less, think more"
          source: "Behavioral analysis, multiple interviews"
          confidence: "HIGH"
      behavioral_signatures:
