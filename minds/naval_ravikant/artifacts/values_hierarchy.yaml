        recurring_cost: "Forgone wealth, status, influence, ambition"
      origin:
        formative_event: "Post-wealth crisis (2015) - made money but wasn't happy"
        influence: "Buddha (equanimity), Seneca (stoicism), Krishnamurti (freedom through peace)"
        crystallization_age: "Age ~45 (2015), shows growth into 2025"

