        physical_response: "Sharp withdrawal, dismissal, refusal to engage"
        verbal_response: "Direct criticism, sarcasm about 'fake gurus'"
        behavioral_response: "Cuts relationship, publicly criticizes, builds counter-example"
      embodiments:
        - person: "Credentialed experts without skin in game"
          reason: "Have authority without accountability"
        - person: "Gurus claiming certainty (vs. admitting unknowns)"
          reason: "Intellectual dishonesty for authority"
        - archetype: "The Confident Fool"
          reason: "High confidence with low competence, endangers others"
      cost:
        opportunities_lost: ["Lucrative consulting positions", "Guru-status income"]

