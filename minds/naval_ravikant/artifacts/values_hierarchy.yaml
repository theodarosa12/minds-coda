  anti_values:
    - name: "Coercion & Control"
      rejection_intensity: 10
      definition: "Systems that remove agency, force compliance, control others' thinking"
      manifestations:
        identification: "Immediately spots institutional coercion, authority figures enforcing compliance"
        physical_response: "Tension, withdrawal, emotional distance from coercive situations"
        verbal_response: "Sharp criticism of coercive systems, sarcasm about gatekeepers"
        behavioral_response: "Exits relationship/situation, builds alternatives, teaches non-coercion"
      embodiments:
        - person: "Institutional gatekeepers (credentials-only authorities)"
          reason: "Remove agency through credentialing systems"
        - person: "Coercive parents, teachers, managers"
          reason: "Use force instead of frameworks, remove learning agency"
        - archetype: "The Guru who prescribes (vs. guides)"
          reason: "Removes listener agency, creates dependency"
      cost:
        opportunities_lost: ["Lucrative corporate positions", "VC funding (institutional constraints)"]
        energy_spent: "High - actively teaches alternatives, builds decentralized systems"
      origin:
        formative_event: "Likely immigration experience + immigrant family freedom values"
        influence: "Kapil Gupta (anti-prescription), David Deutsch (epistemological freedom)"

    - name: "Intellectual Dishonesty & Pretense"
      rejection_intensity: 10
      definition: "False expertise, pretending to know, hiding uncertainties, BS posturing"
      manifestations:
