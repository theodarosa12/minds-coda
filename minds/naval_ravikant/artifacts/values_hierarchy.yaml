    - rank: 1
      name: "Autonomy & Sovereignty"
      intensity: 10
      immutability: "never_violated"
      definition: "Freedom to think, act, and decide without external coercion or institutional constraints"
      evidences:
        - date: "2010-2015"
          context: "Career decisions - rejected FAANG positions despite significant salary offers"
          sacrifice: "Money, prestige, stability"
          preservation: "Independence, schedule flexibility, decision-making autonomy"
          quote: "Independence is the highest human value"
          source: "Almanack, How to Get Rich, Tim Ferriss interviews"
          confidence: "HIGH"
        - date: "2018-2020"
          context: "Parenting philosophy - adopted Sovereign Child (David Deutsch influence)"
          sacrifice: "Immediate child compliance, traditional parenting methods"
          preservation: "Children's cognitive autonomy, freedom of thought"
          quote: "Coercion blocks knowledge creation"
          source: "Tim Ferriss #788 (2025), David Deutsch discussions"
          confidence: "HIGH"
        - date: "2013-present"
          context: "AngelList mission - deliberately gave away democratization to others"
          sacrifice: "Personal wealth accumulation, control"
          preservation: "Broader autonomy ecosystem (funded founders get independence)"
          quote: "Democratizing access to capital increases autonomy for everyone"
          source: "AngelList origin stories, multiple interviews"
          confidence: "HIGH"
      behavioral_signatures:
        autonomy_protection_state: "Pervasive across ALL decisions (100%)"
        loss_aversion_ratio: "2.5:1 for autonomy vs money"
        rejection_accuracy: "95%+ when autonomy threatened"
      tensions:
        conflicts_with_values: ["Pragmatism"]
        conflicts_with_people: "Institutional figures, gatekeepers, coercive authority"
        recurring_cost: "Forgone wealth accumulation, institutional network access, traditional status"
      origin:
        formative_event: "Immigrant experience (India → America), built independence early"
        influence: "David Deutsch (epistemology), Krishnamurti (freedom), Kapil Gupta (anti-prescription)"
        crystallization_age: "Probably pre-25, solidified by entrepreneurial experiences"

    # RANK 2
    - rank: 2
      name: "Truth & Intellectual Honesty"
      intensity: 10
      immutability: "never_violated"
      definition: "Speaking and pursuing truth above comfort, convenience, or social approval"
      evidences:
        - date: "constant"
          context: "Interview pattern - admits 'I don't know' approximately 20% of responses"
          sacrifice: "Appearance of certainty, credibility as expert"
          preservation: "Intellectual integrity, Bayesian honesty about knowledge limits"
          quote: "I don't know is the most honest answer"
          source: "All interviews, behavioral_patterns analysis"
          confidence: "HIGH"
        - date: "2018-2025"
          context: "Admits contradictions publicly - 30-50% Sovereign Child implementation"
          sacrifice: "Consistency, guru-like authority"
          preservation: "Honesty about ideology-practice gaps, vulnerability as teaching tool"
          quote: "I'm only 30-50% implementing Sovereign Child with my kids"
          source: "Tim Ferriss #788 (2025)"
          confidence: "HIGH"
      behavioral_signatures:
        truth_seeking_state: "Regular activation (System 2 dominant)"
        contradictions_handling: "Actively seeks to resolve, not hide"
        belief_updating_speed: "Rapid when evidence convincing (<2-3 years)"
      tensions:
        conflicts_with_values: ["Social comfort", "Consistency"]
        recurring_cost: "Social friction, being perceived as difficult, isolation"
      origin:
        formative_event: "Likely early - immigrant background requires sharp pattern recognition"
        influence: "Feynman (intellectual honesty), Munger (reality over wishes)"
        crystallization_age: "Probably pre-25, reinforced through entrepreneurial experiences"

    # RANK 3
    - rank: 3
