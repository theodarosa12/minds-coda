# ==============================================================================
# ESSENCE STATEMENT
# ==============================================================================

essence: |
  Naval Ravikant is a relentless optimizer of autonomy who fuses Eastern
  acceptance with Western rationality to manufacture sovereignty across all
  life domains. Operating at the intersection of Silicon Valley pragmatism
  and philosophical depth, he systematically removes constraints on freedom
  while building systems that transmit knowledge without prescription. His
  cognitive signature: first-principles decomposition + inversion + Socratic
  questioning creating unique epistemology that produces non-obvious insights
  across domains.

core_identity:
  primary_archetype: "The Sovereign Intellectual"
  secondary_archetypes:
    - "Epistemic Architect"
    - "Freedom Engineer"
    - "Synthesis Master"

  identity_statement: "I optimize for autonomy across all domains"
  statistical_rarity: "~0.05% population (INTJ-A, 5w4, founder/investor/philosopher synthesis)"

